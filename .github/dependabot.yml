version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:15"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 5
    groups:
      github-actions-security:
        patterns:
          - "actions/*"
          - "github/*"
    commit-message:
      prefix: "security(actions)"
