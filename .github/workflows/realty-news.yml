name: "The Holding Realty · Bounded News Feed"

on:
  pull_request:
    branches: [main]
    paths:
      - 'realty/news/**'
      - 'scripts/update-realty-news.py'
      - '.github/workflows/realty-news.yml'
  schedule:
    - cron: '23 8 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: realty-news-main
  cancel-in-progress: false

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout PR head
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Validate Realty news contract
        run: python3 scripts/update-realty-news.py --validate

  refresh:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout canonical main
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: main
          fetch-depth: 0

      - name: Refresh bounded Realty feed
        env:
          FORCE_REFRESH: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
        run: python3 scripts/update-realty-news.py

      - name: Commit only material news changes
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- realty/news/data.json realty/news/index.html; then
            echo 'No Realty news change.'
            exit 0
          fi
          git config user.name "The Holding Realty News"
          git config user.email "realty-news@theholding.ai"
          git add realty/news/data.json realty/news/index.html
          git commit -m "realty news: refresh bounded market signals"
          git push origin HEAD:main
