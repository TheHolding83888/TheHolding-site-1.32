name: "Ask candidate · Owner Coverage Semantics Fix"

on:
  push:
    branches:
      - agents/ask-owner-synthesis-v0.7-20260815
    paths:
      - '.github/workflows/_ask_owner_coverage_semantics_fix.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout candidate
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: agents/ask-owner-synthesis-v0.7-20260815
          fetch-depth: 0
      - name: Fix coverage fraction semantics and self-clean
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('agents/console/app.js')
          s=p.read_text()
          start=s.index('  async function ownerEvidenceSynthesis(raw, lang) {')
          end=s.index('  async function routeQuestion(raw) {', start)
          before=s[:start]
          block=s[start:end]
          after=s[end:]
          anchor="    const partial = (text, source) => ({ text, source, confidenceHint: 'partial' });"
          helper=anchor+"\n    const coveragePct = value => finite(value) === null ? null : (Number(value) <= 1 ? Number(value) * 100 : Number(value));"
          if 'const coveragePct' not in block:
              if anchor not in block: raise SystemExit('owner synthesis partial anchor missing')
              block=block.replace(anchor,helper,1)
          block=block.replace('best.coverage.toFixed(1)', 'coveragePct(best.coverage).toFixed(1)')
          block=block.replace('worst.coverage < 99.999', 'coveragePct(worst.coverage) < 99.999')
          block=block.replace('worst.coverage.toFixed(1)', 'coveragePct(worst.coverage).toFixed(1)')
          if 'best.coverage.toFixed(1)' in block: raise SystemExit('raw best coverage display remains')
          if 'worst.coverage.toFixed(1)' in block: raise SystemExit('raw worst coverage display remains')
          if 'worst.coverage < 99.999' in block: raise SystemExit('raw coverage threshold remains')
          if block.count('coveragePct(best.coverage)') != 2: raise SystemExit('expected two normalized best displays')
          if block.count('coveragePct(worst.coverage)') != 3: raise SystemExit('expected threshold plus two normalized worst displays')
          p.write_text(before+block+after)
          PY
          node --check agents/console/app.js
          rm -f .github/workflows/_ask_owner_coverage_semantics_fix.yml
          git config user.name "The Holding Production Integrator"
          git config user.email "production-integrator@theholding.ai"
          git add -A
          git diff --check --cached
          git commit -m "Ask v0.7: fix Productivity coverage fraction semantics"
          git push origin HEAD:agents/ask-owner-synthesis-v0.7-20260815
