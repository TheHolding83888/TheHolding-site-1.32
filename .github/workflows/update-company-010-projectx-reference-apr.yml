# holding-workflow-definition-proof: intelligence/reliability/company-010-state-workflow-definition-proof.mjs
name: "Update Company #010 · Project X Reference APR"

on:
  workflow_dispatch:
  schedule:
    - cron: '7 5 * * *'
  workflow_run:
    workflows:
      - "Update Company #010 · Cypher Production State"
    types: [completed]
  push:
    branches: [main]
    paths:
      - 'onboarding/company-010-projectx-reference-apr.mjs'
      - '.github/workflows/update-company-010-projectx-reference-apr.yml'

permissions:
  contents: read

concurrency:
  group: company-010-projectx-reference-apr
  cancel-in-progress: false

jobs:
  diagnose:
    if: >-
      ${{
        github.event_name != 'workflow_run' ||
        (github.event.workflow_run.conclusion == 'success' &&
         github.event.workflow_run.head_branch == 'main')
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout current main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'

      - name: Replay Project X observed fee Reference APR ephemerally
        run: |
          set -euo pipefail
          node --check onboarding/company-010-projectx-reference-apr.mjs
          node onboarding/company-010-projectx-reference-apr.mjs
          node - <<'NODE'
          const fs=require('fs');
          const s=JSON.parse(fs.readFileSync('companies/company-010-production-state.json','utf8'));
          const h=JSON.parse(fs.readFileSync('companies/company-010-projectx-rate-history.json','utf8'));
          const px=s.strategies?.projectX;
          const prod=(s.productivity?.positions||[]).find(x=>x.id==='projectx-whype-usdc');
          if(h.version!=='0.1-projectx-rate-history'||h.authority?.executionAuthority!=='none')throw new Error('Project X rate history contract missing');
          if(!Array.isArray(h.observations)||!h.observations.length)throw new Error('Project X rate observation not recorded');
          if(px?.yield?.status==='measured'){
            if(!(Number(px.yield.referenceAprPct)>=0)||prod?.status!=='measured'||Number(prod.referenceAprPct)!==Number(px.yield.referenceAprPct))throw new Error('Project X measured APR promotion mismatch');
          }else{
            if(px?.yield?.status!=='warming'||px?.yield?.referenceAprPct!==null||prod?.status!=='warming'||prod?.referenceAprPct!==null)throw new Error('Project X Pending boundary mismatch');
          }
          if(s.epistemicBoundary?.projectXFeeTierIsNotApr!==true||s.epistemicBoundary?.projectXReferenceAprUsesObservedFeeGrowth!==true||s.authority?.executionAuthority!=='none')throw new Error('Project X APR epistemic/authority boundary missing');
          console.log('Project X Reference APR diagnostic PASS',{status:px.yield.status,referenceAprPct:px.yield.referenceAprPct,windowHours:px.yield.windowHours,observations:h.observations.length,repositoryMutationAuthority:false,executionAuthority:'none'});
          NODE
          git diff --check

      - name: Prove diagnostic cannot publish canonical state
        run: |
          set -euo pipefail
          changed="$(git status --short)"
          echo "$changed"
          if git diff --quiet -- companies/company-010-production-state.json companies/company-010-projectx-rate-history.json; then
            echo 'Project X diagnostic produced no local delta.'
          else
            echo 'Project X diagnostic produced an ephemeral local replay only; canonical publication belongs to Company #010 state writer.'
          fi
          git checkout -- companies/company-010-production-state.json companies/company-010-projectx-rate-history.json
          test -z "$(git status --porcelain)"
