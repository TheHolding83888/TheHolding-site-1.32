name: "Ask candidate · Change Salience v0.8"

on:
  push:
    branches: [agents/ask-change-salience-v0.8-20260815]
    paths:
      - '.github/workflows/_ask_change_salience_v08_candidate.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout candidate
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: agents/ask-change-salience-v0.8-20260815
          fetch-depth: 0

      - name: Apply bounded Change + Salience primitive
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "The Holding Production Integrator"
          git config user.email "production-integrator@theholding.ai"

          node <<'NODE'
          const fs = require('fs');
          const p = 'verification/ask-experience/patch-change-salience-v0.8.mjs';
          let t = fs.readFileSync(p, 'utf8');
          t = t.replace('const helper = `', 'const helper = String.raw`');
          t = t.replace('  }`;\nreplaceOnce(helperAnchor', '  }`.replaceAll(String.raw`\\\\n`, String.raw`\\n`);\nreplaceOnce(helperAnchor');
          fs.writeFileSync(p, t, 'utf8');
          NODE

          node verification/ask-experience/patch-change-salience-v0.8.mjs
          node --check agents/console/app.js

          grep -F "changeIntelligence: '/intelligence/change-intelligence.json'" agents/console/app.js >/dev/null
          grep -F "function latestChangeSalienceAnswer" agents/console/app.js >/dev/null
          grep -F "Memory Vault history" agents/console/app.js >/dev/null

          rm -f verification/ask-experience/patch-change-salience-v0.8.mjs
          rm -f .github/workflows/_ask_change_salience_v08_candidate.yml

          git add -A
          git diff --check --cached
          expected=$'.github/workflows/_ask_change_salience_v08_candidate.yml\nagents/console/app.js\nverification/ask-experience/patch-change-salience-v0.8.mjs'
          actual="$(git diff --cached --name-only | sort)"
          test "$actual" = "$expected"

          git commit -m "Ask v0.8: add bounded change and salience synthesis"
          git push origin HEAD:agents/ask-change-salience-v0.8-20260815
