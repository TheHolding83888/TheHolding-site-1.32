name: "Validate Market Data Cadence Separation"

on:
  pull_request:
    paths:
      - 'intelligence/market-data/market-data-engine.mjs'
      - 'intelligence/market-data/coingecko-fetch-shim.mjs'
      - '.github/workflows/market-data-refresh.yml'
      - '.github/workflows/market-data-coingecko-daily.yml'
      - '.github/workflows/update-productivity.yml'
      - '.github/workflows/update-capital-state.yml'
      - '.github/workflows/update-project-memory-bootstrap.yml'
      - '.github/workflows/security-sentinel.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Validate engine syntax and workflow contracts
        run: |
          set -euo pipefail
          node --check intelligence/market-data/market-data-engine.mjs
          node --check intelligence/market-data/coingecko-fetch-shim.mjs
          node - <<'NODE'
          const fs=require('fs');
          const heartbeat=fs.readFileSync('.github/workflows/market-data-refresh.yml','utf8');
          const daily=fs.readFileSync('.github/workflows/market-data-coingecko-daily.yml','utf8');
          const productivity=fs.readFileSync('.github/workflows/update-productivity.yml','utf8');
          const capital=fs.readFileSync('.github/workflows/update-capital-state.yml','utf8');
          const shim=fs.readFileSync('intelligence/market-data/coingecko-fetch-shim.mjs','utf8');
          const engine=fs.readFileSync('intelligence/market-data/market-data-engine.mjs','utf8');
          const memory=fs.readFileSync('.github/workflows/update-project-memory-bootstrap.yml','utf8');
          const security=fs.readFileSync('.github/workflows/security-sentinel.yml','utf8');
          if(!heartbeat.includes("cron: '7,37 * * * *'"))throw new Error('Onchain heartbeat must remain every 30 minutes');
          if(!daily.includes("cron: '12 3 * * *'"))throw new Error('CoinGecko baseline must remain once daily');
          if(!heartbeat.includes('group: shared-market-data-refresh')||!daily.includes('group: shared-market-data-refresh'))throw new Error('Market Data writers must share concurrency group');
          if(!daily.includes("MARKET_DATA_DAILY_REFRESH: 'true'"))throw new Error('Daily CoinGecko explicit gate missing');
          if(!heartbeat.includes("MARKET_DATA_DAILY_REFRESH: 'false'"))throw new Error('Heartbeat must explicitly disable CoinGecko external refresh');
          if(daily.includes('node intelligence/market-data/onchain-price-resolver.mjs'))throw new Error('Daily CoinGecko workflow must not perform onchain RPC observation');
          if(!daily.includes('production authority is not onchain-primary'))throw new Error('Daily workflow must prove all canonical assets remain onchain-primary');
          if(!heartbeat.includes("MARKET_DATA_FORCE_COINGECKO_FAILBACK: 'false'"))throw new Error('Heartbeat must preserve per-asset rather than cycle-wide failback');
          if(!engine.includes('if (!dailyRefresh)'))throw new Error('Engine daily-only hard gate missing');
          if(!engine.includes('nonDailyExternalFetchForbidden: true'))throw new Error('Engine strict non-daily semantics missing');
          if(!engine.includes('30 * 60 * 60 * 1000'))throw new Error('30-hour prior daily snapshot retention missing');

          // Manual recovery paths are consumers only. They may reuse the legacy
          // simple-price call shape through the local shim, but may neither run
          // the Market Data writer nor stage canonical market-data.json.
          for(const [name,wf] of [['Productivity recovery',productivity],['Capital recovery',capital]]){
            if(wf.includes('node intelligence/market-data/market-data-engine.mjs'))throw new Error(`${name} must not execute Market Data writer`);
            if(/git add[\s\\\n\r\t\w./-]*intelligence\/market-data\/market-data\.json/.test(wf))throw new Error(`${name} must not stage canonical market-data.json`);
            if(!wf.includes('perAssetAuthoritySelectionApplied')||!wf.includes('onchainSelectedAssetCount'))throw new Error(`${name} canonical Market Data admission guard missing`);
          }
          if(productivity.includes('COINGECKO_API_KEY:')||capital.includes('COINGECKO_API_KEY:'))throw new Error('Recovery workflows must not receive CoinGecko credentials');
          if(!productivity.includes('coingecko-fetch-shim.mjs')||!capital.includes('coingecko-fetch-shim.mjs'))throw new Error('Recovery workflows must bind legacy price calls through local canonical shim');
          if(!shim.includes("const SNAPSHOT = path.join(__dirname, 'market-data.json')"))throw new Error('Compatibility shim must consume canonical market-data.json');
          if(shim.includes("const SNAPSHOT = path.join(__dirname, 'market-data-coingecko.json')"))throw new Error('Compatibility shim must not consume daily CoinGecko source lane');
          if(!shim.includes("'x-the-holding-external-request': '0'"))throw new Error('Compatibility shim zero-external-request proof missing');

          const generated=[
            'intelligence/market-data/market-data-coingecko.json',
            'intelligence/market-data/market-data.json',
            'intelligence/market-data/onchain-price-shadow.json',
            'intelligence/market-data/public-capital-state.json'
          ];
          for(const file of generated){
            const token=`- '${file}'`;
            if(!memory.includes(token))throw new Error(`Project Memory must ignore generated heartbeat file: ${file}`);
            if(!security.includes(token))throw new Error(`Security Sentinel must ignore generated heartbeat file: ${file}`);
          }
          const protectedSourceTokens=[
            'intelligence/market-data/market-data-engine.mjs',
            'intelligence/market-data/market-data-authority-policy.json',
            'intelligence/market-data/onchain-price-source-registry.json',
            '.github/workflows/market-data-refresh.yml'
          ];
          for(const token of protectedSourceTokens){
            if(memory.includes(`- '${token}'`)||security.includes(`- '${token}'`))throw new Error(`Source/policy surface must not be ignored by push-triggered controls: ${token}`);
          }
          if(!memory.includes("cron: '17 * * * *'"))throw new Error('Project Memory hourly backstop missing');
          if(!security.includes("cron: '47 6 * * *'"))throw new Error('Security daily backstop missing');
          console.log('Static cadence + writer ownership + generated-noise hygiene contract PASS');
          NODE

      - name: Prove scheduled push and manual paths perform zero CoinGecko requests
        run: |
          set -euo pipefail
          before=$(sha256sum intelligence/market-data/market-data-coingecko.json | awk '{print $1}')
          for event in schedule push workflow_dispatch; do
            rm -f /tmp/coingecko-fetch-called
            EVENT="$event" node --input-type=module -e "import fs from 'node:fs'; globalThis.fetch=async()=>{fs.writeFileSync('/tmp/coingecko-fetch-called','1'); throw new Error('CoinGecko fetch forbidden on non-daily path');}; process.env.GITHUB_EVENT_NAME=process.env.EVENT; process.env.MARKET_DATA_DAILY_REFRESH='false'; await import('./intelligence/market-data/market-data-engine.mjs?nonDaily='+process.env.EVENT+'-'+Date.now());"
            test ! -e /tmp/coingecko-fetch-called
            after=$(sha256sum intelligence/market-data/market-data-coingecko.json | awk '{print $1}')
            test "$before" = "$after"
          done
          git checkout -- intelligence/market-data/market-data.json intelligence/market-data/market-data-coingecko.json
          echo 'All non-daily Market Data engine paths zero-request reuse PASS'

      - name: Prove compatibility shim uses local canonical snapshot only
        run: |
          set -euo pipefail
          node intelligence/market-data/market-data-validation-fixture.mjs
          node --import=./intelligence/market-data/coingecko-fetch-shim.mjs --input-type=module - <<'NODE'
          const before=globalThis.fetch;
          const r=await fetch('https://api.coingecko.com/api/v3/simple/price?ids=bitcoin,internet-computer&vs_currencies=usd');
          if(!r.ok)throw new Error('canonical compatibility response unavailable');
          if(r.headers.get('x-the-holding-external-request')!=='0')throw new Error('compatibility shim external request marker drift');
          const j=await r.json();
          if(!(Number(j.bitcoin?.usd)>0)||!(Number(j['internet-computer']?.usd)>0))throw new Error('compatibility shim canonical values missing');
          console.log('Local canonical compatibility shim PASS',j);
          NODE
          git checkout -- intelligence/market-data/market-data.json intelligence/market-data/market-data-coingecko.json

      - name: Prove daily gate performs exactly one batch request for all canonical assets
        run: |
          set -euo pipefail
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const registry=JSON.parse(fs.readFileSync('intelligence/market-data/market-price-registry.json','utf8'));
          if(registry.assets.length!==26)throw new Error(`Expected 26 canonical assets, got ${registry.assets.length}`);
          let fetchCount=0;
          globalThis.fetch=async()=>{
            fetchCount+=1;
            const payload={};
            for(const asset of registry.assets){payload[asset.providerId]={usd:1};}
            return {ok:true,status:200,json:async()=>payload};
          };
          process.env.GITHUB_EVENT_NAME='schedule';
          process.env.MARKET_DATA_DAILY_REFRESH='true';
          await import(`./intelligence/market-data/market-data-engine.mjs?daily=${Date.now()}`);
          if(fetchCount!==1)throw new Error(`Daily gate expected exactly one batch request, got ${fetchCount}`);
          const source=JSON.parse(fs.readFileSync('intelligence/market-data/market-data-coingecko.json','utf8'));
          if(source.version!=='0.5-market-data-strict-daily-coingecko-cadence')throw new Error('Strict daily cadence version not materialized');
          if(source.semantics?.externalFetchAllowedOnlyWhenDailyRefreshTrue!==true)throw new Error('Daily-only external gate semantics missing');
          if(source.semantics?.nonDailyExternalFetchForbidden!==true)throw new Error('Non-daily prohibition semantics missing');
          if(Number(source.semantics?.staleFallbackMaxAgeHours)!==30)throw new Error('30-hour daily fallback retention missing');
          if(source.coverage?.freshCount!==registry.assets.length)throw new Error('Stub daily refresh did not cover full registry');
          console.log('Daily one-batch 26-asset sanity baseline PASS',{fetchCount,assetCount:registry.assets.length});
          NODE
          git checkout -- intelligence/market-data/market-data.json intelligence/market-data/market-data-coingecko.json
          git diff --check
