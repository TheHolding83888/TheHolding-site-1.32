name: Verify Company Monthly Reports

on:
  pull_request:
    paths:
      - 'reporting/company-monthly-reports.mjs'
      - 'reporting/company-monthly-reports-validation.mjs'
      - 'reporting/company-monthly-earned-income.mjs'
      - 'reporting/company-monthly-earned-income-validation.mjs'
      - 'reporting/accounting-coverage.mjs'
      - 'reporting/accounting-coverage-validation.mjs'
      - 'companies/company-monthly-report-adapter.js'
      - '.github/workflows/update-company-monthly-reports.yml'
      - '.github/workflows/verify-company-monthly-reports.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: Static validation
        shell: bash
        run: |
          set -euo pipefail
          node --check reporting/company-monthly-reports.mjs
          node --check reporting/company-monthly-reports-validation.mjs
          node --check reporting/company-monthly-earned-income.mjs
          node --check reporting/company-monthly-earned-income-validation.mjs
          node --check reporting/accounting-coverage.mjs
          node --check reporting/accounting-coverage-validation.mjs
          node --check companies/company-monthly-report-adapter.js
          git diff --check

      - name: Exercise exact monthly accounting candidate
        shell: bash
        run: |
          set -euo pipefail
          PRODUCTIVITY_DATA_FILE=./companies/productivity-data.json \
          REPORTING_DATA_FILE=./reporting/reporting-data.json \
          INCOME_LEDGER_FILE=./reporting/income-ledger.json \
          MEMORY_VAULT_DIR=./intelligence/memory-vault \
          COMPANY_MONTHLY_REPORTS_FILE=/tmp/company-monthly-reports.json \
          node reporting/company-monthly-reports.mjs

          PRODUCTIVITY_DATA_FILE=./companies/productivity-data.json \
          REPORTING_DATA_FILE=./reporting/reporting-data.json \
          INCOME_LEDGER_FILE=./reporting/income-ledger.json \
          COMPANY_MONTHLY_REPORTS_FILE=/tmp/company-monthly-reports.json \
          node reporting/company-monthly-reports-validation.mjs

          COMPANY_MONTHLY_REPORTS_FILE=/tmp/company-monthly-reports.json \
          INCOME_LEDGER_FILE=./reporting/income-ledger.json \
          REPORTING_DATA_FILE=./reporting/reporting-data.json \
          node reporting/company-monthly-earned-income.mjs

          COMPANY_MONTHLY_REPORTS_FILE=/tmp/company-monthly-reports.json \
          INCOME_LEDGER_FILE=./reporting/income-ledger.json \
          node reporting/company-monthly-earned-income-validation.mjs

          node - <<'NODE'
          const fs=require('fs');
          const r=JSON.parse(fs.readFileSync('/tmp/company-monthly-reports.json','utf8'));
          for(const [name,c] of Object.entries(r.companies||{})){
            const latest=Object.values(c.months||{}).sort((a,b)=>String(a.month).localeCompare(String(b.month))).at(-1);
            console.log(name,{
              month:latest?.month,
              earnedIncomeUsd:latest?.generatedIncomeUsd,
              observedEarnedIncomeUsd:latest?.observedEarnedIncomeUsd,
              accountingStatus:latest?.accountingStatus,
              coverageComplete:latest?.accountingCoverageComplete,
              referenceAnalyticsUsd:latest?.referenceAnalytics?.generatedIncomeUsd,
              averageCapitalUsd:latest?.averageCapitalUsd
            });
          }
          NODE

      - name: Exercise diagnostic mechanism coverage registry
        shell: bash
        run: |
          set -euo pipefail
          PRODUCTIVITY_DATA_FILE=./companies/productivity-data.json \
          INCOME_LEDGER_FILE=./reporting/income-ledger.json \
          EMBEDDED_YIELD_LEDGER_FILE=./companies/embedded-yield-ledger.json \
          COMPANY_MONTHLY_REPORTS_FILE=/tmp/company-monthly-reports.json \
          ACCOUNTING_COVERAGE_FILE=/tmp/accounting-coverage.json \
          node reporting/accounting-coverage.mjs

          ACCOUNTING_COVERAGE_FILE=/tmp/accounting-coverage.json \
          node reporting/accounting-coverage-validation.mjs

          node - <<'NODE'
          const fs=require('fs');
          const x=JSON.parse(fs.readFileSync('/tmp/accounting-coverage.json','utf8'));
          for(const [name,c] of Object.entries(x.companies||{})){
            const latest=Object.keys(c.months||{}).sort().at(-1);
            const row=c.months?.[latest];
            console.log(name,{
              registry:c.registry,
              mechanismCount:c.mechanismCount,
              latestMonth:latest,
              factualMechanisms:row?.mechanismsWithFactualPeriodEvidence,
              missingMechanisms:row?.mechanismsWithoutFactualPeriodEvidence,
              readyToClose:row?.registryReadyToCloseMonth
            });
          }
          NODE

      - name: Guard authority and accounting boundaries
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs');
          const files=['reporting/company-monthly-reports.mjs','reporting/company-monthly-earned-income.mjs','reporting/accounting-coverage.mjs','companies/company-monthly-report-adapter.js'];
          const text=files.map(f=>fs.readFileSync(f,'utf8')).join('\n');
          for(const bad of ['api.coingecko.com','COINGECKO_API_KEY','new Wallet(','sendTransaction(','executionAuthority: write']){
            if(text.includes(bad)) throw new Error('unexpected monthly reporting authority/data discovery: '+bad);
          }
          const accounting=fs.readFileSync('reporting/company-monthly-earned-income.mjs','utf8');
          for(const required of ['referenceIncomeIsPrimaryMetric: false','currentRewardBalanceIsPeriodIncome: false','incompleteCoverageMayMasqueradeAsCompleteIncome: false']){
            if(!accounting.includes(required)) throw new Error('accounting fail-closed invariant missing: '+required);
          }
          const coverage=JSON.parse(fs.readFileSync('/tmp/accounting-coverage.json','utf8'));
          if(coverage.status!=='diagnostic-no-completion-authority'||coverage.authority?.monthClosingAuthority!==false) throw new Error('Accounting coverage registry gained completion authority');
          console.log('Company Monthly Reports + Accounting Coverage authority boundary PASS');
          NODE
