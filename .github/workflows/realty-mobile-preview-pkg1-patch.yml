name: Realty mobile preview package 1 patch

on:
  push:
    branches:
      - feat/realty-mobile-preview-pkg1-20260831

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch exact mobile preview consumers
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('realty/index.html')
          s = p.read_text(encoding='utf-8')
          replacements = {
              '/realty/assets/demo/v35/mobile-digital.avif?v=20260831recover1': '/realty/assets/mobile-preview/real-world.dd91ff74.avif',
              '/realty/assets/demo/v35/mobile-physical.avif?v=20260831recover1': '/realty/assets/mobile-preview/metaverse.688ec687.avif',
          }
          changed = False
          for old, new in replacements.items():
              count = s.count(old)
              if count == 1:
                  s = s.replace(old, new)
                  changed = True
              elif count == 0 and new in s:
                  pass
              else:
                  raise SystemExit(f'Unexpected consumer count for {old}: {count}')
          if changed:
              p.write_text(s, encoding='utf-8')
          PY
      - name: Commit exact consumer update
        shell: bash
        run: |
          if git diff --quiet -- realty/index.html; then
            echo 'Consumer already patched.'
            exit 0
          fi
          git config user.name 'The Holding Realty Asset Patch'
          git config user.email 'realty-assets@theholding.ai'
          git add realty/index.html
          git commit -m 'Realty: point mobile preview to owner images'
          git push origin HEAD:${GITHUB_REF_NAME}
