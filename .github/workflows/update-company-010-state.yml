# holding-workflow-definition-proof: intelligence/reliability/company-010-state-workflow-definition-proof.mjs
name: "Update Company #010 · Cypher Production State"

on:
  workflow_dispatch:
  schedule:
    - cron: '47 4 * * *'
  push:
    branches: [main]
    paths:
      - 'onboarding/company-010-discovery.mjs'
      - 'onboarding/company-010-resolve.mjs'
      - 'onboarding/company-010-deep-resolve.mjs'
      - 'onboarding/company-010-closure.mjs'
      - 'onboarding/company-010-closure-review.mjs'
      - 'onboarding/company-010-gmx-reader.mjs'
      - 'onboarding/company-010-gmx-strategy-overlay.mjs'
      - 'onboarding/company-010-projectx-strategy-overlay.mjs'
      - 'onboarding/company-010-reconciliation.mjs'
      - 'onboarding/company-010-stakedao-intelligence.mjs'
      - 'onboarding/company-010-production-baseline.mjs'
      - 'onboarding/company-010-production-state.mjs'
      - 'onboarding/company-010-stakedao-overlay.mjs'
      - 'onboarding/company-010-crv-strategy-overlay.mjs'
      - 'onboarding/company-010-convex-cvxcrv-rate-overlay.mjs'
      - '.github/workflows/update-company-010-state.yml'

permissions:
  contents: write

concurrency:
  group: company-010-production-state
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Validate source syntax
        run: |
          set -euo pipefail
          node --check onboarding/company-010-discovery.mjs
          node --check onboarding/company-010-resolve.mjs
          node --check onboarding/company-010-deep-resolve.mjs
          node --check onboarding/company-010-closure.mjs
          node --check onboarding/company-010-closure-review.mjs
          node --check onboarding/company-010-gmx-reader.mjs
          node --check onboarding/company-010-gmx-strategy-overlay.mjs
          node --check onboarding/company-010-projectx-strategy-overlay.mjs
          node --check onboarding/company-010-reconciliation.mjs
          node --check onboarding/company-010-stakedao-intelligence.mjs
          node --check onboarding/company-010-production-baseline.mjs
          node --check onboarding/company-010-production-state.mjs
          node --check onboarding/company-010-stakedao-overlay.mjs
          node --check onboarding/company-010-crv-strategy-overlay.mjs
          node --check onboarding/company-010-convex-cvxcrv-rate-overlay.mjs
      - name: Install bounded dependencies
        run: npm install --no-save ethers@6 @aave-dao/aave-address-book
      - name: Collect reviewed Company #010 state
        env:
          ETH_RPC_URL: ${{ secrets.ETH_RPC_URL }}
          ETH_RPC_URL_2: ${{ secrets.ETH_RPC_URL_2 }}
          BASE_RPC_URL: ${{ secrets.BASE_RPC_URL }}
          BASE_RPC_URL_2: ${{ secrets.BASE_RPC_URL_2 }}
          ARBITRUM_RPC_URL: ${{ secrets.ARBITRUM_RPC_URL }}
          OPTIMISM_RPC_URL: ${{ secrets.OPTIMISM_RPC_URL }}
          POLYGON_RPC_URL: ${{ secrets.POLYGON_RPC_URL }}
          HYPEREVM_RPC_URL: ${{ secrets.HYPEREVM_RPC_URL }}
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
        run: |
          set -euo pipefail
          node onboarding/company-010-discovery.mjs
          node onboarding/company-010-resolve.mjs
          node onboarding/company-010-deep-resolve.mjs
          node onboarding/company-010-closure.mjs
          node onboarding/company-010-closure-review.mjs
          node onboarding/company-010-gmx-reader.mjs
          node onboarding/company-010-reconciliation.mjs
          node onboarding/company-010-stakedao-intelligence.mjs
          node onboarding/company-010-production-baseline.mjs
          node onboarding/company-010-stakedao-overlay.mjs
          node - <<'NODE'
          const fs=require('fs');
          const r=JSON.parse(fs.readFileSync('companies/company-010-resolve.json','utf8'));
          const c=r.exactProbes?.concentrator;
          if(r.version!=='0.2-company-010-new-mechanism-measured-stakedao-asdcrv'||!c?.result) throw new Error('canonical Concentrator resolver projection unavailable');
          fs.writeFileSync('/tmp/company-010-crv-resolve.json',JSON.stringify({version:r.version,concentrator:c},null,2)+'\n');
          NODE
          COMPANY_010_RESOLVE_INPUT=/tmp/company-010-crv-resolve.json node onboarding/company-010-crv-strategy-overlay.mjs
          node onboarding/company-010-gmx-strategy-overlay.mjs
          node onboarding/company-010-projectx-strategy-overlay.mjs
          node onboarding/company-010-convex-cvxcrv-rate-overlay.mjs
      - name: Preserve established Company State schema
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs');
          const p='companies/company-010-production-state.json';
          const d=JSON.parse(fs.readFileSync(p,'utf8'));
          if(d.strategies?.crv?.version!=='0.1-company-010-crv-strategy-intelligence') throw new Error('CRV strategy overlay did not run');
          if(d.strategies?.projectX?.version!=='0.1-company-010-projectx-full-parity') throw new Error('Project X full-parity overlay did not run');
          d.version='0.3-company-010-production-state-stakedao-complete';
          d.engineVersion='0.4-cypher-crv-strategy-intelligence';
          fs.writeFileSync(p,JSON.stringify(d,null,2)+'\n');
          NODE
      - name: Validate complete admission boundary
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs');
          const d=JSON.parse(fs.readFileSync('companies/company-010-production-state.json','utf8'));
          const r=JSON.parse(fs.readFileSync('companies/company-010-reconciliation.json','utf8'));
          if(d.version!=='0.3-company-010-production-state-stakedao-complete') throw new Error('version mismatch');
          if(d.engineVersion!=='0.4-cypher-crv-strategy-intelligence') throw new Error('CRV engine version mismatch');
          if(r.version!=='0.2-company-010-capital-reconciliation-stakedao-base') throw new Error('reconciliation version mismatch');
          if(r.stakeDaoIntelligence?.version!=='0.2-stakedao-accountant-curve-base-yield') throw new Error('Stake DAO intelligence missing');
          if(d.company?.registry!=='010'||d.company?.name!=='Cypher') throw new Error('identity mismatch');
          if(d.company?.architecture!=='The Holding Standard') throw new Error('architecture mismatch');
          if(d.status!=='complete-total-capital'||d.capital?.totalCapitalComplete!==true) throw new Error('Cypher total capital not complete');
          if(!(Number(d.capital?.totalCapitalUsd)>0)||d.capital?.totalCapitalUsd!==d.capital?.knownCapitalFloorUsd) throw new Error('exact Cypher total missing');
          const eth=(d.capital?.positions||[]).find(x=>x.symbol==='ETH');
          if(!(Number(eth?.components?.aaveArbitrumWstEthEquivalentEth)>0)) throw new Error('Aave wstETH reconciliation missing');
          const stakeEvidence=r.stakeDaoBase;
          const stakeUsd=Number(stakeEvidence?.result?.totalPositionUsd);
          const stakeResolved=stakeEvidence?.ok===true&&Number.isFinite(stakeUsd)&&stakeUsd>=0;
          const stakeActive=stakeResolved&&stakeUsd>0;
          const stake=(d.capital?.positions||[]).find(x=>x.assetId==='stakedao-base-curve-4pool');
          const prod=(d.productivity?.positions||[]).find(x=>x.id==='stakedao_base_curve_4pool');
          if(!stakeResolved) throw new Error('Stake DAO current lifecycle unresolved');
          if(stakeActive){
            if(!(Number(stake?.valueUsd)>0)||stake?.underlying?.length!==4) throw new Error('Stake DAO active capital/decomposition missing');
            const syms=new Set(stake.underlying.map(x=>x.symbol));
            for(const sym of ['USDC','USDbC','axlUSDC','crvUSD'])if(!syms.has(sym))throw new Error('Stake DAO underlying missing '+sym);
            if(!prod||prod.status!=='measured'||!(Number(prod.referenceAprPct)>=0)) throw new Error('Stake DAO active base yield not measured');
            if(r.stakeDaoBase?.result?.referenceAprSource!=='Curve official /v1/getBaseApys/base') throw new Error('Stake DAO active yield provenance mismatch');
          }else{
            if(stake) throw new Error('Stake DAO proven-zero capital row survived');
            if(prod) throw new Error('Stake DAO proven-zero Productivity row survived');
            if(d.provenance?.stakeDaoBase?.zeroIsKnown!==true||d.provenance?.stakeDaoBase?.currentPositionActive!==false) throw new Error('Stake DAO proven-zero provenance missing');
            if(d.epistemicBoundary?.knownZeroIsNotUnknown!==true) throw new Error('known-zero epistemic boundary missing');
          }
          const reward=(d.rewards?.observations||[]).find(x=>x.id==='stakedao-base-curve-4pool-crv');
          if(!reward||reward.token!=='CRV'||reward.status!=='measured'||!(Number(reward.claimable)>=0)) throw new Error('Stake DAO CRV reward not measured');
          if(stakeActive&&r.stakeDaoBase?.result?.rewardAccounting?.source!=='Stake DAO verified Accountant integral state on Base') throw new Error('Stake DAO active reward provenance mismatch');
          const crv=d.strategies?.crv;
          if(crv?.version!=='0.1-company-010-crv-strategy-intelligence'||crv.status!=='measured'||crv.strategies?.length!==2) throw new Error('CRV strategy intelligence missing');
          if(crv.accountingBoundary?.wrappersNotSummedAsCrvUnits!==true||crv.accountingBoundary?.noDoubleCount!==true) throw new Error('CRV accounting boundary drift');
          const conc=crv.strategies.find(x=>x.id==='concentrator-asdcrv');
          const cvx=crv.strategies.find(x=>x.id==='convex-staked-cvxcrv');
          if(!(Number(conc?.principal?.asdCRVShares)>0)||!(Number(conc?.principal?.sdCRVUnderlying)>0)||!(Number(conc?.principal?.navUsd)>0)) throw new Error('Concentrator principal missing');
          if(conc?.yield?.incomeMode!=='auto-compounded'||conc?.yield?.publicStatus!=='Compounded'||conc?.yield?.claimableApplicable!==false) throw new Error('Concentrator income semantics drift');
          if(!(Number(cvx?.principal?.cvxCRV)>0)||!(Number(cvx?.principal?.navUsd)>0)) throw new Error('staked cvxCRV principal missing');
          if(cvx?.yield?.incomeMode!=='separate-claimable-rewards'||cvx?.yield?.publicStatus!=='Claimable'||cvx?.yield?.claimableApplicable!==true) throw new Error('staked cvxCRV income semantics drift');
          if(cvx?.yield?.status!=='measured'||!(Number(cvx?.yield?.referenceAprPct)>0)||cvx?.yield?.proof?.version!=='0.1-convex-official-account-reward-rates'||cvx?.yield?.proof?.executionAuthority!=='none') throw new Error('staked cvxCRV Reference APR proof missing');
          const cvxProd=(d.productivity?.positions||[]).find(x=>x.id==='convex_staked_cvxcrv');
          if(cvxProd?.status!=='measured'||Number(cvxProd.referenceAprPct)!==Number(cvx.yield.referenceAprPct)) throw new Error('staked cvxCRV Productivity parity drift');
          if((d.gaps||[]).some(x=>x.id==='convex-staked-cvxcrv-reference-apr')) throw new Error('resolved staked cvxCRV APR gap survived');
          if(!Array.isArray(cvx?.claimable?.wallets)) throw new Error('staked cvxCRV claimable vector missing');
          const direct=(d.capital?.positions||[]).find(x=>x.assetId==='curve-dao-token');
          const concCapital=(d.capital?.positions||[]).find(x=>x.assetId==='concentrator-asdcrv');
          const cvxCapital=(d.capital?.positions||[]).find(x=>x.assetId==='convex-staked-cvxcrv');
          if(!direct||!concCapital||!cvxCapital||!(Number(concCapital.valueUsd)>0)||!(Number(cvxCapital.valueUsd)>0)) throw new Error('split CRV capital rows missing');
          if(d.epistemicBoundary?.crvWrapperUnitsAreNotAdditiveCrv!==true||d.epistemicBoundary?.compoundedIncomeIsNotClaimableReward!==true||d.epistemicBoundary?.claimableRewardIsNotPrincipal!==true) throw new Error('CRV epistemic boundary missing');
          const g=d.strategies?.gmx;
          if(g?.version!=='0.1.1-company-010-gmx-strategy-intelligence-pool-key-fix'||g.status!=='measured'||g.strategyCount!==2) throw new Error('GMX strategy intelligence missing');
          if(g.accountingBoundary?.underlyingPoolTokensAddedToReserveBalances!==false||g.accountingBoundary?.gmTokenNavCountedOnce!==true) throw new Error('GMX accounting boundary drift');
          if(g.rewardsBoundary?.lpFeeIncome!=='embedded-in-gm-nav'||g.rewardsBoundary?.separateClaimableLpFees!==false) throw new Error('GMX income semantics drift');
          if(g.strategies.some(x=>x.yield?.referenceMetric!=='GMX 30D Fee APY'||x.yield?.claimableApplicable!==false||!(Number(x.companyPosition?.strategyNavUsd)>0))) throw new Error('GMX strategy metric/NAV mismatch');
          if((d.rewards?.unboundMechanisms||[]).includes('GMX GM markets')) throw new Error('GMX incorrectly remains unbound reward mechanism');
          const embedded=(d.rewards?.embeddedIncomeMechanisms||[]).find(x=>x.id==='gmx-v2-market-liquidity');
          if(!embedded||embedded.claimableApplicable!==false||embedded.incomeMode!=='embedded-in-gm-nav') throw new Error('GMX embedded income contract missing');
          const px=d.strategies?.projectX;
          if(px?.version!=='0.1-company-010-projectx-full-parity'||px.status!=='measured-principal-and-claimable') throw new Error('Project X full-parity strategy missing');
          if(!(Number(px.nftCount)>0)||px.positions?.length!==px.nftCount) throw new Error('Project X NFT decomposition incomplete');
          if(!(Number(px.principal?.WHYPE)>=0)||!(Number(px.principal?.USDC)>0)||!(Number(px.principal?.navUsd)>0)) throw new Error('Project X multi-leg principal incomplete');
          if(px.accountingBoundary?.multiLegPrincipalComplete!==true||px.accountingBoundary?.whypeRemovedFromGeneralHype!==true||px.accountingBoundary?.usdcIncludedInStrategyNav!==true||px.accountingBoundary?.noDoubleCount!==true) throw new Error('Project X accounting boundary drift');
          const pxCap=(d.capital?.positions||[]).find(x=>x.assetId==='projectx-whype-usdc');
          const hype=(d.capital?.positions||[]).find(x=>x.assetId==='hyperliquid'||x.symbol==='HYPE');
          if(!(Number(pxCap?.valueUsd)>0)||hype?.components?.projectXPrincipal!==undefined||hype?.components?.projectXSeparatedToStrategy!=='projectx-whype-usdc') throw new Error('Project X/HYPE separation incomplete');
          if((d.productivity?.positions||[]).some(x=>x.id==='projectx_hype')) throw new Error('legacy single-leg Project X productivity row survived');
          const pxProd=(d.productivity?.positions||[]).find(x=>x.id==='projectx-whype-usdc');
          if(!pxProd||pxProd.status!=='warming'||pxProd.referenceAprPct!==null||pxProd.claimableApplicable!==true) throw new Error('Project X APR Pending semantics drift');
          for(const token of ['WHYPE','USDC']){const obs=(d.rewards?.observations||[]).find(x=>x.route==='projectx-whype-usdc'&&x.token===token);if(!obs||obs.status!=='measured'||!(Number(obs.claimable)>=0)||!(Number(obs.usdValue)>=0))throw new Error('Project X measured reward leg missing: '+token)}
          if(d.epistemicBoundary?.multiLegResolvedMustPromoteAllEconomicLegs!==true||d.epistemicBoundary?.projectXClaimableFeesAreNotPrincipal!==true) throw new Error('multi-leg promotion invariant missing');
          if((d.gaps||[]).some(x=>x.id==='fluid-net-eth')) throw new Error('Fluid blocker must be absent');
          if(d.epistemicBoundary?.fluidOwnerPolicy!=='out-of-scope') throw new Error('Fluid owner policy missing');
          if((d.capital?.positions||[]).some(x=>String(x.protocol||'').toLowerCase()==='fluid')) throw new Error('Fluid capital leaked into Company #010');
          if(d.performance?.complete!==false||d.performance?.status!=='partial-cost-basis') throw new Error('Performance completeness drift');
          if(d.authority?.executionAuthority!=='none'||d.authority?.transactions!==false) throw new Error('authority drift');
          console.log('Company #010 complete production admission PASS',{totalCapitalUsd:d.capital.totalCapitalUsd,stakeDaoCurrentPositionActive:stakeActive,stakeDaoCurrentPositionUsd:stakeUsd,concentratorUsd:conc.principal.navUsd,cvxCrvUsd:cvx.principal.navUsd,cvxCrvAprPct:cvx.yield.referenceAprPct,cvxCrvClaimableUsd:cvx.claimable.usd,gmxNavUsd:g.totalStrategyNavUsd,projectXNavUsd:px.principal.navUsd,projectXNfts:px.nftCount,fluid:'out-of-scope',performance:d.performance.status});
          NODE
      - name: Fingerprint source contract
        id: fingerprint
        run: |
          set -euo pipefail
          sha256sum onboarding/company-010-{discovery,resolve,deep-resolve,closure,closure-review,gmx-reader,gmx-strategy-overlay,projectx-strategy-overlay,reconciliation,stakedao-intelligence,production-baseline,production-state,stakedao-overlay,crv-strategy-overlay,convex-cvxcrv-rate-overlay}.mjs | sha256sum | awk '{print "sha="$1}' >> "$GITHUB_OUTPUT"
      - name: Commit production state
        run: |
          set -euo pipefail
          git config user.name "The Holding Company State"
          git config user.email "company-state@theholding.ai"
          git add companies/company-010-production-state.json companies/company-010-reconciliation.json
          if git diff --cached --quiet; then
            echo "No Company #010 state changes."
            exit 0
          fi
          git commit -m "companies: refresh complete Cypher state"
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main
            AFTER=$(sha256sum onboarding/company-010-{discovery,resolve,deep-resolve,closure,closure-review,gmx-reader,gmx-strategy-overlay,projectx-strategy-overlay,reconciliation,stakedao-intelligence,production-baseline,production-state,stakedao-overlay,crv-strategy-overlay,convex-cvxcrv-rate-overlay}.mjs | sha256sum | awk '{print $1}')
            if [ "$AFTER" != "${{ steps.fingerprint.outputs.sha }}" ]; then
              echo "Company #010 source contract changed during publication; fresh collection required."
              exit 1
            fi
            node -e "const fs=require('fs');const d=JSON.parse(fs.readFileSync('companies/company-010-production-state.json','utf8'));const c=d.strategies?.crv?.strategies?.find(x=>x.id==='convex-staked-cvxcrv');if(d.version!=='0.3-company-010-production-state-stakedao-complete'||d.engineVersion!=='0.4-cypher-crv-strategy-intelligence'||d.capital?.totalCapitalComplete!==true||d.strategies?.crv?.version!=='0.1-company-010-crv-strategy-intelligence'||c?.yield?.status!=='measured'||!(Number(c?.yield?.referenceAprPct)>0)||d.strategies?.gmx?.version!=='0.1.1-company-010-gmx-strategy-intelligence-pool-key-fix'||d.strategies?.projectX?.version!=='0.1-company-010-projectx-full-parity'||d.epistemicBoundary?.multiLegResolvedMustPromoteAllEconomicLegs!==true||d.authority?.executionAuthority!=='none')process.exit(1);"
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 2))
          done
          echo "Safe writer guard: push failed after 3 attempts."
          exit 1
