name: "Update Company #010 · Cypher Production State"

on:
  workflow_dispatch:
  schedule:
    - cron: '47 4 * * *'
  push:
    branches: [main]
    paths:
      - 'onboarding/company-010-discovery.mjs'
      - 'onboarding/company-010-resolve.mjs'
      - 'onboarding/company-010-deep-resolve.mjs'
      - 'onboarding/company-010-closure.mjs'
      - 'onboarding/company-010-closure-review.mjs'
      - 'onboarding/company-010-gmx-reader.mjs'
      - 'onboarding/company-010-gmx-strategy-overlay.mjs'
      - 'onboarding/company-010-reconciliation.mjs'
      - 'onboarding/company-010-stakedao-intelligence.mjs'
      - 'onboarding/company-010-production-baseline.mjs'
      - 'onboarding/company-010-production-state.mjs'
      - 'onboarding/company-010-stakedao-overlay.mjs'
      - '.github/workflows/update-company-010-state.yml'

permissions:
  contents: write

concurrency:
  group: company-010-production-state
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Validate source syntax
        run: |
          set -euo pipefail
          node --check onboarding/company-010-discovery.mjs
          node --check onboarding/company-010-resolve.mjs
          node --check onboarding/company-010-deep-resolve.mjs
          node --check onboarding/company-010-closure.mjs
          node --check onboarding/company-010-closure-review.mjs
          node --check onboarding/company-010-gmx-reader.mjs
          node --check onboarding/company-010-gmx-strategy-overlay.mjs
          node --check onboarding/company-010-reconciliation.mjs
          node --check onboarding/company-010-stakedao-intelligence.mjs
          node --check onboarding/company-010-production-baseline.mjs
          node --check onboarding/company-010-production-state.mjs
          node --check onboarding/company-010-stakedao-overlay.mjs
      - name: Install bounded dependencies
        run: npm install --no-save ethers@6 @aave-dao/aave-address-book
      - name: Collect reviewed Company #010 state
        env:
          ETH_RPC_URL: ${{ secrets.ETH_RPC_URL }}
          ETH_RPC_URL_2: ${{ secrets.ETH_RPC_URL_2 }}
          BASE_RPC_URL: ${{ secrets.BASE_RPC_URL }}
          BASE_RPC_URL_2: ${{ secrets.BASE_RPC_URL_2 }}
          ARBITRUM_RPC_URL: ${{ secrets.ARBITRUM_RPC_URL }}
          OPTIMISM_RPC_URL: ${{ secrets.OPTIMISM_RPC_URL }}
          POLYGON_RPC_URL: ${{ secrets.POLYGON_RPC_URL }}
          HYPEREVM_RPC_URL: ${{ secrets.HYPEREVM_RPC_URL }}
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
        run: |
          set -euo pipefail
          node onboarding/company-010-discovery.mjs
          node onboarding/company-010-resolve.mjs
          node onboarding/company-010-deep-resolve.mjs
          node onboarding/company-010-closure.mjs
          node onboarding/company-010-closure-review.mjs
          node onboarding/company-010-gmx-reader.mjs
          node onboarding/company-010-reconciliation.mjs
          node onboarding/company-010-stakedao-intelligence.mjs
          node onboarding/company-010-production-baseline.mjs
          node onboarding/company-010-stakedao-overlay.mjs
          node onboarding/company-010-gmx-strategy-overlay.mjs
      - name: Validate complete admission boundary
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs');
          const d=JSON.parse(fs.readFileSync('companies/company-010-production-state.json','utf8'));
          const r=JSON.parse(fs.readFileSync('companies/company-010-reconciliation.json','utf8'));
          if(d.version!=='0.3-company-010-production-state-stakedao-complete') throw new Error('version mismatch');
          if(r.version!=='0.2-company-010-capital-reconciliation-stakedao-base') throw new Error('reconciliation version mismatch');
          if(r.stakeDaoIntelligence?.version!=='0.2-stakedao-accountant-curve-base-yield') throw new Error('Stake DAO intelligence missing');
          if(d.company?.registry!=='010'||d.company?.name!=='Cypher') throw new Error('identity mismatch');
          if(d.company?.architecture!=='The Holding Standard') throw new Error('architecture mismatch');
          if(d.status!=='complete-total-capital'||d.capital?.totalCapitalComplete!==true) throw new Error('Cypher total capital not complete');
          if(!(Number(d.capital?.totalCapitalUsd)>0)||d.capital?.totalCapitalUsd!==d.capital?.knownCapitalFloorUsd) throw new Error('exact Cypher total missing');
          const eth=(d.capital?.positions||[]).find(x=>x.symbol==='ETH');
          if(!(Number(eth?.components?.aaveArbitrumWstEthEquivalentEth)>0)) throw new Error('Aave wstETH reconciliation missing');
          const stake=(d.capital?.positions||[]).find(x=>x.assetId==='stakedao-base-curve-4pool');
          if(!(Number(stake?.valueUsd)>0)||stake?.underlying?.length!==4) throw new Error('Stake DAO capital/decomposition missing');
          const syms=new Set(stake.underlying.map(x=>x.symbol));
          for(const s of ['USDC','USDbC','axlUSDC','crvUSD'])if(!syms.has(s))throw new Error('Stake DAO underlying missing '+s);
          const reward=(d.rewards?.observations||[]).find(x=>x.id==='stakedao-base-curve-4pool-crv');
          if(!reward||reward.token!=='CRV'||reward.status!=='measured'||!(Number(reward.claimable)>=0)) throw new Error('Stake DAO CRV reward not measured');
          const prod=(d.productivity?.positions||[]).find(x=>x.id==='stakedao_base_curve_4pool');
          if(!prod||prod.status!=='measured'||!(Number(prod.referenceAprPct)>=0)) throw new Error('Stake DAO base yield not measured');
          if(r.stakeDaoBase?.result?.referenceAprSource!=='Curve official /v1/getBaseApys/base') throw new Error('Stake DAO yield provenance mismatch');
          if(r.stakeDaoBase?.result?.rewardAccounting?.source!=='Stake DAO verified Accountant integral state on Base') throw new Error('Stake DAO reward provenance mismatch');
          const g=d.strategies?.gmx;
          if(g?.version!=='0.1.1-company-010-gmx-strategy-intelligence-pool-key-fix'||g.status!=='measured'||g.strategyCount!==2) throw new Error('GMX strategy intelligence missing');
          if(g.accountingBoundary?.underlyingPoolTokensAddedToReserveBalances!==false||g.accountingBoundary?.gmTokenNavCountedOnce!==true) throw new Error('GMX accounting boundary drift');
          if(g.rewardsBoundary?.lpFeeIncome!=='embedded-in-gm-nav'||g.rewardsBoundary?.separateClaimableLpFees!==false) throw new Error('GMX income semantics drift');
          if(g.strategies.some(x=>x.yield?.referenceMetric!=='GMX 30D Fee APY'||x.yield?.claimableApplicable!==false||!(Number(x.companyPosition?.strategyNavUsd)>0))) throw new Error('GMX strategy metric/NAV mismatch');
          if((d.rewards?.unboundMechanisms||[]).includes('GMX GM markets')) throw new Error('GMX incorrectly remains unbound reward mechanism');
          const embedded=(d.rewards?.embeddedIncomeMechanisms||[]).find(x=>x.id==='gmx-v2-market-liquidity');
          if(!embedded||embedded.claimableApplicable!==false||embedded.incomeMode!=='embedded-in-gm-nav') throw new Error('GMX embedded income contract missing');
          if((d.gaps||[]).some(x=>x.id==='fluid-net-eth')) throw new Error('Fluid blocker must be absent');
          if(d.epistemicBoundary?.fluidOwnerPolicy!=='out-of-scope') throw new Error('Fluid owner policy missing');
          if((d.capital?.positions||[]).some(x=>String(x.protocol||'').toLowerCase()==='fluid')) throw new Error('Fluid capital leaked into Company #010');
          if(d.performance?.complete!==false||d.performance?.status!=='partial-cost-basis') throw new Error('Performance completeness drift');
          if(d.authority?.executionAuthority!=='none'||d.authority?.transactions!==false) throw new Error('authority drift');
          console.log('Company #010 complete production admission PASS',{totalCapitalUsd:d.capital.totalCapitalUsd,stakeDaoValueUsd:stake.valueUsd,stakeDaoClaimableCrv:reward.claimable,stakeDaoReferenceAprPct:prod.referenceAprPct,gmxNavUsd:g.totalStrategyNavUsd,gmxIncome:g.rewardsBoundary.lpFeeIncome,fluid:'out-of-scope',performance:d.performance.status});
          NODE
      - name: Fingerprint source contract
        id: fingerprint
        run: |
          set -euo pipefail
          sha256sum onboarding/company-010-{discovery,resolve,deep-resolve,closure,closure-review,gmx-reader,gmx-strategy-overlay,reconciliation,stakedao-intelligence,production-baseline,production-state,stakedao-overlay}.mjs | sha256sum | awk '{print "sha="$1}' >> "$GITHUB_OUTPUT"
      - name: Commit production state
        run: |
          set -euo pipefail
          git config user.name "The Holding Company State"
          git config user.email "company-state@theholding.ai"
          git add companies/company-010-production-state.json companies/company-010-reconciliation.json
          if git diff --cached --quiet; then
            echo "No Company #010 state changes."
            exit 0
          fi
          git commit -m "companies: refresh complete Cypher state"
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main
            AFTER=$(sha256sum onboarding/company-010-{discovery,resolve,deep-resolve,closure,closure-review,gmx-reader,gmx-strategy-overlay,reconciliation,stakedao-intelligence,production-baseline,production-state,stakedao-overlay}.mjs | sha256sum | awk '{print $1}')
            if [ "$AFTER" != "${{ steps.fingerprint.outputs.sha }}" ]; then
              echo "Company #010 source contract changed during publication; fresh collection required."
              exit 1
            fi
            node -e "const fs=require('fs');const d=JSON.parse(fs.readFileSync('companies/company-010-production-state.json','utf8'));if(d.version!=='0.3-company-010-production-state-stakedao-complete'||d.capital?.totalCapitalComplete!==true||d.strategies?.gmx?.version!=='0.1.1-company-010-gmx-strategy-intelligence-pool-key-fix'||d.authority?.executionAuthority!=='none')process.exit(1);"
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 2))
          done
          echo "Safe writer guard: push failed after 3 attempts."
          exit 1