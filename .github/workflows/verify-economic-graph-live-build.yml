name: "Verify Economic Graph · Live Dual-Cohort Build"

on:
  pull_request:
    paths:
      - "intelligence/economic-graph/**"
      - "productivity/fxn-locker-apr-guard.mjs"
      - "companies/productivity-data.json"
      - ".github/workflows/update-economic-graph.yml"
      - ".github/workflows/resume-economic-graph-after-code-change.yml"
      - ".github/workflows/verify-economic-graph-live-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout reviewed repository state
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Verify code-change refresh topology
        shell: bash
        run: |
          set -euo pipefail
          test -s .github/workflows/update-economic-graph.yml
          test -s .github/workflows/resume-economic-graph-after-code-change.yml
          node - <<'NODE'
          const fs=require('fs');
          const graph=fs.readFileSync('.github/workflows/update-economic-graph.yml','utf8');
          const resume=fs.readFileSync('.github/workflows/resume-economic-graph-after-code-change.yml','utf8');
          const pushBlock=graph.match(/\n  push:\n([\s\S]*?)\n\npermissions:/)?.[1]||'';
          if(!pushBlock.includes('companies/productivity-data.json'))throw new Error('Economic Graph no longer follows canonical Productivity publishes');
          for(const forbidden of [
            'intelligence/economic-graph/economic-graph.mjs',
            'productivity/fxn-locker-apr-guard.mjs',
            '.github/workflows/update-economic-graph.yml'
          ]){
            if(pushBlock.includes(forbidden))throw new Error(`Economic Graph code-change direct publish path still present: ${forbidden}`);
          }
          for(const required of [
            "intelligence/economic-graph/economic-graph.mjs",
            ".github/workflows/update-economic-graph.yml",
            "gh workflow run update-economic-graph.yml --ref main",
            "Preflight existing Aerodrome Managed Strategy Pulse",
            "steps.pulse_preflight.outputs.refresh_needed == 'true'"
          ]){
            if(!resume.includes(required))throw new Error(`Economic Graph fast recovery topology missing: ${required}`);
          }
          if(resume.includes('gh workflow run unified-capital-refresh.yml --ref main'))throw new Error('Economic Graph recovery regressed to redundant Unified Capital dispatch');
          if(!/actions:\s*write/.test(resume))throw new Error('Economic Graph recovery dispatcher lacks actions:write');
          if(!/contents:\s*read/.test(resume))throw new Error('Economic Graph recovery dispatcher widened contents permission');
          if(/contents:\s*write/.test(resume))throw new Error('Economic Graph recovery dispatcher may not write repository contents');
          console.log('ECONOMIC GRAPH refresh topology PASS',{
            directCodePushBuild:false,
            canonicalProductivityPushBuild:true,
            codeChangeDispatch:'update-economic-graph.yml',
            redundantUnifiedDispatch:false,
            aerodromePulsePolicy:'semantic-preflight-then-bounded-repair',
            dispatcherContents:'read',
            dispatcherActions:'write'
          });
          NODE

      - name: Install live probe dependencies
        working-directory: productivity
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          npx playwright install chromium

      - name: Prove exact live behavior before canonical refresh
        shell: bash
        run: |
          set -euo pipefail
          TMP="$(mktemp)"
          LOG="$(mktemp)"
          set +e
          ECONOMIC_GRAPH_FILE="$TMP" node intelligence/economic-graph/economic-graph.mjs >"$LOG" 2>&1
          rc=$?
          set -e
          cat "$LOG"

          if [ "$rc" -eq 0 ]; then
            node - "$TMP" <<'NODE'
          const fs=require('fs');
          const x=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          const fx=x.cohorts?.['defitea-fxn-vefxn']?.latest?.observation;
          const curve=x.cohorts?.['defitea-curve-vecrv']?.latest?.observation;
          if(x.engineVersion!=='0.2-defitea-fxn-curve-multi-cohort')throw new Error('Economic Graph engine mismatch');
          if(x.coverage?.status!=='partial-two-cohort'||Number(x.coverage?.cohortCount)!==2)throw new Error('Two-cohort live build missing');
          if(!fx||!curve)throw new Error('Live cohort missing');
          if(Math.abs(Number(fx.aprParityDeltaPctPoints))>0.01)throw new Error('Live veFXN APR parity failed');
          if(Math.abs(Number(curve.formulaParityDeltaPctPoints))>0.01)throw new Error('Live Curve formula parity failed');
          if(fx.epistemic?.causalAttribution!=='unresolved'||fx.epistemic?.primaryDriver!==null)throw new Error('veFXN causal boundary regression');
          if(curve.epistemic?.mechanicalAttribution!=='proven-within-apr-formula'||curve.epistemic?.causalAttribution!=='unresolved-beyond-formula'||curve.epistemic?.primaryDriver!==null)throw new Error('Curve epistemic boundary regression');
          if(x.authority?.executionAuthority!=='none'||x.authority?.causalClaimAuthority!=='none')throw new Error('Authority regression');
          console.log('LIVE DUAL-COHORT BUILD PASS',{
            mode:'already-canonical-current',
            fxnApr:fx.liveObservedAprPct,
            fxnCanonicalApr:fx.canonicalProductivityAprPct,
            curveApr:curve.canonicalProductivityAprPct,
            curveFormulaApr:curve.formulaReproducedAprPct,
            cohortCount:x.coverage.cohortCount,
            executionAuthority:x.authority.executionAuthority
          });
          NODE
          else
            if ! grep -Fq 'Economic Graph refuses veFXN APR semantic drift' "$LOG"; then
              echo 'ERROR: live Economic Graph failed for an unexpected reason.'
              exit "$rc"
            fi
            echo 'EXPECTED PRE-REFRESH DRIFT DETECTED: strict APR parity guard rejected stale canonical Productivity.'
            echo 'Production code-change topology dispatches the canonical Economic Graph rebuild directly from current canonical Productivity.'
          fi

          rm -f "$TMP" "$LOG"
          git diff --check
