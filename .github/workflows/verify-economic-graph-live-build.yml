name: "Verify Economic Graph · Live Dual-Cohort Build"

on:
  pull_request:
    paths:
      - "intelligence/economic-graph/**"
      - "intelligence/explanatory/**"
      - "intelligence/reliability/frax-graph-memory-recovery-definition-proof.mjs"
      - "intelligence/reliability/cognitive-freshness-guard.mjs"
      - "intelligence/reliability/cognitive-freshness-guard-canary.mjs"
      - "productivity/fxn-locker-apr-guard.mjs"
      - "companies/productivity-data.json"
      - ".github/workflows/update-economic-graph.yml"
      - ".github/workflows/update-explanatory-context.yml"
      - ".github/workflows/refresh-cognitive-stack.yml"
      - ".github/workflows/resume-economic-graph-after-code-change.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout reviewed repository state
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Verify code-change refresh topology
        shell: bash
        run: |
          set -euo pipefail
          test -s .github/workflows/update-economic-graph.yml
          test -s .github/workflows/update-explanatory-context.yml
          test -s .github/workflows/update-change-intelligence.yml
          test -s .github/workflows/refresh-cognitive-stack.yml
          test -s .github/workflows/resume-economic-graph-after-code-change.yml
          test -s intelligence/reliability/cognitive-freshness-guard.mjs
          test -s intelligence/reliability/cognitive-freshness-guard-canary.mjs
          test -s intelligence/reliability/frax-graph-memory-recovery-definition-proof.mjs
          node intelligence/reliability/cognitive-freshness-guard-canary.mjs
          node intelligence/reliability/frax-graph-memory-recovery-definition-proof.mjs
          node - <<'NODE'
          const fs=require('fs');
          const graph=fs.readFileSync('.github/workflows/update-economic-graph.yml','utf8');
          const explanatory=fs.readFileSync('.github/workflows/update-explanatory-context.yml','utf8');
          const observer=fs.readFileSync('.github/workflows/update-change-intelligence.yml','utf8');
          const cognitive=fs.readFileSync('.github/workflows/refresh-cognitive-stack.yml','utf8');
          const resume=fs.readFileSync('.github/workflows/resume-economic-graph-after-code-change.yml','utf8');
          const graphPush=graph.match(/\n  push:\n([\s\S]*?)\n\npermissions:/)?.[1]||'';
          if(!graphPush.includes('companies/productivity-data.json'))throw new Error('Economic Graph no longer follows canonical Productivity publishes');
          for(const forbidden of ['intelligence/economic-graph/economic-graph.mjs','productivity/fxn-locker-apr-guard.mjs','.github/workflows/update-economic-graph.yml']){
            if(graphPush.includes(forbidden))throw new Error(`Economic Graph code-change direct publish path still present: ${forbidden}`);
          }

          const explanatoryPush=explanatory.match(/\n  push:\n([\s\S]*?)\n\npermissions:/)?.[1]||'';
          if(!explanatoryPush.includes('intelligence/economic-graph/economic-graph.json'))throw new Error('Explanatory no longer follows materialized Economic Graph publishes');
          for(const forbidden of ['intelligence/explanatory/explanatory-context.mjs','intelligence/explanatory/vlcvx-votium-curve-shadow-context.mjs']){
            if(explanatoryPush.includes(forbidden))throw new Error(`Premature Explanatory source-code production wake reintroduced: ${forbidden}`);
          }
          if(!observer.includes('workflow_dispatch:'))throw new Error('Canonical Change Intelligence Observer lacks workflow_dispatch entrypoint');

          for(const required of [
            "intelligence/economic-graph/*.mjs",
            "intelligence/explanatory/*.mjs",
            "Rebuild canonical Economic Graph first",
            "Prove physical eight-protocol Graph and Frax ecosystem",
            "Rebuild Explanatory only after Graph materialization",
            "Prove exact Graph to Explanatory Frax handoff",
            "Refresh Observer and System Memory before cognition",
            "Prove dependency-scoped Observer and System Memory contract",
            "Refresh canonical Cognitive Stack from proven Explanatory and Observer",
            "freshness_scope=economic-graph-recovery",
            "Refresh Project Memory after downstream success"
          ]){
            if(!resume.includes(required))throw new Error(`Ordered Graph recovery topology missing: ${required}`);
          }
          const order=[
            'Rebuild canonical Economic Graph first',
            'Prove physical eight-protocol Graph and Frax ecosystem',
            'Rebuild Explanatory only after Graph materialization',
            'Prove exact Graph to Explanatory Frax handoff',
            'Refresh Observer and System Memory before cognition',
            'Prove dependency-scoped Observer and System Memory contract',
            'Refresh canonical Cognitive Stack from proven Explanatory and Observer',
            'Refresh Project Memory after downstream success'
          ].map(x=>resume.indexOf(x));
          if(order.some(x=>x<0)||order.some((x,i)=>i>0&&x<=order[i-1]))throw new Error('Graph→Explanatory→Observer→Brain→Memory recovery order drift');
          if(!resume.includes('--scope economic-graph-recovery'))throw new Error('Dependency-scoped Observer proof missing');
          if(!resume.includes('--max-observer-age-hours 1'))throw new Error('Bounded Observer age proof missing');
          if(!cognitive.includes('default: global'))throw new Error('Global cognitive freshness default missing');
          if(!cognitive.includes('economic-graph-recovery'))throw new Error('Graph recovery cognitive scope missing');
          if(!cognitive.includes('intelligence/reliability/cognitive-freshness-guard.mjs'))throw new Error('Central cognitive freshness guard missing');
          if(!cognitive.includes("github.event.workflow_run.event != 'workflow_dispatch'"))throw new Error('Duplicate workflow_dispatch cognitive wake suppression missing');
          if(cognitive.includes("change.sourceHealth?.allFresh !== true"))throw new Error('Inline global source-health coupling reintroduced');
          if(resume.includes('gh workflow run unified-capital-refresh.yml --ref main'))throw new Error('Economic Graph recovery regressed to redundant Unified Capital dispatch');
          if(!/actions:\s*write/.test(resume))throw new Error('Economic Graph recovery dispatcher lacks actions:write');
          if(!/contents:\s*read/.test(resume))throw new Error('Economic Graph recovery dispatcher widened contents permission');
          if(/contents:\s*write/.test(resume))throw new Error('Economic Graph recovery dispatcher may not write repository contents');
          if(!/group:\s*economic-graph-code-change-resume/.test(resume)||!/cancel-in-progress:\s*false/.test(resume))throw new Error('Serialized non-cancellable recovery lane missing');
          console.log('ECONOMIC GRAPH DEPENDENCY-SCOPED RECOVERY TOPOLOGY PASS',{
            directGraphCodePushBuild:false,
            directExplanatorySourcePushBuild:false,
            canonicalProductivityPushBuild:true,
            graphModuleCoverage:'globbed',
            globalCognitionFailClosed:true,
            graphRecoveryDependencies:['productivity','rewards'],
            duplicateWorkflowDispatchCognitiveWake:false,
            recoveryOrder:'Graph→Explanatory→Observer→Brain→Memory',
            redundantUnifiedDispatch:false,
            dispatcherContents:'read',
            dispatcherActions:'write'
          });
          NODE

      - name: Install live probe dependencies
        working-directory: productivity
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          npx playwright install chromium

      - name: Prove exact live behavior before canonical refresh
        shell: bash
        run: |
          set -euo pipefail
          TMP="$(mktemp)"
          LOG="$(mktemp)"
          set +e
          ECONOMIC_GRAPH_FILE="$TMP" node intelligence/economic-graph/economic-graph.mjs >"$LOG" 2>&1
          rc=$?
          set -e
          cat "$LOG"

          if [ "$rc" -eq 0 ]; then
            node - "$TMP" <<'NODE'
          const fs=require('fs');
          const x=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          const fx=x.cohorts?.['defitea-fxn-vefxn']?.latest?.observation;
          const curve=x.cohorts?.['defitea-curve-vecrv']?.latest?.observation;
          if(x.engineVersion!=='0.2-defitea-fxn-curve-multi-cohort')throw new Error('Economic Graph engine mismatch');
          if(x.coverage?.status!=='partial-two-cohort'||Number(x.coverage?.cohortCount)!==2)throw new Error('Two-cohort live build missing');
          if(!fx||!curve)throw new Error('Live cohort missing');
          if(Math.abs(Number(fx.aprParityDeltaPctPoints))>0.01)throw new Error('Live veFXN APR parity failed');
          if(Math.abs(Number(curve.formulaParityDeltaPctPoints))>0.01)throw new Error('Live Curve formula parity failed');
          if(fx.epistemic?.causalAttribution!=='unresolved'||fx.epistemic?.primaryDriver!==null)throw new Error('veFXN causal boundary regression');
          if(curve.epistemic?.mechanicalAttribution!=='proven-within-apr-formula'||curve.epistemic?.causalAttribution!=='unresolved-beyond-formula'||curve.epistemic?.primaryDriver!==null)throw new Error('Curve epistemic boundary regression');
          if(x.authority?.executionAuthority!=='none'||x.authority?.causalClaimAuthority!=='none')throw new Error('Authority regression');
          console.log('LIVE DUAL-COHORT BUILD PASS',{
            mode:'already-canonical-current',
            fxnApr:fx.liveObservedAprPct,
            fxnCanonicalApr:fx.canonicalProductivityAprPct,
            curveApr:curve.canonicalProductivityAprPct,
            curveFormulaApr:curve.formulaReproducedAprPct,
            cohortCount:x.coverage.cohortCount,
            executionAuthority:x.authority.executionAuthority
          });
          NODE
          else
            if ! grep -Fq 'Economic Graph refuses veFXN APR semantic drift' "$LOG"; then
              echo 'ERROR: live Economic Graph failed for an unexpected reason.'
              exit "$rc"
            fi
            echo 'EXPECTED PRE-REFRESH DRIFT DETECTED: strict APR parity guard rejected stale canonical Productivity.'
            echo 'Production code-change topology performs the ordered canonical Graph recovery transaction.'
          fi

          rm -f "$TMP" "$LOG"
          git diff --check
