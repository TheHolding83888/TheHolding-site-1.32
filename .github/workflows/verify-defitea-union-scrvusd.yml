name: Verify Defitea · vlCVX Route Graph

on:
  pull_request:
    paths:
      - 'rewards/defitea-union-scrvusd-overlay.mjs'
      - 'rewards/company-rewards-engine.mjs'
      - '.github/workflows/update-company-rewards.yml'
      - 'intelligence/project-memory/THE_HOLDING_VLCVX_ROUTE_GRAPH_CANON_2026-08-18.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Install read-only runtime
        run: npm install --no-save --no-package-lock ethers@6

      - name: Run Defitea route overlay against temporary rewards snapshot
        env:
          ETH_RPC_URL: ${{ secrets.ETH_RPC_URL }}
          REWARDS_OUTPUT: /tmp/defitea-union-rewards.json
        run: |
          set -euo pipefail
          cp companies/rewards-data.json /tmp/defitea-union-rewards.json
          node --check rewards/defitea-union-scrvusd-overlay.mjs
          node rewards/defitea-union-scrvusd-overlay.mjs

      - name: Verify route graph forwarding settlement and ordering
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const d=JSON.parse(fs.readFileSync('/tmp/defitea-union-rewards.json','utf8'));
          const diag=d.diagnostics?.defiteaUnion;
          const c=d.companies?.['defitea.eth'];
          const src=(c?.sources||[]).find(x=>x.route==='votium-union');
          if(!diag||diag.capability!=='0.3-defitea-vlcvx-route-graph-scrvusd-proof')throw new Error('Defitea vlCVX route capability missing');
          if(diag.executionAuthority!=='none'||diag.claimTransactionAuthority!=='none')throw new Error('vlCVX collector authority expanded');
          if(diag.unknownIsNotZero!==true)throw new Error('unknown != zero contract missing');
          const u=src?.details?.union;
          const graph=src?.details?.vlCvxRouteGraph;
          if(!u||!graph)throw new Error('combined route graph missing');
          if(graph.principalAsset!=='vlCVX'||graph.currentRoute!=='Votium + Union'||graph.preserveLegacyResidualUntilClaimed!==true)throw new Error('vlCVX graph semantics drift');
          if(graph.publicLabels?.direct!=='Votium · vlCVX'||graph.publicLabels?.union!=='Votium + Union · vlCVX')throw new Error('public route labels drift');
          if(u.forwarding?.registry?.toLowerCase()!=='0x92e6e43f99809df84ed2d533e1fd8017eb966ee2')throw new Error('Votium registry mismatch');
          if(u.forwarding?.expectedUnionForward?.toLowerCase()!=='0xcc2a0f5e95c88aabd7b8e0db5c5252820cd47f91')throw new Error('Union forwarding mismatch');
          if(u.forwarding?.configured!==true||u.forwarding?.effective!==true)throw new Error('Defitea Union forwarding not effective');
          if(u.allocation?.scrvUsdSelected!==true||!(Number(u.allocation?.scrvUsdSharePct)>0))throw new Error('scrvUSD allocation not proven');
          if(u.contracts?.distributor?.toLowerCase()!=='0x17ac69dd3fb8f22b4f52dbdb8a3a0eb059367efc')throw new Error('scrvUSD distributor mismatch');
          if(u.contracts?.inputToken?.toLowerCase()!=='0xf939e0a03fb07f59a73314e73794be0e57ac1b4e')throw new Error('crvUSD input mismatch');
          if(u.contracts?.vault?.toLowerCase()!=='0x0655977feb2f289a4ab78af67bab0d17aab84367')throw new Error('scrvUSD vault mismatch');

          const rewards=c?.rewards||[];
          const directIdx=[];
          rewards.forEach((r,i)=>{if(r.protocol==='Votium · vlCVX'&&r.route==='votium-union')directIdx.push(i)});
          const unionIdx=rewards.findIndex(r=>r.route==='votium-union-scrvusd');
          for(const i of directIdx){
            const r=rewards[i];
            if(r.details?.vlCvxRoute?.routeRole!=='legacy-residual'||r.details?.vlCvxRoute?.delegationProtocol!=='Votium')throw new Error('direct Votium legacy route atoms missing');
          }

          const ent=u.airdrop?.entitlement;
          if(ent?.claimed===false){
            if(ent.proofValid!==true||unionIdx<0)throw new Error('unclaimed Union entitlement missing');
            const r=rewards[unionIdx];
            if(r.protocol!=='Votium + Union · vlCVX'||r.classification!=='unclaimed'||String(r.symbol).toLowerCase()!=='scrvusd')throw new Error('Union public row semantics invalid');
            if(r.details?.vlCvxRoute?.routeRole!=='current'||r.details?.vlCvxRoute?.settlementProtocol!=='The Union')throw new Error('Union current route atom missing');
            if(directIdx.length&&unionIdx!==Math.max(...directIdx)+1)throw new Error('Votium + Union group must immediately follow direct Votium atoms');
          } else if(unionIdx>=0) throw new Error('Union reward fabricated without unclaimed entitlement');

          if(src.details?.directVotium==null)throw new Error('direct Votium provenance not preserved');
          if(!String(d.methodology?.convex||'').includes('vlCVX is treated as a route graph'))throw new Error('vlCVX route graph methodology missing');
          console.log('Defitea vlCVX ROUTE GRAPH LIVE PASS',{
            directAtoms:directIdx.length,
            unionIndex:unionIdx,
            currentRoute:graph.currentRoute,
            legacyResidualRoute:graph.legacyResidualRoute,
            entitlement:ent?{status:ent.status,shares:ent.shares,usdValue:ent.usdValue}:null
          });
          NODE

      - name: Verify durable route canon
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const p='intelligence/project-memory/THE_HOLDING_VLCVX_ROUTE_GRAPH_CANON_2026-08-18.md';
          const s=fs.readFileSync(p,'utf8');
          for(const must of ['vlCVX principal → delegation / management route → settlement layer → payout assets','Votium + Union · vlCVX','Stake DAO · vlCVX','legacy-residual','unknown != zero'])if(!s.includes(must))throw new Error('vlCVX canon missing: '+must);
          console.log('vlCVX route graph canon PASS');
          NODE

      - name: Static no-execution guard
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const s=fs.readFileSync('rewards/defitea-union-scrvusd-overlay.mjs','utf8');
          for(const bad of ['sendTransaction(','new Wallet(','distributor.claim(','recordAllocation('])if(s.includes(bad))throw new Error('forbidden execution surface: '+bad);
          if(!s.includes("claimTransactionAuthority:'none'")&&!s.includes("claimTransactionAuthority: 'none'"))throw new Error('claim authority guard missing');
          console.log('vlCVX route graph no-execution guard PASS');
          NODE
