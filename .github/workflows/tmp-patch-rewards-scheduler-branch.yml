name: TEMP Patch Rewards Scheduler Branch

on:
  push:
    branches:
      - fix/rewards-scheduler-contract-2026-08-27
    paths:
      - '.github/workflows/tmp-patch-rewards-scheduler-branch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/rewards-scheduler-contract-2026-08-27
          fetch-depth: 0

      - name: Apply exact scheduler repair
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/update-company-rewards.yml')
          s=p.read_text()
          old="    - cron: '57 4 * * *'"
          new="    - cron: '07 5 * * *'"
          if s.count(old) != 1:
              raise SystemExit(f'expected exactly one old Rewards cron, found {s.count(old)}')
          s=s.replace(old,new,1)
          anchor="      - 'rewards/rewards-passport-hygiene.mjs'\n      - '.github/workflows/update-company-rewards.yml'"
          replacement="      - 'rewards/rewards-passport-hygiene.mjs'\n      - 'rewards/rewards-scheduler-contract.json'\n      - 'intelligence/reliability/rewards-scheduler-workflow-definition-proof.mjs'\n      - '.github/workflows/update-company-rewards.yml'"
          if s.count(anchor) != 1:
              raise SystemExit(f'expected exactly one Rewards path anchor, found {s.count(anchor)}')
          s=s.replace(anchor,replacement,1)
          install="      - name: Install runtime dependency\n        run: npm install --no-save --no-package-lock ethers@6\n"
          preflight="      - name: Verify Rewards scheduler contract\n        run: |\n          set -euo pipefail\n          node --check intelligence/reliability/rewards-scheduler-workflow-definition-proof.mjs\n          node intelligence/reliability/rewards-scheduler-workflow-definition-proof.mjs\n\n"+install
          if s.count(install) != 1:
              raise SystemExit(f'expected exactly one dependency step anchor, found {s.count(install)}')
          s=s.replace(install,preflight,1)
          p.write_text(s)
          PY
          node --check intelligence/reliability/rewards-scheduler-workflow-definition-proof.mjs
          node intelligence/reliability/rewards-scheduler-workflow-definition-proof.mjs
          git diff --check

      - name: Store validated workflow as Git blob only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          payload="$(base64 -w0 .github/workflows/update-company-rewards.yml)"
          response="$(curl --fail-with-body -sS \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/blobs" \
            -d "$(node -e 'process.stdout.write(JSON.stringify({content:process.argv[1],encoding:\"base64\"}))' "$payload")")"
          sha="$(printf '%s' "$response" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>process.stdout.write(JSON.parse(s).sha||""))')"
          test -n "$sha"
          echo "PATCHED_WORKFLOW_BLOB_SHA=$sha"
