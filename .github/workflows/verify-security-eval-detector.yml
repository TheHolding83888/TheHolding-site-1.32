name: Verify Security Eval Detector Precision

on:
  pull_request:
    paths:
      - 'security/security-sentinel.mjs'
      - 'verification/ask-experience/runner-v0.1.mjs'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Checkout candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Prove JavaScript and shell eval detector precision
        shell: bash
        run: |
          set -euo pipefail
          node --check security/security-sentinel.mjs
          cat > verification/security-eval-regression-fixture.mjs <<'JS'
          const page = { $eval() {}, $$eval() {} };
          page.$eval();
          page.$$eval();
          eval('1');
          JS
          node - <<'NODE'
          const fs=require('fs');
          const lines=[
            'name: Security shell eval regression fixture',
            'on: workflow_dispatch',
            'jobs:',
            '  fixture:',
            '    runs-on: ubuntu-latest',
            '    steps:',
            '      - run: |',
            "          value='echo fixture'",
            '          eval "$value"',
            ''
          ];
          fs.writeFileSync('.github/workflows/security-shell-eval-regression.yml',lines.join('\n'));
          NODE
          SECURITY_SKIP_NETWORK=1 node security/security-sentinel.mjs
          node - <<'NODE'
          const fs=require('fs');
          const s=JSON.parse(fs.readFileSync('security/security-intelligence.json','utf8'));
          const findings=s.currentFindings||[];
          const js=findings.filter(x=>x.category==='javascript-eval');
          const jsFixture=js.filter(x=>x.file==='verification/security-eval-regression-fixture.mjs');
          const runner=js.filter(x=>x.file==='verification/ask-experience/runner-v0.1.mjs');
          const shell=findings.filter(x=>x.category==='shell-eval');
          const shellFixture=shell.filter(x=>x.file==='.github/workflows/security-shell-eval-regression.yml');
          const verifierShell=shell.filter(x=>x.file==='.github/workflows/verify-security-eval-detector.yml');
          if(jsFixture.length!==1) throw new Error(`expected exactly one real JavaScript eval finding in fixture; got ${jsFixture.length}`);
          if(runner.length!==0) throw new Error(`Puppeteer $eval/$$eval false positives remain: ${runner.length}`);
          if(jsFixture[0].severity!=='high') throw new Error('real JavaScript eval is no longer High');
          if(shellFixture.length!==1) throw new Error(`expected exactly one real shell eval finding in fixture; got ${shellFixture.length}`);
          if(verifierShell.length!==0) throw new Error(`shell eval prose false positives remain in verifier: ${verifierShell.length}`);
          if(shellFixture[0].severity!=='high') throw new Error('real shell eval is no longer High');
          console.log('Security eval detector precision PASS',{
            realJavaScriptEvalFindings:jsFixture.length,
            puppeteerFalsePositives:runner.length,
            realShellEvalFindings:shellFixture.length,
            shellProseFalsePositives:verifierShell.length
          });
          NODE
          rm -f verification/security-eval-regression-fixture.mjs .github/workflows/security-shell-eval-regression.yml
          git diff --check
