name: Realty hero owner media materializer

on:
  push:
    branches:
      - feat/realty-hero-owner-media-20260831
    paths:
      - '.asset-hero/**'
      - '.github/workflows/realty-hero-materialize.yml'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild and verify owner hero
        shell: bash
        run: |
          set -euo pipefail
          target='realty/assets/owner/hero-split.0b9f34e9.avif'
          mkdir -p "$(dirname "$target")"
          cat .asset-hero/part-*.b64 > /tmp/hero.b64
          test "$(wc -c < /tmp/hero.b64 | tr -d ' ')" = '39888'
          base64 --decode /tmp/hero.b64 > "$target"
          test "$(wc -c < "$target" | tr -d ' ')" = '29915'
          test "$(sha256sum "$target" | awk '{print $1}')" = '0b9f34e90b66dda43055a142fb5b68505d23cae01600bde573253b1c853480a2'
          magic="$(dd if="$target" bs=1 skip=4 count=8 status=none)"
          test "$magic" = 'ftypavif'
          python - <<'PY'
          from pathlib import Path
          import struct
          p=Path('realty/assets/owner/hero-split.0b9f34e9.avif')
          b=p.read_bytes()
          i=b.find(b'ispe')
          if i < 0:
              raise SystemExit('missing ispe')
          w,h=struct.unpack('>II', b[i+8:i+16])
          if (w,h)!=(1600,533):
              raise SystemExit(f'bad dimensions {(w,h)}')
          print('verified', len(b), (w,h))
          PY

      - name: Update desktop hero consumer only
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('realty/index.html')
          s=p.read_text()
          old_pre='<link rel="preload" as="image" href="/realty/assets/hero/hero-split.webp?v=20260831" type="image/webp" media="(min-width:761px)">'
          new_pre='<link rel="preload" as="image" href="/realty/assets/owner/hero-split.0b9f34e9.avif" type="image/avif" media="(min-width:761px)">'
          old_src='src="/realty/assets/hero/hero-split.webp?v=20260831" alt="" loading="eager" fetchpriority="high" decoding="async"'
          new_src='src="/realty/assets/owner/hero-split.0b9f34e9.avif" alt="" loading="eager" fetchpriority="high" decoding="async"'
          if s.count(old_pre)!=1:
              raise SystemExit(f'preload anchor count {s.count(old_pre)}')
          if s.count(old_src)!=1:
              raise SystemExit(f'hero src anchor count {s.count(old_src)}')
          s=s.replace(old_pre,new_pre).replace(old_src,new_src)
          p.write_text(s)
          PY
          git diff --check
          changed="$( { git diff --name-only; git ls-files --others --exclude-standard; } | sort -u | tr '\n' ' ' )"
          test "$changed" = 'realty/assets/owner/hero-split.0b9f34e9.avif realty/index.html '

      - name: Commit verified hero
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add realty/assets/owner/hero-split.0b9f34e9.avif realty/index.html
          git commit -m 'Realty: add owner hero media'
          git push origin HEAD:feat/realty-hero-owner-media-20260831
