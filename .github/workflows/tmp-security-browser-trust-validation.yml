name: "TEMP · Validate Browser Trust v0.2"

on:
  push:
    branches:
      - ai/security-browser-trust-v0.2-20260814

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
          package-manager-cache: false
      - name: Validate Security Sentinel v0.2 offline
        shell: bash
        env:
          SECURITY_SKIP_NETWORK: "1"
        run: |
          set -euo pipefail
          node --check security/security-sentinel.mjs
          node security/security-sentinel.mjs
          node - <<'NODE'
          const s=require('./security/security-intelligence.json');
          if (s.severityCounts?.critical !== 0) throw new Error('unexpected critical findings');
          if (s.severityCounts?.high !== 0) throw new Error('unexpected high findings');
          if (s.severityCounts?.medium !== 0) throw new Error(`unexpected medium findings: ${s.severityCounts?.medium}`);
          if (s.browserTrust?.summary?.reviewedDomSinkCount !== 31) throw new Error('expected 31 reviewed DOM sinks');
          if (s.browserTrust?.summary?.unreviewedDomFileCount !== 0) throw new Error('unreviewed DOM files remain');
          if (s.browserTrust?.summary?.trustedExternalScriptCount !== 1) throw new Error('expected one trusted external script dependency');
          if (s.browserTrust?.summary?.trustedExternalScriptUsageCount !== 7) throw new Error('expected seven reviewed Umami page usages');
          console.log('Browser trust calibration pre-merge PASS', s.browserTrust.summary);
          NODE
