name: "P10 TEMP · Wire Stable engine self-probe"

on:
  push:
    branches:
      - fix/p10-stable-parallel-rate-collection-20260919
    paths:
      - ".github/workflows/_p10-stable-parallel-patch-temp.yml"

permissions:
  contents: write

concurrency:
  group: p10-temp-stable-self-probe-patch
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: fix/p10-stable-parallel-rate-collection-20260919
          fetch-depth: 1

      - name: Wire engine self-probe and bounded proof scope
        shell: python
        run: |
          from pathlib import Path

          workflow = Path('.github/workflows/update-stable-capital-scheduled.yml')
          text = workflow.read_text()
          old = '      # Definition/proof changes self-probe the writer immediately after merge.\n      - ".github/workflows/update-stable-capital-scheduled.yml"\n      - "intelligence/reliability/update-stable-capital-scheduler-proof.mjs"\n'
          new = '      # Engine/definition/proof changes self-probe the writer immediately after merge.\n      - "stable-capital/stable-capital-engine.mjs"\n      - ".github/workflows/update-stable-capital-scheduled.yml"\n      - "intelligence/reliability/update-stable-capital-scheduler-proof.mjs"\n'
          if text.count(old) != 1:
              raise SystemExit('Stable workflow self-probe anchor mismatch')
          workflow.write_text(text.replace(old, new))

          proof = Path('intelligence/reliability/update-stable-capital-scheduler-proof.mjs')
          p = proof.read_text()
          replacements = [
              ("const PROOF = 'intelligence/reliability/update-stable-capital-scheduler-proof.mjs';\n", "const PROOF = 'intelligence/reliability/update-stable-capital-scheduler-proof.mjs';\nconst ENGINE = 'stable-capital/stable-capital-engine.mjs';\n"),
              ("  FALLBACK_HEARTBEAT,\n  '.github/workflows/update-stable-capital-scheduled.yml',\n", "  FALLBACK_HEARTBEAT,\n  ENGINE,\n  '.github/workflows/update-stable-capital-scheduled.yml',\n"),
              ("const allowed = new Set([WORKFLOW, PROOF]);", "const allowed = new Set([WORKFLOW, PROOF, ENGINE]);"),
              ("  automaticFallbackHeartbeat: FALLBACK_HEARTBEAT,\n", "  automaticFallbackHeartbeat: FALLBACK_HEARTBEAT,\n  engineSelfProbePath: ENGINE,\n")
          ]
          for old_p, new_p in replacements:
              if p.count(old_p) != 1:
                  raise SystemExit(f'Proof anchor mismatch: {old_p!r}')
              p = p.replace(old_p, new_p)
          proof.write_text(p)

      - name: Static proof
        run: |
          set -euo pipefail
          node --check stable-capital/stable-capital-engine.mjs
          node --check intelligence/reliability/update-stable-capital-scheduler-proof.mjs
          grep -F 'stable-capital/stable-capital-engine.mjs' .github/workflows/update-stable-capital-scheduled.yml
          grep -F "const ENGINE = 'stable-capital/stable-capital-engine.mjs';" intelligence/reliability/update-stable-capital-scheduler-proof.mjs
          grep -F 'new Set([WORKFLOW, PROOF, ENGINE])' intelligence/reliability/update-stable-capital-scheduler-proof.mjs
          git diff --check
          mapfile -t changed < <(git diff --name-only | sort)
          test "${#changed[@]}" -eq 2
          test "${changed[0]}" = ".github/workflows/update-stable-capital-scheduled.yml"
          test "${changed[1]}" = "intelligence/reliability/update-stable-capital-scheduler-proof.mjs"

      - name: Commit bounded self-probe repair to branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/update-stable-capital-scheduled.yml intelligence/reliability/update-stable-capital-scheduler-proof.mjs
          git commit -m "fix(p10): self-probe Stable engine repairs"
          git push origin HEAD:fix/p10-stable-parallel-rate-collection-20260919
