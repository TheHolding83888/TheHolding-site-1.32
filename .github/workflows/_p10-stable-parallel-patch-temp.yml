name: "P10 TEMP · Patch Stable parallel rates"

on:
  push:
    branches:
      - fix/p10-stable-parallel-rate-collection-20260919
    paths:
      - ".github/workflows/_p10-stable-parallel-patch-temp.yml"

permissions:
  contents: write

concurrency:
  group: p10-temp-stable-parallel-patch
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: fix/p10-stable-parallel-rate-collection-20260919
          fetch-depth: 1

      - name: Replace serial rate collection with bounded parallel reads
        shell: python
        run: |
          from pathlib import Path
          path = Path('stable-capital/stable-capital-engine.mjs')
          text = path.read_text()
          old = "  const rows = {};\n  for (const [id, fn] of specs) {\n    try { rows[id] = await fn(); }\n    catch (e) { rows[id] = { status: 'error', annualYieldPct: null, error: errorText(e) }; }\n  }\n  return rows;\n"
          new = "  const pairs = await Promise.all(specs.map(async ([id, fn]) => {\n    const startedAt = Date.now();\n    console.log(`[stable-rate] start ${id}`);\n    try {\n      const value = await fn();\n      console.log(`[stable-rate] done ${id} ${Date.now() - startedAt}ms status=${value?.status || 'unknown'}`);\n      return [id, value];\n    } catch (e) {\n      console.warn(`[stable-rate] error ${id} ${Date.now() - startedAt}ms ${errorText(e)}`);\n      return [id, { status: 'error', annualYieldPct: null, error: errorText(e) }];\n    }\n  }));\n  return Object.fromEntries(pairs);\n"
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'Expected exactly one serial collectRates block, found {count}')
          path.write_text(text.replace(old, new))

      - name: Static proof
        run: |
          set -euo pipefail
          node --check stable-capital/stable-capital-engine.mjs
          grep -F "const pairs = await Promise.all(specs.map" stable-capital/stable-capital-engine.mjs
          grep -F "[stable-rate] done" stable-capital/stable-capital-engine.mjs
          git diff --check
          test "$(git diff --name-only | tr -d '\r')" = "stable-capital/stable-capital-engine.mjs"

      - name: Commit bounded engine repair to branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stable-capital/stable-capital-engine.mjs
          git commit -m "fix(p10): parallelize independent Stable rate reads"
          git push origin HEAD:fix/p10-stable-parallel-rate-collection-20260919
