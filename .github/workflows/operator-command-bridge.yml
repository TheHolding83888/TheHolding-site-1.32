name: "The Holding Operator · Command Bridge"

on:
  push:
    branches: [main]
    paths:
      - 'intelligence/operator/command.json'

permissions:
  contents: read
  actions: write

concurrency:
  group: operator-command-bridge-main
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Checkout canonical repository state
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate bounded operator command
        id: command
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('fs');
          const cmd = JSON.parse(fs.readFileSync('intelligence/operator/command.json', 'utf8'));
          const out = process.env.GITHUB_OUTPUT;
          const fail = (m) => { console.error(m); process.exit(1); };
          const clean = (v, label, { required=false, min=0, max=2000 }={}) => {
            const s = String(v ?? '').trim();
            if (required && !s) fail(`${label} is required`);
            if (s.length < min || s.length > max) fail(`${label} length is outside ${min}..${max}`);
            return s;
          };
          const integer = (v, label, min, max) => {
            const n = Number(v);
            if (!Number.isInteger(n) || n < min || n > max) fail(`${label} must be an integer in ${min}..${max}`);
            return n;
          };
          const secretLike = (text) => [
            /-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----/i,
            /\b(?:ghp|gho|ghu|ghs|ghr)_[A-Za-z0-9]{20,}\b/,
            /\bsk-(?:proj-)?[A-Za-z0-9_-]{20,}\b/,
            /\bsk-ant-[A-Za-z0-9_-]{20,}\b/,
            /\bAKIA[0-9A-Z]{16}\b/,
            /\b(?:seed phrase|mnemonic|private key)\s*[:=]/i,
          ].some(r => r.test(text));
          const output = (k, v) => fs.appendFileSync(out, `${k}=${String(v).replace(/\n/g, ' ')}\n`);

          const versions = new Set([
            '0.1-operator-command','0.2-operator-command','0.3-operator-command',
            '0.4-operator-command','0.5-operator-command','0.6-operator-command'
          ]);
          if (!versions.has(cmd.version)) fail('Unexpected operator command version');
          if (cmd.requestedBy !== 'owner' || cmd.approval !== 'explicit') fail('Explicit owner approval marker is required');
          if (cmd.arbitraryWorkflowAllowed !== false) fail('arbitraryWorkflowAllowed must remain false');
          if (cmd.walletActionAllowed !== false) fail('walletActionAllowed must remain false');
          if (cmd.capitalExecutionAllowed !== false) fail('capitalExecutionAllowed must remain false');
          if (typeof cmd.commandId !== 'string' || !/^[A-Za-z0-9._:+-]{8,128}$/.test(cmd.commandId)) fail('Invalid commandId');

          let operation, targetWorkflow, dispatch;
          let proposalId = '', disposition = '';

          if (cmd.version === '0.1-operator-command') {
            if (cmd.operation !== 'workflow_dispatch' || cmd.workflow !== 'update-proposal-work-queue.yml' || cmd.ref !== 'main') {
              fail('Legacy command escaped its original bounded contract');
            }
            operation = 'refresh_proposal_queue';
            targetWorkflow = 'update-proposal-work-queue.yml';
            dispatch = { ref: 'main' };
          } else if (cmd.operation === 'refresh_cognitive_stack') {
            operation = cmd.operation;
            targetWorkflow = 'refresh-cognitive-stack.yml';
            dispatch = { ref: 'main' };
          } else if (cmd.operation === 'refresh_proposal_queue') {
            operation = cmd.operation;
            targetWorkflow = 'update-proposal-work-queue.yml';
            dispatch = { ref: 'main' };
          } else if (cmd.operation === 'refresh_builder_candidates') {
            operation = cmd.operation;
            targetWorkflow = 'update-builder-candidates.yml';
            dispatch = { ref: 'main' };
          } else if (cmd.operation === 'record_owner_decision') {
            operation = cmd.operation;
            targetWorkflow = 'record-brain-decision.yml';
            const d = cmd.decision ?? {};
            proposalId = clean(d.proposalId, 'decision.proposalId', {required:true,max:80});
            const caseId = clean(d.caseId, 'decision.caseId', {required:true,max:80});
            const caseKey = clean(d.caseKey, 'decision.caseKey', {required:true,max:80});
            if (!/^PRP-[0-9a-f]{24}$/.test(proposalId)) fail('Invalid proposalId');
            if (!/^[0-9a-f]{24}$/.test(caseId)) fail('Invalid caseId');
            if (!/^CK-[0-9a-f]{20}$/.test(caseKey)) fail('Invalid caseKey');

            const queue = JSON.parse(fs.readFileSync('intelligence/proposals/proposal-queue.json','utf8'));
            const proposal = (queue.proposals ?? []).find(p => p.proposalId === proposalId);
            if (!proposal) fail(`Current proposal not found: ${proposalId}`);
            if (proposal.source?.caseId !== caseId || proposal.source?.caseKey !== caseKey) fail('Proposal/case binding mismatch');
            if (proposal.state !== 'PROPOSED') fail(`Only a current PROPOSED item may receive its first owner decision; got ${proposal.state}`);
            if (proposal.boundaries?.humanApprovalRequired !== true || proposal.boundaries?.automaticApproval !== false || proposal.boundaries?.automaticExecution !== false) {
              fail('Proposal safety boundary is not intact');
            }

            disposition = clean(d.disposition, 'decision.disposition', {required:true,max:20});
            if (!['accept','defer','reject','modify'].includes(disposition)) fail('Unsupported disposition');
            const rationale = clean(d.rationale, 'decision.rationale', {required:true,min:10,max:2000});
            const expectedOutcome = clean(d.expectedOutcome, 'decision.expectedOutcome', {max:1200});
            const modifiedAction = clean(d.modifiedAction, 'decision.modifiedAction', {required:disposition==='modify',max:2000});
            if (disposition !== 'modify' && modifiedAction) fail('modifiedAction is only allowed with modify');
            const predictionEvent = clean(d.predictionEvent || 'none', 'decision.predictionEvent', {required:true,max:64});
            if (!['none','case-resolved-by-review'].includes(predictionEvent)) fail('Unsupported prediction event');
            const probabilityBps = integer(d.probabilityBps ?? 7000, 'decision.probabilityBps', 0, 10000);
            const reviewDays = integer(d.reviewDays ?? 14, 'decision.reviewDays', 1, 365);
            if (clean(d.supersedesDecisionId, 'decision.supersedesDecisionId', {max:80})) fail('First-decision bridge does not permit corrections yet');
            if (secretLike([rationale, expectedOutcome, modifiedAction].join('\n'))) fail('Decision text contains a secret-like marker');

            dispatch = { ref:'main', inputs:{
              case_id:caseId,
              disposition,
              rationale,
              expected_outcome:expectedOutcome,
              modified_action:modifiedAction,
              prediction_event:predictionEvent,
              probability_bps:String(probabilityBps),
              review_days:String(reviewDays),
              supersedes_decision_id:''
            }};
          } else {
            fail(`Operation is not allowlisted: ${cmd.operation}`);
          }

          fs.writeFileSync('/tmp/operator-target-dispatch.json', JSON.stringify(dispatch), 'utf8');
          output('workflow', targetWorkflow);
          output('operation', operation);
          output('command_id', cmd.commandId);
          output('proposal_id', proposalId);
          output('disposition', disposition);
          console.log('Bounded command validated', {
            commandId:cmd.commandId,
            operation,
            targetWorkflow,
            proposalId:proposalId||null,
            disposition:disposition||null
          });
          NODE

      - name: Execute coherence-aware bounded orchestration
        id: orchestrate
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_WORKFLOW: ${{ steps.command.outputs.workflow }}
          OPERATION: ${{ steps.command.outputs.operation }}
          COMMAND_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          case "$TARGET_WORKFLOW" in
            refresh-cognitive-stack.yml|update-proposal-work-queue.yml|update-builder-candidates.yml|record-brain-decision.yml) ;;
            *) echo "Unexpected target workflow: $TARGET_WORKFLOW"; exit 1 ;;
          esac

          API="${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}"
          LAST_RUN_ID=""
          api_get() {
            curl -fsSL \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "$1"
          }
          wait_run_success() {
            local run_id="$1" label="$2" timeout_s="${3:-420}" elapsed=0 status conclusion
            while [ "$elapsed" -lt "$timeout_s" ]; do
              status="$(api_get "${API}/actions/runs/${run_id}" | jq -r '.status // empty')"
              conclusion="$(api_get "${API}/actions/runs/${run_id}" | jq -r '.conclusion // empty')"
              echo "$label run $run_id: status=$status conclusion=${conclusion:-pending}"
              if [ "$status" = "completed" ]; then
                [ "$conclusion" = "success" ] || { echo "$label failed: $conclusion"; exit 1; }
                return 0
              fi
              sleep 4
              elapsed=$((elapsed+4))
            done
            echo "Timed out waiting for $label run $run_id"
            exit 1
          }
          wait_command_security() {
            local elapsed=0 run_id=""
            while [ "$elapsed" -lt 240 ]; do
              run_id="$(api_get "${API}/actions/workflows/security-sentinel.yml/runs?event=push&branch=main&per_page=30" |
                jq -r --arg sha "$COMMAND_SHA" '.workflow_runs[] | select(.head_sha==$sha) | .id' | head -n1)"
              if [ -n "$run_id" ]; then
                echo "Command-bound Security Sentinel: $run_id"
                wait_run_success "$run_id" "Security Sentinel" 300
                echo "security_run_id=$run_id" >> "$GITHUB_OUTPUT"
                return 0
              fi
              sleep 4
              elapsed=$((elapsed+4))
            done
            echo "No Security Sentinel run found for command commit $COMMAND_SHA"
            exit 1
          }
          main_sha() { api_get "${API}/git/ref/heads/main" | jq -r '.object.sha'; }
          dispatch_and_wait() {
            local workflow="$1" payload="$2" label="$3" expected_sha="$4"
            local before_file elapsed=0 new_id="" code
            before_file="$(mktemp)"
            api_get "${API}/actions/workflows/${workflow}/runs?per_page=30" | jq -r '.workflow_runs[].id' > "$before_file"
            code="$(curl -sS -o /tmp/operator-dispatch-response.txt -w '%{http_code}' -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "${API}/actions/workflows/${workflow}/dispatches" \
              --data-binary "@${payload}")"
            [ "$code" = "204" ] || {
              echo "$label dispatch failed with HTTP $code"
              cat /tmp/operator-dispatch-response.txt || true
              exit 1
            }
            echo "Dispatched $label at main $expected_sha"
            while [ "$elapsed" -lt 90 ]; do
              new_id="$(api_get "${API}/actions/workflows/${workflow}/runs?event=workflow_dispatch&branch=main&per_page=30" |
                jq -r --arg sha "$expected_sha" '.workflow_runs[] | select(.head_sha==$sha) | .id' |
                while read -r id; do
                  if ! grep -qx "$id" "$before_file"; then echo "$id"; break; fi
                done)"
              if [ -n "$new_id" ]; then
                echo "Resolved $label run: $new_id"
                wait_run_success "$new_id" "$label" 420
                LAST_RUN_ID="$new_id"
                rm -f "$before_file"
                return 0
              fi
              sleep 3
              elapsed=$((elapsed+3))
            done
            rm -f "$before_file"
            echo "Could not resolve new $label run"
            exit 1
          }
          verify_learning_binding() {
            local stack_json learning_json stack_chain learning_chain learning_status
            stack_json="$(api_get "${API}/contents/intelligence/cognitive-stack-state.json?ref=main")"
            learning_json="$(api_get "${API}/contents/intelligence/learning-state/learning-context.json?ref=main")"
            stack_chain="$(printf '%s' "$stack_json" | jq -r '.content' | tr -d '\n' | base64 -d | jq -r '.integrity.chainHash // empty')"
            learning_chain="$(printf '%s' "$learning_json" | jq -r '.content' | tr -d '\n' | base64 -d | jq -r '.source.cognitiveChainHash // empty')"
            learning_status="$(printf '%s' "$learning_json" | jq -r '.content' | tr -d '\n' | base64 -d | jq -r '.status // empty')"
            echo "Learning binding: status=$learning_status stack=${stack_chain:0:12} learning=${learning_chain:0:12}"
            [ -n "$stack_chain" ] && [ "$learning_status" = "ready" ] && [ "$learning_chain" = "$stack_chain" ] || {
              echo "Learning is not current relative to Cognitive Stack"
              exit 1
            }
          }
          run_learning() {
            printf '{"ref":"main"}' > /tmp/learning-dispatch.json
            local head
            head="$(main_sha)"
            dispatch_and_wait 'update-learning-loop.yml' /tmp/learning-dispatch.json 'Decision Outcome Learning' "$head"
            echo "learning_run_id=$LAST_RUN_ID" >> "$GITHUB_OUTPUT"
            verify_learning_binding
          }
          run_proposal() {
            printf '{"ref":"main"}' > /tmp/proposal-dispatch.json
            local head
            head="$(main_sha)"
            dispatch_and_wait 'update-proposal-work-queue.yml' /tmp/proposal-dispatch.json 'Proposal Work Queue' "$head"
            echo "proposal_run_id=$LAST_RUN_ID" >> "$GITHUB_OUTPUT"
          }
          run_builder() {
            printf '{"ref":"main"}' > /tmp/builder-dispatch.json
            local head
            head="$(main_sha)"
            dispatch_and_wait 'update-builder-candidates.yml' /tmp/builder-dispatch.json 'Self-Improvement Builder Sandbox' "$head"
            echo "builder_run_id=$LAST_RUN_ID" >> "$GITHUB_OUTPUT"
          }

          # The command commit itself is reviewed before any downstream orchestration.
          wait_command_security

          printf '{"ref":"main"}' > /tmp/cognitive-dispatch.json
          COGNITIVE_HEAD="$(main_sha)"
          dispatch_and_wait 'refresh-cognitive-stack.yml' /tmp/cognitive-dispatch.json 'Cognitive Stack' "$COGNITIVE_HEAD"
          COGNITIVE_RUN="$LAST_RUN_ID"
          echo "cognitive_run_id=$COGNITIVE_RUN" >> "$GITHUB_OUTPUT"

          case "$OPERATION" in
            refresh_cognitive_stack)
              run_learning
              echo "target_run_id=$COGNITIVE_RUN" >> "$GITHUB_OUTPUT"
              ;;
            record_owner_decision)
              TARGET_HEAD="$(main_sha)"
              dispatch_and_wait 'record-brain-decision.yml' /tmp/operator-target-dispatch.json 'Decision Memory' "$TARGET_HEAD"
              DECISION_RUN="$LAST_RUN_ID"
              echo "target_run_id=$DECISION_RUN" >> "$GITHUB_OUTPUT"
              run_learning
              ;;
            refresh_proposal_queue)
              run_learning
              run_proposal
              echo "target_run_id=$LAST_RUN_ID" >> "$GITHUB_OUTPUT"
              ;;
            refresh_builder_candidates)
              # Builder consumes exact Decision-bound Proposal bytes. Establish the
              # full fresh chain before generating candidate work packets.
              run_learning
              run_proposal
              run_builder
              echo "target_run_id=$LAST_RUN_ID" >> "$GITHUB_OUTPUT"
              ;;
            *) echo "Unexpected operation after validation: $OPERATION"; exit 1 ;;
          esac

      - name: Operator command summary
        if: always()
        shell: bash
        run: |
          {
            echo "# The Holding · Operator Command Bridge v0.6"
            echo
            echo "**Command ID:** \`${{ steps.command.outputs.command_id }}\`"
            echo "**Operation:** \`${{ steps.command.outputs.operation }}\`"
            echo "**Requested target:** \`${{ steps.command.outputs.workflow }}\`"
            if [ -n "${{ steps.command.outputs.proposal_id }}" ]; then
              echo "**Proposal:** \`${{ steps.command.outputs.proposal_id }}\`"
              echo "**Owner disposition:** \`${{ steps.command.outputs.disposition }}\`"
            fi
            echo "**Command-bound Security run:** \`${{ steps.orchestrate.outputs.security_run_id }}\`"
            echo "**Fresh Cognitive run:** \`${{ steps.orchestrate.outputs.cognitive_run_id }}\`"
            echo "**Learning run:** \`${{ steps.orchestrate.outputs.learning_run_id }}\`"
            echo "**Proposal run:** \`${{ steps.orchestrate.outputs.proposal_run_id }}\`"
            echo "**Builder run:** \`${{ steps.orchestrate.outputs.builder_run_id }}\`"
            echo "**Final target run:** \`${{ steps.orchestrate.outputs.target_run_id }}\`"
            echo "**Arbitrary workflows:** disabled"
            echo "**Repository mutation by bridge:** disabled"
            echo "**Wallet action:** disabled"
            echo "**Capital execution:** disabled"
            echo
            echo "v0.6 can perform Security → Cognitive → Learning → Decision-bound Proposal → Builder Candidate orchestration, while each downstream workflow remains independently fail-closed."
          } >> "$GITHUB_STEP_SUMMARY"
