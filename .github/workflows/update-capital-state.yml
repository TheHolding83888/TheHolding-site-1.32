name: "The Holding Intelligence · Capital State"

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'companies/productivity-data.json'
      - 'companies/stable-index-data.json'
      - 'companies/company-010-production-state.json'
      - 'intelligence/capital-state/general-company-balance-sheet.mjs'
      - 'intelligence/capital-state/capital-state.mjs'
      - '.github/workflows/update-capital-state.yml'

permissions:
  contents: write

concurrency:
  group: capital-state
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Validate engines
        run: |
          set -euo pipefail
          node --check intelligence/capital-state/general-company-balance-sheet.mjs
          node --check intelligence/capital-state/capital-state.mjs
      - name: Rebuild General Balance Sheet
        env:
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
        run: node intelligence/capital-state/general-company-balance-sheet.mjs
      - name: Build Capital State
        run: node intelligence/capital-state/capital-state.mjs
      - name: Validate partial Registry admission semantics
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs');
          const g=JSON.parse(fs.readFileSync('intelligence/capital-state/general-company-balance-sheet.json','utf8'));
          const c=JSON.parse(fs.readFileSync('intelligence/capital-state/capital-state.json','utf8'));
          if(g.version!=='0.1-general-company-balance-sheet'||g.status!=='ok'||(g.companies||[]).length!==8) throw new Error('established General Balance regression');
          if(c.version!=='0.3-capital-state'||c.engineVersion!=='0.3-partial-registry-admission-capital-substrate') throw new Error('Capital State v0.3 mismatch');
          if(c.status!=='partial'||c.network?.registryCompanyCount!==10||c.network?.measuredCompanyCount!==10) throw new Error('Registry #010 admission missing');
          if(c.network?.totalCapitalCompleteCompanyCount!==9||c.network?.totalCapitalCoverage!==0.9) throw new Error('expected 9/10 complete total-capital coverage');
          if(c.network?.networkTvlUsd!==null||c.network?.networkTvlStatus!=='withheld-incomplete-total-capital-coverage') throw new Error('Network TVL must be withheld while Fluid is unresolved');
          if(!(Number(c.network?.measuredCapitalFloorUsd)>0)) throw new Error('measured network capital floor unavailable');
          if(Object.values(c.network?.layerWeights||{}).some(v=>v!==null)) throw new Error('full Network layer weights must remain withheld');
          if(!Object.values(c.network?.measuredFloorLayerWeights||{}).some(v=>Number.isFinite(Number(v)))) throw new Error('measured-floor layer composition unavailable');
          const cypher=(c.companies||[]).find(x=>x.registry==='010');
          if(!cypher||cypher.name!=='Cypher'||cypher.totalCapitalComplete!==false||cypher.measurementStatus!=='partial-total-capital-floor') throw new Error('Cypher partial state mismatch');
          if(cypher.knownButUnboundCapitalMayExist!==true||cypher.coverage?.companyCapitalCoverage!==null) throw new Error('Cypher unknown denominator must remain explicit');
          if(!cypher.gaps?.some(x=>x.id==='fluid-net-eth')) throw new Error('Cypher Fluid gap missing');
          if(c.readiness?.networkTvl!=='blocked-by-company-010-fluid-net-exposure') throw new Error('Network TVL blocker mismatch');
          if(c.authority?.executionAuthority!=='none') throw new Error('authority drift');
          console.log('Capital State v0.3 partial Registry admission PASS', {registry:c.network.registryCompanyCount,measured:c.network.measuredCompanyCount,complete:c.network.totalCapitalCompleteCompanyCount,floor:c.network.measuredCapitalFloorUsd,networkTvl:c.network.networkTvlUsd});
          NODE
      - name: Commit generated state safely
        run: |
          set -euo pipefail
          git config user.name "The Holding Capital State"
          git config user.email "capital-state@theholding.ai"
          git add intelligence/capital-state/general-company-balance-sheet.json intelligence/capital-state/capital-state.json
          if git diff --cached --quiet; then echo "No Capital State changes."; exit 0; fi
          git commit -m "intelligence: refresh capital state"
          for attempt in 1 2 3; do
            git fetch origin main
            if ! git rebase origin/main; then git rebase --abort || true; echo "Safe writer guard: rebase conflict; refusing to guess."; exit 1; fi
            node intelligence/capital-state/capital-state.mjs
            git add intelligence/capital-state/capital-state.json
            git commit --amend --no-edit
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1
