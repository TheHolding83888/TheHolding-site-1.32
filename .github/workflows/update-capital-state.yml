name: "The Holding · Capital State"

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "companies/index.html"
      - "companies/productivity-data.json"
      - "companies/stable-index-data.json"
      - "intelligence/capital-state/**"
      - ".github/workflows/update-capital-state.yml"
  push:
    branches:
      - main
    paths:
      - "companies/index.html"
      - "companies/productivity-data.json"
      - "companies/stable-index-data.json"
      - "intelligence/capital-state/general-company-balance-sheet.mjs"
      - "intelligence/capital-state/capital-state.mjs"
      - ".github/workflows/update-capital-state.yml"

permissions:
  contents: write

concurrency:
  group: the-holding-capital-state
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout canonical state
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || 'main' }}

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Static preflight
        shell: bash
        run: |
          set -euo pipefail
          test -s intelligence/capital-state/general-company-balance-sheet.mjs
          test -s intelligence/capital-state/capital-state.mjs
          test -s companies/index.html
          test -s companies/productivity-data.json
          test -s companies/stable-index-data.json
          node --check intelligence/capital-state/general-company-balance-sheet.mjs
          node --check intelligence/capital-state/capital-state.mjs
          grep -q "executionAuthority:'none'\|executionAuthority: 'none'" intelligence/capital-state/general-company-balance-sheet.mjs
          grep -q "executionAuthority: 'none'" intelligence/capital-state/capital-state.mjs
          grep -q "unknown != zero" intelligence/capital-state/general-company-balance-sheet.mjs
          grep -q "unknown != zero" intelligence/capital-state/capital-state.mjs
          grep -q "networkTvlUsd" intelligence/capital-state/capital-state.mjs
          grep -q "layerWeights" intelligence/capital-state/capital-state.mjs

      - name: Build General Company Balance Sheet
        run: node intelligence/capital-state/general-company-balance-sheet.mjs

      - name: Build Capital State
        run: node intelligence/capital-state/capital-state.mjs

      - name: Validate total-capital semantics and authority
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('fs');
          const b = JSON.parse(fs.readFileSync('intelligence/capital-state/general-company-balance-sheet.json','utf8'));
          const x = JSON.parse(fs.readFileSync('intelligence/capital-state/capital-state.json','utf8'));

          if (b.version !== '0.1-general-company-balance-sheet' || b.status !== 'ok') throw new Error('general balance sheet not healthy');
          if (b.authority?.executionAuthority !== 'none' || b.authority?.readOnly !== true) throw new Error('general balance sheet gained execution authority');
          if (!Array.isArray(b.companies) || b.companies.length !== 8) throw new Error('expected eight general companies');
          if (b.network?.totalCapitalCompleteCompanyCount !== 8) throw new Error('general total-capital binding incomplete');
          if (!Number.isFinite(b.network?.generalCompanyTvlUsd) || b.network.generalCompanyTvlUsd <= 0) throw new Error('general company TVL unavailable');
          for (const c of b.companies) {
            if (c.totalCapitalComplete !== true || c.status !== 'total-capital-complete') throw new Error(`${c.registry}: incomplete total-capital binding`);
            const sum = Object.values(c.layerValues||{}).reduce((s,v)=>s+Number(v||0),0);
            if (Math.abs(sum-Number(c.totalCapitalUsd))>0.05) throw new Error(`${c.registry}: layer reconciliation failed`);
          }
          const rook = b.companies.find(c=>c.registry==='007');
          const rookZk = rook?.positions?.find(p=>p.assetId==='zksync');
          if (!rookZk || rookZk.primaryCapitalLayer !== 'unclassified') throw new Error('Rook ZK must remain unclassified');
          const oneM = b.companies.find(c=>c.registry==='009');
          const oneMEth = oneM?.positions?.find(p=>p.assetId==='ethereum');
          if (!oneMEth || oneMEth.evidenceStatus !== 'mixed-verified-native-plus-owner-observed') throw new Error('Company 009 mixed ETH provenance lost');

          if (x.version !== '0.2-capital-state') throw new Error('unexpected Capital State version');
          if (x.engineVersion !== '0.2-complete-balance-sheet-capital-substrate') throw new Error('unexpected Capital State engine version');
          if (x.status !== 'ok') throw new Error('Capital State must be ok with 9/9 complete bindings');
          if (x.authority?.executionAuthority !== 'none' || x.authority?.readOnly !== true) throw new Error('Capital State gained execution authority');
          if (x.authority?.capitalExecution !== false || x.authority?.allocationAuthority !== false) throw new Error('Capital State gained capital/allocation authority');
          if (!Array.isArray(x.companies) || x.companies.length !== 9) throw new Error('expected exactly 9 Registry companies');
          if (x.network?.registryCompanyCount !== 9 || x.network?.measuredCompanyCount !== 9) throw new Error('registry measurement mismatch');
          if (x.network?.totalCapitalCompleteCompanyCount !== 9 || x.network?.totalCapitalCoverage !== 1) throw new Error('9/9 total-capital coverage required');
          if (!Number.isFinite(x.network?.networkTvlUsd) || x.network.networkTvlUsd <= 0) throw new Error('Network TVL unavailable');
          if (Math.abs(Number(x.network.networkTvlUsd)-Number(x.network.measuredCapitalFloorUsd))>0.01) throw new Error('Network TVL must equal proven measured capital floor at 9/9 coverage');
          const layerSum = Object.values(x.network?.layerValues||{}).reduce((s,v)=>s+Number(v||0),0);
          if (Math.abs(layerSum-Number(x.network.networkTvlUsd))>0.05) throw new Error('network layers do not reconcile to Network TVL');
          const weightSum = Object.values(x.network?.layerWeights||{}).reduce((s,v)=>s+Number(v||0),0);
          if (Math.abs(weightSum-1)>0.00001) throw new Error('capital layer weights must sum to 1');
          if (x.readiness?.networkTvl !== 'available') throw new Error('Network TVL readiness not activated');
          if (x.readiness?.q12AllocationContext !== 'available-with-layer-provenance') throw new Error('Q12 allocation context not activated');
          if ((x.gaps||[]).some(g=>g.id==='general-company-total-capital-binding' && g.severity==='blocking')) throw new Error('closed total-capital blocker still present');

          console.log('CAPITAL STATE v0.2 PASS', {
            generalCompanies:b.companies.length,
            registryCompanies:x.network.registryCompanyCount,
            networkTvlUsd:x.network.networkTvlUsd,
            layerWeights:x.network.layerWeights,
            q12:x.readiness.q12AllocationContext,
            executionAuthority:x.authority.executionAuthority
          });
          NODE
          git diff --check

      - name: Publish generated Capital State
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          BALANCE="intelligence/capital-state/general-company-balance-sheet.json"
          STATE="intelligence/capital-state/capital-state.json"
          test -s "$BALANCE"
          test -s "$STATE"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$BALANCE" "$STATE"

          staged_bad="$(git diff --cached --name-only | grep -Ev '^intelligence/capital-state/(general-company-balance-sheet|capital-state)\.json$' || true)"
          if [ -n "$staged_bad" ]; then
            echo "ERROR: Capital State attempted to stage outside generated boundary:"
            echo "$staged_bad"
            exit 1
          fi

          if git diff --cached --quiet; then
            echo "Capital State already current."
            exit 0
          fi

          git commit -m "capital: refresh complete capital state"

          for attempt in 1 2 3; do
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "Capital State publish conflict; refusing to guess."
              exit 1
            fi

            node intelligence/capital-state/general-company-balance-sheet.mjs
            node intelligence/capital-state/capital-state.mjs
            git add "$BALANCE" "$STATE"
            if ! git diff --cached --quiet; then git commit --amend --no-edit; fi

            if git push origin HEAD:main; then
              git fetch origin main
              git cat-file -e "origin/main:$BALANCE"
              git cat-file -e "origin/main:$STATE"
              REMOTE_BALANCE_VERSION="$(git show "origin/main:$BALANCE" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>console.log(JSON.parse(s).version))")"
              REMOTE_STATE_VERSION="$(git show "origin/main:$STATE" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>console.log(JSON.parse(s).version))")"
              test "$REMOTE_BALANCE_VERSION" = "0.1-general-company-balance-sheet"
              test "$REMOTE_STATE_VERSION" = "0.2-capital-state"
              echo "Verified General Balance Sheet v0.1 + Capital State v0.2 on remote main."
              exit 0
            fi

            echo "Main moved during push; retrying ($attempt/3)..."
            sleep $((attempt * 2))
          done

          echo "Capital State publish failed after 3 attempts."
          exit 1
