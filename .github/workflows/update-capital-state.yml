name: "The Holding Intelligence · Capital State"

# Legacy bounded recovery path. Automatic capital refresh is owned by
# "The Holding Capital · Unified Refresh". This recovery path consumes canonical
# Market Data and never performs its own external price discovery.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: capital-state
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
      - name: Validate engines
        run: |
          set -euo pipefail
          node --check intelligence/capital-state/general-company-balance-sheet.mjs
          node --check intelligence/capital-state/capital-state.mjs
          node --check intelligence/market-data/coingecko-fetch-shim.mjs
      - name: Require canonical shared Market Data
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs');
          const m=JSON.parse(fs.readFileSync('intelligence/market-data/market-data.json','utf8'));
          const prices=m.prices||{};
          if(m.semantics?.perAssetAuthoritySelectionApplied!==true)throw new Error('Capital recovery refuses non-materialized Market Data');
          if(Object.keys(prices).length!==26||Number(m.authority?.onchainSelectedAssetCount)!==26)throw new Error('Capital recovery requires 26/26 onchain-selected Market Data');
          for(const [id,row] of Object.entries(prices)){
            if(row?.authority?.selectedLane!=='onchain'||row?.authority?.fallbackUsed!==false||!String(row?.source||'').startsWith('onchain-'))throw new Error(`${id}: canonical onchain authority unavailable`);
          }
          console.log('Capital recovery canonical Market Data PASS',{generatedAt:m.generatedAt,onchainSelectedAssetCount:m.authority.onchainSelectedAssetCount});
          NODE
      - name: Rebuild General Balance Sheet
        env:
          NODE_OPTIONS: --import=${{ github.workspace }}/intelligence/market-data/coingecko-fetch-shim.mjs
        run: node intelligence/capital-state/general-company-balance-sheet.mjs
      - name: Build Capital State
        run: node intelligence/capital-state/capital-state.mjs
      - name: Validate complete Registry admission semantics
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs');
          const g=JSON.parse(fs.readFileSync('intelligence/capital-state/general-company-balance-sheet.json','utf8'));
          const c=JSON.parse(fs.readFileSync('intelligence/capital-state/capital-state.json','utf8'));
          const m=JSON.parse(fs.readFileSync('intelligence/market-data/market-data.json','utf8'));
          if(g.version!=='0.1-general-company-balance-sheet'||g.status!=='ok'||(g.companies||[]).length!==8) throw new Error('established General Balance regression');
          const allowedEngines=new Set(['0.4-complete-registry-admission-capital-substrate','0.4.1-generation-bound-productivity-coherence']);
          if(c.version!=='0.3-capital-state'||!allowedEngines.has(c.engineVersion)) throw new Error('Capital State complete engine mismatch');
          if(c.status!=='ok'||c.network?.registryCompanyCount!==10||c.network?.measuredCompanyCount!==10) throw new Error('Registry complete admission missing');
          if(c.network?.totalCapitalCompleteCompanyCount!==10||c.network?.totalCapitalCoverage!==1) throw new Error('expected 10/10 complete total-capital coverage');
          if(!(Number(c.network?.networkTvlUsd)>0)||c.network?.networkTvlStatus!=='complete') throw new Error('exact Network TVL must be available');
          const yieldRing=(c.companies||[]).find(x=>x.registry==='002');
          const yrBtc=(yieldRing?.measuredPositions||[]).find(x=>x.assetId==='bitcoin');
          const yrAero=(yieldRing?.measuredPositions||[]).find(x=>x.assetId==='aerodrome-finance');
          const c5=(g.companies||[]).find(x=>x.registry==='005');
          const c6=(g.companies||[]).find(x=>x.registry==='006');
          const icp5=(c5?.positions||[]).find(x=>x.assetId==='internet-computer');
          const icp6=(c6?.positions||[]).find(x=>x.assetId==='internet-computer');
          const icp=m.prices?.['internet-computer'];
          if(Number(yrBtc?.units)!==0.0334||Number(yrAero?.units)!==678) throw new Error('YieldRing canonical quantities not propagated');
          if(Number(icp5?.units)!==1363||Number(icp6?.units)!==1296)throw new Error('Company #005/#006 ICP balances missing');
          if(Math.abs(Number(icp5?.priceUsd)-Number(icp?.usd))>1e-9||Math.abs(Number(icp6?.priceUsd)-Number(icp?.usd))>1e-9)throw new Error('Company #005/#006 ICP recovery valuation not bound to canonical Market Data');
          if(c.authority?.executionAuthority!=='none') throw new Error('authority drift');
          NODE
      - name: Commit recovery state safely
        run: |
          set -euo pipefail
          git config user.name "The Holding Capital State"
          git config user.email "capital-state@theholding.ai"
          git add intelligence/capital-state/general-company-balance-sheet.json intelligence/capital-state/capital-state.json
          if git diff --cached --quiet; then echo "No Capital State changes."; exit 0; fi
          git commit -m "intelligence: refresh capital state"
          for attempt in 1 2 3; do
            git fetch origin main
            if ! git rebase origin/main; then git rebase --abort || true; echo "Safe writer guard: rebase conflict; refusing to guess."; exit 1; fi
            node - <<'NODE'
            const fs=require('fs');
            const m=JSON.parse(fs.readFileSync('intelligence/market-data/market-data.json','utf8'));
            const prices=m.prices||{};
            if(m.semantics?.perAssetAuthoritySelectionApplied!==true||Object.keys(prices).length!==26||Number(m.authority?.onchainSelectedAssetCount)!==26)throw new Error('Canonical Market Data lost during Capital recovery rebase');
            for(const [id,row] of Object.entries(prices))if(row?.authority?.selectedLane!=='onchain'||row?.authority?.fallbackUsed!==false)throw new Error(`${id}: onchain authority lost during Capital recovery rebase`);
            NODE
            NODE_OPTIONS='--import=${{ github.workspace }}/intelligence/market-data/coingecko-fetch-shim.mjs' node intelligence/capital-state/general-company-balance-sheet.mjs
            node intelligence/capital-state/capital-state.mjs
            git add intelligence/capital-state/general-company-balance-sheet.json intelligence/capital-state/capital-state.json
            git commit --amend --no-edit
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1
