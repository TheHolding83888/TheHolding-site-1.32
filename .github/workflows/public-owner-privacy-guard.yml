name: "The Holding Brain · Public Owner Privacy Guard"

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "intelligence/owner-context/**"
      - "intelligence/project-memory/THE_HOLDING_OWNER_OPERATING_CONTEXT_*.md"
  push:
    branches: [main]
    paths:
      - "intelligence/owner-context/**"
      - "intelligence/project-memory/THE_HOLDING_OWNER_OPERATING_CONTEXT_*.md"
      - ".github/workflows/public-owner-privacy-guard.yml"

permissions:
  contents: read

concurrency:
  group: public-owner-privacy-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'main' }}
  cancel-in-progress: true

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Static privacy preflight
        shell: bash
        run: |
          set -euo pipefail
          test -s intelligence/owner-context/public-owner-privacy-policy.json
          test -s intelligence/owner-context/public-owner-privacy-guard.mjs
          node --check intelligence/owner-context/public-owner-privacy-guard.mjs
          grep -q '"ownerContextIsNotOwnerIdentity": true' intelligence/owner-context/public-owner-privacy-policy.json
          grep -q '"personalDataPublicDisclosure": false' intelligence/owner-context/public-owner-privacy-policy.json
          grep -q '"connectorProfileMetadataMayBeCopiedIntoProject": false' intelligence/owner-context/public-owner-privacy-policy.json

      - name: Enforce public owner identity boundary
        run: node intelligence/owner-context/public-owner-privacy-guard.mjs

      - name: Verify no execution authority drift
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const p = require('./intelligence/owner-context/public-owner-privacy-policy.json');
          if (p.authority?.executionAuthority !== 'none') throw new Error('privacy layer gained execution authority');
          if (p.authority?.identityDisclosureAuthority !== 'none') throw new Error('privacy layer gained identity disclosure authority');
          if (p.boundary?.publicAskMayDisclosePersonalOwnerIdentity !== false) throw new Error('public Ask may disclose owner identity');
          if (p.rules?.neverInferPersonBehindCompany !== true) throw new Error('company/person inference boundary missing');
          console.log('Public Owner Privacy Boundary PASS');
          NODE
          git diff --check
