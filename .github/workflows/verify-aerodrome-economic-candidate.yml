name: Verify Economic Graph · Aerodrome shadow candidate

on:
  pull_request:
    paths:
      - 'intelligence/economic-graph/aerodrome-veaero-candidate.mjs'
      - 'intelligence/economic-graph/vlcvx-votium-candidate.mjs'
      - 'intelligence/economic-graph/economic-graph-canonical-runner.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout reviewed repository state
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Build canonical Graph with shadow candidates
        shell: bash
        run: |
          set -euo pipefail
          test -s intelligence/economic-graph/aerodrome-veaero-candidate.mjs
          test -s intelligence/economic-graph/vlcvx-votium-candidate.mjs
          test -s intelligence/economic-graph/economic-graph-canonical-runner.mjs
          test -s companies/productivity-data.json
          test -s companies/rewards-data.json
          node --check intelligence/economic-graph/aerodrome-veaero-candidate.mjs
          node --check intelligence/economic-graph/vlcvx-votium-candidate.mjs
          node --check intelligence/economic-graph/economic-graph-canonical-runner.mjs
          TMP="$(mktemp)"
          ECONOMIC_GRAPH_FILE="$TMP" node intelligence/economic-graph/economic-graph-canonical-runner.mjs

          node - "$TMP" <<'NODE'
          const fs=require('fs');
          const x=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          const id='defitea-aerodrome-veaero';
          const c=x.candidateCohorts?.[id];
          const o=c?.latest?.observation;
          const m=c?.latest?.movement;

          if(x.version!=='0.1-economic-graph'||x.engineVersion!=='0.2-defitea-fxn-curve-multi-cohort')throw new Error('Canonical Economic Graph compatibility changed');
          if(x.coverage?.status!=='partial-two-cohort'||Number(x.coverage?.cohortCount)!==2)throw new Error('Canonical two-cohort authority changed during shadow admission');
          if(x.authority?.readOnly!==true||x.authority?.executionAuthority!=='none'||x.authority?.causalClaimAuthority!=='none')throw new Error('Economic Graph authority regression');
          if(x.candidateLayer?.version!=='0.2-multi-candidate-shadow-admission'||x.candidateLayer?.status!=='shadow-admission-active')throw new Error('Multi-candidate shadow layer missing');
          if(Number(x.candidateLayer?.candidateCount)!==2||!x.candidateLayer?.candidateIds?.includes(id)||!x.candidateLayer?.candidateIds?.includes('defitea-convex-vlcvx-votium'))throw new Error('Shadow candidate registry mismatch');
          if(x.candidateLayer?.canonicalCohortCountUnchanged!==true||x.candidateLayer?.promotionAuthority!=='none')throw new Error('Shadow admission boundary missing');
          if(!c||c.status!=='shadow-measured-not-promoted'||c.cohortId!==id)throw new Error('Aerodrome candidate cohort missing');
          if(c.identity?.companyRegistry!=='004'||c.identity?.protocol!=='Aerodrome'||c.identity?.asset!=='AERO')throw new Error('Aerodrome candidate identity drift');
          if(c.attribution?.formulaProven!==true||c.attribution?.actualPositionContextMeasured!==true||c.attribution?.primaryDriver!==null||c.attribution?.promotionAuthority!=='none')throw new Error('Aerodrome candidate attribution boundary invalid');
          if(!o||o.status!=='shadow-measured-not-promoted')throw new Error('Aerodrome latest observation missing');
          if(o.referenceProductivity?.sourceUrl!=='https://www.40acres.finance/'||o.referenceProductivity?.sourceType!=='official-frontend')throw new Error('Aerodrome Reference source authority drift');
          if(o.referenceProductivity?.formula?.status!=='proven-canonical-collector-identity')throw new Error('Aerodrome Reference formula proof missing');
          if(Math.abs(Number(o.referenceProductivity?.formula?.parityDeltaPctPoints))>0.01)throw new Error('Aerodrome Reference APR parity failed');
          if(!Number.isFinite(Number(o.referenceProductivity?.formula?.weeklyExpectedVotingRewardsUsd))||!Number.isFinite(Number(o.referenceProductivity?.formula?.impliedVeNftValueUsd)))throw new Error('Aerodrome Reference formula inputs missing');
          if(!(Number(o.companyPosition?.productiveUnitsAero)>0)||!(Number(o.companyPosition?.productiveValueUsd)>0))throw new Error('Defitea productive AERO position missing');
          if(!(Number(o.actualManagedVeNft?.positionCount)>=1)||!Array.isArray(o.actualManagedVeNft?.positions)||o.actualManagedVeNft.positions.length<1)throw new Error('Defitea managed veNFT identity missing');
          if(!Number.isFinite(Number(o.actualManagedVeNft?.currentAccruedAero))||Number(o.actualManagedVeNft.currentAccruedAero)<0)throw new Error('Defitea managed AERO accrued state missing');
          if(!['ok','partial'].includes(o.actualManagedVeNft?.sourceStatus))throw new Error('Defitea Aerodrome Rewards source invalid');
          if(o.actualManagedVeNft?.stateClass!=='measured-current-company-compounding-context')throw new Error('Actual company state semantic class missing');
          if(o.epistemic?.mechanicalAttribution!=='proven-within-reference-simulator-formula'||o.epistemic?.companyRewardState!=='measured-context-not-reference-formula-input')throw new Error('Aerodrome formula vs actual-state separation missing');
          if(o.epistemic?.causalAttribution!=='unresolved-beyond-reference-formula'||o.epistemic?.primaryDriver!==null||o.epistemic?.promotionAuthority!=='none')throw new Error('Aerodrome causal/promotion authority leaked');
          if(!/^[0-9a-f]{64}$/i.test(o.provenance?.productivitySha256||'')||!/^[0-9a-f]{64}$/i.test(o.provenance?.rewardsSha256||''))throw new Error('Aerodrome exact source provenance missing');
          if(!Number.isFinite(Date.parse(o.referenceObservedAt))||!Number.isFinite(Date.parse(o.rewardsObservedAt)))throw new Error('Aerodrome source timestamps invalid');
          if(o.temporalBoundary?.rule?.includes('Never combine')!==true)throw new Error('Cross-source temporal boundary missing');
          if(Number(c.observationCount)!==1||m?.priorObservationId!==null)throw new Error('Fresh shadow candidate baseline history unexpected');

          console.log('AERODROME SHADOW CANDIDATE PASS',{
            canonicalCohorts:x.coverage.cohortCount,
            candidateCount:x.candidateLayer.candidateCount,
            referenceApr:o.referenceProductivity.canonicalAprPct,
            referenceParity:o.referenceProductivity.formula.parityDeltaPctPoints,
            managedVeNfts:o.actualManagedVeNft.positionCount,
            currentAccruedAero:o.actualManagedVeNft.currentAccruedAero,
            sourceSkewHours:o.temporalBoundary.sourceSkewHours,
            promotionAuthority:o.epistemic.promotionAuthority,
            executionAuthority:x.authority.executionAuthority
          });
          NODE
          rm -f "$TMP"
          git diff --check
