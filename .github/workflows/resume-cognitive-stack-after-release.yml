name: Resume Cognitive Stack After Release Repair

on:
  push:
    branches: [main]
    paths:
      - 'intelligence/cognitive-stack-release.json'

permissions:
  contents: read
  actions: write

concurrency:
  group: cognitive-release-resume
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      RECOVERY_PUSH_AT: ${{ github.event.head_commit.timestamp }}
    steps:
      - name: Checkout canonical main
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: main
          fetch-depth: 0

      - name: Wait for post-release Security publish
        run: |
          set -euo pipefail
          for attempt in $(seq 1 40); do
            git fetch origin main
            if git show origin/main:security/security-intelligence.json > /tmp/security-intelligence.json 2>/dev/null; then
              if node - <<'NODE'
          const fs = require('fs');
          const security = JSON.parse(fs.readFileSync('/tmp/security-intelligence.json', 'utf8'));
          const pushMs = Date.parse(process.env.RECOVERY_PUSH_AT || '');
          const securityMs = Date.parse(security.generatedAt || '');
          if (!Number.isFinite(pushMs) || !Number.isFinite(securityMs)) process.exit(1);
          if (securityMs < pushMs) process.exit(1);
          if (Number(security?.severityCounts?.critical || 0) > 0) throw new Error('Release recovery refuses Critical Security state');
          console.log('Post-release Security publish observed', { pushAt: process.env.RECOVERY_PUSH_AT, securityGeneratedAt: security.generatedAt });
          NODE
              then
                git reset --hard origin/main
                exit 0
              fi
            fi
            sleep 15
          done
          echo 'Timed out waiting for post-release Security publish.'
          exit 1

      - name: Require fresh Observer before recovery dispatch
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('fs');
          const change = JSON.parse(fs.readFileSync('intelligence/change-intelligence.json', 'utf8'));
          if (change.sourceHealth?.allFresh !== true) {
            throw new Error('Release recovery refuses stale Observer sources');
          }
          const generatedMs = Date.parse(change.generatedAt);
          const ageHours = (Date.now() - generatedMs) / 3600000;
          if (!Number.isFinite(generatedMs) || !Number.isFinite(ageHours) || ageHours < -0.25 || ageHours > 6) {
            throw new Error(`Release recovery requires Observer age <= 6h; current age=${ageHours}`);
          }
          console.log('Release recovery Observer gate PASS', {
            generatedAt: change.generatedAt,
            ageHours: Number(ageHours.toFixed(3)),
            allFresh: true
          });
          NODE

      - name: Verify release coherence before dispatch
        run: node intelligence/cognitive-release-guard.mjs

      - name: Dispatch canonical integrated Cognitive Stack
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run refresh-cognitive-stack.yml --ref main
