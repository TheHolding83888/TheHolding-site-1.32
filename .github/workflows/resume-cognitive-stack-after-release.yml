name: Resume Cognitive Stack After Release Repair

on:
  push:
    branches: [main]
    paths:
      - 'intelligence/cognitive-stack-release.json'
      - '.github/workflows/resume-cognitive-stack-after-release.yml'

permissions:
  contents: read
  actions: write

concurrency:
  group: cognitive-release-resume
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    env:
      RECOVERY_PUSH_AT: ${{ github.event.head_commit.timestamp }}
    steps:
      - name: Checkout canonical main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0

      - name: Wait for post-release Security publish
        run: |
          set -euo pipefail
          for attempt in $(seq 1 40); do
            git fetch origin main
            if git show origin/main:security/security-intelligence.json > /tmp/security-intelligence.json 2>/dev/null; then
              if node - <<'NODE'
          const fs = require('fs');
          const security = JSON.parse(fs.readFileSync('/tmp/security-intelligence.json', 'utf8'));
          const pushMs = Date.parse(process.env.RECOVERY_PUSH_AT || '');
          const securityMs = Date.parse(security.generatedAt || '');
          if (!Number.isFinite(pushMs) || !Number.isFinite(securityMs)) process.exit(1);
          if (securityMs < pushMs) process.exit(1);
          if (Number(security?.severityCounts?.critical || 0) > 0) throw new Error('Release recovery refuses Critical Security state');
          console.log('Post-release Security publish observed', { pushAt: process.env.RECOVERY_PUSH_AT, securityGeneratedAt: security.generatedAt });
          NODE
              then
                git reset --hard origin/main
                exit 0
              fi
            fi
            sleep 15
          done
          echo 'Timed out waiting for post-release Security publish.'
          exit 1

      - name: Require fresh Observer before recovery dispatch
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('fs');
          const change = JSON.parse(fs.readFileSync('intelligence/change-intelligence.json', 'utf8'));
          if (change.sourceHealth?.allFresh !== true) {
            throw new Error('Release recovery refuses stale Observer sources');
          }
          const generatedMs = Date.parse(change.generatedAt);
          const ageHours = (Date.now() - generatedMs) / 3600000;
          if (!Number.isFinite(generatedMs) || !Number.isFinite(ageHours) || ageHours < -0.25 || ageHours > 6) {
            throw new Error(`Release recovery requires Observer age <= 6h; current age=${ageHours}`);
          }
          console.log('Release recovery Observer gate PASS', {
            generatedAt: change.generatedAt,
            ageHours: Number(ageHours.toFixed(3)),
            allFresh: true
          });
          NODE

      - name: Verify release coherence before dispatch
        run: node intelligence/cognitive-release-guard.mjs

      - name: Dispatch and await canonical integrated Cognitive Stack
        id: cognitive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          before_id="$(gh run list --workflow refresh-cognitive-stack.yml --event workflow_dispatch --limit 1 --json databaseId --jq '.[0].databaseId // empty')"
          dispatched_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          gh workflow run refresh-cognitive-stack.yml --ref main

          cognitive_run_id=""
          for attempt in $(seq 1 40); do
            cognitive_run_id="$(
              gh run list \
                --workflow refresh-cognitive-stack.yml \
                --event workflow_dispatch \
                --limit 10 \
                --json databaseId,createdAt \
                --jq "[.[] | select((.databaseId | tostring) != \"${before_id}\" and .createdAt >= \"${dispatched_at}\")] | sort_by(.createdAt) | last | .databaseId // empty"
            )"
            if [ -n "$cognitive_run_id" ]; then break; fi
            sleep 5
          done
          if [ -z "$cognitive_run_id" ]; then
            echo 'Could not identify the recovery-dispatched Cognitive Stack run.'
            exit 1
          fi

          echo "cognitive_run_id=$cognitive_run_id" >> "$GITHUB_OUTPUT"
          echo "Awaiting recovery-dispatched Cognitive Stack run $cognitive_run_id"
          gh run watch "$cognitive_run_id" --exit-status --interval 5

      - name: Dispatch and await canonical Learning after Cognitive success
        id: learning
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          before_id="$(gh run list --workflow update-learning-loop.yml --event workflow_dispatch --limit 1 --json databaseId --jq '.[0].databaseId // empty')"
          dispatched_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "Cognitive Stack run ${{ steps.cognitive.outputs.cognitive_run_id }} succeeded; dispatching Learning on canonical main."
          gh workflow run update-learning-loop.yml --ref main

          learning_run_id=""
          for attempt in $(seq 1 40); do
            learning_run_id="$(
              gh run list \
                --workflow update-learning-loop.yml \
                --event workflow_dispatch \
                --limit 10 \
                --json databaseId,createdAt \
                --jq "[.[] | select((.databaseId | tostring) != \"${before_id}\" and .createdAt >= \"${dispatched_at}\")] | sort_by(.createdAt) | last | .databaseId // empty"
            )"
            if [ -n "$learning_run_id" ]; then break; fi
            sleep 5
          done
          if [ -z "$learning_run_id" ]; then
            echo 'Could not identify the recovery-dispatched Learning run.'
            exit 1
          fi

          echo "learning_run_id=$learning_run_id" >> "$GITHUB_OUTPUT"
          echo "Awaiting recovery-dispatched Learning run $learning_run_id"
          gh run watch "$learning_run_id" --exit-status --interval 5

      - name: Dispatch and await Proposal after Learning success
        id: proposal
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          before_id="$(gh run list --workflow update-proposal-work-queue.yml --event workflow_dispatch --limit 1 --json databaseId --jq '.[0].databaseId // empty')"
          dispatched_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "Learning run ${{ steps.learning.outputs.learning_run_id }} succeeded; dispatching Proposal Work Queue on canonical main."
          gh workflow run update-proposal-work-queue.yml --ref main

          proposal_run_id=""
          for attempt in $(seq 1 40); do
            proposal_run_id="$(
              gh run list \
                --workflow update-proposal-work-queue.yml \
                --event workflow_dispatch \
                --limit 10 \
                --json databaseId,createdAt \
                --jq "[.[] | select((.databaseId | tostring) != \"${before_id}\" and .createdAt >= \"${dispatched_at}\")] | sort_by(.createdAt) | last | .databaseId // empty"
            )"
            if [ -n "$proposal_run_id" ]; then break; fi
            sleep 5
          done
          if [ -z "$proposal_run_id" ]; then
            echo 'Could not identify the recovery-dispatched Proposal run.'
            exit 1
          fi

          echo "proposal_run_id=$proposal_run_id" >> "$GITHUB_OUTPUT"
          echo "Awaiting recovery-dispatched Proposal run $proposal_run_id"
          gh run watch "$proposal_run_id" --exit-status --interval 5

      - name: Dispatch and await Downstream Continuity after Proposal success
        id: downstream
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          before_id="$(gh run list --workflow refresh-downstream-continuity.yml --event workflow_dispatch --limit 1 --json databaseId --jq '.[0].databaseId // empty')"
          dispatched_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "Proposal run ${{ steps.proposal.outputs.proposal_run_id }} succeeded; dispatching Downstream Continuity on canonical main."
          gh workflow run refresh-downstream-continuity.yml --ref main

          downstream_run_id=""
          for attempt in $(seq 1 40); do
            downstream_run_id="$(
              gh run list \
                --workflow refresh-downstream-continuity.yml \
                --event workflow_dispatch \
                --limit 10 \
                --json databaseId,createdAt \
                --jq "[.[] | select((.databaseId | tostring) != \"${before_id}\" and .createdAt >= \"${dispatched_at}\")] | sort_by(.createdAt) | last | .databaseId // empty"
            )"
            if [ -n "$downstream_run_id" ]; then break; fi
            sleep 5
          done
          if [ -z "$downstream_run_id" ]; then
            echo 'Could not identify the recovery-dispatched Downstream Continuity run.'
            exit 1
          fi

          echo "downstream_run_id=$downstream_run_id" >> "$GITHUB_OUTPUT"
          echo "Awaiting recovery-dispatched Downstream Continuity run $downstream_run_id"
          gh run watch "$downstream_run_id" --exit-status --interval 5

      - name: Dispatch and await Project Memory after downstream success
        id: memory
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          before_id="$(gh run list --workflow update-project-memory-bootstrap.yml --event workflow_dispatch --limit 1 --json databaseId --jq '.[0].databaseId // empty')"
          dispatched_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "Downstream run ${{ steps.downstream.outputs.downstream_run_id }} succeeded; dispatching Project Memory Bootstrap on canonical main."
          gh workflow run update-project-memory-bootstrap.yml --ref main

          memory_run_id=""
          for attempt in $(seq 1 40); do
            memory_run_id="$(
              gh run list \
                --workflow update-project-memory-bootstrap.yml \
                --event workflow_dispatch \
                --limit 10 \
                --json databaseId,createdAt \
                --jq "[.[] | select((.databaseId | tostring) != \"${before_id}\" and .createdAt >= \"${dispatched_at}\")] | sort_by(.createdAt) | last | .databaseId // empty"
            )"
            if [ -n "$memory_run_id" ]; then break; fi
            sleep 5
          done
          if [ -z "$memory_run_id" ]; then
            echo 'Could not identify the recovery-dispatched Project Memory run.'
            exit 1
          fi

          echo "memory_run_id=$memory_run_id" >> "$GITHUB_OUTPUT"
          echo "Awaiting recovery-dispatched Project Memory run $memory_run_id"
          gh run watch "$memory_run_id" --exit-status --interval 5

      - name: Dispatch and await Intelligence Progress after Project Memory success
        id: progress
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          before_id="$(gh run list --workflow update-intelligence-progress.yml --event workflow_dispatch --limit 1 --json databaseId --jq '.[0].databaseId // empty')"
          dispatched_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "Project Memory run ${{ steps.memory.outputs.memory_run_id }} succeeded; dispatching Intelligence Progress on canonical main."
          gh workflow run update-intelligence-progress.yml --ref main

          progress_run_id=""
          for attempt in $(seq 1 40); do
            progress_run_id="$(
              gh run list \
                --workflow update-intelligence-progress.yml \
                --event workflow_dispatch \
                --limit 10 \
                --json databaseId,createdAt \
                --jq "[.[] | select((.databaseId | tostring) != \"${before_id}\" and .createdAt >= \"${dispatched_at}\")] | sort_by(.createdAt) | last | .databaseId // empty"
            )"
            if [ -n "$progress_run_id" ]; then break; fi
            sleep 5
          done
          if [ -z "$progress_run_id" ]; then
            echo 'Could not identify the recovery-dispatched Intelligence Progress run.'
            exit 1
          fi

          echo "progress_run_id=$progress_run_id" >> "$GITHUB_OUTPUT"
          echo "Awaiting recovery-dispatched Intelligence Progress run $progress_run_id"
          gh run watch "$progress_run_id" --exit-status --interval 5
