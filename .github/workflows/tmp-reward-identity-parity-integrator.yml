name: "TMP · Reward identity parity integrator"

on:
  push:
    branches:
      - memory/passport-label-inheritance-2026-08-19
    paths:
      - '.github/workflows/tmp-reward-identity-parity-integrator.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: memory/passport-label-inheritance-2026-08-19
          fetch-depth: 0
      - name: Apply proven reward identity parity
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          # Shared Passport renderer labels.
          p=Path('companies/index.html')
          s=p.read_text()
          replacements={
            "'frax-yield': 'Frax',":"'frax-yield': 'Frax · veFRAX',",
            "'venice-staking': 'Venice',":"'venice-staking': 'Venice · sVVV',",
            "'resupply-staking': 'Resupply',":"'resupply-staking': 'Resupply · staked RSUP',"
          }
          for old,new in replacements.items():
            count=s.count(old)
            if count != 1:
              raise SystemExit(f'Expected exactly one renderer label occurrence, got {count}: {old}')
            s=s.replace(old,new)
          p.write_text(s)

          # Canonical generated Rewards hygiene so data and renderer agree.
          hp=Path('rewards/rewards-passport-hygiene.mjs')
          h=hp.read_text()
          needle="  ['liquity-staking','Liquity · staked LQTY'],\n"
          if h.count(needle) != 1:
            raise SystemExit('Rewards hygiene insertion anchor drift')
          insert=(needle
            + "  ['frax-yield','Frax · veFRAX'],\n"
            + "  ['venice-staking','Venice · sVVV'],\n"
            + "  ['resupply-staking','Resupply · staked RSUP'],\n")
          h=h.replace(needle,insert)
          hp.write_text(h)

          # Extend durable inheritance memory with these now-proven route identities.
          mp=Path('intelligence/project-memory/THE_HOLDING_COMPANY_PASSPORT_INHERITANCE_CANON_2026-08-19.md')
          m=mp.read_text()
          anchor='Current examples include `Aerodrome · veAERO`, `Velodrome · veVELO`, `Curve · veCRV`, `Frax · veFRAX`, `Yield Basis · veYB`, `Pendle · sPENDLE`, `f(x) Protocol · veFXN`, `Liquity · staked LQTY`, `Stake DAO · 4pool stables`, and `Convex · staked cvxCRV`.'
          replacement='Current examples include `Aerodrome · veAERO`, `Velodrome · veVELO`, `Curve · veCRV`, `Frax · veFRAX`, `Yield Basis · veYB`, `Pendle · sPENDLE`, `f(x) Protocol · veFXN`, `Liquity · staked LQTY`, `Venice · sVVV`, `Resupply · staked RSUP`, `Stake DAO · 4pool stables`, and `Convex · staked cvxCRV`.'
          if m.count(anchor) != 1:
            raise SystemExit('Passport inheritance canon anchor drift')
          mp.write_text(m.replace(anchor,replacement))

          # Non-workflow verifier: reusable CI/check script can be called by this run and future workflows.
          vp=Path('rewards/verify-reward-identity-parity.mjs')
          vp.write_text(r'''import fs from 'node:fs';

const html=fs.readFileSync('companies/index.html','utf8');
const hygiene=fs.readFileSync('rewards/rewards-passport-hygiene.mjs','utf8');
const engine=fs.readFileSync('rewards/company-rewards-engine.mjs','utf8');
const productivity=JSON.parse(fs.readFileSync('companies/productivity-data.json','utf8'));
const memory=fs.readFileSync('intelligence/project-memory/THE_HOLDING_COMPANY_PASSPORT_INHERITANCE_CANON_2026-08-19.md','utf8');

const labels={
  'frax-yield':'Frax · veFRAX',
  'venice-staking':'Venice · sVVV',
  'resupply-staking':'Resupply · staked RSUP'
};
for(const [route,label] of Object.entries(labels)){
  if(!html.includes(`'${route}': '${label}'`))throw new Error(`renderer label missing: ${route}`);
  if(!hygiene.includes(`['${route}','${label}']`))throw new Error(`hygiene label missing: ${route}`);
}
if(!memory.includes('Venice · sVVV')||!memory.includes('Resupply · staked RSUP'))throw new Error('durable inheritance labels missing');

for(const company of ['05081966.eth','YieldRing.eth','defitea.eth']){
  const block=engine.includes(`name: '${company}'`);
  if(!block)throw new Error(`company route registry missing: ${company}`);
}
for(const company of ['05081966.eth','YieldRing.eth','defitea.eth']){
  const start=engine.indexOf(`name: '${company}'`);
  const next=engine.indexOf("\n  {\n    name:", start+1);
  const block=engine.slice(start,next<0?engine.length:next);
  if(!block.includes("'frax-yield'"))throw new Error(`Frax route missing from ${company}`);
}
const defStart=engine.indexOf("name: 'defitea.eth'");
const defNext=engine.indexOf("\n  {\n    name:", defStart+1);
const defBlock=engine.slice(defStart,defNext);
for(const route of ['venice-staking','resupply-staking'])if(!defBlock.includes(`'${route}'`))throw new Error(`Defitea route missing: ${route}`);

const frax=productivity.engines?.frax_vefrax;
const venice=productivity.engines?.venice_svvv;
const resupply=productivity.engines?.resupply_rsup;
if(frax?.sourceMetric!=='Fraxtal veFRAX/veFXS APR')throw new Error('Frax productive identity evidence drift');
if(venice?.sourceMetric!=='VVV emissionRatePerSecond / total sVVV supply')throw new Error('Venice productive identity evidence drift');
if(resupply?.sourceMetric!=='Staked RSUP vAPR')throw new Error('Resupply productive identity evidence drift');

console.log('Reward productive identity parity PASS',labels);
''')
          PY

          node rewards/verify-reward-identity-parity.mjs
          node --check rewards/rewards-passport-hygiene.mjs
          cp companies/rewards-data.json /tmp/rewards-after.json
          REWARDS_OUTPUT=/tmp/rewards-after.json node rewards/rewards-passport-hygiene.mjs
          node - <<'NODE'
          const data=require('/tmp/rewards-after.json');
          const expected={'frax-yield':'Frax · veFRAX','venice-staking':'Venice · sVVV','resupply-staking':'Resupply · staked RSUP'};
          const required={
            '05081966.eth':['frax-yield'],
            'YieldRing.eth':['frax-yield'],
            'defitea.eth':['frax-yield','venice-staking','resupply-staking']
          };
          for(const [company,routes] of Object.entries(required)){
            const c=data.companies?.[company];
            if(!c)throw new Error(`missing canonical Rewards company ${company}`);
            for(const route of routes){
              const rows=[...(c.rewards||[]),...(c.sources||[]),...(c.embeddedIncome||[])].filter(x=>x?.route===route);
              if(!rows.length)throw new Error(`${company} missing ${route} rows`);
              for(const row of rows)if(row.protocol!==expected[route])throw new Error(`${company} ${route} label drift: ${row.protocol}`);
            }
          }
          if(data.diagnostics?.rewardsPassportHygiene?.executionAuthority!=='none')throw new Error('execution authority drift');
          console.log('Canonical Rewards fixture identity parity PASS');
          NODE

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add companies/index.html rewards/rewards-passport-hygiene.mjs rewards/verify-reward-identity-parity.mjs intelligence/project-memory/THE_HOLDING_COMPANY_PASSPORT_INHERITANCE_CANON_2026-08-19.md
          git commit -m "rewards: complete productive identity labels"
          git push origin HEAD:memory/passport-label-inheritance-2026-08-19
