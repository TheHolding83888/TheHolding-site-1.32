name: "TMP · Reward identity parity integrator"

on:
  push:
    branches:
      - memory/passport-label-inheritance-2026-08-19
    paths:
      - '.github/workflows/tmp-reward-identity-parity-integrator.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: memory/passport-label-inheritance-2026-08-19
          fetch-depth: 0
      - name: Apply reward identity + memory routing parity
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          # 1) Shared Company Passport renderer.
          p=Path('companies/index.html')
          s=p.read_text()
          replacements={
            "'frax-yield': 'Frax',":"'frax-yield': 'Frax · veFRAX',",
            "'venice-staking': 'Venice',":"'venice-staking': 'Venice · sVVV',",
            "'resupply-staking': 'Resupply',":"'resupply-staking': 'Resupply · staked RSUP',"
          }
          for old,new in replacements.items():
            n=s.count(old)
            if n != 1:
              raise SystemExit(f'renderer anchor drift {n}: {old}')
            s=s.replace(old,new)
          p.write_text(s)

          # 2) Canonical Rewards hygiene so generated data and renderer agree.
          hp=Path('rewards/rewards-passport-hygiene.mjs')
          h=hp.read_text()
          anchor="  ['liquity-staking','Liquity · staked LQTY'],\n"
          if h.count(anchor) != 1:
            raise SystemExit('Rewards hygiene anchor drift')
          addition=(anchor
            + "  ['frax-yield','Frax · veFRAX'],\n"
            + "  ['venice-staking','Venice · sVVV'],\n"
            + "  ['resupply-staking','Resupply · staked RSUP'],\n")
          hp.write_text(h.replace(anchor,addition))

          # 3) Durable inheritance canon includes the complete proven label set.
          cp=Path('intelligence/project-memory/THE_HOLDING_COMPANY_PASSPORT_INHERITANCE_CANON_2026-08-19.md')
          c=cp.read_text()
          old='Current examples include `Aerodrome · veAERO`, `Velodrome · veVELO`, `Curve · veCRV`, `Frax · veFRAX`, `Yield Basis · veYB`, `Pendle · sPENDLE`, `f(x) Protocol · veFXN`, `Liquity · staked LQTY`, `Stake DAO · 4pool stables`, and `Convex · staked cvxCRV`.'
          new='Current examples include `Aerodrome · veAERO`, `Velodrome · veVELO`, `Curve · veCRV`, `Frax · veFRAX`, `Yield Basis · veYB`, `Pendle · sPENDLE`, `f(x) Protocol · veFXN`, `Liquity · staked LQTY`, `Venice · sVVV`, `Resupply · staked RSUP`, `Stake DAO · 4pool stables`, and `Convex · staked cvxCRV`.'
          if c.count(old) != 1:
            raise SystemExit('inheritance canon anchor drift')
          cp.write_text(c.replace(old,new))

          # 4) Make the canon deterministically discoverable from CURRENT -> Routing Index.
          rp=Path('intelligence/project-memory/THE_HOLDING_MEMORY_ROUTING_INDEX_2026-08-18.md')
          r=rp.read_text()
          canon='- `THE_HOLDING_COMPANY_PASSPORT_INHERITANCE_CANON_2026-08-19.md`\n'
          anchors=[
            '- `THE_HOLDING_KNOWN_MECHANISM_REUSE_AND_PROMOTION_CANON_2026-08-18.md`\n- `THE_HOLDING_HISTORICAL_OPERATING_KNOWLEDGE_v1_2026-08-14.md`',
            '- `THE_HOLDING_REWARDS_DRAWER_UI_CANON_2026-08-18.md`\n- `THE_HOLDING_KNOWN_MECHANISM_REUSE_AND_PROMOTION_CANON_2026-08-18.md`',
            '- `THE_HOLDING_PASSPORT_RESPONSIVE_UI_CANON_2026-08-18.md`\n- latest master continuity'
          ]
          replacements=[
            '- `THE_HOLDING_KNOWN_MECHANISM_REUSE_AND_PROMOTION_CANON_2026-08-18.md`\n'+canon+'- `THE_HOLDING_HISTORICAL_OPERATING_KNOWLEDGE_v1_2026-08-14.md`',
            '- `THE_HOLDING_REWARDS_DRAWER_UI_CANON_2026-08-18.md`\n'+canon+'- `THE_HOLDING_KNOWN_MECHANISM_REUSE_AND_PROMOTION_CANON_2026-08-18.md`',
            '- `THE_HOLDING_PASSPORT_RESPONSIVE_UI_CANON_2026-08-18.md`\n'+canon+'- latest master continuity'
          ]
          for old,new in zip(anchors,replacements):
            n=r.count(old)
            if n != 1:
              raise SystemExit(f'routing anchor drift {n}: {old}')
            r=r.replace(old,new)
          rp.write_text(r)

          # Local fail-closed proof before pushing.
          if rp.read_text().count('THE_HOLDING_COMPANY_PASSPORT_INHERITANCE_CANON_2026-08-19.md') < 3:
            raise SystemExit('inheritance canon is not routed through onboarding + rewards + passport')
          if 'Memory Routing Index' not in Path('intelligence/project-memory/CURRENT.md').read_text():
            raise SystemExit('CURRENT no longer routes through Memory Routing Index')
          PY

          node --check rewards/rewards-passport-hygiene.mjs
          cp companies/rewards-data.json /tmp/rewards-before.json
          cp companies/rewards-data.json /tmp/rewards-after.json
          REWARDS_OUTPUT=/tmp/rewards-after.json node rewards/rewards-passport-hygiene.mjs
          node - <<'NODE'
          const fs=require('fs');
          const before=JSON.parse(fs.readFileSync('/tmp/rewards-before.json','utf8'));
          const after=JSON.parse(fs.readFileSync('/tmp/rewards-after.json','utf8'));
          const expected={'frax-yield':'Frax · veFRAX','venice-staking':'Venice · sVVV','resupply-staking':'Resupply · staked RSUP'};
          const required={'05081966.eth':['frax-yield'],'YieldRing.eth':['frax-yield'],'defitea.eth':['frax-yield','venice-staking','resupply-staking']};
          for(const [company,routes] of Object.entries(required)){
            const c=after.companies?.[company];
            if(!c) throw new Error(`missing company ${company}`);
            for(const route of routes){
              const rows=[...(c.rewards||[]),...(c.sources||[]),...(c.embeddedIncome||[])].filter(x=>x?.route===route);
              if(!rows.length) throw new Error(`${company} missing ${route}`);
              for(const row of rows) if(row.protocol!==expected[route]) throw new Error(`${company} ${route} label=${row.protocol}`);
            }
          }
          const keys=['totalUsd','knownAccruedUsd','claimableUsd','measuredEmbeddedUsd','measuredEarnedUsd'];
          for(const [name,b] of Object.entries(before.companies||{})){
            const a=after.companies?.[name]; if(!a) throw new Error(`company disappeared ${name}`);
            for(const k of keys){
              const bv=b[k]??null,av=a[k]??null;
              if(JSON.stringify(bv)!==JSON.stringify(av)) throw new Error(`${name} economic aggregate changed ${k}: ${bv} -> ${av}`);
            }
          }
          if(after.diagnostics?.rewardsPassportHygiene?.executionAuthority!=='none') throw new Error('execution authority drift');
          console.log('Reward identity parity + economics invariance PASS');
          NODE

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add companies/index.html rewards/rewards-passport-hygiene.mjs intelligence/project-memory/THE_HOLDING_COMPANY_PASSPORT_INHERITANCE_CANON_2026-08-19.md intelligence/project-memory/THE_HOLDING_MEMORY_ROUTING_INDEX_2026-08-18.md
          git commit -m "rewards: route productive identity inheritance"
          git push origin HEAD:memory/passport-label-inheritance-2026-08-19
