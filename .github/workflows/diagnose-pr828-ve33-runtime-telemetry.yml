name: Diagnose PR828 ve33 Runtime Telemetry

on:
  push:
    branches:
      - diagnostic/pr828-ve33-runtime-telemetry-20260915
    paths:
      - '.github/workflows/diagnose-pr828-ve33-runtime-telemetry.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install runtime dependency
        run: npm install --no-save --no-package-lock ethers@6
      - name: Run production-shaped ve33 builder and print settlement telemetry
        env:
          REWARDS_DATA_FILE: ./companies/rewards-data.json
          VE33_EVIDENCE_FILE: /tmp/ve33-accounting-evidence.json
          VE33_STATE_READ_CONCURRENCY: '2'
          VE33_SETTLEMENT_CONCURRENCY: '2'
          VE33_SETTLEMENT_ADDRESS_GROUP_SIZE: '96'
          BASE_RPC_URL: ${{ secrets.BASE_RPC_URL || 'https://base-rpc.publicnode.com' }}
          OPTIMISM_RPC_URL: ${{ secrets.OPTIMISM_RPC_URL || 'https://gateway.tenderly.co/public/optimism' }}
        run: |
          set -euo pipefail
          cp reporting/ve33-accounting-evidence.json "$VE33_EVIDENCE_FILE"
          node reporting/ve33-accounting-evidence.mjs
          node - <<'NODE'
          const fs=require('fs');
          const e=JSON.parse(fs.readFileSync('/tmp/ve33-accounting-evidence.json','utf8'));
          const out={
            generatedAt:e.generatedAt,
            status:e.status,
            runtimeMs:e.diagnostics?.runtimeMs,
            laneCount:e.diagnostics?.laneCount,
            reconciliationCount:e.diagnostics?.reconciliationCount,
            settlementQueryFailureCount:e.diagnostics?.settlementQueryFailureCount,
            unresolvedSettlementCount:e.diagnostics?.unresolvedSettlementCount,
            protocols:Object.fromEntries(Object.entries(e.diagnostics?.protocols||{}).map(([k,v])=>[k,{
              runtimeMs:v.runtimeMs,
              laneCount:v.laneCount,
              intervalCount:v.intervalCount,
              settlementEventCount:v.settlementEventCount,
              settlementQueryFailureCount:v.settlementQueryFailureCount,
              currentStateFailureCount:v.currentStateFailureCount,
              boundaryFailures:v.boundaryFailures,
              settlementRpc:v.settlementRpc
            }]))
          };
          console.log('PR828_VE33_RUNTIME_TELEMETRY='+JSON.stringify(out,null,2));
          NODE
