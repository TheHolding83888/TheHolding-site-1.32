name: "Ask candidate · Claimables Repair"

on:
  push:
    branches:
      - agents/ask-owner-synthesis-v0.7-20260815
    paths:
      - '.github/workflows/_ask_claimables_repair_candidate.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout candidate
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: agents/ask-owner-synthesis-v0.7-20260815
          fetch-depth: 0
      - name: Repair plural fuzzy class and self-clean
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('agents/console/app.js')
          s=p.read_text()
          old="'rewards', 'reward', 'claimable', 'companies'"
          new="'rewards', 'reward', 'claimable', 'claimables', 'companies'"
          if new not in s:
              if old not in s: raise SystemExit('expected fuzzy lexeme anchor missing')
              s=s.replace(old,new,1)
              p.write_text(s)
          PY
          node --check agents/console/app.js
          grep -F "'claimable', 'claimables'" agents/console/app.js >/dev/null
          rm -f .github/workflows/_ask_claimables_repair_candidate.yml
          git config user.name "The Holding Production Integrator"
          git config user.email "production-integrator@theholding.ai"
          git add -A
          git diff --check --cached
          git commit -m "Ask v0.7: generalize claimable plural typo recovery"
          git push origin HEAD:agents/ask-owner-synthesis-v0.7-20260815
