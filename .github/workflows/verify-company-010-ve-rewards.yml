name: "Verify Company #010 · ve Rewards"

on:
  pull_request:
    branches: [main]
    paths:
      - 'rewards/company-010-ve-rewards.mjs'
      - 'rewards/company-010-rewards-overlay.mjs'
      - '.github/workflows/update-company-rewards.yml'
      - 'companies/company-010-public-adapter.js'
      - 'intelligence/project-memory/THE_HOLDING_KNOWN_MECHANISM_REUSE_AND_PROMOTION_CANON_2026-08-18.md'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Syntax
        run: |
          set -euo pipefail
          node --check rewards/company-010-ve-rewards.mjs
          node --check rewards/company-010-rewards-overlay.mjs
          node --check companies/company-010-public-adapter.js
      - name: Install bounded dependency
        run: npm install --no-save --no-package-lock ethers@6
      - name: Read Company #010 ve state
        env:
          BASE_RPC_URL: ${{ secrets.BASE_RPC_URL }}
          BASE_RPC_URL_2: ${{ secrets.BASE_RPC_URL_2 }}
          OPTIMISM_RPC_URL: ${{ secrets.OPTIMISM_RPC_URL }}
        run: node rewards/company-010-ve-rewards.mjs
      - name: Verify exact ve custody semantics
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs');const d=JSON.parse(fs.readFileSync('/tmp/company-010-ve-rewards.json','utf8'));
          if(d.version!=='0.1-company-010-ve-reward-state'||d.company!=='Cypher')throw new Error('Company #010 ve state contract missing');
          if(d.walletScope?.alias!=='Wallet 2'||String(d.walletScope?.address).toLowerCase()!=='0x64688f4adc3f72cdb44d07e4879c724cd7025696')throw new Error('Company #010 ve wallet scope drift');
          for(const key of ['aerodrome','velodrome']){
            const x=d.routes?.[key];
            if(!x||!['ok','partial'].includes(x.status)||!(Number(x.veNftCount)>0))throw new Error(key+' ve position not measured');
            if(!['managed-compounded','direct','mixed'].includes(x.mode))throw new Error(key+' custody mode unresolved');
            if(x.mode==='managed-compounded'&&x.publicState!=='Compounded')throw new Error(key+' managed reward must be Compounded');
            if(x.mode==='direct'&&x.publicState!=='Claimable')throw new Error(key+' direct reward must be Claimable');
          }
          if(d.authority?.executionAuthority!=='none')throw new Error('authority drift');
          console.log('Company #010 exact ve custody PASS',Object.fromEntries(Object.entries(d.routes).map(([k,v])=>[k,{status:v.status,veNftCount:v.veNftCount,mode:v.mode,publicState:v.publicState,compounded:v.compounded?.amount,claimable:v.claimable?.amount}])));
          NODE
      - name: Build Company #010 rewards overlay and verify known-mechanism parity
        run: |
          set -euo pipefail
          node rewards/company-010-rewards-overlay.mjs
          node - <<'NODE'
          const fs=require('fs');
          const d=JSON.parse(fs.readFileSync('companies/rewards-data.json','utf8')),c=d.companies?.Cypher;
          const finite=x=>x!==null&&x!==undefined&&x!==''&&Number.isFinite(Number(x));
          const capability=d.diagnostics?.company010?.capability;
          const compatibleCapabilities=[
            'crv-and-ve-reward-semantics-0.4-measured-earned-presentation-parity',
            'crv-ve-and-projectx-reward-semantics-0.5-multileg-parity'
          ];
          if(!compatibleCapabilities.includes(capability))throw new Error('ve measured-earned presentation parity capability marker missing/incompatible: '+capability);
          const embeddedUsd=[];
          for(const route of ['aerodrome-ve','velodrome-ve-direct']){
            const s=(c?.sources||[]).find(x=>x.route===route);
            if(!s||!['ok','partial'].includes(s.status)||!['Compounded','Claimable'].includes(s.details?.rewardState))throw new Error('measured public state missing: '+route);
            if(s.details?.rewardState==='Compounded'){
              const e=(c.embeddedIncome||[]).find(x=>x.route===route&&x.state==='Compounded');
              if(!e||e.claimableApplicable!==false||e.classification!=='compounded-locked'||!(Number(e.amount)>0))throw new Error('Compounded economic row missing: '+route);
              if(!finite(e.priceUsd)||!(Number(e.priceUsd)>0)||!finite(e.usdValue)||!(Number(e.usdValue)>0)||!e.priceMethod)throw new Error('known mechanism USD parity missing: '+route);
              const expected=Number(e.amount)*Number(e.priceUsd);
              if(Math.abs(Number(e.usdValue)-expected)>0.00001)throw new Error(`embedded USD arithmetic mismatch ${route}: ${e.usdValue} != ${expected}`);
              if(e.usdValueIncludedInClaimableTotal!==false)throw new Error('embedded claimable exclusion missing: '+route);
              if(e.usdValueIncludedInMeasuredEarnedTotal!==true)throw new Error('priced embedded income missing measured-earned admission: '+route);
              embeddedUsd.push({route,amount:e.amount,priceUsd:e.priceUsd,usdValue:e.usdValue});
            }
          }
          const claimableOnly=(c.rewards||[]).reduce((s,x)=>s+(finite(x.usdValue)?Number(x.usdValue):0),0);
          if(Math.abs(Number(c.knownAccruedUsd)-claimableOnly)>0.000001||Math.abs(Number(c.claimableUsd)-claimableOnly)>0.000001||Math.abs(Number(c.totalUsd)-claimableOnly)>0.000001)throw new Error('Compounded embedded USD leaked into claimable total');
          const embeddedOnly=(c.embeddedIncome||[]).reduce((s,x)=>s+(finite(x.usdValue)?Number(x.usdValue):0),0);
          if(Math.abs(Number(c.measuredEmbeddedUsd)-embeddedOnly)>0.000001)throw new Error('measured embedded total mismatch');
          if(Math.abs(Number(c.measuredEarnedUsd)-(claimableOnly+embeddedOnly))>0.000001)throw new Error('measured earned total mismatch');
          if(c.measuredEarnedUsdIsComplete!==false)throw new Error('measured earned incomplete-state guard missing');
          const votium=(c?.sources||[]).find(x=>x.route==='votium-union');
          if(!votium||votium.status!=='warming'||votium.details?.unknownIsNotZero!==true)throw new Error('Votium must remain unresolved');
          if(c.totalUsdIsComplete!==false||c.settlement?.unknownRouteIsNotZero!==true)throw new Error('partial-total guard missing');
          console.log('Company #010 rewards overlay dual-total known-mechanism parity PASS',{capability,embeddedUsd,claimableOnly,measuredEarnedUsd:c.measuredEarnedUsd});
          NODE
      - name: Verify public measured-earned projection and fail-closed unknown pricing
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs');const a=fs.readFileSync('companies/company-010-public-adapter.js','utf8');
          for(const x of ['v0.10.2-measured-earned-presentation-parity','compactEmbeddedAmount','finite(x.usdValue)?money2(x.usdValue):','measuredEarnedTotal','syncMeasuredEarnedPresentation','`${symbol} · ${chain} · Rebase`',"amountMeta:stateName==='Compounded'?embedded.usd:''"])if(!a.includes(x))throw new Error('public measured-earned projection missing: '+x);
          if(a.includes('Embedded income · ${embedded.usd}')||a.includes('Yield remains inside the managed veNFT'))throw new Error('legacy Cypher-specific ve presentation remains');
          if(a.includes("finite(x.usdValue)?money2(x.usdValue):money2(0)"))throw new Error('unknown embedded price rendered as fake zero USD');
          for(const x of ['const original=renderIndex;','renderIndex=function(...args)','hookRender();'])if(!a.includes(x))throw new Error('established render hook contract drift: '+x);
          console.log('Company #010 public measured-earned + generic ve presentation PASS');
          NODE
      - name: Verify read-only boundary
        run: |
          set -euo pipefail
          ! grep -Eqi 'wallet\.send|sendTransaction|eth_sendTransaction|eth_sendRawTransaction|private[_ -]?key|mnemonic|signer\.send' rewards/company-010-ve-rewards.mjs rewards/company-010-rewards-overlay.mjs companies/company-010-public-adapter.js
