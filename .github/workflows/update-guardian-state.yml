name: "The Holding Brain · Guardian Capability Gate"

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-guardian-state.yml'
      - 'intelligence/guardian/README.md'
      - 'intelligence/guardian/guardian-policy.json'
      - 'intelligence/guardian/guardian-schema.json'
      - 'intelligence/guardian/guardian-engine.mjs'
      - 'intelligence/guardian/independent-guardian-reviewer.mjs'
      - 'intelligence/guardian/guardian-release-guard.mjs'
      - 'intelligence/guardian/guardian-release.json'
      - 'intelligence/builder/candidate-queue.json'
      - 'intelligence/builder/candidate-eval.json'
      - 'intelligence/proposals/proposal-queue.json'
      - 'intelligence/learning/decision-ledger.json'

permissions:
  contents: write

concurrency:
  group: guardian-capability-gate-main
  cancel-in-progress: false

jobs:
  guard:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout canonical main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Preflight Guardian v0.1
        shell: bash
        run: |
          set -euo pipefail
          REQUIRED=(
            "intelligence/builder/candidate-queue.json"
            "intelligence/builder/candidate-eval.json"
            "intelligence/proposals/proposal-queue.json"
            "intelligence/learning/decision-ledger.json"
            "intelligence/guardian/README.md"
            "intelligence/guardian/guardian-policy.json"
            "intelligence/guardian/guardian-schema.json"
            "intelligence/guardian/guardian-engine.mjs"
            "intelligence/guardian/independent-guardian-reviewer.mjs"
            "intelligence/guardian/guardian-release-guard.mjs"
            "intelligence/guardian/guardian-release.json"
          )
          for f in "${REQUIRED[@]}"; do test -s "$f"; done
          node --check intelligence/guardian/guardian-engine.mjs
          node --check intelligence/guardian/independent-guardian-reviewer.mjs
          node --check intelligence/guardian/guardian-release-guard.mjs
          node -e "JSON.parse(require('fs').readFileSync('intelligence/guardian/guardian-policy.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('intelligence/guardian/guardian-schema.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('intelligence/guardian/guardian-release.json','utf8'))"
          node intelligence/guardian/guardian-release-guard.mjs

      - name: Verify exact independently reviewed Builder input
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs'), crypto=require('crypto');
          const sha=p=>crypto.createHash('sha256').update(fs.readFileSync(p)).digest('hex');
          const q=JSON.parse(fs.readFileSync('intelligence/builder/candidate-queue.json','utf8'));
          const e=JSON.parse(fs.readFileSync('intelligence/builder/candidate-eval.json','utf8'));
          const p=JSON.parse(fs.readFileSync('intelligence/proposals/proposal-queue.json','utf8'));
          const d=JSON.parse(fs.readFileSync('intelligence/learning/decision-ledger.json','utf8'));
          if(e.status!=='pass') throw new Error('Builder reviewer not PASS');
          if(e.source?.candidateQueueSha256!==sha('intelligence/builder/candidate-queue.json')) throw new Error('Builder candidate bytes differ from reviewed bytes');
          if(q.source?.proposalQueueSha256!==sha('intelligence/proposals/proposal-queue.json')) throw new Error('Builder/Proposal byte binding mismatch');
          if(q.source?.decisionLedgerHash!==d.integrity?.ledgerHash || p.source?.decisionLedgerHash!==d.integrity?.ledgerHash) throw new Error('Decision Ledger binding mismatch');
          if(q.constraints?.noRepositoryCodeMutation!==true || q.constraints?.noAutomaticMerge!==true || q.constraints?.noAutomaticRelease!==true || q.constraints?.executionAuthority!=='none') throw new Error('Builder mutation boundary changed');
          console.log('Reviewed Builder input PASS',{candidates:q.summary?.candidateCount,approvedProposals:q.summary?.approvedProposalCount});
          NODE

      - name: Build deterministic Guardian capability state
        run: node intelligence/guardian/guardian-engine.mjs

      - name: Independent Guardian reviewer
        run: node intelligence/guardian/independent-guardian-reviewer.mjs

      - name: Verify Guardian remains non-executing
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs');
          const s=JSON.parse(fs.readFileSync('intelligence/guardian/guardian-state.json','utf8'));
          const e=JSON.parse(fs.readFileSync('intelligence/guardian/guardian-eval.json','utf8'));
          if(e.status!=='pass') throw new Error('Independent Guardian reviewer did not PASS');
          if(s.summary?.sandboxBuildAuthorizedCount!==0 || s.summary?.productionMutationAuthorizedCount!==0) throw new Error('Guardian granted mutation authority');
          if(s.constraints?.sandboxBuildAuthority!==false || s.constraints?.executionAuthority!=='none') throw new Error('Guardian execution boundary changed');
          for(const d of s.decisions??[]){
            if(d.authority?.executable!==false || d.authority?.productionMutationAuthorized!==false || d.authority?.sandboxBuildAuthority!==false || d.authority?.executionAuthority!=='none') throw new Error(`Unsafe Guardian decision ${d.guardianDecisionId}`);
          }
          console.log('Guardian v0.1 authority boundary PASS',s.summary);
          NODE
          git diff --check

      - name: Publish Guardian state safely
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "The Holding Guardian"
          git config user.email "guardian@theholding.ai"
          GENERATED=(
            "intelligence/guardian/guardian-state.json"
            "intelligence/guardian/guardian-brief.md"
            "intelligence/guardian/guardian-eval.json"
          )
          stage_generated(){
            git add "${GENERATED[@]}"
            bad="$(git diff --cached --name-only | grep -Ev '^intelligence/guardian/(guardian-state\.json|guardian-brief\.md|guardian-eval\.json)$' || true)"
            if [ -n "$bad" ]; then echo "Guardian attempted to stage outside generated-state boundary:"; echo "$bad"; exit 1; fi
          }
          verify_and_rebuild(){
            node intelligence/guardian/guardian-release-guard.mjs
            node intelligence/guardian/guardian-engine.mjs
            node intelligence/guardian/independent-guardian-reviewer.mjs
            node - <<'NODE'
          const fs=require('fs');
          const s=JSON.parse(fs.readFileSync('intelligence/guardian/guardian-state.json','utf8'));
          const e=JSON.parse(fs.readFileSync('intelligence/guardian/guardian-eval.json','utf8'));
          if(e.status!=='pass') throw new Error('Guardian reviewer did not PASS after rebase');
          if(s.summary?.sandboxBuildAuthorizedCount!==0 || s.summary?.productionMutationAuthorizedCount!==0 || s.constraints?.executionAuthority!=='none') throw new Error('Guardian authority changed after rebase');
          NODE
            git diff --check
          }
          stage_generated
          if git diff --cached --quiet; then echo "No Guardian state changes to publish."; exit 0; fi
          git commit -m "intelligence: refresh guardian capability state"
          for attempt in 1 2 3; do
            git fetch origin main
            if ! git rebase origin/main; then git rebase --abort || true; echo "Guardian publish conflict; fail closed."; exit 1; fi
            verify_and_rebuild
            stage_generated
            if ! git diff --cached --quiet; then git commit --amend --no-edit; fi
            if git push origin HEAD:main; then
              git fetch origin main
              test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
              echo "Verified Guardian capability state on remote main."
              exit 0
            fi
            echo "Main moved during Guardian push; retrying ($attempt/3)..."
          done
          echo "ERROR: unable to publish Guardian state after retries"
          exit 1
