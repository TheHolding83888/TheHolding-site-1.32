name: "Verify Company #010 · Public Admission"

on:
  pull_request:
    branches: [main]
    paths:
      - 'companies/company-010-public-adapter.js'
      - 'onboarding/company-010-public-admission.mjs'
      - '.github/workflows/admit-company-010-public.yml'
      - 'intelligence/onboarding/COMPANY_010_TO_011_LEARNING_DELTA_2026-08-17.md'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
      - name: Syntax and deterministic dry-run
        run: |
          set -euo pipefail
          node --check companies/company-010-public-adapter.js
          node --check onboarding/company-010-public-admission.mjs
          node onboarding/company-010-public-admission.mjs
      - name: Verify native base UI contract
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs');
          const h=fs.readFileSync('.tmp-company-010-public-admission.html','utf8');
          const a=fs.readFileSync('companies/company-010-public-adapter.js','utf8');
          const htmlMust=['"numberOfItems": 10','"position": 10, "name": "Cypher"','id="companyCount">10','/companies/company-010-public-adapter.js','const eligible = list.filter(c => c.indexEligible !== false);','const measuredTotal = list.reduce','if (cn) cn.textContent = list.length;',"seg.className = 'index-comp-seg' + (c.indexEligible === false ? ' pending' : '');","const rCo = c => c.indexEligible === false ? P.rCoMin","c.performancePending ? (lang === 'ru' ? 'Ожидается' : 'Pending')"];
          for(const x of htmlMust)if(!h.includes(x))throw new Error('missing native surface: '+x);
          if((h.match(/data-company-010-public-adapter/g)||[]).length!==1)throw new Error('loader multiplicity drift');
          for(const x of ['Open Passport','company010Passport','thc10-overlay','thc10-passport','aria-controls="company010Passport"'])if(a.includes(x))throw new Error('legacy Cypher-specific UX remains: '+x);
          const adapterMust=['v0.10-unified-rewards-gmx-apy-capsule','Stake DAO','Aave','HyperLend','Project X','GMX','Concentrator','networkTvlUsd','INDEX_STATE.push(next)',"COMPANY_REWARDS_SCOPE.add('Cypher')",'The Holding Standard','state.performance?.complete!==true','cypher-eth-equivalent','wstETH','stakedao-base-curve-4pool','USDC'];
          for(const x of adapterMust)if(!a.includes(x))throw new Error('adapter complete-surface binding missing: '+x);
          if(a.includes("const index=document.getElementById('idxNetworkValue')")||a.includes("if(top&&top.textContent!==display)top.textContent=display"))throw new Error('Company #010 adapter must not overwrite shared summary TVL metrics');
          if(!a.includes("statProtocols.textContent=String(new Set(Object.values(COMPANY_PROTOCOLS).flat()).size)"))throw new Error('runtime Protocols & Assets reconciliation missing');
          if(/\['Bitcoin'.*'Fluid'/.test(a)||a.includes("'Concentrator','Fluid'"))throw new Error('Fluid remains in Cypher protocol list');
          if(!a.includes("${complete?'':'≥ '}${money(complete?state.capital.totalCapitalUsd:state.capital.knownCapitalFloorUsd)}"))throw new Error('exact-vs-floor Company TVL contract missing');
          console.log('Company #010 native base UI contract PASS');
          NODE
      - name: Verify global Passport strategy heading and productive rate badges
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs');const a=fs.readFileSync('companies/company-010-public-adapter.js','utf8');
          for(const x of ['Balance Sheet · Strategies','polishPassportTitles','ensureStrategyRateBadges','ipx-strategy-rate-badge','productiveBreakdown','rateForPosition','APR Pending',"productivityOnly===true&&x.id===pos.id","String(pos.id).startsWith('gmx-gm-')","byLabel('veCRV')",'falseVeCrv.remove()','Concentrator · sdCRV','Convex · staked cvxCRV'])if(!a.includes(x))throw new Error('strategy Passport contract missing: '+x);
          if(a.includes('Balance Sheet · Strategies.'))throw new Error('terminal dot returned to Balance Sheet · Strategies');
          for(const reserveGuard of ["pos.id==='bitcoin'","pos.id==='cypher-eth-equivalent'","pos.id==='ethereum'","pos.id==='hyperliquid'","pos.id==='curve-dao-token'","pos.id==='lido-dao'"])if(!a.includes(reserveGuard))throw new Error('Cypher reserve/mixed guard missing: '+reserveGuard);
          if(!a.includes("'convex-finance':'convex_vlcvx'"))throw new Error('Cypher vlCVX Productivity mapping missing');
          if(!a.includes("const kind=/\\bAPY\\b/i.test(metric)?'APY':'APR'"))throw new Error('APR/APY metric distinction missing');
          if(!a.includes("rate.pending?`<span>${rate.kind}</span>")||!a.includes('<strong>Pending</strong>'))throw new Error('unknown != zero Pending badge contract missing');
          if(/rate\.pending[^\n]{0,180}<strong>0(?:\.0+)?%?<\/strong>/.test(a))throw new Error('unknown productive rate rendered as zero');
          console.log('Global Passport productive rate badge contract PASS');
          NODE
      - name: Verify GMX APY capsule contract
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs');const a=fs.readFileSync('companies/company-010-public-adapter.js','utf8');
          for(const x of ['GMX · ETH-USDC','GMX · BTC-USDC','gmxCompactState','GMX · ETH-USDC / BTC-USDC','GMX 30D Fee APY','embedded-in-gm-nav','ensureGmxApyCapsule','gmx-combined-apy-capsule','gmx-multi',"<span>APY</span><strong>${compact.apy}</strong>"])if(!a.includes(x))throw new Error('GMX capsule contract missing: '+x);
          if(a.includes('GMX · ETH-USDC / BTC-USDC · APY'))throw new Error('legacy inline GMX APY returned');
          if(!a.includes("eth.yield?.referenceMetric!=='GMX 30D Fee APY'||btc.yield?.referenceMetric!=='GMX 30D Fee APY'"))throw new Error('GMX APY source contract missing');
          if(!a.includes("eth.yield?.incomeMode!=='embedded-in-gm-nav'||btc.yield?.incomeMode!=='embedded-in-gm-nav'"))throw new Error('GMX embedded-income guard missing');
          if(!a.includes("pill.classList.add('has-strategy-rate')"))throw new Error('GMX capsule does not reuse responsive rate layout');
          console.log('Company #010 GMX APY capsule contract PASS');
          NODE
      - name: Verify unified Rewards Drawer contract
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs');const a=fs.readFileSync('companies/company-010-public-adapter.js','utf8');
          for(const x of ['ensureUnifiedStrategyRewards','cy-strategy-state-row','panelHasStrategy','embeddedIncome','rewardSource','embeddedRoute','Concentrator · sdCRV','aerodrome-ve','velodrome-ve-direct','AERO','VELO','Compounded','Claimable','Pending','REWARDS_URL'])if(!a.includes(x))throw new Error('unified Rewards contract missing: '+x);
          for(const legacy of ['ensureCrvStrategyIncome','ensureVeStrategyIncome','CRV · strategy income','veAERO / veVELO · income'])if(a.includes(legacy))throw new Error('legacy duplicate rewards sub-ledger remains: '+legacy);
          if(!a.includes("panel.querySelector('.cy-crv-income')?.remove()")||!a.includes("panel.querySelector('.cy-ve-income')?.remove()"))throw new Error('legacy runtime cleanup missing');
          if(!a.includes("if(panelHasStrategy(panel,label))return"))throw new Error('native reward row dedupe guard missing');
          if(!a.includes("source?.details?.rewardState"))throw new Error('ve public state not sourced from backend');
          if(!a.includes("compactEmbeddedAmount(route)"))throw new Error('Compounded amount not sourced from embeddedIncome');
          console.log('Company #010 unified Rewards Drawer contract PASS');
          NODE
      - name: Verify presence and weighting are separate
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs');
          const h=fs.readFileSync('.tmp-company-010-public-admission.html','utf8');
          const assertions=[['factor normalisation excludes pending','const raws = eligible.map(f.raw);'],['TVL denominator excludes pending','const totalVal = eligible.reduce'],['pending composite weight zero','c.weight = 0;'],['pending TVL weight zero','c.tvlWeight = 0;'],['surface count includes pending','cn.textContent = list.length;'],['network value floor semantics','hasPending ? \'≥ \' : \'\''],['graph includes pending','const comps = computeIndex().slice().sort'],['pending performance is explicit',"c.performancePending ? (lang === 'ru' ? 'Ожидается' : 'Pending')"]];
          for(const [label,x] of assertions)if(!h.includes(x))throw new Error(label+' missing');
          console.log('Company #010 presence/weighting invariants PASS');
          NODE
      - name: Verify no execution authority
        run: |
          set -euo pipefail
          ! grep -Eqi 'wallet\.send|sendTransaction|eth_sendTransaction|eth_sendRawTransaction|private[_ -]?key|mnemonic|signer\.send' companies/company-010-public-adapter.js onboarding/company-010-public-admission.mjs
