name: "Verify Company #010 · Public Admission"

on:
  pull_request:
    branches: [main]
    paths:
      - 'companies/company-010-public-adapter.js'
      - 'onboarding/company-010-public-admission.mjs'
      - '.github/workflows/admit-company-010-public.yml'
      - '.github/workflows/verify-company-010-public-admission.yml'
      - 'intelligence/onboarding/COMPANY_010_TO_011_LEARNING_DELTA_2026-08-17.md'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Syntax and deterministic dry-run
        run: |
          set -euo pipefail
          node --check companies/company-010-public-adapter.js
          node --check onboarding/company-010-public-admission.mjs
          node onboarding/company-010-public-admission.mjs
      - name: Verify native Company UI contract
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs');
          const h=fs.readFileSync('.tmp-company-010-public-admission.html','utf8');
          const a=fs.readFileSync('companies/company-010-public-adapter.js','utf8');
          const s=JSON.parse(fs.readFileSync('companies/company-010-production-state.json','utf8'));

          const pageMust=[
            '"numberOfItems": 10',
            '"position": 10, "name": "Cypher"',
            'id="companyCount">10',
            "'Cypher': ['Bitcoin'",
            '/companies/company-010-public-adapter.js',
            'const eligible = list.filter(c => c.indexEligible !== false);',
            'const eligibleList = list.filter(c => c.indexEligible !== false);',
            "c.indexEligible === false ? '—' : (i + 1)",
            "item.dataset.indexPending = 'true';",
            '.ib-item[data-index-pending="true"] .ipx-composite{display:none}',
            'computeIndex().filter(c => c.indexEligible !== false).slice().sort'
          ];
          for(const x of pageMust) if(!h.includes(x)) throw new Error('missing native public surface: '+x);
          if((h.match(/data-company-010-public-adapter/g)||[]).length!==1) throw new Error('loader multiplicity drift');

          const adapterMust=[
            "indexEligible:false",
            "COMPANY_BOOK.Cypher",
            "INDEX_STATE.push(next)",
            "cc-extlink cc-extlink-static",
            "renderIndex",
            "buildGraph"
          ];
          for(const x of adapterMust) if(!a.includes(x)) throw new Error('missing native adapter contract: '+x);

          const forbidden=[
            'Open Passport',
            'company010Passport',
            'thc10-overlay',
            'thc10-passport',
            'openPassport()',
            'aria-controls="company010Passport"'
          ];
          for(const x of forbidden) if(a.includes(x)) throw new Error('legacy Cypher-specific UX remains: '+x);

          if(s.capital?.totalCapitalComplete!==false) throw new Error('Fluid completeness contract changed; fresh public review required');
          if(!(Number(s.capital?.knownCapitalFloorUsd)>0)) throw new Error('measured capital floor missing');
          if(s.authority?.executionAuthority!=='none'||s.authority?.transactions!==false) throw new Error('execution authority drift');
          if(s.epistemicBoundary?.unknownIsNotZero!==true||s.epistemicBoundary?.partialTotalIsNotTotal!==true) throw new Error('epistemic boundary drift');
          console.log('Company #010 native UI contract PASS');
          NODE
      - name: Verify pending Index invariants
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs');
          const h=fs.readFileSync('.tmp-company-010-public-admission.html','utf8');
          const assertions=[
            ['factor normalisation excludes pending', 'const raws = eligible.map(f.raw);'],
            ['TVL denominator excludes pending', 'const totalVal = eligible.reduce'],
            ['pending composite weight zero', 'c.weight = 0;'],
            ['pending TVL weight zero', 'c.tvlWeight = 0;'],
            ['constituent count eligible only', 'cn.textContent = eligibleList.length;'],
            ['leader eligible only', 'eligibleList[0] ? companyDisplayName(eligibleList[0].nm)'],
            ['composition eligible only', 'eligibleList.forEach((c, i) => {'],
            ['graph eligible only', 'computeIndex().filter(c => c.indexEligible !== false)']
          ];
          for(const [label,x] of assertions) if(!h.includes(x)) throw new Error(label+' missing');
          console.log('Company #010 pending Index invariants PASS');
          NODE
      - name: Verify no execution authority
        run: |
          set -euo pipefail
          ! grep -Eqi 'wallet\.send|sendTransaction|eth_sendTransaction|eth_sendRawTransaction|private[_ -]?key|mnemonic|signer\.send' companies/company-010-public-adapter.js onboarding/company-010-public-admission.mjs
