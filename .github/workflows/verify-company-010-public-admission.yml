name: "Verify Company #010 · Public Admission"

on:
  pull_request:
    branches: [main]
    paths:
      - 'companies/company-010-public-adapter.js'
      - 'onboarding/company-010-public-admission.mjs'
      - '.github/workflows/admit-company-010-public.yml'
      - '.github/workflows/verify-company-010-public-admission.yml'
      - 'intelligence/onboarding/COMPANY_010_TO_011_LEARNING_DELTA_2026-08-17.md'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Syntax and deterministic dry-run
        run: |
          set -euo pipefail
          node --check companies/company-010-public-adapter.js
          node --check onboarding/company-010-public-admission.mjs
          node onboarding/company-010-public-admission.mjs
      - name: Verify native Company UI contract
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs');
          const h=fs.readFileSync('.tmp-company-010-public-admission.html','utf8');
          const a=fs.readFileSync('companies/company-010-public-adapter.js','utf8');
          const must=[
            '"numberOfItems": 10','"position": 10, "name": "Cypher"','id="companyCount">10','/companies/company-010-public-adapter.js',
            'const eligible = list.filter(c => c.indexEligible !== false);','const measuredTotal = list.reduce','if (cn) cn.textContent = list.length;',
            "seg.className = 'index-comp-seg' + (c.indexEligible === false ? ' pending' : '');",
            "const rCo = c => c.indexEligible === false ? P.rCoMin",
            "c.performancePending ? (lang === 'ru' ? 'Ожидается' : 'Pending')"
          ];
          for(const x of must)if(!h.includes(x))throw new Error('missing native reconciled surface: '+x);
          if((h.match(/data-company-010-public-adapter/g)||[]).length!==1)throw new Error('loader multiplicity drift');
          for(const x of ['Open Passport','company010Passport','thc10-overlay','thc10-passport','aria-controls="company010Passport"'])if(a.includes(x))throw new Error('legacy Cypher-specific UX remains: '+x);
          for(const x of ['v0.4-passport-surface-complete','Hyperliquid','HyperLend','Project X','GMX','Concentrator','networkTvlUsd','measuredCapitalFloorUsd','INDEX_STATE.push(next)',"COMPANY_REWARDS_SCOPE.add('Cypher')",'The Holding Standard','performancePending:!complete'])if(!a.includes(x))throw new Error('adapter Passport completion missing: '+x);
          if(!a.includes('net.networkTvlUsd!==null&&net.networkTvlUsd!==undefined'))throw new Error('Combined TVL null guard missing');
          console.log('Company #010 native Passport completion contract PASS');
          NODE
      - name: Verify presence and weighting are separate
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs');
          const h=fs.readFileSync('.tmp-company-010-public-admission.html','utf8');
          const assertions=[
            ['factor normalisation excludes pending','const raws = eligible.map(f.raw);'],
            ['TVL denominator excludes pending','const totalVal = eligible.reduce'],
            ['pending composite weight zero','c.weight = 0;'],
            ['pending TVL weight zero','c.tvlWeight = 0;'],
            ['surface count includes pending','cn.textContent = list.length;'],
            ['network value uses measured floor','hasPending ? \'≥ \' : \'\''],
            ['composition contains pending marker',"seg.style.width = c.indexEligible === false ? '0%'"],
            ['composition legend contains pending',"c.indexEligible === false ? (lang === 'ru' ? 'Ожидание' : 'Pending')"],
            ['graph includes pending','const comps = computeIndex().slice().sort'],
            ['graph pending radius is nonzero','c.indexEligible === false ? P.rCoMin'],
            ['pending performance is explicit',"c.performancePending ? (lang === 'ru' ? 'Ожидается' : 'Pending')"]
          ];
          for(const [label,x] of assertions)if(!h.includes(x))throw new Error(label+' missing');
          if(h.includes('computeIndex().filter(c => c.indexEligible !== false).slice().sort'))throw new Error('Graph still excludes pending company');
          console.log('Company #010 presence-vs-weighting invariants PASS');
          NODE
      - name: Verify no execution authority
        run: |
          set -euo pipefail
          ! grep -Eqi 'wallet\.send|sendTransaction|eth_sendTransaction|eth_sendRawTransaction|private[_ -]?key|mnemonic|signer\.send' companies/company-010-public-adapter.js onboarding/company-010-public-admission.mjs
