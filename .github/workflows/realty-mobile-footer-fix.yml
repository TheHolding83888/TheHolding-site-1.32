name: Realty mobile and footer fix materializer

on:
  push:
    branches:
      - fix/realty-mobile-footer-icons-20260831

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout task branch
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: fix/realty-mobile-footer-icons-20260831
        run: |
          set -euo pipefail
          git clone --no-tags --depth 1 --branch "$BRANCH" "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" repo

      - name: Apply bounded Realty corrections
        working-directory: repo
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          html_path = Path('realty/index.html')
          css_path = Path('realty/assets/realty.css')
          workflow_path = Path('.github/workflows/realty-mobile-footer-fix.yml')
          html = html_path.read_text()
          css = css_path.read_text()

          marker = '/* realty-mobile-footer-fix-v2 */'
          if marker in css:
              raise SystemExit('marker already exists')

          old_rev = '/realty/assets/realty.css?v=20260831m8'
          new_rev = '/realty/assets/realty.css?v=20260831m9'
          if html.count(old_rev) != 1:
              raise SystemExit(f'expected one m8 CSS reference, got {html.count(old_rev)}')

          start = html.find('<footer class="footer"')
          end = html.find('</footer>', start)
          if start < 0 or end < 0:
              raise SystemExit('footer not found')
          end += len('</footer>')

          footer = '''<footer class="footer" aria-label="The Holding Realty footer"><div class="footer-main"><div class="footer-brand"><strong>THE HOLDING</strong><span class="footer-dot">·</span><span class="footer-realty">Realty</span></div><div class="footer-connect"><a class="footer-x" href="https://x.com/theholding_" target="_blank" rel="noopener" aria-label="The Holding on X"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18.244 2H21l-6.56 7.497L22 22h-5.828l-4.565-5.969L6.38 22H3.622l6.689-7.645L3 2h5.976l4.126 5.455L18.244 2Zm-.968 17.8h1.527L8.147 4.085H6.509L17.276 19.8Z"/></svg></a><a class="footer-home-mark" href="/" aria-label="The Holding home"><svg viewBox="100 130 440 400" aria-hidden="true"><path d="M125 161L125 167L130 169L248 171L504 169L509 168L511 164L509 160L375 152L229 153Z"/><path d="M125 199L125 216L131 219L203 222L393 223L495 220L509 217L511 209L510 199L497 195L377 188L222 189L138 195Z"/><path d="M125 258L125 285L132 290L284 297L393 296L498 291L508 288L511 280L510 258L505 254L412 243L332 240L233 242L134 253Z"/><path d="M125 338L125 375L131 381L138 383L251 390L351 391L498 383L506 380L510 375L511 341L506 333L479 326L406 317L359 314L248 315L155 326L134 331Z"/><path d="M125 438L125 485L130 492L137 495L190 500L444 500L498 495L508 489L511 481L511 443L506 432L477 423L415 413L351 408L276 408L232 411L149 425L131 431Z"/></svg></a><a class="footer-envelope" href="https://x.com/defitea_" target="_blank" rel="noopener" aria-label="Contact DeFitea on X"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 6.5h17v11h-17z"/><path d="M4 7l8 6 8-6"/></svg></a></div></div><div class="footer-note">Discovery only · external marketplaces · no custody · no fabricated listings</div></footer>'''
          html = html[:start] + footer + html[end:]
          html = html.replace(old_rev, new_rev)

          override = r'''
/* realty-mobile-footer-fix-v2 */
.footer-main{grid-template-columns:minmax(260px,1fr) auto}
.footer-connect{align-self:end;transform:translateY(7px);gap:20px;color:#f4f2ed}
.footer-connect::before{display:none!important;content:none!important}
.footer-connect a{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;min-height:0;padding:0!important;border:0!important;border-radius:0!important;background:transparent!important;box-shadow:none!important;color:inherit;opacity:.9;transition:opacity .2s ease,transform .2s ease}
.footer-connect a:hover{background:transparent!important;border:0!important;box-shadow:none!important;opacity:1;transform:translateY(-1px)}
.footer-x svg{width:18px;height:18px;display:block;fill:currentColor}
.footer-home-mark svg{width:24px;height:24px;display:block;fill:currentColor}
.footer-envelope svg{width:22px;height:22px;display:block;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
[data-theme='light'] .footer-connect,[data-theme='light'] .footer-connect a{color:#171717;background:transparent!important;border:0!important;box-shadow:none!important}
@media(max-width:760px){
  .world-card{min-height:202px}
  .world-art{right:57%}
  .world-copy{margin-left:43%;width:57%;padding:12px 11px 49px 13px;justify-content:flex-start}
  .world-label{margin-bottom:0}
  .round-icon{width:32px;height:32px}
  .round-icon .icon-svg{width:17px;height:17px}
  .world-card h2,.world-card.digital h2{font-size:25px;line-height:.9;margin:5px 0 6px;min-height:0}
  .world-card p{font-size:10.5px;line-height:1.3;height:28px;min-height:28px;max-height:28px;margin:0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .mobile-tags{position:absolute;left:13px;bottom:13px;margin:0;gap:4px;flex-wrap:nowrap}
  .mobile-tags span{font-size:7.5px;line-height:1;padding:5px 5px;white-space:nowrap}
  .world-card .cta{right:11px;bottom:13px;gap:4px}
  .world-card .cta:before{font-size:8.3px;letter-spacing:.15em}
  .world-card .cta:after{font-size:22px}
  .footer-main{display:flex;flex-direction:column;align-items:center;gap:15px}
  .footer-connect{align-self:auto;transform:none;justify-content:center;gap:22px;color:#171717}
  .footer-connect a{width:29px;height:29px;background:transparent!important;border:0!important;box-shadow:none!important}
  .footer-x svg{width:19px;height:19px}
  .footer-home-mark svg{width:24px;height:24px}
  .footer-envelope svg{width:22px;height:22px}
}
@media(max-width:360px){
  .world-card{min-height:206px}
  .world-art{right:59%}
  .world-copy{margin-left:41%;width:59%;padding-left:12px;padding-right:9px}
  .world-card h2,.world-card.digital h2{font-size:23px}
  .mobile-tags{left:12px;gap:3px}
  .mobile-tags span{font-size:7px;padding:5px 4px}
  .world-card .cta{right:9px;gap:3px}
}
'''
          css = css.rstrip() + '\n' + override.strip() + '\n'

          checks = {
              'css revision': html.count(new_rev) == 1 and old_rev not in html,
              'home mark link': 'class="footer-home-mark" href="/"' in html,
              'X link': 'class="footer-x" href="https://x.com/theholding_"' in html,
              'envelope link': 'class="footer-envelope" href="https://x.com/defitea_"' in html,
              'old consultation removed': 'footer-consult' not in html and '>Consultation' not in html,
              'old footer links removed': 'footer-links' not in html,
              'marker': marker in css,
          }
          failed = [k for k,v in checks.items() if not v]
          if failed:
              raise SystemExit('validation failed: ' + ', '.join(failed))

          html_path.write_text(html)
          css_path.write_text(css)
          workflow_path.unlink()
          PY

          git diff --check
          git add -A
          mapfile -t files < <(git diff --cached --name-only | sort)
          printf 'Final files:\n%s\n' "${files[*]}"
          test "${#files[@]}" -eq 2
          test "${files[0]}" = "realty/assets/realty.css"
          test "${files[1]}" = "realty/index.html"

      - name: Commit clean two-file package
        working-directory: repo
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: fix/realty-mobile-footer-icons-20260831
        run: |
          set -euo pipefail
          git config user.name "The Holding Realty Materializer"
          git config user.email "realty-materializer@theholding.ai"
          git commit -m "Realty: refine mobile world cards and footer icons"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:"$BRANCH"
