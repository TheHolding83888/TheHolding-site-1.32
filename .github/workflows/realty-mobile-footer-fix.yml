name: Realty mobile and footer fix materializer

on:
  push:
    branches:
      - fix/realty-mobile-footer-icons-20260831

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout task branch without external actions
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: fix/realty-mobile-footer-icons-20260831
        run: |
          set -euo pipefail
          git clone --no-tags --depth 1 --branch "$BRANCH" "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" repo

      - name: Apply bounded Realty mobile and footer fix
        working-directory: repo
        env:
          FOOTER_B64: 
          CSS_OVERRIDE_B64: 
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, os
          from pathlib import Path

          html_path = Path('realty/index.html')
          css_path = Path('realty/assets/realty.css')
          workflow_path = Path('.github/workflows/realty-mobile-footer-fix.yml')
          html = html_path.read_text()
          css = css_path.read_text()

          marker = '/* realty-mobile-footer-fix-v2 */'
          if marker in css:
              raise SystemExit('marker already present')
          old_rev = '/realty/assets/realty.css?v=20260831m8'
          new_rev = '/realty/assets/realty.css?v=20260831m9'
          if html.count(old_rev) != 1:
              raise SystemExit(f'expected one CSS revision anchor, got {html.count(old_rev)}')

          start = html.find('<footer class="footer"')
          end = html.find('</footer>', start)
          if start < 0 or end < 0:
              raise SystemExit('footer not found')
          end += len('</footer>')
          footer = base64.b64decode(os.environ['FOOTER_B64']).decode()
          override = base64.b64decode(os.environ['CSS_OVERRIDE_B64']).decode()
          html = html[:start] + footer + html[end:]
          html = html.replace(old_rev, new_rev)
          css = css.rstrip() + '\n' + override.rstrip() + '\n'

          required_html = [
              'class="footer-x" href="https://x.com/theholding_"',
              'class="footer-home-mark" href="/"',
              'class="footer-envelope" href="https://x.com/defitea_"',
          ]
          for token in required_html:
              if token not in html:
                  raise SystemExit('missing HTML token: ' + token)
          if 'footer-consult' in html or 'footer-links' in html:
              raise SystemExit('legacy footer controls remain')
          if marker not in css:
              raise SystemExit('CSS marker missing')
          if html.count(new_rev) != 1 or old_rev in html:
              raise SystemExit('CSS revision replacement failed')

          html_path.write_text(html)
          css_path.write_text(css)
          workflow_path.unlink()
          PY

          git diff --check
          git add -A
          mapfile -t files < <(git diff --cached --name-only | sort)
          printf 'Final staged files:\n%s\n' "${files[*]}"
          test "${#files[@]}" -eq 3
          test "${files[0]}" = ".github/workflows/realty-mobile-footer-fix.yml"
          test "${files[1]}" = "realty/assets/realty.css"
          test "${files[2]}" = "realty/index.html"

      - name: Commit clean package and self-remove workflow
        working-directory: repo
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: fix/realty-mobile-footer-icons-20260831
        run: |
          set -euo pipefail
          git config user.name "The Holding Realty Materializer"
          git config user.email "realty-materializer@theholding.ai"
          git commit -m "Realty: refine mobile world cards and footer icons"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:"$BRANCH"
