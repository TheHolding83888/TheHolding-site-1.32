name: Verify Brain · Explanatory Context

on:
  pull_request:
    paths:
      - 'intelligence/explanatory/**'
      - 'intelligence/brain-reasoning-engine.mjs'
      - 'intelligence/brain-upstream-guard.mjs'
      - 'intelligence/brain-policy.json'
      - 'intelligence/brain-chatgpt-bridge.mjs'
      - 'intelligence/brain-chatgpt-bridge-policy.json'
      - 'intelligence/brain-chatgpt-bridge-schema.json'
      - 'intelligence/cognitive-stack-verifier.mjs'
      - 'intelligence/cognitive-stack-release.json'
      - '.github/workflows/update-brain-intelligence.yml'
      - '.github/workflows/verify-brain-explanatory-context.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout reviewed repository state
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Static preflight
        run: |
          set -euo pipefail
          REQUIRED=(
            intelligence/explanatory/explanatory-context.json
            intelligence/brain-reasoning-engine.mjs
            intelligence/brain-upstream-guard.mjs
            intelligence/brain-policy.json
            intelligence/brain-chatgpt-bridge.mjs
            intelligence/brain-chatgpt-bridge-policy.json
            intelligence/brain-chatgpt-bridge-schema.json
            intelligence/cognitive-stack-verifier.mjs
            intelligence/cognitive-stack-release.json
            intelligence/change-intelligence.json
            intelligence/system-memory.json
            security/security-intelligence.json
            security/security-memory.json
          )
          for f in "${REQUIRED[@]}"; do test -s "$f"; done
          node --check intelligence/brain-reasoning-engine.mjs
          node --check intelligence/brain-upstream-guard.mjs
          node --check intelligence/brain-chatgpt-bridge.mjs
          node --check intelligence/cognitive-stack-verifier.mjs
          node intelligence/cognitive-release-guard.mjs
          grep -q "protocolAprContexts" intelligence/brain-reasoning-engine.mjs
          grep -q "unresolved-beyond-formula" intelligence/brain-reasoning-engine.mjs

      - name: Build Grounded Brain locally
        run: node intelligence/brain-reasoning-engine.mjs

      - name: Verify multi-cohort Explanatory grounding and causal boundary
        run: |
          set -euo pipefail
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          import { verifyGroundedBrainUpstreams, UPSTREAM_GUARD_VERSION } from './intelligence/brain-upstream-guard.mjs';

          const brain = JSON.parse(fs.readFileSync('intelligence/brain-intelligence.json', 'utf8'));
          const explanatory = JSON.parse(fs.readFileSync('intelligence/explanatory/explanatory-context.json', 'utf8'));
          const upstream = verifyGroundedBrainUpstreams({ brain, requireFreshFlag: true });
          if (upstream.version !== '0.2-exact-canonical-source-binding-explanatory') {
            throw new Error(`Unexpected upstream guard: ${upstream.version}`);
          }
          if (upstream.version !== UPSTREAM_GUARD_VERSION || upstream.sourceCount !== 5) {
            throw new Error('Five-source exact upstream vector missing');
          }
          const exp = upstream.sources.find(x => x.key === 'explanatory');
          if (!exp || exp.file !== 'intelligence/explanatory/explanatory-context.json' || exp.exactByteMatch !== true) {
            throw new Error('Explanatory exact-byte upstream binding missing');
          }
          if (explanatory.engineVersion !== '0.3-multi-cohort-protocol-economic-context' || Number(explanatory.coverage?.protocolEconomicCohortCount) !== 2) {
            throw new Error('Canonical Explanatory two-cohort source missing');
          }

          const legacy = brain.questions?.protocolAprContext;
          if (legacy?.status !== 'context-available-causal-attribution-unresolved') {
            throw new Error('Legacy veFXN protocol APR context not preserved in Brain');
          }
          if (legacy?.causalAttribution !== 'unresolved' || legacy?.primaryDriver !== null) {
            throw new Error('Brain promoted unproved veFXN causal attribution');
          }
          if (!Number.isFinite(Number(legacy?.reportableMeasuredContext?.fxnLocked)) ||
              !Number.isFinite(Number(legacy?.reportableMeasuredContext?.totalVeFxn))) {
            throw new Error('Measured veFXN protocol drivers missing from Brain');
          }

          const contexts = brain.questions?.protocolAprContexts;
          const fx = contexts?.['defitea-fxn-vefxn'];
          const curve = contexts?.['defitea-curve-vecrv'];
          if (!contexts || Object.keys(contexts).length !== 2 || !fx || !curve) {
            throw new Error('Brain canonical protocolAprContexts must contain exactly f(x) + Curve');
          }
          if (fx.status !== 'context-available-causal-attribution-unresolved' || fx.causalAttribution !== 'unresolved' || fx.primaryDriver !== null) {
            throw new Error('Brain veFXN canonical causal boundary drift');
          }
          if (curve.status !== 'mechanics-proven-upstream-cause-unresolved') {
            throw new Error('Brain Curve mechanical context missing');
          }
          if (curve.mechanics?.status !== 'proven-canonical-collector-identity' || curve.mechanics?.mechanicalAttribution !== 'proven-within-apr-formula') {
            throw new Error('Brain Curve proven mechanics missing');
          }
          if (curve.causalAttribution !== 'unresolved-beyond-formula' || curve.primaryDriver !== null) {
            throw new Error('Brain over-promoted Curve upstream causality');
          }
          if (!Number.isFinite(Number(curve?.reportableMeasuredContext?.rollingFourWeekFeesCrvUSD)) ||
              !Number.isFinite(Number(curve?.reportableMeasuredContext?.rollingAverageVeSupply)) ||
              !Number.isFinite(Number(curve?.reportableMeasuredContext?.crvPriceUsd))) {
            throw new Error('Brain Curve mechanical inputs missing');
          }
          if (Number(brain.currentPosture?.protocolEconomics?.cohortCount) !== 2 ||
              brain.currentPosture?.protocolEconomics?.legacyAliasCohortId !== 'defitea-fxn-vefxn') {
            throw new Error('Brain multi-cohort currentPosture contract missing');
          }

          const whatChangedExp = (brain.questions?.whatChanged?.evidence ?? []).filter(ev =>
            ev.source === 'intelligence/explanatory/explanatory-context.json'
          );
          const pointers = new Set(whatChangedExp.map(ev => ev.pointer));
          for (const pointer of [
            '/explanations/protocolAprChangeContext',
            '/explanations/protocolAprChangeContexts/defitea-fxn-vefxn',
            '/explanations/protocolAprChangeContexts/defitea-curve-vecrv'
          ]) {
            if (!pointers.has(pointer)) throw new Error(`Explanatory evidence pointer missing from Brain: ${pointer}`);
          }
          if (whatChangedExp.some(ev => ev.sourceSha256 !== exp.sha256)) {
            throw new Error('Brain multi-cohort Explanatory evidence hash mismatch');
          }
          if ((brain.reasoningCases ?? []).length > 25) throw new Error('Reasoning case capacity expanded unexpectedly');
          if (brain.constraints?.actionMode !== 'proposal-only' || brain.constraints?.autonomousCapitalActionAllowed !== false) {
            throw new Error('Brain authority regression');
          }
          console.log('BRAIN MULTI-COHORT EXPLANATORY CONTEXT PASS', {
            sources: upstream.sourceCount,
            cohorts: Object.keys(contexts).length,
            fxnStatus: fx.status,
            curveStatus: curve.status,
            curveMechanicalAttribution: curve.mechanics.mechanicalAttribution,
            curveUpstreamCause: curve.causalAttribution,
            reasoningCases: brain.reasoningCases.length,
          });
          NODE

      - name: Build exact-upstream Bridge locally
        run: |
          set -euo pipefail
          node intelligence/brain-chatgpt-bridge.mjs --self-test
          node intelligence/brain-chatgpt-bridge.mjs
          node intelligence/brain-chatgpt-bridge.mjs --verify-current

      - name: Verify multi-cohort Explanatory evidence reaches Bridge
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('fs');
          const bridge = JSON.parse(fs.readFileSync('intelligence/brain-chatgpt-bridge.json', 'utf8'));
          const report = JSON.parse(fs.readFileSync('intelligence/brain-chatgpt-bridge-eval.json', 'utf8'));
          if (report.status !== 'pass') throw new Error('Bridge evaluation failed');
          if (bridge.grounding?.upstreamValidation?.sourceCount !== 5) {
            throw new Error('Bridge does not validate five Brain upstream sources');
          }
          const expEvidence = (bridge.evidenceCatalog ?? []).filter(ev =>
            ev.source === 'intelligence/explanatory/explanatory-context.json'
          );
          const pointers = new Set(expEvidence.map(ev => ev.pointer));
          for (const pointer of [
            '/explanations/protocolAprChangeContext',
            '/explanations/protocolAprChangeContexts/defitea-fxn-vefxn',
            '/explanations/protocolAprChangeContexts/defitea-curve-vecrv'
          ]) {
            if (!pointers.has(pointer)) throw new Error(`Bridge missing canonical protocol evidence: ${pointer}`);
          }
          if (bridge.constraints?.executionAllowed !== false ||
              bridge.constraints?.apiRequired !== false ||
              bridge.constraints?.modelCallPerformed !== false) {
            throw new Error('Bridge authority/cost boundary regression');
          }
          console.log('BRIDGE MULTI-COHORT EXPLANATORY CONTEXT PASS', {
            upstreamSources: bridge.grounding.upstreamValidation.sourceCount,
            protocolEvidenceCount: [...pointers].filter(x => x.startsWith('/explanations/protocolAprChangeContext')).length,
            noExecution: bridge.constraints.executionAllowed === false,
          });
          NODE

      - name: Verify local Cognitive Stack coherence
        run: |
          set -euo pipefail
          node intelligence/cognitive-stack-verifier.mjs
          node intelligence/cognitive-stack-verifier.mjs --verify-current
          node - <<'NODE'
          const fs = require('fs');
          const stack = JSON.parse(fs.readFileSync('intelligence/cognitive-stack-state.json', 'utf8'));
          if (stack.chain?.groundedBrain?.exactCanonicalUpstreamBinding !== true) {
            throw new Error('Cognitive Stack lost exact Brain upstream binding');
          }
          if (stack.chain?.chatgptBridge?.exactCanonicalUpstreamBinding !== true) {
            throw new Error('Cognitive Stack lost exact Bridge upstream binding');
          }
          if (stack.operatingContract?.executionAuthority !== 'none') {
            throw new Error('Cognitive Stack execution authority regression');
          }
          console.log('COGNITIVE STACK MULTI-COHORT EXPLANATORY INTEGRATION PASS', {
            status: stack.status,
            ready: stack.readyForManualInterpretation,
            chainHash: stack.integrity?.chainHash,
          });
          NODE
          git diff --check
