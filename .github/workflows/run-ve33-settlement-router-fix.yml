name: Run ve33 Settlement Router Fix

on:
  pull_request:
    paths:
      - '.github/workflows/run-ve33-settlement-router-fix.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/ve33-generic-rpc-range-limit-20260914
          fetch-depth: 0

      - name: Execute saved deterministic patch
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          src=Path('.github/workflows/apply-ve33-settlement-router-fix.yml').read_text()
          start=src.index('      - name: Apply measured settlement router fix')
          run_start=src.index('        run: |\n', start)+len('        run: |\n')
          end=src.index('\n      - name: Validate patched branch', run_start)
          lines=src[run_start:end].splitlines()
          script='\n'.join((line[10:] if line.startswith('          ') else line) for line in lines)+'\n'
          # YAML block indentation removes ten spaces. Restore the two spaces
          # that belong to the Python triple-quoted config fragments themselves.
          script=script.replace('\n  settlementRangeHints:', '\n    settlementRangeHints:')
          script=script.replace('\n  votingEscrow:', '\n    votingEscrow:')
          Path('/tmp/apply-ve33-router.sh').write_text(script)
          PY
          bash /tmp/apply-ve33-router.sh
          # The saved patch also contains temporary workflow cleanup and a canary
          # toggle. Restore workflow files to the committed PR-head state; only
          # reporting production files are allowed into the runner commit.
          git checkout HEAD -- \
            .github/workflows/apply-ve33-settlement-router-fix.yml \
            .github/workflows/diagnose-ve33-runtime-baseline.yml \
            .github/workflows/run-ve33-settlement-router-fix.yml \
            .github/workflows/verify-ve33-accounting.yml

      - name: Validate patched branch
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock ethers@6
          node --check reporting/ve33-accounting-evidence.mjs
          node --check reporting/ve33-unresolved-settlement-diagnostic.mjs
          node reporting/ve33-accounting-evidence-validation.mjs
          node reporting/ve33-income-candidates-validation.mjs
          node reporting/ve33-ledger-admission-validation.mjs
          rm -rf node_modules
          git diff --check

      - name: Commit production files only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'TheHolding83888'
          git config user.email '270993406+TheHolding83888@users.noreply.github.com'
          git add reporting/ve33-accounting-evidence.mjs reporting/ve33-unresolved-settlement-diagnostic.mjs
          git diff --cached --quiet && exit 0
          git commit -m 'reliability: bound and pool ve33 settlement log scans'
          git push origin HEAD:fix/ve33-generic-rpc-range-limit-20260914
