name: "The Holding · Votium vlCVX Voting Provenance"

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - "The Holding · Votium vlCVX Round Flow"
    types: [completed]
  push:
    branches: [main]
    paths:
      - "intelligence/economic-graph/vlcvx-votium-snapshot-proof.mjs"
      - "scripts/verify-vlcvx-votium-snapshot-proof.mjs"
      - "scripts/verify-vlcvx-votium-evidence-handoff.mjs"
      - ".github/workflows/update-vlcvx-votium-snapshot-proof.yml"
  pull_request:
    paths:
      - "intelligence/economic-graph/vlcvx-votium-snapshot-proof.mjs"
      - "scripts/verify-vlcvx-votium-snapshot-proof.mjs"
      - "scripts/verify-vlcvx-votium-evidence-handoff.mjs"
      - ".github/workflows/update-vlcvx-votium-snapshot-proof.yml"

permissions:
  contents: write

concurrency:
  group: the-holding-vlcvx-votium-voting-provenance
  cancel-in-progress: false

jobs:
  prove:
    if: >-
      ${{
        github.event_name != 'workflow_run' ||
        (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout reviewed canonical state
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || 'main' }}

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Static validation
        run: |
          set -euo pipefail
          node --check intelligence/economic-graph/vlcvx-votium-snapshot-proof.mjs
          node --check scripts/verify-vlcvx-votium-snapshot-proof.mjs
          node --check scripts/verify-vlcvx-votium-evidence-handoff.mjs
          node scripts/verify-vlcvx-votium-evidence-handoff.mjs
          test -s intelligence/economic-graph/vlcvx-votium-round-flow.json
          git diff --check

      - name: Determine PR live-probe requirement
        if: github.event_name == 'pull_request'
        id: evidence_mode
        shell: bash
        run: |
          set -euo pipefail
          BASE="${{ github.event.pull_request.base.sha }}"
          if git diff --name-only "$BASE"...HEAD | grep -Eq '^(intelligence/economic-graph/vlcvx-votium-snapshot-proof\.mjs|scripts/verify-vlcvx-votium-snapshot-proof\.mjs)$'; then
            echo "live_probe_needed=true" >> "$GITHUB_OUTPUT"
          else
            echo "live_probe_needed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Orchestration-only PR proof
        if: github.event_name == 'pull_request' && steps.evidence_mode.outputs.live_probe_needed != 'true'
        run: |
          set -euo pipefail
          node scripts/verify-vlcvx-votium-evidence-handoff.mjs
          echo "Voting Provenance collector unchanged; live RPC proof remains production/code-change only."

      - name: Install existing read-only chain dependencies
        if: github.event_name != 'pull_request' || steps.evidence_mode.outputs.live_probe_needed == 'true'
        working-directory: productivity
        run: npm install --no-audit --no-fund

      - name: Expose existing dependency tree
        if: github.event_name != 'pull_request' || steps.evidence_mode.outputs.live_probe_needed == 'true'
        run: ln -sfn productivity/node_modules node_modules

      - name: Build live voting provenance proof
        if: github.event_name != 'pull_request' || steps.evidence_mode.outputs.live_probe_needed == 'true'
        env:
          ETH_RPC_URL: ${{ secrets.ETH_RPC_URL }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            TMP="$(mktemp)"
            VLCVX_VOTIUM_SNAPSHOT_PROOF_FILE="$TMP" node intelligence/economic-graph/vlcvx-votium-snapshot-proof.mjs
            cp "$TMP" /tmp/vlcvx-votium-snapshot-proof.json
            rm -f "$TMP"
          else
            node intelligence/economic-graph/vlcvx-votium-snapshot-proof.mjs
            cp intelligence/economic-graph/vlcvx-votium-snapshot-proof.json /tmp/vlcvx-votium-snapshot-proof.json
          fi

      - name: Verify source, mapping and epistemic boundaries
        if: github.event_name != 'pull_request' || steps.evidence_mode.outputs.live_probe_needed == 'true'
        run: |
          set -euo pipefail
          VLCVX_VOTIUM_SNAPSHOT_PROOF_FILE=/tmp/vlcvx-votium-snapshot-proof.json node scripts/verify-vlcvx-votium-snapshot-proof.mjs
          git diff --check

      - name: Publish generated voting provenance atomically
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          GENERATED="intelligence/economic-graph/vlcvx-votium-snapshot-proof.json"
          UPSTREAM="intelligence/economic-graph/vlcvx-votium-round-flow.json"
          test -s "$GENERATED"
          artifact_hash="$(node - "$GENERATED" <<'NODE'
          const fs=require('fs');
          const x=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          process.stdout.write(String(x.sourceBinding?.roundFlowSha256||''));
          NODE
          )"
          gh api --method GET -H "Accept: application/vnd.github.raw+json" "repos/${GITHUB_REPOSITORY}/contents/${UPSTREAM}" -f ref=main > /tmp/remote-votium-round-flow.json
          remote_hash="$(sha256sum /tmp/remote-votium-round-flow.json | cut -d' ' -f1)"
          if [ "$artifact_hash" != "$remote_hash" ]; then
            echo "ERROR: Votium round-flow changed after voting provenance measurement; refusing stale publish."
            exit 1
          fi
          remote_sha="$(gh api "repos/${GITHUB_REPOSITORY}/contents/${GENERATED}?ref=main" --jq '.sha' 2>/dev/null || true)"
          payload="$(mktemp)"
          node - "$GENERATED" "$remote_sha" > "$payload" <<'NODE'
          const fs=require('fs');
          const file=process.argv[2];
          const sha=process.argv[3];
          const payload={message:'intelligence: refresh vlcvx votium voting provenance',content:fs.readFileSync(file).toString('base64'),branch:'main'};
          if(sha)payload.sha=sha;
          process.stdout.write(JSON.stringify(payload));
          NODE
          gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/${GENERATED}" --input "$payload" >/tmp/votium-provenance-publish.json
          cat /tmp/votium-provenance-publish.json | jq -r '.commit.sha'

      - name: Prove physical state on main
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 12); do
            if gh api --method GET -H "Accept: application/vnd.github.raw+json" "repos/${GITHUB_REPOSITORY}/contents/intelligence/economic-graph/vlcvx-votium-snapshot-proof.json" -f ref=main > /tmp/physical-votium-provenance.json 2>/dev/null; then
              if VLCVX_VOTIUM_SNAPSHOT_PROOF_FILE=/tmp/physical-votium-provenance.json node scripts/verify-vlcvx-votium-snapshot-proof.mjs; then
                echo "Votium voting provenance physical main proof PASS"
                exit 0
              fi
            fi
            sleep 3
          done
          echo "ERROR: Votium voting provenance physical main state did not materialize"
          exit 1
