name: "Validate Unified Capital Refresh"

on:
  pull_request:
    paths:
      - '.github/workflows/unified-capital-refresh.yml'
      - '.github/workflows/market-data-refresh.yml'
      - '.github/workflows/validate-unified-capital-refresh.yml'
      - 'intelligence/capital-state/unified-capital-refresh.mjs'
      - 'intelligence/market-data/**'
      - 'companies/company-capital-state-contract.mjs'
      - 'companies/defitea-canonical-state.json'
      - 'companies/defitea-public-capital-projection.mjs'
      - 'companies/yieldring-canonical-state.json'
      - 'companies/yieldring-public-capital-projection.mjs'
      - 'companies/company-001-owner-capital-snapshot.json'
      - 'companies/owner-balance-site-projection.mjs'
      - 'companies/public-page-market-runtime-projection.mjs'
      - 'companies/votemarket-reference-state.json'
      - 'productivity/productivity-engine.mjs'
      - 'productivity/company-010-productivity-overlay.mjs'
      - 'productivity/yieldring-productivity-overlay.mjs'
      - 'productivity/votemarket-productivity-overlay.mjs'
      - 'productivity/votemarket-productivity-overlay-validation.mjs'
      - 'intelligence/capital-state/general-company-balance-sheet.mjs'
      - 'intelligence/capital-state/capital-state.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout PR head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Prove Unified Capital is a Market Data consumer only
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs');
          const wf=fs.readFileSync('.github/workflows/unified-capital-refresh.yml','utf8');
          const guard=fs.readFileSync('intelligence/capital-state/unified-capital-market-data-guard.mjs','utf8');
          if(/run:\s*node intelligence\/market-data\/market-data-engine\.mjs/.test(wf))throw new Error('Unified Capital must not execute legacy Market Data writer');
          if(/git add[\s\\\n\r\t\w./-]*intelligence\/market-data\/market-data\.json/.test(wf))throw new Error('Unified Capital must not stage canonical market-data.json');
          if(!wf.includes('Require canonical per-asset Market Data')||!wf.includes('unified-capital-market-data-guard.mjs'))throw new Error('canonical Market Data admission guard missing');
          if(!guard.includes("prices['internet-computer']")||!guard.includes("selectedLane === 'onchain'"))throw new Error('ICP onchain consumer proof missing');
          if(!wf.includes('Update Company Rewards')||!wf.includes('votemarket-productivity-overlay.mjs'))throw new Error('VoteMarket/Rewards refresh coupling missing');
          if(!wf.includes('companies/votemarket-reference-state.json'))throw new Error('VoteMarket persistence cache writer missing');
          if(wf.includes("- 'companies/public-site-polish-projection.mjs'"))throw new Error('pure Presentation source still wakes production Capital writer');
          console.log('Market Data and Presentation ownership boundary PASS');
          NODE

      - name: Syntax-check canonical Capital contracts
        run: |
          set -euo pipefail
          node --check companies/company-capital-state-contract.mjs
          node --check companies/defitea-public-capital-projection.mjs
          node --check companies/yieldring-public-capital-projection.mjs
          node --check companies/owner-balance-site-projection.mjs
          node --check companies/public-page-market-runtime-projection.mjs
          node --check intelligence/capital-state/general-company-balance-sheet.mjs
          node --check intelligence/capital-state/capital-state.mjs
          node --check intelligence/capital-state/unified-capital-refresh.mjs
          node --check intelligence/capital-state/unified-capital-market-data-guard.mjs

      - name: Install Productivity dependencies
        working-directory: productivity
        run: npm install --no-audit --no-fund

      - name: Install Chromium without apt mutation
        working-directory: productivity
        run: npx playwright install chromium

      - name: Prove VoteMarket overlay safety deterministically
        run: |
          set -euo pipefail
          node --check productivity/votemarket-productivity-overlay.mjs
          node --check productivity/votemarket-productivity-overlay-validation.mjs
          node productivity/votemarket-productivity-overlay-validation.mjs

      - name: Build zero-request deterministic Market Data fixture
        run: |
          set -euo pipefail
          node --check intelligence/market-data/market-data-validation-fixture.mjs
          node --check intelligence/market-data/coingecko-fetch-shim.mjs
          node intelligence/market-data/market-data-validation-fixture.mjs
          sha256sum intelligence/market-data/market-data.json | awk '{print $1}' > /tmp/market-data-before.sha256

      - name: Execute complete Capital refresh with local Market Data only
        env:
          NODE_OPTIONS: --import=${{ github.workspace }}/intelligence/market-data/coingecko-fetch-shim.mjs
          ETH_RPC_URL: ${{ secrets.ETH_RPC_URL }}
          BASE_RPC_URL: ${{ secrets.BASE_RPC_URL }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node intelligence/capital-state/unified-capital-refresh.mjs

      - name: Prove canonical Market Data bytes were not mutated
        run: |
          set -euo pipefail
          before="$(cat /tmp/market-data-before.sha256)"
          after="$(sha256sum intelligence/market-data/market-data.json | awk '{print $1}')"
          test "$before" = "$after" || { echo "Unified Capital mutated canonical Market Data"; exit 1; }
          echo "Canonical Market Data preserved byte-for-byte: $after"

      - name: Rebuild Public Capital from coherent validation state
        run: node intelligence/market-data/public-capital-engine.mjs

      - name: Prove coherent Capital output and Presentation non-damage
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs');
          const p=JSON.parse(fs.readFileSync('companies/productivity-data.json','utf8'));
          const vmState=JSON.parse(fs.readFileSync('companies/votemarket-reference-state.json','utf8'));
          const c=JSON.parse(fs.readFileSync('intelligence/capital-state/capital-state.json','utf8'));
          const m=JSON.parse(fs.readFileSync('intelligence/market-data/market-data.json','utf8'));
          const pub=JSON.parse(fs.readFileSync('intelligence/market-data/public-capital-state.json','utf8'));
          const general=JSON.parse(fs.readFileSync('intelligence/capital-state/general-company-balance-sheet.json','utf8'));
          const defitea=JSON.parse(fs.readFileSync('companies/defitea-canonical-state.json','utf8'));
          const yieldring=JSON.parse(fs.readFileSync('companies/yieldring-canonical-state.json','utf8'));
          const html=fs.readFileSync('companies/index.html','utf8');
          const d=p.companies?.['defitea.eth'];
          const y=p.companies?.['YieldRing.eth'];
          const vm=p.diagnostics?.voteMarketIncomeChannels;
          const dc=(c.companies||[]).find(x=>x.registry==='004');
          const yc=(c.companies||[]).find(x=>x.registry==='002');
          const dg=(general.companies||[]).find(x=>x.registry==='004');
          const yg=(general.companies||[]).find(x=>x.registry==='002');
          if(!d||!y||!dc||!yc)throw new Error('Defitea/YieldRing coherent state unavailable');
          if(defitea.costBasis?.status!=='complete'||Number(defitea.costBasis?.totalUsd)!==9724.36||dg?.costBasisStatus!=='complete')throw new Error('Defitea complete historical basis missing');
          if(yieldring.portfolioCostBasis?.status!=='complete'||Number(yieldring.portfolioCostBasis?.totalUsd)!==2984.6||Number(yieldring.capital?.frax?.costBasisUsd)!==279.57||yg?.costBasisStatus!=='complete')throw new Error('YieldRing complete historical basis missing');
          if(yieldring.wallet?.onchainReconciliationStatus!=='pending-independent-reproduction')throw new Error('YieldRing provenance was silently upgraded');
          if(vm?.capitalDoubleCount!==false||vm?.idempotent!==true||vm?.factualIncomeAuthority!==false||vm?.executionAuthority!=='none')throw new Error('VoteMarket safety boundary missing');
          if(vm?.claimedPeriodPersistencePending!==false||vm?.observationPersistence!=='claimed-aware-derived-cache')throw new Error('VoteMarket persistence contract missing');
          if(vmState?.semantics?.sourceOfTruth!==false||vmState?.semantics?.executionAuthority!=='none')throw new Error('VoteMarket persistence cache authority drift');
          if(c.network?.registryCompanyCount!==10||c.network?.measuredCompanyCount!==10||c.network?.totalCapitalCompleteCompanyCount!==10||c.network?.totalCapitalCoverage!==1)throw new Error('Network coverage mismatch');
          if(!(Number(c.network?.networkTvlUsd)>0)||c.network?.networkTvlStatus!=='complete')throw new Error('Network TVL unavailable');
          if(c.authority?.executionAuthority!=='none'||pub.authority?.executionAuthority!=='none')throw new Error('authority drift');
          if(m.validationFixture!==true||m.semantics?.externalRequestCount!==0||m.semantics?.browserExternalPriceRequestsAllowed!==false)throw new Error('Zero-request CI Market Data contract drift');
          if(!Number.isFinite(Number(pub.funds?.defitea?.tvlUsd))||!Number.isFinite(Number(pub.totals?.fundEcosystemTvlUsd))||!Number.isFinite(Number(pub.totals?.companyNetworkTvlUsd)))throw new Error('Public Capital totals unavailable');
          if(pub.sourceState?.marketDataGeneratedAt!==m.generatedAt)throw new Error('Public Capital generation parity drift');
          if(html.includes('data-th-collection-passport-routing'))throw new Error('Capital refresh restored retired Collection -> Passport router');
          if(!html.includes('data-th-collection-index-navigation-v3')||!html.includes('window.__TH_COLLECTION_INDEX_NAV_V3__'))throw new Error('Capital refresh damaged canonical Collection -> Index v3 Presentation');
          console.log('Unified Capital E2E PASS',{marketFixture:true,externalPriceRequests:0,defiteaCostBasisUsd:defitea.costBasis.totalUsd,yieldRingCostBasisUsd:yieldring.portfolioCostBasis.totalUsd,networkTvlUsd:pub.totals.companyNetworkTvlUsd,presentationPreservedNotOwned:true});
          NODE
          git diff --check