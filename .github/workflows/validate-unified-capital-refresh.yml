name: "Validate Unified Capital Refresh"

on:
  pull_request:
    paths:
      - '.github/workflows/unified-capital-refresh.yml'
      - '.github/workflows/market-data-refresh.yml'
      - 'intelligence/capital-state/unified-capital-refresh.mjs'
      - 'intelligence/market-data/**'
      - 'companies/defitea-canonical-state.json'
      - 'companies/defitea-public-capital-projection.mjs'
      - 'companies/yieldring-canonical-state.json'
      - 'companies/yieldring-public-capital-projection.mjs'
      - 'productivity/productivity-engine.mjs'
      - 'productivity/company-010-productivity-overlay.mjs'
      - 'productivity/yieldring-productivity-overlay.mjs'
      - 'intelligence/capital-state/general-company-balance-sheet.mjs'
      - 'intelligence/capital-state/capital-state.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Prove Unified Capital is a Market Data consumer only
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs');
          const wf=fs.readFileSync('.github/workflows/unified-capital-refresh.yml','utf8');
          const guard=fs.readFileSync('intelligence/capital-state/unified-capital-market-data-guard.mjs','utf8');
          if(/run:\s*node intelligence\/market-data\/market-data-engine\.mjs/.test(wf))throw new Error('Unified Capital must not execute legacy Market Data writer');
          if(/git add[\s\\\n\r\t\w./-]*intelligence\/market-data\/market-data\.json/.test(wf))throw new Error('Unified Capital must not stage canonical market-data.json');
          if(!wf.includes('Require canonical per-asset Market Data')||!wf.includes('unified-capital-market-data-guard.mjs'))throw new Error('canonical Market Data admission guard missing');
          if(!guard.includes("prices['internet-computer']")||!guard.includes("selectedLane === 'onchain'"))throw new Error('ICP onchain consumer proof missing');
          if(!wf.includes("registry==='005'")||!wf.includes("registry==='006'"))throw new Error('Company #005/#006 ICP parity proof missing');
          console.log('Market Data writer ownership boundary PASS');
          NODE

      - name: Install Productivity dependencies
        working-directory: productivity
        run: npm install --no-audit --no-fund

      - name: Install Chromium without apt mutation
        working-directory: productivity
        run: npx playwright install chromium

      - name: Build zero-request deterministic Market Data fixture
        run: |
          set -euo pipefail
          node --check intelligence/market-data/market-data-validation-fixture.mjs
          node --check intelligence/market-data/coingecko-fetch-shim.mjs
          node intelligence/market-data/market-data-validation-fixture.mjs
          sha256sum intelligence/market-data/market-data.json | awk '{print $1}' > /tmp/market-data-before.sha256

      - name: Execute complete unified refresh with local Market Data only
        env:
          NODE_OPTIONS: --import=${{ github.workspace }}/intelligence/market-data/coingecko-fetch-shim.mjs
          ETH_RPC_URL: ${{ secrets.ETH_RPC_URL }}
          BASE_RPC_URL: ${{ secrets.BASE_RPC_URL }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node intelligence/capital-state/unified-capital-refresh.mjs

      - name: Prove canonical Market Data bytes were not mutated
        run: |
          set -euo pipefail
          before="$(cat /tmp/market-data-before.sha256)"
          after="$(sha256sum intelligence/market-data/market-data.json | awk '{print $1}')"
          test "$before" = "$after" || { echo "Unified Capital mutated canonical Market Data"; exit 1; }
          echo "Canonical Market Data preserved byte-for-byte: $after"

      - name: Rebuild Public Capital from coherent validation state
        run: node intelligence/market-data/public-capital-engine.mjs

      - name: Prove coherent Defitea, YieldRing, Market Data and Network output
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs');
          const p=JSON.parse(fs.readFileSync('companies/productivity-data.json','utf8'));
          const c=JSON.parse(fs.readFileSync('intelligence/capital-state/capital-state.json','utf8'));
          const m=JSON.parse(fs.readFileSync('intelligence/market-data/market-data.json','utf8'));
          const pub=JSON.parse(fs.readFileSync('intelligence/market-data/public-capital-state.json','utf8'));
          const html=fs.readFileSync('companies/index.html','utf8');
          const d=p.companies?.['defitea.eth'];
          const da=(d?.breakdown||[]).find(x=>x.engineId==='aerodrome_veaero'||x.principalId==='aerodrome-finance');
          const df=(d?.breakdown||[]).find(x=>x.engineId==='fx_vefxn'||x.principalId==='fxn-token');
          const dc=(c.companies||[]).find(x=>x.registry==='004');
          const dca=(dc?.measuredPositions||[]).find(x=>x.assetId==='aerodrome-finance');
          const dcf=(dc?.measuredPositions||[]).find(x=>x.assetId==='fxn-token');
          if(!d||Number(da?.units)!==2632||Number(df?.units)!==64.81)throw new Error('Defitea Productivity mismatch');
          if(!dc||Number(dca?.units)!==2632||Number(dcf?.units)!==64.81)throw new Error('Defitea Capital State mismatch');
          if(!html.includes('costBasisUsd: 1121.3')||!html.includes('qty: 192, entry: 0.42'))throw new Error('Defitea AERO lot basis missing');
          if(!html.includes('costBasisUsd: 983.2386')||!html.includes('qty: 5, entry: 16.5'))throw new Error('Defitea FXN lot basis missing');
          if(!html.includes('const publicCompanyTvl = (key, fallback) =>')||!html.includes('canonicalNetworkTvl'))throw new Error('Companies Public Capital binding missing');
          const y=p.companies?.['YieldRing.eth'];
          const pa=(y?.breakdown||[]).find(x=>x.engineId==='aerodrome_veaero'||x.principalId==='aerodrome-finance');
          const yc=(c.companies||[]).find(x=>x.registry==='002');
          const btc=(yc?.measuredPositions||[]).find(x=>x.assetId==='bitcoin');
          const aero=(yc?.measuredPositions||[]).find(x=>x.assetId==='aerodrome-finance');
          if(p.version!=='1.16'||Number(pa?.units)!==678)throw new Error('YieldRing Productivity mismatch');
          if(Number(btc?.units)!==0.0334||Number(aero?.units)!==678)throw new Error('YieldRing Capital State mismatch');
          if(c.network?.registryCompanyCount!==10||c.network?.measuredCompanyCount!==10||c.network?.totalCapitalCompleteCompanyCount!==10||c.network?.totalCapitalCoverage!==1)throw new Error('Network coverage mismatch');
          if(!(Number(c.network?.networkTvlUsd)>0)||c.network?.networkTvlStatus!=='complete')throw new Error('Network TVL unavailable');
          if(c.authority?.executionAuthority!=='none'||pub.authority?.executionAuthority!=='none')throw new Error('authority drift');
          if(m.validationFixture!==true||m.semantics?.externalRequestCount!==0||m.semantics?.browserExternalPriceRequestsAllowed!==false)throw new Error('Zero-request CI Market Data contract drift');
          if(!Number.isFinite(Number(pub.funds?.defitea?.tvlUsd))||!Number.isFinite(Number(pub.funds?.defitea?.referenceAprPct)))throw new Error('Defitea Public Capital unavailable');
          if(!Number.isFinite(Number(pub.totals?.fundEcosystemTvlUsd))||!Number.isFinite(Number(pub.totals?.companyNetworkTvlUsd)))throw new Error('Public Capital totals unavailable');
          console.log('Unified Capital Refresh E2E PASS',{generatedAt:p.generatedAt,marketFixture:true,externalPriceRequests:0,defiteaApr:d.aprLatest,defiteaTvl:pub.funds.defitea.tvlUsd,defiteaAero:dca.units,defiteaFxn:dcf.units,yieldRingApr:y.aprLatest,networkTvlUsd:pub.totals.companyNetworkTvlUsd,fundEcosystemTvlUsd:pub.totals.fundEcosystemTvlUsd});
          NODE
          git diff --check
