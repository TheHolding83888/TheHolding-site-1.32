name: Apply bounded P5 admission patch

on:
  push:
    branches:
      - fix/p5-discovered-valuation-admission-20260914
    paths:
      - '.github/workflows/apply-p5-admission-patch.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/p5-discovered-valuation-admission-20260914
      - name: Apply narrow canonical admission patch
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          p=Path('reporting/income-ledger.mjs')
          s=p.read_text()
          old="""const EXACT_BLOCK_SOURCE_FAMILIES=new Set([\n  'historical-onchain-chainlink-at-boundary',\n  'historical-onchain-velodrome-twap-chainlink-at-boundary',\n  'historical-onchain-slipstream-twap-chainlink-at-boundary'\n]);"""
          new="""const EXACT_BLOCK_SOURCE_FAMILIES=new Set([\n  'historical-onchain-chainlink-at-boundary',\n  'historical-onchain-velodrome-twap-chainlink-at-boundary',\n  'historical-onchain-slipstream-twap-chainlink-at-boundary',\n  'historical-onchain-aerodrome-twap-chainlink-at-boundary',\n  'historical-onchain-velodrome-discovered-twap-chainlink-at-boundary'\n]);"""
          if s.count(old)!=1: raise SystemExit('income-ledger exact-family anchor drift')
          s=s.replace(old,new)
          anchor="    const resolution={version:HISTORICAL_VALUATION_RESOLUTION_VERSION"
          if s.count(anchor)!=1: raise SystemExit('income-ledger resolution anchor drift')
          extra="""    const discoveredAerodromeFields=sourceFamily==='historical-onchain-aerodrome-twap-chainlink-at-boundary'?{poolFactory:valuation.poolFactory||null,tickSpacing:Number(valuation.tickSpacing),routeSelection:valuation.routeSelection||null,routeCandidateCount:Number(valuation.routeCandidateCount),poolToken0:valuation.poolToken0||null,poolToken1:valuation.poolToken1||null,poolLiquidity:valuation.poolLiquidity||null,rewardToken:valuation.rewardToken||null,rewardTokenDecimals:Number(valuation.rewardTokenDecimals),quoteToken:valuation.quoteToken||null,quoteTokenSymbol:valuation.quoteTokenSymbol||null,quoteTokenAmount:finite(valuation.quoteTokenAmount)?round(valuation.quoteTokenAmount,12):null,twapSeconds:Number(valuation.twapSeconds),averageTick:Number(valuation.averageTick),quoteChainlinkContract:valuation.quoteChainlinkContract||null,quoteRoundId:valuation.quoteRoundId||null,quoteAnsweredInRound:valuation.quoteAnsweredInRound||null,quoteObservedAt:valuation.quoteObservedAt||null,quotePriceUsd:finite(valuation.quotePriceUsd)?round(valuation.quotePriceUsd,12):null}:{};\n    const discoveredVelodromeFields=sourceFamily==='historical-onchain-velodrome-discovered-twap-chainlink-at-boundary'?{poolFactory:valuation.poolFactory||null,poolToken0:valuation.poolToken0||null,poolToken1:valuation.poolToken1||null,poolStable:valuation.poolStable===true,rewardToken:valuation.rewardToken||null,rewardTokenDecimals:Number(valuation.rewardTokenDecimals),quoteToken:valuation.quoteToken||null,quoteTokenSymbol:valuation.quoteTokenSymbol||null,quoteAmountOutRaw:valuation.quoteAmountOutRaw||null,quoteTokenAmount:finite(valuation.quoteTokenAmount)?round(valuation.quoteTokenAmount,12):null,twapGranularity:Number(valuation.twapGranularity),observationLength:Number(valuation.observationLength),quoteChainlinkContract:valuation.quoteChainlinkContract||null,quoteRoundId:valuation.quoteRoundId||null,quoteAnsweredInRound:valuation.quoteAnsweredInRound||null,quoteObservedAt:valuation.quoteObservedAt||null,quotePriceUsd:finite(valuation.quotePriceUsd)?round(valuation.quotePriceUsd,12):null}:{};\n"""
          s=s.replace(anchor,extra+anchor)
          oldspread="...onchainCommon,...chainlinkFields,...twapFields,...slipstreamFields,identityBound:true"
          newspread="...onchainCommon,...chainlinkFields,...twapFields,...slipstreamFields,...discoveredAerodromeFields,...discoveredVelodromeFields,identityBound:true"
          if s.count(oldspread)!=1: raise SystemExit('income-ledger spread anchor drift')
          s=s.replace(oldspread,newspread)
          olddesc="canonical Market Data Git history, exact historical onchain Chainlink, exact-block Velodrome TWAP plus Chainlink quote, or exact-block Slipstream TWAP plus Chainlink quote at original accounting boundary"
          newdesc="canonical Market Data Git history, exact historical onchain Chainlink, explicit or factory-discovered exact-block Velodrome TWAP plus Chainlink quote, or explicit or factory-discovered exact-block Aerodrome/Slipstream TWAP plus Chainlink quote at original accounting boundary"
          if olddesc in s: s=s.replace(olddesc,newdesc)
          p.write_text(s)

          p=Path('reporting/ve33-historical-valuation-identity.mjs')
          s=p.read_text()
          anchor="""} from './historical-canonical-price.mjs';\n\nconst lower=v=>String(v||'').toLowerCase();"""
          imports="""} from './historical-canonical-price.mjs';\nimport {\n  AERODROME_SLIPSTREAM_FACTORIES, CANONICAL_TICK_SPACINGS, BASE_NATIVE_USDC, DEFAULT_TWAP_SECONDS\n} from './historical-aerodrome-usdc-route.mjs';\nimport { BASE_NATIVE_USDC_CHAINLINK_FEED } from './historical-aerodrome-discovered-price.mjs';\nimport {\n  OPTIMISM_VELODROME_V2_FACTORY, OPTIMISM_NATIVE_USDC, DEFAULT_TWAP_GRANULARITY\n} from './historical-velodrome-usdc-route.mjs';\nimport { OPTIMISM_NATIVE_USDC_CHAINLINK_FEED } from './historical-velodrome-discovered-price.mjs';\n\nconst lower=v=>String(v||'').toLowerCase();"""
          if s.count(anchor)!=1: raise SystemExit('identity import anchor drift')
          s=s.replace(anchor,imports)
          anchor="""  return false;\n}"""
          cases="""  if(family==='historical-onchain-aerodrome-twap-chainlink-at-boundary'){\n    const pair=new Set([lower(resolution?.poolToken0),lower(resolution?.poolToken1)]);\n    const factoryOk=AERODROME_SLIPSTREAM_FACTORIES.map(lower).includes(lower(resolution?.poolFactory));\n    const spacingOk=CANONICAL_TICK_SPACINGS.includes(Number(resolution?.tickSpacing));\n    return Number(event?.chainId)===8453&&Number(resolution?.sourceChainId)===8453&&\n      lower(resolution?.rewardToken)===identity.token&&factoryOk&&spacingOk&&\n      String(resolution?.routeSelection||'')==='highest-active-liquidity-at-historical-boundary'&&\n      Number.isInteger(Number(resolution?.routeCandidateCount))&&Number(resolution?.routeCandidateCount)>=1&&\n      pair.size===2&&pair.has(identity.token)&&pair.has(lower(BASE_NATIVE_USDC))&&\n      lower(resolution?.quoteToken)===lower(BASE_NATIVE_USDC)&&\n      lower(resolution?.quoteChainlinkContract)===lower(BASE_NATIVE_USDC_CHAINLINK_FEED)&&\n      Number(resolution?.twapSeconds)===Number(DEFAULT_TWAP_SECONDS)&&Number.isSafeInteger(Number(resolution?.averageTick))&&\n      resolution?.stablecoinPegAssumptionUsed===false&&\n      String(resolution?.sourceStatus||'')==='historical-onchain-aerodrome-discovered-twap-chainlink-price';\n  }\n  if(family==='historical-onchain-velodrome-discovered-twap-chainlink-at-boundary'){\n    const pair=new Set([lower(resolution?.poolToken0),lower(resolution?.poolToken1)]);\n    return Number(event?.chainId)===10&&Number(resolution?.sourceChainId)===10&&\n      lower(resolution?.rewardToken)===identity.token&&\n      lower(resolution?.poolFactory)===lower(OPTIMISM_VELODROME_V2_FACTORY)&&\n      pair.size===2&&pair.has(identity.token)&&pair.has(lower(OPTIMISM_NATIVE_USDC))&&\n      lower(resolution?.quoteToken)===lower(OPTIMISM_NATIVE_USDC)&&\n      lower(resolution?.quoteChainlinkContract)===lower(OPTIMISM_NATIVE_USDC_CHAINLINK_FEED)&&\n      Number(resolution?.twapGranularity)===Number(DEFAULT_TWAP_GRANULARITY)&&\n      Number.isSafeInteger(Number(resolution?.observationLength))&&Number(resolution?.observationLength)>Number(DEFAULT_TWAP_GRANULARITY)&&\n      typeof resolution?.poolStable==='boolean'&&resolution?.stablecoinPegAssumptionUsed===false&&\n      String(resolution?.sourceStatus||'')==='historical-onchain-velodrome-discovered-twap-chainlink-price';\n  }\n  return false;\n}"""
          if s.count(anchor)!=1: raise SystemExit('identity final anchor drift')
          s=s.replace(anchor,cases)
          p.write_text(s)
          PY

          node --check reporting/income-ledger.mjs
          node --check reporting/ve33-historical-valuation-identity.mjs
          node reporting/verify-p5-discovered-valuation-admission.mjs

          git config user.name "TheHolding83888"
          git config user.email "270993406+TheHolding83888@users.noreply.github.com"
          git rm .github/workflows/apply-p5-admission-patch.yml
          git add reporting/income-ledger.mjs reporting/ve33-historical-valuation-identity.mjs reporting/verify-p5-discovered-valuation-admission.mjs .github/workflows/verify-p5-discovered-valuation-admission.yml
          git commit -m "Accounting: admit discovered historical valuation proofs"
          git push origin HEAD:fix/p5-discovered-valuation-admission-20260914
