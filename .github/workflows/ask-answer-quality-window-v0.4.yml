name: "The Holding · Ask Answer Quality Window v0.4"

on:
  push:
    branches: [agents/ask-answer-contract-v0.4-20260814]
    paths:
      - 'verification/ask-answer-quality-window-integrator-v0.4.mjs'
      - '.github/workflows/ask-answer-quality-window-v0.4.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ask-answer-quality-window-v04
  cancel-in-progress: false

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout candidate branch
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: agents/ask-answer-contract-v0.4-20260814
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Validate integrator syntax
        run: node --check verification/ask-answer-quality-window-integrator-v0.4.mjs

      - name: Apply bounded local quality window
        run: node verification/ask-answer-quality-window-integrator-v0.4.mjs

      - name: Validate Console syntax and diff
        shell: bash
        run: |
          set -euo pipefail
          node --check agents/console/app.js
          node --check agents/console/safety.js
          git diff --check

      - name: Verify 30-day metrics contract and privacy
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('fs');
          const app = fs.readFileSync('agents/console/app.js', 'utf8');
          const learning = JSON.parse(fs.readFileSync('worker/wrangler.learning.jsonc', 'utf8'));
          const required = [
            "0.2-local-answer-quality-30d",
            'ANSWER_QUALITY_WINDOW_DAYS = 30',
            'ANSWER_QUALITY_EVENT_LIMIT = 500',
            'rebuildAnswerQuality',
            'quality.rates[key]',
            'quality.unresolved',
            'HoldingAnswerQuality'
          ];
          for (const token of required) if (!app.includes(token)) throw new Error(`Missing bounded-quality invariant: ${token}`);
          if (String(learning.vars?.LEARNING_INTAKE_ENABLED) !== 'false') throw new Error('Persistent learning activated unexpectedly');
          if (app.includes("fetch('/api/learning-") || app.includes('fetch(`/api/learning-')) throw new Error('New learning API transmission path detected');
          const eventLiteral = `const event = {\n      at: Date.now(),\n      bucket,\n      topic,\n      language: contract.language === 'ru' ? 'ru' : 'en',\n      fingerprint: fingerprint || null\n    };`;
          if (!app.includes(eventLiteral)) throw new Error('Quality event schema changed unexpectedly');
          if (/const event = \{[^}]*\b(?:question|raw|text|answer)\b/s.test(app)) throw new Error('Raw conversational content entered quality event schema');
          console.log('30-day local quality + privacy invariants PASS');
          NODE

      - name: Verify rolling-window behavior
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const DAY = 24 * 60 * 60 * 1000;
          const now = Date.now();
          const events = [
            { at: now - 31 * DAY, bucket: 'unknown', topic: 'old', language: 'en', fingerprint: 'aaaaaaaaaaaaaaaaaaaaaaaa' },
            { at: now - 2 * DAY, bucket: 'unknown', topic: 'protocol:aerodrome', language: 'ru', fingerprint: 'bbbbbbbbbbbbbbbbbbbbbbbb' },
            { at: now - 1 * DAY, bucket: 'measured', topic: 'productivity', language: 'ru', fingerprint: null },
            { at: now, bucket: 'partial', topic: 'stable', language: 'en', fingerprint: null }
          ];
          const bounded = events.filter(e => e.at >= now - 30 * DAY).slice(-500);
          if (bounded.length !== 3) throw new Error('30-day pruning failed');
          const counts = { measured: 0, partial: 0, warming: 0, unknown: 0, error: 0 };
          for (const event of bounded) counts[event.bucket] += 1;
          const total = bounded.length;
          const rates = Object.fromEntries(Object.entries(counts).map(([k,v]) => [k, total ? v / total : 0]));
          if (rates.unknown !== 1/3 || rates.measured !== 1/3 || rates.partial !== 1/3) throw new Error('Rate calculation failed');
          if (bounded.some(e => e.topic === 'old')) throw new Error('Expired event survived rolling window');
          console.log('30-day rolling-window behavior PASS');
          NODE

      - name: Re-verify Answer Contract semantics
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('fs');
          const app = fs.readFileSync('agents/console/app.js','utf8');
          const required = [
            "0.1-source-bound-answer-contract",
            String.raw`const hasMeasuredValue = /(?:\$|\d+(?:[.,]\d+)?%)/.test`,
            String.raw`matchAll(/(?:coverage|покрытие)[^0-9]{0,24}(\d+(?:[.,]\d+)?)%/gi)`,
            'dataset.answerContractVersion',
            'dataset.answerConfidenceClass',
            'This answer has no verified source artifact'
          ];
          for (const token of required) if (!app.includes(token)) throw new Error(`Answer Contract regression: ${token}`);
          console.log('Answer Contract semantic regression guard PASS');
          NODE

      - name: Publish product file only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "The Holding Integration"
          git config user.email "integration@theholding.ai"
          git add agents/console/app.js
          test -n "$(git diff --cached --name-only)"
          git commit -m "agents: bound answer quality to a 30-day window"
          git push origin HEAD:agents/ask-answer-contract-v0.4-20260814
