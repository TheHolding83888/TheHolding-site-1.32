name: "Validate OVR Onchain Market Data"

on:
  pull_request:
    paths:
      - 'intelligence/market-data/onchain-price-source-registry-extensions.json'
      - 'intelligence/market-data/onchain-price-resolver.mjs'
      - 'intelligence/market-data/onchain-price-resolver-v08.mjs'
      - 'intelligence/market-data/onchain-uniswap-v3-twap.mjs'
      - 'intelligence/market-data/onchain-uniswap-v3-twap-validation.mjs'
      - 'intelligence/market-data/onchain-uniswap-v2-historical-twap.mjs'
      - 'intelligence/market-data/onchain-uniswap-v2-historical-twap-validation.mjs'
      - '.github/workflows/market-data-refresh.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout PR head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Validate shared V3 and V2 TWAP runtimes
        run: |
          set -euo pipefail
          node --check intelligence/market-data/onchain-price-resolver.mjs
          node --check intelligence/market-data/onchain-price-resolver-v08.mjs
          node --check intelligence/market-data/onchain-uniswap-v3-twap.mjs
          node --check intelligence/market-data/onchain-uniswap-v3-twap-validation.mjs
          node --check intelligence/market-data/onchain-uniswap-v2-historical-twap.mjs
          node --check intelligence/market-data/onchain-uniswap-v2-historical-twap-validation.mjs
          node intelligence/market-data/onchain-uniswap-v3-twap-validation.mjs
          node intelligence/market-data/onchain-uniswap-v2-historical-twap-validation.mjs
      - name: Prove OVR remains exact and additive-safe
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs');
          const market=JSON.parse(fs.readFileSync('intelligence/market-data/market-price-registry.json','utf8'));
          const base=JSON.parse(fs.readFileSync('intelligence/market-data/onchain-price-source-registry.json','utf8'));
          const ext=JSON.parse(fs.readFileSync('intelligence/market-data/onchain-price-source-registry-extensions.json','utf8'));
          const ids=(market.assets||[]).map(x=>x.assetId),effective={...(base.assets||{}),...(ext.assets||{})};
          const routed=ids.filter(id=>effective[id]),pending=ids.filter(id=>!effective[id]);
          if(ids.length!==26||routed.length<24||pending.includes('ovr'))throw new Error('OVR coverage regression');
          const r=ext.assets?.ovr?.route;
          if(!r||r.type!=='uniswap-v3-twap-relative'||r.network!=='ethereum'||r.authority!=='shadow')throw new Error('OVR route invalid');
          if(r.factory.toLowerCase()!=='0x1f98431c8ad98523631ae4a59f267346ea31f984'||r.token.toLowerCase()!=='0x21bfbda47a0b4b5b1248c767ee49f7caa9b23697'||r.quoteToken.toLowerCase()!=='0xc02aaa39b223fe8d0a0e5c4f27ead9083c756cc2')throw new Error('OVR identity drift');
          if(Number(r.fee)!==10000||Number(r.twapWindowSeconds)!==1800||Number(r.maxDivergencePct)!==10)throw new Error('OVR TWAP contract drift');
          console.log('OVR additive-safe gate PASS',{routed:routed.length,pending});
          NODE
      - name: Prove BEAM remains exact and additive-safe
        run: |
          set -euo pipefail
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          import { mergeOnchainRegistryExtensions } from './intelligence/market-data/onchain-price-resolver.mjs';
          const market=JSON.parse(fs.readFileSync('intelligence/market-data/market-price-registry.json','utf8'));
          const base=JSON.parse(fs.readFileSync('intelligence/market-data/onchain-price-source-registry.json','utf8'));
          const ext=JSON.parse(fs.readFileSync('intelligence/market-data/onchain-price-source-registry-extensions.json','utf8'));
          const effective=mergeOnchainRegistryExtensions(base,ext);
          const ids=(market.assets||[]).map(x=>x.assetId),routed=ids.filter(id=>effective.assets?.[id]),pending=ids.filter(id=>!effective.assets?.[id]);
          const special=Object.keys(effective.assets||{}).filter(id=>!ids.includes(id));
          if(routed.length!==26||pending.length!==0)throw new Error(`BEAM coverage regression: routed=${routed.length}, pending=${pending.join(',')}`);
          if(special.length!==1||special[0]!=='physical-silver')throw new Error(`Unexpected special routes: ${special.join(',')}`);
          const r=effective.assets?.['beam-2']?.route;
          if(!r||r.type!=='uniswap-v3-twap-relative'||r.network!=='ethereum'||r.authority!=='shadow')throw new Error('BEAM route invalid');
          if(r.factory.toLowerCase()!=='0x1f98431c8ad98523631ae4a59f267346ea31f984'||r.token.toLowerCase()!=='0x62d0a8458ed7719fdaf978fe5929c6d342b0bfce'||r.quoteToken.toLowerCase()!=='0xc02aaa39b223fe8d0a0e5c4f27ead9083c756cc2')throw new Error('BEAM identity drift');
          if(Number(r.fee)!==10000||Number(r.twapWindowSeconds)!==1800||Number(r.maxDivergencePct)!==10)throw new Error('BEAM TWAP contract drift');
          if(ext.semantics?.uniswapV3SpotPriceAuthority!==false||ext.semantics?.productionPriceAuthority!==false||ext.semantics?.executionAuthority!=='none')throw new Error('Authority drift');
          console.log('BEAM V3 stacked gate PASS',{routed:routed.length,pending,totalObservationTargets:routed.length+special.length});
          NODE
          git diff --check
