name: Verify ve33 Locked-Managed Historical Accounting

on:
  pull_request:
    paths:
      - 'reporting/ve33-locked-managed-accounting-evidence.mjs'
      - 'reporting/ve33-locked-managed-accounting-evidence-validation.mjs'
      - 'reporting/ve33-locked-managed-income-candidates.mjs'
      - 'reporting/ve33-locked-managed-income-candidates-validation.mjs'
      - 'reporting/ve33-locked-managed-ledger-admission-validation.mjs'
      - 'reporting/ve33-ledger-admission.mjs'
      - 'reporting/ve33-accounting-runner.mjs'
      - 'reporting/historical-canonical-price.mjs'
      - '.github/workflows/verify-ve33-locked-managed-history.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-locked-managed-history:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout full candidate history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: Install runtime dependency
        run: npm install --no-save --no-package-lock ethers@6

      - name: Static + deterministic validation
        run: |
          set -euo pipefail
          node --check reporting/ve33-locked-managed-accounting-evidence.mjs
          node --check reporting/ve33-locked-managed-accounting-evidence-validation.mjs
          node --check reporting/ve33-locked-managed-income-candidates.mjs
          node --check reporting/ve33-locked-managed-income-candidates-validation.mjs
          node --check reporting/ve33-locked-managed-ledger-admission-validation.mjs
          node --check reporting/ve33-ledger-admission.mjs
          node reporting/ve33-locked-managed-accounting-evidence-validation.mjs
          node reporting/ve33-locked-managed-income-candidates-validation.mjs
          node reporting/ve33-locked-managed-ledger-admission-validation.mjs
          git diff --check

      - name: Live Defitea August historical canary
        env:
          REWARDS_DATA_FILE: ./companies/rewards-data.json
          BASE_RPC_URL: ${{ secrets.BASE_RPC_URL }}
          OPTIMISM_RPC_URL: ${{ secrets.OPTIMISM_RPC_URL || 'https://gateway.tenderly.co/public/optimism' }}
          VE33_STATE_READ_CONCURRENCY: '2'
          VE33_SETTLEMENT_CONCURRENCY: '2'
        run: |
          set -euo pipefail
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          import { selectHistoricalProviders } from './reporting/ve33-accounting-runner.mjs';
          import {
            buildLockedManagedEvidence,
            LOCKED_MANAGED_ACCOUNTING_START,
            trackedLockedManagedDescriptors
          } from './reporting/ve33-locked-managed-accounting-evidence.mjs';
          import { validateLockedManagedEvidence } from './reporting/ve33-locked-managed-income-candidates.mjs';
          import { validateLockedManagedHistoricalSelection } from './reporting/ve33-ledger-admission.mjs';

          const rewards=JSON.parse(fs.readFileSync(process.env.REWARDS_DATA_FILE,'utf8'));
          const previous=JSON.parse(fs.readFileSync('./reporting/ve33-locked-managed-accounting-evidence.json','utf8'));
          if(LOCKED_MANAGED_ACCOUNTING_START!=='2026-08-01T00:00:00.000Z') throw new Error('locked-managed August accounting start missing');

          const selection=await selectHistoricalProviders({rewards,env:process.env});
          const required=validateLockedManagedHistoricalSelection({rewards,selection});
          if(!required.includes('aerodrome')) throw new Error('Defitea Aerodrome locked-managed protocol not routed through historical provider');

          const evidence=await buildLockedManagedEvidence({rewards,previous,providers:selection.providers});
          validateLockedManagedEvidence(evidence);

          const defiteaLanes=trackedLockedManagedDescriptors(rewards).filter(x=>x.company==='defitea.eth'&&x.protocolKey==='aerodrome');
          if(!defiteaLanes.length) throw new Error('Defitea Aerodrome locked-managed lane missing');
          const aug='2026-08-01T00:00:00.000Z',sep='2026-09-01T00:00:00.000Z';
          const laneDiagnostics=[];
          for(const lane of defiteaLanes){
            const rows=(evidence.checkpoints||[]).filter(x=>x.laneKey===lane.laneKey);
            const opening=rows.find(x=>x.observedAt===aug&&x.monthBoundary===true);
            const closing=rows.find(x=>x.observedAt===sep&&x.monthBoundary===true);
            if(!opening||!closing) throw new Error(`Defitea August exact locked-managed boundaries missing: ${lane.laneKey}`);
            if(opening.exactBlockTaggedState!==true||closing.exactBlockTaggedState!==true) throw new Error(`Defitea August boundary not exact block-tagged state: ${lane.laneKey}`);
            laneDiagnostics.push({
              laneKey:lane.laneKey,
              tokenId:lane.tokenId,
              managedTokenId:lane.managedTokenId,
              lockedManagedReward:lane.lockedManagedReward,
              rewardToken:lane.rewardToken,
              openingBlock:opening.blockNumber,
              openingRaw:opening.entitlementRaw,
              openingAmount:opening.entitlementAmount,
              closingBlock:closing.blockNumber,
              closingRaw:closing.entitlementRaw,
              closingAmount:closing.entitlementAmount,
              rawDelta:(BigInt(closing.entitlementRaw)-BigInt(opening.entitlementRaw)).toString()
            });
          }

          const august=(evidence.events||[]).filter(x=>x.company==='defitea.eth'&&x.protocol==='Aerodrome'&&x.periodAttributionMonth==='2026-08');
          console.log('Defitea August locked-managed boundary diagnosis',{
            lanes:laneDiagnostics,
            augustEvents:august.map(x=>({eventKey:x.eventKey,amount:x.amount,amountRaw:x.amountRaw,usdValue:x.usdValue,openingEntitlementRaw:x.openingEntitlementRaw,closingEntitlementRaw:x.closingEntitlementRaw,settlementRaw:x.settlementRaw,settlementEventCount:x.settlementEventCount,valuationStatus:x.valuationStatus})),
            diagnostics:{
              acceptedPositiveIntervalCount:evidence.diagnostics?.acceptedPositiveIntervalCount||0,
              zeroIntervalCount:evidence.diagnostics?.zeroIntervalCount||0,
              reconciliationCount:evidence.diagnostics?.reconciliationCount||0,
              unresolvedSettlementEventCount:evidence.diagnostics?.unresolvedSettlementEventCount||0,
              unvaluedIntervalCount:evidence.diagnostics?.unvaluedIntervalCount||0,
              historicalPriceResolvedIntervalCount:evidence.diagnostics?.historicalPriceResolvedIntervalCount||0,
              historicalPriceUnresolvedIntervalCount:evidence.diagnostics?.historicalPriceUnresolvedIntervalCount||0,
              aerodrome:evidence.diagnostics?.protocols?.aerodrome||null
            }
          });

          if(!august.length) throw new Error('Defitea August locked-managed factual event missing');
          const positive=august.filter(x=>Number(x.amount)>0);
          if(!positive.length) throw new Error('Defitea August locked-managed factual accrual is not positive');
          for(const event of positive){
            if(!(Number(event.usdValue)>0)) throw new Error(`Defitea August historical USD valuation unresolved: ${event.eventKey}`);
            if(event.valuationStatus!=='historical-canonical-market-price-frozen-at-closing-accounting-boundary') throw new Error(`Defitea August valuation is not historical canonical: ${event.eventKey}`);
            if(!event.valuationSourceCommit||!event.valuationSourceFile) throw new Error(`Defitea August historical price provenance missing: ${event.eventKey}`);
            if(event.referenceAprUsed!==false||event.executionAuthority!=='none') throw new Error(`Defitea August accounting authority expanded: ${event.eventKey}`);
          }

          const defiteaBoundaryFailures=Object.values(evidence.diagnostics?.protocols||{}).flatMap(x=>x.boundaryFailures||[]).filter(x=>String(x.laneKey||'').includes('|defitea.eth|')&&(x.boundaryAt===aug||x.boundaryAt===sep));
          if(defiteaBoundaryFailures.length) throw new Error(`Defitea historical boundary failures: ${JSON.stringify(defiteaBoundaryFailures)}`);

          console.log('Defitea August locked-managed historical canary PASS',{
            lanes:defiteaLanes.length,
            events:august.length,
            amount:august.reduce((s,x)=>s+Number(x.amount||0),0),
            usd:august.reduce((s,x)=>s+Number(x.usdValue||0),0),
            selected:Object.fromEntries(required.map(k=>[k,selection.diagnostics?.[k]?.selectedProvider||null])),
            historicalPriceResolved:evidence.diagnostics?.historicalPriceResolvedIntervalCount||0,
            executionAuthority:evidence.authority?.executionAuthority
          });
          NODE
