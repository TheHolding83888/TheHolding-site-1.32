name: "The Holding Market Data · Daily CoinGecko Baseline"

on:
  workflow_dispatch:
  schedule:
    - cron: '12 3 * * *'

permissions:
  contents: write

concurrency:
  group: shared-market-data-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout canonical main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Validate Market Data engines
        run: |
          set -euo pipefail
          node --check intelligence/market-data/market-data-engine.mjs
          node --check intelligence/market-data/market-data-authority-materializer.mjs
          node --check intelligence/market-data/public-capital-engine.mjs

      - name: Refresh CoinGecko baseline exactly once
        env:
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
          MARKET_DATA_DAILY_REFRESH: 'true'
        run: node intelligence/market-data/market-data-engine.mjs

      - name: Materialize production authority from latest Shadow
        env:
          MARKET_DATA_FORCE_COINGECKO_FAILBACK: 'false'
        run: node intelligence/market-data/market-data-authority-materializer.mjs

      - name: Rebuild public fund + company capital view
        run: node intelligence/market-data/public-capital-engine.mjs

      - name: Validate daily baseline safety
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs');
          const source=JSON.parse(fs.readFileSync('intelligence/market-data/market-data-coingecko.json','utf8'));
          const market=JSON.parse(fs.readFileSync('intelligence/market-data/market-data.json','utf8'));
          const pub=JSON.parse(fs.readFileSync('intelligence/market-data/public-capital-state.json','utf8'));
          const registry=JSON.parse(fs.readFileSync('intelligence/market-data/market-price-registry.json','utf8'));
          if(source.version!=='0.5-market-data-strict-daily-coingecko-cadence')throw new Error('Strict daily CoinGecko cadence version missing');
          if(source.semantics?.externalFetchAllowedOnlyWhenDailyRefreshTrue!==true)throw new Error('Daily-only external fetch contract missing');
          if(source.semantics?.nonDailyExternalFetchForbidden!==true)throw new Error('Non-daily CoinGecko prohibition missing');
          if(source.semantics?.dailyScheduledExternalRefreshRequiresExplicitOverride!==true)throw new Error('Daily explicit override contract missing');
          if(Number(source.semantics?.staleFallbackMaxAgeHours)!==30)throw new Error('Daily fallback retention must be 30 hours');
          if(Number(source.coverage?.unknownCount)!==0)throw new Error('Daily CoinGecko baseline contains unknown assets');
          if((registry.assets||[]).length!==26)throw new Error('Canonical daily CoinGecko registry must contain 26 assets');
          for(const asset of registry.assets||[]){
            const sourceRow=source.prices?.[asset.assetId];
            const row=market.prices?.[asset.assetId];
            if(!sourceRow||!Number.isFinite(Number(sourceRow.usd)))throw new Error(`${asset.assetId}: daily CoinGecko sanity price unavailable`);
            if(!row||row.authority?.requestedPrimary!=='onchain')throw new Error(`${asset.assetId}: production authority is not onchain-primary`);
            if(!['onchain','coingecko-lane'].includes(row.authority?.selectedLane))throw new Error(`${asset.assetId}: invalid production lane`);
            if(row.authority.selectedLane==='coingecko-lane'&&row.authority.fallbackUsed!==true)throw new Error(`${asset.assetId}: CoinGecko may only be fallback in production authority`);
          }
          if(market.sourceState?.coinGeckoGeneratedAt!==source.generatedAt)throw new Error('Canonical state not bound to fresh daily CoinGecko baseline');
          if(market.authority?.executionAuthority!=='none'||pub.authority?.executionAuthority!=='none')throw new Error('Execution authority drift');
          if(market.authority?.capitalExecution!==false||market.authority?.policyMutationAuthority!==false)throw new Error('Authority boundary drift');
          console.log('Strict daily CoinGecko sanity/fallback baseline PASS',{
            generatedAt:source.generatedAt,
            canonicalAssetCount:registry.assets.length,
            onchainSelectedAssetCount:market.authority.onchainSelectedAssetCount,
            coingeckoFailbackAssetCount:market.authority.coingeckoSelectedAssetCount
          });
          NODE
          git diff --check

      - name: Publish daily CoinGecko baseline safely
        run: |
          set -euo pipefail
          git config user.name "The Holding Market Data Orchestrator"
          git config user.email "market-data-orchestrator@theholding.ai"
          git add intelligence/market-data/market-data-coingecko.json intelligence/market-data/market-data.json intelligence/market-data/public-capital-state.json
          if git diff --cached --quiet; then echo 'Daily CoinGecko baseline already current.'; exit 0; fi
          git commit -m "market data: refresh daily CoinGecko baseline"
          for attempt in 1 2 3; do
            git fetch origin main
            if ! git rebase origin/main; then git rebase --abort || true; echo 'Daily CoinGecko writer conflict; refusing to guess.'; exit 1; fi
            MARKET_DATA_FORCE_COINGECKO_FAILBACK='false' node intelligence/market-data/market-data-authority-materializer.mjs
            node intelligence/market-data/public-capital-engine.mjs
            git add intelligence/market-data/market-data-coingecko.json intelligence/market-data/market-data.json intelligence/market-data/public-capital-state.json
            git commit --amend --no-edit
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1
