name: "The Holding Market Data · Daily CoinGecko Baseline"
# holding-workflow-definition-proof: intelligence/reliability/market-data-scheduler-workflow-definition-proof.mjs

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'intelligence/market-data/market-price-registry.json'
      - 'intelligence/market-data/market-data-engine.mjs'
      - 'intelligence/market-data/market-data-authority-policy.json'
      - 'intelligence/market-data/market-data-authority-materializer.mjs'
      - 'intelligence/market-data/market-data-scheduler-contract.json'
      - 'intelligence/reliability/market-data-scheduler-workflow-definition-proof.mjs'
      - '.github/workflows/market-data-coingecko-daily.yml'
  schedule:
    - cron: '12 3 * * *'
    - cron: '12 7,11,15,19,23 * * *'

permissions:
  contents: write

concurrency:
  group: shared-market-data-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout canonical main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main
          fetch-depth: 0

      - name: Determine scheduled CoinGecko source admission
        id: cadence
        shell: bash
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          ADMISSION_AGE_MINUTES: '960'
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import datetime
          import json
          import os

          event = os.environ.get('GITHUB_EVENT_NAME', '')
          threshold = float(os.environ['ADMISSION_AGE_MINUTES'])
          due = True
          reason = 'non-schedule-definition-or-manual-refresh'
          age_minutes = None

          if event == 'schedule':
              try:
                  with open('intelligence/market-data/market-data-coingecko.json', 'r', encoding='utf-8') as f:
                      source = json.load(f)
                  raw = source.get('observedAt') or source.get('generatedAt')
                  if not raw:
                      raise ValueError('source timestamp missing')
                  observed = datetime.datetime.fromisoformat(raw.replace('Z', '+00:00'))
                  now = datetime.datetime.now(datetime.timezone.utc)
                  age_minutes = (now - observed).total_seconds() / 60.0
                  if age_minutes < 0:
                      due = True
                      reason = 'source-timestamp-in-future-refresh-fail-closed'
                  elif age_minutes >= threshold:
                      due = True
                      reason = 'scheduled-source-refresh-due'
                  else:
                      due = False
                      reason = 'scheduled-source-still-fresh'
              except Exception as error:
                  due = True
                  reason = 'source-freshness-unprovable-refresh-fail-closed'
                  print(f'CoinGecko source freshness admission warning: {error}')

          output = os.environ['GITHUB_OUTPUT']
          with open(output, 'a', encoding='utf-8') as f:
              f.write(f"due={'true' if due else 'false'}\n")
              f.write(f"reason={reason}\n")
              f.write(f"age_minutes={'unknown' if age_minutes is None else round(age_minutes, 2)}\n")
          print(json.dumps({
              'event': event,
              'due': due,
              'reason': reason,
              'ageMinutes': None if age_minutes is None else round(age_minutes, 2),
              'admissionAgeMinutes': threshold,
          }, indent=2))
          PY

      - name: Set up Node.js
        if: steps.cadence.outputs.due == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Validate Market Data engines
        if: steps.cadence.outputs.due == 'true'
        run: |
          set -euo pipefail
          node --check intelligence/market-data/market-data-engine.mjs
          node --check intelligence/market-data/market-data-authority-materializer.mjs
          node --check intelligence/reliability/market-data-scheduler-workflow-definition-proof.mjs
          node intelligence/reliability/market-data-scheduler-workflow-definition-proof.mjs

      - name: Refresh CoinGecko baseline exactly once
        if: steps.cadence.outputs.due == 'true'
        env:
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
          MARKET_DATA_DAILY_REFRESH: 'true'
        run: node intelligence/market-data/market-data-engine.mjs

      - name: Validate fresh baseline against production authority ephemerally
        if: steps.cadence.outputs.due == 'true'
        env:
          MARKET_DATA_FORCE_COINGECKO_FAILBACK: 'false'
        run: node intelligence/market-data/market-data-authority-materializer.mjs

      - name: Validate daily baseline safety
        if: steps.cadence.outputs.due == 'true'
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs');
          const source=JSON.parse(fs.readFileSync('intelligence/market-data/market-data-coingecko.json','utf8'));
          const market=JSON.parse(fs.readFileSync('intelligence/market-data/market-data.json','utf8'));
          const registry=JSON.parse(fs.readFileSync('intelligence/market-data/market-price-registry.json','utf8'));
          if(source.version!=='0.5-market-data-strict-daily-coingecko-cadence')throw new Error('Strict daily CoinGecko cadence version missing');
          if(source.semantics?.externalFetchAllowedOnlyWhenDailyRefreshTrue!==true)throw new Error('Daily-only external fetch contract missing');
          if(source.semantics?.nonDailyExternalFetchForbidden!==true)throw new Error('Non-daily CoinGecko prohibition missing');
          if(source.semantics?.dailyScheduledExternalRefreshRequiresExplicitOverride!==true)throw new Error('Daily explicit override contract missing');
          if(Number(source.semantics?.staleFallbackMaxAgeHours)!==30)throw new Error('Daily fallback retention must be 30 hours');
          if(Number(source.coverage?.unknownCount)!==0)throw new Error('Daily CoinGecko baseline contains unknown assets');
          if((registry.assets||[]).length!==26)throw new Error('Canonical daily CoinGecko registry must contain 26 assets');
          for(const asset of registry.assets||[]){
            const sourceRow=source.prices?.[asset.assetId];
            const row=market.prices?.[asset.assetId];
            if(!sourceRow||!Number.isFinite(Number(sourceRow.usd)))throw new Error(`${asset.assetId}: daily CoinGecko sanity price unavailable`);
            if(!row||row.authority?.requestedPrimary!=='onchain')throw new Error(`${asset.assetId}: production authority is not onchain-primary`);
            if(!['onchain','coingecko-lane'].includes(row.authority?.selectedLane))throw new Error(`${asset.assetId}: invalid production lane`);
            if(row.authority.selectedLane==='coingecko-lane'&&row.authority.fallbackUsed!==true)throw new Error(`${asset.assetId}: CoinGecko may only be fallback in production authority`);
          }
          if(market.sourceState?.coinGeckoGeneratedAt!==source.generatedAt)throw new Error('Ephemeral canonical state not bound to fresh daily CoinGecko baseline');
          if(market.authority?.executionAuthority!=='none')throw new Error('Execution authority drift');
          if(market.authority?.capitalExecution!==false||market.authority?.policyMutationAuthority!==false)throw new Error('Authority boundary drift');
          console.log('Strict daily CoinGecko source-lane baseline PASS',{
            generatedAt:source.generatedAt,
            canonicalAssetCount:registry.assets.length,
            onchainSelectedAssetCount:market.authority.onchainSelectedAssetCount,
            coingeckoFailbackAssetCount:market.authority.coingeckoSelectedAssetCount,
            repositoryOutput:'intelligence/market-data/market-data-coingecko.json',
            downstreamCanonicalWriter:'The Holding Market Data · Shared Refresh',
            executionAuthority:'none'
          });
          NODE
          git diff --check

      - name: Publish daily CoinGecko source lane safely
        if: steps.cadence.outputs.due == 'true'
        run: |
          set -euo pipefail
          git config user.name "The Holding Market Data Orchestrator"
          git config user.email "market-data-orchestrator@theholding.ai"

          validated_base="$(git rev-parse HEAD)"
          daily_input_paths=(
            'intelligence/market-data/market-price-registry.json'
            'intelligence/market-data/market-data-engine.mjs'
            'intelligence/market-data/market-data-coingecko.json'
            'intelligence/market-data/market-data-authority-policy.json'
            'intelligence/market-data/market-data-authority-materializer.mjs'
            'intelligence/market-data/market-data-scheduler-contract.json'
            'intelligence/reliability/market-data-scheduler-workflow-definition-proof.mjs'
            '.github/workflows/market-data-coingecko-daily.yml'
          )

          # Canonical Market Data is validated here only ephemerally. Publishing it
          # belongs exclusively to Shared Refresh; Public Capital belongs to Unified Capital.
          git checkout -- intelligence/market-data/market-data.json
          git add intelligence/market-data/market-data-coingecko.json
          if git diff --cached --quiet; then echo 'Daily CoinGecko source lane already current.'; exit 0; fi
          git commit -m "market data: refresh daily CoinGecko source lane"

          for attempt in 1 2 3; do
            git fetch origin main
            latest_main="$(git rev-parse origin/main)"
            changed_inputs=()
            mapfile -t changed_inputs < <(git diff --name-only "$validated_base" "$latest_main" -- "${daily_input_paths[@]}")

            if [ "${#changed_inputs[@]}" -gt 0 ]; then
              echo 'Validated daily CoinGecko candidate superseded by newer source-lane inputs.'
              printf 'Changed input: %s\n' "${changed_inputs[@]}"
              exit 0
            fi

            if [ "$latest_main" != "$validated_base" ]; then
              echo 'Unrelated main churn detected; preserving validated daily CoinGecko source snapshot through rebase.'
            fi
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo 'Daily CoinGecko source-lane writer conflict; refusing to guess.'
              exit 1
            fi

            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1
