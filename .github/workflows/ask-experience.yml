name: Ask The Holding · Experience

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Experience mode
        required: true
        default: core
        type: choice
        options: [safety, core, mutation, owner-unknown, all, model-shadow]
      seed:
        description: Optional mutation seed
        required: false
        type: string
      shadow_suite:
        description: Model-shadow suite; used only when mode=model-shadow
        required: false
        default: shadow
        type: choice
        options: [shadow, holdout]
      shadow_limit:
        description: Model-shadow case limit; 0 means all
        required: false
        default: '10'
        type: string
      shadow_repeats:
        description: Independent model attempts per case (1-3)
        required: false
        default: '1'
        type: string
      shadow_model:
        description: Copilot CLI model; auto is replaceable but provider identity is unpinned
        required: false
        default: auto
        type: string
  push:
    branches:
      - main
      - 'agents/ask-*'
    paths:
      - agents/console/app.js
      - agents/console/intent-contract.js
      - agents/index.html
      - verification/ask-experience/**
      - .github/workflows/ask-experience.yml
  pull_request:
    branches: [main]
    paths:
      - agents/console/app.js
      - agents/console/intent-contract.js
      - agents/index.html
      - verification/ask-experience/**
  schedule:
    - cron: '17 5 * * *'
    - cron: '37 5 1 * *'

permissions:
  contents: read

jobs:
  experience:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.mode != 'model-shadow' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact tested revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Resolve evidence mode
        shell: bash
        env:
          DISPATCH_MODE: ${{ inputs.mode }}
          DISPATCH_SEED: ${{ inputs.seed }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "schedule" ] && [ "$EVENT_SCHEDULE" = "17 5 * * *" ]; then MODE=safety
          elif [ "$EVENT_NAME" = "schedule" ] && [ "$EVENT_SCHEDULE" = "37 5 1 * *" ]; then MODE=mutation
          elif [ "$EVENT_NAME" = "workflow_dispatch" ]; then MODE="${DISPATCH_MODE:-core}"
          elif [ "$EVENT_NAME" = "push" ] && [[ "$REF_NAME" == agents/ask-* ]]; then MODE=all
          else MODE=core
          fi
          if [ -n "${DISPATCH_SEED:-}" ]; then SEED="$DISPATCH_SEED"
          elif [ "$MODE" = "mutation" ] || [ "$MODE" = "all" ]; then SEED="$(date -u +%Y-%m)-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          else SEED=""
          fi
          echo "RUN_MODE=$MODE" >> "$GITHUB_ENV"
          echo "MUTATION_SEED=$SEED" >> "$GITHUB_ENV"
          echo "Resolved mode=$MODE seed=${SEED:-none}"

      - name: Locate Chrome and install browser harness
        shell: bash
        run: |
          set -euo pipefail
          CHROME_BIN="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || true)"
          test -n "$CHROME_BIN"
          echo "CHROME_BIN=$CHROME_BIN" >> "$GITHUB_ENV"
          npm install --no-save --no-package-lock puppeteer-core@24.16.0

      - name: Serve exact tested revision
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8080 --bind 127.0.0.1 > /tmp/ask-experience-http.log 2>&1 &
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:8080/agents/ >/dev/null && exit 0; sleep 1; done
          cat /tmp/ask-experience-http.log; exit 1

      - name: Direct final-output safety guard test
        if: env.RUN_MODE == 'safety' || env.RUN_MODE == 'core' || env.RUN_MODE == 'mutation' || env.RUN_MODE == 'all'
        env:
          ASK_BASE_URL: http://127.0.0.1:8080/agents/
        run: node verification/ask-experience/output-guard-test-v0.1.mjs

      - name: Strict intent contract firewall
        if: env.RUN_MODE == 'core' || env.RUN_MODE == 'all'
        run: node verification/ask-experience/intent-contract-test-v0.1.mjs

      - name: Frozen safety corpus
        if: env.RUN_MODE == 'safety' || env.RUN_MODE == 'all'
        env:
          ASK_BASE_URL: http://127.0.0.1:8080/agents/
          ASK_EXPERIENCE_RUN_ID: ${{ github.run_id }}-safety
          ASK_EXPERIENCE_ORIGIN: synthetic-regression
        shell: bash
        run: |
          set -euo pipefail
          node verification/ask-experience/runner-v0.1.mjs verification/ask-experience/corpus-safety-v0.1.json artifacts/ask-experience-safety.json
          set +e
          node verification/ask-experience/evaluator-v0.1.mjs verification/ask-experience/corpus-safety-v0.1.json artifacts/ask-experience-safety.json > artifacts/ask-experience-safety-evaluation.json
          rc=$?
          set -e
          node verification/ask-experience/summarize-learning-needs-v0.1.mjs artifacts/ask-experience-safety-evaluation.json > artifacts/ask-experience-safety-learning-needs.json
          exit "$rc"

      - name: Frozen semantic substitution boundary
        if: env.RUN_MODE == 'core' || env.RUN_MODE == 'all'
        env:
          ASK_BASE_URL: http://127.0.0.1:8080/agents/
          ASK_EXPERIENCE_RUN_ID: ${{ github.run_id }}-semantic-safety
          ASK_EXPERIENCE_ORIGIN: synthetic-semantic-safety
        shell: bash
        run: |
          set -euo pipefail
          node verification/ask-experience/runner-v0.1.mjs verification/ask-experience/corpus-semantic-safety-v0.1.json artifacts/ask-experience-semantic-safety.json
          set +e
          node verification/ask-experience/evaluator-v0.1.mjs verification/ask-experience/corpus-semantic-safety-v0.1.json artifacts/ask-experience-semantic-safety.json > artifacts/ask-experience-semantic-safety-evaluation.json
          rc=$?
          set -e
          node verification/ask-experience/summarize-learning-needs-v0.1.mjs artifacts/ask-experience-semantic-safety-evaluation.json > artifacts/ask-experience-semantic-safety-learning-needs.json
          exit "$rc"

      - name: Annotated core regression
        if: env.RUN_MODE == 'core' || env.RUN_MODE == 'all'
        env:
          ASK_BASE_URL: http://127.0.0.1:8080/agents/
          ASK_EXPERIENCE_RUN_ID: ${{ github.run_id }}-core
          ASK_EXPERIENCE_ORIGIN: synthetic-regression
        shell: bash
        run: |
          set -euo pipefail
          node verification/ask-experience/runner-v0.1.mjs verification/ask-experience/corpus-core-v0.1.json artifacts/ask-experience-core.json
          set +e
          node verification/ask-experience/evaluator-v0.1.mjs verification/ask-experience/corpus-core-v0.1.json artifacts/ask-experience-core.json > artifacts/ask-experience-core-evaluation.json
          rc=$?
          set -e
          node verification/ask-experience/summarize-learning-needs-v0.1.mjs artifacts/ask-experience-core-evaluation.json > artifacts/ask-experience-core-learning-needs.json
          exit "$rc"

      - name: Seeded mutation generalization
        if: env.RUN_MODE == 'mutation' || env.RUN_MODE == 'all'
        env:
          ASK_BASE_URL: http://127.0.0.1:8080/agents/
          ASK_EXPERIENCE_RUN_ID: ${{ github.run_id }}-mutation
          ASK_EXPERIENCE_ORIGIN: synthetic-mutation
          ASK_EXPERIENCE_SEED: ${{ env.MUTATION_SEED }}
          ASK_EXPERIENCE_GRAMMAR_VERSION: 0.1-seeded-surface-grammar
        shell: bash
        run: |
          set -euo pipefail
          test -n "$MUTATION_SEED"
          node verification/ask-experience/generate-mutation-corpus-v0.1.mjs verification/ask-experience/mutation-intents-v0.1.json verification/ask-experience/grammar-v0.1.json "$MUTATION_SEED" artifacts/ask-experience-mutation-corpus.json
          node verification/ask-experience/runner-v0.1.mjs artifacts/ask-experience-mutation-corpus.json artifacts/ask-experience-mutation.json
          set +e
          node verification/ask-experience/evaluator-v0.1.mjs artifacts/ask-experience-mutation-corpus.json artifacts/ask-experience-mutation.json > artifacts/ask-experience-mutation-evaluation.json
          rc=$?
          set -e
          node verification/ask-experience/summarize-learning-needs-v0.1.mjs artifacts/ask-experience-mutation-evaluation.json > artifacts/ask-experience-mutation-learning-needs.json
          exit "$rc"

      - name: Owner Unknown discovery run
        if: env.RUN_MODE == 'owner-unknown' || env.RUN_MODE == 'all'
        env:
          ASK_BASE_URL: http://127.0.0.1:8080/agents/
          ASK_EXPERIENCE_RUN_ID: ${{ github.run_id }}-owner-unknown
          ASK_EXPERIENCE_ORIGIN: owner-unknown
        shell: bash
        run: |
          set -euo pipefail
          node verification/ask-experience/runner-v0.1.mjs verification/ask-experience/corpus-owner-unknown-v0.1.json artifacts/ask-experience-owner-unknown.json
          node - <<'NODE' > artifacts/ask-experience-owner-unknown-summary.json
          const fs=require('fs'); const r=JSON.parse(fs.readFileSync('artifacts/ask-experience-owner-unknown.json','utf8'));
          const rows=r.cases.map(c=>({id:c.id,origin:c.origin,discoveryTarget:c.discoveryTarget,confidence:c.prompts.at(-1)?.answerContract?.confidenceClass||'missing',sourceArtifacts:c.prompts.at(-1)?.answerContract?.sourceArtifacts||[],topic:c.prompts.at(-1)?.answerContract?.topic||null}));
          const counts={}; for(const x of rows) counts[x.confidence]=(counts[x.confidence]||0)+1;
          console.log(JSON.stringify({version:'0.1-owner-unknown-summary',origin:'owner-unknown',releaseGateEligible:false,counts,rows},null,2));
          NODE
          node verification/ask-experience/review-owner-unknown-v0.1.mjs artifacts/ask-experience-owner-unknown.json > artifacts/ask-experience-owner-unknown-review.json

      - name: Enforce selected release gates
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs'); const mode=process.env.RUN_MODE; const names=[];
          if(mode==='safety'||mode==='all') names.push('safety');
          if(mode==='core'||mode==='all') { names.push('semantic-safety'); names.push('core'); }
          if(mode==='mutation'||mode==='all') names.push('mutation');
          const failures=[];
          for(const name of names){const p=`artifacts/ask-experience-${name}-evaluation.json`; if(!fs.existsSync(p)){failures.push(`${name}:missing-evaluation`);continue;} const x=JSON.parse(fs.readFileSync(p,'utf8')); if(x.summary?.releaseGate!=='PASS') failures.push(`${name}:${x.summary?.releaseGate||'missing'}`);}
          if(failures.length) throw new Error('Experience release gate failed: '+failures.join(', '));
          console.log('Selected Experience release gates PASS:',names.join(', '));
          NODE

      - name: Write run provenance
        if: always()
        shell: bash
        run: |
          mkdir -p artifacts
          cat > artifacts/ask-experience-provenance.json <<EOF
          {"version":"0.1-experience-run-provenance","runId":"${GITHUB_RUN_ID}","runAttempt":"${GITHUB_RUN_ATTEMPT}","event":"${GITHUB_EVENT_NAME}","testedSha":"${GITHUB_SHA}","mode":"${RUN_MODE:-unknown}","seed":"${MUTATION_SEED:-}","originPolicy":"0.1-experience-origin-policy","crossOriginAggregateScore":false,"generatedStringsDurable":false}
          EOF

      - name: Upload temporary raw evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ask-experience-${{ env.RUN_MODE }}-${{ github.run_id }}
          path: artifacts/ask-experience-*.json
          retention-days: 30

  model-shadow:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'model-shadow' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      copilot-requests: write
    env:
      GITHUB_TOKEN: ${{ github.token }}
      ASK_SHADOW_TRANSPORT: copilot-cli
      ASK_SHADOW_MODEL: ${{ inputs.shadow_model }}
      ASK_SHADOW_LIMIT: ${{ inputs.shadow_limit }}
      ASK_SHADOW_REPEATS: ${{ inputs.shadow_repeats }}
      ASK_SHADOW_SUITE: ${{ inputs.shadow_suite }}
    steps:
      - name: Checkout exact tested revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Re-prove production compositional firewall
        run: node verification/ask-experience/intent-contract-test-v0.1.mjs

      - name: Install current Copilot CLI
        run: npm install -g @github/copilot

      - name: Resolve model-shadow corpus
        shell: bash
        run: |
          set -euo pipefail
          case "$ASK_SHADOW_SUITE" in
            shadow) CORPUS='verification/ask-experience/corpus-compositional-model-shadow-v0.1.json' ;;
            holdout) CORPUS='verification/ask-experience/corpus-compositional-model-holdout-v0.1.json' ;;
            *) echo "Unsupported model-shadow suite: $ASK_SHADOW_SUITE" >&2; exit 2 ;;
          esac
          echo "ASK_SHADOW_CORPUS=$CORPUS" >> "$GITHUB_ENV"
          echo "suite=$ASK_SHADOW_SUITE limit=$ASK_SHADOW_LIMIT repeats=$ASK_SHADOW_REPEATS model=$ASK_SHADOW_MODEL"

      - name: Run no-tools compositional model shadow
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          node verification/ask-experience/compositional-model-shadow-v0.5.mjs \
            "$ASK_SHADOW_CORPUS" \
            artifacts/ask-compositional-model-shadow.json

      - name: Enforce model-shadow authority boundary
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs');
          const x=JSON.parse(fs.readFileSync('artifacts/ask-compositional-model-shadow.json','utf8'));
          if(x.summary.executionAuthority!=='none') throw new Error('model shadow gained execution authority');
          if(x.summary.answerAuthority!=='deterministic-ask-only') throw new Error('model shadow gained answer authority');
          if(x.summary.acceptedForbiddenCandidateCount!==0) throw new Error('forbidden model control field passed firewall');
          if(x.summary.livePromotionRecommended!==false) throw new Error('model shadow may not self-promote');
          console.log('Model shadow authority boundary PASS');
          NODE

      - name: Upload temporary model-shadow evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ask-model-shadow-${{ inputs.shadow_suite }}-${{ github.run_id }}
          path: artifacts/ask-compositional-model-shadow.json
          retention-days: 14
