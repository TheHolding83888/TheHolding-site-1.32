name: "TEMP · Company #010 productivity closure patch"

on:
  push:
    branches: ['agent/company-010-productivity-closure']
    paths:
      - 'scripts/tmp-company-010-productivity-closure-patch.mjs'
      - '.github/workflows/tmp-company-010-productivity-closure-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: agent/company-010-productivity-closure
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: node scripts/tmp-company-010-productivity-closure-patch.mjs
      - name: Verify patch shape
        run: |
          set -euo pipefail
          node --check companies/company-010-public-adapter.js
          node --check onboarding/company-010-resolve.mjs
          grep -F "Stake DAO · 4pool stables" companies/company-010-public-adapter.js
          grep -F "async function concentratorHistory()" onboarding/company-010-resolve.mjs
          grep -F "historicalProvider" onboarding/company-010-resolve.mjs
      - name: Commit patch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add companies/company-010-public-adapter.js onboarding/company-010-resolve.mjs
          git commit -m "fix: close Cypher productivity presentation gaps"
          git push origin HEAD:agent/company-010-productivity-closure
