name: Agent Patch Homepage Monetra Live Capital PR

on:
  pull_request:
    branches: [main]
    paths:
      - 'index.html'
      - '.github/workflows/_agent_patch_homepage_monetra_live.yml'
      - '.github/workflows/_agent_patch_homepage_monetra_live_pr.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'agent/homepage-monetra-live-capital-v0.1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: agent/homepage-monetra-live-capital-v0.1
          fetch-depth: 0
      - name: Patch homepage
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html'); s=p.read_text()
          for a,b in [
            ('<div class="fund-metric-value" data-tvl="monetra">$800</div>','<div class="fund-metric-value" data-tvl="monetra">Live</div>'),
            ('<span class="pyramid-tvl" data-tvl-viz="monetra">$800</span>','<span class="pyramid-tvl" data-tvl-viz="monetra">Live</span>'),
            ('<span class="mfc-tvl" data-tvl-viz="monetra">$800</span>','<span class="mfc-tvl" data-tvl-viz="monetra">Live</span>')]:
              assert s.count(a)==1,(a,s.count(a)); s=s.replace(a,b,1)
          old='        const MONETRA_TVL_CONTRIBUTION = 100;  // Added to total TVL; card displays static $800\n'
          new='''        // One canonical Monetra capital source: the same Stable Companies snapshot used by the Passport.\n        const MONETRA_STABLE_INDEX_URL = './companies/stable-index-data.json';\n\n        async function loadMonetraCurrentCapital() {\n            const controller = new AbortController();\n            const timer = setTimeout(() => controller.abort(), 4000);\n            try {\n                const res = await fetch(MONETRA_STABLE_INDEX_URL + '?t=' + Date.now(), { cache: 'no-store', signal: controller.signal });\n                if (!res.ok) throw new Error('Monetra stable-index HTTP ' + res.status);\n                const data = await res.json();\n                if (data?.universe?.id !== 'stable-companies' || data?.universe?.separateFromGeneralComposite !== true) throw new Error('Monetra stable-index contract mismatch');\n                const companies = Array.isArray(data.companies) ? data.companies : [];\n                const company = companies.find(x => x?.registry === '008' && x?.name === 'Monetra.eth') || companies.find(x => x?.registry === '008');\n                const value = Number(company?.currentCapitalUsd ?? company?.performance?.currentCapitalUsd);\n                if (!Number.isFinite(value) || value < 0) throw new Error('Monetra currentCapitalUsd unavailable');\n                return value;\n            } catch (error) {\n                console.warn('Monetra canonical capital unavailable', error);\n                return null;\n            } finally { clearTimeout(timer); }\n        }\n\n        function renderMonetraCapital(value) {\n            const label = Number.isFinite(value) ? `$${Math.round(value).toLocaleString()}` : 'Live';\n            document.querySelectorAll('[data-tvl="monetra"], [data-tvl-viz="monetra"]').forEach(el => { el.textContent = label; });\n        }\n'''
          assert s.count(old)==1; s=s.replace(old,new,1)
          old="                const prices = await cgPrices(ids.split(','));\n                if (!prices || Object.keys(prices).length === 0) {\n                    console.log('CoinGecko prices unavailable');\n                    return;\n                }\n"
          new="                const [prices, monetraCapitalUsd] = await Promise.all([cgPrices(ids.split(',')), loadMonetraCurrentCapital()]);\n                renderMonetraCapital(monetraCapitalUsd);\n                if (!prices || Object.keys(prices).length === 0) {\n                    console.log('Market prices unavailable');\n                    return;\n                }\n"
          assert s.count(old)==1; s=s.replace(old,new,1)
          old='                // Total TVL\n                const totalTVL = substantiaTVL + defiteaTVL + singulTVL + fructusTVL + MONETRA_TVL_CONTRIBUTION;\n'
          new="                // Unknown Monetra capital is never coerced to zero.\n                const totalTVL = Number.isFinite(monetraCapitalUsd)\n                    ? substantiaTVL + defiteaTVL + singulTVL + fructusTVL + monetraCapitalUsd\n                    : null;\n"
          assert s.count(old)==1; s=s.replace(old,new,1)
          old="                document.querySelector('[data-metric=\"total-capital\"]').textContent = \n                    `$${Math.round(totalTVL).toLocaleString()}`;\n                \n                console.log('TVL updated:', {\n                    substantia: Math.round(substantiaTVL),\n                    defitea: Math.round(defiteaTVL),\n                    singul: Math.round(singulTVL),\n                    fructus: Math.round(fructusTVL),\n                    monetra: MONETRA_TVL_CONTRIBUTION,\n                    total: Math.round(totalTVL)\n                });\n"
          new="                document.querySelector('[data-metric=\"total-capital\"]').textContent = \n                    Number.isFinite(totalTVL) ? `$${Math.round(totalTVL).toLocaleString()}` : 'Live';\n                \n                console.log('TVL updated:', {\n                    substantia: Math.round(substantiaTVL),\n                    defitea: Math.round(defiteaTVL),\n                    singul: Math.round(singulTVL),\n                    fructus: Math.round(fructusTVL),\n                    monetra: Number.isFinite(monetraCapitalUsd) ? Math.round(monetraCapitalUsd) : null,\n                    total: Number.isFinite(totalTVL) ? Math.round(totalTVL) : null\n                });\n"
          assert s.count(old)==1; s=s.replace(old,new,1)
          assert 'MONETRA_TVL_CONTRIBUTION' not in s and 'data-tvl-viz="monetra">$800' not in s
          p.write_text(s)
          PY
          python3 - <<'PY'
          import json,re
          from pathlib import Path
          d=json.loads(Path('companies/stable-index-data.json').read_text()); c=next(x for x in d['companies'] if x.get('registry')=='008')
          assert d['universe']['id']=='stable-companies' and d['universe']['separateFromGeneralComposite'] is True
          assert c['name']=='Monetra.eth' and isinstance(c['currentCapitalUsd'],(int,float)) and c['currentCapitalUsd']>=0
          html=Path('index.html').read_text(); out=Path('/tmp/js'); out.mkdir(exist_ok=True)
          n=0
          for attrs,body in re.findall(r'<script(?![^>]*\\bsrc=)([^>]*)>(.*?)</script>',html,re.S|re.I):
            if 'application/ld+json' in attrs.lower(): continue
            n+=1;(out/f'{n}.js').write_text(body)
          print('canonical currentCapitalUsd',c['currentCapitalUsd'],'scripts',n)
          PY
          for f in /tmp/js/*.js; do node --check "$f"; done
      - name: Commit production-only diff
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/_agent_patch_homepage_monetra_live.yml .github/workflows/_agent_patch_homepage_monetra_live_pr.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .github/workflows/_agent_patch_homepage_monetra_live.yml .github/workflows/_agent_patch_homepage_monetra_live_pr.yml
          git diff --cached --check
          git commit -m 'fix: bind homepage Monetra capital to canonical stable state'
          git push origin HEAD:agent/homepage-monetra-live-capital-v0.1
