# THE HOLDING COMPANY #008 WORKFLOW v1.3.2
name: "Discover Company #009"

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: discover-company-009
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Verify discovery source/workflow sync
        run: |
          grep -F "const VERSION = '1.3.2-company-009-owner-reconciliation-official-aave';" onboarding/company-009-discovery.mjs
          echo "Workflow/source sync OK: Company #009 discovery v1.3.2"

      - name: Install discovery dependencies
        run: |
          npm install --no-save ethers@6 @lombard.finance/sdk @aave-dao/aave-address-book viem axios bignumber.js @bitcoinerlab/secp256k1 bitcoinjs-lib

      - name: "Discover Company #009 current state"
        env:
          ETH_RPC_URL: ${{ secrets.ETH_RPC_URL }}
          ETH_RPC_URL_2: ${{ secrets.ETH_RPC_URL_2 }}
          BASE_RPC_URL: ${{ secrets.BASE_RPC_URL }}
          BASE_RPC_URL_2: ${{ secrets.BASE_RPC_URL_2 }}
          ARBITRUM_RPC_URL: ${{ secrets.ARBITRUM_RPC_URL }}
          OPTIMISM_RPC_URL: ${{ secrets.OPTIMISM_RPC_URL }}
          AVALANCHE_RPC_URL: ${{ secrets.AVALANCHE_RPC_URL }}
          POLYGON_RPC_URL: ${{ secrets.POLYGON_RPC_URL }}
          ZKSYNC_RPC_URL: ${{ secrets.ZKSYNC_RPC_URL }}
          LINEA_RPC_URL: ${{ secrets.LINEA_RPC_URL }}
          SCROLL_RPC_URL: ${{ secrets.SCROLL_RPC_URL }}
          BLAST_RPC_URL: ${{ secrets.BLAST_RPC_URL }}
          MODE_RPC_URL: ${{ secrets.MODE_RPC_URL }}
          ZORA_RPC_URL: ${{ secrets.ZORA_RPC_URL }}
          COMPANY_009_DISCOVERY_OUTPUT: companies/company-009-discovery.json
        run: node onboarding/company-009-discovery.mjs

      - name: Validate generated JSON
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const p = 'companies/company-009-discovery.json';
          if (!fs.existsSync(p)) throw new Error('discovery JSON was not created');
          const d = JSON.parse(fs.readFileSync(p, 'utf8'));

          if (d.version !== '1.3.2-company-009-owner-reconciliation-official-aave') throw new Error('unexpected discovery version: ' + d.version);
          console.log('Validated discovery version:', d.version);
          if (d.company?.registry !== '009') throw new Error('registry mismatch');
          if (d.company?.name !== '1milliondollar.eth') throw new Error('name mismatch');
          if (d.company?.foundedAt !== '2024-12-12') throw new Error('founding mismatch');
          if (d.company?.architecture !== 'The Holding Standard') throw new Error('architecture mismatch');
          if ((d.company?.wallet || '').toLowerCase() !== '0xe4b9c9ced406baffe406e63f83d39daaef150596') throw new Error('wallet mismatch');

          if (!Array.isArray(d.proposedCompanyBook) || d.proposedCompanyBook.length !== 5) {
            throw new Error('expected 5 proposed Company Book rows');
          }
          const syms = d.proposedCompanyBook.map(x => x.symbol);
          for (const wanted of ['BTC','ETH','AERO / veAERO','CRV / cvxCRV','YB / veYB']) {
            if (!syms.includes(wanted)) throw new Error('missing Company Book row: ' + wanted);
          }

          if (!Array.isArray(d.ignoredLiabilities)) throw new Error('ignoredLiabilities missing');
          if (d.accountingPolicy?.performance !== 'pending until owner supplies average entry prices for BTC, ETH, AERO, CRV and YB') {
            throw new Error('entry-price safety policy missing');
          }

          // Red state is reserved for structurally invalid output. A source may
          // legitimately remain partial/warming; the JSON must preserve that fact
          // rather than converting it into a fake zero.
          console.log('Company #009 discovery JSON structural validation passed');
          console.log('BTC:', d.proposedCompanyBook.find(x => x.symbol === 'BTC')?.quantity,
                      'complete=', d.productionReadiness?.btcQuantityComplete);
          console.log('ETH:', d.proposedCompanyBook.find(x => x.symbol === 'ETH')?.quantity,
                      'complete=', d.productionReadiness?.ethQuantityComplete);
          console.log('Beefy:', d.discovery?.beefyCvxCrv?.status);
          console.log('Owner-observed BTC reconciliation:', d.discovery?.ownerObservedReconciliation?.btcMatched);
          console.log('Owner-observed ETH reconciliation:', d.discovery?.ownerObservedReconciliation?.ethMatched);
          for (const x of d.discovery?.ownerObservedReconciliation?.unresolved || []) {
            console.log('UNRESOLVED OWNER COMPONENT:', x.family, x.chain, x.symbol,
              'observed≈', x.observedApprox, 'discovered=', x.discovered);
          }
          NODE

      - name: Publish discovery JSON to main
        shell: bash
        run: |
          set -euo pipefail

          FILE="companies/company-009-discovery.json"

          test -s "$FILE" || {
            echo "ERROR: $FILE is missing or empty after discovery."
            exit 1
          }

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f "$FILE"

          if ! git diff --cached --quiet -- "$FILE"; then
            git commit -m "Update Company #009 discovery"
          else
            echo "Generated discovery matches currently tracked content."
          fi

          for attempt in 1 2 3; do
            git fetch origin main
            if git rebase origin/main; then
              if git push origin HEAD:main; then
                break
              fi
            fi

            git rebase --abort || true

            if [ "$attempt" -eq 3 ]; then
              echo "ERROR: failed to publish Company #009 discovery JSON after retries."
              exit 1
            fi

            sleep $((attempt * 2))
          done

          git fetch origin main
          git cat-file -e "origin/main:$FILE" || {
            echo "ERROR: workflow would otherwise be green, but $FILE is absent from origin/main."
            exit 1
          }

          echo "Verified on origin/main: $FILE"
