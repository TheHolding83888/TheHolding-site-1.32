name: "Verify Passports · strategy rate badge layout"

on:
  pull_request:
    branches: [main]
    paths:
      - 'companies/company-010-public-adapter.js'
      - 'intelligence/project-memory/THE_HOLDING_PASSPORT_RESPONSIVE_UI_CANON_2026-08-18.md'
      - 'intelligence/project-memory/README.md'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Verify desktop right-center and mobile two-row rate badge contract
        run: |
          set -euo pipefail
          node --check companies/company-010-public-adapter.js
          node - <<'NODE'
          const fs=require('fs');
          const a=fs.readFileSync('companies/company-010-public-adapter.js','utf8');
          const canon=fs.readFileSync('intelligence/project-memory/THE_HOLDING_PASSPORT_RESPONSIVE_UI_CANON_2026-08-18.md','utf8');
          const desktopMust=[
            'v0.9.1-right-centered-strategy-rate-badges',
            '.ipx-position-pill.has-strategy-rate{position:relative;padding-right:5.45rem}',
            'right:.58rem;top:50%;transform:translateY(-50%)',
            'min-height:23px',
            'border-radius:999px'
          ];
          for(const x of desktopMust) if(!a.includes(x)) throw new Error('desktop rate badge contract drift: '+x);
          const mobileMust=[
            'v0.9.2-mobile-two-row-strategy-rate-badges',
            'grid-template-columns:minmax(0,1fr) auto',
            'grid-template-rows:auto auto',
            'min-height:52px',
            '.ipx-position-pill.has-strategy-rate .ipx-position-symbol{grid-column:1 / -1;grid-row:1',
            'white-space:normal;overflow-wrap:anywhere',
            '.ipx-position-pill.has-strategy-rate .ipx-position-qty{grid-column:1;grid-row:2',
            '.ipx-position-pill.has-strategy-rate .ipx-strategy-rate-badge{position:static;grid-column:2;grid-row:2',
            'right:auto;top:auto;transform:none',
            "pill.classList.add('has-strategy-rate')",
            "pill.classList.remove('has-strategy-rate')",
            "rate.pending?' pending':''"
          ];
          for(const x of mobileMust) if(!a.includes(x)) throw new Error('mobile two-row rate badge contract drift: '+x);
          if(a.includes('@media(max-width:760px){.ipx-position-pill.has-strategy-rate{padding-right:4.9rem}')) throw new Error('legacy mobile absolute-only collision layout remains');
          for(const x of ['title on row one','value bottom-left','APR/APY capsule bottom-right','Desktop / laptop','Reserve / non-productive']) if(!canon.includes(x)) throw new Error('responsive Passport memory canon missing: '+x);
          console.log('Passport strategy rate badge desktop + mobile contract PASS');
          NODE
      - name: Verify no execution authority
        run: |
          set -euo pipefail
          ! grep -Eqi 'wallet\.send|sendTransaction|eth_sendTransaction|eth_sendRawTransaction|private[_ -]?key|mnemonic|signer\.send' companies/company-010-public-adapter.js
