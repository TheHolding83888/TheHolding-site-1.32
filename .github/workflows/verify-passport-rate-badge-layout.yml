name: "Verify Passports · strategy rate badge layout"

on:
  pull_request:
    branches: [main]
    paths:
      - 'companies/company-010-public-adapter.js'
      - 'companies/company-passport-priority-adapter.js'
      - 'intelligence/project-memory/THE_HOLDING_PASSPORT_RESPONSIVE_UI_CANON_2026-08-18.md'
      - 'intelligence/project-memory/README.md'
      - '.github/workflows/verify-passport-rate-badge-layout.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'

      - name: Verify adapter syntax
        run: |
          set -euo pipefail
          node --check companies/company-010-public-adapter.js
          node --check companies/company-passport-priority-adapter.js

      - name: Verify legacy shared rate badge contract
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs');
          const badge=fs.readFileSync('companies/company-010-public-adapter.js','utf8');
          const must=[
            'v0.9.1-right-centered-strategy-rate-badges',
            '.ipx-position-pill.has-strategy-rate{position:relative;padding-right:5.45rem}',
            'right:.58rem;top:50%;transform:translateY(-50%)',
            'min-height:23px','border-radius:999px',
            'v0.9.2-mobile-two-row-strategy-rate-badges',
            'grid-template-columns:minmax(0,1fr) auto','grid-template-rows:auto auto','min-height:52px',
            '.ipx-position-pill.has-strategy-rate .ipx-position-symbol{grid-column:1 / -1;grid-row:1',
            'white-space:normal;overflow-wrap:anywhere',
            '.ipx-position-pill.has-strategy-rate .ipx-position-qty{grid-column:1;grid-row:2',
            '.ipx-position-pill.has-strategy-rate .ipx-strategy-rate-badge{position:static;grid-column:2;grid-row:2',
            'right:auto;top:auto;transform:none',
            "pill.classList.add('has-strategy-rate')","pill.classList.remove('has-strategy-rate')","rate.pending?' pending':''"
          ];
          for(const x of must) if(!badge.includes(x)) throw new Error('shared rate badge contract drift: '+x);
          if(badge.includes('@media(max-width:760px){.ipx-position-pill.has-strategy-rate{padding-right:4.9rem}')) throw new Error('legacy mobile absolute-only collision layout remains');
          NODE

      - name: Verify universal surface semantic identity
        run: |
          set -euo pipefail
          f='companies/company-passport-priority-adapter.js'
          grep -Fq "0.9.1-universal-responsive-strategy-surface" "$f"
          grep -Fq "function patchPositionMetadata()" "$f"
          grep -Fq "th-position-qty-note" "$f"
          grep -Fq "th-strategy-channel-rail" "$f"
          grep -Fq "principal-once-effective-rate-plus-supplementary-channel-rail" "$f"
          grep -Fq "semantic-note-separated-from-quantity" "$f"
          grep -Fq "universal-responsive-two-or-three-row-card" "$f"

      - name: Verify supplementary channel desktop and laptop geometry
        run: |
          set -euo pipefail
          f='companies/company-passport-priority-adapter.js'
          grep -Fq "@media(min-width:761px)" "$f"
          grep -Fq "th-vm-income-channel-pill.has-strategy-rate{display:grid" "$f"
          grep -Fq "min-height:66px!important" "$f"
          grep -Fq "grid-column:1 / -1;grid-row:3" "$f"
          grep -Fq "position:static;grid-column:2;grid-row:2" "$f"
          ! grep -Eq '\.ipx-defitea-balance[[:space:]]+\.th-vm-' "$f"

      - name: Verify universal surface mobile geometry
        run: |
          set -euo pipefail
          f='companies/company-passport-priority-adapter.js'
          grep -Fq "grid-template-columns:repeat(2,minmax(0,1fr))!important" "$f"
          grep -Fq "grid-template-rows:auto auto auto" "$f"
          grep -Fq "grid-column:1 / -1;grid-row:3" "$f"
          grep -Fq "th-position-has-note.has-strategy-rate" "$f"

      - name: Verify supplementary channel authority boundaries
        run: |
          set -euo pipefail
          f='companies/company-passport-priority-adapter.js'
          grep -Fq "thVmCapitalDoubleCount = 'false'" "$f"
          grep -Fq "browserCalculatesVoteMarketApr: false" "$f"
          ! grep -Eq '\.ipx-defitea-balance[[:space:]]+\.th-vm-' "$f"
          ! grep -Eq 'total:[[:space:]]*`(Total|Итого)' "$f"

      - name: Verify responsive Passport canon
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs');
          const canon=fs.readFileSync('intelligence/project-memory/THE_HOLDING_PASSPORT_RESPONSIVE_UI_CANON_2026-08-18.md','utf8');
          const must=[
            'title on row one','value bottom-left','APR/APY capsule bottom-right','Desktop / laptop','Reserve / non-productive',
            'Supplementary income channels + position metadata','one capital / TVL contribution','effective total Reference rate',
            'supplementary channel rail','two-column position book','desktop/laptop three-row containment',
            'position != supplementary income channel != period income event != presentation metadata'
          ];
          for(const x of must) if(!canon.includes(x)) throw new Error('responsive Passport canon missing: '+x);
          NODE

      - name: Verify no execution authority
        run: |
          set -euo pipefail
          ! grep -Eqi 'wallet\.send|sendTransaction|eth_sendTransaction|eth_sendRawTransaction|private[_ -]?key|mnemonic|signer\.send' companies/company-010-public-adapter.js companies/company-passport-priority-adapter.js
