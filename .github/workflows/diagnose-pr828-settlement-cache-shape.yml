name: Diagnose PR828 Settlement Cache Shape
on:
  push:
    branches:
      - diagnostic/pr828-ve33-runtime-telemetry-20260915
    paths:
      - '.github/workflows/diagnose-pr828-settlement-cache-shape.yml'
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Calculate settlement interval/cache shape
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const e=JSON.parse(fs.readFileSync('reporting/ve33-accounting-evidence.json','utf8'));
          const MAX=9500,GROUP=96;
          const lower=x=>String(x||'').toLowerCase();
          const protocols=['aerodrome','velodrome'];
          const out={};
          for(const protocol of protocols){
            const rows=(e.checkpoints||[]).filter(x=>x.protocolKey===protocol);
            const addresses=[...new Set(rows.map(x=>x.kind==='rebase-distributor'?x.distributor:x.rewardContract).filter(Boolean).map(lower))].sort();
            const groupBy=new Map();
            for(let i=0;i<addresses.length;i+=GROUP){
              const g=Math.floor(i/GROUP);
              for(const a of addresses.slice(i,i+GROUP))groupBy.set(a,g);
            }
            const eventKeys=new Set((e.events||[]).map(x=>x.eventKey));
            const byLane=new Map();
            for(const r of rows){if(!byLane.has(r.laneKey))byLane.set(r.laneKey,[]);byLane.get(r.laneKey).push(r);}
            const all=[],unique=new Set(),byGroup={};
            let pendingIntervals=0,priorIntervals=0;
            for(const [laneKey,laneRows] of byLane){
              laneRows.sort((a,b)=>Number(a.blockNumber)-Number(b.blockNumber));
              for(let i=1;i<laneRows.length;i++){
                const open=laneRows[i-1],close=laneRows[i];
                if(Number(close.blockNumber)<=Number(open.blockNumber))continue;
                const eventKey=`ve33:${laneKey}:${open.blockNumber}:${close.blockNumber}`;
                if(eventKeys.has(eventKey)){priorIntervals++;continue;}
                pendingIntervals++;
                const address=lower(open.kind==='rebase-distributor'?open.distributor:open.rewardContract);
                const group=groupBy.get(address);
                for(let from=Number(open.blockNumber)+1;from<=Number(close.blockNumber);from+=MAX){
                  const to=Math.min(Number(close.blockNumber),from+MAX-1);
                  const key=`${group}|${from}|${to}`;
                  all.push(key);unique.add(key);byGroup[group]=(byGroup[group]||0)+1;
                }
              }
            }
            const counts=new Map();for(const k of all)counts.set(k,(counts.get(k)||0)+1);
            const dupCounts=[...counts.values()].filter(x=>x>1).sort((a,b)=>b-a);
            out[protocol]={
              checkpointRows:rows.length,laneCount:byLane.size,settlementAddressCount:addresses.length,settlementGroupCount:Math.ceil(addresses.length/GROUP),
              pendingIntervals,priorIntervals,totalLaneChunkRequests:all.length,uniqueCacheKeys:unique.size,
              theoreticalCacheHits:all.length-unique.size,duplicateKeyCount:dupCounts.length,maxConsumersPerKey:dupCounts[0]||1,
              laneChunkRequestsByGroup:byGroup
            };
          }
          console.log('PR828_SETTLEMENT_CACHE_SHAPE='+JSON.stringify(out,null,2));
          NODE
