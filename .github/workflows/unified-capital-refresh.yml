# holding-workflow-definition-proof: intelligence/reliability/unified-capital-refresh-workflow-definition-proof.mjs
name: "The Holding Capital · Unified Refresh"

on:
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * 0'
  workflow_run:
    workflows:
      - "The Holding Market Data · Shared Refresh"
      - "Update Stable Capital"
      - "Update Company Rewards"
      - "Update Company #010 · Cypher Production State"
      - "Update Company #010 · Project X Reference APR"
    types: [completed]
  push:
    branches: [main]
    paths:
      - 'companies/defitea-canonical-state.json'
      - 'companies/defitea-public-capital-projection.mjs'
      - 'companies/yieldring-canonical-state.json'
      - 'companies/yieldring-public-capital-projection.mjs'
      - 'companies/company-001-owner-capital-snapshot.json'
      - 'companies/owner-balance-site-projection.mjs'
      - 'companies/public-page-market-runtime-projection.mjs'
      - 'companies/public-site-polish-projection.mjs'
      - 'companies/company-010-production-state.json'
      - 'productivity/productivity-engine.mjs'
      - 'productivity/company-010-productivity-overlay.mjs'
      - 'productivity/yieldring-productivity-overlay.mjs'
      - 'productivity/votemarket-productivity-overlay.mjs'
      - 'productivity/votemarket-productivity-overlay-validation.mjs'
      - 'productivity/fxn-locker-apr-guard.mjs'
      - 'intelligence/capital-state/capital-state.mjs'
      - 'intelligence/capital-state/unified-capital-refresh.mjs'
      - 'intelligence/capital-state/unified-capital-market-data-guard.mjs'
      - 'intelligence/market-data/fund-capital-registry.json'
      - 'intelligence/market-data/market-price-registry.json'
      - 'intelligence/market-data/public-capital-engine.mjs'
      - '.github/workflows/unified-capital-refresh.yml'

permissions:
  contents: write

concurrency:
  group: unified-capital-refresh
  cancel-in-progress: false

jobs:
  admission:
    runs-on: ubuntu-latest
    outputs:
      due: ${{ steps.handoff.outputs.due }}
      reason: ${{ steps.handoff.outputs.reason }}
    steps:
      - name: Checkout canonical main for handoff admission
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main
          fetch-depth: 1

      - name: Determine Unified Capital handoff admission
        id: handoff
        env:
          EVENT_NAME: ${{ github.event_name }}
          UPSTREAM_WORKFLOW: ${{ github.event.workflow_run.name }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$GITHUB_OUTPUT" <<'PY'
          import json
          import os
          import sys

          output_path = sys.argv[1]
          event_name = os.environ.get('EVENT_NAME', '')
          upstream = os.environ.get('UPSTREAM_WORKFLOW', '')
          due = True
          reason = 'direct-schedule-or-non-market-upstream'

          if event_name == 'workflow_run' and upstream == 'The Holding Market Data · Shared Refresh':
              reason = 'market-data-state-unavailable-fail-open'
              try:
                  with open('intelligence/market-data/market-data.json', 'r', encoding='utf-8') as handle:
                      market = json.load(handle)
                  with open('intelligence/market-data/public-capital-state.json', 'r', encoding='utf-8') as handle:
                      public = json.load(handle)
                  market_generation = str(market.get('generatedAt') or '')
                  materialized_generation = str((public.get('sourceState') or {}).get('marketDataGeneratedAt') or '')
                  if not market_generation:
                      raise ValueError('canonical Market Data generation missing')
                  due = market_generation != materialized_generation
                  reason = 'new-market-data-awaiting-capital' if due else 'market-data-noop-already-materialized'
              except Exception as error:
                  print(f'::warning::Unable to prove Market Data/Public Capital generation parity: {error}')
                  due = True

          with open(output_path, 'a', encoding='utf-8') as output:
              output.write(f"due={'true' if due else 'false'}\n")
              output.write(f"reason={reason}\n")
          print('Unified Capital admission', {'due': due, 'reason': reason, 'event': event_name, 'upstream': upstream})
          PY

  refresh:
    needs: admission
    if: >-
      ${{
        needs.admission.outputs.due == 'true' &&
        (
          github.event_name != 'workflow_run' ||
          (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
        )
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout canonical main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Install Productivity dependencies
        working-directory: productivity
        run: npm install --no-audit --no-fund

      - name: Install Playwright Chromium without apt mutation
        working-directory: productivity
        run: npx playwright install chromium

      - name: Validate unified orchestrator and existing engines
        run: |
          set -euo pipefail
          node --check intelligence/capital-state/unified-capital-refresh.mjs
          node --check intelligence/capital-state/unified-capital-market-data-guard.mjs
          node --check companies/defitea-public-capital-projection.mjs
          node --check companies/yieldring-public-capital-projection.mjs
          node --check companies/owner-balance-site-projection.mjs
          node --check companies/public-page-market-runtime-projection.mjs
          node --check companies/public-site-polish-projection.mjs
          node --check productivity/productivity-engine.mjs
          node --check productivity/company-010-productivity-overlay.mjs
          node --check productivity/yieldring-productivity-overlay.mjs
          node --check productivity/votemarket-productivity-overlay.mjs
          node --check productivity/votemarket-productivity-overlay-validation.mjs
          node --check intelligence/capital-state/general-company-balance-sheet.mjs
          node --check intelligence/capital-state/capital-state.mjs
          node --check intelligence/market-data/coingecko-fetch-shim.mjs
          node --check intelligence/market-data/public-capital-engine.mjs

      - name: Prove VoteMarket overlay safety deterministically
        run: |
          set -euo pipefail
          node productivity/votemarket-productivity-overlay-validation.mjs

      - name: Require canonical per-asset Market Data
        run: |
          set -euo pipefail
          node intelligence/capital-state/unified-capital-market-data-guard.mjs

      - name: Refresh all coherent capital surfaces from canonical Market Data
        env:
          NODE_OPTIONS: --import=${{ github.workspace }}/intelligence/market-data/coingecko-fetch-shim.mjs
          ETH_RPC_URL: ${{ secrets.ETH_RPC_URL }}
          BASE_RPC_URL: ${{ secrets.BASE_RPC_URL }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node intelligence/capital-state/unified-capital-refresh.mjs

      - name: Rebuild coherent public capital projection
        run: node intelligence/market-data/public-capital-engine.mjs

      - name: Validate final coherent snapshot
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs');
          const p=JSON.parse(fs.readFileSync('companies/productivity-data.json','utf8'));
          const vmState=JSON.parse(fs.readFileSync('companies/votemarket-reference-state.json','utf8'));
          const g=JSON.parse(fs.readFileSync('intelligence/capital-state/general-company-balance-sheet.json','utf8'));
          const c=JSON.parse(fs.readFileSync('intelligence/capital-state/capital-state.json','utf8'));
          const m=JSON.parse(fs.readFileSync('intelligence/market-data/market-data.json','utf8'));
          const pub=JSON.parse(fs.readFileSync('intelligence/market-data/public-capital-state.json','utf8'));
          const home=fs.readFileSync('index.html','utf8');
          const company001Page=fs.readFileSync('05081966/index.html','utf8');
          const singulPage=fs.readFileSync('singul/index.html','utf8');
          const yieldReportsPage=fs.readFileSync('yield-reports/index.html','utf8');
          const d=p.companies?.['defitea.eth'];
          const da=(d?.breakdown||[]).find(x=>x.engineId==='aerodrome_veaero'||x.principalId==='aerodrome-finance');
          const dcrow=(d?.breakdown||[]).find(x=>x.engineId==='curve_vecrv'||x.principalId==='curve-dao-token');
          const df=(d?.breakdown||[]).find(x=>x.engineId==='fx_vefxn'||x.principalId==='fxn-token');
          const vm=p.diagnostics?.voteMarketIncomeChannels;
          const dc=(c.companies||[]).find(x=>x.registry==='004');
          const dca=(dc?.measuredPositions||[]).find(x=>x.assetId==='aerodrome-finance');
          const dcf=(dc?.measuredPositions||[]).find(x=>x.assetId==='fxn-token');
          if(!d||Number(da?.units)!==2632||Number(df?.units)!==64.81)throw new Error('Defitea Productivity coherence missing');
          if(!dc||Number(dca?.units)!==2632||Number(dcf?.units)!==64.81)throw new Error('Defitea Capital State coherence missing');
          if(vm?.capitalDoubleCount!==false||vm?.idempotent!==true||vm?.factualIncomeAuthority!==false||vm?.executionAuthority!=='none')throw new Error('VoteMarket safety contract missing from coherent snapshot');
          if(vm?.claimedPeriodPersistencePending!==false||vm?.observationPersistence!=='claimed-aware-derived-cache')throw new Error('VoteMarket claimed-period persistence contract missing');
          if(vmState?.semantics?.sourceOfTruth!==false||vmState?.semantics?.factualIncomeAuthority!==false||vmState?.semantics?.executionAuthority!=='none')throw new Error('VoteMarket derived persistence authority drift');
          for(const [label,row] of [['veCRV',dcrow],['veFXN',df]]){
            if(!row?.incomeChannels||row.incomeChannels.capitalAccounting!=='principal-counted-once'||row.incomeChannels.capitalDoubleCount!==false)throw new Error(label+' VoteMarket principal hierarchy missing');
          }
          const y=p.companies?.['YieldRing.eth'];
          const a=(y?.breakdown||[]).find(x=>x.engineId==='aerodrome_veaero'||x.principalId==='aerodrome-finance');
          const yc=(c.companies||[]).find(x=>x.registry==='002');
          const btc=(yc?.measuredPositions||[]).find(x=>x.assetId==='bitcoin');
          const aero=(yc?.measuredPositions||[]).find(x=>x.assetId==='aerodrome-finance');
          const c5=(g.companies||[]).find(x=>x.registry==='005');
          const c6=(g.companies||[]).find(x=>x.registry==='006');
          const icp5=(c5?.positions||[]).find(x=>x.assetId==='internet-computer');
          const icp6=(c6?.positions||[]).find(x=>x.assetId==='internet-computer');
          const icp=m.prices?.['internet-computer'];
          if(p.version!=='1.16'||Number(a?.units)!==678)throw new Error('YieldRing Productivity coherence missing');
          if(g.status!=='ok'||c.status!=='ok')throw new Error('capital substrate not coherent');
          if(Number(btc?.units)!==0.0334||Number(aero?.units)!==678)throw new Error('YieldRing Capital State coherence missing');
          if(Number(icp5?.units)!==1363||Number(icp6?.units)!==1296)throw new Error('Company #005/#006 ICP balances missing');
          if(Math.abs(Number(icp5?.priceUsd)-Number(icp?.usd))>1e-9||Math.abs(Number(icp6?.priceUsd)-Number(icp?.usd))>1e-9)throw new Error('Company #005/#006 ICP valuation not bound to canonical Market Data');
          if(icp?.authority?.selectedLane!=='onchain'||!String(icp?.source||'').startsWith('onchain-'))throw new Error('ICP onchain authority drift');
          if(c.network?.registryCompanyCount!==10||c.network?.totalCapitalCompleteCompanyCount!==10||c.network?.totalCapitalCoverage!==1)throw new Error('Registry capital coverage drift');
          if(!(Number(c.network?.networkTvlUsd)>0)||c.network?.networkTvlStatus!=='complete')throw new Error('Network TVL unavailable');
          if(c.authority?.executionAuthority!=='none'||pub.authority?.executionAuthority!=='none')throw new Error('authority drift');
          if(m.semantics?.browserExternalPriceRequestsAllowed!==false||m.semantics?.perAssetAuthoritySelectionApplied!==true||pub.semantics?.browserExternalPriceRequestsAllowed!==false)throw new Error('market price authority drift');
          if(Number(m.authority?.unknownCount)!==0)throw new Error('Canonical Market Data contains UNKNOWN assets');
          if(Number(m.authority?.onchainSelectedAssetCount)+Number(m.authority?.coingeckoSelectedAssetCount)!==26)throw new Error('Canonical Market Data selected-lane coverage drift');
          if(!Number.isFinite(Number(pub.funds?.defitea?.tvlUsd))||!Number.isFinite(Number(pub.funds?.defitea?.referenceAprPct)))throw new Error('Defitea Public Capital incomplete');
          if(pub.sourceState?.marketDataGeneratedAt!==m.generatedAt)throw new Error('Public Capital is not bound to the current Market Data generation');
          if(!home.includes('href="/companies"')||!home.includes('href="/realty"')||!home.includes('data-th-fund-pyramid-links')||!home.includes('Capital Architecture · Onchain Companies · Real Estate'))throw new Error('Homepage public polish projection missing');
          if(company001Page.includes('api.coingecko.com')||!company001Page.includes('canonical onchain-first snapshot'))throw new Error('Company #001 canonical page runtime missing');
          if(singulPage.includes('/intelligence/market-data/simple-price')||singulPage.includes('setInterval(updateTVL, 300000)')||!singulPage.includes('public-capital-client.js'))throw new Error('Singul canonical page runtime missing');
          if(!yieldReportsPage.includes('The Holding · Defitea mobile cash-flow polish')||!yieldReportsPage.includes('.defitea-reports .report-table td:nth-child(2) { display: table-cell; }'))throw new Error('Defitea mobile Yield Reports cash-flow visibility missing');
          console.log('Unified Capital Refresh final validation PASS',{generatedAt:p.generatedAt,defiteaApr:d.aprLatest,defiteaAero:dca.units,defiteaFxn:dcf.units,voteMarketMeasuredReferenceCompanyCount:vm.measuredReferenceCompanyCount,voteMarketClaimPersistence:true,veCrvVoteMarketStatus:dcrow?.incomeChannels?.votemarket?.status||null,veFxnVoteMarketStatus:df?.incomeChannels?.votemarket?.status||null,yieldRingApr:y.aprLatest,networkTvl:c.network.networkTvlUsd,marketObservedAt:m.observedAt,onchainSelectedAssetCount:m.authority.onchainSelectedAssetCount,coingeckoFallbackAssetCount:m.authority.coingeckoSelectedAssetCount,icpUsd:icp.usd,icpSource:icp.source,company005Icp:icp5.units,company006Icp:icp6.units,publicDefiteaTvl:pub.funds.defitea.tvlUsd,marketGenerationParity:true,homepagePublicPolish:true,defiteaMobileReportPolish:true});
          NODE
          git diff --check

      - name: Publish one coherent capital snapshot safely
        run: |
          set -euo pipefail
          git config user.name "The Holding Capital Orchestrator"
          git config user.email "capital-orchestrator@theholding.ai"
          git add \
            index.html \
            companies/index.html \
            05081966/index.html \
            yieldring/index.html \
            singul/index.html \
            yield-reports/index.html \
            companies/productivity-data.json \
            companies/productivity-source-report.json \
            companies/votemarket-reference-state.json \
            intelligence/capital-state/general-company-balance-sheet.mjs \
            intelligence/capital-state/general-company-balance-sheet.json \
            intelligence/capital-state/capital-state.json \
            intelligence/market-data/public-capital-state.json
          if git diff --cached --quiet; then
            echo "Unified capital surfaces already current."
            exit 0
          fi
          git commit -m "capital: refresh coherent production snapshot"
          for attempt in 1 2 3; do
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "Unified capital writer conflict; refusing to guess."
              exit 1
            fi
            # A first-pass generated commit may have been composed by multiple projectors.
            # After any fresh-main rebase, discard only generated/public materialization
            # bytes back to canonical origin/main, then recompute the whole chain once.
            git checkout origin/main -- \
              index.html \
              companies/index.html \
              05081966/index.html \
              yieldring/index.html \
              singul/index.html \
              yield-reports/index.html \
              companies/productivity-data.json \
              companies/productivity-source-report.json \
              companies/votemarket-reference-state.json \
              intelligence/capital-state/general-company-balance-sheet.mjs \
              intelligence/capital-state/general-company-balance-sheet.json \
              intelligence/capital-state/capital-state.json \
              intelligence/market-data/public-capital-state.json
            node intelligence/capital-state/unified-capital-market-data-guard.mjs
            NODE_OPTIONS='--import=${{ github.workspace }}/intelligence/market-data/coingecko-fetch-shim.mjs' \
            ETH_RPC_URL='${{ secrets.ETH_RPC_URL }}' \
            BASE_RPC_URL='${{ secrets.BASE_RPC_URL }}' \
            GITHUB_TOKEN='${{ github.token }}' \
              node intelligence/capital-state/unified-capital-refresh.mjs
            node intelligence/market-data/public-capital-engine.mjs
            git add \
              index.html \
              companies/index.html \
              05081966/index.html \
              yieldring/index.html \
              singul/index.html \
              yield-reports/index.html \
              companies/productivity-data.json \
              companies/productivity-source-report.json \
              companies/votemarket-reference-state.json \
              intelligence/capital-state/general-company-balance-sheet.mjs \
              intelligence/capital-state/general-company-balance-sheet.json \
              intelligence/capital-state/capital-state.json \
              intelligence/market-data/public-capital-state.json
            git commit --amend --no-edit
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1