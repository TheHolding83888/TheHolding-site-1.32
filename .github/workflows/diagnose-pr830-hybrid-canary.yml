name: Diagnose PR830 Hybrid Exact Canary
on:
  push:
    branches:
      - diagnostic/pr830-runtime-matrix-20260915
    paths:
      - '.github/workflows/diagnose-pr830-hybrid-canary.yml'
permissions:
  contents: read
jobs:
  canary:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/ve33-rpc-runtime-fresh-20260915
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock ethers@6
      - name: Deterministic validation
        run: |
          set -euo pipefail
          node --check reporting/ve33-accounting-evidence.mjs
          node reporting/ve33-accounting-evidence-validation.mjs
      - name: Exact public Base plus Optimism canary
        env:
          REWARDS_DATA_FILE: ./companies/rewards-data.json
          VE33_EVIDENCE_FILE: /tmp/ve33-accounting-evidence.json
          VE33_STATE_READ_CONCURRENCY: '5'
          VE33_SETTLEMENT_CONCURRENCY: '5'
          VE33_SETTLEMENT_ADDRESS_GROUP_SIZE: '96'
          BASE_RPC_URL: https://base-rpc.publicnode.com
          OPTIMISM_RPC_URL: https://gateway.tenderly.co/public/optimism
        run: |
          set -euo pipefail
          cp reporting/ve33-accounting-evidence.json "$VE33_EVIDENCE_FILE"
          node reporting/ve33-accounting-evidence.mjs
          node - <<'NODE'
          const fs=require('fs');
          const e=JSON.parse(fs.readFileSync('/tmp/ve33-accounting-evidence.json','utf8'));
          const protocols=Object.fromEntries(Object.entries(e.diagnostics?.protocols||{}).map(([k,v])=>[k,{
            lanes:Number(v.laneCount||0),
            currentCheckpoints:Number(v.currentCheckpointCount||0),
            currentStateFailures:Number(v.currentStateFailureCount||0),
            boundaryFailures:(v.boundaryFailures||[]).length,
            skippedHistoricalLaneReads:Number(v.historicalBoundarySkippedLaneReads||0),
            intervals:Number(v.intervalCount||0),
            settlementQueryFailures:Number(v.settlementQueryFailureCount||0),
            settlementRpc:v.settlementRpc||null
          }]));
          const out={runtimeMs:Number(e.diagnostics?.runtimeMs||0),laneCount:Number(e.diagnostics?.laneCount||0),reconciliationCount:Number(e.diagnostics?.reconciliationCount||0),settlementQueryFailureCount:Number(e.diagnostics?.settlementQueryFailureCount||0),unresolvedSettlementCount:Number(e.diagnostics?.unresolvedSettlementCount||0),protocols};
          console.log('PR830_C5_CANARY='+JSON.stringify(out,null,2));
          if(!(out.laneCount>0))throw new Error('no accounting lanes');
          if(!Number.isFinite(out.runtimeMs)||!(out.runtimeMs>0))throw new Error('runtime missing');
          if(out.runtimeMs>450000)throw new Error(`runtime budget exceeded: ${out.runtimeMs}`);
          if(out.settlementQueryFailureCount!==0)throw new Error(`settlement query failures: ${out.settlementQueryFailureCount}`);
          if(out.unresolvedSettlementCount!==0)throw new Error(`unresolved settlements: ${out.unresolvedSettlementCount}`);
          if(out.reconciliationCount!==0)throw new Error(`reconciliation gaps: ${out.reconciliationCount}`);
          for(const p of ['aerodrome','velodrome']){
            const d=protocols[p];
            if(!d||d.lanes<=0)throw new Error(`missing lanes: ${p}`);
            if(d.currentCheckpoints+d.currentStateFailures!==d.lanes)throw new Error(`silent current state gap: ${p}`);
            if(d.currentStateFailures!==0)throw new Error(`current state failures: ${p}=${d.currentStateFailures}`);
            if(d.boundaryFailures!==0)throw new Error(`boundary failures: ${p}=${d.boundaryFailures}`);
            if(d.skippedHistoricalLaneReads!==0)throw new Error(`skipped historical reads: ${p}=${d.skippedHistoricalLaneReads}`);
          }
          console.log('PR830 c5 exact canary PASS');
          NODE
