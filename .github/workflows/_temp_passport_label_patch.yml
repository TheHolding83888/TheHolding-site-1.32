name: temp patch passport labels
on:
  pull_request:
    types: [opened, synchronize]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Patch Cypher adapter and verifier
        run: |
          python - <<'PY2'
          from pathlib import Path
          p=Path("companies/company-010-public-adapter.js")
          s=p.read_text()
          old="for(const [name,route,fallbackSymbol,fallbackChain] of [['Aerodrome','aerodrome-ve','AERO','Base'],['Velodrome','velodrome-ve-direct','VELO','Optimism']]){"
          new="for(const [name,label,route,fallbackSymbol,fallbackChain] of [['Aerodrome','Aerodrome · veAERO','aerodrome-ve','AERO','Base'],['Velodrome','Velodrome · veVELO','velodrome-ve-direct','VELO','Optimism']]){"
          if old not in s: raise SystemExit("adapter tuple contract not found")
          s=s.replace(old,new,1)
          old2="appendStrategyStateRow(panel,{label:name,meta,stateName,amount:embedded.amount||'—',amountMeta:stateName==='Compounded'?embedded.usd:''});"
          new2="appendStrategyStateRow(panel,{label,meta,stateName,amount:embedded.amount||'—',amountMeta:stateName==='Compounded'?embedded.usd:''});"
          if old2 not in s: raise SystemExit("adapter label projection contract not found")
          s=s.replace(old2,new2,1)
          p.write_text(s)
          p=Path(".github/workflows/verify-passport-productive-label-parity.yml")
          s=p.read_text()
          anchor="            'resupply-staking':'Resupply · staked RSUP'\n"
          if anchor not in s: raise SystemExit("verifier anchor not found")
          insert=anchor+"            'stakedao-base-curve-4pool':'Stake DAO · 4pool stables',\n            'convex-staked-cvxcrv':'Convex · staked cvxCRV'\n"
          s=s.replace(anchor,insert,1)
          p.write_text(s)
          PY2
          git config user.name 'The Holding Passport Hygiene'
          git config user.email 'passport-hygiene@theholding.ai'
          git add companies/company-010-public-adapter.js .github/workflows/verify-passport-productive-label-parity.yml
          git diff --cached --quiet || git commit -m 'fix: preserve Cypher productive reward labels'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
