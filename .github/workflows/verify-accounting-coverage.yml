name: Verify Accounting Coverage Registry

on:
  pull_request:
    paths:
      - 'reporting/accounting-coverage.mjs'
      - 'reporting/accounting-coverage-validation.mjs'
      - '.github/workflows/update-accounting-coverage.yml'
      - '.github/workflows/verify-accounting-coverage.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: Static validation
        shell: bash
        run: |
          set -euo pipefail
          node --check reporting/accounting-coverage.mjs
          node --check reporting/accounting-coverage-validation.mjs
          git diff --check

      - name: Build exact diagnostic registry
        env:
          PRODUCTIVITY_DATA_FILE: ./companies/productivity-data.json
          INCOME_LEDGER_FILE: ./reporting/income-ledger.json
          EMBEDDED_YIELD_LEDGER_FILE: ./companies/embedded-yield-ledger.json
          COMPANY_MONTHLY_REPORTS_FILE: ./reporting/company-monthly-reports.json
          ACCOUNTING_COVERAGE_FILE: /tmp/accounting-coverage.json
        run: node reporting/accounting-coverage.mjs

      - name: Validate exact diagnostic registry
        env:
          ACCOUNTING_COVERAGE_FILE: /tmp/accounting-coverage.json
        run: node reporting/accounting-coverage-validation.mjs

      - name: Print coverage gaps without granting authority
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs');
          const x=JSON.parse(fs.readFileSync('/tmp/accounting-coverage.json','utf8'));
          for(const [name,c] of Object.entries(x.companies||{})){
            const latest=Object.keys(c.months||{}).sort().at(-1);
            const row=c.months?.[latest];
            console.log(name,{
              registry:c.registry,
              mechanismCount:c.mechanismCount,
              latestMonth:latest,
              factualMechanisms:row?.mechanismsWithFactualPeriodEvidence,
              missingMechanisms:row?.mechanismsWithoutFactualPeriodEvidence,
              readyToClose:row?.registryReadyToCloseMonth,
              blockers:row?.blockers
            });
          }
          NODE

      - name: Guard diagnostic-only authority
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs');
          const text=fs.readFileSync('reporting/accounting-coverage.mjs','utf8');
          for(const bad of ['sendTransaction(','new Wallet(','api.coingecko.com','COINGECKO_API_KEY','registryHasMonthClosingAuthority:true','monthClosingAuthority:true']){
            if(text.includes(bad)) throw new Error('Accounting coverage authority expansion: '+bad);
          }
          const x=JSON.parse(fs.readFileSync('/tmp/accounting-coverage.json','utf8'));
          if(x.status!=='diagnostic-no-completion-authority'||x.authority?.monthClosingAuthority!==false) throw new Error('Diagnostic registry gained completion authority');
          console.log('Accounting Coverage diagnostic authority boundary PASS');
          NODE
