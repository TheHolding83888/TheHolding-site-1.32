name: Verify Accounting Coverage Registry

on:
  pull_request:
    paths:
      - 'reporting/accounting-coverage.mjs'
      - 'reporting/accounting-coverage-validation.mjs'
      - 'reporting/accounting-coverage-gap-diagnostic.mjs'
      - 'reporting/accounting-coverage-company-diagnostic.mjs'
      - 'reporting/icp-nns-tracking-proof-validation.mjs'
      - 'reporting/pendle-spendle-tracking-proof-validation.mjs'
      - 'reporting/resupply-tracking-proof-validation.mjs'
      - 'reporting/liquity-tracking-proof-validation.mjs'
      - 'reporting/yield-basis-lp-accounting-evidence.mjs'
      - 'reporting/yield-basis-lp-accounting-evidence-validation.mjs'
      - 'reporting/yield-basis-lp-accounting-evidence.json'
      - 'reporting/accounting-coverage.json'
      - 'companies/productivity-data.json'
      - 'companies/company-007-discovery.json'
      - 'companies/rewards-data.json'
      - 'companies/icp-nns-rewards-state.json'
      - 'intelligence/icp-nns/company-005-006-neuron-pool.json'
      - 'companies/embedded-yield-ledger.json'
      - 'reporting/income-ledger.json'
      - 'reporting/ve33-accounting-evidence.json'
      - 'reporting/ve33-locked-managed-accounting-evidence.json'
      - 'reporting/yield-basis-accounting-evidence.json'
      - 'reporting/frax-yield-accounting-evidence.json'
      - '.github/workflows/verify-accounting-coverage.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-accounting-coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: Validate dynamic factual-tracking coverage registry
        shell: bash
        env:
          ACCOUNTING_COVERAGE_FILE: /tmp/accounting-coverage.json
          ACCOUNTING_DIAGNOSTIC_COMPANY: Cypher
          PRODUCTIVITY_DATA_FILE: ./companies/productivity-data.json
          COMPANY_007_DISCOVERY_FILE: ./companies/company-007-discovery.json
          REWARDS_DATA_FILE: ./companies/rewards-data.json
          ICP_NNS_STATE_FILE: ./companies/icp-nns-rewards-state.json
          ICP_NNS_CONFIG_FILE: ./intelligence/icp-nns/company-005-006-neuron-pool.json
          INCOME_LEDGER_FILE: ./reporting/income-ledger.json
          EMBEDDED_YIELD_LEDGER_FILE: ./companies/embedded-yield-ledger.json
          VE33_EVIDENCE_FILE: ./reporting/ve33-accounting-evidence.json
          VE33_LOCKED_MANAGED_EVIDENCE_FILE: ./reporting/ve33-locked-managed-accounting-evidence.json
          YIELD_BASIS_EVIDENCE_FILE: ./reporting/yield-basis-accounting-evidence.json
          YIELD_BASIS_LP_EVIDENCE_FILE: /tmp/yield-basis-lp-accounting-evidence.json
          FRAX_EVIDENCE_FILE: ./reporting/frax-yield-accounting-evidence.json
          ETH_RPC_URL: ${{ secrets.ETH_RPC_URL }}
          ETH_RPC_URL_2: ${{ secrets.ETH_RPC_URL_2 }}
        run: |
          set -euo pipefail
          node --check reporting/accounting-coverage.mjs
          node --check reporting/accounting-coverage-validation.mjs
          node --check reporting/accounting-coverage-gap-diagnostic.mjs
          node --check reporting/accounting-coverage-company-diagnostic.mjs
          node --check reporting/icp-nns-tracking-proof-validation.mjs
          node --check reporting/pendle-spendle-tracking-proof-validation.mjs
          node --check reporting/resupply-tracking-proof-validation.mjs
          node --check reporting/liquity-tracking-proof-validation.mjs
          node --check reporting/yield-basis-lp-accounting-evidence.mjs
          node --check reporting/yield-basis-lp-accounting-evidence-validation.mjs
          node reporting/icp-nns-tracking-proof-validation.mjs
          node reporting/pendle-spendle-tracking-proof-validation.mjs
          node reporting/resupply-tracking-proof-validation.mjs
          node reporting/liquity-tracking-proof-validation.mjs
          node reporting/yield-basis-lp-accounting-evidence-validation.mjs

          yblp_sensitive=true
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base_sha="${{ github.event.pull_request.base.sha }}"
            git fetch --no-tags --depth=1 origin "$base_sha"
            if git diff --name-only "$base_sha" HEAD | grep -Eq '^(reporting/yield-basis-lp-accounting-evidence\.mjs|reporting/yield-basis-lp-accounting-evidence-validation\.mjs|reporting/accounting-coverage\.mjs|companies/company-007-discovery\.json)$'; then
              yblp_sensitive=true
            else
              yblp_sensitive=false
            fi
          fi

          if [ "$yblp_sensitive" = "true" ]; then
            node reporting/yield-basis-lp-accounting-evidence.mjs
            test -s "$YIELD_BASIS_LP_EVIDENCE_FILE"
            node reporting/yield-basis-lp-accounting-evidence-validation.mjs
          elif [ -s reporting/yield-basis-lp-accounting-evidence.json ]; then
            cp reporting/yield-basis-lp-accounting-evidence.json "$YIELD_BASIS_LP_EVIDENCE_FILE"
            node reporting/yield-basis-lp-accounting-evidence-validation.mjs
          else
            echo "Yield Basis LP live proof is unrelated to this candidate and no persisted evidence exists yet; preserving UNKNOWN rather than freezing unrelated coverage work."
          fi

          node reporting/accounting-coverage.mjs
          test -s "$ACCOUNTING_COVERAGE_FILE"
          node --input-type=module - <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          const data=JSON.parse(fs.readFileSync(process.env.ACCOUNTING_COVERAGE_FILE,'utf8'));
          const engine=data.mechanisms?.icp_nns;
          assert.ok(engine,'icp_nns mechanism missing');
          assert.equal(engine.activeCompanyCount,2,'ICP NNS active company count drift');
          assert.equal(engine.factualTrackingCompanyCount,2,'ICP NNS did not reach 2/2 factual tracking');
          assert.equal(engine.factualEventCompanyCount,0,'ICP NNS tracking proof fabricated factual period events');
          assert.equal(engine.currentMonthFactualEventCount,0,'ICP NNS tracking proof fabricated current-month events');
          assert.equal(engine.currentMonthFactualUsdSubtotal,0,'eventless ICP NNS aggregate should remain zero subtotal, not estimated rewards');
          assert.equal(engine.reusableCoverageGap,false,'ICP NNS remained a reusable tracking gap');
          for(const company of engine.companies){
            const row=data.companies?.[company]?.mechanisms?.icp_nns?.months?.[data.currentMonth];
            assert.equal(row?.status,'factual-tracking-no-period-event',`${company} ICP NNS status drift`);
            assert.equal(row?.factualEventCount,0,`${company} ICP NNS fabricated income event`);
            assert.equal(row?.factualUsdSubtotal,null,`${company} ICP NNS estimated rewards leaked into factual USD subtotal`);
            assert.deepEqual(row?.factualTrackingProofSources,['companies/icp-nns-rewards-state.json'],`${company} ICP NNS proof source drift`);
            assert.ok(row?.completionBlockers?.includes('no-canonical-period-income-evidence'),`${company} ICP NNS lost no-period-income blocker`);
          }
          console.log('ICP NNS production-shaped coverage PASS',{tracking:`${engine.factualTrackingCompanyCount}/${engine.activeCompanyCount}`,factualEventCompanies:engine.factualEventCompanyCount,reusableCoverageGap:engine.reusableCoverageGap,periodIncomeAuthority:false});
          NODE
          node --input-type=module - <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          const data=JSON.parse(fs.readFileSync(process.env.ACCOUNTING_COVERAGE_FILE,'utf8'));
          const engine=data.mechanisms?.pendle_spendle;
          assert.ok(engine,'pendle_spendle mechanism missing');
          assert.equal(engine.activeCompanyCount,1,'sPENDLE active company count drift');
          assert.equal(engine.factualTrackingCompanyCount,1,'sPENDLE did not reach 1/1 factual tracking');
          assert.deepEqual(engine.factualTrackingCompanies,['defitea.eth'],'sPENDLE tracking company identity drift');
          assert.equal(engine.reusableCoverageGap,false,'sPENDLE remained a reusable tracking gap');
          const row=data.companies?.['defitea.eth']?.mechanisms?.pendle_spendle?.months?.[data.currentMonth];
          assert.equal(row?.factualTrackingActive,true,'Defitea sPENDLE tracking is not active');
          assert.ok(row?.factualTrackingProofSources?.includes('companies/rewards-data.json'),'Defitea sPENDLE canonical reward observation proof missing');
          assert.ok(!row?.completionBlockers?.includes('no-factual-engine-tracking-proof'),'Defitea sPENDLE still reports missing tracking proof');
          console.log('sPENDLE production-shaped coverage PASS',{tracking:`${engine.factualTrackingCompanyCount}/${engine.activeCompanyCount}`,factualEventCompanies:engine.factualEventCompanyCount,reusableCoverageGap:engine.reusableCoverageGap,periodIncomeAuthority:false});
          NODE
          node --input-type=module - <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          const data=JSON.parse(fs.readFileSync(process.env.ACCOUNTING_COVERAGE_FILE,'utf8'));
          const engine=data.mechanisms?.resupply_rsup;
          assert.ok(engine,'resupply_rsup mechanism missing');
          assert.equal(engine.activeCompanyCount,1,'Resupply active company count drift');
          assert.deepEqual(engine.companies,['defitea.eth'],'Resupply company identity drift');
          assert.equal(engine.factualTrackingCompanyCount,1,'Resupply did not reach 1/1 factual tracking');
          assert.deepEqual(engine.factualTrackingCompanies,['defitea.eth'],'Resupply factual tracking identity drift');
          assert.equal(engine.factualEventCompanyCount,0,'Resupply tracking proof fabricated factual period events');
          assert.equal(engine.reusableCoverageGap,false,'Resupply remained a reusable tracking gap');
          const row=data.companies?.['defitea.eth']?.mechanisms?.resupply_rsup?.months?.[data.currentMonth];
          assert.equal(row?.status,'factual-tracking-no-period-event','Defitea Resupply status drift');
          assert.equal(row?.factualEventCount,0,'Resupply tracking proof fabricated income event');
          assert.equal(row?.factualUsdSubtotal,null,'Resupply current reward state leaked into factual USD subtotal');
          assert.deepEqual(row?.factualTrackingProofSources,['companies/rewards-data.json'],'Resupply proof source drift');
          assert.ok(row?.completionBlockers?.includes('no-canonical-period-income-evidence'),'Resupply lost no-period-income blocker');
          assert.ok(!data.gapRanking.some(x=>x.engineId==='resupply_rsup'),'Resupply remained in reusable gap ranking');
          console.log('Resupply production-shaped coverage PASS',{tracking:`${engine.factualTrackingCompanyCount}/${engine.activeCompanyCount}`,factualEventCompanies:engine.factualEventCompanyCount,reusableCoverageGap:engine.reusableCoverageGap,periodIncomeAuthority:false});
          NODE
          node --input-type=module - <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          const data=JSON.parse(fs.readFileSync(process.env.ACCOUNTING_COVERAGE_FILE,'utf8'));
          const engine=data.mechanisms?.liquity_lqty;
          assert.ok(engine,'liquity_lqty mechanism missing');
          assert.equal(engine.activeCompanyCount,1,'Liquity active company count drift');
          assert.deepEqual(engine.companies,['defitea.eth'],'Liquity company identity drift');
          assert.equal(engine.factualTrackingCompanyCount,1,'Liquity did not reach 1/1 factual tracking');
          assert.deepEqual(engine.factualTrackingCompanies,['defitea.eth'],'Liquity factual tracking identity drift');
          assert.equal(engine.factualEventCompanyCount,0,'Liquity tracking proof fabricated factual period events');
          assert.equal(engine.reusableCoverageGap,false,'Liquity remained a reusable tracking gap');
          const row=data.companies?.['defitea.eth']?.mechanisms?.liquity_lqty?.months?.[data.currentMonth];
          assert.equal(row?.status,'factual-tracking-no-period-event','Defitea Liquity status drift');
          assert.equal(row?.factualEventCount,0,'Liquity tracking proof fabricated income event');
          assert.equal(row?.factualUsdSubtotal,null,'Liquity current reward state leaked into factual USD subtotal');
          assert.deepEqual(row?.factualTrackingProofSources,['companies/rewards-data.json'],'Liquity proof source drift');
          assert.ok(row?.completionBlockers?.includes('no-canonical-period-income-evidence'),'Liquity lost no-period-income blocker');
          assert.ok(!data.gapRanking.some(x=>x.engineId==='liquity_lqty'),'Liquity remained in reusable gap ranking');
          console.log('Liquity production-shaped coverage PASS',{tracking:`${engine.factualTrackingCompanyCount}/${engine.activeCompanyCount}`,factualEventCompanies:engine.factualEventCompanyCount,reusableCoverageGap:engine.reusableCoverageGap,periodIncomeAuthority:false});
          NODE
          if [ "$yblp_sensitive" = "true" ]; then
            node --input-type=module - <<'NODE'
            import assert from 'node:assert/strict';
            import fs from 'node:fs';
            const data=JSON.parse(fs.readFileSync(process.env.ACCOUNTING_COVERAGE_FILE,'utf8'));
            const baseline=JSON.parse(fs.readFileSync('reporting/accounting-coverage.json','utf8'));
            const ids=['yieldbasis_yblp_weth','yieldbasis_yblp_wbtc'];
            for(const engineId of ids){
              const engine=data.mechanisms?.[engineId];
              assert.ok(engine,`${engineId} mechanism missing`);
              assert.equal(engine.activeCompanyCount,1,`${engineId} active company count drift`);
              assert.deepEqual(engine.companies,["Rook's portfolio"],`${engineId} company identity drift`);
              assert.equal(engine.factualTrackingCompanyCount,1,`${engineId} did not reach 1/1 factual tracking`);
              assert.equal(engine.factualEventCompanyCount,0,`${engineId} tracking proof fabricated factual period events`);
              assert.equal(engine.reusableCoverageGap,false,`${engineId} remained a reusable tracking gap`);
              const row=data.companies?.["Rook's portfolio"]?.mechanisms?.[engineId]?.months?.[data.currentMonth];
              assert.equal(row?.status,'factual-tracking-no-period-event',`${engineId} status drift`);
              assert.equal(row?.factualEventCount,0,`${engineId} fabricated income event`);
              assert.equal(row?.factualUsdSubtotal,null,`${engineId} current PPS leaked into factual income`);
              assert.deepEqual(row?.factualTrackingProofSources,['reporting/yield-basis-lp-accounting-evidence.json'],`${engineId} proof source drift`);
              assert.ok(row?.completionBlockers?.includes('no-canonical-period-income-evidence'),`${engineId} lost no-period-income blocker`);
              assert.ok(!row?.completionBlockers?.includes('no-factual-engine-tracking-proof'),`${engineId} still reports missing tracking proof`);
            }
            const baselineYblpGaps=(baseline.gapRanking||[]).filter(x=>ids.includes(x.engineId)).length;
            assert.equal(baselineYblpGaps,2,'production baseline no longer has exactly two YBLP tracking gaps; refresh the frontier instead of forcing stale assumptions');
            assert.equal(data.summary.reusableCoverageGapCount,baseline.summary.reusableCoverageGapCount-baselineYblpGaps,'YBLP proof changed reusable gap count by more than its two mechanisms');
            assert.ok(!(data.gapRanking||[]).some(x=>ids.includes(x.engineId)),'Yield Basis LP remained in reusable gap ranking');
            console.log('Yield Basis LP production-shaped coverage PASS',{weth:'1/1',wbtc:'1/1',beforeGaps:baseline.summary.reusableCoverageGapCount,afterGaps:data.summary.reusableCoverageGapCount,periodIncomeAuthority:false});
            NODE
          fi
          node reporting/accounting-coverage-validation.mjs
          node reporting/accounting-coverage-gap-diagnostic.mjs
          node reporting/accounting-coverage-company-diagnostic.mjs
          git diff --check
