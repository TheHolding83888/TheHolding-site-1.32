name: "The Holding Security · Public Surface Privacy Guard"

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: public-surface-privacy-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Static privacy contract
        shell: bash
        run: |
          set -euo pipefail
          test -s security/public-surface-privacy-policy.json
          test -s security/public-surface-privacy-guard.mjs
          node --check security/public-surface-privacy-guard.mjs
          grep -q '"executionAuthority": "none"' security/public-surface-privacy-policy.json
          grep -q '"repositoryMutationAuthority": false' security/public-surface-privacy-policy.json
          grep -q '"historicalRewriteAuthority": false' security/public-surface-privacy-policy.json
          grep -qi 'theholding83888' security/public-surface-privacy-policy.json

      - name: Scan browser-facing text assets
        run: node security/public-surface-privacy-guard.mjs

      - name: Verify read-only boundary
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code
          git diff --check
