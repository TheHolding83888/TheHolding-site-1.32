name: TEMP Medium Public Truth Patch v2

on:
  push:
    branches:
      - fix/medium-public-surface-truth-20260821

permissions:
  contents: write

jobs:
  patch:
    if: "!contains(github.event.head_commit.message, 'UI: align medium public truth surfaces')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: fix/medium-public-surface-truth-20260821
      - name: Patch public truth surfaces
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          def r(path): return Path(path).read_text(encoding='utf-8')
          def w(path,s): Path(path).write_text(s,encoding='utf-8')
          def sub(s,pat,repl,label,flags=0,required=True):
              s2,n=re.subn(pat,repl,s,flags=flags)
              print(label,n)
              if required and n<1: raise SystemExit(f'{label}: no match')
              return s2
          def simple(s,old,new,label,required=True):
              n=s.count(old); print(label,n)
              if required and n<1: raise SystemExit(f'{label}: no match')
              return s.replace(old,new)

          # HOMEPAGE -------------------------------------------------------
          p='index.html'; s=r(p)
          s=sub(s,r'<meta name="description" content="Institutional-grade onchain fund ecosystem managing \$20K\+[^\"]*">','<meta name="description" content="A transparent onchain capital system spanning Bitcoin, Ethereum, precious metals, DeFi yield, stable-capital and venture strategies, with live market data, onchain measurement and operating history.">','home meta')
          s=sub(s,r'<meta name="twitter:description" content="Institutional-grade onchain funds\.[^\"]*">','<meta name="twitter:description" content="Onchain funds and companies measured through live capital, productivity, operating history and a shared intelligence layer.">','home twitter')
          s=simple(s,'Eight DeFi protocols working in harmony','Eleven DeFi engines working in harmony','defitea engines')
          s=simple(s,'<span class="ns-stat"><b>5</b> Companies</span>','<span class="ns-stat"><b>10</b> Companies</span>','network company fallback')
          s=simple(s,'<span class="ns-stat"><b>13</b> Protocols &amp; Assets</span>','<span class="ns-stat"><b>29</b> Protocols &amp; Assets</span>','network protocol fallback')
          s=simple(s,'A growing registry of sovereign onchain companies — each with its own owner, treasury, keys and history.','A live network of sovereign onchain companies — independently owned and measured through capital, productivity, rewards and operating history.','network narrative')
          s=simple(s,'The Holding Index · Registry · Composite / TVL Views · Passports · Network Graph','The Holding Network · Index · Intelligence · Passports','network full caps')
          s=simple(s,'Index · Registry · Views · Passports · Graph','The Holding Network · Index · Intelligence · Passports','network short caps')
          s=sub(s,r'<div class="fund-metric-label">Status</div>\s*<div class="fund-metric-value">Building</div>', '<div class="fund-metric-label">Reference APY</div>\n                        <div class="fund-metric-value" data-th-fund="monetra" data-th-fund-metric="reference-apr" data-th-digits="2">—</div>','home Monetra APY')
          s=simple(s,'Monetra is a building layer of The Holding.','Monetra is the live stable-capital layer of The Holding.','home Monetra copy')
          s=sub(s,r'(<(?:div|span)[^>]*\bdata-tvl(?:-viz)?="[^"]+"[^>]*>)[^<]*(</(?:div|span)>)',r'\1—\2','mutable TVL fallbacks',required=True)
          s=sub(s,r'(<div class="metric-value" data-metric="total-capital">)[^<]*(</div>)',r'\1—\2','total capital fallback')
          s=sub(s,r'(<(?:div|span)[^>]*data-th-company="defitea\.eth"[^>]*data-th-company-apr="latest"[^>]*>)[^<]*(</(?:div|span)>)',r'\1—\2','defitea APR fallbacks')
          w(p,s)

          # SUBSTANTIA -----------------------------------------------------
          p='substantia/index.html'; s=r(p)
          s=simple(s,'Live · CoinGecko','Canonical Market Data','Substantia static provenance')
          s=sub(s,r'''\s*const now = new Date\(\);\s*const stamp = now\.toLocaleTimeString\('en-GB', \{ hour: '2-digit', minute: '2-digit' \}\);\s*document\.querySelectorAll\('\[data-tvl-updated="substantia"\]'\)\.forEach\(el => \{\s*el\.textContent = `Updated \$\{stamp\} · CoinGecko`;\s*\}\);''','''\n                document.querySelectorAll('[data-tvl-updated="substantia"]').forEach(el => {\n                    if (!el.hasAttribute('data-th-market-data-provenance')) el.textContent = 'Canonical Market Data';\n                });''','Substantia browser-now stamp',flags=re.S)
          w(p,s)

          # MONETRA --------------------------------------------------------
          p='monetra/index.html'; s=r(p)
          pairs=[
          ('Monetra is the stablecoin yield engine of TheHolding.ai. Non-directional stable yield from lending markets and stablecoin pools. Capital preservation, reliable cash flow, sustainable returns across all market conditions.','Monetra is the stable-capital yield engine of TheHolding.ai — lending and liquidity strategies built around USD-pegged assets, with live capital, Reference APY and stable-price risk tracking.'),
          ('The stable capital layer of TheHolding.ai. Sustainable yield from stablecoin lending and liquidity strategies. No directional risk. No speculation. Just consistent compounding.','The stable capital layer of TheHolding.ai: lending and liquidity strategies focused on USD-pegged assets, with live yield and stable-price risk tracking.'),
          ('Non-directional stable yield. Lending markets, stablecoin pools, auto-compounding vaults. The liquidity layer of The Holding.','Stable-capital yield across lending markets, liquidity strategies and vaults — measured with live APY, capital and stable-price effects.'),
          ('Monetra generates non-directional yield from stablecoin lending markets, liquidity pools, and auto-compounding vaults. Part of TheHolding.ai five-fund architecture. No directional market risk.','Monetra runs stable-capital lending, liquidity and vault strategies designed to reduce directional market exposure while retaining stablecoin, depeg, liquidity, protocol, oracle and smart-contract risk.'),
          ('Non-directional stablecoin yield fund by TheHolding.ai. Generates sustainable yield from DeFi lending markets and stablecoin liquidity pools without directional market risk.','Stable-capital yield fund by TheHolding.ai. Uses DeFi lending and liquidity strategies designed to reduce directional market exposure while retaining stablecoin, depeg, liquidity, protocol, oracle and smart-contract risk.'),
          ('The stablecoin yield engine of TheHolding.ai. Non-directional stable yield from lending markets and liquidity pools.','The stable-capital yield engine of TheHolding.ai, built around USD-pegged lending and liquidity strategies with explicit risk measurement.'),
          ('Every position is denominated in USD-pegged assets. Every yield','Strategies are centered on USD-pegged assets and stable-denominated cash flow. Every yield'),
          ('is paid in stablecoins. The principal never takes directional risk.\n                    This is a yield engine built for long-term compounding.','is measured as part of the stable-capital mandate. The mandate is designed to reduce directional market exposure, while stablecoin, depeg, liquidity, protocol, oracle and smart-contract risks remain part of the strategy.'),
          ('Monetra ensures that DCA never depends on selling other assets —','Monetra is designed to help fund DCA without relying on selling other assets —'),
          ('stable yield provides a continuous funding stream for the accumulation engine.','stable-capital yield can provide a complementary funding stream for the accumulation engine.'),
          ("helping maintain a strong cash-flow layer across all market conditions.","helping maintain a diversified cash-flow layer across different market regimes."),
          ('they require yield that is stable, predictable, and non-custodial.','they benefit from yield that is stable-denominated, measurable and non-custodial.'),
          ('no direct exposure to market volatility, no unexpected lockups, and no directional market risk.','strategies are designed to limit direct directional exposure and favor liquid, non-custodial markets, while stablecoin, liquidity, protocol and smart-contract risks remain.'),
          ('Just consistent, compounding stable yield — a treasury layer designed for autonomous capital.','A measured stable-capital yield layer — designed for autonomous treasury operations.'),
          ('Predictable Treasury Yield','Stable-Capital Treasury Yield'),
          ('Unlike volatile assets, stablecoin yield is more predictable. Agents can forecast cash flows, plan rebalancing, and operate with greater budget certainty.','Compared with volatile assets, stablecoin strategies are designed for steadier cash-flow planning. Agents can model yields, plan rebalancing, and operate with greater budget visibility while accounting for protocol and stablecoin risk.'),
          ('The strategy is intentionally simple. No leverage. No directional exposure. No speculative bets.','The strategy is intentionally simple: no leverage by design, limited directional exposure, and no speculative trading mandate.'),
          ('a permanent cash-flow layer that operates independently of market direction.','a durable cash-flow layer designed to operate with limited dependence on market direction.')]
          changed=0
          for old,new in pairs:
              n=s.count(old)
              if n: s=s.replace(old,new); changed+=n
          print('Monetra bounded-copy replacements',changed)
          if changed<15: raise SystemExit(f'Monetra copy replacement count too low: {changed}')
          s=sub(s,r'<div class="hero-stat-value">Seeding</div>\s*<div class="hero-stat-label">Stage — Launching Soon</div>', '<div class="hero-stat-value" data-th-fund="monetra" data-th-fund-metric="tvl" data-th-digits="2">—</div>\n                    <div class="hero-stat-label">Current Capital</div>','Monetra hero capital')
          s=sub(s,r'<div class="hero-stat-value">Stable</div>\s*<div class="hero-stat-label">Principal exposure</div>', '<div class="hero-stat-value" data-th-fund="monetra" data-th-fund-metric="reference-apr" data-th-digits="2">—</div>\n                    <div class="hero-stat-label">Reference APY</div>','Monetra hero APY')
          s=sub(s,r'<div class="hero-stat-value">24/7</div>\s*<div class="hero-stat-label">Yield generation</div>', '<div class="hero-stat-value">Live</div>\n                    <div class="hero-stat-label">Stable Strategy Tracking</div>','Monetra hero live')
          w(p,s)

          # SHARED CLIENT --------------------------------------------------
          p='intelligence/market-data/public-capital-client.js'; s=r(p)
          s=simple(s,'Public Capital Client v0.3.0','Public Capital Client v0.3.1','client comment version')
          s=simple(s,"const VERSION = '0.3.0';","const VERSION = '0.3.1';",'client runtime version')
          marker='  function applyHomepageNetwork(root, data) {'
          if 'function applySubstantiaMarketDataProvenance' not in s:
              fn='''  function applySubstantiaMarketDataProvenance(root, data) {\n    const scope = root || document;\n    if (!scope.querySelectorAll) return 0;\n    const source = data && data.sourceState ? data.sourceState : {};\n    const observedAt = source.marketDataObservedAt || source.marketDataGeneratedAt || null;\n    const observed = observedAt ? new Date(observedAt) : null;\n    const valid = observed && !Number.isNaN(observed.getTime());\n    const stamp = valid ? observed.toLocaleTimeString('en-GB', { timeZone: 'UTC', hour: '2-digit', minute: '2-digit' }) + ' UTC' : null;\n    const text = stamp ? 'Observed ' + stamp + ' · Market Data' : 'Canonical Market Data';\n    let updated = 0;\n    scope.querySelectorAll('[data-tvl-updated="substantia"]').forEach(function (el) {\n      if (el.textContent !== text) { el.textContent = text; updated += 1; }\n      el.setAttribute('data-th-market-data-provenance', 'canonical');\n      el.title = 'Canonical Market Data observation; asset-level provenance is preserved upstream';\n    });\n    return updated;\n  }\n\n'''
              if marker not in s: raise SystemExit('client insertion marker missing')
              s=s.replace(marker,fn+marker,1)
          if 'updated += applySubstantiaMarketDataProvenance(root, data);' not in s:
              s=simple(s,'    updated += applyDefiteaCurrentTvl(root, data);\n    updated += applyHomepageNetwork(root, data);','    updated += applyDefiteaCurrentTvl(root, data);\n    updated += applySubstantiaMarketDataProvenance(root, data);\n    updated += applyHomepageNetwork(root, data);','client provenance call')
          w(p,s)

          # Clean temporary branch-only execution files from final tree.
          for f in ['.github/workflows/temp-medium-public-truth-patch.yml','.github/workflows/temp-medium-public-truth-patch-v2.yml','.github/workflows/temp-medium-pr-kick.yml','.github/temp-medium-trigger.txt','.github/temp-medium-second-trigger.txt','.github/temp-medium-manual-trigger.txt','.github/temp-medium-v2-trigger.txt']:
              q=Path(f)
              if q.exists(): q.unlink()
          PY
      - name: Verify and publish clean patch
        shell: bash
        run: |
          git config user.name "The Holding Medium Cleanup"
          git config user.email "medium-cleanup@theholding.ai"
          git add -A
          git diff --cached --check
          git diff --cached --stat
          git commit -m "UI: align medium public truth surfaces"
          git push origin HEAD:fix/medium-public-surface-truth-20260821
