name: "Discover Company #006"

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: discover-company-006
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Install ethers
        run: npm install --no-save --no-package-lock ethers@6

      - name: "Discover Company #006"
        env:
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
          BASE_RPC_URL: ${{ secrets.BASE_RPC_URL }}
          BASE_RPC_URL_2: ${{ secrets.BASE_RPC_URL_2 }}
          ETH_RPC_URL: ${{ secrets.ETH_RPC_URL }}
          OPTIMISM_RPC_URL: ${{ secrets.OPTIMISM_RPC_URL }}
        run: node onboarding/company-006-discovery.mjs

      - name: Commit discovery snapshot safely
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "The Holding Intelligence"
          git config user.email "actions@users.noreply.github.com"

          git add companies/company-006-discovery.json
          if git diff --cached --quiet; then
            echo "No discovery changes to commit."
            exit 0
          fi

          git commit -m "data: discover company 006"

          for attempt in 1 2 3 4; do
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "Real rebase conflict; refusing to overwrite main."
              exit 1
            fi
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Main moved during push; retrying ($attempt/4)..."
            sleep $((attempt * 2))
          done

          echo "Unable to push discovery snapshot after retries."
          exit 1
