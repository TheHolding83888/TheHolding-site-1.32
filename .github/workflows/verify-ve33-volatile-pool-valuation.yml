name: Verify ve33 Volatile Historical Pool Valuation

on:
  pull_request:
    paths:
      - 'reporting/canonical-earned-income-view.mjs'
      - 'reporting/ve33-historical-valuation-identity.mjs'
      - 'reporting/historical-canonical-price.mjs'
      - 'reporting/ve33-volatile-pool-valuation-validation.mjs'
      - '.github/workflows/verify-ve33-volatile-pool-valuation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: Deterministic volatile-pool accounting regression
        run: |
          set -euo pipefail
          node --check reporting/canonical-earned-income-view.mjs
          node --check reporting/ve33-historical-valuation-identity.mjs
          node --check reporting/ve33-volatile-pool-valuation-validation.mjs
          node reporting/ve33-volatile-pool-valuation-validation.mjs
          git diff --check
