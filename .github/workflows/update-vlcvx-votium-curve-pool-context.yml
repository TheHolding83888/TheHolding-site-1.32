name: "The Holding · Votium → Curve Pool Context"

on:
  workflow_dispatch:
  schedule:
    - cron: "23 */6 * * *"
  push:
    branches: [main]
    paths:
      - "intelligence/economic-graph/vlcvx-votium-curve-gauge-flow.json"
      - "intelligence/economic-graph/vlcvx-votium-curve-pool-context.mjs"
      - "scripts/verify-vlcvx-votium-curve-pool-context.mjs"
      - ".github/workflows/update-vlcvx-votium-curve-pool-context.yml"
  pull_request:
    paths:
      - "intelligence/economic-graph/vlcvx-votium-curve-pool-context.mjs"
      - "scripts/verify-vlcvx-votium-curve-pool-context.mjs"

permissions:
  contents: write

concurrency:
  group: the-holding-vlcvx-votium-curve-pool-context
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout reviewed canonical state
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || 'main' }}

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Static validation
        run: |
          set -euo pipefail
          node --check intelligence/economic-graph/vlcvx-votium-curve-pool-context.mjs
          node --check scripts/verify-vlcvx-votium-curve-pool-context.mjs
          test -s intelligence/economic-graph/vlcvx-votium-curve-gauge-flow.json
          git diff --check

      - name: Build official Curve pool economic context
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            TMP="$(mktemp)"
            VLCVX_VOTIUM_CURVE_POOL_CONTEXT_FILE="$TMP" node intelligence/economic-graph/vlcvx-votium-curve-pool-context.mjs
            cp "$TMP" /tmp/vlcvx-votium-curve-pool-context.json
            rm -f "$TMP"
          else
            node intelligence/economic-graph/vlcvx-votium-curve-pool-context.mjs
            cp intelligence/economic-graph/vlcvx-votium-curve-pool-context.json /tmp/vlcvx-votium-curve-pool-context.json
          fi

      - name: Verify downstream Curve pool semantics
        run: |
          set -euo pipefail
          VLCVX_VOTIUM_CURVE_POOL_CONTEXT_FILE=/tmp/vlcvx-votium-curve-pool-context.json node scripts/verify-vlcvx-votium-curve-pool-context.mjs
          git diff --check

      - name: Publish generated pool context atomically
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          GENERATED="intelligence/economic-graph/vlcvx-votium-curve-pool-context.json"
          UPSTREAM="intelligence/economic-graph/vlcvx-votium-curve-gauge-flow.json"
          test -s "$GENERATED"

          artifact_upstream_hash="$(node - "$GENERATED" <<'NODE'
          const fs=require('fs');
          const x=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          process.stdout.write(String(x.sourceBinding?.gaugeFlowSha256||''));
          NODE
          )"
          gh api --method GET -H "Accept: application/vnd.github.raw+json" "repos/${GITHUB_REPOSITORY}/contents/${UPSTREAM}" -f ref=main > /tmp/remote-votium-curve-gauge-flow.json
          remote_upstream_hash="$(sha256sum /tmp/remote-votium-curve-gauge-flow.json | cut -d' ' -f1)"
          if [ "$artifact_upstream_hash" != "$remote_upstream_hash" ]; then
            echo "ERROR: Votium→Curve gauge-flow changed after pool-context measurement; refusing stale publish."
            exit 1
          fi

          remote_sha="$(gh api "repos/${GITHUB_REPOSITORY}/contents/${GENERATED}?ref=main" --jq '.sha' 2>/dev/null || true)"
          payload="$(mktemp)"
          node - "$GENERATED" "$remote_sha" > "$payload" <<'NODE'
          const fs=require('fs');
          const file=process.argv[2];
          const sha=process.argv[3];
          const payload={message:'intelligence: refresh vlcvx votium curve pool context',content:fs.readFileSync(file).toString('base64'),branch:'main'};
          if(sha)payload.sha=sha;
          process.stdout.write(JSON.stringify(payload));
          NODE
          gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/${GENERATED}" --input "$payload" >/tmp/votium-curve-pool-context-publish.json
          cat /tmp/votium-curve-pool-context-publish.json | jq -r '.commit.sha'

      - name: Prove physical state on main
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 12); do
            if gh api --method GET -H "Accept: application/vnd.github.raw+json" "repos/${GITHUB_REPOSITORY}/contents/intelligence/economic-graph/vlcvx-votium-curve-pool-context.json" -f ref=main > /tmp/physical-votium-curve-pool-context.json 2>/dev/null; then
              if VLCVX_VOTIUM_CURVE_POOL_CONTEXT_FILE=/tmp/physical-votium-curve-pool-context.json node scripts/verify-vlcvx-votium-curve-pool-context.mjs; then
                echo "Votium → Curve pool context physical main proof PASS"
                exit 0
              fi
            fi
            sleep 3
          done
          echo "ERROR: Votium → Curve pool context physical main state did not materialize"
          exit 1
