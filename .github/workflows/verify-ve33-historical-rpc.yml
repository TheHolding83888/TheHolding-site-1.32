name: Verify ve33 Historical RPC Capability

on:
  pull_request:
    paths:
      - 'reporting/ve33-accounting-evidence.mjs'
      - 'reporting/ve33-accounting-runner.mjs'
      - 'reporting/ve33-accounting-runner-validation.mjs'
      - '.github/workflows/update-reporting.yml'
      - '.github/workflows/verify-ve33-historical-rpc.yml'

permissions:
  contents: read

jobs:
  verify-ve33-historical-rpc:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: Install runtime dependency
        run: npm install --no-save --no-package-lock ethers@6

      - name: Deterministic runner validation
        run: |
          set -euo pipefail
          node --check reporting/ve33-accounting-runner.mjs
          node --check reporting/ve33-accounting-runner-validation.mjs
          node reporting/ve33-accounting-runner-validation.mjs

      - name: Focused LAPTOP historical recovery canary
        env:
          BASE_RPC_URL: ${{ secrets.BASE_RPC_URL }}
        run: |
          set -euo pipefail
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          import { JsonRpcProvider } from 'ethers';
          import {
            seedTransientPredeploymentZeroBaselines,
            seedRecoveredClaimBlockIntervals
          } from './reporting/ve33-accounting-runner.mjs';

          const company='0x5860...83CA8.eth';
          const laptopToken='0xb095274743941e953c746f9c228da9c18bb6ec29';
          const laptopTx='0xaad260eb97a2414e45dc5f105e8966932ca8795eb267aacd9ce85b929cd37153';
          const expectedAmountRaw='67615020175015840449';
          const expectedAmount=67.61502017501584;
          const full=JSON.parse(fs.readFileSync('reporting/ve33-transient-claim-recovery.json','utf8'));
          const aerodrome=full?.protocols?.aerodrome;
          if(!aerodrome)throw new Error('Aerodrome recovery proof missing');
          const claim=(aerodrome.claims||[]).find(row=>
            String(row?.transactionHash||'').toLowerCase()===laptopTx&&
            String(row?.rewardToken||'').toLowerCase()===laptopToken&&
            row?.company===company
          );
          if(!claim)throw new Error('Exact LAPTOP recovery claim missing');
          const recovery={
            ...full,
            protocols:{
              aerodrome:{...aerodrome,claims:[claim]}
            }
          };
          const urls=[process.env.BASE_RPC_URL,'https://mainnet.base.org','https://base-rpc.publicnode.com'].filter(Boolean);
          const unique=[...new Set(urls)];
          const failures=[];
          let proof=null;

          for(const url of unique){
            const provider=new JsonRpcProvider(url,8453,{staticNetwork:true});
            const label=(()=>{try{return new URL(url).hostname}catch{return 'configured-base-rpc'}})();
            try{
              const baseline=await seedTransientPredeploymentZeroBaselines({
                previous:{checkpoints:[],events:[]},
                recovery,
                providers:{aerodrome:provider}
              });
              const zero=(baseline.previous?.checkpoints||[]).find(row=>
                row?.company===company&&
                String(row?.rewardToken||'').toLowerCase()===laptopToken&&
                row?.predeploymentZeroProof?.proof==='eth_getCode-empty-at-exact-historical-boundary'
              );
              if(!zero)throw new Error(`zero baseline unavailable: ${JSON.stringify(baseline.diagnostics)}`);
              if(zero.entitlementRaw!=='0'||Number(zero.entitlementAmount)!==0||zero.predeploymentZeroProof?.createsIncome!==false)throw new Error('zero baseline semantics drift');

              const recovered=await seedRecoveredClaimBlockIntervals({
                previous:baseline.previous,
                recovery,
                providers:{aerodrome:provider}
              });
              const event=(recovered.previous?.events||[]).find(row=>
                row?.company===company&&
                String(row?.token||'').toLowerCase()===laptopToken&&
                (row?.settlementProofs||[]).some(p=>String(p?.transactionHash||'').toLowerCase()===laptopTx)
              );
              if(!event)throw new Error(`canonical LAPTOP earned event unavailable: ${JSON.stringify(recovered.diagnostics)}`);
              if(event.amountRaw!==expectedAmountRaw||Math.abs(Number(event.amount)-expectedAmount)>1e-9)throw new Error(`LAPTOP factual amount drift: ${event.amountRaw}/${event.amount}`);
              if(event.openingEntitlementRaw!=='0'||event.closingEntitlementRaw!=='0'||event.settlementRaw!==expectedAmountRaw)throw new Error('LAPTOP reconciliation identity drift');
              if(event.usdValue!==null||event.valuationStatus!=='unvalued-fail-closed')throw new Error('LAPTOP historical USD must remain UNKNOWN');
              if(event.claimIsSecondIncomeEvent!==false||event.laterClaimOrPriceMoveDoesNotRewriteIncome!==true||event.executionAuthority!=='none')throw new Error('LAPTOP lifecycle semantics drift');
              if(Number(recovered.diagnostics?.acceptedEventCount)!==1||Number(recovered.diagnostics?.unresolvedStateReadCount)!==0)throw new Error(`focused recovery diagnostics drift: ${JSON.stringify(recovered.diagnostics)}`);
              proof={
                provider:label,
                zeroBoundaryAt:zero.observedAt,
                zeroBoundaryBlock:zero.blockNumber,
                claimBlock:event.settlementProofs[0].blockNumber,
                laptopAmount:event.amount,
                laptopUsd:event.usdValue,
                executionAuthority:event.executionAuthority
              };
              break;
            }catch(error){
              failures.push({provider:label,error:error?.shortMessage||error?.message||String(error)});
            }finally{
              try{provider.destroy()}catch{}
            }
          }

          if(!proof)throw new Error(`No Base RPC candidate could prove focused LAPTOP historical recovery: ${JSON.stringify(failures)}`);
          console.log('focused LAPTOP historical recovery PASS',proof);
          NODE
