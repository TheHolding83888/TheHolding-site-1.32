name: Temp Stage PR830 Canonical Settlement Buckets
on:
  push:
    branches:
      - work/pr830-canonical-settlement-buckets-20260915
permissions:
  contents: write
jobs:
  stage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Preserve transform and switch to target PR branch
        run: |
          cp tools/tmp-pr830-canonical-settlement-buckets.py /tmp/pr830-transform.py
          git fetch origin fix/ve33-rpc-runtime-fresh-20260915
          git checkout -B fix/ve33-rpc-runtime-fresh-20260915 origin/fix/ve33-rpc-runtime-fresh-20260915
      - name: Apply canonical settlement buckets
        run: python /tmp/pr830-transform.py
      - name: Verify bounded deterministic change
        run: |
          npm install --no-save --no-package-lock ethers@6
          node --check reporting/ve33-accounting-evidence.mjs
          node reporting/ve33-accounting-evidence-validation.mjs
          git diff --check
          test "$(git diff --name-only | wc -l)" -eq 1
          test "$(git diff --name-only)" = "reporting/ve33-accounting-evidence.mjs"
      - name: Commit to PR branch
        run: |
          git config user.name 'TheHolding83888'
          git config user.email '270993406+TheHolding83888@users.noreply.github.com'
          git add reporting/ve33-accounting-evidence.mjs
          git commit -m 'reliability: share ve33 settlement scans through canonical buckets'
          git push origin HEAD:fix/ve33-rpc-runtime-fresh-20260915
