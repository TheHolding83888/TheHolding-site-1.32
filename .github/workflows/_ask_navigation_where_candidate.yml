name: Ask candidate · Navigation Where Class

on:
  push:
    branches:
      - agents/ask-quick-command-contract-v1.0.1-20260815
    paths:
      - .github/workflows/_ask_navigation_where_candidate.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: agents/ask-quick-command-contract-v1.0.1-20260815
          fetch-depth: 0
      - name: Apply bounded class repair
        shell: bash
        run: |
          set -euo pipefail
          node verification/ask-experience/patch-navigation-where-class-v1.0.1.mjs
          node --check agents/console/app.js
          node verification/ask-experience/quick-command-contract-v0.1.mjs
          git diff --check
      - name: Commit candidate
        shell: bash
        run: |
          set -euo pipefail
          rm verification/ask-experience/patch-navigation-where-class-v1.0.1.mjs
          git config user.name 'The Holding Production Integrator'
          git config user.email 'production-integrator@theholding.ai'
          git add agents/console/app.js
          git add -u verification/ask-experience/patch-navigation-where-class-v1.0.1.mjs
          git commit -m 'Ask v1.0.1: generalize navigation where typo class'
          git push origin HEAD:agents/ask-quick-command-contract-v1.0.1-20260815
