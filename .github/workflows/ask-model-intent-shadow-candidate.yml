name: Ask The Holding · Model Intent Shadow Candidate

on:
  push:
    branches:
      - agents/ask-model-intent-shadow-v1.3-20260815
    paths:
      - agents/console/intent-contract.js
      - verification/ask-experience/corpus-model-intent-shadow-v0.1.json
      - verification/ask-experience/model-intent-shadow-v0.1.mjs
      - verification/ask-experience/model-intent-shadow-policy-v0.1.md
      - .github/workflows/ask-model-intent-shadow-candidate.yml
  workflow_dispatch:
    inputs:
      limit:
        description: Number of shadow cases; 0 means full corpus
        required: false
        default: '1'
        type: string
      model:
        description: Optional Copilot model; auto uses Copilot default routing
        required: false
        default: auto
        type: string

permissions:
  contents: read
  copilot-requests: write

jobs:
  shadow:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact shadow revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Re-prove production Intent Contract
        run: node verification/ask-experience/intent-contract-test-v0.1.mjs

      - name: Install current Copilot CLI
        run: npm install -g @github/copilot

      - name: Run no-tools untrusted intent shadow
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ASK_SHADOW_TRANSPORT: copilot-cli
          ASK_SHADOW_MODEL: ${{ inputs.model || 'auto' }}
          ASK_SHADOW_LIMIT: ${{ inputs.limit || '1' }}
        shell: bash
        run: |
          set -euo pipefail
          node verification/ask-experience/model-intent-shadow-v0.1.mjs \
            verification/ask-experience/corpus-model-intent-shadow-v0.1.json \
            artifacts/ask-model-intent-shadow.json

      - name: Verify shadow has no answer authority
        if: success()
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('fs');
          const x = JSON.parse(fs.readFileSync('artifacts/ask-model-intent-shadow.json','utf8'));
          if (x.summary.executionAuthority !== 'none') throw new Error('shadow gained execution authority');
          if (x.summary.answerAuthority !== 'deterministic-ask-only') throw new Error('shadow gained answer authority');
          if (x.summary.forbiddenFieldLeakCount !== 0) throw new Error('model emitted forbidden control fields');
          console.log('Shadow authority boundary PASS');
          NODE
