name: Ask The Holding · Model Intent Shadow Candidate

on:
  push:
    branches:
      - agents/ask-model-intent-shadow-v1.3-20260815
    paths:
      - agents/console/intent-contract.js
      - verification/ask-experience/corpus-model-intent-shadow-v0.1.json
      - verification/ask-experience/model-intent-shadow-v0.1.mjs
      - verification/ask-experience/model-intent-shadow-policy-v0.1.md
      - .github/workflows/ask-model-intent-shadow-candidate.yml
  workflow_dispatch:

permissions:
  contents: read
  copilot-requests: write

jobs:
  shadow:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact shadow revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Re-prove production Intent Contract
        run: node verification/ask-experience/intent-contract-test-v0.1.mjs

      - name: Install current Copilot CLI
        run: npm install -g @github/copilot

      - name: Probe no-tools structured intent transport
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          PROMPT='You are an untrusted intent parser. Do not answer the user. Return exactly this JSON shape with no prose: {"version":"0.1-intent-contract-firewall","intent":"owner-brief","entities":[],"timeframe":"current","comparison":"none","requestedMetric":"none"}. User request: Give me the owner brief for the whole Holding right now.'
          copilot -p "$PROMPT" -s --no-ask-user --no-custom-instructions --available-tools='' > /tmp/copilot-shadow-probe.txt
          node - <<'NODE'
          const fs = require('fs');
          const raw = fs.readFileSync('/tmp/copilot-shadow-probe.txt','utf8').trim();
          const first = raw.indexOf('{'); const last = raw.lastIndexOf('}');
          if (first < 0 || last <= first) throw new Error('Copilot probe did not return JSON');
          const x = JSON.parse(raw.slice(first,last+1));
          const forbidden=['answer','text','source','sources','sourceArtifacts','confidence','confidenceClass','grounded','execution','execute','action','transaction','tx','signature','sign','wallet','privateKey','seedPhrase','methodology','policy','authority','permissions'];
          if(forbidden.some(k=>Object.prototype.hasOwnProperty.call(x,k))) throw new Error('Copilot probe emitted forbidden field');
          if(x.intent!=='owner-brief') throw new Error('Copilot probe intent mismatch');
          console.log('COPILOT_SHADOW_PROBE=PASS');
          console.log('COPILOT_SHADOW_CANDIDATE='+JSON.stringify(x));
          NODE
