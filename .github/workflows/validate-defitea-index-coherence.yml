name: "Validate Package 2 · Defitea Index Coherence"

on:
  pull_request:
    paths:
      - '.github/workflows/validate-defitea-index-coherence.yml'
      - 'intelligence/capital-state/defitea-index-coherence-acceptance.mjs'
      - 'intelligence/market-data/public-capital-state.json'
      - 'intelligence/market-data/public-capital-engine.mjs'
      - 'intelligence/capital-state/capital-state.json'
      - 'intelligence/capital-state/capital-state.mjs'
      - 'companies/company-capital-state-contract.mjs'
      - 'companies/defitea-canonical-state.json'
      - 'companies/defitea-public-capital-projection.mjs'
      - 'companies/index.html'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Rebuild Defitea capital surfaces from PR head
        run: |
          set -euo pipefail
          node --check companies/company-capital-state-contract.mjs
          node --check companies/defitea-public-capital-projection.mjs
          node companies/defitea-public-capital-projection.mjs
          node --check intelligence/capital-state/capital-state.mjs
          node --check intelligence/market-data/public-capital-engine.mjs
          node intelligence/capital-state/capital-state.mjs
          node intelligence/market-data/public-capital-engine.mjs

      - name: Prove Defitea fund/company/index/performance coherence
        run: |
          set -euo pipefail
          node --check intelligence/capital-state/defitea-index-coherence-acceptance.mjs
          node intelligence/capital-state/defitea-index-coherence-acceptance.mjs
          git diff --check
