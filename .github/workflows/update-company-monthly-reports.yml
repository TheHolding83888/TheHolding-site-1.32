# holding-workflow-definition-proof: intelligence/reliability/company-monthly-reports-workflow-definition-proof.mjs
name: Update Company Monthly Reports

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - "Update The Holding Reporting Data"
    types: [completed]
  push:
    branches: [main]
    paths:
      - 'companies/productivity-data.json'
      - 'reporting/company-income-scope.mjs'
      - 'reporting/company-monthly-reports.mjs'
      - 'reporting/company-monthly-reports-validation.mjs'
      - 'reporting/canonical-earned-income-view.mjs'
      - 'reporting/company-monthly-earned-income.mjs'
      - 'reporting/company-monthly-earned-income-validation.mjs'
      - 'reporting/accounting-coverage.mjs'
      - 'reporting/accounting-coverage-validation.mjs'
      - 'reporting/accounting-coverage.json'
      - 'reporting/accounting-notice-queue.mjs'
      - 'reporting/accounting-notice-queue-validation.mjs'
      - 'reporting/accounting-reference-reconciliation.mjs'
      - 'reporting/accounting-reference-reconciliation-validation.mjs'
      - 'reporting/icp-nns-factual-snapshots.json'
      - 'reporting/income-ledger.json'
      - 'reporting/reporting-data.json'
      - 'companies/company-monthly-report-adapter.js'
      - 'companies/company-passport-priority-adapter.js'
      - '.github/workflows/update-company-monthly-reports.yml'
      - '.github/workflows/verify-company-monthly-reports.yml'
  schedule:
    # Fallback heartbeat. Primary freshness comes from canonical Reporting completion.
    # Mechanism evidence may arrive at protocol-specific cadence; this daily heartbeat
    # only republishes canonical monthly/diagnostic projections and never creates income.
    - cron: '37 7 * * *'

permissions:
  contents: write

concurrency:
  group: company-monthly-reports-daily
  cancel-in-progress: false

jobs:
  update:
    if: >-
      ${{
        github.event_name != 'workflow_run' ||
        (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: Preflight monthly reporting contract
        shell: bash
        run: |
          set -euo pipefail
          node --check reporting/company-income-scope.mjs
          node --check reporting/company-monthly-reports.mjs
          node --check reporting/company-monthly-reports-validation.mjs
          node --check reporting/canonical-earned-income-view.mjs
          node --check reporting/company-monthly-earned-income.mjs
          node --check reporting/company-monthly-earned-income-validation.mjs
          node --check reporting/accounting-coverage.mjs
          node --check reporting/accounting-coverage-validation.mjs
          node --check reporting/accounting-notice-queue.mjs
          node --check reporting/accounting-notice-queue-validation.mjs
          node --check reporting/accounting-reference-reconciliation.mjs
          node --check reporting/accounting-reference-reconciliation-validation.mjs
          node --check companies/company-monthly-report-adapter.js
          node --check companies/company-passport-priority-adapter.js
          test -s companies/productivity-data.json
          test -s reporting/reporting-data.json
          test -s reporting/income-ledger.json
          test -s reporting/accounting-coverage.json
          test -s reporting/icp-nns-factual-snapshots.json
          test -d intelligence/memory-vault
          node - <<'NODE'
          const fs=require('fs');
          const x=JSON.parse(fs.readFileSync('reporting/income-ledger.json','utf8'));
          if(x.version!=='0.1-canonical-income-ledger'||x.semantics?.unknownIsNotZero!==true||x.semantics?.referenceAprCanBackfillEarnedIncome!==false) throw new Error('Canonical Income Ledger monthly dependency invalid');
          if(x.authority?.executionAuthority!=='none'||x.authority?.capitalExecution!==false) throw new Error('Canonical Income Ledger authority drift');
          console.log('Company Monthly Reports canonical income dependency PASS');
          NODE

      - name: Build reference monthly scaffold
        env:
          PRODUCTIVITY_DATA_FILE: ./companies/productivity-data.json
          REPORTING_DATA_FILE: ./reporting/reporting-data.json
          INCOME_LEDGER_FILE: ./reporting/income-ledger.json
          MEMORY_VAULT_DIR: ./intelligence/memory-vault
          COMPANY_MONTHLY_REPORTS_FILE: ./reporting/company-monthly-reports.json
        run: node reporting/company-monthly-reports.mjs

      - name: Validate reference scaffold
        env:
          COMPANY_MONTHLY_REPORTS_FILE: ./reporting/company-monthly-reports.json
        run: node reporting/company-monthly-reports-validation.mjs

      - name: Project canonical earned income into monthly accounting
        env:
          COMPANY_MONTHLY_REPORTS_FILE: ./reporting/company-monthly-reports.json
          INCOME_LEDGER_FILE: ./reporting/income-ledger.json
          REPORTING_DATA_FILE: ./reporting/reporting-data.json
        run: node reporting/company-monthly-earned-income.mjs

      - name: Validate earned-income accounting
        env:
          COMPANY_MONTHLY_REPORTS_FILE: ./reporting/company-monthly-reports.json
          INCOME_LEDGER_FILE: ./reporting/income-ledger.json
        run: node reporting/company-monthly-earned-income-validation.mjs

      - name: Build + validate accounting diagnostics
        env:
          PRODUCTIVITY_DATA_FILE: ./companies/productivity-data.json
          INCOME_LEDGER_FILE: ./reporting/income-ledger.json
          ACCOUNTING_COVERAGE_FILE: ./reporting/accounting-coverage.json
          COMPANY_MONTHLY_REPORTS_FILE: ./reporting/company-monthly-reports.json
          ICP_NNS_FACTUAL_SNAPSHOTS_FILE: ./reporting/icp-nns-factual-snapshots.json
          ACCOUNTING_NOTICE_QUEUE_FILE: ./reporting/accounting-notice-queue.json
          REPORTING_DATA_FILE: ./reporting/reporting-data.json
          ACCOUNTING_REFERENCE_RECONCILIATION_FILE: ./reporting/accounting-reference-reconciliation.json
        run: |
          # Diagnostics are one dependency chain. Coverage must be rebuilt from
          # the current code + canonical ledger before Notice/Reconciliation are
          # projected; a stale persisted registry may never drive a new schema.
          node reporting/accounting-coverage.mjs
          node reporting/accounting-coverage-validation.mjs
          node reporting/accounting-notice-queue.mjs
          node reporting/accounting-notice-queue-validation.mjs
          node reporting/accounting-reference-reconciliation.mjs
          node reporting/accounting-reference-reconciliation-validation.mjs

      - name: Commit monthly reporting snapshot
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "The Holding Data Engine"
          git config user.email "data-engine@theholding.ai"

          critical_fingerprint() {
            sha256sum \
              reporting/company-income-scope.mjs \
              reporting/company-monthly-reports.mjs \
              reporting/company-monthly-reports-validation.mjs \
              reporting/canonical-earned-income-view.mjs \
              reporting/company-monthly-earned-income.mjs \
              reporting/company-monthly-earned-income-validation.mjs \
              reporting/accounting-coverage.mjs \
              reporting/accounting-coverage-validation.mjs \
              reporting/accounting-notice-queue.mjs \
              reporting/accounting-notice-queue-validation.mjs \
              reporting/accounting-reference-reconciliation.mjs \
              reporting/accounting-reference-reconciliation-validation.mjs \
              companies/company-passport-priority-adapter.js \
              .github/workflows/update-company-monthly-reports.yml
          }
          critical_before="$(critical_fingerprint)"

          git add reporting/company-monthly-reports.json reporting/accounting-coverage.json reporting/accounting-notice-queue.json reporting/accounting-reference-reconciliation.json
          if git diff --cached --quiet; then
            echo "No company monthly reporting or accounting diagnostic changes."
            exit 0
          fi
          git commit -m "data: update company monthly earned-income reports"

          for attempt in 1 2 3; do
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "Safe writer guard: rebase conflict; refusing to guess."
              exit 1
            fi

            critical_after="$(critical_fingerprint)"
            if [ "$critical_after" != "$critical_before" ]; then
              echo "Critical Company Monthly Reports code changed during publish rebase; fail closed and require a fresh canonical run."
              exit 1
            fi

            PRODUCTIVITY_DATA_FILE=./companies/productivity-data.json \
            REPORTING_DATA_FILE=./reporting/reporting-data.json \
            INCOME_LEDGER_FILE=./reporting/income-ledger.json \
            MEMORY_VAULT_DIR=./intelligence/memory-vault \
            COMPANY_MONTHLY_REPORTS_FILE=./reporting/company-monthly-reports.json \
            node reporting/company-monthly-reports.mjs
            COMPANY_MONTHLY_REPORTS_FILE=./reporting/company-monthly-reports.json \
            node reporting/company-monthly-reports-validation.mjs
            COMPANY_MONTHLY_REPORTS_FILE=./reporting/company-monthly-reports.json \
            INCOME_LEDGER_FILE=./reporting/income-ledger.json \
            REPORTING_DATA_FILE=./reporting/reporting-data.json \
            node reporting/company-monthly-earned-income.mjs
            COMPANY_MONTHLY_REPORTS_FILE=./reporting/company-monthly-reports.json \
            INCOME_LEDGER_FILE=./reporting/income-ledger.json \
            node reporting/company-monthly-earned-income-validation.mjs
            PRODUCTIVITY_DATA_FILE=./companies/productivity-data.json \
            INCOME_LEDGER_FILE=./reporting/income-ledger.json \
            ACCOUNTING_COVERAGE_FILE=./reporting/accounting-coverage.json \
            node reporting/accounting-coverage.mjs
            ACCOUNTING_COVERAGE_FILE=./reporting/accounting-coverage.json \
            node reporting/accounting-coverage-validation.mjs
            ACCOUNTING_COVERAGE_FILE=./reporting/accounting-coverage.json \
            COMPANY_MONTHLY_REPORTS_FILE=./reporting/company-monthly-reports.json \
            ICP_NNS_FACTUAL_SNAPSHOTS_FILE=./reporting/icp-nns-factual-snapshots.json \
            ACCOUNTING_NOTICE_QUEUE_FILE=./reporting/accounting-notice-queue.json \
            node reporting/accounting-notice-queue.mjs
            ACCOUNTING_NOTICE_QUEUE_FILE=./reporting/accounting-notice-queue.json \
            ICP_NNS_FACTUAL_SNAPSHOTS_FILE=./reporting/icp-nns-factual-snapshots.json \
            node reporting/accounting-notice-queue-validation.mjs
            COMPANY_MONTHLY_REPORTS_FILE=./reporting/company-monthly-reports.json \
            ACCOUNTING_COVERAGE_FILE=./reporting/accounting-coverage.json \
            REPORTING_DATA_FILE=./reporting/reporting-data.json \
            ACCOUNTING_NOTICE_QUEUE_FILE=./reporting/accounting-notice-queue.json \
            ACCOUNTING_REFERENCE_RECONCILIATION_FILE=./reporting/accounting-reference-reconciliation.json \
            node reporting/accounting-reference-reconciliation.mjs
            ACCOUNTING_REFERENCE_RECONCILIATION_FILE=./reporting/accounting-reference-reconciliation.json \
            node reporting/accounting-reference-reconciliation-validation.mjs

            git add reporting/company-monthly-reports.json reporting/accounting-coverage.json reporting/accounting-notice-queue.json reporting/accounting-reference-reconciliation.json
            git commit --amend --no-edit

            mapfile -t ahead < <(git diff --name-only origin/main...HEAD)
            for f in "${ahead[@]}"; do
              case "$f" in
                reporting/company-monthly-reports.json|reporting/accounting-coverage.json|reporting/accounting-notice-queue.json|reporting/accounting-reference-reconciliation.json) ;;
                *) echo "Unexpected Company Monthly Reports publish delta after rebase: $f"; exit 1 ;;
              esac
            done

            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Safe writer guard: main moved during push; rebuilding on the next rebased canonical state ($attempt/3)..."
            sleep $((attempt * 2))
          done
          echo "Safe writer guard: push failed after 3 attempts."
          exit 1
