name: Update Company Monthly Reports

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - "Update The Holding Reporting Data"
    types: [completed]
  push:
    branches: [main]
    paths:
      - 'companies/productivity-data.json'
      - 'reporting/company-monthly-reports.mjs'
      - 'reporting/company-monthly-reports-validation.mjs'
      - 'companies/company-monthly-report-adapter.js'
      - '.github/workflows/update-company-monthly-reports.yml'
      - '.github/workflows/verify-company-monthly-reports.yml'
  schedule:
    # Fallback heartbeat. Primary freshness comes from canonical Reporting completion
    # and current Productivity materialization, so a delayed GitHub cron cannot
    # silently leave company passports stale.
    - cron: '37 7 * * *'

permissions:
  contents: write

concurrency:
  group: company-monthly-reports-daily
  cancel-in-progress: false

jobs:
  update:
    if: >-
      ${{
        github.event_name != 'workflow_run' ||
        (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: Preflight monthly reporting contract
        shell: bash
        run: |
          set -euo pipefail
          node --check reporting/company-monthly-reports.mjs
          node --check reporting/company-monthly-reports-validation.mjs
          node --check companies/company-monthly-report-adapter.js
          test -s companies/productivity-data.json
          test -s reporting/reporting-data.json
          test -d intelligence/memory-vault

      - name: Build company monthly reports
        env:
          PRODUCTIVITY_DATA_FILE: ./companies/productivity-data.json
          REPORTING_DATA_FILE: ./reporting/reporting-data.json
          MEMORY_VAULT_DIR: ./intelligence/memory-vault
          COMPANY_MONTHLY_REPORTS_FILE: ./reporting/company-monthly-reports.json
        run: node reporting/company-monthly-reports.mjs

      - name: Validate company monthly reports
        env:
          COMPANY_MONTHLY_REPORTS_FILE: ./reporting/company-monthly-reports.json
        run: node reporting/company-monthly-reports-validation.mjs

      - name: Commit monthly reporting snapshot
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "The Holding Data Engine"
          git config user.email "data-engine@theholding.ai"
          git add reporting/company-monthly-reports.json
          if git diff --cached --quiet; then
            echo "No company monthly reporting changes."
          else
            git commit -m "data: update company monthly reports"
            for attempt in 1 2 3; do
              git fetch origin main
              if ! git rebase origin/main; then
                git rebase --abort || true
                echo "Safe writer guard: rebase conflict; refusing to guess."
                exit 1
              fi
              if git push origin HEAD:main; then
                exit 0
              fi
              echo "Safe writer guard: main moved during push; retrying ($attempt/3)..."
              sleep $((attempt * 2))
            done
            echo "Safe writer guard: push failed after 3 attempts."
            exit 1
          fi
