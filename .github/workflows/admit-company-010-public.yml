# holding-workflow-definition-proof: intelligence/reliability/company-010-public-admission-workflow-definition-proof.mjs
name: "Admit Company #010 · Cypher Public Surface"

# Company #010 is already admitted to the canonical Companies surface.
# This legacy entrypoint now proves admission parity read-only; production
# companies/index.html publication remains with Unified Capital or an explicit
# reviewed source+generated-surface change, never an independent recovery writer.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'companies/company-010-public-adapter.js'
      - 'onboarding/company-010-public-admission.mjs'
      - '.github/workflows/admit-company-010-public.yml'

permissions:
  contents: read

concurrency:
  group: company-010-public-admission
  cancel-in-progress: false

jobs:
  admit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Validate public source and build admission preview
        run: |
          set -euo pipefail
          node --check companies/company-010-public-adapter.js
          node --check onboarding/company-010-public-admission.mjs
          rm -f .tmp-company-010-public-admission.html
          node onboarding/company-010-public-admission.mjs
          test -f .tmp-company-010-public-admission.html
          node --check .tmp-company-010-public-admission.html >/dev/null 2>&1 || true
      - name: Validate canonical Company #010 boundary
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs');
          const d=JSON.parse(fs.readFileSync('companies/company-010-production-state.json','utf8'));
          if(d.company?.registry!=='010'||d.company?.name!=='Cypher') throw new Error('identity mismatch');
          if(d.status!=='complete-total-capital') throw new Error('complete Company #010 state required');
          if(d.capital?.totalCapitalComplete!==true) throw new Error('complete capital binding required');
          if(d.capital?.knownButUnboundCapitalMayExist!==false) throw new Error('unexpected unresolved in-scope capital');
          if(!(Number(d.capital?.totalCapitalUsd)>0)) throw new Error('complete capital total missing');
          if(Math.abs(Number(d.capital?.totalCapitalUsd)-Number(d.capital?.knownCapitalFloorUsd))>0.01) throw new Error('complete total and measured floor diverge');
          if((d.capital?.positions||[]).some(p=>String(p.protocol||'').toLowerCase()==='fluid')) throw new Error('Fluid returned inside owner-defined Company #010 scope');
          if(d.authority?.executionAuthority!=='none'||d.authority?.transactions!==false) throw new Error('authority drift');
          if(d.epistemicBoundary?.unknownIsNotZero!==true||d.epistemicBoundary?.partialTotalIsNotTotal!==true) throw new Error('epistemic boundary drift');
          console.log('Company #010 complete canonical boundary PASS');
          NODE
      - name: Verify current canonical public surface matches admission preview
        run: |
          set -euo pipefail
          if ! cmp -s companies/index.html .tmp-company-010-public-admission.html; then
            echo 'Cypher admission preview differs from canonical companies/index.html; refusing implicit publication.' >&2
            exit 1
          fi
          rm -f .tmp-company-010-public-admission.html
          if [ -n "$(git status --porcelain -- companies/index.html)" ]; then
            echo 'Cypher admission diagnostic modified canonical Companies surface unexpectedly.' >&2
            exit 1
          fi
          echo 'Cypher public admission parity PASS: repositoryMutation=false; canonicalWriter=The Holding Capital · Unified Refresh; executionAuthority=none'
          git diff --check
