name: Diagnose PR828 Velodrome Runtime
on:
  push:
    branches:
      - diagnostic/pr828-ve33-runtime-telemetry-20260915
    paths:
      - '.github/workflows/diagnose-pr828-velodrome-runtime.yml'
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock ethers@6
      - name: Build Velodrome-only production evidence and print telemetry
        env:
          REWARDS_DATA_FILE: /tmp/rewards-velodrome.json
          VE33_EVIDENCE_FILE: /tmp/ve33-velodrome.json
          VE33_STATE_READ_CONCURRENCY: '2'
          VE33_SETTLEMENT_CONCURRENCY: '2'
          VE33_SETTLEMENT_ADDRESS_GROUP_SIZE: '96'
          BASE_RPC_URL: https://base-rpc.publicnode.com
          OPTIMISM_RPC_URL: ${{ secrets.OPTIMISM_RPC_URL || 'https://gateway.tenderly.co/public/optimism' }}
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs');
          const r=JSON.parse(fs.readFileSync('companies/rewards-data.json','utf8'));
          const keep=new Set(['velodrome-ve','velodrome-ve-direct']);
          for(const c of Object.values(r.companies||{})) c.sources=(c.sources||[]).filter(s=>keep.has(s?.route));
          fs.writeFileSync('/tmp/rewards-velodrome.json',JSON.stringify(r));
          NODE
          cp reporting/ve33-accounting-evidence.json "$VE33_EVIDENCE_FILE"
          node reporting/ve33-accounting-evidence.mjs
          node - <<'NODE'
          const fs=require('fs');
          const e=JSON.parse(fs.readFileSync('/tmp/ve33-velodrome.json','utf8'));
          console.log('PR828_VELODROME_RUNTIME='+JSON.stringify({runtimeMs:e.diagnostics?.runtimeMs,velodrome:e.diagnostics?.protocols?.velodrome,aerodrome:e.diagnostics?.protocols?.aerodrome},null,2));
          NODE
