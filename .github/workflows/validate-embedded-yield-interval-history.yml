name: "The Holding · Embedded Yield Interval History"

on:
  pull_request:
    paths:
      - "stable-capital/embedded-yield-interval-history.mjs"
      - ".github/workflows/update-stable-capital.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Checkout PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Static preflight
        shell: bash
        run: |
          set -euo pipefail
          test -s stable-capital/embedded-yield-interval-history.mjs
          test -s companies/embedded-yield-ledger.json
          node --check stable-capital/embedded-yield-interval-history.mjs
          grep -q "persisted-adjacent-checkpoints" stable-capital/embedded-yield-interval-history.mjs
          grep -q "needs-flow-reconciliation" stable-capital/embedded-yield-interval-history.mjs
          grep -q "No APY backfill" stable-capital/embedded-yield-interval-history.mjs

      - name: Build canonical history from current production checkpoints
        run: node stable-capital/embedded-yield-interval-history.mjs

      - name: Validate canonical history semantics
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs');
          const l=JSON.parse(fs.readFileSync('companies/embedded-yield-ledger.json','utf8'));
          if(l.version!=='0.4-flow-aware-recurring-checkpoints') throw new Error('ledger version must remain backward compatible in phase 1');
          if(l.company?.registry!=='008'||l.company?.name!=='Monetra.eth') throw new Error('Monetra identity drift');
          const h=l.intervalHistory;
          if(h?.schemaVersion!=='0.1-canonical-embedded-yield-interval-history') throw new Error('history schema missing');
          if(h?.source!=='persisted-adjacent-checkpoints') throw new Error('history source must be persisted checkpoints only');
          if(!Array.isArray(h.rows)||h.rows.length<1) throw new Error('no interval rows');
          if(!(Number(h.acceptedCount)>0)) throw new Error('no accepted intervals');
          if(h.totalCount!==h.rows.length) throw new Error('history count drift');
          if(h.acceptedCount+h.rejectedCount!==h.totalCount) throw new Error('accepted/rejected partition drift');

          const endDates=new Set(h.rows.map(r=>r.endDate).filter(Boolean));
          if(endDates.size<2) throw new Error('history did not recover multiple persisted checkpoint dates');
          const accepted=h.rows.filter(r=>r.accepted===true);
          if(accepted.some(r=>r.status!=='ok')) throw new Error('accepted interval without ok status');
          if(accepted.some(r=>!r.startAt||!r.endAt||!r.positionId||!r.protocol)) throw new Error('accepted interval missing provenance');
          if(accepted.some(r=>r.flowFingerprintMatched!==true)) throw new Error('accepted interval without exact flow fingerprint match');

          for(const [id,p] of Object.entries(l.positions||{})) {
            if(!Array.isArray(p.intervalHistory)) throw new Error('position history missing '+id);
            const last=p.intervalHistory.at(-1);
            if(last && last.status!==(p.latestInterval?.status||'unknown')) throw new Error('latest status mismatch '+id);
            if(last?.status==='ok' && Math.abs(Number(last.incomeUsd)-Number(p.latestInterval.incomeUsd))>0.00002) throw new Error('latest income mismatch '+id);
          }

          if(!String(l.methodology?.canonicalIntervalHistoryRule||'').includes('No APY backfill')) throw new Error('no-backfill methodology missing');
          if(!String(l.methodology?.canonicalIntervalAcceptanceRule||'').includes('status=ok')) throw new Error('acceptance rule missing');

          console.log('EMBEDDED YIELD CANONICAL INTERVAL HISTORY v0.1 PASS',{
            totalIntervals:h.totalCount,
            acceptedIntervals:h.acceptedCount,
            rejectedIntervals:h.rejectedCount,
            distinctEndDates:endDates.size,
            acceptedIncomeUsd:h.acceptedIncomeUsd,
            ledgerVersion:l.version
          });
          NODE
          git diff --check
