name: Update Company 009 Beefy Income Ledger

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - "Update The Holding Reporting Data"
    types: [completed]
  push:
    branches: [main]
    paths:
      - 'companies/company-009-beefy-cvxcrv-income.json'
      - 'reporting/income-ledger-company-009-beefy.mjs'
      - 'reporting/income-ledger-company-009-beefy-validation.mjs'
      - 'reporting/income-ledger-policy.json'
      - '.github/workflows/update-income-ledger-company-009-beefy.yml'
      - '.github/workflows/verify-income-ledger-company-009-beefy.yml'

permissions:
  contents: write

concurrency:
  group: company-009-beefy-income-ledger
  cancel-in-progress: false

jobs:
  update:
    if: >-
      ${{
        github.event_name != 'workflow_run' ||
        (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout canonical main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: Preflight factual source and accounting boundary
        shell: bash
        run: |
          set -euo pipefail
          node --check reporting/income-ledger-company-009-beefy.mjs
          node --check reporting/income-ledger-company-009-beefy-validation.mjs
          test -s companies/company-009-beefy-cvxcrv-income.json
          test -s reporting/income-ledger.json
          test -s reporting/income-ledger-policy.json
          node - <<'NODE'
          const fs=require('fs');
          const policy=JSON.parse(fs.readFileSync('reporting/income-ledger-policy.json','utf8'));
          if(policy.sourceAuthority?.company009BeefyEmbeddedIncome!=='companies/company-009-beefy-cvxcrv-income.json adjacent constant-share positive-PPFS checkpoints') throw new Error('Company #009 Beefy source authority missing');
          if(policy.rules?.referenceAprCanNeverBackfillEarnedIncome!==true||policy.rules?.unknownIsNotZero!==true) throw new Error('Canonical accounting epistemic contract drift');
          if(policy.authority?.executionAuthority!=='none'||policy.authority?.capitalExecution!==false) throw new Error('Canonical accounting authority expansion');
          console.log('Company #009 Beefy accounting preflight PASS');
          NODE

      - name: Admit factual Beefy embedded-income intervals
        env:
          COMPANY_009_BEEFY_INCOME_FILE: ./companies/company-009-beefy-cvxcrv-income.json
          INCOME_LEDGER_FILE: ./reporting/income-ledger.json
        run: node reporting/income-ledger-company-009-beefy.mjs

      - name: Validate canonical admission
        env:
          COMPANY_009_BEEFY_INCOME_FILE: ./companies/company-009-beefy-cvxcrv-income.json
          INCOME_LEDGER_FILE: ./reporting/income-ledger.json
        run: node reporting/income-ledger-company-009-beefy-validation.mjs

      - name: Commit canonical Income Ledger delta
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "The Holding Accounting Engine"
          git config user.email "accounting-engine@theholding.ai"

          critical_fingerprint() {
            sha256sum \
              reporting/income-ledger-company-009-beefy.mjs \
              reporting/income-ledger-company-009-beefy-validation.mjs \
              reporting/income-ledger-policy.json \
              .github/workflows/update-income-ledger-company-009-beefy.yml
          }
          critical_before="$(critical_fingerprint)"

          git add reporting/income-ledger.json
          if git diff --cached --quiet; then
            echo "No new Company #009 Beefy accounting evidence."
            exit 0
          fi
          git commit -m "data: admit Company 009 Beefy earned income"

          for attempt in 1 2 3; do
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "Safe writer guard: rebase conflict; refusing to guess."
              exit 1
            fi

            critical_after="$(critical_fingerprint)"
            if [ "$critical_after" != "$critical_before" ]; then
              echo "Critical Company #009 Beefy accounting code changed during publish rebase; fail closed."
              exit 1
            fi

            COMPANY_009_BEEFY_INCOME_FILE=./companies/company-009-beefy-cvxcrv-income.json \
            INCOME_LEDGER_FILE=./reporting/income-ledger.json \
            node reporting/income-ledger-company-009-beefy.mjs
            COMPANY_009_BEEFY_INCOME_FILE=./companies/company-009-beefy-cvxcrv-income.json \
            INCOME_LEDGER_FILE=./reporting/income-ledger.json \
            node reporting/income-ledger-company-009-beefy-validation.mjs

            git add reporting/income-ledger.json
            git commit --amend --no-edit

            mapfile -t ahead < <(git diff --name-only origin/main...HEAD)
            if [ "${#ahead[@]}" -ne 1 ] || [ "${ahead[0]}" != "reporting/income-ledger.json" ]; then
              echo "Unexpected Company #009 Beefy publish delta: ${ahead[*]}"
              exit 1
            fi

            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Safe writer guard: main moved during push; retrying on fresh canonical state ($attempt/3)..."
            sleep $((attempt * 2))
          done
          echo "Safe writer guard: push failed after 3 attempts."
          exit 1
