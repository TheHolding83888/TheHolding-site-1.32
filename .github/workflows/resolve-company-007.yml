name: "Resolve Company #007"

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: resolve-company-007
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Restore validated Company #007 resolver baseline
        shell: bash
        run: |
          set -euo pipefail
          FILE="companies/company-007-resolve.json"
          BASELINE_COMMIT="0e841d2606efe07ad4624ae5d0b32009ebed9c51"
          mkdir -p companies
          git cat-file -e "$BASELINE_COMMIT:$FILE"
          git show "$BASELINE_COMMIT:$FILE" > "$FILE"
          cp "$FILE" /tmp/company-007-resolve.before-yb.json
          node - <<'NODE'
          const fs = require('fs');
          const d = JSON.parse(fs.readFileSync('/tmp/company-007-resolve.before-yb.json', 'utf8'));
          if (d.version !== '1.1-targeted-resolver') throw new Error('baseline resolver version mismatch');
          if (d.company?.registry !== '007') throw new Error('baseline registry mismatch');
          if (d.company?.name !== "Rook's portfolio") throw new Error('baseline company mismatch');
          for (const key of ['crv','link','zk','votium']) {
            if (d.results?.[key]?.status !== 'ok') throw new Error(`baseline ${key} is not ok`);
          }
          if (d.results?.votium?.completeCurrentRootScan !== true) throw new Error('baseline Votium scan incomplete');
          console.log('Validated #007 LKG baseline:', d.generatedAt);
          NODE

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Install resolver dependency
        run: npm install --no-save ethers@6

      - name: "Resolve Company #007 Yield Basis canonical-quantity source mesh"
        env:
          ETH_RPC_URL: ${{ secrets.ETH_RPC_URL }}
          ETH_RPC_URL_2: ${{ secrets.ETH_RPC_URL_2 }}
          ETH_ARCHIVE_RPC_URL: ${{ secrets.ETH_ARCHIVE_RPC_URL }}
          ETH_ARCHIVE_RPC_URL_2: ${{ secrets.ETH_ARCHIVE_RPC_URL_2 }}
          ETHERSCAN_API_KEY: ${{ secrets.ETHERSCAN_API_KEY }}
          COMPANY_007_RESOLVE_OUTPUT: companies/company-007-resolve.json
        run: node onboarding/company-007-resolve.mjs

      - name: Validate JSON and preservation guard
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('fs');
          const crypto = require('crypto');
          const before = JSON.parse(fs.readFileSync('/tmp/company-007-resolve.before-yb.json', 'utf8'));
          const after = JSON.parse(fs.readFileSync('companies/company-007-resolve.json', 'utf8'));
          const hash = x => crypto.createHash('sha256').update(JSON.stringify(x)).digest('hex');
          if (after.version !== '1.1-targeted-resolver') throw new Error('resolver version mismatch');
          if (after.company?.registry !== '007') throw new Error('registry mismatch');
          if (after.company?.name !== "Rook's portfolio") throw new Error('company mismatch');
          for (const key of ['crv','link','zk','votium']) {
            if (hash(before.results[key]) !== hash(after.results[key])) throw new Error(`preservation guard failed: ${key}`);
          }
          const yb = after.results?.yieldBasis;
          if (!yb) throw new Error('Yield Basis result missing');
          if (yb.yieldBasisResolverVersion !== '1.8-canonical-quantity-source-mesh') throw new Error('YB sub-version mismatch');
          if (yb.methodology?.emissionsIncluded !== false) throw new Error('YB emissions must be excluded');
          if (yb.methodology?.redemptionPpsUsedForApr !== false) throw new Error('redemption PPS must not be used for FT APY');
          if (!Array.isArray(yb.positions) || yb.positions.length !== 2) throw new Error('expected two YB markets');
          if (yb.status === 'ok') {
            for (const p of yb.positions) {
              if (!(Number(p.pps30dAgo) > 0)) throw new Error(`${p.market}: historical PPS missing`);
              if (!Number.isFinite(Number(p.fundamentalTradingApy30dPct))) throw new Error(`${p.market}: FT APY missing`);
              if (!p.historicalProvider) throw new Error(`${p.market}: historical provider missing`);
            }
            console.log('YB SOURCE MESH v1.8: OK');
          } else {
            if (yb.status !== 'warming') throw new Error(`unexpected Yield Basis status: ${yb.status}`);
            if (yb.sourceMeshExhausted !== true) throw new Error('warming YB must explicitly mark sourceMeshExhausted=true');
            console.log('YB SOURCE MESH v1.8: WARMING – all reproducible historical sources exhausted; diagnostics will be published.');
          }
          NODE

      - name: Publish resolver JSON to main
        shell: bash
        run: |
          set -euo pipefail
          FILE="companies/company-007-resolve.json"
          test -s "$FILE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f "$FILE"
          if ! git diff --cached --quiet -- "$FILE"; then
            git commit -m "Resolve Company #007 Yield Basis canonical quantity"
          else
            echo "Generated resolver matches tracked content."
          fi
          for attempt in 1 2 3; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then break; fi
            git rebase --abort || true
            if [ "$attempt" -eq 3 ]; then
              echo "ERROR: failed to publish resolver JSON after retries."
              exit 1
            fi
            sleep $((attempt * 2))
          done
          git fetch origin main
          git cat-file -e "origin/main:$FILE"
          echo "Verified on origin/main: $FILE"
