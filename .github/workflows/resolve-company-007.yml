name: "Resolve Company #007"

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: resolve-company-007
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify discovery input exists
        run: |
          test -s companies/company-007-discovery.json || {
            echo "ERROR: companies/company-007-discovery.json is absent."
            echo "Run Discover Company #007 successfully first."
            exit 1
          }

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install resolver dependency
        run: npm install --no-save ethers@6

      - name: "Resolve Company #007 targeted unknowns"
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ETH_RPC_URL: ${{ secrets.ETH_RPC_URL }}
          ETH_RPC_URL_2: ${{ secrets.ETH_RPC_URL_2 }}
          BASE_RPC_URL: ${{ secrets.BASE_RPC_URL }}
          BASE_RPC_URL_2: ${{ secrets.BASE_RPC_URL_2 }}
          OPTIMISM_RPC_URL: ${{ secrets.OPTIMISM_RPC_URL }}
          ARBITRUM_RPC_URL: ${{ secrets.ARBITRUM_RPC_URL }}
          ZKSYNC_RPC_URL: ${{ secrets.ZKSYNC_RPC_URL }}
          COMPANY_007_DISCOVERY_INPUT: companies/company-007-discovery.json
          COMPANY_007_RESOLVE_OUTPUT: companies/company-007-resolve.json
        run: node onboarding/company-007-resolve.mjs

      - name: Validate resolver JSON
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const p = 'companies/company-007-resolve.json';
          if (!fs.existsSync(p)) throw new Error('resolver JSON was not created');
          const d = JSON.parse(fs.readFileSync(p, 'utf8'));

          if (d.version !== '1.1-targeted-resolver') throw new Error('resolver version mismatch');
          if (d.company?.registry !== '007') throw new Error('registry mismatch');
          if (d.company?.name !== "Rook's portfolio") throw new Error('name mismatch');

          for (const key of ['crv','link','zk','yieldBasis','votium']) {
            if (!d.results?.[key]) throw new Error('missing result: ' + key);
          }

          if (d.results.zk?.coingeckoId !== 'zksync') {
            throw new Error('ZK CoinGecko mapping is not zksync');
          }

          if (d.results.yieldBasis?.methodology?.emissionsIncluded !== false) {
            throw new Error('Yield Basis unstaked methodology must exclude emissions');
          }

          console.log('Company #007 resolver JSON validation passed');
          console.log('Production readiness:', JSON.stringify(d.productionReadiness));
          NODE

      - name: Publish resolver JSON to main
        shell: bash
        run: |
          set -euo pipefail

          FILE="companies/company-007-resolve.json"

          test -s "$FILE" || {
            echo "ERROR: $FILE is missing or empty after resolver."
            exit 1
          }

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -f "$FILE"

          if ! git diff --cached --quiet -- "$FILE"; then
            git commit -m "Resolve Company #007 targeted routes"
          else
            echo "Generated resolver matches currently tracked content."
          fi

          for attempt in 1 2 3; do
            git fetch origin main

            if git rebase origin/main; then
              if git push origin HEAD:main; then
                break
              fi
            fi

            git rebase --abort || true

            if [ "$attempt" -eq 3 ]; then
              echo "ERROR: failed to publish resolver JSON after retries."
              exit 1
            fi

            sleep $((attempt * 2))
          done

          git fetch origin main
          git cat-file -e "origin/main:$FILE" || {
            echo "ERROR: workflow would otherwise be green, but $FILE is absent from origin/main."
            exit 1
          }

          echo "Verified on origin/main: $FILE"
