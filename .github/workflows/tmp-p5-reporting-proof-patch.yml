name: TEMP P5 Reporting Proof Patch

on:
  push:
    branches:
      - fix/p5-reporting-discovery-trigger-wiring-20260914
    paths:
      - '.github/workflows/tmp-p5-reporting-proof-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/p5-reporting-discovery-trigger-wiring-20260914
          fetch-depth: 0
      - name: Extend existing Reporting workflow paired proof
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('intelligence/reliability/reporting-scheduler-workflow-definition-proof.mjs')
          s=p.read_text()
          anchor="assert.match(workflow,/critical_fingerprint\\(\\)/,'Reporting race critical fingerprint missing');"
          addition="""
const HISTORICAL_DISCOVERY_WAKE_DEPS=[
  'reporting/historical-aerodrome-discovered-price.mjs',
  'reporting/historical-aerodrome-usdc-route.mjs',
  'reporting/historical-velodrome-discovered-price.mjs',
  'reporting/historical-velodrome-usdc-route.mjs'
];
const HISTORICAL_VALUATION_CRITICAL_DEPS=[
  'reporting/historical-canonical-price.mjs',
  ...HISTORICAL_DISCOVERY_WAKE_DEPS,
  'reporting/ve33-historical-valuation-identity.mjs'
];
assert.ok(workflow.startsWith('# holding-workflow-definition-proof: intelligence/reliability/reporting-scheduler-workflow-definition-proof.mjs\\n'),'Reporting paired workflow-definition proof marker missing');
for(const dep of HISTORICAL_DISCOVERY_WAKE_DEPS) assert.ok(workflow.includes(`      - '${dep}'`),`Reporting historical discovery wake dependency missing: ${dep}`);
for(const dep of HISTORICAL_VALUATION_CRITICAL_DEPS) assert.ok(workflow.includes('              '+dep),`Reporting historical valuation critical fingerprint dependency missing: ${dep}`);
"""
          if s.count(anchor)!=1:
              raise SystemExit(f'paired-proof anchor count {s.count(anchor)} != 1')
          if 'HISTORICAL_DISCOVERY_WAKE_DEPS' in s:
              raise SystemExit('paired-proof assertions already present')
          s=s.replace(anchor,anchor+'\n'+addition,1)
          p.write_text(s)
          PY
          node intelligence/reliability/reporting-scheduler-workflow-definition-proof.mjs
          git diff --check
          git diff -- intelligence/reliability/reporting-scheduler-workflow-definition-proof.mjs
          git config user.name "The Holding P5 Diagnostic"
          git config user.email "p5-diagnostic@theholding.ai"
          git add intelligence/reliability/reporting-scheduler-workflow-definition-proof.mjs
          test "$(git diff --cached --name-only)" = "intelligence/reliability/reporting-scheduler-workflow-definition-proof.mjs"
          git commit -m "test: prove Reporting historical pricing wiring"
          git push origin HEAD:fix/p5-reporting-discovery-trigger-wiring-20260914
