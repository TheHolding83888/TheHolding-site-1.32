name: TEMP P5 Reporting Discovery Wiring Patch

on:
  push:
    branches:
      - fix/p5-reporting-discovery-trigger-wiring-20260914
    paths:
      - '.github/workflows/tmp-p5-reporting-discovery-wiring-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/p5-reporting-discovery-trigger-wiring-20260914
          fetch-depth: 0
      - name: Patch Reporting dependency contract exactly once
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/update-reporting.yml')
          s=p.read_text()
          old_paths="""      - 'reporting/income-ledger.mjs'\n      - 'reporting/historical-canonical-price.mjs'\n      - 'reporting/ve33-historical-valuation-identity.mjs'\n      - 'reporting/income-ledger-validation.mjs'"""
          new_paths="""      - 'reporting/income-ledger.mjs'\n      - 'reporting/historical-canonical-price.mjs'\n      - 'reporting/historical-aerodrome-discovered-price.mjs'\n      - 'reporting/historical-aerodrome-usdc-route.mjs'\n      - 'reporting/historical-velodrome-discovered-price.mjs'\n      - 'reporting/historical-velodrome-usdc-route.mjs'\n      - 'reporting/ve33-historical-valuation-identity.mjs'\n      - 'reporting/income-ledger-validation.mjs'"""
          old_fp="""            reporting/rate-continuity-policy.json \\\n              reporting/income-ledger.mjs \\\n              reporting/income-ledger-validation.mjs \\"""
          new_fp="""            reporting/rate-continuity-policy.json \\\n              reporting/income-ledger.mjs \\\n              reporting/historical-canonical-price.mjs \\\n              reporting/historical-aerodrome-discovered-price.mjs \\\n              reporting/historical-aerodrome-usdc-route.mjs \\\n              reporting/historical-velodrome-discovered-price.mjs \\\n              reporting/historical-velodrome-usdc-route.mjs \\\n              reporting/ve33-historical-valuation-identity.mjs \\\n              reporting/income-ledger-validation.mjs \\"""
          if s.count(old_paths)!=1:
              raise SystemExit(f'push-path anchor count {s.count(old_paths)} != 1')
          if s.count(old_fp)!=1:
              raise SystemExit(f'fingerprint anchor count {s.count(old_fp)} != 1')
          s=s.replace(old_paths,new_paths,1).replace(old_fp,new_fp,1)
          deps=[
            'reporting/historical-canonical-price.mjs',
            'reporting/historical-aerodrome-discovered-price.mjs',
            'reporting/historical-aerodrome-usdc-route.mjs',
            'reporting/historical-velodrome-discovered-price.mjs',
            'reporting/historical-velodrome-usdc-route.mjs',
            'reporting/ve33-historical-valuation-identity.mjs',
          ]
          for dep in deps:
              if s.count(dep) < 2:
                  raise SystemExit(f'{dep} is not present in both wake + fingerprint contracts')
          p.write_text(s)
          PY
          git diff --check
          git diff -- .github/workflows/update-reporting.yml
          git config user.name "The Holding P5 Diagnostic"
          git config user.email "p5-diagnostic@theholding.ai"
          git add .github/workflows/update-reporting.yml
          test "$(git diff --cached --name-only)" = ".github/workflows/update-reporting.yml"
          git commit -m "reliability: bind historical discovery dependencies to reporting"
          git push origin HEAD:fix/p5-reporting-discovery-trigger-wiring-20260914
