name: TEMP PR295 fund inventory materializer

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/temp-pr295-fund-inventory-materializer.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR295 branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: agents/ask-conversational-continuity-v0.2
          fetch-depth: 0
      - name: Add bounded fund inventory route
        shell: bash
        run: |
          set -euo pipefail
          if grep -q "function fundInventoryIntent" agents/console/app.js; then
            echo "fund inventory routing already present"
            exit 0
          fi
          python3 - <<'PY'
          from pathlib import Path
          p=Path('agents/console/app.js')
          s=p.read_text()
          old="""  function fundPurposeAnswer(id, lang) {
    const fund = FUND_DIRECTIONS[id];
"""
          new="""  function fundInventoryIntent(query) {
    const q = fundQueryNorm(query);
    const en = q.includes('fund') && q.includes('holding') && includesAny(q, ['which', 'what', 'have', 'has', 'list', 'exist']);
    const ru = q.includes('фонд') && q.includes('holding') && includesAny(q, ['какие', 'какой', 'есть', 'список', 'перечисли']);
    return en || ru;
  }

  function fundInventoryAnswer(lang) {
    const concept = CONCEPTS.funds;
    state.lastTopic = 'funds';
    state.lastEntity = { kind: 'fund-set', ids: fundIds() };
    return { text: concept[lang], source: 'The Holding project canon' };
  }

  function fundPurposeAnswer(id, lang) {
    const fund = FUND_DIRECTIONS[id];
"""
          if s.count(old) != 1:
              raise SystemExit(f'fund inventory function anchor count={s.count(old)}')
          s=s.replace(old,new,1)
          old2="""    const follow = followupAnswer(raw, lang);
    if (follow) return follow;

    const explicitFund = fundGroup(raw);
"""
          new2="""    const follow = followupAnswer(raw, lang);
    if (follow) return follow;

    if (fundInventoryIntent(raw)) return fundInventoryAnswer(lang);

    const explicitFund = fundGroup(raw);
"""
          if s.count(old2) != 1:
              raise SystemExit(f'fund inventory route anchor count={s.count(old2)}')
          p.write_text(s.replace(old2,new2,1))
          PY
          node --check agents/console/app.js
          git diff --check -- agents/console/app.js
          git config user.name "The Holding Ask Repair"
          git config user.email "ask-repair@theholding.ai"
          git add agents/console/app.js
          git commit -m "ask: route fund inventory intent"
          git push origin HEAD:agents/ask-conversational-continuity-v0.2
