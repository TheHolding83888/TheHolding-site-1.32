name: "The Holding · Update Realised Cash Flow"

on:
  workflow_dispatch:
  schedule:
    - cron: '17 5 * * *'
  pull_request:
    paths:
      - 'intelligence/realised-cash-flow/**'
      - 'verification/realised-cash-flow/**'
  push:
    branches: [main]
    paths:
      - 'intelligence/realised-cash-flow/yield-basis-live-adapter.mjs'
      - 'intelligence/realised-cash-flow/classifier.mjs'
      - 'intelligence/realised-cash-flow/policy.json'
      - 'verification/realised-cash-flow/review-live-v0.2.mjs'
      - '.github/workflows/update-realised-cash-flow.yml'

permissions:
  contents: read

env:
  # The query is restricted to exact tracked Claim.user topics, so larger
  # top-level windows reduce provider rate pressure while recursive splitting
  # still fails closed if any bounded historical range cannot be proven.
  ETH_RPC_URL: https://rpc.flashbots.net
  YB_LOG_WINDOW: '20000'
  YB_LOG_MIN_WINDOW: '250'
  YB_RPC_TIMEOUT_MS: '12000'

concurrency:
  group: realised-cash-flow-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'main' }}
  cancel-in-progress: true

jobs:
  candidate-proof:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Install bounded runtime dependency
        run: npm install --no-save --no-package-lock ethers@6

      - name: Re-prove accounting boundary
        run: |
          set -euo pipefail
          node --check intelligence/realised-cash-flow/classifier.mjs
          node verification/realised-cash-flow/evaluator-v0.1.mjs

      - name: Collect live Yield Basis realised cash flow
        run: node intelligence/realised-cash-flow/yield-basis-live-adapter.mjs

      - name: Independent live review
        run: |
          set -euo pipefail
          node --check intelligence/realised-cash-flow/yield-basis-live-adapter.mjs
          node --check verification/realised-cash-flow/review-live-v0.2.mjs
          node verification/realised-cash-flow/review-live-v0.2.mjs
          git diff --check

      - name: Upload temporary exact live evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: realised-cash-flow-candidate-${{ github.run_id }}
          path: intelligence/realised-cash-flow/realised-cash-flow.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Candidate summary
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ -s intelligence/realised-cash-flow/realised-cash-flow.json ]; then
            node -e 'const x=require("./intelligence/realised-cash-flow/realised-cash-flow.json"); console.log(["# Realised Cash Flow · live candidate","","Status: **"+x.status+"**","Deployment block: **"+x.source.deploymentBlock+"**","Scanned through block: **"+x.scan.toBlock+"**","Scan windows: **"+x.scan.windowCount+" successful leaf windows / "+x.scan.topLevelWindowCount+" top-level windows**","Tracked direct Claim events: **"+x.summary.realisedIncomeEventCount+"**","Companies with direct claims: **"+x.summary.companiesWithDirectClaims+"/"+x.summary.companyCount+"**","Historical USD aggregate: **null by design**","Ask promotion: **disabled**","Execution authority: **none**"].join("\n"))' >> "$GITHUB_STEP_SUMMARY"
          fi

  publish-main:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Checkout canonical repository state
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Install bounded runtime dependency
        run: npm install --no-save --no-package-lock ethers@6

      - name: Prove foundation before live collection
        run: |
          set -euo pipefail
          node verification/realised-cash-flow/evaluator-v0.1.mjs
          node --check intelligence/realised-cash-flow/yield-basis-live-adapter.mjs
          node --check verification/realised-cash-flow/review-live-v0.2.mjs

      - name: Collect and review canonical live state
        run: |
          set -euo pipefail
          node intelligence/realised-cash-flow/yield-basis-live-adapter.mjs
          node verification/realised-cash-flow/review-live-v0.2.mjs
          git diff --check

      - name: Publish only the machine-readable ledger
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "The Holding Realised Cash Flow"
          git config user.email "realised-cash-flow@theholding.ai"

          critical_fingerprint() {
            sha256sum \
              intelligence/realised-cash-flow/classifier.mjs \
              intelligence/realised-cash-flow/policy.json \
              intelligence/realised-cash-flow/yield-basis-live-adapter.mjs \
              verification/realised-cash-flow/review-live-v0.2.mjs
          }

          critical_before="$(critical_fingerprint)"

          git add intelligence/realised-cash-flow/realised-cash-flow.json
          mapfile -t staged < <(git diff --cached --name-only)
          if [ "${#staged[@]}" -gt 1 ] || { [ "${#staged[@]}" -eq 1 ] && [ "${staged[0]}" != "intelligence/realised-cash-flow/realised-cash-flow.json" ]; }; then
            echo "Unexpected staged files: ${staged[*]}"
            exit 1
          fi
          if git diff --cached --quiet; then
            echo "No Realised Cash Flow state change to publish."
            exit 0
          fi
          git commit -m "intelligence: refresh realised cash flow"

          for attempt in 1 2 3; do
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "Realised Cash Flow publish conflict; fail closed."
              exit 1
            fi

            critical_after="$(critical_fingerprint)"
            if [ "$critical_after" != "$critical_before" ]; then
              echo "Critical Realised Cash Flow sources changed during publish rebase; fail closed and require a fresh external scan."
              exit 1
            fi

            node verification/realised-cash-flow/review-live-v0.2.mjs
            mapfile -t ahead < <(git diff --name-only origin/main...HEAD)
            if [ "${#ahead[@]}" -ne 1 ] || [ "${ahead[0]}" != "intelligence/realised-cash-flow/realised-cash-flow.json" ]; then
              echo "Unexpected publish delta after rebase: ${ahead[*]}"
              exit 1
            fi

            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push attempt ${attempt} lost a race; rebasing the already-proven JSON without repeating external RPC collection."
            sleep $((attempt * 2))
          done
          echo "Realised Cash Flow could not publish after 3 attempts."
          exit 1

      - name: Publication summary
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ -s intelligence/realised-cash-flow/realised-cash-flow.json ]; then
            node -e 'const x=require("./intelligence/realised-cash-flow/realised-cash-flow.json"); console.log(["# The Holding · Realised Cash Flow","","Status: **"+x.status+"**","Scanned from proven deployment block **"+x.scan.fromBlock+"** through Ethereum block **"+x.scan.toBlock+"**","Direct Yield Basis Claim events: **"+x.summary.realisedIncomeEventCount+"**","Companies with direct claims: **"+x.summary.companiesWithDirectClaims+"/"+x.summary.companyCount+"**","Overall company coverage remains incomplete. Ask promotion remains disabled.","Execution authority: `none`."].join("\n"))' >> "$GITHUB_STEP_SUMMARY"
          fi
