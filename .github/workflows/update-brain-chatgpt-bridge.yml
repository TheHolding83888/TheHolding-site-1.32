name: "The Holding Brain · ChatGPT Bridge"

on:
  # Manual recovery / diagnostic path only. Canonical daily cognition now runs
  # through Refresh Cognitive Stack so Security, Brain, Bridge, Cognitive State
  # and downstream Learning share one coherent evidence chain.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: the-holding-brain-chatgpt-bridge
  cancel-in-progress: false

jobs:
  bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout canonical state
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Preflight Bridge
        shell: bash
        run: |
          set -euo pipefail
          test -s intelligence/brain-intelligence.json
          test -s intelligence/brain-chatgpt-bridge.mjs
          test -s intelligence/brain-chatgpt-bridge-policy.json
          test -s intelligence/brain-chatgpt-bridge-schema.json
          test -s intelligence/brain-upstream-guard.mjs
          test -s intelligence/cognitive-release-guard.mjs
          test -s intelligence/cognitive-stack-release.json
          node --check intelligence/brain-chatgpt-bridge.mjs
          node --check intelligence/cognitive-release-guard.mjs
          node intelligence/cognitive-release-guard.mjs
          node intelligence/brain-chatgpt-bridge.mjs --self-test

      - name: Build zero-cost ChatGPT Bridge
        run: node intelligence/brain-chatgpt-bridge.mjs

      - name: Validate Bridge contract
        shell: bash
        run: |
          set -euo pipefail
          node intelligence/brain-chatgpt-bridge.mjs --verify-current

          node - <<'NODE'
          const fs = require('fs');
          const bridge = JSON.parse(
            fs.readFileSync('intelligence/brain-chatgpt-bridge.json', 'utf8')
          );
          const evaluation = JSON.parse(
            fs.readFileSync('intelligence/brain-chatgpt-bridge-eval.json', 'utf8')
          );
          const history = JSON.parse(
            fs.readFileSync('intelligence/brain-chatgpt-bridge-history.json', 'utf8')
          );
          if (bridge.version !== '0.1-chatgpt-bridge') {
            throw new Error(`Unexpected Bridge version: ${bridge.version}`);
          }

          if (bridge.bridgeVersion !== '0.1-deterministic-public-cognitive-handoff') {
            throw new Error(`Unexpected bridgeVersion: ${bridge.bridgeVersion}`);
          }

          if (evaluation.status !== 'pass') {
            throw new Error('Bridge validation report did not PASS');
          }
          if (bridge.constraints?.apiRequired !== false) {
            throw new Error('Bridge unexpectedly requires an API');
          }

          if (bridge.constraints?.modelCallPerformed !== false) {
            throw new Error('Bridge unexpectedly performed a model call');
          }

          if (bridge.constraints?.executionAllowed !== false) {
            throw new Error('Bridge unexpectedly allows execution');
          }
          if (bridge.constraints?.proposalOnly !== true) {
            throw new Error('Bridge escaped proposal-only');
          }

          if (bridge.grounding?.publicContextOnly !== true) {
            throw new Error('Bridge context widened beyond public normalized Brain');
          }

          if (bridge.grounding?.upstreamCurrent !== true) {
            throw new Error('Bridge Grounded Brain upstream binding is not current');
          }
          if (!(bridge.grounding?.upstreamValidation?.sources ?? []).every((x) => x.exactByteMatch === true)) {
            throw new Error('Bridge exact upstream source binding failed');
          }
          for (const item of bridge.cases ?? []) {
            if (item.actionMode !== 'proposal-only') {
              throw new Error(`Case ${item.caseId} escaped proposal-only`);
            }
            if (!item.evidenceIds?.length) {
              throw new Error(`Case ${item.caseId} lost evidence`);
            }
            if (!item.deterministicAction) {
              throw new Error(`Case ${item.caseId} lost deterministic action`);
            }
          }
          if (history.version !== '0.1-chatgpt-bridge-history') {
            throw new Error(`Unexpected Bridge history version: ${history.version}`);
          }
          console.log('ChatGPT Bridge contract PASS', {
            status: bridge.status,
            brainStatus: bridge.sourceBrain.status,
            cases: bridge.cases.length,
            evidence: bridge.evidenceCatalog.length,
            historyObservations: history.observationCount,
            apiRequired: bridge.constraints.apiRequired,
          });
          NODE

          git diff --check

      - name: Publish Bridge safely
        shell: bash
        run: |
          set -euo pipefail
          GENERATED=(
            "intelligence/brain-chatgpt-bridge.json"
            "intelligence/brain-chatgpt-bridge.md"
            "intelligence/brain-chatgpt-bridge-history.json"
            "intelligence/brain-chatgpt-bridge-eval.json"
          )

          for f in "${GENERATED[@]}"; do
            test -s "$f"
          done

          git config user.name "The Holding Brain"
          git config user.email "brain@theholding.ai"

          git add "${GENERATED[@]}"
          staged_bad="$(
            git diff --cached --name-only |
              grep -Ev '^intelligence/(brain-chatgpt-bridge\.json|brain-chatgpt-bridge\.md|brain-chatgpt-bridge-history\.json|brain-chatgpt-bridge-eval\.json)$' ||
              true
          )"

          if [ -n "$staged_bad" ]; then
            echo "ERROR: Bridge staged files outside its generated-output boundary:"
            echo "$staged_bad"
            exit 1
          fi
          if git diff --cached --quiet; then
            echo "No Bridge output changes to publish."
            exit 0
          fi

          git commit -m "intelligence: extend ChatGPT Bridge"

          for attempt in 1 2 3; do
            git fetch origin main

            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "Bridge publish conflict; refusing to guess."
              exit 1
            fi
            # Fail closed if the exact Brain/policy/schema/engine bytes used to
            # generate this public handoff changed while we were publishing.
            node intelligence/brain-chatgpt-bridge.mjs --verify-current

            if git push origin HEAD:main; then
              git fetch origin main
              if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
                echo "ERROR: pushed Bridge commit is not current remote main."
                exit 1
              fi

              echo "Verified ChatGPT Bridge on remote main."
              exit 0
            fi

            echo "Main moved during push; retrying ($attempt/3)..."
            sleep $((attempt * 2))
          done
          echo "ERROR: unable to publish ChatGPT Bridge after 3 attempts."
          exit 1
