name: "Diagnose Company #010 · Public Admission"

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Build deterministic preview
        run: node onboarding/company-010-public-admission.mjs
      - name: Report failed Public Admission invariants
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const h=fs.readFileSync('.tmp-company-010-public-admission.html','utf8');
          const a=fs.readFileSync('companies/company-010-public-adapter.js','utf8');
          const checks=[];
          const add=(group,label,ok)=>checks.push({group,label,ok:Boolean(ok)});
          for(const x of ['"numberOfItems": 10','"position": 10, "name": "Cypher"','id="companyCount">10','/companies/company-010-public-adapter.js','const eligible = list.filter(c => c.indexEligible !== false);','const measuredTotal = list.reduce','if (cn) cn.textContent = list.length;',"seg.className = 'index-comp-seg' + (c.indexEligible === false ? ' pending' : '');","const rCo = c => c.indexEligible === false ? P.rCoMin","c.performancePending ? (lang === 'ru' ? 'Ожидается' : 'Pending')"])add('html',x,h.includes(x));
          add('html','loader multiplicity == 1',(h.match(/data-company-010-public-adapter/g)||[]).length===1);
          for(const x of ['Open Passport','company010Passport','thc10-overlay','thc10-passport','aria-controls="company010Passport"'])add('legacy absent',x,!a.includes(x));
          for(const x of ['v0.7-crv-strategy-income','Stake DAO','Aave','HyperLend','Project X','GMX','Concentrator','networkTvlUsd','measuredCapitalFloorUsd','INDEX_STATE.push(next)',"COMPANY_REWARDS_SCOPE.add('Cypher')",'The Holding Standard','state.performance?.complete!==true','GMX · ETH-USDC','GMX · BTC-USDC','cypher-eth-equivalent','wstETH','stakedao-base-curve-4pool','USDC','USDbC','axlUSDC','crvUSD','gmxCompactLabel','GMX · ETH-USDC / BTC-USDC · APY','GMX 30D Fee APY','embedded-in-gm-nav'])add('adapter',x,a.includes(x));
          for(const x of ['concentrator-asdcrv','convex-staked-cvxcrv','Concentrator · sdCRV','Convex · staked cvxCRV','ensureCrvStrategyIncome','Compounded','Claimable','Pending','auto-compounded','separate-claimable-rewards'])add('crv',x,a.includes(x));
          add('guard','Fluid protocol absent',!(/\['Bitcoin'.*'Fluid'/.test(a)||a.includes("'Concentrator','Fluid'")));
          add('guard','exact-vs-floor TVL',a.includes("${complete?'':'≥ '}${money(complete?state.capital.totalCapitalUsd:state.capital.knownCapitalFloorUsd)}"));
          add('guard','network TVL null guard',a.includes('net.networkTvlUsd!==null&&net.networkTvlUsd!==undefined'));
          add('guard','GMX mechanics hidden',!(a.includes('GMX Strategy Mechanics')||a.includes('Pool mix · diagnostic')||a.includes('cy-gmx-mechanics')));
          add('guard','GMX source metric',a.includes("eth.yield?.referenceMetric!=='GMX 30D Fee APY'||btc.yield?.referenceMetric!=='GMX 30D Fee APY'"));
          add('guard','GMX embedded income',a.includes("eth.yield?.incomeMode!=='embedded-in-gm-nav'||btc.yield?.incomeMode!=='embedded-in-gm-nav'"));
          add('guard','CRV income modes',a.includes("conc.yield?.incomeMode!=='auto-compounded'||cvx.yield?.incomeMode!=='separate-claimable-rewards'"));
          add('guard','Pending state',a.includes("const pending=lang()==='ru'?'Ожидается':'Pending'"));
          const bad=checks.filter(x=>!x.ok);
          for(const x of bad)console.log(`::error title=Company 010 public invariant::${x.group} | ${x.label}`);
          if(bad.length)process.exit(1);
          console.log('All Company #010 Public Admission invariants PASS');
          NODE
