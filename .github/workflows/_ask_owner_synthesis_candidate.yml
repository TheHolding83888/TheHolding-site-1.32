name: "Ask candidate · Owner Synthesis"

on:
  push:
    branches:
      - agents/ask-owner-synthesis-v0.7-20260815
    paths:
      - '.github/workflows/_ask_owner_synthesis_candidate.yml'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout candidate
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: agents/ask-owner-synthesis-v0.7-20260815
          fetch-depth: 0

      - name: Apply patch
        run: node verification/ask-experience/_owner-synthesis-patcher.mjs

      - name: Verify and publish
        shell: bash
        run: |
          set -euo pipefail
          node --check agents/console/app.js
          grep -F "ownerEvidenceSynthesis" agents/console/app.js >/dev/null
          git config user.name "The Holding Production Integrator"
          git config user.email "production-integrator@theholding.ai"
          rm -f .github/workflows/_ask_owner_synthesis_candidate.yml
          rm -f verification/ask-experience/_owner-synthesis-patcher.mjs
          git add -A
          git diff --check --cached
          git commit -m "Ask v0.7: add evidence-bound owner synthesis"
          git push origin HEAD:agents/ask-owner-synthesis-v0.7-20260815
