name: "The Holding Brain · Runtime Owner Activation"

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - "The Holding Risk · Health Factor Intelligence"
      - "Update The Holding Productivity Data"
      - "Update Company Rewards"
      - "The Holding · Update Realised Cash Flow"
    types:
      - completed
  pull_request:
    paths:
      - "intelligence/owner-context/runtime-owner-activation.mjs"
      - "intelligence/neural-graph/runtime-capability-overlay.mjs"
      - "intelligence/runtime-evidence/runtime-capability-registry.json"
      - "intelligence/runtime-evidence/runtime-capability-source-state.mjs"
      - "intelligence/runtime-evidence/runtime-reasoning-evidence.mjs"
      - "intelligence/risk/health-factor-intelligence.json"
      - "intelligence/owner-context/owner-teaching-activation.json"
      - "agents/console/runtime-evidence-cortex.js"
      - "agents/console/live-panels-refresh.js"

permissions:
  contents: write

concurrency:
  group: the-holding-runtime-owner-activation
  cancel-in-progress: false

jobs:
  resolve:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 6

    steps:
      - name: Checkout canonical state
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || 'main' }}

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Static preflight
        shell: bash
        run: |
          set -euo pipefail
          test -s intelligence/owner-context/runtime-owner-activation.mjs
          test -s intelligence/neural-graph/runtime-capability-overlay.mjs
          test -s intelligence/runtime-evidence/runtime-capability-registry.json
          test -s intelligence/runtime-evidence/runtime-capability-source-state.mjs
          test -s intelligence/runtime-evidence/runtime-reasoning-evidence.mjs
          test -s intelligence/risk/health-factor-intelligence.json
          test -s intelligence/owner-context/owner-teaching-activation.json
          test -s agents/console/runtime-evidence-cortex.js
          test -s agents/console/live-panels-refresh.js
          node --check intelligence/owner-context/runtime-owner-activation.mjs
          node --check intelligence/neural-graph/runtime-capability-overlay.mjs
          node --check intelligence/runtime-evidence/runtime-capability-source-state.mjs
          node --check intelligence/runtime-evidence/runtime-reasoning-evidence.mjs
          node --check agents/console/runtime-evidence-cortex.js
          node --check agents/console/live-panels-refresh.js
          grep -q "executionAuthority: 'none'" intelligence/owner-context/runtime-owner-activation.mjs
          grep -q "executionAuthority: 'none'" intelligence/neural-graph/runtime-capability-overlay.mjs
          grep -q "executionAuthority: 'none'" intelligence/runtime-evidence/runtime-capability-source-state.mjs
          grep -q "executionAuthority: 'none'" intelligence/runtime-evidence/runtime-reasoning-evidence.mjs
          grep -q '"automaticCapabilityActivation": false' intelligence/runtime-evidence/runtime-capability-registry.json
          grep -q "health-factor-monitoring" intelligence/owner-context/runtime-owner-activation.mjs
          grep -q "runtime-reasoning-evidence.json" agents/console/runtime-evidence-cortex.js
          grep -q "runtime-evidence-cortex.js" agents/console/live-panels-refresh.js

      - name: Resolve runtime owner activation
        run: node intelligence/owner-context/runtime-owner-activation.mjs

      - name: Build runtime capability graph overlay
        run: node intelligence/neural-graph/runtime-capability-overlay.mjs

      - name: Evaluate registered capability source state
        run: node intelligence/runtime-evidence/runtime-capability-source-state.mjs

      - name: Build registry-driven runtime reasoning evidence packet
        run: node intelligence/runtime-evidence/runtime-reasoning-evidence.mjs

      - name: Validate runtime promotion, registry, source health, graph binding and reasoning packet
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('fs');
          const a = JSON.parse(fs.readFileSync('intelligence/owner-context/runtime-owner-activation.json', 'utf8'));
          const g = JSON.parse(fs.readFileSync('intelligence/neural-graph/runtime-capability-overlay.json', 'utf8'));
          const reg = JSON.parse(fs.readFileSync('intelligence/runtime-evidence/runtime-capability-registry.json', 'utf8'));
          const ss = JSON.parse(fs.readFileSync('intelligence/runtime-evidence/runtime-capability-source-state.json', 'utf8'));
          const p = JSON.parse(fs.readFileSync('intelligence/runtime-evidence/runtime-reasoning-evidence.json', 'utf8'));
          const r = JSON.parse(fs.readFileSync('intelligence/risk/health-factor-intelligence.json', 'utf8'));

          if (a.version !== '0.1-runtime-owner-activation') throw new Error('unexpected runtime activation version');
          if (a.authority?.executionAuthority !== 'none' || a.authority?.readOnly !== true) throw new Error('runtime activation gained execution authority');
          const q7 = (a.units || []).find(x => x.unitId === 'owner-context:audio-owner-q:q7');
          if (!q7) throw new Error('Q7 runtime activation missing');
          if (r.status === 'ok' && (r.observations || []).some(x => x?.onchain?.status === 'ok')) {
            if (q7.runtimeStatus !== 'activated' || q7.runtimeCoverage !== 'partial') throw new Error('fresh HF primitive did not runtime-activate Q7 partially');
          }
          if (q7.declaredStatus !== 'blocked') throw new Error('durable declared Q7 disposition was silently mutated');
          if (q7.authority?.executionAuthority !== 'none' || q7.authority?.hardThresholdPolicy !== false) throw new Error('Q7 runtime activation gained policy authority');

          if (g.version !== '0.1-runtime-capability-graph-overlay') throw new Error('unexpected runtime capability overlay version');
          if (g.authority?.executionAuthority !== 'none' || g.authority?.readOnly !== true) throw new Error('runtime graph overlay gained execution authority');
          if (g.totals?.runtimeCapabilityCount < 1) throw new Error('no runtime capability node produced');
          if (g.totals?.riskObservationCount < 1) throw new Error('no runtime risk observation node produced');
          const edges = Object.values(g.catalog?.connections || {});
          if (!edges.some(x => x.kind === 'owner-runtime-capability' && x.from === 'owner-context:audio-owner-q:q7')) throw new Error('Q7 not bound to runtime capability');
          if (!edges.some(x => x.kind === 'capability-observes-risk')) throw new Error('runtime capability not bound to live risk observation');
          if (!edges.some(x => x.kind === 'risk-observation-company')) throw new Error('live risk observation not bound to company');

          if (reg.version !== '0.2-runtime-evidence-capability-registry') throw new Error('unexpected capability registry version');
          if (reg.authority?.executionAuthority !== 'none' || reg.authority?.automaticCapabilityActivation !== false) throw new Error('capability registry authority drift');
          if ((reg.capabilities || []).length < 5) throw new Error('capability registry unexpectedly narrow');
          for (const id of ['health-factor-monitoring','claimable-rewards-observation','reference-productivity-observation','realised-cash-flow-observation','embedded-yield-observation']) {
            if (!(reg.capabilities || []).some(x => x.capabilityId === id)) throw new Error(`missing registered capability family: ${id}`);
          }

          if (ss.version !== '0.2-runtime-capability-source-state') throw new Error('unexpected capability source-state version');
          if (ss.authority?.executionAuthority !== 'none' || ss.authority?.automaticCapabilityActivation !== false) throw new Error('source-state authority drift');
          const hfState = (ss.capabilities || []).find(x => x.capabilityId === 'health-factor-monitoring');
          if (!hfState || hfState.sourceExists !== true || hfState.schemaInspected !== true || hfState.fresh !== true || hfState.adapterReady !== true) throw new Error('HF registry source state is not current/ready');
          const rewardsState = (ss.capabilities || []).find(x => x.capabilityId === 'claimable-rewards-observation');
          if (!rewardsState || rewardsState.sourceExists !== true || rewardsState.schemaInspected !== false || rewardsState.adapterReady !== false) throw new Error('Rewards source must remain schema-pending and non-emitting');

          if (p.version !== '0.2-runtime-reasoning-evidence') throw new Error('unexpected runtime reasoning packet version');
          if (p.authority?.executionAuthority !== 'none' || p.authority?.readOnly !== true || p.authority?.automaticCapabilityActivation !== false) throw new Error('runtime reasoning packet authority drift');
          if (p.registry?.version !== reg.version || p.summary?.registeredCapabilityCount < 5) throw new Error('runtime packet not registry-bound');
          const cap = (p.capabilities || []).find(x => x.capabilityId === 'health-factor-monitoring');
          if (!cap || cap.runtimeStatus !== 'activated' || cap.runtimeCoverage !== 'partial') throw new Error('HF capability missing from reasoning packet');
          if (!Array.isArray(cap.observations) || cap.observations.length < 1) throw new Error('reasoning packet has no live HF observation');
          const monetra = cap.observations.find(x => x.companyRegistry === '008');
          if (!monetra) throw new Error('Monetra live HF observation missing from reasoning packet');
          if (monetra.debtPresent === false && monetra.healthFactor !== null) throw new Error('zero-debt HF semantics corrupted in reasoning packet');
          if ((p.capabilities || []).some(x => x.capabilityId === 'claimable-rewards-observation')) throw new Error('schema-unbound Rewards capability leaked into active packet');
          if (!p.integrity?.packetHash || !p.integrity?.capabilityRegistryHash || !p.integrity?.capabilitySourceStateHash || !g.integrity?.overlayHash || !a.integrity?.runtimeActivationHash) throw new Error('runtime integrity hashes missing');

          console.log('Runtime Evidence Registry v0.2 PASS', {
            q7Declared: q7.declaredStatus,
            q7Runtime: q7.runtimeStatus,
            q7Coverage: q7.runtimeCoverage,
            registeredCapabilities: p.summary.registeredCapabilityCount,
            activeCapabilities: p.summary.activeCapabilityCount,
            sourcePresent: ss.summary.sourcePresentCount,
            schemaPending: ss.summary.schemaPendingCount,
            packetObservations: p.summary.observationCount,
            monetraState: monetra.state,
            monetraHealthFactor: monetra.healthFactor,
            executionAuthority: p.authority.executionAuthority
          });
          NODE
          git diff --check

      - name: Publish runtime activation state
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          GENERATED=(
            "intelligence/owner-context/runtime-owner-activation.json"
            "intelligence/neural-graph/runtime-capability-overlay.json"
            "intelligence/runtime-evidence/runtime-capability-source-state.json"
            "intelligence/runtime-evidence/runtime-reasoning-evidence.json"
          )
          for f in "${GENERATED[@]}"; do test -s "$f"; done

          git config user.name "The Holding Runtime Activation"
          git config user.email "runtime-activation@theholding.ai"
          git add "${GENERATED[@]}"

          staged_bad="$(git diff --cached --name-only | grep -Ev '^(intelligence/owner-context/runtime-owner-activation\.json|intelligence/neural-graph/runtime-capability-overlay\.json|intelligence/runtime-evidence/runtime-capability-source-state\.json|intelligence/runtime-evidence/runtime-reasoning-evidence\.json)$' || true)"
          if [ -n "$staged_bad" ]; then
            echo "ERROR: Runtime Activation attempted to stage outside generated boundary:"
            echo "$staged_bad"
            exit 1
          fi

          if git diff --cached --quiet; then
            echo "Runtime activation state already current."
            exit 0
          fi

          git commit -m "intelligence: refresh runtime owner activation"

          for attempt in 1 2 3; do
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "Runtime activation publish conflict; refusing to guess."
              exit 1
            fi

            node intelligence/owner-context/runtime-owner-activation.mjs
            node intelligence/neural-graph/runtime-capability-overlay.mjs
            node intelligence/runtime-evidence/runtime-capability-source-state.mjs
            node intelligence/runtime-evidence/runtime-reasoning-evidence.mjs
            git add "${GENERATED[@]}"
            if ! git diff --cached --quiet; then git commit --amend --no-edit; fi

            if git push origin HEAD:main; then
              git fetch origin main
              test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
              echo "Verified runtime activation state on remote main."
              exit 0
            fi
            echo "Main moved during push; retrying ($attempt/3)..."
            sleep $((attempt * 2))
          done

          echo "ERROR: unable to publish Runtime Activation state after 3 attempts."
          exit 1
