name: Verify Accounting Income Lifecycle Contract

on:
  pull_request:
    paths:
      - 'reporting/accounting-income-lifecycle-contract.json'
      - 'reporting/accounting-income-lifecycle-contract-validation.mjs'
      - 'reporting/canonical-earned-income-view.mjs'
      - 'reporting/income-ledger.mjs'
      - '.github/workflows/verify-accounting-income-lifecycle-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: Static validation
        shell: bash
        run: |
          set -euo pipefail
          node --check reporting/accounting-income-lifecycle-contract-validation.mjs
          node --check reporting/canonical-earned-income-view.mjs
          test -s reporting/accounting-income-lifecycle-contract.json
          git diff --check

      - name: Validate lifecycle semantics against canonical recognition code
        shell: bash
        run: |
          set -euo pipefail
          node reporting/accounting-income-lifecycle-contract-validation.mjs

      - name: Guard no execution or accounting authority expansion
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs');
          const x=JSON.parse(fs.readFileSync('reporting/accounting-income-lifecycle-contract.json','utf8'));
          if(x.authority?.sourceOfTruth!==false||x.authority?.incomeCreationAuthority!==false||x.authority?.accountingCompletionAuthority!==false||x.authority?.monthClosingAuthority!==false||x.authority?.canReplaceUnknown!==false||x.authority?.executionAuthority!=='none'||x.authority?.capitalExecution!==false||x.authority?.walletAuthority!==false) throw new Error('lifecycle authority expanded');
          if(x.recognitionContract?.unknownIsNotZero!==true||x.recognitionContract?.crossMonthTimeProrationCreatesIncome!==false||x.recognitionContract?.referenceAprCreatesFactualIncome!==false||x.recognitionContract?.economicIncomeRecognizedAtMostOnce!==true) throw new Error('lifecycle epistemic contract drift');
          console.log('Accounting income lifecycle authority guard PASS',x.lifecycle.join(' -> '));
          NODE
