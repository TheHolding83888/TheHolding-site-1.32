name: Resume Unified Capital After Capital Guard Change

on:
  push:
    branches: [main]
    paths:
      - 'productivity/fxn-locker-apr-guard.mjs'
      - 'intelligence/capital-state/general-company-balance-sheet.mjs'
      - 'intelligence/capital-state/general-balance-market-data-consumer-contract-validation.mjs'
      - '.github/workflows/resume-unified-capital-after-fxn-guard.yml'

permissions:
  contents: read
  actions: write

concurrency:
  group: unified-capital-guard-resume
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout canonical main
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: main

      - name: Verify capital guards are present and syntactically valid
        run: |
          set -euo pipefail
          test -s productivity/fxn-locker-apr-guard.mjs
          test -s intelligence/capital-state/general-company-balance-sheet.mjs
          test -s intelligence/capital-state/general-balance-market-data-consumer-contract-validation.mjs
          node --check productivity/fxn-locker-apr-guard.mjs
          node --check intelligence/capital-state/general-company-balance-sheet.mjs
          node --check intelligence/capital-state/general-balance-market-data-consumer-contract-validation.mjs

      - name: Dispatch canonical Unified Capital writer
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run unified-capital-refresh.yml --ref main
