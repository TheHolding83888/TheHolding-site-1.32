name: Resume Unified Capital After f(x) Guard Change

on:
  push:
    branches: [main]
    paths:
      - 'productivity/fxn-locker-apr-guard.mjs'
      - '.github/workflows/resume-unified-capital-after-fxn-guard.yml'

permissions:
  contents: read
  actions: write

concurrency:
  group: unified-capital-fxn-guard-resume
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout canonical main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      - name: Verify exact f(x) guard is present
        run: |
          set -euo pipefail
          test -s productivity/fxn-locker-apr-guard.mjs
          node --check productivity/fxn-locker-apr-guard.mjs

      - name: Dispatch canonical Unified Capital writer
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run unified-capital-refresh.yml --ref main
