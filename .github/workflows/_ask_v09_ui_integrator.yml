name: "Ask candidate · v0.9 UI Integrator"

on:
  push:
    branches: [agents/ask-owner-brief-v0.9-20260815]
    paths:
      - '.github/workflows/_ask_v09_ui_integrator.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Checkout candidate
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: agents/ask-owner-brief-v0.9-20260815
          fetch-depth: 0

      - name: Sync fresh main, apply UI evolution, self-clean
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "The Holding Production Integrator"
          git config user.email "production-integrator@theholding.ai"
          git fetch origin main
          git merge --no-edit origin/main
          node verification/ask-experience/patch-ask-v0.9-interface.mjs
          node --check agents/console/app.js
          grep -F "THE HOLDING // CAPITAL OS INTELLIGENCE" agents/index.html >/dev/null
          grep -F "Ask maturity" agents/index.html >/dev/null
          grep -F "Synthesizing" agents/index.html >/dev/null
          grep -F "/agents/console/app.js?v=0.9" agents/index.html >/dev/null
          grep -F "Дай owner brief" agents/console/app.js >/dev/null
          rm -f verification/ask-experience/patch-ask-v0.9-interface.mjs
          rm -f .github/workflows/_ask_v09_ui_integrator.yml
          git add -A
          git diff --check --cached
          git commit -m "Ask v0.9: evolve console with visible synthesis maturity"
          git push origin HEAD:agents/ask-owner-brief-v0.9-20260815
