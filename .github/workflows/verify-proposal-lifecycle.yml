name: "The Holding Brain · Verify Proposal Lifecycle"

on:
  pull_request:
    branches: [main]
    paths:
      - 'intelligence/proposals/**'
      - 'intelligence/learning-state/learning-context.json'
      - 'intelligence/learning/decision-ledger.json'
      - '.github/workflows/update-proposal-work-queue.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout candidate
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Verify source-change materialization trigger boundary
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('fs');
          const workflow = fs.readFileSync('.github/workflows/update-proposal-work-queue.yml', 'utf8');
          const onStart = workflow.indexOf('on:\n');
          const permissionsStart = workflow.indexOf('\npermissions:');
          if (onStart < 0 || permissionsStart < 0) throw new Error('Unable to isolate Proposal trigger block');
          const trigger = workflow.slice(onStart, permissionsStart);
          const required = [
            'push:',
            'branches: [main]',
            '.github/workflows/update-proposal-work-queue.yml',
            'intelligence/proposals/proposal-policy.json',
            'intelligence/proposals/proposal-schema.json',
            'intelligence/proposals/proposal-engine.mjs',
            'intelligence/proposals/independent-proposal-reviewer.mjs',
            'intelligence/proposals/proposal-decision-policy.json',
            'intelligence/proposals/proposal-decision-bridge.mjs',
            'intelligence/proposals/independent-proposal-decision-reviewer.mjs',
            'intelligence/proposals/proposal-release-guard.mjs',
            'intelligence/proposals/proposal-release.json',
          ];
          for (const token of required) {
            if (!trigger.includes(token)) throw new Error(`Missing Proposal source-change trigger token: ${token}`);
          }
          for (const generated of [
            'proposal-queue.json',
            'proposal-brief.md',
            'proposal-eval.json',
            'proposal-decision-eval.json',
          ]) {
            if (trigger.includes(generated)) throw new Error(`Generated Proposal output would recursively wake writer: ${generated}`);
          }
          if (!workflow.includes("github.event_name == 'push' && github.ref == 'refs/heads/main'")) {
            throw new Error('Proposal job does not authorize bounded main push wakeup');
          }
          console.log('Proposal source-change materialization trigger PASS');
          NODE

      - name: Report Proposal static release bytes
        shell: bash
        run: |
          set -euo pipefail
          FILES=(
            '.github/workflows/update-proposal-work-queue.yml'
            'intelligence/proposals/README.md'
            'intelligence/proposals/proposal-policy.json'
            'intelligence/proposals/proposal-schema.json'
            'intelligence/proposals/proposal-engine.mjs'
            'intelligence/proposals/independent-proposal-reviewer.mjs'
            'intelligence/proposals/proposal-decision-policy.json'
            'intelligence/proposals/proposal-decision-bridge.mjs'
            'intelligence/proposals/independent-proposal-decision-reviewer.mjs'
          )
          for f in "${FILES[@]}"; do
            printf '%s sha256=' "$f"
            sha256sum "$f" | awk '{print $1}'
            printf '%s bytes=' "$f"
            wc -c < "$f" | tr -d ' '
          done

      - name: Static release coherence
        run: node intelligence/proposals/proposal-release-guard.mjs

      - name: Syntax preflight
        shell: bash
        run: |
          set -euo pipefail
          node --check intelligence/proposals/proposal-engine.mjs
          node --check intelligence/proposals/proposal-decision-bridge.mjs
          node --check intelligence/proposals/independent-proposal-reviewer.mjs
          node --check intelligence/proposals/independent-proposal-decision-reviewer.mjs
          node --check intelligence/reliability/proposal-material-change-definition-proof.mjs
          node intelligence/reliability/proposal-material-change-definition-proof.mjs

      - name: Classify current Proposal source coherence
        id: source_coherence
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('fs');
          const crypto = require('crypto');
          const sha = p => crypto.createHash('sha256').update(fs.readFileSync(p)).digest('hex');
          const stack = JSON.parse(fs.readFileSync('intelligence/cognitive-stack-state.json','utf8'));
          const learning = JSON.parse(fs.readFileSync('intelligence/learning-state/learning-context.json','utf8'));
          const ledger = JSON.parse(fs.readFileSync('intelligence/learning/decision-ledger.json','utf8'));
          const reasons = [];
          if (stack.readyForManualInterpretation !== true) reasons.push('cognitive-stack-not-ready');
          if (stack.operatingContract?.executionAuthority !== 'none') reasons.push('execution-authority-changed');
          if (learning.status !== 'ready') reasons.push(`learning-status-${learning.status ?? 'missing'}`);
          if (learning.source?.cognitiveChainHash !== stack.integrity?.chainHash) reasons.push('learning-cognitive-chain-mismatch');
          if (learning.source?.decisionLedgerHash !== ledger.integrity?.ledgerHash) reasons.push('learning-decision-ledger-mismatch');
          if (stack.chain?.groundedBrain?.sha256 && stack.chain.groundedBrain.sha256 !== sha('intelligence/brain-intelligence.json')) reasons.push('brain-cognitive-byte-mismatch');
          const coherent = reasons.length === 0;
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `coherent=${coherent ? 'true' : 'false'}\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `reason=${coherent ? 'coherent-input' : reasons.join(',')}\n`);
          console.log('Proposal source coherence', {
            coherent,
            reasons,
            learningGeneratedAt: learning.generatedAt ?? null,
            learningCognitiveChainHash: learning.source?.cognitiveChainHash ?? null,
            currentCognitiveChainHash: stack.integrity?.chainHash ?? null,
          });
          NODE

      - name: Build current Proposal state in read-only workspace
        if: ${{ steps.source_coherence.outputs.coherent == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          node intelligence/proposals/proposal-engine.mjs
          node intelligence/proposals/proposal-decision-bridge.mjs
          node intelligence/proposals/independent-proposal-reviewer.mjs
          node intelligence/proposals/independent-proposal-decision-reviewer.mjs

      - name: Verify current-variant and no-execution invariants
        if: ${{ steps.source_coherence.outputs.coherent == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('fs');
          const crypto = require('crypto');
          const sha = v => crypto.createHash('sha256').update(v).digest('hex');
          const keyForCase = c => sha([
            c?.caseKey,
            c?.recommendationClass,
            c?.entity,
            c?.domain,
            c?.category,
          ].map(x => String(x ?? '')).join('|')).slice(0, 24);
          const q = JSON.parse(fs.readFileSync('intelligence/proposals/proposal-queue.json','utf8'));
          const learning = JSON.parse(fs.readFileSync('intelligence/learning-state/learning-context.json','utf8'));
          const eval1 = JSON.parse(fs.readFileSync('intelligence/proposals/proposal-eval.json','utf8'));
          const eval2 = JSON.parse(fs.readFileSync('intelligence/proposals/proposal-decision-eval.json','utf8'));
          const activeLearning = (learning.activeCases ?? []).filter(c => c.experienceEligibility === 'decision-worthy');
          const expected = new Map(activeLearning.map(c => [c.caseKey, keyForCase(c)]));
          const active = (q.proposals ?? []).filter(p => !['REJECTED','SUPERSEDED','RELEASED'].includes(p.state));
          const seenCases = new Set();
          for (const p of active) {
            const caseKey = p.source?.caseKey;
            if (seenCases.has(caseKey)) throw new Error(`Multiple active Proposal variants for ${caseKey}`);
            seenCases.add(caseKey);
            if (p.proposalKey !== expected.get(caseKey)) throw new Error(`Active Proposal is not current semantic variant: ${p.proposalId}`);
            if (p.source?.cognitiveChainHash !== q.source?.cognitiveChainHash) throw new Error(`Active Proposal chain mismatch: ${p.proposalId}`);
          }
          if (active.length !== activeLearning.length) throw new Error(`Active Proposal/current Learning mismatch: ${active.length} vs ${activeLearning.length}`);
          if (eval1.status !== 'pass' || eval2.status !== 'pass') throw new Error('Proposal reviewer did not PASS');
          if (q.constraints?.noProductionExecution !== true || q.constraints?.noAutomaticCodeChanges !== true || q.constraints?.noAutomaticApprovals !== true) throw new Error('Proposal execution boundary changed');
          if (q.decisionBridge?.productionMutationAuthorized !== false || q.decisionBridge?.executionAuthority !== 'none') throw new Error('Decision Bridge authority changed');
          console.log('Proposal lifecycle current-variant invariant PASS', {
            activeLearningCases: activeLearning.length,
            activeProposalVariants: active.length,
            historicalDecisionBound: q.summary?.historicalDecisionBoundCount,
            ownerApprovedCurrent: q.summary?.ownerApprovedCount,
            executionAuthority: q.decisionBridge?.executionAuthority
          });
          NODE
          git diff --check

      - name: Verify stale-source lifecycle remains fail-closed
        if: ${{ steps.source_coherence.outputs.coherent != 'true' }}
        shell: bash
        env:
          STALE_REASON: ${{ steps.source_coherence.outputs.reason }}
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('fs');
          const q = JSON.parse(fs.readFileSync('intelligence/proposals/proposal-queue.json','utf8'));
          const workflow = fs.readFileSync('.github/workflows/update-proposal-work-queue.yml','utf8');
          const gateToken = "input_readiness.outputs.ready == 'true'";
          if (q.constraints?.noProductionExecution !== true || q.constraints?.noAutomaticCodeChanges !== true || q.constraints?.noAutomaticApprovals !== true) throw new Error('Persisted Proposal execution boundary changed');
          if (q.decisionBridge?.productionMutationAuthorized !== false || q.decisionBridge?.executionAuthority !== 'none') throw new Error('Persisted Proposal authority boundary changed');
          for (const token of [
            'id: input_readiness',
            gateToken,
            'Proposal skipped safely: coherent Learning input is not available yet.',
            'No Proposal state was rebuilt or published from stale Learning input.',
          ]) {
            if (!workflow.includes(token)) throw new Error(`Proposal stale-source contract missing: ${token}`);
          }
          const gatedStepNames = [
            'Verify exact Proposal release and material-change contract',
            'Verify exact Learning → Cognitive binding',
            'Snapshot prior reviewed Proposal packet',
            'Build machine-readable Proposal Work Queue',
            'Reflect owner Decision Memory into Proposal states',
            'Independent Proposal reviewer',
            'Independent Decision → Proposal reviewer',
            'Verify queue remains non-executable',
            'Apply Proposal material-change gate',
            'Publish Proposal state safely'
          ];
          for (const stepName of gatedStepNames) {
            const stepIndex = workflow.indexOf(`- name: ${stepName}`);
            if (stepIndex < 0) throw new Error(`Proposal stale-source contract missing step: ${stepName}`);
            const nextStep = workflow.indexOf('\n      - name:', stepIndex + 1);
            const stepText = workflow.slice(stepIndex, nextStep < 0 ? workflow.length : nextStep);
            if (!stepText.includes(gateToken)) throw new Error(`Proposal stale-source gate missing from ${stepName}`);
          }
          console.log('Proposal lifecycle stale-source safe-skip PASS', {
            reason: process.env.STALE_REASON || 'unknown',
            rebuildAuthorized: false,
            publicationAuthorized: false,
            executionAuthority: 'none'
          });
          NODE
          git diff --check
