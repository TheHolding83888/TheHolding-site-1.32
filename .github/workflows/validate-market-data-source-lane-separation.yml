name: "Validate Market Data Source Lane Separation"

on:
  pull_request:
    paths:
      - 'intelligence/market-data/market-data-engine.mjs'
      - 'intelligence/market-data/market-data.json'
      - 'intelligence/market-data/market-data-coingecko.json'
      - 'intelligence/market-data/market-data-validation-fixture.mjs'
      - 'intelligence/market-data/coingecko-fetch-shim.mjs'
      - 'intelligence/market-data/market-data-authority-policy.json'
      - 'intelligence/market-data/market-data-authority-materializer.mjs'
      - '.github/workflows/market-data-refresh.yml'
      - '.github/workflows/validate-market-data-source-lane-separation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout PR head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Validate isolated CoinGecko fallback lane and canonical consumer authority
        run: |
          set -euo pipefail
          node --check intelligence/market-data/market-data-engine.mjs
          node --check intelligence/market-data/market-data-validation-fixture.mjs
          node --check intelligence/market-data/coingecko-fetch-shim.mjs
          node intelligence/market-data/market-data-validation-fixture.mjs
          node - <<'NODE'
          const fs=require('fs');
          const source=JSON.parse(fs.readFileSync('intelligence/market-data/market-data-coingecko.json','utf8'));
          const canonical=JSON.parse(fs.readFileSync('intelligence/market-data/market-data.json','utf8'));
          const policy=JSON.parse(fs.readFileSync('intelligence/market-data/market-data-authority-policy.json','utf8'));
          const shim=fs.readFileSync('intelligence/market-data/coingecko-fetch-shim.mjs','utf8');

          // CoinGecko remains an isolated source/fallback lane. It must never
          // contain materialized onchain authority metadata.
          if(source.semantics?.dedicatedCoinGeckoSourceLane!==true)throw new Error('Dedicated CoinGecko source lane missing');
          if(Object.keys(source.prices||{}).length!==26)throw new Error('Source lane coverage drift');
          for(const row of Object.values(source.prices||{})){
            if(row.authority?.selectedLane==='onchain'||String(row.source||'').startsWith('onchain-'))throw new Error('Onchain authority leaked into CoinGecko source lane');
          }

          // Downstream compatibility must consume canonical Market Data, not
          // bypass the authority selector by reading the daily source lane.
          if(!shim.includes("const SNAPSHOT = path.join(__dirname, 'market-data.json')"))throw new Error('Compatibility shim must read canonical Market Data');
          if(shim.includes("const SNAPSHOT = path.join(__dirname, 'market-data-coingecko.json')"))throw new Error('Compatibility shim must not read isolated CoinGecko source lane');
          if(!shim.includes("'x-the-holding-external-request': '0'"))throw new Error('Compatibility shim zero-external-request proof missing');

          // The validation fixture is intentionally deterministic rather than
          // onchain-selected; its purpose here is to prove source separation.
          if(canonical.validationFixture!==true)throw new Error('Deterministic canonical validation fixture missing');
          if(canonical.semantics?.externalRequestCount!==0)throw new Error('Canonical validation fixture made an external request');

          if(policy.defaultProductionAuthority!=='coingecko-lane')throw new Error('Unpromoted-asset fallback default drift');
          if(policy.semantics?.coinGeckoRemainsFallbackAndSanityCheck!==true)throw new Error('CoinGecko fallback/sanity contract missing');
          if(policy.globalOnchainPromotionEnabled!==true)throw new Error('Per-asset onchain promotion disabled');
          console.log('CoinGecko fallback-lane isolation + canonical consumer authority PASS',{assetCount:26,pilot:policy.pilot?.assetIds});
          NODE
          git diff --check
