name: "Project YieldRing Canonical Capital State"

# Legacy bounded recovery path. Automatic projection is owned by
# "The Holding Capital · Unified Refresh".
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: yieldring-capital-projection-main
  cancel-in-progress: false

jobs:
  project:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout canonical main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Project YieldRing public and capital surfaces
        run: |
          set -euo pipefail
          node --check companies/yieldring-public-capital-projection.mjs
          node companies/yieldring-public-capital-projection.mjs
          node - <<'NODE'
          const fs=require('fs');
          const s=JSON.parse(fs.readFileSync('companies/yieldring-canonical-state.json','utf8'));
          const html=fs.readFileSync('companies/index.html','utf8');
          const page=fs.readFileSync('yieldring/index.html','utf8');
          const bal=fs.readFileSync('intelligence/capital-state/general-company-balance-sheet.mjs','utf8');
          if(!html.includes("qty: 0.0334")||!html.includes("qty: 678")||!html.includes("managerId: '10298'"))throw new Error('YieldRing Company Book projection missing');
          if(!page.includes("qty: 0.0334")||!page.includes("qty: 678")||!page.includes('2 locks · Maxi relay'))throw new Error('YieldRing dedicated page projection missing');
          if(!bal.includes("qty:0.0334")||!bal.includes("qty:678"))throw new Error('YieldRing General Balance projection missing');
          if(s.authority?.executionAuthority!=='none')throw new Error('YieldRing authority drift');
          NODE
          git diff --check
      - name: Publish recovery projection safely
        run: |
          set -euo pipefail
          git config user.name "The Holding YieldRing Projector"
          git config user.email "yieldring-projector@theholding.ai"
          git add companies/index.html yieldring/index.html intelligence/capital-state/general-company-balance-sheet.mjs
          if git diff --cached --quiet; then echo "YieldRing projection already current."; exit 0; fi
          git commit -m "data: project YieldRing canonical capital state"
          for attempt in 1 2 3; do
            git fetch origin main
            if ! git rebase origin/main; then git rebase --abort || true; echo "YieldRing projection conflict; fail closed."; exit 1; fi
            node companies/yieldring-public-capital-projection.mjs
            git add companies/index.html yieldring/index.html intelligence/capital-state/general-company-balance-sheet.mjs
            git commit --amend --no-edit
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1
