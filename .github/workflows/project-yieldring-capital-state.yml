# holding-workflow-definition-proof: intelligence/reliability/yieldring-recovery-workflow-definition-proof.mjs
name: "Project YieldRing Canonical Capital State"

# Legacy bounded recovery path. Automatic production projection is owned by
# "The Holding Capital · Unified Refresh". This entrypoint remains available
# only as a read-only diagnostic replay.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: yieldring-capital-projection-main
  cancel-in-progress: false

jobs:
  project:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout canonical main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Replay YieldRing public and capital projection diagnostically
        run: |
          set -euo pipefail
          node --check companies/yieldring-public-capital-projection.mjs
          node companies/yieldring-public-capital-projection.mjs
          node - <<'NODE'
          const fs=require('fs');
          const s=JSON.parse(fs.readFileSync('companies/yieldring-canonical-state.json','utf8'));
          const html=fs.readFileSync('companies/index.html','utf8');
          const page=fs.readFileSync('yieldring/index.html','utf8');
          const bal=fs.readFileSync('intelligence/capital-state/general-company-balance-sheet.mjs','utf8');
          if(!html.includes("qty: 0.0334")||!html.includes("qty: 678")||!html.includes("managerId: '10298'"))throw new Error('YieldRing Company Book projection missing');
          if(!page.includes("qty: 0.0334")||!page.includes("qty: 678")||!page.includes('2 locks · Maxi relay'))throw new Error('YieldRing dedicated page projection missing');
          if(!bal.includes("qty:0.0334")||!bal.includes("qty:678"))throw new Error('YieldRing General Balance projection missing');
          if(s.authority?.executionAuthority!=='none')throw new Error('YieldRing authority drift');
          console.log('YieldRing diagnostic projection PASS',{repositoryMutation:false,canonicalWriter:'The Holding Capital · Unified Refresh',executionAuthority:'none'});
          NODE
          git diff --check
      - name: Verify diagnostic replay without repository publication
        run: |
          set -euo pipefail
          echo 'YieldRing recovery replay is intentionally repository read-only.'
          git status --short
          git diff --check
