# THE HOLDING · MONETRA COMPANY #008 STABLE FINAL-THREE RESOLVER v1.2
name: "Resolve Company #008"

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: resolve-company-008
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify resolver source/input sync
        run: |
          set -euo pipefail
          grep -F "const VERSION = '1.2-company-008-stable-final-three-reconciliation';" onboarding/company-008-resolve.mjs
          test -s companies/company-008-resolve.json
          node - <<'NODE'
          const fs = require('fs');
          const d = JSON.parse(fs.readFileSync('companies/company-008-resolve.json','utf8'));
          if (d.version !== '1.1-company-008-stable-wrapper-reconciliation') throw new Error('v1.2 requires fresh v1.1 resolver input, got ' + d.version);
          if (d.company?.registry !== '008' || d.company?.name !== 'Monetra.eth') throw new Error('Company #008 identity mismatch');
          if (d.company?.founding?.date !== '2026-05-27') throw new Error('founding regression');
          if ((d.stableCapital?.positions || []).length < 7) throw new Error('expected solved v1.1 stable positions');
          console.log('Fresh v1.1 input verified.');
          NODE

      - name: Install resolver dependencies
        run: npm install --no-save ethers@6

      - name: Resolve final Monetra Stable Capital delta
        env:
          ETH_RPC_URL: ${{ secrets.ETH_RPC_URL }}
          ETH_RPC_URL_2: ${{ secrets.ETH_RPC_URL_2 }}
          COMPANY_008_RESOLVE_INPUT: companies/company-008-resolve.json
          COMPANY_008_RESOLVE_OUTPUT: companies/company-008-resolve.json
        run: node onboarding/company-008-resolve.mjs

      - name: Validate generated JSON
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const p = 'companies/company-008-resolve.json';
          const d = JSON.parse(fs.readFileSync(p, 'utf8'));
          if (d.version !== '1.2-company-008-stable-final-three-reconciliation') throw new Error('unexpected version: ' + d.version);
          if (d.company?.registry !== '008' || d.company?.name !== 'Monetra.eth') throw new Error('identity mismatch');
          if (d.company?.founding?.date !== '2026-05-27') throw new Error('founding regression');
          if (d.preservation?.priorResolverVersion !== '1.1-company-008-stable-wrapper-reconciliation') throw new Error('prior-version preservation failed');
          if (!(d.preservation?.priorStablePositionCount >= 7)) throw new Error('prior stable positions not preserved');
          if (!d.ownerHintCoverage?.checks?.['Yearn V3']) throw new Error('Yearn ysyBOLD classification missing');
          if (!d.ownerHintCoverage?.checks?.['Lido']) throw new Error('Lido earnUSD missing');
          if (!d.ownerHintCoverage?.checks?.['Frax Finance']) throw new Error('Frax sfrxUSD missing');
          if (!d.ownerHintCoverage?.checks?.['Liquity V2']) throw new Error('Liquity V2 direct SP position missing');
          if ((d.ownerHintCoverage?.aaveEvidenceCount || 0) < 2) throw new Error('Aave two-position regression');
          const total = Number(d.stableCapital?.summary?.totalUsd);
          if (!(total > 85 && total < 120)) throw new Error('Stable Capital total outside broad evidence band: ' + total);
          if (!Array.isArray(d.stableCapital?.accruedRewardsCandidates)) throw new Error('Liquity reward-boundary candidates missing');
          console.log('Monetra v1.2 structurally valid.');
          console.log('Stable Capital:', d.stableCapital.summary);
          console.log('Delta:', d.stableCapital.reconciliation);
          console.log('Hints:', d.ownerHintCoverage);
          console.log('Liquity:', d.resolutionV12.liquity.branches);
          console.log('Readiness:', d.productionReadiness);
          NODE

      - name: Publish resolver JSON to main
        shell: bash
        run: |
          set -euo pipefail
          FILE="companies/company-008-resolve.json"
          test -s "$FILE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f "$FILE"
          if ! git diff --cached --quiet -- "$FILE"; then
            git commit -m "Resolve Monetra Company #008 final Stable Capital delta"
          else
            echo "Resolver output unchanged."
          fi
          for attempt in 1 2 3; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then break; fi
            git rebase --abort || true
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            sleep $((attempt * 2))
          done
          git fetch origin main
          git cat-file -e "origin/main:$FILE"
          REMOTE_VERSION="$(git show "origin/main:$FILE" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>console.log(JSON.parse(s).version))")"
          test "$REMOTE_VERSION" = "1.2-company-008-stable-final-three-reconciliation" || { echo "remote version mismatch: $REMOTE_VERSION"; exit 1; }
          echo "Verified on origin/main: $FILE @ $REMOTE_VERSION"
