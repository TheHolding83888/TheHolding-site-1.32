name: "Resolve Company #008"

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: resolve-company-008
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify resolver source/workflow sync
        run: |
          grep -F "const VERSION = '1.4-company-008-aerodrome-ve-rewards-weth-final-pass';" onboarding/company-008-resolve.mjs
          echo "Resolver/source sync OK: Company #008 targeted resolver v1.4"

      - name: Install dependency
        run: npm install --no-save ethers@6

      - name: Resolve final Company #008 Aerodrome WETH classification
        env:
          BASE_RPC_URL: ${{ secrets.BASE_RPC_URL }}
          BASE_RPC_URL_2: ${{ secrets.BASE_RPC_URL_2 }}
          COMPANY_008_RESOLVE_OUTPUT: companies/company-008-resolve.json
        run: node onboarding/company-008-resolve.mjs

      - name: Validate resolver JSON
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const p = 'companies/company-008-resolve.json';

          if (!fs.existsSync(p)) throw new Error('resolver JSON missing');
          const d = JSON.parse(fs.readFileSync(p, 'utf8'));

          if (d.version !== '1.4-company-008-aerodrome-ve-rewards-weth-final-pass') {
            throw new Error('resolver version mismatch: ' + d.version);
          }
          if (d.company?.registry !== '008') throw new Error('registry mismatch');
          if (d.company?.name !== '1milliondollar.eth') throw new Error('company mismatch');
          if (Number(d.finalCandidateTotals?.btc) !== 0.07264572) {
            throw new Error('preserved BTC mismatch: ' + d.finalCandidateTotals?.btc);
          }
          if (!d.results?.directVenftRewards) throw new Error('direct veNFT reward result missing');
          if (!d.results?.managedRelayDiagnostic) throw new Error('managed Relay diagnostic missing');
          if (!d.classification?.accountingMode) throw new Error('accounting classification missing');
          if (!Array.isArray(d.resolution?.unresolved)) throw new Error('resolution schema missing');

          console.log('Validated Company #008 targeted resolver v1.4');
          console.log('Accounting mode:', d.classification.accountingMode);
          console.log('Direct WETH rewards:', d.classification.directWethRewards);
          console.log('Managed WETH diagnostic:', d.classification.managedRelayWethDiagnostic);
          console.log('Fallback WETH:', d.classification.ownerDeclaredFoundationFallbackWeth);
          console.log('Final totals:', d.finalCandidateTotals);
          console.log('Resolution:', d.resolution);
          NODE

      - name: Publish resolver JSON to main
        shell: bash
        run: |
          set -euo pipefail

          FILE="companies/company-008-resolve.json"

          test -s "$FILE" || {
            echo "ERROR: resolver output missing or empty"
            exit 1
          }

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -f "$FILE"

          if ! git diff --cached --quiet -- "$FILE"; then
            git commit -m "Resolve Company #008 Aerodrome WETH rewards boundary"
          else
            echo "Resolver output unchanged."
          fi

          for attempt in 1 2 3; do
            git fetch origin main

            if git rebase origin/main && git push origin HEAD:main; then
              break
            fi

            git rebase --abort || true

            if [ "$attempt" -eq 3 ]; then
              echo "ERROR: failed to publish resolver after retries"
              exit 1
            fi

            sleep $((attempt * 2))
          done

          git fetch origin main

          git cat-file -e "origin/main:$FILE" || {
            echo "ERROR: resolver absent from origin/main"
            exit 1
          }

          REMOTE_VERSION="$(
            git show "origin/main:$FILE" |
            node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>console.log(JSON.parse(s).version))"
          )"

          test "$REMOTE_VERSION" = "1.4-company-008-aerodrome-ve-rewards-weth-final-pass" || {
            echo "ERROR: remote resolver version mismatch: $REMOTE_VERSION"
            exit 1
          }

          echo "Verified on origin/main: $FILE"
          echo "Remote resolver version: $REMOTE_VERSION"
