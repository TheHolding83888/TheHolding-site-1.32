# THE HOLDING COMPANY #008 TARGETED RESOLVER v1.0.1
name: "Resolve Company #008"

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: resolve-company-008
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify resolver source/workflow sync
        run: |
          grep -F "const VERSION = '1.0.1-company-008-address-normalization';" onboarding/company-008-resolve.mjs
          echo "Resolver/source sync OK: Company #008 targeted resolver v1.0.1"

      - name: Install dependency
        run: npm install --no-save ethers@6

      - name: Address normalization preflight
        run: |
          node - <<'NODE'
          const { getAddress } = require('ethers');
          const addresses = [
            '0x152b9d0fdc40c096757f570a51e494bd4b943e50',
            '0x89a415b3d20098e6a6c8f7a59001c67bd3129821',
            '0x5401b8620e5fb570064ca9114fd1e135fd77d57c',
            '0x3a4baabf4dc9910596821615e848f0e6545762f3',
            '0x2260fac5e5542a773aa44fbcfedf7c193bc2c599',
            '0x0555e30da8f98308edb960aa94c0db47230d2b9c',
            '0x4200000000000000000000000000000000000006'
          ];
          for (const a of addresses) {
            console.log(a, '->', getAddress(a));
          }
          NODE

      - name: Resolve only unresolved Company #008 components
        env:
          ETH_RPC_URL: ${{ secrets.ETH_RPC_URL }}
          ETH_RPC_URL_2: ${{ secrets.ETH_RPC_URL_2 }}
          BASE_RPC_URL: ${{ secrets.BASE_RPC_URL }}
          BASE_RPC_URL_2: ${{ secrets.BASE_RPC_URL_2 }}
          AVALANCHE_RPC_URL: ${{ secrets.AVALANCHE_RPC_URL }}
          COMPANY_008_RESOLVE_OUTPUT: companies/company-008-resolve.json
        run: node onboarding/company-008-resolve.mjs

      - name: Validate resolver JSON
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const p = 'companies/company-008-resolve.json';
          if (!fs.existsSync(p)) throw new Error('resolver JSON missing');

          const d = JSON.parse(fs.readFileSync(p, 'utf8'));

          if (d.version !== '1.0.1-company-008-address-normalization') {
            throw new Error('resolver version mismatch: ' + d.version);
          }
          if (d.company?.registry !== '008') throw new Error('registry mismatch');
          if (d.company?.name !== '1milliondollar.eth') throw new Error('company mismatch');
          if (!d.resolution || !Array.isArray(d.resolution.unresolved)) {
            throw new Error('resolution schema missing');
          }

          console.log('Validated Company #008 targeted resolver v1.0.1');
          console.log('Resolution:', d.resolution);
          NODE

      - name: Publish resolver JSON to main
        shell: bash
        run: |
          set -euo pipefail

          FILE="companies/company-008-resolve.json"

          test -s "$FILE" || {
            echo "ERROR: resolver output missing or empty"
            exit 1
          }

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f "$FILE"

          if ! git diff --cached --quiet -- "$FILE"; then
            git commit -m "Resolve Company #008 remaining balances"
          else
            echo "Resolver output unchanged."
          fi

          for attempt in 1 2 3; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then
              break
            fi

            git rebase --abort || true

            if [ "$attempt" -eq 3 ]; then
              echo "ERROR: failed to publish resolver after retries"
              exit 1
            fi

            sleep $((attempt * 2))
          done

          git fetch origin main
          git cat-file -e "origin/main:$FILE" || {
            echo "ERROR: workflow green guard failed; resolver absent from origin/main"
            exit 1
          }

          echo "Verified on origin/main: $FILE"
