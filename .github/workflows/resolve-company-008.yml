# THE HOLDING COMPANY #008 TARGETED RESOLVER v1.3 — AERODROME SUGAR WETH
name: "Resolve Company #008"

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: resolve-company-008
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify resolver source/workflow sync
        run: |
          grep -F "const VERSION = '1.3-company-008-aerodrome-sugar-base-weth-final';" onboarding/company-008-resolve.mjs
          echo "Resolver/source sync OK: Company #008 targeted resolver v1.3"

      - name: Install dependency
        run: npm install --no-save ethers@6

      - name: Address normalization preflight
        run: |
          node - <<'NODE'
          const { getAddress } = require('ethers');
          const addresses = [
            '0xe4b9c9ced406baffe406e63f83d39daaef150596',
            '0x4200000000000000000000000000000000000006',
            '0x69dd9db6d8f8e7d83887a704f447b1a584b599a1',
            '0x827922686190790b37229fd06084350e74485b72',
            '0xb2cc224c1c9fee385f8ad6a55b4d94e92359dc59'
          ];
          for (const address of addresses) {
            console.log(address, '->', getAddress(address));
          }
          NODE

      - name: Resolve final Company #008 Base WETH via Aerodrome Sugar
        env:
          BASE_RPC_URL: ${{ secrets.BASE_RPC_URL }}
          BASE_RPC_URL_2: ${{ secrets.BASE_RPC_URL_2 }}
          COMPANY_008_RESOLVE_OUTPUT: companies/company-008-resolve.json
        run: node onboarding/company-008-resolve.mjs

      - name: Validate resolver JSON
        run: |
          node - <<'NODE'
          const fs = require('fs');

          const p = 'companies/company-008-resolve.json';

          if (!fs.existsSync(p)) {
            throw new Error('resolver JSON missing');
          }

          const d = JSON.parse(fs.readFileSync(p, 'utf8'));

          if (
            d.version !==
            '1.3-company-008-aerodrome-sugar-base-weth-final'
          ) {
            throw new Error(
              'resolver version mismatch: ' + d.version
            );
          }

          if (d.company?.registry !== '008') {
            throw new Error('registry mismatch');
          }

          if (d.company?.name !== '1milliondollar.eth') {
            throw new Error('company mismatch');
          }

          if (!d.results?.baseWethAerodromeSlipstream) {
            throw new Error('Aerodrome WETH result missing');
          }

          if (
            !d.resolution
            || !Array.isArray(d.resolution.unresolved)
          ) {
            throw new Error('resolution schema missing');
          }

          console.log(
            'Validated Company #008 targeted resolver v1.3'
          );
          console.log('Resolution:', d.resolution);
          console.log(
            'Aerodrome WETH:',
            d.results.baseWethAerodromeSlipstream?.totals
          );
          console.log(
            'Final candidate totals:',
            d.finalCandidateTotals
          );
          NODE

      - name: Publish resolver JSON to main
        shell: bash
        run: |
          set -euo pipefail

          FILE="companies/company-008-resolve.json"

          test -s "$FILE" || {
            echo "ERROR: resolver output missing or empty"
            exit 1
          }

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -f "$FILE"

          if ! git diff --cached --quiet -- "$FILE"; then
            git commit -m "Resolve Company #008 Aerodrome Base WETH"
          else
            echo "Resolver output unchanged."
          fi

          for attempt in 1 2 3; do
            git fetch origin main

            if git rebase origin/main && git push origin HEAD:main; then
              break
            fi

            git rebase --abort || true

            if [ "$attempt" -eq 3 ]; then
              echo "ERROR: failed to publish resolver after retries"
              exit 1
            fi

            sleep $((attempt * 2))
          done

          git fetch origin main

          git cat-file -e "origin/main:$FILE" || {
            echo "ERROR: resolver absent from origin/main"
            exit 1
          }

          REMOTE_VERSION="$(
            git show "origin/main:$FILE" |
            node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>console.log(JSON.parse(s).version))"
          )"

          test "$REMOTE_VERSION" = "1.3-company-008-aerodrome-sugar-base-weth-final" || {
            echo "ERROR: remote resolver version mismatch: $REMOTE_VERSION"
            exit 1
          }

          echo "Verified on origin/main: $FILE"
          echo "Remote resolver version: $REMOTE_VERSION"
