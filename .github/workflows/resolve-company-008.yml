# THE HOLDING · MONETRA COMPANY #008 FRAXTAL sfrxUSD CLOSURE v1.4
name: "Resolve Company #008"

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: resolve-company-008
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Preflight source and v1.3 state
        run: |
          set -euo pipefail
          node --check onboarding/company-008-resolve.mjs
          grep -F "const VERSION = '1.4-company-008-fraxtal-sfrxusd-close';" onboarding/company-008-resolve.mjs
          test -s companies/company-008-resolve.json

          node - <<'NODE'
          const fs = require('fs');
          const src = fs.readFileSync('onboarding/company-008-resolve.mjs','utf8');
          const literals = [...src.matchAll(/0x[0-9a-fA-F]{40}/g)].map(m=>m[0]);
          const mixed = literals.filter(a => /[a-f]/.test(a.slice(2)) && /[A-F]/.test(a.slice(2)));
          if (mixed.length) throw new Error('mixed-case address literals forbidden: ' + [...new Set(mixed)].join(', '));

          const d = JSON.parse(fs.readFileSync('companies/company-008-resolve.json','utf8'));
          if (d.version !== '1.3-company-008-stable-diagnostic-safe-sbold') {
            throw new Error('v1.4 requires published v1.3 input, got ' + d.version);
          }
          if (d.company?.registry !== '008' || d.company?.name !== 'Monetra.eth') throw new Error('identity mismatch');
          if (d.company?.founding?.date !== '2026-05-27') throw new Error('founding regression');
          if ((d.stableCapital?.positions || []).length < 9) throw new Error('expected v1.3 solved positions');
          console.log('v1.4 preflight OK · v1.3 input preserved · lowercase address guard OK');
          NODE

      - name: Install resolver dependency
        run: npm install --no-save ethers@6

      - name: Resolve Fraxtal sfrxUSD only
        env:
          FRAXTAL_RPC_URL: ${{ secrets.FRAXTAL_RPC_URL }}
          FRAXTAL_RPC_URL_2: ${{ secrets.FRAXTAL_RPC_URL_2 }}
          COMPANY_008_RESOLVE_INPUT: companies/company-008-resolve.json
          COMPANY_008_RESOLVE_OUTPUT: companies/company-008-resolve.json
        run: node onboarding/company-008-resolve.mjs

      - name: Validate structural integrity
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('fs');
          const d = JSON.parse(fs.readFileSync('companies/company-008-resolve.json','utf8'));
          if (d.version !== '1.4-company-008-fraxtal-sfrxusd-close') throw new Error('unexpected version: ' + d.version);
          if (d.company?.registry !== '008' || d.company?.name !== 'Monetra.eth') throw new Error('identity mismatch');
          if (d.company?.founding?.date !== '2026-05-27') throw new Error('founding regression');
          if (d.preservation?.priorResolverVersion !== '1.3-company-008-stable-diagnostic-safe-sbold') throw new Error('prior-version preservation failed');
          if ((d.stableCapital?.positions || []).length < 9) throw new Error('stable position regression');
          if (!d.resolutionV14 || d.resolutionV14.chainId !== 252) throw new Error('Fraxtal diagnostics missing');
          const total = Number(d.stableCapital?.summary?.totalUsd);
          if (!(total > 80 && total < 130)) throw new Error('structurally implausible stable total: ' + total);
          console.log('Structural validation OK.');
          console.log('Frax:', d.resolutionV14.frax?.status);
          console.log('Stable Capital:', d.stableCapital.summary);
          console.log('Missing hints:', d.ownerHintCoverage?.missingHints);
          console.log('Book ready:', d.productionReadiness?.stableCapitalBookReady);
          NODE

      - name: Publish resolver JSON to main
        shell: bash
        run: |
          set -euo pipefail
          FILE="companies/company-008-resolve.json"
          test -s "$FILE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f "$FILE"

          if ! git diff --cached --quiet -- "$FILE"; then
            git commit -m "Resolve Monetra Company #008 Fraxtal sfrxUSD v1.4"
          else
            echo "Resolver output unchanged."
          fi

          for attempt in 1 2 3; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then break; fi
            git rebase --abort || true
            if [ "$attempt" -eq 3 ]; then
              echo "ERROR: failed to publish after retries"
              exit 1
            fi
            sleep $((attempt * 2))
          done

          git fetch origin main
          git cat-file -e "origin/main:$FILE"
          REMOTE_VERSION="$(git show "origin/main:$FILE" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>console.log(JSON.parse(s).version))")"
          test "$REMOTE_VERSION" = "1.4-company-008-fraxtal-sfrxusd-close" || {
            echo "ERROR: remote version mismatch: $REMOTE_VERSION"
            exit 1
          }
          echo "Verified on origin/main: $FILE @ $REMOTE_VERSION"
