# THE HOLDING · MONETRA COMPANY #008 STABLE DIAGNOSTIC-SAFE RESOLVER v1.3
name: "Resolve Company #008"

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: resolve-company-008
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Preflight source and prior state
        run: |
          set -euo pipefail
          node --check onboarding/company-008-resolve.mjs
          grep -F "const VERSION = '1.3-company-008-stable-diagnostic-safe-sbold';" onboarding/company-008-resolve.mjs
          test -s companies/company-008-resolve.json
          node - <<'NODE'
          const fs = require('fs');
          const src = fs.readFileSync('onboarding/company-008-resolve.mjs','utf8');
          const literals = [...src.matchAll(/0x[0-9a-fA-F]{40}/g)].map(m=>m[0]);
          const mixed = literals.filter(a => /[a-f]/.test(a.slice(2)) && /[A-F]/.test(a.slice(2)));
          if (mixed.length) throw new Error('mixed-case address literals forbidden in resolver: ' + [...new Set(mixed)].join(', '));
          const d = JSON.parse(fs.readFileSync('companies/company-008-resolve.json','utf8'));
          if (d.version !== '1.1-company-008-stable-wrapper-reconciliation') throw new Error('v1.3 requires published v1.1 resolver input, got ' + d.version);
          if (d.company?.registry !== '008' || d.company?.name !== 'Monetra.eth') throw new Error('Company #008 identity mismatch');
          if (d.company?.founding?.date !== '2026-05-27') throw new Error('founding regression');
          if ((d.stableCapital?.positions || []).length < 7) throw new Error('expected solved v1.1 stable positions');
          console.log('Preflight OK. Mixed-case literal guard OK. Fresh v1.1 input verified.');
          NODE

      - name: Install resolver dependencies
        run: npm install --no-save ethers@6

      - name: Resolve Monetra Stable Capital diagnostics
        env:
          ETH_RPC_URL: ${{ secrets.ETH_RPC_URL }}
          ETH_RPC_URL_2: ${{ secrets.ETH_RPC_URL_2 }}
          COMPANY_008_RESOLVE_INPUT: companies/company-008-resolve.json
          COMPANY_008_RESOLVE_OUTPUT: companies/company-008-resolve.json
        run: node onboarding/company-008-resolve.mjs

      - name: Validate structural integrity, not economic completeness
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('fs');
          const d = JSON.parse(fs.readFileSync('companies/company-008-resolve.json','utf8'));
          if (d.version !== '1.3-company-008-stable-diagnostic-safe-sbold') throw new Error('unexpected version: ' + d.version);
          if (d.company?.registry !== '008' || d.company?.name !== 'Monetra.eth') throw new Error('identity mismatch');
          if (d.company?.founding?.date !== '2026-05-27') throw new Error('founding regression');
          if (d.preservation?.priorResolverVersion !== '1.1-company-008-stable-wrapper-reconciliation') throw new Error('prior version preservation failed');
          if (!(d.preservation?.priorStablePositionCount >= 7)) throw new Error('prior stable positions not preserved');
          if ((d.stableCapital?.positions || []).length < 7) throw new Error('stable position regression');
          const total = Number(d.stableCapital?.summary?.totalUsd);
          if (!(total > 60 && total < 140)) throw new Error('diagnostic total structurally implausible: ' + total);
          if (!d.resolutionV13?.moduleExecution) throw new Error('module diagnostics missing');
          if (!Array.isArray(d.stableCapital?.unresolved)) throw new Error('unresolved diagnostics missing');
          if (!d.ownerHintCoverage?.checks) throw new Error('owner hint coverage missing');
          console.log('Structural validation OK.');
          console.log('Stable Capital:', d.stableCapital.summary);
          console.log('Coverage:', d.ownerHintCoverage);
          console.log('Unresolved:', d.stableCapital.unresolved);
          console.log('Module execution:', d.resolutionV13.moduleExecution);
          console.log('Readiness:', d.productionReadiness);
          NODE

      - name: Publish diagnostic resolver JSON to main
        shell: bash
        run: |
          set -euo pipefail
          FILE="companies/company-008-resolve.json"
          test -s "$FILE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f "$FILE"
          if ! git diff --cached --quiet -- "$FILE"; then
            git commit -m "Resolve Monetra Company #008 stable diagnostics v1.3"
          else
            echo "Resolver output unchanged."
          fi
          for attempt in 1 2 3; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then break; fi
            git rebase --abort || true
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            sleep $((attempt * 2))
          done
          git fetch origin main
          git cat-file -e "origin/main:$FILE"
          REMOTE_VERSION="$(git show "origin/main:$FILE" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>console.log(JSON.parse(s).version))")"
          test "$REMOTE_VERSION" = "1.3-company-008-stable-diagnostic-safe-sbold" || { echo "remote version mismatch: $REMOTE_VERSION"; exit 1; }
          echo "Verified on origin/main: $FILE @ $REMOTE_VERSION"
