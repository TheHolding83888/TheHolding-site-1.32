name: "Ask candidate · Concentration v1.0"

on:
  push:
    branches: [agents/ask-concentration-v1.0-20260815]
    paths:
      - '.github/workflows/_ask_concentration_v10_candidate.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Checkout candidate
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: agents/ask-concentration-v1.0-20260815
          fetch-depth: 0

      - name: Apply bounded concentration synthesis and self-clean
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "The Holding Production Integrator"
          git config user.email "production-integrator@theholding.ai"
          node verification/ask-experience/patch-concentration-v1.0.mjs
          node --check agents/console/app.js
          grep -F "function productiveConcentrationAnswer" agents/console/app.js >/dev/null
          grep -F "Ordinary Productivity and Stable Capital are intentionally not collapsed into one risk score" agents/console/app.js >/dev/null
          grep -F "cross-company-concentration" agents/console/app.js >/dev/null
          rm -f verification/ask-experience/patch-concentration-v1.0.mjs
          rm -f .github/workflows/_ask_concentration_v10_candidate.yml
          git add -A
          git diff --check --cached
          expected=$'.github/workflows/_ask_concentration_v10_candidate.yml\nagents/console/app.js\nverification/ask-experience/patch-concentration-v1.0.mjs'
          actual="$(git diff --cached --name-only | sort)"
          test "$actual" = "$expected"
          git commit -m "Ask v1.0: add bounded cross-company concentration synthesis"
          git push origin HEAD:agents/ask-concentration-v1.0-20260815
