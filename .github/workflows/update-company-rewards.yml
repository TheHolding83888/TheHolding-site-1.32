name: Update Company Rewards

on:
  schedule:
    - cron: '57 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: company-rewards-daily
  cancel-in-progress: false

jobs:
  update-company-rewards:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install runtime dependency
        run: npm install --no-save --no-package-lock ethers@6

      - name: Collect company accrued rewards
        env:
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
        run: node rewards/company-rewards-engine.mjs

      - name: Commit updated rewards snapshot
        run: |
          if git diff --quiet -- companies/rewards-data.json; then
            echo "No company rewards changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add companies/rewards-data.json
          git commit -m "data: update company accrued rewards"

          # Another data workflow may have advanced main while this collector was running.
          # Rebase our one-file data commit onto the latest main and retry the push
          # instead of failing with a non-fast-forward race.
          for attempt in 1 2 3; do
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "Safe writer guard: rebase conflict; refusing to guess."
              exit 1
            fi
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Safe writer guard: main moved during push; retrying ($attempt/3)..."
            sleep $((attempt * 2))
          done
          echo "Safe writer guard: push failed after 3 attempts."
          exit 1
