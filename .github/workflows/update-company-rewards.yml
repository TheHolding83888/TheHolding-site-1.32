name: Update Company Rewards

on:
  schedule:
    - cron: '57 4 * * *'
  workflow_dispatch:
  workflow_run:
    workflows:
      - "Update Company #010 · Cypher Production State"
    types: [completed]

permissions:
  contents: write

concurrency:
  group: company-rewards-daily
  cancel-in-progress: false

jobs:
  update-company-rewards:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Install runtime dependency
        run: npm install --no-save --no-package-lock ethers@6

      - name: Collect established company accrued rewards
        env:
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
          BASE_RPC_URL: ${{ secrets.BASE_RPC_URL }}
          BASE_RPC_URL_2: ${{ secrets.BASE_RPC_URL_2 }}
        run: node rewards/company-rewards-engine.mjs

      - name: Admit Company #010 Cypher rewards from canonical state
        run: |
          set -euo pipefail
          node --check rewards/company-010-rewards-overlay.mjs
          node rewards/company-010-rewards-overlay.mjs
          node - <<'NODE'
          const fs=require('fs');
          const d=JSON.parse(fs.readFileSync('companies/rewards-data.json','utf8'));
          const c=d.companies?.Cypher;
          if(d.version!=='0.3.10'||d.collectorVersion!=='0.3.10-company-010-stakedao-state-admission')throw new Error('Rewards v0.3.10 compatibility contract not produced');
          if(d.diagnostics?.company010?.capability!=='crv-strategy-intelligence-0.1')throw new Error('CRV reward capability marker missing');
          if(!c||c.status!=='partial'||c.totalUsdIsComplete!==false)throw new Error('Cypher partial rewards semantics missing');
          const crv=(c.rewards||[]).find(x=>x.route==='stakedao-base-curve-4pool'&&x.symbol==='CRV');
          if(!crv||!(Number(crv.amount)>=0)||!(Number(crv.usdValue)>=0))throw new Error('Stake DAO CRV reward missing');
          const cvxSource=(c.sources||[]).find(x=>x.route==='convex-staked-cvxcrv');
          if(!cvxSource||cvxSource.status!=='ok'||cvxSource.details?.rewardState!=='Claimable')throw new Error('Convex staked cvxCRV Claimable source missing');
          const embedded=(c.embeddedIncome||[]).find(x=>x.route==='concentrator-asdcrv');
          if(!embedded||embedded.state!=='Compounded'||embedded.claimableApplicable!==false)throw new Error('Concentrator Compounded income state missing');
          for(const route of ['aerodrome-ve','velodrome-ve-direct','votium-union']){
            const s=(c.sources||[]).find(x=>x.route===route);
            if(!s||s.status!=='warming'||s.details?.unknownIsNotZero!==true)throw new Error('Cypher unresolved route semantics missing: '+route);
          }
          if(c.settlement?.totalUsdIsComplete!==false||c.settlement?.unknownRouteIsNotZero!==true)throw new Error('Cypher rewards completion guard missing');
          console.log('Rewards v0.3.10 + CRV intelligence PASS',{knownAccruedUsd:c.totalUsd,claimableCrv:crv.amount,convexClaimableRows:(c.rewards||[]).filter(x=>x.route==='convex-staked-cvxcrv').length,concentrator:embedded.state,completeRoutes:c.completeRoutes,routeCount:c.routeCount,totalUsdIsComplete:c.totalUsdIsComplete});
          NODE

      - name: Commit updated rewards snapshot
        run: |
          if git diff --quiet -- companies/rewards-data.json; then
            echo "No company rewards changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add companies/rewards-data.json
          git commit -m "data: update company accrued rewards"

          for attempt in 1 2 3; do
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "Safe writer guard: rebase conflict; refusing to guess."
              exit 1
            fi
            node rewards/company-010-rewards-overlay.mjs
            git add companies/rewards-data.json
            git commit --amend --no-edit
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Safe writer guard: main moved during push; retrying ($attempt/3)..."
            sleep $((attempt * 2))
          done
          echo "Safe writer guard: push failed after 3 attempts."
          exit 1