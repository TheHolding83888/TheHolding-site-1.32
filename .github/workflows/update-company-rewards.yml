name: Update Company Rewards
# holding-workflow-definition-proof: intelligence/reliability/rewards-scheduler-workflow-definition-proof.mjs

on:
  push:
    branches: [main]
    paths:
      - 'rewards/company-rewards-engine.mjs'
      - 'rewards/defitea-union-scrvusd-overlay.mjs'
      - 'rewards/company-010-rewards-overlay.mjs'
      - 'rewards/company-010-ve-rewards.mjs'
      - 'rewards/company-010-generic-ve-promotion.mjs'
      - 'rewards/vlcvx-registry-route-audit.mjs'
      - 'rewards/union-vlcvx-allocation-audit.mjs'
      - 'rewards/vlcvx-route-rewards-overlay.mjs'
      - 'rewards/vlcvx-route-rewards-finalize.mjs'
      - 'rewards/vlcvx-route-rewards-guard.mjs'
      - 'rewards/company-009-beefy-cvxcrv-income.mjs'
      - 'rewards/forty-acres-received-ledger.mjs'
      - 'rewards/liquity-v2-userproxy-overlay.mjs'
      - 'rewards/rewards-passport-hygiene.mjs'
      - 'rewards/rewards-scheduler-contract.json'
      - 'intelligence/reliability/rewards-scheduler-workflow-definition-proof.mjs'
      - '.github/workflows/update-company-rewards.yml'
  schedule:
    - cron: '07 5 * * *'
  workflow_dispatch:
  workflow_run:
    workflows:
      - "Update Company #010 · Cypher Production State"
    types: [completed]

permissions:
  contents: write

concurrency:
  group: company-rewards-daily
  cancel-in-progress: false

jobs:
  update-company-rewards:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Verify Rewards scheduler contract
        run: |
          set -euo pipefail
          node --check intelligence/reliability/rewards-scheduler-workflow-definition-proof.mjs
          node intelligence/reliability/rewards-scheduler-workflow-definition-proof.mjs

      - name: Install runtime dependency
        run: npm install --no-save --no-package-lock ethers@6

      - name: Collect established company accrued rewards
        env:
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
          BASE_RPC_URL: ${{ secrets.BASE_RPC_URL }}
          BASE_RPC_URL_2: ${{ secrets.BASE_RPC_URL_2 }}
        run: node rewards/company-rewards-engine.mjs

      - name: Measure Company #010 veAERO and veVELO state
        env:
          BASE_RPC_URL: ${{ secrets.BASE_RPC_URL }}
          BASE_RPC_URL_2: ${{ secrets.BASE_RPC_URL_2 }}
          OPTIMISM_RPC_URL: ${{ secrets.OPTIMISM_RPC_URL }}
        run: |
          set -euo pipefail
          node --check rewards/company-010-ve-rewards.mjs
          node rewards/company-010-ve-rewards.mjs

      - name: Admit Company #010 Cypher rewards from canonical state
        run: |
          set -euo pipefail
          node --check rewards/company-010-rewards-overlay.mjs
          node rewards/company-010-rewards-overlay.mjs
          node - <<'NODE'
          const fs=require('fs');
          const d=JSON.parse(fs.readFileSync('companies/rewards-data.json','utf8'));
          const c=d.companies?.Cypher;
          const finite=x=>x!==null&&x!==undefined&&x!==''&&Number.isFinite(Number(x));
          if(d.version!=='0.3.10'||d.collectorVersion!=='0.3.10-company-010-stakedao-state-admission')throw new Error('Rewards v0.3.10 compatibility contract not produced');
          if(d.diagnostics?.company010?.capability!=='crv-ve-and-projectx-reward-semantics-0.5-multileg-parity')throw new Error('Company #010 Project X multi-leg parity marker missing');
          if(!c||c.status!=='partial'||c.totalUsdIsComplete!==false)throw new Error('Cypher partial rewards semantics missing');
          const crv=(c.rewards||[]).find(x=>x.route==='stakedao-base-curve-4pool'&&x.symbol==='CRV');
          if(!crv||!(Number(crv.amount)>=0)||!(Number(crv.usdValue)>=0))throw new Error('Stake DAO CRV reward missing');
          const cvxSource=(c.sources||[]).find(x=>x.route==='convex-staked-cvxcrv');
          if(!cvxSource||cvxSource.status!=='ok'||cvxSource.details?.rewardState!=='Claimable')throw new Error('Convex staked cvxCRV Claimable source missing');
          const projectSource=(c.sources||[]).find(x=>x.route==='projectx-whype-usdc');
          if(!projectSource||projectSource.status!=='ok'||projectSource.details?.multiLegComplete!==true)throw new Error('Project X complete source missing');
          const projectRewards=(c.rewards||[]).filter(x=>x.route==='projectx-whype-usdc');
          if(projectRewards.length!==2)throw new Error('Project X must preserve exactly two claimable fee legs');
          for(const symbol of ['WHYPE','USDC']){
            const x=projectRewards.find(r=>r.symbol===symbol);
            if(!x||x.classification!=='unclaimed'||!(Number(x.amount)>=0)||!(Number(x.usdValue)>=0)||!(Number(x.priceUsd)>0)||x.details?.multiLegComplete!==true)throw new Error('Project X reward leg missing: '+symbol);
          }
          const conc=(c.embeddedIncome||[]).find(x=>x.route==='concentrator-asdcrv');
          if(!conc||conc.state!=='Compounded'||conc.claimableApplicable!==false)throw new Error('Concentrator Compounded income state missing');
          const claimableBefore=Number(c.knownAccruedUsd);
          for(const route of ['aerodrome-ve','velodrome-ve-direct']){
            const s=(c.sources||[]).find(x=>x.route===route);
            if(!s||!['ok','partial'].includes(s.status)||!['Compounded','Claimable'].includes(s.details?.rewardState))throw new Error('Cypher measured ve route semantics missing: '+route);
            if(s.details?.mode==='unknown')throw new Error('Cypher ve route custody mode unresolved: '+route);
            if(s.details?.rewardState==='Compounded'){
              const e=(c.embeddedIncome||[]).find(x=>x.route===route&&x.state==='Compounded');
              if(!e||e.claimableApplicable!==false||e.classification!=='compounded-locked'||!(Number(e.amount)>0))throw new Error('Cypher Compounded row missing: '+route);
              if(!finite(e.priceUsd)||!(Number(e.priceUsd)>0)||!finite(e.usdValue)||!(Number(e.usdValue)>0)||!e.priceMethod)throw new Error('Cypher known mechanism lost USD valuation parity: '+route);
              if(Math.abs(Number(e.usdValue)-Number(e.amount)*Number(e.priceUsd))>0.00001)throw new Error('Cypher embedded USD arithmetic drift: '+route);
              if(e.usdValueIncludedInClaimableTotal!==false)throw new Error('Cypher embedded USD claimable boundary missing: '+route);
              if(e.usdValueIncludedInMeasuredEarnedTotal!==true)throw new Error('Cypher priced Compounded row missing measured-earned admission: '+route);
            }
          }
          if(Number(c.knownAccruedUsd)!==claimableBefore||Number(c.claimableUsd)!==claimableBefore||Number(c.totalUsd)!==claimableBefore)throw new Error('Embedded income leaked into claimable total');
          const projectUsd=projectRewards.reduce((s,x)=>s+Number(x.usdValue||0),0);
          if(!(projectUsd>=0)||Number(c.claimableUsd)+1e-8<projectUsd)throw new Error('Project X rewards missing from claimable aggregate');
          const embeddedUsd=(c.embeddedIncome||[]).reduce((s,x)=>s+(finite(x.usdValue)?Number(x.usdValue):0),0);
          if(!finite(c.measuredEmbeddedUsd)||Math.abs(Number(c.measuredEmbeddedUsd)-embeddedUsd)>0.00001)throw new Error('Measured embedded USD total drift');
          if(!finite(c.measuredEarnedUsd)||Math.abs(Number(c.measuredEarnedUsd)-(claimableBefore+embeddedUsd))>0.00001)throw new Error('Measured earned total must equal claimable + priced Compounded');
          if(c.measuredEarnedUsdIsComplete!==false)throw new Error('Measured earned completeness must preserve unresolved route semantics');
          for(const symbol of ['AERO','VELO','WHYPE','USDC'])if(!(c.measuredEarnedTokens||[]).includes(symbol))throw new Error('Measured earned token strip missing '+symbol);
          console.log('Rewards v0.3.10 Company #010 base parity PASS',{claimableUsd:c.claimableUsd,measuredEmbeddedUsd:c.measuredEmbeddedUsd,measuredEarnedUsd:c.measuredEarnedUsd});
          NODE

      - name: Measure Defitea Votium + Union scrvUSD member rewards
        env:
          ETH_RPC_URL: ${{ secrets.ETH_RPC_URL }}
        run: |
          set -euo pipefail
          node --check rewards/defitea-union-scrvusd-overlay.mjs
          node rewards/defitea-union-scrvusd-overlay.mjs
          node - <<'NODE'
          const fs=require('fs');
          const d=JSON.parse(fs.readFileSync('companies/rewards-data.json','utf8'));
          const c=d.companies?.['defitea.eth'];
          const diag=d.diagnostics?.defiteaUnion;
          const src=(c?.sources||[]).find(x=>x.route==='votium-union');
          if(!diag||diag.capability!=='0.3-defitea-vlcvx-route-graph-scrvusd-proof')throw new Error('Defitea vlCVX route capability missing');
          if(diag.executionAuthority!=='none'||diag.claimTransactionAuthority!=='none')throw new Error('Defitea vlCVX authority expansion');
          if(diag.unknownIsNotZero!==true||src?.details?.unknownIsNotZero!==true)throw new Error('Defitea Union unknown != zero guard missing');
          const u=src?.details?.union,graph=src?.details?.vlCvxRouteGraph;
          if(!u||!graph)throw new Error('Defitea vlCVX route graph missing');
          if(graph.principalAsset!=='vlCVX'||graph.currentRoute!=='Votium + Union')throw new Error('Defitea current route graph drift');
          if(u.forwarding?.configured!==true||u.forwarding?.effective!==true)throw new Error('Defitea Union forwarding not effective');
          if(u.allocation?.scrvUsdSelected!==true||!(Number(u.allocation?.scrvUsdSharePct)>0))throw new Error('Defitea scrvUSD allocation not proven');
          const rows=(c.rewards||[]).filter(x=>x.route==='votium-union-scrvusd');
          const ent=u.airdrop?.entitlement;
          if(ent?.claimed===false){
            if(ent.proofValid!==true||rows.length!==1||rows[0].classification!=='unclaimed'||rows[0].protocol!=='Votium + Union · vlCVX')throw new Error('Defitea Union Unclaimed entitlement parity failed');
          }else if(rows.length)throw new Error('Union reward fabricated without unclaimed entitlement');
          console.log('Defitea vlCVX route writer contract PASS',{state:u.state,sharePct:u.allocation.scrvUsdSharePct,entitlement:ent?.status||'not-published',rows:rows.length});
          NODE

      - name: Audit current vlCVX routes across all companies
        env:
          ETH_RPC_URL: ${{ secrets.ETH_RPC_URL }}
          VLCVX_AUDIT_OUTPUT: /tmp/vlcvx-route-audit.json
        run: |
          set -euo pipefail
          node --check rewards/vlcvx-registry-route-audit.mjs
          node rewards/vlcvx-registry-route-audit.mjs

      - name: Audit Union settlement allocations
        env:
          ETH_RPC_URL: ${{ secrets.ETH_RPC_URL }}
          VLCVX_AUDIT_OUTPUT: /tmp/vlcvx-route-audit.json
          UNION_AUDIT_OUTPUT: /tmp/union-vlcvx-allocation-audit.json
        run: |
          set -euo pipefail
          node --check rewards/union-vlcvx-allocation-audit.mjs
          node rewards/union-vlcvx-allocation-audit.mjs

      - name: Promote audited vlCVX routes into canonical Rewards
        env:
          ETH_RPC_URL: ${{ secrets.ETH_RPC_URL }}
          REWARDS_OUTPUT: companies/rewards-data.json
          VLCVX_AUDIT_OUTPUT: /tmp/vlcvx-route-audit.json
          UNION_AUDIT_OUTPUT: /tmp/union-vlcvx-allocation-audit.json
        run: |
          set -euo pipefail
          node --check rewards/vlcvx-route-rewards-overlay.mjs
          node rewards/vlcvx-route-rewards-overlay.mjs
          node --check rewards/vlcvx-route-rewards-finalize.mjs
          node rewards/vlcvx-route-rewards-finalize.mjs
          node --check rewards/vlcvx-route-rewards-guard.mjs
          node rewards/vlcvx-route-rewards-guard.mjs

      - name: Measure Company #009 Beefy cvxCRV embedded income
        env:
          ETH_RPC_URL: ${{ secrets.ETH_RPC_URL }}
          ETH_RPC_URL_2: ${{ secrets.ETH_RPC_URL_2 }}
          BEEFY_CVXCRV_OBSERVATION_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          node --check rewards/company-009-beefy-cvxcrv-income.mjs
          node rewards/company-009-beefy-cvxcrv-income.mjs

      - name: Measure 40 Acres received payouts
        env:
          OPTIMISM_RPC_URL: ${{ secrets.OPTIMISM_RPC_URL }}
        run: |
          set -euo pipefail
          node --check rewards/forty-acres-received-ledger.mjs
          node rewards/forty-acres-received-ledger.mjs

      - name: Apply current Rewards Passport route hygiene
        run: |
          set -euo pipefail
          node --check rewards/rewards-passport-hygiene.mjs
          node rewards/rewards-passport-hygiene.mjs

      - name: Verify final Rewards aggregate parity
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const d=JSON.parse(fs.readFileSync('companies/rewards-data.json','utf8'));
          const finite=v=>v!==null&&v!==undefined&&v!==''&&Number.isFinite(Number(v));
          const expected={'YieldRing.eth':'Votium + Union · vlCVX','defitea.eth':'Votium + Union · vlCVX',"Rook's portfolio":'Convex Finance · vlCVX','Cypher':'Stake DAO · vlCVX'};
          for(const [key,route] of Object.entries(expected)){
            const c=d.companies?.[key];if(!c)throw new Error('vlCVX company missing '+key);
            if(c.vlCvxRoute?.currentRoute?.publicLabel!==route)throw new Error('current vlCVX route missing '+key);
            const claimable=(c.rewards||[]).reduce((s,r)=>s+(finite(r.usdValue)?Number(r.usdValue):0),0);
            const aggregate=Number(c.claimableUsd??c.totalUsd);
            if(!Number.isFinite(aggregate)||Math.abs(aggregate-claimable)>0.00001)throw new Error('claimable aggregate drift '+key);
            if(Array.isArray(c.embeddedIncome)&&finite(c.measuredEarnedUsd)){
              const embedded=c.embeddedIncome.reduce((s,r)=>s+(finite(r.usdValue)?Number(r.usdValue):0),0);
              if(Math.abs(Number(c.measuredEarnedUsd)-(claimable+embedded))>0.00001)throw new Error('measured-earned aggregate drift '+key);
            }
          }
          const y=d.companies?.['YieldRing.eth'];
          const yLegacy=(y?.rewards||[]).filter(x=>x.protocol==='Votium · vlCVX'&&x.details?.vlCvxRoute?.routeRole==='legacy-residual');
          if(yLegacy.length===0&&(y?.sources||[]).some(x=>x.route==='votium-union'&&x.protocol!=='Votium + Union · vlCVX'))throw new Error('YieldRing empty legacy route survived');
          const cy=d.companies?.Cypher;
          const stake=(cy?.rewards||[]).filter(x=>x.route==='stake-dao-vlcvx');
          if(!stake.length||stake.some(x=>x.protocol!=='Stake DAO · vlCVX'))throw new Error('Cypher Stake DAO current vlCVX reward missing');
          const cyCvx=(cy?.rewards||[]).filter(x=>x.route==='convex-staked-cvxcrv');
          if(!cyCvx.length||cyCvx.some(x=>x.protocol!=='Convex · staked cvxCRV'||x.classification!=='unclaimed'))throw new Error('Cypher direct Convex reward identity drift');
          const nine=d.companies?.['1milliondollar.eth'];
          if((nine?.rewards||[]).some(x=>x.route==='convex-staked-cvxcrv'||x.route==='beefy-cvxcrv'))throw new Error('Company #009 embedded cvxCRV leaked into Claimable');
          if(!['warming-baseline','ok','needs-flow-reconciliation'].includes(nine?.embeddedIncomeStatus))throw new Error('Company #009 embedded income state missing');
          const rook=d.companies?.["Rook's portfolio"];
          const rookCurrent=(rook?.sources||[]).find(x=>x.route==='vlcvx-current-route');
          if(rookCurrent?.protocol!=='Convex Finance · vlCVX'||rookCurrent?.details?.currentRewardSettlement!=='unresolved'||rookCurrent?.details?.unknownIsNotZero!==true)throw new Error('Rook current Convex route epistemics missing');
          const received=d.diagnostics?.fortyAcresReceived;
          const def=d.companies?.['defitea.eth'];
          const defReceived=(def?.receivedIncome||[]).filter(x=>x.route==='forty-acres-velodrome-received'&&x.state==='Received');
          if(!received||received.executionAuthority!=='none'||received.claimableIsolation!==true||received.unknownIsNotZero!==true)throw new Error('40 Acres Received authority/isolation guard missing');
          if(!received.discoveredCompanies?.includes('defitea.eth')||defReceived.length<1)throw new Error('Defitea 40 Acres Received route missing');
          if(!(Number(def?.receivedIncomeTransferCount)>0)||!(Number(def?.receivedIncomeUsd)>0))throw new Error('Defitea August Received proof is empty');
          if(defReceived.some(x=>x.claimableApplicable!==false||x.includedInClaimableTotal!==false||x.includedInMeasuredEarnedTotal!==false))throw new Error('Received leaked across accounting boundary');
          if((def?.rewards||[]).some(x=>x.classification==='received'||x.state==='Received'))throw new Error('Received leaked into current Claimable rewards array');
          if(d.diagnostics?.vlCvxRoutePromotion?.executionAuthority!=='none'||d.diagnostics?.vlCvxRouteAggregateFinalize?.executionAuthority!=='none'||d.diagnostics?.rewardsPassportHygiene?.executionAuthority!=='none'||d.diagnostics?.company009BeefyCvxCrv?.executionAuthority!=='none')throw new Error('Rewards authority drift');
          console.log('Final Rewards parity PASS',{routes:expected,cypherStakeDaoRows:stake.length,cypherCvxCrvRows:cyCvx.length,company009Embedded:nine.embeddedIncomeStatus,defiteaReceivedTransfers:def.receivedIncomeTransferCount,defiteaReceivedUsd:def.receivedIncomeUsd});
          NODE

      - name: Commit updated rewards snapshot
        env:
          ETH_RPC_URL: ${{ secrets.ETH_RPC_URL }}
          ETH_RPC_URL_2: ${{ secrets.ETH_RPC_URL_2 }}
          BASE_RPC_URL: ${{ secrets.BASE_RPC_URL }}
          BASE_RPC_URL_2: ${{ secrets.BASE_RPC_URL_2 }}
          OPTIMISM_RPC_URL: ${{ secrets.OPTIMISM_RPC_URL }}
          VLCVX_AUDIT_OUTPUT: /tmp/vlcvx-route-audit.json
          UNION_AUDIT_OUTPUT: /tmp/union-vlcvx-allocation-audit.json
          BEEFY_CVXCRV_OBSERVATION_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain -- companies/rewards-data.json companies/company-009-beefy-cvxcrv-income.json)" ]; then
            echo "No company rewards or Beefy income changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add companies/rewards-data.json companies/company-009-beefy-cvxcrv-income.json
          git commit -m "data: update company accrued rewards"

          for attempt in 1 2 3; do
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "Safe writer guard: rebase conflict; refusing to guess."
              exit 1
            fi

            node rewards/company-010-rewards-overlay.mjs
            node rewards/defitea-union-scrvusd-overlay.mjs
            node rewards/vlcvx-registry-route-audit.mjs
            node rewards/union-vlcvx-allocation-audit.mjs
            node rewards/vlcvx-route-rewards-overlay.mjs
            node rewards/vlcvx-route-rewards-finalize.mjs
            node rewards/vlcvx-route-rewards-guard.mjs
            node rewards/company-009-beefy-cvxcrv-income.mjs
            node rewards/forty-acres-received-ledger.mjs
            node rewards/rewards-passport-hygiene.mjs

            git add companies/rewards-data.json companies/company-009-beefy-cvxcrv-income.json
            git commit --amend --no-edit
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Safe writer guard: main moved during push; retrying ($attempt/3)..."
            sleep $((attempt * 2))
          done
          echo "Safe writer guard: push failed after 3 attempts."
          exit 1