name: Verify Accounting Reconciliation Watch

on:
  pull_request:
    paths:
      - 'reporting/accounting-reconciliation-watch.mjs'
      - 'reporting/accounting-reconciliation-watch-validation.mjs'
      - 'reporting/accounting-reconciliation-watch.json'
      - 'reporting/accounting-notice-queue.json'
      - 'reporting/accounting-reference-reconciliation.json'
      - 'reporting/historical-accounting-completeness-map.json'
      - 'intelligence/reliability/accounting-reconciliation-watch-workflow-definition-proof.mjs'
      - '.github/workflows/verify-accounting-reconciliation-watch.yml'
      - '.github/workflows/update-accounting-reconciliation-watch.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Static validation
        shell: bash
        run: |
          set -euo pipefail
          node --check reporting/accounting-reconciliation-watch.mjs
          node --check reporting/accounting-reconciliation-watch-validation.mjs
          node --check intelligence/reliability/accounting-reconciliation-watch-workflow-definition-proof.mjs
          test -s reporting/accounting-notice-queue.json
          test -s reporting/accounting-reference-reconciliation.json
          test -s reporting/historical-accounting-completeness-map.json
          git diff --check

      - name: Build baseline watch from canonical diagnostics
        shell: bash
        env:
          ACCOUNTING_NOTICE_QUEUE_FILE: ./reporting/accounting-notice-queue.json
          ACCOUNTING_REFERENCE_RECONCILIATION_FILE: ./reporting/accounting-reference-reconciliation.json
          HISTORICAL_ACCOUNTING_COMPLETENESS_FILE: ./reporting/historical-accounting-completeness-map.json
          ACCOUNTING_RECONCILIATION_WATCH_FILE: /tmp/accounting-reconciliation-watch.json
          ACCOUNTING_RECONCILIATION_WATCH_PREVIOUS_FILE: /tmp/accounting-reconciliation-watch-previous-missing.json
        run: |
          set -euo pipefail
          node reporting/accounting-reconciliation-watch.mjs
          node reporting/accounting-reconciliation-watch-validation.mjs

      - name: Prove semantic no-op stability
        shell: bash
        env:
          ACCOUNTING_NOTICE_QUEUE_FILE: ./reporting/accounting-notice-queue.json
          ACCOUNTING_REFERENCE_RECONCILIATION_FILE: ./reporting/accounting-reference-reconciliation.json
          HISTORICAL_ACCOUNTING_COMPLETENESS_FILE: ./reporting/historical-accounting-completeness-map.json
          ACCOUNTING_RECONCILIATION_WATCH_FILE: /tmp/accounting-reconciliation-watch.json
          ACCOUNTING_RECONCILIATION_WATCH_PREVIOUS_FILE: /tmp/accounting-reconciliation-watch.json
        run: |
          set -euo pipefail
          before="$(sha256sum /tmp/accounting-reconciliation-watch.json | awk '{print $1}')"
          node reporting/accounting-reconciliation-watch.mjs
          after="$(sha256sum /tmp/accounting-reconciliation-watch.json | awk '{print $1}')"
          test "$before" = "$after"
          node reporting/accounting-reconciliation-watch-validation.mjs
          echo "Reconciliation watch semantic no-op stability PASS: $after"

      - name: Guard authority and acceptance anchors
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs');
          const x=JSON.parse(fs.readFileSync('/tmp/accounting-reconciliation-watch.json','utf8'));
          const completeness=JSON.parse(fs.readFileSync('reporting/historical-accounting-completeness-map.json','utf8'));
          if(x.status!=='diagnostic-watch-no-accounting-authority') throw new Error('watch status authority drift');
          if(x.authority?.sourceOfTruth!==false||x.authority?.factualIncomeAuthority!==false||x.authority?.incomeCreationAuthority!==false||x.authority?.accountingCompletionAuthority!==false||x.authority?.monthClosingAuthority!==false||x.authority?.canReplaceUnknown!==false||x.authority?.executionAuthority!=='none'||x.authority?.capitalExecution!==false||x.authority?.walletAuthority!==false) throw new Error('watch authority expanded');
          if(x.semantics?.unknownIsNotZero!==true||x.semantics?.crossMonthProrationAllowed!==false||x.semantics?.referenceDeltaIsMissingIncome!==false||x.semantics?.trackingNoEventIsFailure!==false) throw new Error('watch epistemic boundary drift');
          const items=x.items||[];
          const ids=new Set(items.map(r=>r.id));
          if(!ids.has('notice:period-lifecycle-reconciliation:1milliondollar.eth:2026-09:__company_period__')) throw new Error('Beefy boundary pending anchor missing');
          if(!ids.has('notice:period-lifecycle-reconciliation:Monetra.eth:2026-09:__company_period__')) throw new Error('Monetra boundary pending anchor missing');
          if(!ids.has('historical:05081966.eth:2026-08:curve_vecrv')) throw new Error('closed veCRV Unknown forensic anchor missing');
          if(ids.has('historical:05081966.eth:2026-08:aerodrome_veaero')) throw new Error('tracking-no-event became forensic alert');

          const source=(completeness.rows||[]).find(r=>r.id==='defitea.eth:2026-08:velodrome_vevelo');
          if(!source) throw new Error('Defitea veVELO completeness source row missing');
          const vevelo=items.find(r=>r.id==='historical:defitea.eth:2026-08:velodrome_vevelo');
          if(source.state==='unknown'||source.state==='partial') {
            if(!vevelo) throw new Error(`Defitea veVELO ${source.state} forensic anchor missing`);
            if(vevelo.watchClass!=='historical-forensic-review'||vevelo.actionability!=='forensic-evidence'||vevelo.detail?.sourceState!==source.state||vevelo.detail?.evidenceComplete!==false) throw new Error('Defitea veVELO forensic semantics drift');
            if(source.state==='partial'&&Number(source.factualEventCount)>Number(source.factualValuedEventCount)) {
              if(!(Number(vevelo.detail?.factualEventCount)>Number(vevelo.detail?.factualValuedEventCount))) throw new Error('Partial Defitea veVELO lost unvalued factual-event gap');
              if(vevelo.detail?.factualUsdSubtotal!==null) throw new Error('Partial Defitea veVELO UNKNOWN USD became valued/zero');
              if(!(vevelo.detail?.reasonCodes||[]).includes('factual-event-valuation-incomplete')) throw new Error('Partial Defitea veVELO valuation-incomplete reason missing');
            }
          } else {
            if(!['complete','tracking-no-event'].includes(source.state)) throw new Error(`Defitea veVELO unexpected completeness state: ${source.state}`);
            if(vevelo) throw new Error(`Defitea veVELO ${source.state} remained forensic`);
          }
          console.log('Accounting Reconciliation Watch authority guard PASS',x.summary);
          NODE
