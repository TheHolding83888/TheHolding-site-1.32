name: "Validate YieldRing Production Cascade"

on:
  pull_request:
    paths:
      - 'companies/yieldring-public-capital-projection.mjs'
      - 'companies/defitea-public-capital-projection.mjs'
      - 'intelligence/capital-state/unified-capital-refresh.mjs'
      - '.github/workflows/unified-capital-refresh.yml'
      - '.github/workflows/project-yieldring-capital-state.yml'
      - '.github/workflows/update-productivity.yml'
      - '.github/workflows/update-capital-state.yml'
      - '.github/workflows/diagnose-productivity-recovery.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout PR head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Validate unified orchestration contract
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs');
          const unified=fs.readFileSync('.github/workflows/unified-capital-refresh.yml','utf8');
          const engine=fs.readFileSync('intelligence/capital-state/unified-capital-refresh.mjs','utf8');
          const projector=fs.readFileSync('.github/workflows/project-yieldring-capital-state.yml','utf8');
          const productivity=fs.readFileSync('.github/workflows/update-productivity.yml','utf8');
          const capital=fs.readFileSync('.github/workflows/update-capital-state.yml','utf8');
          const diagnostic=fs.readFileSync('.github/workflows/diagnose-productivity-recovery.yml','utf8');
          const projection=fs.readFileSync('companies/yieldring-public-capital-projection.mjs','utf8');

          const sequence=[
            "Project canonical Defitea state",
            "Project canonical YieldRing state",
            "Refresh protocol APRs and established Productivity",
            "Admit Company #010 compatibility layer",
            "Apply canonical YieldRing Productivity overlay",
            "Rebuild General Company Balance Sheet",
            "Build Capital State"
          ];
          let last=-1;
          for(const token of sequence){const i=engine.indexOf(token);if(i<0||i<=last)throw new Error('Unified engine sequence drift at '+token);last=i;}

          if(!unified.includes('The Holding Capital · Unified Refresh'))throw new Error('Unified workflow identity missing');
          if(!unified.includes('companies/defitea-canonical-state.json')||!unified.includes('companies/defitea-public-capital-projection.mjs'))throw new Error('Defitea canonical wakeup missing');
          if(!unified.includes('npx playwright install chromium')||unified.includes('playwright install --with-deps'))throw new Error('Unified browser install still mutates apt');
          if(!unified.includes('Publish one coherent capital snapshot safely'))throw new Error('single coherent publish contract missing');
          if(!unified.includes('Update Stable Capital')||!unified.includes('Update Company #010 · Cypher Production State')||!unified.includes('Update Company #010 · Project X Reference APR'))throw new Error('external upstream wakeups missing');
          if(!unified.includes("github.event.workflow_run.conclusion == 'success'")||!unified.includes("head_branch == 'main'"))throw new Error('workflow_run fail-closed gate missing');

          for(const [name,text] of [['projector',projector],['productivity',productivity],['capital',capital]]){
            if(!text.includes('workflow_dispatch:'))throw new Error(name+' manual recovery trigger missing');
            if(/\n\s+push:/.test(text)||/\n\s+workflow_run:/.test(text)||/\n\s+schedule:/.test(text))throw new Error(name+' still has automatic domino trigger');
          }
          if(productivity.includes('playwright install --with-deps')||diagnostic.includes('playwright install --with-deps'))throw new Error('legacy/diagnostic apt mutation remains');
          if(!productivity.includes('node productivity/company-010-productivity-overlay.mjs')||productivity.indexOf('node productivity/company-010-productivity-overlay.mjs')>productivity.indexOf('node productivity/yieldring-productivity-overlay.mjs'))throw new Error('legacy recovery overlay order drift');

          if(!projector.includes('yieldring/index.html'))throw new Error('dedicated YieldRing page recovery projection missing');
          if(!projection.includes("const PAGE='yieldring/index.html'"))throw new Error('dedicated YieldRing page projection missing');
          if(!projection.includes('qty: 0.0334')||!projection.includes('qty: 678')||!projection.includes('2 locks · Maxi relay'))throw new Error('YieldRing canonical projection guards missing');
          if(!engine.includes("Number(canonical?.capital?.bitcoin?.quantity) === 0.0334")||!engine.includes("Number(canonical?.capital?.aerodrome?.quantity) === 678"))throw new Error('Unified YieldRing canonical guards missing');
          if(!engine.includes("capital?.authority?.executionAuthority === 'none'"))throw new Error('Unified authority guard missing');

          console.log('Unified production architecture PASS',{singleOrchestrator:true,defiteaCanonical:true,legacyRecoveryOnly:true,noAptMutation:true,coherentPublish:true,executionAuthority:'none'});
          NODE
      - name: Syntax and diff hygiene
        run: |
          set -euo pipefail
          node --check companies/defitea-public-capital-projection.mjs
          node --check companies/yieldring-public-capital-projection.mjs
          node --check productivity/yieldring-productivity-overlay.mjs
          node --check intelligence/capital-state/unified-capital-refresh.mjs
          node --check intelligence/capital-state/general-company-balance-sheet.mjs
          node --check intelligence/capital-state/capital-state.mjs
          git diff --check
