name: "Discover Company #007"

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: discover-company-007
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Install discovery dependency
        run: npm install --no-save ethers@6

      - name: "Discover Company #007 current state"
        env:
          ETH_RPC_URL: ${{ secrets.ETH_RPC_URL }}
          ETH_RPC_URL_2: ${{ secrets.ETH_RPC_URL_2 }}
          BASE_RPC_URL: ${{ secrets.BASE_RPC_URL }}
          BASE_RPC_URL_2: ${{ secrets.BASE_RPC_URL_2 }}
          OPTIMISM_RPC_URL: ${{ secrets.OPTIMISM_RPC_URL }}
          ARBITRUM_RPC_URL: ${{ secrets.ARBITRUM_RPC_URL }}
          ZKSYNC_RPC_URL: ${{ secrets.ZKSYNC_RPC_URL }}
          COMPANY_007_DISCOVERY_OUTPUT: companies/company-007-discovery.json
        run: node onboarding/company-007-discovery.mjs

      - name: Validate generated JSON
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const p = 'companies/company-007-discovery.json';
          if (!fs.existsSync(p)) throw new Error('discovery JSON was not created');
          const d = JSON.parse(fs.readFileSync(p, 'utf8'));
          if (d.version !== '1.0-current-state-fast') throw new Error('unexpected discovery version');
          if (d.company?.registry !== '007') throw new Error('registry mismatch');
          if (d.company?.name !== "Rook's portfolio") throw new Error('name mismatch');
          if (d.company?.foundedAt !== '2026-01-08') throw new Error('founding mismatch');
          if (!Array.isArray(d.company?.wallets) || d.company.wallets.length !== 2) throw new Error('wallet count mismatch');
          if (!Array.isArray(d.proposedCompanyBook) || d.proposedCompanyBook.length !== 7) throw new Error('Company Book row count mismatch');
          const syms = d.proposedCompanyBook.map(x => x.symbol).join(',');
          if (syms !== 'BTC,ETH,AERO,CVX,CRV,LINK,ZK') throw new Error('Company Book symbols mismatch: ' + syms);
          console.log('Discovery JSON validation passed');
          NODE

      - name: Publish discovery JSON to main
        shell: bash
        run: |
          set -euo pipefail

          FILE="companies/company-007-discovery.json"

          test -s "$FILE" || {
            echo "ERROR: $FILE is missing or empty after discovery."
            exit 1
          }

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Force-add so a newly recreated file cannot be skipped by ignore/status edge cases.
          git add -f "$FILE"

          if ! git diff --cached --quiet -- "$FILE"; then
            git commit -m "Update Company #007 discovery"
          else
            echo "Generated discovery matches currently tracked content."
          fi

          # Push with bounded retry if a concurrent data Action moved main.
          for attempt in 1 2 3; do
            git fetch origin main

            if git rebase origin/main; then
              if git push origin HEAD:main; then
                break
              fi
            fi

            git rebase --abort || true

            if [ "$attempt" -eq 3 ]; then
              echo "ERROR: failed to publish discovery JSON after retries."
              exit 1
            fi

            sleep $((attempt * 2))
          done

          # CRITICAL: green means the file is verifiably present on remote main.
          git fetch origin main
          git cat-file -e "origin/main:$FILE" || {
            echo "ERROR: workflow would otherwise be green, but $FILE is absent from origin/main."
            exit 1
          }

          echo "Verified on origin/main: $FILE"
