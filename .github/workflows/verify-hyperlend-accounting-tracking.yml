name: Verify HyperLend Accounting Tracking

on:
  pull_request:
    paths:
      - 'reporting/accounting-coverage.mjs'
      - 'reporting/hyperlend-tracking-proof-validation.mjs'
      - 'companies/company-010-production-state.json'
      - 'companies/rewards-data.json'
      - 'companies/productivity-data.json'
      - 'reporting/income-ledger.json'
      - 'companies/embedded-yield-ledger.json'
      - '.github/workflows/verify-hyperlend-accounting-tracking.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-hyperlend-accounting-tracking:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: Prove HyperLend factual tracking without income authority
        shell: bash
        env:
          ACCOUNTING_COVERAGE_FILE: /tmp/accounting-coverage.json
          PRODUCTIVITY_DATA_FILE: ./companies/productivity-data.json
          REWARDS_DATA_FILE: ./companies/rewards-data.json
          COMPANY_010_STATE_FILE: ./companies/company-010-production-state.json
          INCOME_LEDGER_FILE: ./reporting/income-ledger.json
          EMBEDDED_YIELD_LEDGER_FILE: ./companies/embedded-yield-ledger.json
        run: |
          set -euo pipefail
          node --check reporting/accounting-coverage.mjs
          node --check reporting/hyperlend-tracking-proof-validation.mjs
          node reporting/hyperlend-tracking-proof-validation.mjs
          node reporting/accounting-coverage.mjs
          test -s "$ACCOUNTING_COVERAGE_FILE"
          node --input-type=module - <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          const data=JSON.parse(fs.readFileSync(process.env.ACCOUNTING_COVERAGE_FILE,'utf8'));
          const engineId='hyperlend-0xfd739d4e423301ce9385c1fb8850539d657c296d';
          const engine=data.mechanisms?.[engineId];
          assert.ok(engine,'HyperLend kHYPE mechanism missing');
          assert.equal(engine.activeCompanyCount,1,'HyperLend active company count drift');
          assert.deepEqual(engine.companies,['Cypher'],'HyperLend company identity drift');
          assert.equal(engine.factualTrackingCompanyCount,1,'HyperLend did not reach 1/1 factual tracking');
          assert.deepEqual(engine.factualTrackingCompanies,['Cypher'],'HyperLend factual tracking identity drift');
          assert.equal(engine.factualEventCompanyCount,0,'HyperLend tracking proof fabricated factual period events');
          assert.equal(engine.reusableCoverageGap,false,'HyperLend remained a reusable tracking gap');
          const row=data.companies?.Cypher?.mechanisms?.[engineId]?.months?.[data.currentMonth];
          assert.equal(row?.status,'factual-tracking-no-period-event','Cypher HyperLend status drift');
          assert.equal(row?.factualEventCount,0,'HyperLend tracking proof fabricated income event');
          assert.equal(row?.factualUsdSubtotal,null,'HyperLend embedded state leaked into factual USD subtotal');
          assert.deepEqual(row?.factualTrackingProofSources,['companies/company-010-production-state.json#strategies.hyperlend'],'HyperLend proof source drift');
          assert.ok(row?.completionBlockers?.includes('no-canonical-period-income-evidence'),'HyperLend lost no-period-income blocker');
          assert.ok(!data.gapRanking.some(x=>x.engineId===engineId),'HyperLend remained in reusable gap ranking');
          assert.equal(data.authority?.executionAuthority,'none','Accounting coverage execution authority expanded');
          console.log('HyperLend production-shaped coverage PASS',{tracking:`${engine.factualTrackingCompanyCount}/${engine.activeCompanyCount}`,factualEventCompanies:engine.factualEventCompanyCount,reusableCoverageGap:engine.reusableCoverageGap,periodIncomeAuthority:false,referenceAprAuthority:false,executionAuthority:data.authority.executionAuthority});
          NODE
          git diff --check
