name: "Ask candidate · v0.7 Main Sync"

on:
  push:
    branches:
      - agents/ask-owner-synthesis-v0.7-20260815
    paths:
      - '.github/workflows/_ask_v07_sync_main.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout candidate
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: agents/ask-owner-synthesis-v0.7-20260815
          fetch-depth: 0
      - name: Merge fresh main and self-clean
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "The Holding Production Integrator"
          git config user.email "production-integrator@theholding.ai"
          git fetch origin main
          git merge --no-edit origin/main
          rm -f .github/workflows/_ask_v07_sync_main.yml
          node --check agents/console/app.js
          git add -A
          git diff --check --cached
          git commit -m "Ask v0.7: sync fresh main for final proof"
          git push origin HEAD:agents/ask-owner-synthesis-v0.7-20260815
