name: One-time Ask Output Guard v0.6.1

on:
  push:
    branches:
      - agents/ask-evaluation-trust-v0.6.1-20260815
    paths:
      - .github/workflows/_one_time_output_guard_v061.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: agents/ask-evaluation-trust-v0.6.1-20260815
      - run: python3 verification/_one_time_output_guard_v061.py
      - run: node --check agents/console/app.js
      - run: node verification/production-boundary-guard-v1.mjs
      - name: Verify semantic guard markers
        run: |
          set -euo pipefail
          grep -F "0.1-final-answer-safety-guard" agents/console/app.js
          grep -F "const guarded = enforceOutputGuard" agents/console/app.js
          grep -F "measuredWithoutSource" agents/console/app.js
      - name: Publish patch and remove temporary files
        run: |
          set -euo pipefail
          git config user.name "The Holding Evaluation Integrator"
          git config user.email "evaluation-integrator@theholding.ai"
          git add agents/console/app.js
          git rm -f verification/_one_time_output_guard_v061.py .github/workflows/_one_time_output_guard_v061.yml
          git commit -m "ask: add final output safety guard v0.6.1"
          git push origin HEAD:agents/ask-evaluation-trust-v0.6.1-20260815
