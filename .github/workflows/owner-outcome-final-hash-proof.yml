name: "TEMP · Owner Outcome Final Full Proof"

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Exact release and current-state proof
        shell: bash
        run: |
          set -euo pipefail
          node intelligence/learning/learning-release-guard.mjs
          node --check intelligence/learning/owner-outcome-review-recorder.mjs
          node --check intelligence/learning/owner-outcome-experience-engine.mjs
          node --check intelligence/learning/independent-owner-outcome-experience-reviewer.mjs
          node intelligence/learning/owner-outcome-review-recorder.mjs --self-test
          node intelligence/learning/owner-outcome-experience-engine.mjs --self-test
          node intelligence/learning/independent-owner-outcome-experience-reviewer.mjs --self-test
          node intelligence/learning/owner-outcome-experience-engine.mjs
          node intelligence/learning/independent-owner-outcome-experience-reviewer.mjs
          node - <<'NODE'
          const fs=require('fs');
          const x=JSON.parse(fs.readFileSync('intelligence/learning-state/owner-outcome-experience.json','utf8'));
          if(x.status!=='ready') throw new Error('owner outcome state not ready');
          if(x.operatingContract?.executionAuthority!=='none') throw new Error('execution authority drift');
          if(x.operatingContract?.causalClaimAuthority!=='none') throw new Error('causal authority drift');
          if(x.summary?.learnedLessonCount!==0) throw new Error('unexpected current learned lesson');
          console.log('Current owner outcome state PASS',x.summary);
          NODE

      - name: No-op noise and horizon-transition proof
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          mkdir -p "$tmp/intelligence/learning" "$tmp/intelligence/learning-state"
          cp intelligence/learning/owner-outcome-review-policy.json "$tmp/intelligence/learning/"
          cp intelligence/learning/owner-outcome-experience-engine.mjs "$tmp/intelligence/learning/"
          node - "$tmp" <<'NODE'
          const fs=require('fs'),path=require('path'),crypto=require('crypto');
          const root=process.argv[2];
          const stable=v=>Array.isArray(v)?v.map(stable):(v&&typeof v==='object'?Object.fromEntries(Object.keys(v).sort().map(k=>[k,stable(v[k])])):v);
          const s=v=>JSON.stringify(stable(v)); const h=v=>crypto.createHash('sha256').update(v).digest('hex');
          const core=x=>{const y={...x};delete y.integrity;return y};
          const d={decisionId:'DEC-SYN-NOOP',sequence:1,recordedAt:'2026-08-01T00:00:00.000Z',authorRole:'owner',caseId:'OWNER-SYN',caseKey:'CK-SYN',disposition:'defer',rationale:'Synthetic owner outcome no-op lifecycle proof.',expectedOutcome:'Expected path remains observable.',modifiedAction:null,supersedesDecisionId:null,prediction:{event:'none',probabilityBps:null,reviewDays:null,reviewAt:null},experience:{version:'0.1-pre-outcome-owner-economic-decision',status:'open',preOutcomeCaptured:true,evaluationCriterion:'Later evidence resolves the path.',reviewCondition:{reviewOnOrAfter:'2026-08-30',amountThreshold:null,materialChangeTrigger:true},counterevidence:'Counterevidence exists.',invalidationCondition:'Invalidation may occur.',deferredAlternative:'Alternative exists.',intendedUse:null,confidence:null,evidenceNote:null,calibrationEligibility:'not-scored-until-explicit-future-outcome-review'},sourceCase:{payloadHash:h('syn'),domain:'economic',severity:'owner-review',category:'reward-harvest-timing',entity:'synthetic.eth',recommendationClass:'owner-capital-allocation',riskTier:'owner-defined',confidence:null,deterministicAction:null,evidenceCount:1,actionMode:'proposal-only'},source:{provenance:{sourceMode:'owner-initiated',authorRole:'owner',peerOwnerStatement:false,directBrainCase:false}},authority:{recordType:'human-decision-memory',sourceMode:'owner-initiated',executable:false,executionAuthority:'none'},chain:{previousDecisionHash:null}};
          d.integrity={decisionHash:h(s(d))};
          const ledger={version:'0.1-decision-ledger',lastUpdatedAt:d.recordedAt,decisionCount:1,policy:{appendOnly:true,correctionsBySupersedingEntryOnly:true,publicDecisionMemory:true,executionAuthority:'none'},decisions:[d]};
          ledger.integrity={chainRootHash:d.integrity.decisionHash,latestDecisionHash:d.integrity.decisionHash,ledgerHash:h(s(core(ledger)))};
          const reviews={version:'0.1-owner-outcome-review-ledger',lastUpdatedAt:null,reviewCount:0,policy:{appendOnly:true,correctionsBySupersedingEntryOnly:true,publicOutcomeMemory:true,executionAuthority:'none'},reviews:[]};
          reviews.integrity={chainRootHash:null,latestReviewHash:null,ledgerHash:h(s(core(reviews)))};
          fs.writeFileSync(path.join(root,'intelligence/learning/decision-ledger.json'),JSON.stringify(ledger,null,2)+'\n');
          fs.writeFileSync(path.join(root,'intelligence/learning/owner-outcome-review-ledger.json'),JSON.stringify(reviews,null,2)+'\n');
          NODE
          cd "$tmp"
          OWNER_OUTCOME_NOW='2026-08-23T00:00:00Z' node intelligence/learning/owner-outcome-experience-engine.mjs >/dev/null
          cp intelligence/learning-state/owner-outcome-experience.json /tmp/owner-outcome-a.json
          OWNER_OUTCOME_NOW='2026-08-24T00:00:00Z' node intelligence/learning/owner-outcome-experience-engine.mjs >/dev/null
          cp intelligence/learning-state/owner-outcome-experience.json /tmp/owner-outcome-b.json
          OWNER_OUTCOME_NOW='2026-08-31T00:00:00Z' node intelligence/learning/owner-outcome-experience-engine.mjs >/dev/null
          cp intelligence/learning-state/owner-outcome-experience.json /tmp/owner-outcome-c.json
          node - <<'NODE'
          const fs=require('fs');
          const stable=v=>Array.isArray(v)?v.map(stable):(v&&typeof v==='object'?Object.fromEntries(Object.keys(v).sort().map(k=>[k,stable(v[k])])):v);
          const semantic=x=>{const y=structuredClone(x);delete y.generatedAt;delete y.integrity;return JSON.stringify(stable(y));};
          const a=JSON.parse(fs.readFileSync('/tmp/owner-outcome-a.json')); const b=JSON.parse(fs.readFileSync('/tmp/owner-outcome-b.json')); const c=JSON.parse(fs.readFileSync('/tmp/owner-outcome-c.json'));
          if(semantic(a)!==semantic(b)) throw new Error('unchanged observing state would create semantic churn');
          if(semantic(b)===semantic(c)) throw new Error('review-horizon transition would be incorrectly suppressed');
          if(a.decisions[0].lifecycleState!=='observing'||b.decisions[0].lifecycleState!=='observing'||c.decisions[0].lifecycleState!=='review-due') throw new Error('lifecycle transition mismatch');
          console.log('No-op suppression + horizon transition PASS');
          NODE

      - name: Workflow handoff and rebase invariants
        shell: bash
        run: |
          set -euo pipefail
          grep -q '^  actions: write$' .github/workflows/record-owner-economic-outcome-review.yml
          grep -q 'update-learning-loop.yml/dispatches' .github/workflows/record-owner-economic-outcome-review.yml
          grep -q 'Owner outcome state materialized on main' .github/workflows/record-owner-economic-outcome-review.yml
          grep -q 'Suppress generatedAt-only owner outcome churn' .github/workflows/update-learning-loop.yml
          count="$(grep -c 'independent-learning-reviewer.mjs --verify-current' .github/workflows/update-learning-loop.yml)"
          [ "$count" -ge 2 ] || { echo 'Core Learning verify-current is not preserved pre-publish + post-rebase'; exit 1; }
          grep -q 'independent-owner-outcome-experience-reviewer.mjs' .github/workflows/update-learning-loop.yml
          git diff --check
          echo 'Explicit handoff + post-rebase fail-closed invariants PASS'
