name: "Validate Onchain Market Data"

on:
  pull_request:
    paths:
      - 'intelligence/market-data/market-price-registry.json'
      - 'intelligence/market-data/onchain-price-source-registry.json'
      - 'intelligence/market-data/onchain-price-source-registry-extensions.json'
      - 'intelligence/market-data/onchain-price-resolver.mjs'
      - 'intelligence/market-data/onchain-price-resolver-core.mjs'
      - 'intelligence/market-data/onchain-price-resolver-validation.mjs'
      - 'intelligence/market-data/onchain-uniswap-v3-twap.mjs'
      - 'intelligence/market-data/onchain-uniswap-v3-twap-validation.mjs'
      - 'intelligence/market-data/onchain-curve-ema.mjs'
      - 'intelligence/market-data/onchain-curve-ema-validation.mjs'
      - 'intelligence/market-data/onchain-price-coverage-audit.mjs'
      - 'intelligence/market-data/market-data-authority-policy.json'
      - 'intelligence/market-data/market-data-authority-materializer.mjs'
      - 'intelligence/market-data/market-data-materializer-health-boundary-validation.mjs'
      - '.github/workflows/market-data-refresh.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Validate resolver syntax and deterministic adapters
        run: |
          set -euo pipefail
          node --check intelligence/market-data/onchain-price-resolver.mjs
          node --check intelligence/market-data/onchain-price-resolver-core.mjs
          node --check intelligence/market-data/onchain-price-resolver-validation.mjs
          node --check intelligence/market-data/onchain-uniswap-v3-twap.mjs
          node --check intelligence/market-data/onchain-uniswap-v3-twap-validation.mjs
          node --check intelligence/market-data/onchain-curve-ema.mjs
          node --check intelligence/market-data/onchain-curve-ema-validation.mjs
          node --check intelligence/market-data/onchain-price-coverage-audit.mjs
          node --check intelligence/market-data/market-data-materializer-health-boundary-validation.mjs
          node intelligence/market-data/onchain-price-resolver-validation.mjs
          node intelligence/market-data/onchain-uniswap-v3-twap-validation.mjs
          node intelligence/market-data/onchain-curve-ema-validation.mjs
          node intelligence/market-data/market-data-materializer-health-boundary-validation.mjs

      - name: Audit effective canonical onchain coverage
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs');
          const market=JSON.parse(fs.readFileSync('intelligence/market-data/market-price-registry.json','utf8'));
          const base=JSON.parse(fs.readFileSync('intelligence/market-data/onchain-price-source-registry.json','utf8'));
          const ext=JSON.parse(fs.readFileSync('intelligence/market-data/onchain-price-source-registry-extensions.json','utf8'));
          const canonical=(market.assets||[]).map(x=>x.assetId);
          const effective=new Set([
            ...Object.keys(base.assets||{}),
            ...Object.keys(ext.assets||{}),
            ...Object.keys(ext.overrides||{})
          ]);
          const pending=canonical.filter(id=>!effective.has(id));
          if(canonical.length!==26)throw new Error(`Expected 26 canonical market assets, got ${canonical.length}`);
          if(pending.length)throw new Error(`Canonical assets without effective onchain route: ${pending.join(', ')}`);
          if(!effective.has('physical-silver'))throw new Error('Physical-silver reference route missing');
          if(base.mode!=='shadow'||base.semantics?.productionPriceAuthority!==false)throw new Error('Base onchain registry must remain observation-only');
          if(base.semantics?.paidRpcRequired!==false||base.semantics?.browserRpcRequestsAllowed!==false||base.semantics?.executionAuthority!=='none')throw new Error('Onchain observation authority boundary drift');
          if(ext.semantics?.productionPriceAuthority!==false||ext.semantics?.executionAuthority!=='none')throw new Error('Extension registry authority boundary drift');
          console.log('Effective onchain route coverage PASS',{canonicalAssetCount:canonical.length,specialReference:'physical-silver',effectiveRouteIds:effective.size});
          NODE

      - name: Prove 30-minute observation and per-asset materialization contract
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs');
          const workflow=fs.readFileSync('.github/workflows/market-data-refresh.yml','utf8');
          const policy=JSON.parse(fs.readFileSync('intelligence/market-data/market-data-authority-policy.json','utf8'));
          const materializer=fs.readFileSync('intelligence/market-data/market-data-authority-materializer.mjs','utf8');
          const sourceStep='Reuse daily CoinGecko source lane without external request';
          const required=[
            "cron: '7,37 * * * *'",
            sourceStep,
            "MARKET_DATA_DAILY_REFRESH: 'false'",
            'Observe all onchain prices',
            'Materialize per-asset production authority',
            "MARKET_DATA_FORCE_COINGECKO_FAILBACK: 'false'",
            'onchain-price-resolver.mjs',
            'market-data-authority-materializer.mjs'
          ];
          for(const token of required)if(!workflow.includes(token))throw new Error(`30-minute heartbeat contract missing: ${token}`);
          if(policy.defaultProductionAuthority!=='coingecko-lane'||policy.globalOnchainPromotionEnabled!==true)throw new Error('Per-asset production authority policy drift');
          if(Object.keys(policy.assetOverrides||{}).length!==26)throw new Error('Expected explicit authority review for 26 canonical assets');
          for(const [id,row] of Object.entries(policy.assetOverrides||{}))if(row.requestedPrimary!=='onchain')throw new Error(`${id}: not onchain-primary`);
          if(policy.semantics?.automaticPolicyMutationAllowed!==false||policy.semantics?.automaticCohortExpansionAllowed!==false||policy.semantics?.executionAuthority!=='none')throw new Error('Authority mutation/execution boundary drift');
          if(!materializer.includes('reviewedOnchainSelectedAssetCount')||!materializer.includes('coingeckoSelectedAssetCount'))throw new Error('26-asset per-lane materializer accounting missing');
          const sourceIndex=workflow.indexOf(sourceStep);
          const shadowIndex=workflow.indexOf('Observe all onchain prices');
          const materializerIndex=workflow.indexOf('Materialize per-asset production authority');
          const publicIndex=workflow.indexOf('Rebuild public fund + company capital view');
          if(!(sourceIndex>=0&&shadowIndex>sourceIndex&&materializerIndex>shadowIndex&&publicIndex>materializerIndex))throw new Error('Heartbeat order drift');
          console.log('30-minute onchain heartbeat + strict daily CoinGecko reuse + per-asset failback contract PASS',{canonicalOnchainPrimary:26,cycleWideFailback:false,nonDailyCoinGeckoFetch:false,executionAuthority:'none'});
          NODE

      - name: Live-prove 27 observation routes remain usable
        run: |
          set -euo pipefail
          node intelligence/market-data/onchain-price-resolver.mjs
          node - <<'NODE'
          const fs=require('fs');
          const shadow=JSON.parse(fs.readFileSync('intelligence/market-data/onchain-price-shadow.json','utf8'));
          if(shadow.mode!=='shadow'||shadow.semantics?.productionPriceAuthority!==false)throw new Error('Live Shadow authority drift');
          if(shadow.coverage?.assetCount!==27)throw new Error(`Expected 27 observation routes, got ${shadow.coverage?.assetCount}`);
          if(Number(shadow.coverage?.unavailableCount)!==0)throw new Error(`Live Shadow contains unavailable routes: ${JSON.stringify(shadow.coverage)}`);
          if(Number(shadow.coverage?.okCount)+Number(shadow.coverage?.warningCount)!==27)throw new Error(`Live Shadow coverage accounting drift: ${JSON.stringify(shadow.coverage)}`);
          const observations=Object.values(shadow.observations||{});
          if(observations.length!==27)throw new Error(`Expected 27 live observations, got ${observations.length}`);
          const warnings=[];
          for(const row of observations){
            if(!(Number(row?.usd)>0))throw new Error(`${row?.assetId||'unknown'}: live onchain price invalid`);
            const allowed=row?.status==='shadow-ok'
              || row?.status==='divergent'
              || (row?.status==='dependency-warning'&&row?.dependencyStatus==='divergent');
            if(!allowed)throw new Error(`${row?.assetId||'unknown'}: unexpected live onchain health ${row?.status||'missing'}/${row?.dependencyStatus||'none'}`);
            if(row.status!=='shadow-ok')warnings.push(row.assetId);
          }
          if(warnings.length!==Number(shadow.coverage?.warningCount))throw new Error(`Live warning accounting drift: ${warnings.length} observations vs ${shadow.coverage?.warningCount} coverage warnings`);
          if(shadow.authority?.executionAuthority!=='none')throw new Error('Live Shadow execution authority drift');
          console.log('Live onchain observation proof PASS',{generatedAt:shadow.generatedAt,coverage:shadow.coverage,divergenceTelemetryAssets:warnings});
          NODE
          git diff --check
