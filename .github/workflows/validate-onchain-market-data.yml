name: "Validate Onchain Market Data"

on:
  pull_request:
    paths:
      - 'intelligence/market-data/market-price-registry.json'
      - 'intelligence/market-data/fund-capital-registry.json'
      - 'intelligence/market-data/public-capital-state.json'
      - 'intelligence/market-data/onchain-price-source-registry.json'
      - 'intelligence/market-data/onchain-price-resolver.mjs'
      - 'intelligence/market-data/onchain-price-resolver-core.mjs'
      - 'intelligence/market-data/onchain-price-resolver-validation.mjs'
      - 'intelligence/market-data/onchain-uniswap-v3-twap.mjs'
      - 'intelligence/market-data/onchain-uniswap-v3-twap-validation.mjs'
      - 'intelligence/market-data/onchain-curve-ema.mjs'
      - 'intelligence/market-data/onchain-curve-ema-validation.mjs'
      - 'intelligence/market-data/onchain-price-coverage-audit.mjs'
      - '.github/workflows/market-data-refresh.yml'
      - '.github/workflows/validate-onchain-market-data.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout PR head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Validate resolver syntax and deterministic RPC failover
        run: |
          set -euo pipefail
          node --check intelligence/market-data/onchain-price-resolver.mjs
          node --check intelligence/market-data/onchain-price-resolver-core.mjs
          node --check intelligence/market-data/onchain-price-resolver-validation.mjs
          node --check intelligence/market-data/onchain-uniswap-v3-twap.mjs
          node --check intelligence/market-data/onchain-uniswap-v3-twap-validation.mjs
          node --check intelligence/market-data/onchain-curve-ema.mjs
          node --check intelligence/market-data/onchain-curve-ema-validation.mjs
          node --check intelligence/market-data/onchain-price-coverage-audit.mjs
          node intelligence/market-data/onchain-price-resolver-validation.mjs
          node intelligence/market-data/onchain-uniswap-v3-twap-validation.mjs
          node intelligence/market-data/onchain-curve-ema-validation.mjs
      - name: Audit canonical market universe coverage
        run: |
          set -euo pipefail
          node intelligence/market-data/onchain-price-coverage-audit.mjs
          node - <<'NODE'
          const fs=require('fs');
          const market=JSON.parse(fs.readFileSync('intelligence/market-data/market-price-registry.json','utf8'));
          const onchain=JSON.parse(fs.readFileSync('intelligence/market-data/onchain-price-source-registry.json','utf8'));
          const marketIds=(market.assets||[]).map(x=>x.assetId);
          const routes=Object.keys(onchain.assets||{});
          const routed=marketIds.filter(id=>routes.includes(id));
          const pending=marketIds.filter(id=>!routes.includes(id));
          const special=routes.filter(id=>!marketIds.includes(id));
          if(marketIds.length!==26)throw new Error(`Expected current canonical 26-asset market universe, got ${marketIds.length}`);
          if(routed.length!==19)throw new Error(`Expected 19 routed market assets after cvxCRV Curve EMA cohort, got ${routed.length}`);
          if(pending.length!==7)throw new Error(`Expected 7 pending market assets after cvxCRV Curve EMA cohort, got ${pending.length}`);
          if(special.length!==1||special[0]!=='physical-silver')throw new Error(`Unexpected special route set: ${special.join(',')}`);
          if(routed.length+special.length!==20)throw new Error('Expected 20 total live onchain observation targets');
          console.log('Onchain coverage cvxCRV Curve EMA cohort PASS',{marketAssets:26,routedMarketAssets:19,pendingMarketAssets:7,specialOnchainReferences:1,totalObservationTargets:20});
          NODE
      - name: Prove shadow authority boundary and cohort routes
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs');
          const reg=JSON.parse(fs.readFileSync('intelligence/market-data/onchain-price-source-registry.json','utf8'));
          if(reg.mode!=='shadow')throw new Error('Onchain registry must remain shadow');
          if(reg.semantics?.productionPriceAuthority!==false)throw new Error('Onchain production authority activated prematurely');
          if(reg.semantics?.paidRpcRequired!==false)throw new Error('Paid RPC dependency introduced');
          if(reg.semantics?.browserRpcRequestsAllowed!==false)throw new Error('Browser RPC authority introduced');
          if(reg.semantics?.coinGeckoRemainsFallbackAndSanityCheck!==true)throw new Error('CoinGecko fallback contract missing');
          if(reg.semantics?.protocolNativeTwapRoutesAllowed!==true)throw new Error('Protocol-native TWAP contract missing');
          if(reg.semantics?.pythCoreReadonlyRoutesAllowed!==true)throw new Error('Pyth Core readonly contract missing');
          if(reg.semantics?.pythHermesDependency!==false)throw new Error('Hermes dependency introduced');
          if(reg.semantics?.pythPriceUpdatesSubmitted!==false)throw new Error('Pyth write/update authority introduced');
          if(reg.semantics?.uniswapV3TwapRoutesAllowed!==true)throw new Error('Uniswap V3 TWAP route contract missing');
          if(reg.semantics?.uniswapV3SpotPriceAuthority!==false)throw new Error('Uniswap V3 spot price authority enabled');
          if(reg.semantics?.curveEmaRoutesAllowed!==true)throw new Error('Curve EMA route contract missing');
          if(reg.semantics?.curveSpotPriceAuthority!==false)throw new Error('Curve spot price authority enabled');
          if(reg.semantics?.executionAuthority!=='none')throw new Error('Execution authority drift');
          const exact={
            'aerodrome-finance':['base','0x4ec5970fc728c5f65ba413992cd5ff6fd70fcff0'],
            'venice-token':['base','0xaabc55ca55d70b034e4daa2551a224239890282f'],
            'internet-computer':['bsc','0x84210d9013a30c6ab169e28840a6cc54b60fa042'],
            'decentraland':['polygon','0xa1cbf3fe43bc3501e3fc4b573e822c70e76a7512'],
            'the-sandbox':['polygon','0x3d49406edd4d52fb7ffd25485f32e073b529c924']
          };
          for(const [assetId,[network,address]] of Object.entries(exact)){
            const route=reg.assets?.[assetId]?.route;
            if(!route||route.type!=='chainlink-v3'||route.network!==network||route.authority!=='shadow')throw new Error(`${assetId} route invalid`);
            if(route.contract.toLowerCase()!==address)throw new Error(`${assetId} exact feed contract drift`);
          }
          const velo=reg.assets?.['velodrome-finance']?.route;
          if(!velo||velo.type!=='velodrome-v2-twap-relative'||velo.network!=='optimism'||velo.authority!=='shadow')throw new Error('VELO protocol-TWAP route invalid');
          if(velo.factory.toLowerCase()!=='0xf1046053aa5682b4f9a81b5481394da16be5ff5a')throw new Error('VELO PoolFactory drift');
          if(velo.token.toLowerCase()!=='0x9560e827af36c94d2ac33a39bce1fe78631088db')throw new Error('VELO token drift');
          if(velo.quoteToken.toLowerCase()!=='0x4200000000000000000000000000000000000006')throw new Error('VELO WETH quote-token drift');
          if(velo.stable!==false||Number(velo.granularity)!==4||Number(velo.observationPeriodSeconds)!==1800)throw new Error('VELO TWAP sampling contract drift');
          if(String(velo.amountIn)!=='1000000000000000000'||velo.quoteAssetId!=='ethereum'||velo.feedQuote!=='ETH')throw new Error('VELO relative-price composition drift');
          const mode=reg.assets?.mode?.route;
          if(!mode||mode.type!=='pyth-core-readonly'||mode.network!=='mode'||mode.authority!=='shadow')throw new Error('MODE Pyth route invalid');
          if(mode.contract.toLowerCase()!=='0xa2aa501b19aff244d90cc15a4cf739d2725b5729')throw new Error('MODE Pyth contract drift');
          if(mode.priceId.toLowerCase()!=='0x0386e113cc716a7c6a55decd97b19c90ce080d9f2f5255ac78a0e26889446d1e')throw new Error('MODE Pyth price id drift');
          if(mode.token.toLowerCase()!=='0xdfc7c877a950e49d2610114102175a06c2e3167a')throw new Error('MODE token drift');
          if(Number(mode.maxAgeSeconds)!==3600||Number(mode.maxConfidencePct)!==5||Number(mode.maxDivergencePct)!==8)throw new Error('MODE Pyth safety thresholds drift');
          const v3Routes={
            'yield-basis': {token:'0x01791f726b4103694969820be083196cc7c045ff',symbol:'YB',fee:10000},
            'fxn-token': {token:'0x365accfca291e7d3914637abf1f7635db165bb09',symbol:'FXN',fee:10000},
            'liquity': {token:'0x6dea81c8171d0ba574754ef6f8b412f2ed88c54d',symbol:'LQTY',fee:3000}
          };
          for(const [assetId,expected] of Object.entries(v3Routes)){
            const route=reg.assets?.[assetId]?.route;
            if(!route||route.type!=='uniswap-v3-twap-relative'||route.network!=='ethereum'||route.authority!=='shadow')throw new Error(`${expected.symbol} Uniswap V3 TWAP route invalid`);
            if(route.factory.toLowerCase()!=='0x1f98431c8ad98523631ae4a59f267346ea31f984')throw new Error(`${expected.symbol} Uniswap V3 Factory drift`);
            if(route.token.toLowerCase()!==expected.token)throw new Error(`${expected.symbol} token drift`);
            if(route.quoteToken.toLowerCase()!=='0xc02aaa39b223fe8d0a0e5c4f27eAD9083C756Cc2'.toLowerCase())throw new Error(`${expected.symbol} WETH quote-token drift`);
            if(Number(route.fee)!==expected.fee||Number(route.tokenDecimals)!==18||Number(route.quoteTokenDecimals)!==18)throw new Error(`${expected.symbol} Uniswap V3 pool contract drift`);
            if(Number(route.twapWindowSeconds)!==1800||route.quoteAssetId!=='ethereum'||route.feedQuote!=='ETH'||route.outputQuote!=='USD')throw new Error(`${expected.symbol} TWAP composition drift`);
            if(Number(route.maxDivergencePct)!==10)throw new Error(`${expected.symbol} divergence threshold drift`);
          }
          const curveRoutes={
            resupply:{symbol:'RSUP',pool:'0xee351f12eae8c2b8b9d1b9bfd3c5dd565234578d',token:'0x419905009e4656fdc02418c7df35b1e61ed5f726',quoteToken:'0xc02aaa39b223fe8d0a0e5c4f27ead9083c756cc2',quoteAssetId:'ethereum',feedQuote:'ETH'},
            'convex-crv':{symbol:'cvxCRV',pool:'0x971add32ea87f10bd192671630be3be8a11b8623',token:'0x62b9c7356a2dc64a1969e19c23e4f579f9810aa7',quoteToken:'0xd533a949740bb3306d119cc777fa900ba034cd52',quoteAssetId:'curve-dao-token',feedQuote:'CRV'}
          };
          for(const [assetId,expected] of Object.entries(curveRoutes)){
            const route=reg.assets?.[assetId]?.route;
            if(!route||route.type!=='curve-ema-relative'||route.network!=='ethereum'||route.authority!=='shadow')throw new Error(`${expected.symbol} Curve EMA route invalid`);
            if(route.pool.toLowerCase()!==expected.pool)throw new Error(`${expected.symbol} Curve pool drift`);
            if(route.token.toLowerCase()!==expected.token)throw new Error(`${expected.symbol} token drift`);
            if(route.quoteToken.toLowerCase()!==expected.quoteToken)throw new Error(`${expected.symbol} quote token drift`);
            if(route.oracleDirection!=='coin0-per-coin1'||String(route.oracleScale)!=='1000000000000000000')throw new Error(`${expected.symbol} Curve oracle direction/scale drift`);
            if(route.quoteAssetId!==expected.quoteAssetId||route.feedQuote!==expected.feedQuote||route.outputQuote!=='USD'||Number(route.maxDivergencePct)!==10)throw new Error(`${expected.symbol} Curve composition drift`);
          }
          const networkContracts={ethereum:1,optimism:10,base:8453,bsc:56,polygon:137,mode:34443};
          for(const [id,chainId] of Object.entries(networkContracts)){
            if(reg.networks?.[id]?.chainId!==chainId||(reg.networks[id].rpcFailover||[]).length<2)throw new Error(`${id} public RPC contract invalid`);
          }
          const modeUrls=(reg.networks?.mode?.rpcFailover||[]).map(x=>x.url);
          if(!modeUrls.includes('https://mainnet.mode.network'))throw new Error('Official Mode public RPC missing');
          if(JSON.stringify(reg).toLowerCase().includes('hermes.pyth.network'))throw new Error('Hermes must not be a runtime dependency');
          const cvx=reg.assets?.['convex-finance']?.route;
          if(!cvx||cvx.type!=='chainlink-v3-relative'||cvx.quoteAssetId!=='ethereum')throw new Error('Existing CVX composition drift');
          const silver=reg.assets?.['physical-silver']?.route;
          if(silver?.feedBase!=='XAG'||silver?.emergencyFallback?.type!=='gold-ratio'||Number(silver?.emergencyFallback?.divideGoldUsdBy)!==68)throw new Error('Silver direct/fallback contract drift');
          console.log('Onchain Market Data reusable Curve EMA route contract PASS',{routes:Object.keys(reg.assets||{}).length,networks:Object.keys(reg.networks||{}).length,curveEmaAssets:['RSUP','cvxCRV'],spotAuthority:false,productionPriceAuthority:false,paidRpcRequired:false});
          NODE
      - name: Prove shared heartbeat remains shadow-only and fail-open
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs');
          const workflow=fs.readFileSync('.github/workflows/market-data-refresh.yml','utf8');
          const resolver=fs.readFileSync('intelligence/market-data/onchain-price-resolver.mjs','utf8');
          const core=fs.readFileSync('intelligence/market-data/onchain-price-resolver-core.mjs','utf8');
          const uniswap=fs.readFileSync('intelligence/market-data/onchain-uniswap-v3-twap.mjs','utf8');
          const curve=fs.readFileSync('intelligence/market-data/onchain-curve-ema.mjs','utf8');
          const required=['Observe onchain prices in fail-open shadow mode','onchain-price-resolver.mjs','onchain-price-shadow.json','canonical Market Data continues unchanged',"shadow.semantics?.productionPriceAuthority!==false","shadow.semantics?.paidRpcRequired!==false"];
          for(const token of required){if(!workflow.includes(token))throw new Error(`Heartbeat shadow contract missing: ${token}`);}
          const coreRequired=['velodrome-v2-twap-relative','protocolTwapReadsPinnedToDiscoveryBlock','maxOneHttpBatchPerNetworkPhasePerAttempt','0x79bc57d5','0xebeb31db','0x9e8cc04b'];
          for(const token of coreRequired){if(!core.includes(token))throw new Error(`Protocol-TWAP core contract missing: ${token}`);}
          const pythRequired=['pyth-core-readonly','96834ad3','pythHermesDependency: false','pythPriceUpdatesSubmitted: false','pythPublishTimeFreshnessChecked: true','pythConfidenceIntervalChecked: true'];
          for(const token of pythRequired){if(!resolver.includes(token))throw new Error(`Pyth readonly resolver contract missing: ${token}`);}
          const uniswapRequired=['uniswap-v3-twap-relative','1698ee82','0dfe1681','d21220a7','1a686502','883bdbfd','arithmeticMeanTick','quoteRatioAtTick'];
          for(const token of uniswapRequired){if(!uniswap.toLowerCase().includes(token.toLowerCase()))throw new Error(`Uniswap V3 TWAP adapter contract missing: ${token}`);}
          const curveRequired=['curve-ema-relative','c6610657','86fc88d3','encodeCurveCoins','encodeCurvePriceOracle','price_oracle() EMA'];
          for(const token of curveRequired){if(!curve.toLowerCase().includes(token.toLowerCase()))throw new Error(`Curve EMA adapter contract missing: ${token}`);}
          const resolverUniswapRequired=['uniswapV3TwapRoutes: true','uniswapV3FactoryDiscovery: true','uniswapV3TwapReadsPinnedToDiscoveryBlock: true','uniswapV3UsesObserveNotSpot: true','dexSpotPriceAuthority: false'];
          for(const token of resolverUniswapRequired){if(!resolver.includes(token))throw new Error(`Uniswap V3 composite contract missing: ${token}`);}
          const resolverCurveRequired=['curveEmaRoutes: curveEnabled','curvePriceOracleReadsPinnedToBlock: curveEnabled','curveUsesPriceOracleNotSpot: curveEnabled'];
          for(const token of resolverCurveRequired){if(!resolver.includes(token))throw new Error(`Curve EMA composite contract missing: ${token}`);}
          const forbidden=['updatePriceFeeds(','updatePriceFeedsIfNecessary(','hermes.pyth.network'];
          for(const token of forbidden){if(resolver.includes(token))throw new Error(`Forbidden Pyth runtime dependency/write surface present: ${token}`);}
          if(uniswap.toLowerCase().includes('3850c7bd'))throw new Error('Uniswap V3 slot0/spot selector must not be used as price authority');
          if(curve.toLowerCase().includes('get_dy('))throw new Error('Curve get_dy spot quote must not be used as price authority');
          const marketIndex=workflow.indexOf('Refresh one shared external market-price snapshot');
          const shadowIndex=workflow.indexOf('Observe onchain prices in fail-open shadow mode');
          const publicIndex=workflow.indexOf('Rebuild public fund + company capital view');
          if(!(marketIndex>=0&&shadowIndex>marketIndex&&publicIndex>shadowIndex))throw new Error('Heartbeat order drift');
          console.log('Onchain shadow heartbeat + reusable Curve EMA integration PASS',{failOpen:true,blockPinnedCurveOracle:true,curveSpotAuthority:false,uniswapObserveNotSpot:true,pythReadonly:true,hermes:false,productionPriceAuthority:false});
          NODE
          git diff --check