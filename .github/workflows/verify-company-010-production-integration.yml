name: "Verify Company #010 · Production Integration"

on:
  pull_request:
    paths:
      - 'onboarding/company-010-reconciliation.mjs'
      - 'onboarding/company-010-production-state.mjs'
      - 'intelligence/capital-state/capital-state.mjs'
      - '.github/workflows/update-company-010-state.yml'
      - '.github/workflows/update-capital-state.yml'
      - '.github/workflows/verify-company-010-production-integration.yml'

permissions:
  contents: read

concurrency:
  group: verify-company-010-production-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Validate candidate syntax
        run: |
          set -euo pipefail
          node --check onboarding/company-010-reconciliation.mjs
          node --check onboarding/company-010-production-state.mjs
          node --check intelligence/capital-state/capital-state.mjs
      - name: Install bounded Company #010 dependencies
        run: npm install --no-save ethers@6 @aave-dao/aave-address-book
      - name: Rebuild reviewed Company #010 evidence and reconciled state
        env:
          ETH_RPC_URL: ${{ secrets.ETH_RPC_URL }}
          ETH_RPC_URL_2: ${{ secrets.ETH_RPC_URL_2 }}
          BASE_RPC_URL: ${{ secrets.BASE_RPC_URL }}
          BASE_RPC_URL_2: ${{ secrets.BASE_RPC_URL_2 }}
          ARBITRUM_RPC_URL: ${{ secrets.ARBITRUM_RPC_URL }}
          OPTIMISM_RPC_URL: ${{ secrets.OPTIMISM_RPC_URL }}
          POLYGON_RPC_URL: ${{ secrets.POLYGON_RPC_URL }}
          HYPEREVM_RPC_URL: ${{ secrets.HYPEREVM_RPC_URL }}
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
        run: |
          set -euo pipefail
          node onboarding/company-010-discovery.mjs
          node onboarding/company-010-resolve.mjs
          node onboarding/company-010-deep-resolve.mjs
          node onboarding/company-010-closure.mjs
          node onboarding/company-010-closure-review.mjs
          node onboarding/company-010-gmx-reader.mjs
          node onboarding/company-010-reconciliation.mjs
          node onboarding/company-010-production-state.mjs
      - name: Rebuild established General Balance and Capital State
        env:
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
        run: |
          set -euo pipefail
          node intelligence/capital-state/general-company-balance-sheet.mjs
          node intelligence/capital-state/capital-state.mjs
      - name: Independent reconciliation review
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs');
          const r=JSON.parse(fs.readFileSync('companies/company-010-reconciliation.json','utf8'));
          const s=JSON.parse(fs.readFileSync('companies/company-010-production-state.json','utf8'));
          const c=JSON.parse(fs.readFileSync('intelligence/capital-state/capital-state.json','utf8'));
          const errors=[];
          if(r.version!=='0.1-company-010-capital-reconciliation')errors.push('reconciliation version');
          if(s.version!=='0.2-company-010-production-state-reconciled')errors.push('Cypher state version');
          if(s.company?.registry!=='010'||s.company?.name!=='Cypher')errors.push('Cypher identity');
          if(s.capital?.totalCapitalComplete!==false||s.capital?.knownButUnboundCapitalMayExist!==true)errors.push('Cypher partial-total semantics');
          const eth=(s.capital?.positions||[]).find(x=>x.symbol==='ETH');
          if(!(Number(eth?.components?.aaveArbitrumWstEthEquivalentEth)>0))errors.push('Aave Arbitrum wstETH missing');
          const btc=(s.capital?.positions||[]).find(x=>x.symbol==='BTC');
          if(Number(btc?.quantity||0)<Number(r.aaveArbitrum?.result?.totalWBTC||0))errors.push('BTC reconciliation');
          if((s.capital?.positions||[]).filter(x=>String(x.assetId||'').startsWith('gmx-gm-')).length!==2)errors.push('GMX two-market valuation');
          if((s.productivity?.positions||[]).filter(x=>String(x.id||'').startsWith('gmx-gm-')&&x.status==='measured').length!==2)errors.push('GMX APY proof');
          const hl=(r.hyperlend?.result?.positions||[]);
          if(hl.length>0&&(s.capital?.positions||[]).filter(x=>String(x.assetId||'').startsWith('hyperlend-')).length!==hl.length)errors.push('HyperLend capital binding');
          const cvx=Number(r.convexCvxCrv?.result?.totalCvxCRV||0);
          if(cvx>0&&!(s.capital?.positions||[]).some(x=>x.assetId==='convex-crv'))errors.push('cvxCRV capital binding');
          if(!s.gaps?.some(x=>x.id==='fluid-net-eth'&&x.severity==='blocking-total-capital'))errors.push('Fluid blocker');
          if(c.network?.registryCompanyCount!==10||c.network?.measuredCompanyCount!==10||c.network?.totalCapitalCompleteCompanyCount!==9)errors.push('10 measured / 9 complete');
          if(c.network?.networkTvlUsd!==null)errors.push('Network TVL must remain withheld while Fluid incomplete');
          if(!(Number(c.network?.measuredCapitalFloorUsd)>0))errors.push('network measured floor');
          if(c.authority?.executionAuthority!=='none'||s.authority?.executionAuthority!=='none'||r.authority?.executionAuthority!=='none')errors.push('authority drift');
          if(errors.length)throw new Error(`Company #010 reconciliation review failed: ${errors.join(', ')}`);
          console.log('COMPANY #010 RECONCILIATION REVIEW GREEN',{knownCapitalFloorUsd:s.capital.knownCapitalFloorUsd,ethQuantity:eth.quantity,aaveWstEthEq:eth.components.aaveArbitrumWstEthEquivalentEth,hyperlendPositions:hl.length,cvxCRV:cvx,networkMeasuredFloor:c.network.measuredCapitalFloorUsd,executionAuthority:'none'});
          NODE
