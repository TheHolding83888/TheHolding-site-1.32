name: "Verify Company #010 · Production Integration"

on:
  pull_request:
    paths:
      - 'onboarding/company-010-reconciliation.mjs'
      - 'onboarding/company-010-stakedao-intelligence.mjs'
      - 'onboarding/company-010-production-baseline.mjs'
      - 'onboarding/company-010-production-state.mjs'
      - 'onboarding/company-010-stakedao-overlay.mjs'
      - 'intelligence/capital-state/capital-state.mjs'
      - '.github/workflows/update-company-010-state.yml'
      - '.github/workflows/update-capital-state.yml'
      - '.github/workflows/verify-company-010-production-integration.yml'

permissions:
  contents: read

concurrency:
  group: verify-company-010-production-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Validate candidate syntax
        run: |
          set -euo pipefail
          node --check onboarding/company-010-reconciliation.mjs
          node --check onboarding/company-010-stakedao-intelligence.mjs
          node --check onboarding/company-010-production-baseline.mjs
          node --check onboarding/company-010-production-state.mjs
          node --check onboarding/company-010-stakedao-overlay.mjs
          node --check intelligence/capital-state/capital-state.mjs
      - name: Install bounded Company #010 dependencies
        run: npm install --no-save ethers@6 @aave-dao/aave-address-book
      - name: Rebuild reviewed Company #010 evidence and complete state
        env:
          ETH_RPC_URL: ${{ secrets.ETH_RPC_URL }}
          ETH_RPC_URL_2: ${{ secrets.ETH_RPC_URL_2 }}
          BASE_RPC_URL: ${{ secrets.BASE_RPC_URL }}
          BASE_RPC_URL_2: ${{ secrets.BASE_RPC_URL_2 }}
          ARBITRUM_RPC_URL: ${{ secrets.ARBITRUM_RPC_URL }}
          OPTIMISM_RPC_URL: ${{ secrets.OPTIMISM_RPC_URL }}
          POLYGON_RPC_URL: ${{ secrets.POLYGON_RPC_URL }}
          HYPEREVM_RPC_URL: ${{ secrets.HYPEREVM_RPC_URL }}
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
        run: |
          set -euo pipefail
          node onboarding/company-010-discovery.mjs
          node onboarding/company-010-resolve.mjs
          node onboarding/company-010-deep-resolve.mjs
          node onboarding/company-010-closure.mjs
          node onboarding/company-010-closure-review.mjs
          node onboarding/company-010-gmx-reader.mjs
          node onboarding/company-010-reconciliation.mjs
          node onboarding/company-010-stakedao-intelligence.mjs
          node onboarding/company-010-production-baseline.mjs
          node onboarding/company-010-stakedao-overlay.mjs
      - name: Build Capital State with complete Cypher
        run: |
          set -euo pipefail
          node -e "const fs=require('fs');const g=JSON.parse(fs.readFileSync('intelligence/capital-state/general-company-balance-sheet.json'));if(g.version!=='0.1-general-company-balance-sheet'||g.status!=='ok'||g.companies?.length!==8)throw new Error('canonical established General Balance unavailable');"
          node intelligence/capital-state/capital-state.mjs
      - name: Independent Stake DAO and network review
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs');
          const r=JSON.parse(fs.readFileSync('companies/company-010-reconciliation.json','utf8'));
          const s=JSON.parse(fs.readFileSync('companies/company-010-production-state.json','utf8'));
          const c=JSON.parse(fs.readFileSync('intelligence/capital-state/capital-state.json','utf8'));
          const errors=[];
          if(r.version!=='0.2-company-010-capital-reconciliation-stakedao-base')errors.push('reconciliation version');
          if(r.stakeDaoIntelligence?.version!=='0.1-stakedao-accountant-strategy-api')errors.push('Stake DAO intelligence');
          if(s.version!=='0.3-company-010-production-state-stakedao-complete')errors.push('Cypher state version');
          if(s.company?.architecture!=='The Holding Standard')errors.push('architecture');
          if(s.capital?.totalCapitalComplete!==true||s.capital?.knownButUnboundCapitalMayExist!==false)errors.push('Cypher complete-total semantics');
          if(!(Number(s.capital?.totalCapitalUsd)>0))errors.push('Cypher total capital');
          const eth=(s.capital?.positions||[]).find(x=>x.symbol==='ETH');
          if(!(Number(eth?.components?.aaveArbitrumWstEthEquivalentEth)>0))errors.push('Aave Arbitrum wstETH missing');
          if((s.capital?.positions||[]).filter(x=>String(x.assetId||'').startsWith('gmx-gm-')).length!==2)errors.push('GMX two-market valuation');
          const stake=(s.capital?.positions||[]).find(x=>x.assetId==='stakedao-base-curve-4pool');
          if(!(Number(stake?.valueUsd)>0))errors.push('Stake DAO capital');
          if(stake?.underlying?.length!==4)errors.push('Stake DAO decomposition');
          const expected=new Set(['USDC','USDbC','axlUSDC','crvUSD']);
          for(const x of stake?.underlying||[])expected.delete(x.symbol);
          if(expected.size)errors.push('Stake DAO missing '+[...expected].join(','));
          const reward=(s.rewards?.observations||[]).find(x=>x.id==='stakedao-base-curve-4pool-crv');
          if(!reward||reward.token!=='CRV'||reward.status!=='measured'||!(Number(reward.claimable)>=0))errors.push('Stake DAO CRV claimable');
          const prod=(s.productivity?.positions||[]).find(x=>x.id==='stakedao_base_curve_4pool');
          if(!prod||prod.status!=='measured'||!(Number(prod.referenceAprPct)>=0))errors.push('Stake DAO official APR');
          if(r.stakeDaoBase?.result?.referenceAprSource!=='Stake DAO official /api/strategies/curve/8453.json')errors.push('Stake DAO APR source');
          if(r.stakeDaoBase?.result?.rewardAccounting?.source!=='Stake DAO verified Accountant integral state on Base')errors.push('Stake DAO reward source');
          if((s.gaps||[]).some(x=>x.id==='fluid-net-eth'))errors.push('Fluid blocker remains');
          if(s.epistemicBoundary?.fluidOwnerPolicy!=='out-of-scope')errors.push('Fluid owner policy');
          if((s.capital?.positions||[]).some(x=>String(x.protocol||'').toLowerCase()==='fluid'))errors.push('Fluid capital leaked');
          if(s.performance?.complete!==false||s.performance?.status!=='partial-cost-basis')errors.push('Performance must remain independent/pending');
          if(c.network?.registryCompanyCount!==10||c.network?.measuredCompanyCount!==10||c.network?.totalCapitalCompleteCompanyCount!==10)errors.push('network not 10/10 complete');
          if(!(Number(c.network?.networkTvlUsd)>0)||c.network?.networkTvlStatus!=='complete')errors.push('Network TVL not restored');
          if(Math.abs(Number(c.network?.networkTvlUsd)-Number(c.network?.measuredCapitalFloorUsd))>0.05)errors.push('network exact/floor drift');
          if(c.authority?.executionAuthority!=='none'||s.authority?.executionAuthority!=='none'||r.authority?.executionAuthority!=='none')errors.push('authority drift');
          if(errors.length)throw new Error(`Company #010 complete review failed: ${errors.join(', ')}`);
          console.log('COMPANY #010 STAKE DAO COMPLETE REVIEW GREEN',{totalCapitalUsd:s.capital.totalCapitalUsd,stakeDaoValueUsd:stake.valueUsd,stakeDaoClaimableCrv:reward.claimable,stakeDaoReferenceAprPct:prod.referenceAprPct,networkTvlUsd:c.network.networkTvlUsd,fluid:'out-of-scope',performance:s.performance.status,executionAuthority:'none'});
          NODE
