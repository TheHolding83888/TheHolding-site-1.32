name: "Verify Company #010 · Production Integration"

on:
  pull_request:
    paths:
      - 'onboarding/company-010-reconciliation.mjs'
      - 'onboarding/company-010-stakedao-intelligence.mjs'
      - 'onboarding/company-010-production-baseline.mjs'
      - 'onboarding/company-010-production-state.mjs'
      - 'onboarding/company-010-stakedao-overlay.mjs'
      - 'onboarding/company-010-crv-strategy-overlay.mjs'
      - 'onboarding/company-010-gmx-strategy-overlay.mjs'
      - 'productivity/company-010-productivity-overlay.mjs'
      - 'rewards/company-010-rewards-overlay.mjs'
      - 'intelligence/capital-state/capital-state.mjs'
      - '.github/workflows/update-company-010-state.yml'
      - '.github/workflows/update-capital-state.yml'
      - '.github/workflows/update-productivity.yml'
      - '.github/workflows/update-company-rewards.yml'
      - '.github/workflows/verify-company-010-production-integration.yml'

permissions:
  contents: read

concurrency:
  group: verify-company-010-production-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
      - name: Validate candidate syntax
        run: |
          set -euo pipefail
          node --check onboarding/company-010-reconciliation.mjs
          node --check onboarding/company-010-stakedao-intelligence.mjs
          node --check onboarding/company-010-production-baseline.mjs
          node --check onboarding/company-010-production-state.mjs
          node --check onboarding/company-010-stakedao-overlay.mjs
          node --check onboarding/company-010-crv-strategy-overlay.mjs
          node --check onboarding/company-010-gmx-strategy-overlay.mjs
          node --check productivity/company-010-productivity-overlay.mjs
          node --check rewards/company-010-rewards-overlay.mjs
          node --check intelligence/capital-state/capital-state.mjs
      - name: Install bounded Company #010 dependencies
        run: npm install --no-save ethers@6 @aave-dao/aave-address-book
      - name: Rebuild reviewed Company #010 evidence and complete state
        env:
          ETH_RPC_URL: ${{ secrets.ETH_RPC_URL }}
          ETH_RPC_URL_2: ${{ secrets.ETH_RPC_URL_2 }}
          BASE_RPC_URL: ${{ secrets.BASE_RPC_URL }}
          BASE_RPC_URL_2: ${{ secrets.BASE_RPC_URL_2 }}
          ARBITRUM_RPC_URL: ${{ secrets.ARBITRUM_RPC_URL }}
          OPTIMISM_RPC_URL: ${{ secrets.OPTIMISM_RPC_URL }}
          POLYGON_RPC_URL: ${{ secrets.POLYGON_RPC_URL }}
          HYPEREVM_RPC_URL: ${{ secrets.HYPEREVM_RPC_URL }}
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
        run: |
          set -euo pipefail
          node onboarding/company-010-discovery.mjs
          node onboarding/company-010-resolve.mjs
          node onboarding/company-010-deep-resolve.mjs
          node onboarding/company-010-closure.mjs
          node onboarding/company-010-closure-review.mjs
          node onboarding/company-010-gmx-reader.mjs
          node onboarding/company-010-reconciliation.mjs
          node onboarding/company-010-stakedao-intelligence.mjs
          node onboarding/company-010-production-baseline.mjs
          node onboarding/company-010-stakedao-overlay.mjs
          node - <<'NODE'
          const fs=require('fs');
          const r=JSON.parse(fs.readFileSync('companies/company-010-resolve.json','utf8'));
          const c=r.exactProbes?.concentrator;
          if(r.version!=='0.2-company-010-new-mechanism-measured-stakedao-asdcrv'||!c?.result) throw new Error('canonical Concentrator resolver projection unavailable');
          fs.writeFileSync('/tmp/company-010-crv-resolve.json',JSON.stringify({version:r.version,concentrator:c},null,2)+'\n');
          NODE
          COMPANY_010_RESOLVE_INPUT=/tmp/company-010-crv-resolve.json node onboarding/company-010-crv-strategy-overlay.mjs
          node onboarding/company-010-gmx-strategy-overlay.mjs
          node - <<'NODE'
          const fs=require('fs');
          const p='companies/company-010-production-state.json';
          const d=JSON.parse(fs.readFileSync(p,'utf8'));
          if(d.strategies?.crv?.version!=='0.1-company-010-crv-strategy-intelligence') throw new Error('CRV strategy overlay did not run');
          d.version='0.3-company-010-production-state-stakedao-complete';
          d.engineVersion='0.4-cypher-crv-strategy-intelligence';
          fs.writeFileSync(p,JSON.stringify(d,null,2)+'\n');
          NODE
      - name: Build Capital State with complete Cypher
        run: |
          set -euo pipefail
          node -e "const fs=require('fs');const g=JSON.parse(fs.readFileSync('intelligence/capital-state/general-company-balance-sheet.json'));if(g.version!=='0.1-general-company-balance-sheet'||g.status!=='ok'||g.companies?.length!==8)throw new Error('canonical established General Balance unavailable');"
          node intelligence/capital-state/capital-state.mjs
      - name: Independent Stake DAO, GMX, CRV and network review
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs');
          const r=JSON.parse(fs.readFileSync('companies/company-010-reconciliation.json','utf8'));
          const s=JSON.parse(fs.readFileSync('companies/company-010-production-state.json','utf8'));
          const c=JSON.parse(fs.readFileSync('intelligence/capital-state/capital-state.json','utf8'));
          const errors=[];
          if(r.version!=='0.2-company-010-capital-reconciliation-stakedao-base')errors.push('reconciliation version');
          if(r.stakeDaoIntelligence?.version!=='0.2-stakedao-accountant-curve-base-yield')errors.push('Stake DAO intelligence');
          if(s.version!=='0.3-company-010-production-state-stakedao-complete')errors.push('Cypher state version');
          if(s.engineVersion!=='0.4-cypher-crv-strategy-intelligence')errors.push('Cypher CRV engine version');
          if(s.company?.architecture!=='The Holding Standard')errors.push('architecture');
          if(s.capital?.totalCapitalComplete!==true||s.capital?.knownButUnboundCapitalMayExist!==false)errors.push('Cypher complete-total semantics');
          if(!(Number(s.capital?.totalCapitalUsd)>0))errors.push('Cypher total capital');
          const eth=(s.capital?.positions||[]).find(x=>x.symbol==='ETH');
          if(!(Number(eth?.components?.aaveArbitrumWstEthEquivalentEth)>0))errors.push('Aave Arbitrum wstETH missing');
          const crv=s.strategies?.crv;
          if(crv?.version!=='0.1-company-010-crv-strategy-intelligence'||crv.status!=='measured'||crv.strategies?.length!==2)errors.push('CRV strategy intelligence');
          if(crv?.accountingBoundary?.wrappersNotSummedAsCrvUnits!==true||crv?.accountingBoundary?.noDoubleCount!==true)errors.push('CRV accounting boundary');
          const conc=crv?.strategies?.find(x=>x.id==='concentrator-asdcrv');
          const cvx=crv?.strategies?.find(x=>x.id==='convex-staked-cvxcrv');
          if(!(Number(conc?.principal?.asdCRVShares)>0)||!(Number(conc?.principal?.sdCRVUnderlying)>0)||!(Number(conc?.principal?.navUsd)>0))errors.push('Concentrator principal');
          if(conc?.yield?.incomeMode!=='auto-compounded'||conc?.yield?.publicStatus!=='Compounded'||conc?.yield?.claimableApplicable!==false)errors.push('Concentrator semantics');
          if(!(Number(cvx?.principal?.cvxCRV)>0)||!(Number(cvx?.principal?.navUsd)>0))errors.push('staked cvxCRV principal');
          if(cvx?.yield?.incomeMode!=='separate-claimable-rewards'||cvx?.yield?.publicStatus!=='Claimable'||cvx?.yield?.claimableApplicable!==true)errors.push('staked cvxCRV semantics');
          const directCrv=(s.capital?.positions||[]).find(x=>x.assetId==='curve-dao-token');
          const concCapital=(s.capital?.positions||[]).find(x=>x.assetId==='concentrator-asdcrv');
          const cvxCapital=(s.capital?.positions||[]).find(x=>x.assetId==='convex-staked-cvxcrv');
          if(!directCrv||!concCapital||!cvxCapital||!(Number(concCapital.valueUsd)>0)||!(Number(cvxCapital.valueUsd)>0))errors.push('split CRV capital');
          if(s.epistemicBoundary?.crvWrapperUnitsAreNotAdditiveCrv!==true||s.epistemicBoundary?.compoundedIncomeIsNotClaimableReward!==true||s.epistemicBoundary?.claimableRewardIsNotPrincipal!==true)errors.push('CRV epistemic boundary');
          const gmxRows=(s.capital?.positions||[]).filter(x=>String(x.assetId||'').startsWith('gmx-gm-'));
          if(gmxRows.length!==2||gmxRows.some(x=>!(Number(x.valueUsd)>0)))errors.push('GMX two-market valuation');
          const gmx=s.strategies?.gmx;
          if(gmx?.version!=='0.1.1-company-010-gmx-strategy-intelligence-pool-key-fix'||gmx?.status!=='measured'||gmx?.strategyCount!==2||!(Number(gmx?.totalStrategyNavUsd)>0))errors.push('GMX strategy intelligence');
          for(const x of gmx?.strategies||[]){
            const d=x.poolExposureDiagnostic;
            const weights=[Number(d?.long?.grossTokenWeight),Number(d?.short?.grossTokenWeight)];
            if(!(Number(d?.long?.amount)>0)||!(Number(d?.short?.amount)>0)||!(Number(d?.grossPoolTokenValueUsd)>0))errors.push('GMX nonzero pool composition '+x.id);
            if(weights.some(v=>!Number.isFinite(v)||v<=0||v>=1)||Math.abs(weights[0]+weights[1]-1)>0.00001)errors.push('GMX pool weights '+x.id);
            if(!(Number(x.yield?.referenceAprPct)>=0)||x.yield?.referenceMetric!=='GMX 30D Fee APY'||x.yield?.incomeMode!=='embedded-in-gm-nav'||x.yield?.claimableApplicable!==false||x.yield?.separateClaimStep!==false)errors.push('GMX yield semantics '+x.id);
          }
          if(gmx?.accountingBoundary?.underlyingPoolTokensAddedToReserveBalances!==false||gmx?.accountingBoundary?.gmTokenNavCountedOnce!==true||gmx?.accountingBoundary?.noDoubleCount!==true)errors.push('GMX accounting boundary');
          if(gmx?.rewardsBoundary?.separateClaimableLpFees!==false||gmx?.rewardsBoundary?.claimableStatus!=='not-applicable-by-mechanism')errors.push('GMX rewards boundary');
          if((s.rewards?.unboundMechanisms||[]).includes('GMX GM markets'))errors.push('GMX still unbound in rewards');
          const embedded=(s.rewards?.embeddedIncomeMechanisms||[]).find(x=>x.id==='gmx-v2-market-liquidity');
          if(!embedded||embedded.incomeMode!=='embedded-in-gm-nav'||embedded.claimableApplicable!==false)errors.push('GMX embedded income mechanism');
          const stakeEvidence=r.stakeDaoBase;
          const stakeUsd=Number(stakeEvidence?.result?.totalPositionUsd);
          const stakeResolved=stakeEvidence?.ok===true&&Number.isFinite(stakeUsd)&&stakeUsd>=0;
          const stakeActive=stakeResolved&&stakeUsd>0;
          const stake=(s.capital?.positions||[]).find(x=>x.assetId==='stakedao-base-curve-4pool');
          const prod=(s.productivity?.positions||[]).find(x=>x.id==='stakedao_base_curve_4pool');
          if(!stakeResolved)errors.push('Stake DAO current lifecycle unresolved');
          if(stakeActive){
            if(!(Number(stake?.valueUsd)>0))errors.push('Stake DAO active capital');
            if(stake?.underlying?.length!==4)errors.push('Stake DAO active decomposition');
            const expected=new Set(['USDC','USDbC','axlUSDC','crvUSD']);
            for(const x of stake?.underlying||[])expected.delete(x.symbol);
            if(expected.size)errors.push('Stake DAO missing '+[...expected].join(','));
            if(!prod||prod.status!=='measured'||!(Number(prod.referenceAprPct)>=0))errors.push('Stake DAO active Curve Base APY');
            if(r.stakeDaoBase?.result?.referenceAprSource!=='Curve official /v1/getBaseApys/base')errors.push('Stake DAO active APY source');
          }else if(stakeResolved){
            if(stake)errors.push('Stake DAO proven-zero capital row survived');
            if(prod)errors.push('Stake DAO proven-zero Productivity row survived');
            if(s.provenance?.stakeDaoBase?.zeroIsKnown!==true||s.provenance?.stakeDaoBase?.currentPositionActive!==false)errors.push('Stake DAO proven-zero provenance missing');
            if(s.epistemicBoundary?.knownZeroIsNotUnknown!==true)errors.push('known-zero epistemic boundary missing');
          }
          const reward=(s.rewards?.observations||[]).find(x=>x.id==='stakedao-base-curve-4pool-crv');
          if(!reward||reward.token!=='CRV'||reward.status!=='measured'||!(Number(reward.claimable)>=0))errors.push('Stake DAO CRV claimable');
          if(stakeActive&&r.stakeDaoBase?.result?.rewardAccounting?.source!=='Stake DAO verified Accountant integral state on Base')errors.push('Stake DAO active reward source');
          if((s.gaps||[]).some(x=>x.id==='fluid-net-eth'))errors.push('Fluid blocker remains');
          if(s.epistemicBoundary?.fluidOwnerPolicy!=='out-of-scope')errors.push('Fluid owner policy');
          if((s.capital?.positions||[]).some(x=>String(x.protocol||'').toLowerCase()==='fluid'))errors.push('Fluid capital leaked');
          if(s.performance?.complete!==false||s.performance?.status!=='partial-cost-basis')errors.push('Performance must remain independent/pending');
          if(c.network?.registryCompanyCount!==10||c.network?.measuredCompanyCount!==10||c.network?.totalCapitalCompleteCompanyCount!==10)errors.push('network not 10/10 complete');
          if(!(Number(c.network?.networkTvlUsd)>0)||c.network?.networkTvlStatus!=='complete')errors.push('Network TVL not restored');
          if(Math.abs(Number(c.network?.networkTvlUsd)-Number(c.network?.measuredCapitalFloorUsd))>0.05)errors.push('network exact/floor drift');
          if(c.authority?.executionAuthority!=='none'||s.authority?.executionAuthority!=='none'||r.authority?.executionAuthority!=='none'||gmx?.authority?.executionAuthority!=='none'||crv?.authority?.executionAuthority!=='none')errors.push('authority drift');
          if(errors.length)throw new Error(`Company #010 complete review failed: ${errors.join(', ')}`);
          console.log('COMPANY #010 CRV + GMX + STAKE DAO LIFECYCLE REVIEW GREEN',{totalCapitalUsd:s.capital.totalCapitalUsd,concentratorUsd:conc.principal.navUsd,cvxCrvUsd:cvx.principal.navUsd,cvxCrvClaimableUsd:cvx.claimable.usd,gmxNavUsd:gmx.totalStrategyNavUsd,stakeDaoCurrentPositionActive:stakeActive,stakeDaoCurrentPositionUsd:stakeUsd,stakeDaoClaimableCrv:reward.claimable,stakeDaoReferenceAprPct:prod?.referenceAprPct??null,networkTvlUsd:c.network.networkTvlUsd,fluid:'out-of-scope',performance:s.performance.status,executionAuthority:'none'});
          NODE
      - name: Run Company #010 Productivity overlay
        run: |
          set -euo pipefail
          node productivity/company-010-productivity-overlay.mjs
      - name: Run Company #010 Rewards overlay
        run: |
          set -euo pipefail
          node rewards/company-010-rewards-overlay.mjs
      - name: Verify global Productivity and Rewards admission
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs');
          const p=JSON.parse(fs.readFileSync('companies/productivity-data.json','utf8'));
          const r=JSON.parse(fs.readFileSync('companies/rewards-data.json','utf8'));
          const pc=p.companies?.Cypher,rc=r.companies?.Cypher;
          const errors=[];
          if(p.version!=='1.16'||p.collectorVersion!=='1.16-company-010-state-backed-productivity-admission')errors.push('Productivity v1.16');
          if(!pc||!(Number(pc.productiveValue)>0)||!(Number(pc.coveredProductiveValue)>0))errors.push('Cypher Productivity');
          if(!(Number(pc.coverage)>0&&Number(pc.coverage)<=1))errors.push('Productivity coverage');
          for(const id of ['projectx_hype','concentrator_asdcrv','convex_staked_cvxcrv']){
            const row=(pc?.breakdown||[]).find(x=>x.engineId===id);
            if(row&&row.apr===0)errors.push(id+' unknown collapsed to zero');
          }
          if(r.version!=='0.3.10'||r.collectorVersion!=='0.3.10-company-010-stakedao-state-admission')errors.push('Rewards v0.3.10');
          if(!rc||rc.totalUsdIsComplete!==false||rc.status!=='partial')errors.push('Cypher Rewards partial semantics');
          const stakeCrv=(rc?.rewards||[]).find(x=>x.route==='stakedao-base-curve-4pool'&&x.symbol==='CRV');
          if(!stakeCrv||!(Number(stakeCrv.amount)>=0)||!(Number(stakeCrv.usdValue)>=0))errors.push('Stake DAO CRV global reward');
          const cvxSource=(rc?.sources||[]).find(x=>x.route==='convex-staked-cvxcrv');
          if(!cvxSource||cvxSource.status!=='ok'||cvxSource.details?.rewardState!=='Claimable')errors.push('Convex staked cvxCRV route');
          const concEmbedded=(rc?.embeddedIncome||[]).find(x=>x.route==='concentrator-asdcrv');
          if(!concEmbedded||concEmbedded.state!=='Compounded'||concEmbedded.claimableApplicable!==false)errors.push('Concentrator compounded route');
          for(const route of ['aerodrome-ve','velodrome-ve-direct','votium-union']){
            const src=(rc?.sources||[]).find(x=>x.route===route);
            if(!src||src.status!=='warming'||src.details?.unknownIsNotZero!==true)errors.push('Rewards unknown route '+route);
          }
          if(rc?.settlement?.unknownRouteIsNotZero!==true||rc?.settlement?.totalUsdIsComplete!==false)errors.push('Rewards completion guard');
          if(errors.length)throw new Error('Global Company #010 admission failed: '+errors.join(', '));
          console.log('COMPANY #010 GLOBAL PRODUCTIVITY + REWARDS GREEN',{productivityApr:pc.aprLatest,productivityCoverage:pc.coverage,rewardsKnownUsd:rc.totalUsd,stakeDaoClaimableCrv:stakeCrv.amount,convexClaimableCount:(rc.rewards||[]).filter(x=>x.route==='convex-staked-cvxcrv').length,rewardsComplete:rc.totalUsdIsComplete});
          NODE
