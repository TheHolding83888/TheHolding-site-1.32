# THE HOLDING · ECONOMIC GRAPH v0.2
name: "The Holding · Economic Graph"

on:
  workflow_dispatch:
  schedule:
    - cron: "17 8 * * *"
  workflow_run:
    workflows:
      - "The Holding Capital · Unified Refresh"
    types: [completed]
  pull_request:
    paths:
      - "intelligence/economic-graph/**"
      - "productivity/fxn-locker-apr-guard.mjs"
      - "productivity/fxn-locker-apr-guard-validation.mjs"
      - "productivity/yieldring-productivity-overlay.mjs"
      - ".github/workflows/update-economic-graph.yml"
      - ".github/workflows/resume-economic-graph-after-code-change.yml"
      - ".github/workflows/verify-economic-graph-live-build.yml"
  push:
    branches:
      - main
    paths:
      - "companies/productivity-data.json"

permissions:
  contents: write

concurrency:
  group: the-holding-economic-graph
  cancel-in-progress: false

jobs:
  build:
    if: >-
      ${{
        github.event_name != 'workflow_run' ||
        (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout canonical state
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || 'main' }}

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Static and deterministic validation
        shell: bash
        run: |
          set -euo pipefail
          node --check productivity/fxn-locker-apr-guard.mjs
          node --check productivity/yieldring-productivity-overlay.mjs
          node --check intelligence/economic-graph/economic-graph.mjs
          node --check intelligence/economic-graph/economic-graph-canonical-runner.mjs
          node --check intelligence/economic-graph/protocol-lifecycle.mjs
          node --check intelligence/economic-graph/protocol-lifecycle-canary.mjs
          node --check intelligence/economic-graph/frax-vefrax-lifecycle.mjs
          node --check intelligence/economic-graph/frax-vefrax-lifecycle-canary.mjs
          node -e "JSON.parse(require('fs').readFileSync('intelligence/economic-graph/protocol-lifecycle-policy.json','utf8')); console.log('PROTOCOL LIFECYCLE POLICY JSON PASS')"
          node intelligence/economic-graph/protocol-lifecycle-canary.mjs
          node intelligence/economic-graph/frax-vefrax-lifecycle-canary.mjs
          node productivity/fxn-locker-apr-guard-validation.mjs
          TMP="$(mktemp)"
          ECONOMIC_GRAPH_FILE="$TMP" node intelligence/economic-graph/economic-graph.mjs --deterministic-validation
          node - "$TMP" <<'NODE'
          const fs=require('fs');
          const x=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          const fx=x.latest?.observation;
          const curve=x.cohorts?.['defitea-curve-vecrv']?.latest?.observation;
          if(x.version!=='0.1-economic-graph'||x.engineVersion!=='0.2-defitea-fxn-curve-multi-cohort')throw new Error('Economic Graph version mismatch');
          if(x.status!=='partial-first-cohort'||x.statusCompatibility?.deprecated!==true)throw new Error('Legacy first-cohort compatibility contract missing');
          if(x.coverage?.status!=='partial-two-cohort'||Number(x.coverage?.cohortCount)!==2)throw new Error('Two-cohort coverage missing');
          if(x.authority?.readOnly!==true||x.authority?.executionAuthority!=='none')throw new Error('Economic Graph authority regression');
          if(x.authority?.capitalExecution!==false||x.authority?.allocationAuthority!==false||x.authority?.recommendationAuthority!==false||x.authority?.causalClaimAuthority!=='none')throw new Error('Economic Graph authority leakage');
          if(x.semantics?.aprParityRequired!==true||Number(x.semantics?.aprParityTolerancePctPoints)!==0.01)throw new Error('APR parity boundary missing');
          if(x.attribution?.primaryDriver!==null||x.attribution?.status!=='warming-unresolved-causality')throw new Error('Legacy veFXN causal boundary drift');
          if(fx?.protocol!=='f(x)'||fx?.mechanism!=='veFXN Locker'||fx?.cohortId!=='defitea-fxn-vefxn')throw new Error('Legacy veFXN cohort mismatch');
          if(fx?.epistemic?.causalAttribution!=='unresolved')throw new Error('veFXN causal attribution leaked');
          if(!Number.isFinite(Number(fx?.drivers?.fxnCirculatingSupplyLockedPct)))throw new Error('veFXN locked circulating-supply driver missing');
          if(Math.abs(Number(fx?.aprParityDeltaPctPoints))>0.01)throw new Error('Deterministic veFXN APR parity failed');
          if(curve?.protocol!=='Curve'||curve?.mechanism!=='veCRV Fee Distributor'||curve?.cohortId!=='defitea-curve-vecrv')throw new Error('Curve veCRV cohort missing');
          if(curve?.source?.sourceType!=='onchain')throw new Error('Curve cohort lost onchain source authority');
          if(curve?.formula?.status!=='proven-canonical-collector-identity')throw new Error('Curve canonical formula proof missing');
          if(Math.abs(Number(curve?.formulaParityDeltaPctPoints))>0.01)throw new Error('Curve rolling APR formula parity failed');
          if(!Array.isArray(curve?.drivers?.completedWeeks)||curve.drivers.completedWeeks.length<1)throw new Error('Curve completed-week drivers missing');
          if(curve?.epistemic?.mechanicalAttribution!=='proven-within-apr-formula')throw new Error('Curve mechanical attribution class missing');
          if(curve?.epistemic?.causalAttribution!=='unresolved-beyond-formula'||curve?.epistemic?.primaryDriver!==null)throw new Error('Curve upstream causal uncertainty was over-promoted');
          if(x.cohorts?.['defitea-curve-vecrv']?.attribution?.formulaProven!==true)throw new Error('Curve formula attribution surface missing');
          if(!x.expansionQueue.some(v=>String(v).includes('Convex vlCVX'))||!x.expansionQueue.some(v=>String(v).includes('Aerodrome veAERO'))||!x.expansionQueue.some(v=>String(v).includes('sAERO Predictive Allocation')))throw new Error('Expansion canon missing');
          console.log('ECONOMIC GRAPH deterministic semantics PASS',{
            observations:x.observations.length,
            cohorts:x.coverage.cohortCount,
            fxnPrimaryDriver:x.attribution.primaryDriver,
            curveApr:curve.canonicalProductivityAprPct,
            curveFormulaParity:curve.formulaParityDeltaPctPoints,
            executionAuthority:x.authority.executionAuthority
          });
          NODE
          rm -f "$TMP"
          git diff --check

      - name: Verify canonical Curve source state on PR
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs');
          const p=JSON.parse(fs.readFileSync('companies/productivity-data.json','utf8'));
          const e=p.engines?.curve_vecrv;
          if(!e||e.status!=='ok'||e.sourceType!=='onchain')throw new Error('Canonical curve_vecrv engine is not current onchain state');
          if(e.details?.contract!=='0xD16d5eC345Dd86Fb63C6a9C43c517210F1027914')throw new Error('Curve Fee Distributor contract drift');
          if(!Array.isArray(e.details?.weekly)||e.details.weekly.length<1)throw new Error('Curve completed-week state missing');
          if(!Number.isFinite(Number(e.aprLatest))||!Number.isFinite(Number(e.details?.crvPrice)))throw new Error('Curve canonical APR/price missing');
          console.log('CURVE veCRV canonical source PASS',{
            apr:e.aprLatest,
            weeks:e.details.weekly.length,
            latestWeek:e.details.weekly[0]?.week,
            latestWeekFeesCrvUSD:e.details.weekly[0]?.tokensCrvUSD,
            latestWeekVeSupply:e.details.weekly[0]?.veSupply
          });
          NODE

      - name: Install live probe dependencies on PR
        if: github.event_name == 'pull_request'
        working-directory: productivity
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          npx playwright install chromium

      - name: Prove live f(x) economic-vitals source on PR
        if: github.event_name == 'pull_request'
        run: node productivity/fxn-locker-apr-guard.mjs --probe-economic-vitals

      - name: Build canonical same-snapshot Economic Graph
        if: github.event_name != 'pull_request'
        run: node intelligence/economic-graph/economic-graph-canonical-runner.mjs

      - name: Validate canonical observation boundary
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs');
          const x=JSON.parse(fs.readFileSync('intelligence/economic-graph/economic-graph.json','utf8'));
          const p=JSON.parse(fs.readFileSync('companies/productivity-data.json','utf8'));
          const fx=x.latest?.observation;
          const curve=x.cohorts?.['defitea-curve-vecrv']?.latest?.observation;
          const s=p.engines?.fx_vefxn?.details?.economicSnapshot;
          if(x.version!=='0.1-economic-graph'||x.engineVersion!=='0.2-defitea-fxn-curve-multi-cohort'||!fx||!curve)throw new Error('canonical Economic Graph multi-cohort state missing');
          if(x.coverage?.status!=='partial-two-cohort'||Number(x.coverage?.cohortCount)!==2)throw new Error('canonical two-cohort coverage missing');
          if(!s||s.snapshotKey!==p.snapshotKey||s.productivityGeneratedAt!==p.generatedAt)throw new Error('canonical f(x) same-snapshot evidence missing');
          if(fx.source?.url!=='https://fx.aladdin.club/v2/lock'||fx.source?.sourceType!=='official-frontend-exact-locker-block')throw new Error('canonical f(x) source authority drift');
          if(fx.observedAt!==s.observedAt||fx.source?.rawBlockHash!==s.rawBlockHash)throw new Error('Economic Graph f(x) observation not bound to canonical same-block snapshot');
          if(!Number.isFinite(Number(fx.liveObservedAprPct))||!Number.isFinite(Number(fx.drivers?.fxnLocked))||!Number.isFinite(Number(fx.drivers?.fxnCirculatingSupplyLockedPct))||!Number.isFinite(Number(fx.drivers?.totalVeFxn))||!Number.isFinite(Number(fx.drivers?.cumulativeThisWeekWsteth))||!Number.isFinite(Number(fx.drivers?.previousWeekWsteth)))throw new Error('canonical f(x) economic vitals incomplete');
          if(Math.abs(Number(fx.aprParityDeltaPctPoints))>0.01)throw new Error('canonical f(x) same-snapshot APR parity failed');
          if(x.attribution?.primaryDriver!==null||fx.epistemic?.causalAttribution!=='unresolved')throw new Error('unearned f(x) causal attribution');
          if(curve.source?.sourceType!=='onchain'||curve.source?.contract!=='0xD16d5eC345Dd86Fb63C6a9C43c517210F1027914')throw new Error('canonical Curve source authority drift');
          if(!Number.isFinite(Number(curve.canonicalProductivityAprPct))||!Number.isFinite(Number(curve.drivers?.crvPriceUsd))||!Number.isFinite(Number(curve.drivers?.rollingFourWeekFeesCrvUSD))||!Number.isFinite(Number(curve.drivers?.rollingAverageVeSupply)))throw new Error('canonical Curve economic drivers incomplete');
          if(Math.abs(Number(curve.formulaParityDeltaPctPoints))>0.01)throw new Error('canonical Curve formula parity failed');
          if(curve.formula?.status!=='proven-canonical-collector-identity')throw new Error('canonical Curve formula identity missing');
          if(curve.epistemic?.mechanicalAttribution!=='proven-within-apr-formula'||curve.epistemic?.causalAttribution!=='unresolved-beyond-formula'||curve.epistemic?.primaryDriver!==null)throw new Error('canonical Curve epistemic boundary regression');
          const l=x.protocolLifecycle;
          if(l?.version!=='0.1-protocol-intelligence-lifecycle'||l?.policyVersion!=='0.1-protocol-intelligence-lifecycle-policy')throw new Error('Protocol lifecycle materialization missing');
          if(l?.authority?.executionAuthority!=='none'||l?.authority?.repositoryMutationAuthority!==false||l?.authority?.workflowDispatchAuthority!==false||l?.authority?.causalClaimAuthority!=='none')throw new Error('Protocol lifecycle authority expansion');
          const fxStage=l?.protocols?.['defitea-fxn-vefxn']?.maturityStage;
          const curveStage=l?.protocols?.['defitea-curve-vecrv']?.maturityStage;
          const aeroStage=l?.protocols?.['defitea-aerodrome-veaero']?.maturityStage;
          const vlcvxStage=l?.protocols?.['defitea-convex-vlcvx-votium']?.maturityStage;
          const fraxProtocol=l?.protocols?.['registry-frax-vefrax'];
          const fraxSensor=x.protocolSensors?.['registry-frax-vefrax'];
          const fraxObservation=fraxSensor?.latest?.observation;
          const fraxStage=fraxProtocol?.maturityStage;
          if(fxStage!=='canonical'||curveStage!=='canonical')throw new Error(`Existing canonical lifecycle stages regressed: f(x)=${fxStage}, Curve=${curveStage}`);
          if(!['verified','canonical'].includes(aeroStage))throw new Error(`Aerodrome lifecycle stage below verified: ${aeroStage}`);
          if(!['verified','canonical'].includes(vlcvxStage))throw new Error(`vlCVX/Votium lifecycle stage below verified: ${vlcvxStage}`);
          if(!fraxProtocol||!fraxSensor||Number(l?.summary?.protocolCount)!==8)throw new Error('Frax lifecycle sensor #8 not materialized');
          if(fraxSensor.authority?.executionAuthority!=='none'||fraxObservation?.epistemic?.executionAuthority!=='none')throw new Error('Frax execution authority expanded');
          if(fraxObservation?.identityBoundary?.currentCanonicalPrincipal!=='FRAX'||fraxObservation?.identityBoundary?.currentCanonicalVoteEscrowLabel!=='veFRAX'||fraxObservation?.identityBoundary?.legacyOfficialApiField!=='core.vefxs.apr')throw new Error('Frax current/legacy identity boundary drift');
          if(!String(fraxObservation?.identityBoundary?.ethereumToFraxtalLockMigrationState||'').startsWith('UNKNOWN')||!String(fraxObservation?.epistemic?.revenueToVeFraxAprCausality||'').startsWith('UNKNOWN'))throw new Error('Frax migration or revenue causality was over-claimed');
          const nativeCount=Number(fraxProtocol?.longitudinalEvidence?.validatedNativePeriodCount||0);
          const requiredNative=Number(fraxProtocol?.longitudinalEvidence?.requiredValidatedNativePeriodCount||0);
          if(!(requiredNative>=2))throw new Error('Frax native-period verification minimum missing');
          if(nativeCount<requiredNative&&fraxStage!=='shadow')throw new Error(`Frax over-promoted without native-period depth: ${fraxStage}`);
          if(nativeCount>=requiredNative&&!['verified','canonical'].includes(fraxStage))throw new Error(`Frax failed deterministic native-period promotion: ${fraxStage}`);
          console.log('ECONOMIC GRAPH canonical + lifecycle source PASS',{
            cohorts:x.coverage.cohortCount,
            fxn:{observedAt:fx.observedAt,apr:fx.liveObservedAprPct,currentWeekWsteth:fx.drivers.cumulativeThisWeekWsteth,parity:fx.aprParityDeltaPctPoints},
            curve:{observedAt:curve.observedAt,apr:curve.canonicalProductivityAprPct,formulaApr:curve.formulaReproducedAprPct,rollingFeesCrvUSD:curve.drivers.rollingFourWeekFeesCrvUSD,rollingAverageVeSupply:curve.drivers.rollingAverageVeSupply,latestWeekFeesCrvUSD:curve.drivers.latestCompletedWeek?.tokensCrvUSD},
            lifecycle:{fxn:fxStage,curve:curveStage,aerodrome:aeroStage,vlcvx:vlcvxStage,frax:fraxStage,fraxNativePeriods:nativeCount,transitions:l.transitions?.length||0}
          });
          NODE

      - name: Publish generated Economic Graph safely
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          GENERATED="intelligence/economic-graph/economic-graph.json"
          test -s "$GENERATED"
          git config user.name "The Holding Economic Graph"
          git config user.email "economic-graph@theholding.ai"
          git add "$GENERATED"
          staged_bad="$(git diff --cached --name-only | grep -Ev '^intelligence/economic-graph/economic-graph\.json$' || true)"
          if [ -n "$staged_bad" ]; then
            echo "ERROR: Economic Graph attempted to stage outside generated boundary:"
            echo "$staged_bad"
            exit 1
          fi
          if git diff --cached --quiet; then echo "Economic Graph already current."; exit 0; fi
          git commit -m "intelligence: refresh economic graph"

          for attempt in 1 2 3; do
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "Publish conflict; refusing to guess."
              exit 1
            fi
            node intelligence/economic-graph/economic-graph-canonical-runner.mjs
            git add "$GENERATED"
            if ! git diff --cached --quiet; then git commit --amend --no-edit; fi
            if git push origin HEAD:main; then
              git fetch origin main
              git cat-file -e "origin/main:$GENERATED"
              REMOTE_ENGINE="$(git show "origin/main:$GENERATED" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>console.log(JSON.parse(s).engineVersion))")"
              test "$REMOTE_ENGINE" = "0.2-defitea-fxn-curve-multi-cohort"
              REMOTE_COHORTS="$(git show "origin/main:$GENERATED" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>console.log(JSON.parse(s).coverage?.cohortCount))")"
              test "$REMOTE_COHORTS" = "2"
              REMOTE_LIFECYCLE="$(git show "origin/main:$GENERATED" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>console.log(JSON.parse(s).protocolLifecycle?.version))")"
              test "$REMOTE_LIFECYCLE" = "0.1-protocol-intelligence-lifecycle"
              echo "Verified Economic Graph v0.2 + Protocol Lifecycle v0.1 on remote main."
              exit 0
            fi
            echo "Main moved during push; retrying ($attempt/3)..."
            sleep $((attempt * 2))
          done
          echo "Economic Graph publish failed after 3 attempts."
          exit 1
