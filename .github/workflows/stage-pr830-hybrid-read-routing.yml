    branches:
      - diagnostic/pr830-runtime-matrix-20260915
    paths:
      - '.github/workflows/stage-pr830-hybrid-read-routing.yml'
permissions:
  contents: write
jobs:
  stage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
