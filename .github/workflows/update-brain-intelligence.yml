name: "The Holding Brain · Grounded Reasoning"

on:
  # Manual recovery / diagnostic path only. Canonical daily cognition now runs
  # through Refresh Cognitive Stack so Security, Brain, Bridge, Cognitive State
  # and downstream Learning share one coherent evidence chain.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: the-holding-brain-reasoning
  cancel-in-progress: false

jobs:
  reason:
    runs-on: ubuntu-latest
    timeout-minutes: 6

    steps:
      - name: Checkout canonical state
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Preflight canonical memory
        shell: bash
        run: |
          set -euo pipefail
          test -s intelligence/brain-reasoning-engine.mjs
          test -s intelligence/brain-vlcvx-votium-curve-shadow-context.mjs
          test -s intelligence/brain-policy.json
          test -s intelligence/change-intelligence.json
          test -s intelligence/system-memory.json
          test -s security/security-intelligence.json
          test -s security/security-memory.json
          test -s intelligence/explanatory/explanatory-context.json

          node --check intelligence/brain-reasoning-engine.mjs
          node --check intelligence/brain-vlcvx-votium-curve-shadow-context.mjs

      - name: Build grounded reasoning packet
        run: |
          set -euo pipefail
          node intelligence/brain-reasoning-engine.mjs
          node intelligence/brain-vlcvx-votium-curve-shadow-context.mjs
      - name: Validate Brain contract
        shell: bash
        run: |
          set -euo pipefail

          node - <<'NODE'
          const fs = require('fs');

          const brain = JSON.parse(fs.readFileSync('intelligence/brain-intelligence.json', 'utf8'));
          const history = JSON.parse(fs.readFileSync('intelligence/brain-history.json', 'utf8'));
          const policy = JSON.parse(fs.readFileSync('intelligence/brain-policy.json', 'utf8'));
          if (brain.version !== '0.1-grounded-reasoning-gateway') {
            throw new Error(`Unexpected Brain version: ${brain.version}`);
          }

          if (brain.reasonerVersion !== '0.1-deterministic-evidence-bound-reasoner') {
            throw new Error(`Unexpected Reasoner version: ${brain.reasonerVersion}`);
          }

          if (policy.mode !== 'read-only-proposal-only') {
            throw new Error('Brain policy is not read-only-proposal-only');
          }
          if (brain.constraints?.actionMode !== 'proposal-only') {
            throw new Error('Brain output escaped proposal-only mode');
          }

          const forbidden = [
            'autonomousCapitalActionAllowed',
            'autonomousRepositoryCodeMutationAllowed',
            'autonomousMethodologyMutationAllowed',
            'sourceDataMutationAllowed',
            'workflowPlaneMutationAllowed',
          ];
          for (const key of forbidden) {
            if (brain.constraints?.[key] !== false) {
              throw new Error(`Forbidden capability became enabled: ${key}`);
            }
          }

          if (!Array.isArray(brain.reasoningCases)) {
            throw new Error('reasoningCases missing');
          }
          for (const item of brain.reasoningCases) {
            if (!Array.isArray(item.evidence) || item.evidence.length === 0) {
              throw new Error(`Reasoning case ${item.id} has no evidence`);
            }
            if (item.actionMode !== 'proposal-only') {
              throw new Error(`Reasoning case ${item.id} is executable`);
            }
            for (const ev of item.evidence) {
              if (!ev.source || !ev.pointer || !ev.sourceSha256) {
                throw new Error(`Incomplete evidence reference in case ${item.id}`);
              }
            }
          }

          const explanatory = brain.grounding?.sources?.explanatory;
          if (!explanatory || explanatory.file !== 'intelligence/explanatory/explanatory-context.json') {
            throw new Error('Explanatory Context grounding source missing');
          }
          if (explanatory.freshness !== 'fresh' || !explanatory.sha256) {
            throw new Error('Explanatory Context grounding is not fresh/exact');
          }

          const protocol = brain.questions?.protocolAprContext;
          if (protocol?.status !== 'context-available-causal-attribution-unresolved') {
            throw new Error('Legacy Brain veFXN protocol APR context missing');
          }
          if (protocol?.causalAttribution !== 'unresolved' || protocol?.primaryDriver !== null) {
            throw new Error('Legacy Brain veFXN causal boundary weakened');
          }
          if (!Array.isArray(protocol?.evidence) || protocol.evidence.length !== 1) {
            throw new Error('Legacy Brain protocol context evidence missing');
          }
          const protocolEvidence = protocol.evidence[0];
          if (protocolEvidence.source !== 'intelligence/explanatory/explanatory-context.json' ||
              protocolEvidence.pointer !== '/explanations/protocolAprChangeContext' ||
              protocolEvidence.sourceSha256 !== explanatory.sha256) {
            throw new Error('Legacy Brain protocol context is not exact-bound to Explanatory Context');
          }

          const contexts = brain.questions?.protocolAprContexts;
          const fx = contexts?.['defitea-fxn-vefxn'];
          const curve = contexts?.['defitea-curve-vecrv'];
          if (!contexts || Object.keys(contexts).length !== 2 || !fx || !curve) {
            throw new Error('Canonical Brain protocolAprContexts must contain exactly two cohorts');
          }
          if (fx.causalAttribution !== 'unresolved' || fx.primaryDriver !== null) {
            throw new Error('Canonical veFXN causal boundary weakened');
          }
          if (curve.status !== 'mechanics-proven-upstream-cause-unresolved' ||
              curve.mechanics?.status !== 'proven-canonical-collector-identity' ||
              curve.mechanics?.mechanicalAttribution !== 'proven-within-apr-formula') {
            throw new Error('Canonical Curve mechanical context missing');
          }
          if (curve.causalAttribution !== 'unresolved-beyond-formula' || curve.primaryDriver !== null) {
            throw new Error('Curve upstream causal boundary weakened');
          }
          if (Number(brain.currentPosture?.protocolEconomics?.cohortCount) !== 2 ||
              brain.currentPosture?.protocolEconomics?.legacyAliasCohortId !== 'defitea-fxn-vefxn') {
            throw new Error('Brain currentPosture multi-cohort contract missing');
          }

          const flow = brain.questions?.protocolFlowContexts?.['defitea-convex-vlcvx-votium'];
          if (brain.extensions?.vlCvxVotiumCurve !== '0.1-vlcvx-votium-curve-shadow-context' || !flow) {
            throw new Error('Brain vlCVX/Votium shadow flow context missing');
          }
          if (Number(brain.currentPosture?.protocolFlows?.contextCount) !== 1 || Number(flow.coverage?.curveExecutedVotiumGaugeRows) !== 79 || Number(flow.coverage?.currentCurvePoolContextsComplete) !== 31) {
            throw new Error('Brain vlCVX/Votium flow coverage drift');
          }
          if (flow.measuredRelations?.voteToExecutedCurveGaugeBps?.class !== 'ATTRIBUTED' || flow.measuredRelations?.incentiveToVote?.class !== 'CORRELATED' || flow.measuredRelations?.historicalVoteToCurrentPoolState?.class !== 'CORRELATED') {
            throw new Error('Brain vlCVX/Votium relation semantics drift');
          }
          if (flow.downstreamCurrentContext?.exactFeeUsd !== 'UNKNOWN' || flow.causalBoundary?.primaryDriver !== null || flow.authority?.executionAuthority !== 'none' || flow.authority?.causalClaimAuthority !== 'none') {
            throw new Error('Brain vlCVX/Votium unknown/authority boundary drift');
          }

          const whatChangedPointers = new Set((brain.questions?.whatChanged?.evidence ?? [])
            .filter(ev => ev.source === 'intelligence/explanatory/explanatory-context.json' && ev.sourceSha256 === explanatory.sha256)
            .map(ev => ev.pointer));
          for (const pointer of [
            '/explanations/protocolAprChangeContext',
            '/explanations/protocolAprChangeContexts/defitea-fxn-vefxn',
            '/explanations/protocolAprChangeContexts/defitea-curve-vecrv',
            '/explanations/protocolFlowContexts/defitea-convex-vlcvx-votium'
          ]) {
            if (!whatChangedPointers.has(pointer)) throw new Error(`Brain whatChanged missing Explanatory evidence ${pointer}`);
          }

          if (history.version !== '0.1-brain-history') {
            throw new Error(`Unexpected history version: ${history.version}`);
          }
          if (!Array.isArray(history.observations)) {
            throw new Error('Brain history observations missing');
          }
          if (!brain.bridge?.inputCompositeHash || !brain.bridge?.snapshotHash) {
            throw new Error('Brain bridge hashes missing');
          }
          console.log('Brain multi-cohort + vlCVX shadow contract PASS', {
            status: brain.status,
            mode: brain.mode,
            reasoningCases: brain.reasoningCases.length,
            evidence: brain.evidenceLedger.length,
            protocolCohorts: Object.keys(contexts).length,
            shadowFlowContexts: brain.currentPosture.protocolFlows.contextCount,
            curveContext: curve.status,
            vlcvxCurveExecutedGaugeRows: flow.coverage.curveExecutedVotiumGaugeRows,
            vlcvxCurrentPoolContexts: flow.coverage.currentCurvePoolContextsComplete,
            exactFeeUsd: flow.downstreamCurrentContext.exactFeeUsd,
            explanatoryFreshness: explanatory.freshness,
            historyObservations: history.observationCount,
          });
          NODE

          git diff --check

      - name: Publish Brain memory safely
        shell: bash
        run: |
          set -euo pipefail
          GENERATED=(
            "intelligence/brain-intelligence.json"
            "intelligence/brain-history.json"
            "intelligence/brain-brief.md"
          )

          for f in "${GENERATED[@]}"; do
            test -s "$f"
          done

          git config user.name "The Holding Brain"
          git config user.email "brain@theholding.ai"

          git add "${GENERATED[@]}"
          staged_bad="$(git diff --cached --name-only | grep -Ev '^intelligence/(brain-intelligence\.json|brain-history\.json|brain-brief\.md)$' || true)"
          if [ -n "$staged_bad" ]; then
            echo "ERROR: Brain staged a file outside its generated-output boundary:"
            echo "$staged_bad"
            exit 1
          fi

          if git diff --cached --quiet; then
            echo "No Brain output changes to publish."
            exit 0
          fi
          git commit -m "intelligence: extend grounded Brain reasoning"

          verify_grounding_inputs() {
            node - <<'NODE'
          const fs = require('fs');
          const crypto = require('crypto');

          const brain = JSON.parse(fs.readFileSync('intelligence/brain-intelligence.json', 'utf8'));
          const sources = {
            change: 'intelligence/change-intelligence.json',
            systemMemory: 'intelligence/system-memory.json',
            security: 'security/security-intelligence.json',
            securityMemory: 'security/security-memory.json',
            explanatory: 'intelligence/explanatory/explanatory-context.json',
          };

          const sha256 = (text) =>
            crypto.createHash('sha256').update(text).digest('hex');
          for (const [key, file] of Object.entries(sources)) {
            const expected = brain?.grounding?.sources?.[key]?.sha256;
            if (!expected) {
              throw new Error(`Missing Brain grounding hash for ${key}`);
            }

            const actual = sha256(fs.readFileSync(file, 'utf8'));
            if (actual !== expected) {
              throw new Error(
                `Canonical grounding input changed after Brain build: ${file}. ` +
                `Refusing to publish stale reasoning; rerun the workflow.`
              );
            }
          }

          const expectedPolicy = brain?.grounding?.policy?.sha256;
          if (!expectedPolicy) {
            throw new Error('Missing Brain policy grounding hash');
          }
          const actualPolicy = sha256(
            fs.readFileSync('intelligence/brain-policy.json', 'utf8')
          );

          if (actualPolicy !== expectedPolicy) {
            throw new Error(
              'Brain policy changed after Brain build. Refusing to publish stale reasoning.'
            );
          }

          if (brain.constraints?.actionMode !== 'proposal-only') {
            throw new Error('Brain proposal-only invariant failed');
          }
          if (brain.questions?.protocolAprContext?.causalAttribution !== 'unresolved' ||
              brain.questions?.protocolAprContext?.primaryDriver !== null) {
            throw new Error('Legacy protocol context causal boundary changed after Brain build');
          }
          const contexts = brain.questions?.protocolAprContexts;
          const curve = contexts?.['defitea-curve-vecrv'];
          if (!contexts || Object.keys(contexts).length !== 2 ||
              contexts?.['defitea-fxn-vefxn']?.causalAttribution !== 'unresolved' ||
              curve?.causalAttribution !== 'unresolved-beyond-formula' ||
              curve?.primaryDriver !== null) {
            throw new Error('Canonical multi-cohort causal boundary changed after Brain build');
          }
          const flow = brain.questions?.protocolFlowContexts?.['defitea-convex-vlcvx-votium'];
          if (!flow || flow?.authority?.executionAuthority !== 'none' || flow?.authority?.causalClaimAuthority !== 'none' || flow?.downstreamCurrentContext?.exactFeeUsd !== 'UNKNOWN') {
            throw new Error('vlCVX/Votium shadow context changed after Brain build');
          }
          for (const item of brain.reasoningCases ?? []) {
            if (!item.evidence?.length) {
              throw new Error(`Reasoning case ${item.id} lost evidence`);
            }
          }

          console.log('Post-rebase multi-cohort + vlCVX shadow grounding integrity PASS.');
          NODE
          }

          for attempt in 1 2 3; do
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "Brain publish conflict; refusing to guess."
              exit 1
            fi

            # Evidence packet must remain tied to exactly the canonical bytes
            # it cites. If a source changed, a new Brain run is required.
            verify_grounding_inputs

            if git push origin HEAD:main; then
              git fetch origin main
              if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
                echo "ERROR: pushed Brain commit is not current remote main."
                exit 1
              fi

              echo "Verified grounded Brain output on remote main."
              exit 0
            fi

            echo "Main moved during push; retrying ($attempt/3)..."
            sleep $((attempt * 2))
          done
          echo "ERROR: unable to publish Brain output after 3 attempts."
          exit 1
