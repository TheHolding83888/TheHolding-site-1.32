name: Verify f(x) Locker APR Guard

on:
  pull_request:
    paths:
      - 'productivity/fxn-locker-apr-guard.mjs'
      - 'productivity/fxn-locker-apr-guard-validation.mjs'
      - 'productivity/yieldring-productivity-overlay.mjs'
      - 'intelligence/economic-graph/economic-graph-canonical-runner.mjs'
      - '.github/workflows/update-economic-graph.yml'
      - '.github/workflows/validate-yieldring-capital-state.yml'
      - '.github/workflows/validate-productivity-overlay-order.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Validate parser and current-snapshot authority correction
        run: |
          set -euo pipefail
          node --check productivity/fxn-locker-apr-guard.mjs
          node --check productivity/yieldring-productivity-overlay.mjs
          node --check intelligence/economic-graph/economic-graph-canonical-runner.mjs
          node productivity/fxn-locker-apr-guard-validation.mjs

      - name: Verify production writer enforcement and bounded validation bypass
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs');
          const marker='FXN_LOCKER_APR_GUARD_MODE';
          const expected=`${marker}: deterministic-validation`;
          const overlay=fs.readFileSync('productivity/yieldring-productivity-overlay.mjs','utf8');
          const recovery=fs.readFileSync('.github/workflows/update-productivity.yml','utf8');
          const unified=fs.readFileSync('intelligence/capital-state/unified-capital-refresh.mjs','utf8');
          const graphWorkflow=fs.readFileSync('.github/workflows/update-economic-graph.yml','utf8');
          const graphRunner=fs.readFileSync('intelligence/economic-graph/economic-graph-canonical-runner.mjs','utf8');
          const yieldringValidation=fs.readFileSync('.github/workflows/validate-yieldring-capital-state.yml','utf8');
          const overlayValidation=fs.readFileSync('.github/workflows/validate-productivity-overlay-order.yml','utf8');

          // Production invariant: one exact Locker-block observation must both
          // authorize APR and materialize the protocol-economic evidence packet.
          for(const needle of [
            'collectFxnLockerEconomicSnapshot',
            'applyExactFxnLockerApr',
            'verifyFxnLockerApr',
            'economicSnapshot',
            'sameBlockEconomicSnapshotMaterialized:true',
            'downstreamMustUseCanonicalEconomicSnapshot:true',
            'liveReprobeIsDiagnosticOnly:true',
            "canonicalization:'same-exact-locker-block-as-apr-authority'"
          ]){
            if(!overlay.includes(needle))throw new Error('YieldRing same-snapshot f(x) authority invariant missing '+needle);
          }
          if(!overlay.includes('Math.abs(canonicalApr-snapshotApr)>0.01'))throw new Error('0.01 pp same-snapshot APR parity guard missing');
          if(!overlay.includes("economicSnapshot.sourceType!=='official-frontend-exact-locker-block'"))throw new Error('exact Locker-block source authority guard missing');
          if(!overlay.includes("economicSnapshot.executionAuthority!=='none'"))throw new Error('f(x) evidence authority guard missing');

          // Canonical downstream consumer invariant: production Graph consumes
          // materialized Productivity evidence and refuses identity/source/parity drift.
          for(const needle of [
            'canonicalFxnSnapshotFromProductivity',
            'details?.economicSnapshot',
            'snapshot.snapshotKey!==productivity.snapshotKey',
            'snapshot.productivityGeneratedAt!==productivity.generatedAt',
            "snapshot.sourceType!=='official-frontend-exact-locker-block'",
            "snapshot.executionAuthority!=='none'",
            'parity>APR_PARITY_TOLERANCE_PCT_POINTS'
          ]){
            if(!graphRunner.includes(needle))throw new Error('Canonical Economic Graph f(x) invariant missing '+needle);
          }
          if(!graphWorkflow.includes('node intelligence/economic-graph/economic-graph-canonical-runner.mjs'))throw new Error('Economic Graph production path bypasses canonical same-snapshot runner');
          const productionBuildBlock=graphWorkflow.match(/- name: Build canonical same-snapshot Economic Graph[\s\S]*?- name: Validate canonical observation boundary/)?.[0]||'';
          if(!productionBuildBlock.includes('economic-graph-canonical-runner.mjs'))throw new Error('canonical Graph production build step missing');
          if(productionBuildBlock.includes('node intelligence/economic-graph/economic-graph.mjs'))throw new Error('production Graph still performs direct live-probe build');

          // All actual Productivity writers must still execute the guarded overlay.
          if(!recovery.includes('node productivity/yieldring-productivity-overlay.mjs'))throw new Error('manual/recovery Productivity path bypasses guarded post-collection stage');
          if(!unified.includes("'productivity/yieldring-productivity-overlay.mjs'"))throw new Error('Unified Capital path bypasses guarded post-collection stage');

          // Deterministic bypass stays validator-only and cannot leak into writers.
          if(recovery.includes(marker)||unified.includes(marker))throw new Error('deterministic f(x) authority bypass leaked into a production writer');
          if(!yieldringValidation.includes(expected)||!overlayValidation.includes(expected))throw new Error('deterministic bypass is not explicitly bounded to known validators');

          console.log('f(x) same-snapshot authority production enforcement PASS',{
            exactLockerBlock:true,
            sameSnapshotMaterialization:true,
            aprParityTolerancePctPoints:0.01,
            graphUsesCanonicalMaterializedEvidence:true,
            liveReprobeDiagnosticOnly:true,
            executionAuthority:'none'
          });
          NODE
