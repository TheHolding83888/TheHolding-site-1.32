name: Verify f(x) Locker APR Guard

on:
  pull_request:
    paths:
      - 'productivity/fxn-locker-apr-guard.mjs'
      - 'productivity/fxn-locker-apr-guard-validation.mjs'
      - 'productivity/yieldring-productivity-overlay.mjs'
      - '.github/workflows/validate-yieldring-capital-state.yml'
      - '.github/workflows/verify-fxn-locker-apr-guard.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Validate syntax and exact-source parser
        run: |
          set -euo pipefail
          node --check productivity/fxn-locker-apr-guard.mjs
          node --check productivity/yieldring-productivity-overlay.mjs
          node productivity/fxn-locker-apr-guard-validation.mjs

      - name: Verify production writer enforcement and bounded validation bypass
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs');
          const marker='FXN_LOCKER_APR_GUARD_MODE';
          const overlay=fs.readFileSync('productivity/yieldring-productivity-overlay.mjs','utf8');
          const recovery=fs.readFileSync('.github/workflows/update-productivity.yml','utf8');
          const unified=fs.readFileSync('intelligence/capital-state/unified-capital-refresh.mjs','utf8');
          const yieldringValidation=fs.readFileSync('.github/workflows/validate-yieldring-capital-state.yml','utf8');
          if(!overlay.includes("from './fxn-locker-apr-guard.mjs'")||!overlay.includes('if(!deterministicValidation) await verifyFxnLockerApr()'))throw new Error('YieldRing post-collection stage does not enforce f(x) guard by default');
          if(!recovery.includes('node productivity/yieldring-productivity-overlay.mjs'))throw new Error('manual/recovery Productivity path bypasses guarded post-collection stage');
          if(!unified.includes("'productivity/yieldring-productivity-overlay.mjs'"))throw new Error('Unified Capital path bypasses guarded post-collection stage');
          if(recovery.includes(marker)||unified.includes(marker))throw new Error('deterministic f(x) guard bypass leaked into a production writer');
          if(!yieldringValidation.includes(`${marker}: deterministic-validation`))throw new Error('deterministic bypass is not explicitly bounded to YieldRing validation');
          console.log('f(x) guard production enforcement PASS');
          NODE
