# holding-workflow-definition-proof: intelligence/reliability/decision-ledger-writer-ownership-proof.mjs
name: "The Holding Brain · Record Decision"

on:
  workflow_dispatch:
    inputs:
      case_id:
        description: "Exact current Grounded Brain caseId"
        required: true
        type: string
      disposition:
        description: "Owner decision"
        required: true
        default: "defer"
        type: choice
        options:
          - accept
          - defer
          - reject
          - modify
      rationale:
        description: "Why this decision was made (public decision memory)"
        required: true
        type: string
      expected_outcome:
        description: "Optional plain-language expectation"
        required: false
        default: ""
        type: string
      modified_action:
        description: "Required only when disposition=modify; inert text, never executed"
        required: false
        default: ""
        type: string
      prediction_event:
        description: "Optional calibratable prediction"
        required: true
        default: "none"
        type: choice
        options:
          - none
          - case-resolved-by-review
      probability_bps:
        description: "0-10000 probability bps if prediction is enabled"
        required: false
        default: "7000"
        type: string
      review_days:
        description: "1-365 days until outcome review if prediction is enabled"
        required: false
        default: "14"
        type: string
      supersedes_decision_id:
        description: "Optional earlier decisionId this new record supersedes"
        required: false
        default: ""
        type: string
  workflow_call:
    inputs:
      record_mode:
        description: "Canonical recorder mode"
        required: true
        type: string
      entity:
        required: false
        default: ""
        type: string
      category:
        required: false
        default: ""
        type: string
      disposition:
        required: false
        default: "defer"
        type: string
      rationale:
        required: false
        default: ""
        type: string
      expected_outcome:
        required: false
        default: ""
        type: string
      evaluation_criterion:
        required: false
        default: ""
        type: string
      review_on_or_after:
        required: false
        default: ""
        type: string
      counterevidence:
        required: false
        default: ""
        type: string
      invalidation_condition:
        required: false
        default: ""
        type: string
      deferred_alternative:
        required: false
        default: ""
        type: string
      intended_use:
        required: false
        default: ""
        type: string
      confidence:
        required: false
        default: ""
        type: string
      evidence_note:
        required: false
        default: ""
        type: string
      supersedes_decision_id:
        required: false
        default: ""
        type: string

permissions:
  contents: write

concurrency:
  group: decision-recorder-main
  cancel-in-progress: false

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout canonical repository state
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Validate canonical recorder mode
        shell: bash
        env:
          DECISION_RECORD_MODE: ${{ inputs.record_mode || 'brain-case' }}
        run: |
          set -euo pipefail
          case "$DECISION_RECORD_MODE" in
            brain-case|owner-economic) ;;
            *) echo "Unsupported Decision Memory recorder mode: $DECISION_RECORD_MODE"; exit 1 ;;
          esac

      - name: Preflight release coherence
        shell: bash
        run: |
          set -euo pipefail
          node intelligence/cognitive-release-guard.mjs
          node intelligence/learning/learning-release-guard.mjs

      - name: Preflight Brain case recorder
        if: ${{ inputs.record_mode != 'owner-economic' }}
        shell: bash
        run: |
          set -euo pipefail
          node --check intelligence/learning/decision-recorder.mjs
          node intelligence/learning/decision-recorder.mjs --self-test
          node -e "JSON.parse(require('fs').readFileSync('intelligence/learning/decision-policy.json','utf8')); JSON.parse(require('fs').readFileSync('intelligence/learning/decision-ledger.json','utf8'));"

      - name: Preflight owner economic recorder
        if: ${{ inputs.record_mode == 'owner-economic' }}
        shell: bash
        run: |
          set -euo pipefail
          node --check intelligence/learning/owner-initiated-decision-recorder.mjs
          node intelligence/learning/owner-initiated-decision-recorder.mjs --self-test
          node -e "JSON.parse(require('fs').readFileSync('intelligence/learning/decision-ledger.json','utf8'));"

      - name: Append Brain case decision to immutable ledger
        if: ${{ inputs.record_mode != 'owner-economic' }}
        id: record_brain
        env:
          DECISION_CASE_ID: ${{ inputs.case_id }}
          DECISION_DISPOSITION: ${{ inputs.disposition }}
          DECISION_RATIONALE: ${{ inputs.rationale }}
          DECISION_EXPECTED_OUTCOME: ${{ inputs.expected_outcome }}
          DECISION_MODIFIED_ACTION: ${{ inputs.modified_action }}
          DECISION_PREDICTION_EVENT: ${{ inputs.prediction_event }}
          DECISION_PROBABILITY_BPS: ${{ inputs.probability_bps }}
          DECISION_REVIEW_DAYS: ${{ inputs.review_days }}
          DECISION_SUPERSEDES_ID: ${{ inputs.supersedes_decision_id }}
        run: node intelligence/learning/decision-recorder.mjs

      - name: Append owner economic decision to immutable ledger
        if: ${{ inputs.record_mode == 'owner-economic' }}
        id: record_owner
        env:
          DECISION_DOMAIN: economic
          DECISION_RECOMMENDATION_CLASS: owner-capital-allocation
          DECISION_ENTITY: ${{ inputs.entity }}
          DECISION_CATEGORY: ${{ inputs.category }}
          DECISION_DISPOSITION: ${{ inputs.disposition }}
          DECISION_RATIONALE: ${{ inputs.rationale }}
          DECISION_EXPECTED_OUTCOME: ${{ inputs.expected_outcome }}
          DECISION_EVALUATION_CRITERION: ${{ inputs.evaluation_criterion }}
          DECISION_REVIEW_ON_OR_AFTER: ${{ inputs.review_on_or_after }}
          DECISION_COUNTEREVIDENCE: ${{ inputs.counterevidence }}
          DECISION_INVALIDATION_CONDITION: ${{ inputs.invalidation_condition }}
          DECISION_DEFERRED_ALTERNATIVE: ${{ inputs.deferred_alternative }}
          DECISION_INTENDED_USE: ${{ inputs.intended_use }}
          DECISION_CONFIDENCE: ${{ inputs.confidence }}
          DECISION_EVIDENCE_NOTE: ${{ inputs.evidence_note }}
          DECISION_SUPERSEDES_ID: ${{ inputs.supersedes_decision_id }}
        run: node intelligence/learning/owner-initiated-decision-recorder.mjs

      - name: Validate Brain case decision boundary
        if: ${{ inputs.record_mode != 'owner-economic' }}
        shell: bash
        env:
          DECISION_VERIFY_ID: ${{ steps.record_brain.outputs.decision_id }}
        run: |
          set -euo pipefail
          node intelligence/learning/decision-recorder.mjs --verify-bound-decision
          node - <<'NODE'
          const fs = require('fs');
          const ledger = JSON.parse(fs.readFileSync('intelligence/learning/decision-ledger.json','utf8'));
          const d = ledger.decisions.at(-1);
          if (!d) throw new Error('decision missing after recorder');
          if (d.authority?.executable !== false || d.authority?.executionAuthority !== 'none') throw new Error('decision escaped inert memory boundary');
          if (ledger.policy?.executionAuthority !== 'none') throw new Error('ledger execution authority changed');
          console.log('Decision boundary PASS', { decisionId: d.decisionId, disposition: d.disposition, executionAuthority: d.authority.executionAuthority });
          NODE
          git diff --check

      - name: Validate owner economic decision boundary
        if: ${{ inputs.record_mode == 'owner-economic' }}
        shell: bash
        env:
          DECISION_VERIFY_ID: ${{ steps.record_owner.outputs.decision_id }}
        run: |
          set -euo pipefail
          node intelligence/learning/owner-initiated-decision-recorder.mjs --verify-bound-decision
          node - <<'NODE'
          const fs = require('fs');
          const ledger = JSON.parse(fs.readFileSync('intelligence/learning/decision-ledger.json','utf8'));
          const d = ledger.decisions.at(-1);
          if (!d) throw new Error('owner decision missing');
          if (d.experience?.status !== 'open' || d.experience?.preOutcomeCaptured !== true) throw new Error('owner decision did not enter as open pre-outcome experience');
          if (d.authority?.executable !== false || d.authority?.executionAuthority !== 'none') throw new Error('owner decision escaped inert authority');
          if (d.source?.provenance?.peerOwnerStatement !== false) throw new Error('owner decision provenance drift');
          console.log('Owner Decision boundary PASS', { decisionId: d.decisionId, status: d.experience.status, executionAuthority: d.authority.executionAuthority });
          NODE
          git diff --check

      - name: Publish Decision Memory safely
        shell: bash
        env:
          DECISION_RECORD_MODE: ${{ inputs.record_mode || 'brain-case' }}
          DECISION_VERIFY_ID: ${{ steps.record_brain.outputs.decision_id || steps.record_owner.outputs.decision_id }}
        run: |
          set -euo pipefail
          test -n "$DECISION_VERIFY_ID"
          git config user.name "The Holding Decision Memory"
          git config user.email "decision-memory@theholding.ai"
          git add intelligence/learning/decision-ledger.json
          if git diff --cached --quiet; then
            echo "No decision-memory change to publish."
            exit 0
          fi
          mapfile -t staged < <(git diff --cached --name-only)
          if [ "${#staged[@]}" -ne 1 ] || [ "${staged[0]}" != "intelligence/learning/decision-ledger.json" ]; then
            echo "Unexpected staged decision-memory files: ${staged[*]}"
            exit 1
          fi
          git commit -m "intelligence: record owner decision $DECISION_VERIFY_ID"

          for attempt in 1 2 3; do
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "Decision publish conflict; fail closed."
              exit 1
            fi

            node intelligence/cognitive-release-guard.mjs
            node intelligence/learning/learning-release-guard.mjs
            if [ "$DECISION_RECORD_MODE" = "owner-economic" ]; then
              DECISION_VERIFY_ID="$DECISION_VERIFY_ID" node intelligence/learning/owner-initiated-decision-recorder.mjs --verify-bound-decision
            else
              DECISION_VERIFY_ID="$DECISION_VERIFY_ID" node intelligence/learning/decision-recorder.mjs --verify-bound-decision
            fi

            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push attempt ${attempt} failed; retrying after fetch/rebase."
            sleep $((attempt * 2))
          done
          echo "Decision Memory could not publish after 3 attempts."
          exit 1

      - name: Decision summary
        if: always()
        shell: bash
        env:
          DECISION_RECORD_MODE: ${{ inputs.record_mode || 'brain-case' }}
          DECISION_ID: ${{ steps.record_brain.outputs.decision_id || steps.record_owner.outputs.decision_id }}
        run: |
          {
            echo "# The Holding Brain · Decision Memory"
            echo
            echo "Decision ID: \`$DECISION_ID\`"
            echo "Recorder mode: \`$DECISION_RECORD_MODE\`"
            echo "Disposition: \`${{ inputs.disposition }}\`"
            if [ "$DECISION_RECORD_MODE" = "owner-economic" ]; then
              echo "Entity: \`${{ inputs.entity }}\`"
              echo "Category: \`${{ inputs.category }}\`"
              echo "Review on/after: \`${{ inputs.review_on_or_after }}\`"
              echo "Experience status: \`open\`"
            else
              echo "Prediction: \`${{ inputs.prediction_event }}\`"
            fi
            echo "Execution authority: \`none\`"
            echo
            echo "The record is append-only Decision Memory. The Learning Loop will wake automatically from the ledger push."
          } >> "$GITHUB_STEP_SUMMARY"
