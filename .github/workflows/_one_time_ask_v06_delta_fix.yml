name: One-time Ask v0.6 Run 002 Delta Fix

on:
  push:
    branches:
      - agents/ask-trust-intent-v0.6-20260814
    paths:
      - .github/workflows/_one_time_ask_v06_delta_fix.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  delta-fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: agents/ask-trust-intent-v0.6-20260814
          fetch-depth: 0

      - name: Bind delta patcher to actual registry route
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('verification/_one_time_ask_v06_delta.py')
          s=p.read_text(encoding='utf-8')
          old="one(\"    if (includesAny(q, ['сколько компаний', 'какие компании', 'список компаний', 'how many companies', 'which companies', 'company list']) && !protocolGroup(raw)) return registryAnswer(lang);\", \"    if (protocolGroup(raw) && includesAny(q,['which companies','какие компании','кто использует','companies use','компании используют'])) return protocolCompaniesAnswer(protocolGroup(raw),lang);\\n    if (includesAny(q, ['сколько компаний', 'какие компании', 'список компаний', 'how many companies', 'which companies', 'company list']) && !protocolGroup(raw)) return registryAnswer(lang);\", 'protocol company route')"
          new="one(\"    if (includesAny(q, ['сколько компаний', 'какие компании', 'список компаний', 'how many companies', 'which companies', 'company list'])) return registryAnswer(lang);\", \"    if (protocolGroup(raw) && includesAny(q,['which companies','какие компании','кто использует','companies use','компании используют'])) return protocolCompaniesAnswer(protocolGroup(raw),lang);\\n    if (includesAny(q, ['сколько компаний', 'какие компании', 'список компаний', 'how many companies', 'which companies', 'company list'])) return registryAnswer(lang);\", 'protocol company route')"
          if s.count(old)!=1:
              raise SystemExit(f'anchor patch expected 1, got {s.count(old)}')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          print('delta anchor rebound PASS')
          PY

      - name: Apply Run 002 learning delta
        run: python3 verification/_one_time_ask_v06_delta.py

      - name: Validate delta
        shell: bash
        run: |
          set -euo pipefail
          node --check agents/console/app.js
          git diff --check
          node verification/production-boundary-guard-v1.mjs
          grep -q "sign a transaction" agents/console/app.js
          grep -q "function compareFollowupAnswer" agents/console/app.js
          grep -q "function protocolCompaniesAnswer" agents/console/app.js
          grep -q "чему os уже научилась" agents/console/app.js

      - name: Publish delta and self-remove
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'The Holding Experience Integrator'
          git config user.email 'experience-integrator@theholding.ai'
          git add agents/console/app.js agents/index.html
          git rm .github/workflows/_one_time_ask_v06_delta.yml .github/workflows/_one_time_ask_v06_delta_fix.yml verification/_one_time_ask_v06_delta.py .github/workflows/_ask_experience_run_002_candidate.yml
          git commit -m 'agents: absorb Ask Experience Run 002 delta'
          git push origin HEAD:agents/ask-trust-intent-v0.6-20260814
