name: Ask candidate · Integrate Intent Contract v1.2B

on:
  push:
    branches: ['agents/ask-intent-contract-v1.2b-20260815']
    paths:
      - verification/ask-experience/_integrate_intent_contract_v12b.mjs
      - .github/workflows/_ask_intent_contract_integrator.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: agents/ask-intent-contract-v1.2b-20260815
      - name: Integrate live intent contract
        run: node verification/ask-experience/_integrate_intent_contract_v12b.mjs
      - name: Remove transient integrator script
        run: rm -f verification/ask-experience/_integrate_intent_contract_v12b.mjs
      - name: Commit live integration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add agents/console/app.js agents/index.html verification/ask-experience/_integrate_intent_contract_v12b.mjs
          git commit -m 'Ask v1.2B: integrate intent contract into live console'
          git push origin HEAD:agents/ask-intent-contract-v1.2b-20260815
