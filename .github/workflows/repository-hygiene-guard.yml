name: "The Holding Reliability · Repository Hygiene Guard"

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: repository-hygiene-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact candidate with comparison history
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Static invariant preflight
        shell: bash
        run: |
          set -euo pipefail
          test -s intelligence/reliability/repository-hygiene-policy.json
          test -s intelligence/reliability/repository-hygiene-guard.mjs
          test -s intelligence/reliability/repository-hygiene-canary.mjs
          node --check intelligence/reliability/repository-hygiene-guard.mjs
          node --check intelligence/reliability/repository-hygiene-canary.mjs
          node intelligence/reliability/repository-hygiene-canary.mjs

      - name: Resolve comparison base
        id: base
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          base=""
          if [ "$EVENT_NAME" = "pull_request" ]; then
            base="$PR_BASE_SHA"
          elif [ "$EVENT_NAME" = "push" ] && [ -n "$PUSH_BEFORE_SHA" ] && ! printf '%s' "$PUSH_BEFORE_SHA" | grep -Eq '^0+$'; then
            base="$PUSH_BEFORE_SHA"
          else
            base="$(git rev-parse HEAD^)"
          fi
          git cat-file -e "${base}^{commit}"
          printf 'base=%s\n' "$base" >> "$GITHUB_OUTPUT"

      - name: Enforce repository hygiene boundary
        run: node intelligence/reliability/repository-hygiene-guard.mjs --base "${{ steps.base.outputs.base }}"

      - name: Verify authority boundary
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const policy = require('./intelligence/reliability/repository-hygiene-policy.json');
          if (policy.authority?.executionAuthority !== 'none') throw new Error('repository hygiene gained execution authority');
          if (policy.authority?.repositoryMutationAuthority !== false) throw new Error('repository hygiene gained mutation authority');
          if (policy.authority?.capitalExecution !== false) throw new Error('repository hygiene gained capital authority');
          console.log('Repository Hygiene authority boundary PASS');
          NODE
          git diff --check
