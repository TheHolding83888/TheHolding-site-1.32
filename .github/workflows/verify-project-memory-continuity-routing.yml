name: "Verify Project Memory · continuity routing"

on:
  pull_request:
    paths:
      - 'intelligence/project-memory/**'
      - '.github/workflows/update-project-memory-bootstrap.yml'
      - '.github/workflows/verify-project-memory-continuity-routing.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Verify memory architecture and deterministic CURRENT
        shell: bash
        run: |
          set -euo pipefail
          test -s intelligence/project-memory/CURRENT.md
          test -s intelligence/project-memory/README.md
          test -s intelligence/project-memory/THE_HOLDING_MEMORY_ROUTING_INDEX_2026-08-18.md
          test -s intelligence/project-memory/THE_HOLDING_MASTER_CONTINUITY_2026-08-18_1616_PROJECT_X_HYPERLEND_MEMORY_ROUTING_UPGRADE.md
          test -s intelligence/project-memory/THE_HOLDING_KNOWN_MECHANISM_REUSE_AND_PROMOTION_CANON_2026-08-18.md
          test -s intelligence/project-memory/THE_HOLDING_COMPANY_PASSPORT_INHERITANCE_CANON_2026-08-19.md
          test -s intelligence/project-memory/THE_HOLDING_OWNER_COLLABORATION_OPERATING_STYLE_2026-08-18.md
          test -s intelligence/project-memory/THE_HOLDING_BUILD_DISCIPLINE_CANON_2026-08-14.md
          node --check intelligence/project-memory/build-current-memory.mjs
          node --check intelligence/project-memory/verify-current-memory.mjs

          cp intelligence/project-memory/CURRENT.md /tmp/current.before.md
          node intelligence/project-memory/build-current-memory.mjs
          node intelligence/project-memory/verify-current-memory.mjs
          cmp -s /tmp/current.before.md intelligence/project-memory/CURRENT.md || {
            echo 'ERROR: committed CURRENT.md is not the deterministic output of build-current-memory.mjs'
            diff -u /tmp/current.before.md intelligence/project-memory/CURRENT.md || true
            exit 1
          }

      - name: Verify deep continuity coverage
        shell: bash
        run: |
          set -euo pipefail
          f='intelligence/project-memory/THE_HOLDING_MASTER_CONTINUITY_2026-08-18_1616_PROJECT_X_HYPERLEND_MEMORY_ROUTING_UPGRADE.md'
          for phrase in \
            'PR #142 — PROJECT X FULL MULTI-LEG PARITY' \
            'PROJECT X OBSERVED-FEE REFERENCE APR' \
            'PR #144 — HYPERLEND INCOME PARITY' \
            'enumerable NFT inventory is not the same as strategy economic inventory' \
            'HyperLend base lending interest = Compounded / Embedded' \
            'CURRENT PROJECT MEMORY ARCHITECTURE' \
            'NEXT-CHAT QUICK START — COMPANY #010' \
            'DO-NOT-DO LIST FOR FUTURE MODELS'; do
            grep -Fq "$phrase" "$f" || { echo "Missing continuity coverage: $phrase"; exit 1; }
          done

      - name: Verify routed mechanism canon coverage
        shell: bash
        run: |
          set -euo pipefail
          f='intelligence/project-memory/THE_HOLDING_KNOWN_MECHANISM_REUSE_AND_PROMOTION_CANON_2026-08-18.md'
          for phrase in \
            'multi-leg promotion gap' \
            'resolver completeness != promotion completeness' \
            'Economic inventory != enumerable inventory' \
            'Nonzero economic state with missing measurement must fail closed' \
            'HyperLend / Aave-like lending semantic lanes' \
            'controller existence alone does not establish an active reward'; do
            grep -Fqi "$phrase" "$f" || { echo "Missing reusable canon coverage: $phrase"; exit 1; }
          done

      - name: Verify Company Passport inheritance routing
        shell: bash
        run: |
          set -euo pipefail
          current='intelligence/project-memory/CURRENT.md'
          routing='intelligence/project-memory/THE_HOLDING_MEMORY_ROUTING_INDEX_2026-08-18.md'
          canon='intelligence/project-memory/THE_HOLDING_COMPANY_PASSPORT_INHERITANCE_CANON_2026-08-19.md'

          grep -Fq 'Memory Routing Index' "$current" || { echo 'CURRENT no longer routes through Memory Routing Index'; exit 1; }
          test "$(grep -Fc 'THE_HOLDING_COMPANY_PASSPORT_INHERITANCE_CANON_2026-08-19.md' "$routing")" -ge 3 || {
            echo 'Passport inheritance canon must be routed for onboarding + rewards + passport UI'; exit 1;
          }
          for phrase in \
            'COMPANY ONBOARDING / NEW COMPANY / NEW WALLET' \
            'REWARDS / ACCRUED REWARDS DRAWER / UNCLAIMED / COMPOUNDED' \
            'PASSPORT UI / MOBILE / DESKTOP'; do
            grep -Fq "$phrase" "$routing" || { echo "Routing section missing: $phrase"; exit 1; }
          done
          for phrase in \
            'new company must inherit the strongest current production presentation contract' \
            'Protocol · productive asset / strategy' \
            'Frax · veFRAX' \
            'Venice · sVVV' \
            'Resupply · staked RSUP' \
            'solved mechanism = reusable economic capability + reusable public presentation + verifier + memory'; do
            grep -Fqi "$phrase" "$canon" || { echo "Passport inheritance canon coverage missing: $phrase"; exit 1; }
          done
          echo 'CURRENT -> Routing Index -> Company Passport Inheritance Canon PASS'

      - name: Verify bounded merge flow without authority expansion
        shell: bash
        run: |
          set -euo pipefail
          current='intelligence/project-memory/CURRENT.md'
          collaboration='intelligence/project-memory/THE_HOLDING_OWNER_COLLABORATION_OPERATING_STYLE_2026-08-18.md'
          grep -Fq 'executionAuthority = none' intelligence/project-memory/THE_HOLDING_MASTER_CONTINUITY_2026-08-18_1616_PROJECT_X_HYPERLEND_MEMORY_ROUTING_UPGRADE.md
          grep -Fq 'Routine low-risk repository work may proceed through verified PR merge and production proof without a separate per-PR confirmation' "$current"
          grep -Fq 'Stop for explicit confirmation at material capital, authority, security, methodology, destructive/irreversible, or other high-consequence boundaries.' "$current"
          grep -Fqi 'this standing permission is **bounded**, not universal authority.' "$collaboration"
          grep -Fqi 'capital movement, wallet signing or transaction execution' "$collaboration"
          echo 'Project Memory continuity routing PASS — bounded routine merge flow; execution authority remains none.'
