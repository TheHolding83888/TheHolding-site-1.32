name: The Holding Security Sentinel
on:
  workflow_dispatch:
  schedule:
    # Daily after the 06:27 UTC Observer pass.
    - cron: '47 6 * * *'
  push:
    branches: [main]
    paths-ignore:
      # Generated Security data must not wake the Sentinel into a self-loop.
      # Static Security engines, policy and documentation remain normal push inputs.
      - 'security/security-memory.json'
      - 'security/security-history.json'
      - 'security/security-intelligence.json'
      - 'security/security-brief.md'
      - 'security/security-vault/**'
      # High-frequency Market Data snapshots are generated data-plane state.
      # Ignoring snapshot-only pushes prevents the 30-minute price heartbeat
      # from waking Security Sentinel up to 48 times/day. Market Data engines,
      # workflows, policies and registries are intentionally NOT ignored and
      # still receive normal push-triggered security review.
      - 'intelligence/market-data/market-data-coingecko.json'
      - 'intelligence/market-data/market-data.json'
      - 'intelligence/market-data/onchain-price-shadow.json'
      - 'intelligence/market-data/public-capital-state.json'
      # Deterministic generated cognitive outputs are already validated by their
      # own fail-closed writers. Re-scanning these generated artifacts on push
      # would create a self-invalidating Sentinel -> Brain -> Sentinel loop.
      # Static engines, policies, schemas and workflows remain fully scanned.
      - 'intelligence/brain-intelligence.json'
      - 'intelligence/brain-history.json'
      - 'intelligence/brain-brief.md'
      - 'intelligence/brain-chatgpt-bridge.json'
      - 'intelligence/brain-chatgpt-bridge.md'
      - 'intelligence/brain-chatgpt-bridge-history.json'
      - 'intelligence/brain-chatgpt-bridge-eval.json'
      - 'intelligence/cognitive-stack-state.json'
      - 'intelligence/cognitive-stack-brief.md'
      - 'intelligence/cognitive-stack-eval.json'
      # Human decision memory is inert public JSON and the generated Learning
      # state is independently reviewed. Ignore only these data outputs so the
      # new downstream learning loop cannot invalidate its own Brain upstream.
      # Learning engines, policy, release guard and workflows remain scanned.
      - 'intelligence/learning/decision-ledger.json'
      - 'intelligence/learning-state/**'
permissions:
  contents: write

concurrency:
  group: security-sentinel-main
  cancel-in-progress: false

jobs:
  sentinel:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout reviewed repository state
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Preflight
        shell: bash
        run: |
          set -euo pipefail
          node --check security/security-sentinel.mjs
          test -s security/README.md
      - name: Observe security state
        env:
          SECURITY_SITE_BASE_URL: https://theholding.ai
        run: node security/security-sentinel.mjs
      - name: Validate Security Intelligence
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('fs');
          const crypto = require('crypto');
          const path = require('path');
          const latest = JSON.parse(fs.readFileSync('security/security-intelligence.json','utf8'));
          const memory = JSON.parse(fs.readFileSync('security/security-memory.json','utf8'));
          const history = JSON.parse(fs.readFileSync('security/security-history.json','utf8'));
          const manifest = JSON.parse(fs.readFileSync('security/security-vault/manifest.json','utf8'));
          function stableStringify(value){if(value===null||typeof value!=='object')return JSON.stringify(value);if(Array.isArray(value))return `[${value.map(stableStringify).join(',')}]`;return `{${Object.keys(value).sort().map(k=>`${JSON.stringify(k)}:${stableStringify(value[k])}`).join(',')}}`;}
          function hash(v){return crypto.createHash('sha256').update(stableStringify(v)).digest('hex');}
          if (latest.version !== '0.1-autonomous-security-intelligence') throw new Error('unexpected security intelligence version');
          if (memory.version !== '0.1-security-memory') throw new Error('unexpected security memory version');
          if (history.version !== '0.1-security-history') throw new Error('unexpected security history version');
          if (manifest.version !== '0.1-security-vault-manifest') throw new Error('unexpected Security Vault version');
          if (latest.bridge?.snapshotHash !== memory.snapshotHash) throw new Error('security snapshot bridge mismatch');
          if (!Array.isArray(manifest.runs) || manifest.runCount !== manifest.runs.length || manifest.runCount < 1) throw new Error('security vault run count invalid');
          const rel=latest.bridge?.securityVault?.latestRecordPath;
          if (!rel || !path.posix.normalize(rel).startsWith('security/security-vault/') || rel.includes('../')) throw new Error('unsafe security vault path');
          if (!fs.existsSync(rel)) throw new Error('security vault record missing');
          const record=JSON.parse(fs.readFileSync(rel,'utf8'));
          const core={...record}; delete core.integrity;
          if(hash(core)!==record.integrity?.recordHash) throw new Error('security vault record integrity mismatch');
          if(record.integrity.recordHash!==manifest.latestRecord?.recordHash) throw new Error('security vault manifest mismatch');
          for(let i=0;i<manifest.runs.length;i++){const expected=i===0?null:manifest.runs[i-1].recordHash;if((manifest.runs[i].previousRecordHash??null)!==expected)throw new Error(`security vault chain broken at ${i}`);}
          console.log('Security Sentinel validation OK.');
          console.log('Status:', latest.status);
          console.log('Critical:', latest.severityCounts.critical);
          console.log('High:', latest.severityCounts.high);
          console.log('Vault runs:', manifest.runCount);
          NODE
      - name: Publish security memory
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "The Holding Security Sentinel"
          git config user.email "security-sentinel@theholding.ai"
          git add security/security-memory.json security/security-history.json security/security-intelligence.json security/security-brief.md security/security-vault
          if git diff --cached --quiet; then
            echo "No security-memory changes to publish."
            exit 0
          fi
          git commit -m "security: extend autonomous security memory"
          for attempt in 1 2 3; do
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "Security publish conflict; fail closed."
              exit 1
            fi
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push attempt ${attempt} failed; retrying after fetch/rebase."
            sleep $((attempt * 2))
          done
          echo "Security Sentinel could not publish after 3 attempts."
          exit 1
      - name: Enforce critical security gate
        shell: bash
        run: |
          set -euo pipefail
          CRITICAL="$(node -e "const x=require('./security/security-intelligence.json');process.stdout.write(String(x.severityCounts?.critical||0))")"
          if [ "$CRITICAL" -gt 0 ]; then
            echo "Critical security finding(s) detected: $CRITICAL"
            exit 1
          fi
          echo "No critical security findings."
