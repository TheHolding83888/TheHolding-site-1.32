name: Realty footer SVG integrity fix

on:
  push:
    branches:
      - fix/realty-mobile-footer-icons-20260831

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout task branch without external actions
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: fix/realty-mobile-footer-icons-20260831
        run: |
          set -euo pipefail
          git clone --no-tags --depth 1 --branch "$BRANCH" "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" repo

      - name: Replace footer with exact verified SVG payload
        working-directory: repo
        env:
          FOOTER_B64: 
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, os
          from pathlib import Path
          p = Path('realty/index.html')
          workflow = Path('.github/workflows/realty-footer-integrity-fix.yml')
          html = p.read_text()
          start = html.find('<footer class="footer"')
          end = html.find('</footer>', start)
          if start < 0 or end < 0:
              raise SystemExit('footer not found')
          end += len('</footer>')
          footer = base64.b64decode(os.environ['FOOTER_B64']).decode()
          html = html[:start] + footer + html[end:]
          exact = [
              'M18.244 2H21l-6.56 7.497L22 22h-5.828l-4.565-5.969L6.38 22H3.622l6.689-7.645L3 2h5.976l4.126 5.455L18.244 2Zm-.968 17.8h1.527L8.147 4.085H6.509L17.276 19.8Z',
              'M125 258L125 285L132 290L284 297L393 296L498 291L508 288L511 280L510 258L505 254L412 243L332 240L233 242L134 253Z',
              'M3.5 6.5h17v11h-17z',
              'Discovery only · external marketplaces · no custody · no fabricated listings',
          ]
          for token in exact:
              if token not in html:
                  raise SystemExit('integrity token missing: ' + token[:48])
          if 'µ' in html or 'q498' in html or 'P510' in html:
              raise SystemExit('corrupted payload residue detected')
          p.write_text(html)
          workflow.unlink()
          PY
          git diff --check
          git add -A
          mapfile -t files < <(git diff --cached --name-only | sort)
          printf 'Final staged files:\n%s\n' "${files[*]}"
          test "${#files[@]}" -eq 2
          test "${files[0]}" = ".github/workflows/realty-footer-integrity-fix.yml"
          test "${files[1]}" = "realty/index.html"

      - name: Commit exact footer payload and self-remove workflow
        working-directory: repo
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: fix/realty-mobile-footer-icons-20260831
        run: |
          set -euo pipefail
          git config user.name "The Holding Realty Materializer"
          git config user.email "realty-materializer@theholding.ai"
          git commit -m "Realty: verify footer SVG integrity"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:"$BRANCH"
