name: "TEMP · Company #010 Blockscout fallback"

on:
  push:
    branches: ['agent/company-010-productivity-closure']
    paths:
      - 'scripts/tmp-company-010-blockscout-fallback.mjs'
      - '.github/workflows/tmp-company-010-blockscout-fallback.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: agent/company-010-productivity-closure
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: node scripts/tmp-company-010-blockscout-fallback.mjs
      - run: |
          node --check onboarding/company-010-resolve.mjs
          grep -F "https://eth.blockscout.com/api/eth-rpc" onboarding/company-010-resolve.mjs
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add onboarding/company-010-resolve.mjs
          git commit -m "fix: add archive-capable Concentrator fallback"
          git push origin HEAD:agent/company-010-productivity-closure
