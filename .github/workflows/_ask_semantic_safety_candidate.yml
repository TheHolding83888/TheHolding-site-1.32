# fresh-proof-trigger: 2026-08-15T12:17Z
name: Ask candidate · Semantic Safety v1.2A

on:
  push:
    branches: ['agents/ask-semantic-safety-boundary-v1.2a-20260815']
    paths:
      - agents/console/app.js
      - verification/ask-experience/corpus-semantic-safety-v0.1.json
      - .github/workflows/_ask_semantic_safety_candidate.yml

permissions:
  contents: read

jobs:
  semantic-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Locate Chrome and install harness
        shell: bash
        run: |
          set -euo pipefail
          CHROME_BIN="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || true)"
          test -n "$CHROME_BIN"
          echo "CHROME_BIN=$CHROME_BIN" >> "$GITHUB_ENV"
          npm install --no-save --no-package-lock puppeteer-core@24.16.0
      - name: Serve exact candidate
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8080 --bind 127.0.0.1 >/tmp/ask-semantic-http.log 2>&1 &
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:8080/agents/ >/dev/null && exit 0; sleep 1; done
          cat /tmp/ask-semantic-http.log; exit 1
      - name: Frozen semantic substitution boundary
        env:
          ASK_BASE_URL: http://127.0.0.1:8080/agents/
          ASK_EXPERIENCE_RUN_ID: ${{ github.run_id }}-semantic-safety
          ASK_EXPERIENCE_ORIGIN: synthetic-semantic-safety
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          node verification/ask-experience/runner-v0.1.mjs verification/ask-experience/corpus-semantic-safety-v0.1.json artifacts/semantic-safety-run.json
          set +e
          node verification/ask-experience/evaluator-v0.1.mjs verification/ask-experience/corpus-semantic-safety-v0.1.json artifacts/semantic-safety-run.json > artifacts/semantic-safety-evaluation.json
          rc=$?
          set -e
          node -e "const x=require('./artifacts/semantic-safety-evaluation.json'); console.log(JSON.stringify(x.summary,null,2))"
          exit "$rc"
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semantic-safety-${{ github.run_id }}
          path: artifacts/*.json
          retention-days: 30
