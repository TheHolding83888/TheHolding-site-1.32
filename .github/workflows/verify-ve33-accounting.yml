name: Verify ve33 Factual Accounting

on:
  pull_request:
    paths:
      - 'reporting/ve33-accounting-evidence.mjs'
      - 'reporting/ve33-accounting-evidence-validation.mjs'
      - 'reporting/ve33-income-candidates.mjs'
      - 'reporting/ve33-income-candidates-validation.mjs'
      - 'reporting/ve33-ledger-admission.mjs'
      - 'reporting/ve33-ledger-admission-validation.mjs'
      - 'reporting/ve33-accounting-evidence.json'
      - 'reporting/income-ledger.mjs'
      - 'reporting/income-ledger-validation.mjs'
      - '.github/workflows/update-reporting.yml'
      - '.github/workflows/verify-ve33-accounting.yml'

permissions:
  contents: read

jobs:
  verify-ve33-accounting:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Install runtime dependency
        run: npm install --no-save --no-package-lock ethers@6
      - name: Syntax and deterministic accounting validation
        run: |
          set -euo pipefail
          node --check reporting/ve33-accounting-evidence.mjs
          node --check reporting/ve33-accounting-evidence-validation.mjs
          node --check reporting/ve33-income-candidates.mjs
          node --check reporting/ve33-income-candidates-validation.mjs
          node --check reporting/ve33-ledger-admission.mjs
          node --check reporting/ve33-ledger-admission-validation.mjs
          node reporting/ve33-accounting-evidence-validation.mjs
          node reporting/ve33-income-candidates-validation.mjs
          node reporting/ve33-ledger-admission-validation.mjs
          node - <<'NODE'
          const fs=require('fs');
          const e=JSON.parse(fs.readFileSync('reporting/ve33-accounting-evidence.json','utf8'));
          if(e.version!=='0.1-ve33-factual-accrual-evidence') throw new Error('ve33 evidence version drift');
          if(e.semantics?.openingBalanceCreatesIncome!==false) throw new Error('opening balance recognition drift');
          if(e.semantics?.claimIsSettlementNotSecondIncome!==true) throw new Error('claim settlement semantics drift');
          if(e.semantics?.rebaseDepositIntoVeNftIsSecondIncome!==false) throw new Error('rebase double-count guard missing');
          if(e.semantics?.referenceAprUsed!==false) throw new Error('Reference APR leaked into factual accounting');
          if(e.semantics?.laterPriceMovementRewritesClosedIncome!==false) throw new Error('closed income repricing guard missing');
          if(e.authority?.executionAuthority!=='none'||e.authority?.walletAuthority!=='none'||e.authority?.claimingAuthority!=='none'||e.authority?.capitalExecution!==false) throw new Error('ve33 authority expansion');
          console.log('ve33 evidence policy validation OK');
          NODE

      - name: Read-only live Base + Optimism accounting canary
        env:
          REWARDS_DATA_FILE: ./companies/rewards-data.json
          VE33_EVIDENCE_FILE: /tmp/ve33-accounting-evidence.json
          BASE_RPC_URL: ${{ secrets.BASE_RPC_URL }}
          OPTIMISM_RPC_URL: ${{ secrets.OPTIMISM_RPC_URL }}
        run: |
          set -euo pipefail
          node reporting/ve33-accounting-evidence.mjs
          node - <<'NODE'
          const fs=require('fs');
          const e=JSON.parse(fs.readFileSync('/tmp/ve33-accounting-evidence.json','utf8'));
          if(e.version!=='0.1-ve33-factual-accrual-evidence') throw new Error('live ve33 version drift');
          if(!(Number(e.diagnostics?.laneCount)>0)) throw new Error('live ve33 discovered no accounting lanes');
          const runtimeMs=Number(e.diagnostics?.runtimeMs);
          if(!Number.isFinite(runtimeMs)||runtimeMs<=0) throw new Error('live ve33 runtime diagnostic missing');
          if(runtimeMs>360000) throw new Error(`live ve33 runtime budget exceeded: ${runtimeMs}ms > 360000ms`);
          let totalCurrentCheckpoints=0;
          for(const p of ['aerodrome','velodrome']){
            const d=e.diagnostics?.protocols?.[p];
            if(!d||!(Number(d.latestBlockNumber)>0)||!(Number(d.laneCount)>0)) throw new Error('live ve33 protocol discovery missing: '+p);
            const lanes=Number(d.laneCount||0),checkpoints=Number(d.currentCheckpointCount||0),failures=Number(d.currentStateFailureCount||0);
            if(checkpoints+failures!==lanes) throw new Error(`live ve33 current-state accounting gap is silent for ${p}: ${checkpoints}+${failures} != ${lanes}`);
            if(checkpoints===0&&e.status!=='partial') throw new Error('zero factual checkpoints must keep output partial: '+p);
            totalCurrentCheckpoints+=checkpoints;
            if((d.boundaryFailures||[]).some(x=>x?.laneKey!==null&&x?.laneKey!==undefined)) throw new Error('historical boundary failure regressed to per-lane amplification: '+p);
          }
          if(!(totalCurrentCheckpoints>0)) throw new Error('live ve33 produced no factual current checkpoints on any configured protocol');
          const events=e.events||[];
          if(new Set(events.map(x=>x.eventKey)).size!==events.length) throw new Error('live ve33 duplicate event identity');
          if(events.some(x=>x.referenceAprUsed!==false||x.claimIsSecondIncomeEvent!==false||x.laterClaimOrPriceMoveDoesNotRewriteIncome!==true||x.executionAuthority!=='none')) throw new Error('live ve33 accounting semantic drift');
          if(e.authority?.executionAuthority!=='none'||e.authority?.walletAuthority!=='none'||e.authority?.claimingAuthority!=='none'||e.authority?.capitalExecution!==false) throw new Error('live ve33 authority expansion');
          const samplePayload=Object.fromEntries(Object.entries(e.diagnostics.protocols||{}).map(([k,v])=>[k,(v.stateFailureSamples||[]).slice(0,3)]));
          console.log('ve33 state failure samples JSON',JSON.stringify(samplePayload,null,2));
          console.log('Read-only live ve33 canary PASS',{
            status:e.status,
            lanes:e.diagnostics.laneCount,
            currentCheckpoints:Object.fromEntries(Object.entries(e.diagnostics.protocols||{}).map(([k,v])=>[k,v.currentCheckpointCount||0])),
            currentStateFailures:Object.fromEntries(Object.entries(e.diagnostics.protocols||{}).map(([k,v])=>[k,v.currentStateFailureCount||0])),
            stateFailureCounts:Object.fromEntries(Object.entries(e.diagnostics.protocols||{}).map(([k,v])=>[k,v.stateFailureCounts||{}])),
            historicalBoundarySkippedLaneReads:Object.fromEntries(Object.entries(e.diagnostics.protocols||{}).map(([k,v])=>[k,v.historicalBoundarySkippedLaneReads||0])),
            runtimeMs,
            events:events.length,
            accepted:e.diagnostics.acceptedPositiveIntervalCount,
            reconciliation:e.diagnostics.reconciliationCount,
            unresolvedSettlements:e.diagnostics.unresolvedSettlementCount,
            boundaryFailures:Object.values(e.diagnostics.protocols||{}).reduce((s,x)=>s+(x.boundaryFailures||[]).length,0)
          });
          NODE
          git diff --exit-code
