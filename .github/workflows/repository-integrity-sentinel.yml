name: The Holding Repository Integrity Sentinel

on:
  workflow_dispatch:
    inputs:
      enforce:
        description: "Fail the run on integrity findings (keep false during calibration)"
        required: false
        default: false
        type: boolean
  push:
    branches: [main]
    paths:
      - "**/*.js"
      - "**/*.mjs"
      - "**/*.cjs"
      - "**/*.html"
      - "**/*.json"
      - ".github/workflows/**"
      - "verification/**"

permissions:
  contents: read

concurrency:
  group: repository-integrity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  observe-repository-integrity:
    name: Observe repository integrity
    runs-on: ubuntu-latest
    timeout-minutes: 7

    steps:
      - name: Checkout exact commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Syntax check sentinel
        run: node --check verification/repository-integrity-sentinel-v0.1.mjs

      - name: Observe repository integrity
        shell: bash
        run: |
          set -euo pipefail
          ARGS=()
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.enforce }}" == "true" ]]; then
            ARGS+=(--enforce)
          fi
          node verification/repository-integrity-sentinel-v0.1.mjs "${ARGS[@]}"
