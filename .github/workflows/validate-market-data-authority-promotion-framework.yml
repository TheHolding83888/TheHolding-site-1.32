name: "Validate Market Data Authority Promotion Framework"

on:
  pull_request:
    paths:
      - 'intelligence/market-data/market-data-authority-policy.json'
      - 'intelligence/market-data/market-data-authority-selector.mjs'
      - 'intelligence/market-data/market-data-authority-selector-validation.mjs'
      - 'intelligence/market-data/market-data-authority-materializer.mjs'
      - 'intelligence/market-data/onchain-price-source-registry-extensions.json'
      - '.github/workflows/market-data-refresh.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Validate 26-asset reviewed authority boundary
        run: |
          set -euo pipefail
          node --check intelligence/market-data/market-data-authority-selector.mjs
          node --check intelligence/market-data/market-data-authority-selector-validation.mjs
          node --check intelligence/market-data/market-data-authority-materializer.mjs
          node intelligence/market-data/market-data-authority-selector-validation.mjs
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const p=JSON.parse(fs.readFileSync('intelligence/market-data/market-data-authority-policy.json','utf8'));
          const registry=JSON.parse(fs.readFileSync('intelligence/market-data/market-price-registry.json','utf8'));
          const extensions=JSON.parse(fs.readFileSync('intelligence/market-data/onchain-price-source-registry-extensions.json','utf8'));
          const direct=['bitcoin','ethereum','aerodrome-finance','pendle','curve-dao-token','frax-share','venice-token','internet-computer','decentraland','the-sandbox'];
          const relative=['convex-finance'];
          const v3=['ovr','beam-2','liquity','virtual-protocol','ondo-finance','zksync'];
          const reviewed=['tether-gold','fxn-token','yield-basis','velodrome-finance','resupply','autonolas','mode','elizaos','convex-crv'];
          const promoted=[...direct,...relative,...v3,...reviewed];
          const canonical=(registry.assets||[]).map(x=>x.assetId);
          if(p.mode!=='bounded-production-pilot'||p.globalOnchainPromotionEnabled!==true)throw new Error('Reviewed production pilot gate missing');
          if(p.defaultProductionAuthority!=='coingecko-lane')throw new Error('Daily CoinGecko fallback default changed');
          if(p.semantics?.automaticPolicyMutationAllowed!==false||p.semantics?.automaticProductionMergeAllowed!==false||p.semantics?.automaticCohortExpansionAllowed!==false)throw new Error('Automatic authority mutation enabled');
          if(p.semantics?.executionAuthority!=='none')throw new Error('Execution authority drift');
          if(JSON.stringify(p.pilot?.assetIds)!==JSON.stringify(direct)||Number(p.pilot?.maxPromotedAssetCount)!==10)throw new Error('Direct cohort drift');
          if(JSON.stringify(p.relativePilot?.assetIds)!==JSON.stringify(relative)||Number(p.relativePilot?.maxPromotedAssetCount)!==1)throw new Error('Relative cohort drift');
          if(JSON.stringify(p.v3RelativePilot?.assetIds)!==JSON.stringify(v3)||Number(p.v3RelativePilot?.maxPromotedAssetCount)!==6)throw new Error('V3 cohort drift');
          if(JSON.stringify(p.reviewedPilot?.assetIds)!==JSON.stringify(reviewed)||Number(p.reviewedPilot?.maxPromotedAssetCount)!==9)throw new Error('Reviewed cohort drift');
          if(new Set(promoted).size!==26||canonical.length!==26||canonical.some(id=>!promoted.includes(id)))throw new Error('Promoted set must equal the 26-asset canonical market universe');
          if(JSON.stringify(Object.keys(p.assetOverrides||{}).sort())!==JSON.stringify([...canonical].sort()))throw new Error('Authority overrides must equal canonical universe');
          for(const id of canonical)if(p.assetOverrides[id]?.requestedPrimary!=='onchain')throw new Error(`${id}: not explicitly onchain-primary`);
          const xaut=extensions.overrides?.['tether-gold']?.route;
          if(!xaut||xaut.type!=='uniswap-v3-twap-chainlink-quote'||xaut.network!=='ethereum'||Number(xaut.fee)!==500)throw new Error('XAUT token-market route missing');
          if(String(xaut.token||'').toLowerCase()!=='0x68749665ff8d2d112fa859aa293f07a622782f38'||String(xaut.quoteToken||'').toLowerCase()!=='0xdac17f958d2ee523a2206206994597c13d831ec7')throw new Error('XAUT/USDT token identity drift');
          if(String(xaut.quoteFeed?.contract||'').toLowerCase()!=='0x3e7d1eab13ad0104d2750b8863b489d65364e32d'||xaut.feedQuote!=='USDT'||xaut.outputQuote!=='USD')throw new Error('XAUT USDT/USD quote dependency drift');
          if(!/replaces the previous XAU\/USD backing-reference proxy/i.test(xaut.provenance||''))throw new Error('XAUT provenance must explicitly state token-market replacement of the backing-reference proxy');
          console.log('26-asset reviewed per-asset authority boundary PASS',{canonicalAssetCount:canonical.length,reviewedAssetCount:reviewed.length});
          NODE
          git diff --check
      - name: Prove authority PR does not mutate execution surfaces
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          base_sha='${{ github.event.pull_request.base.sha }}'
          git fetch origin "$base_sha" --depth=1
          changed="$(git diff --name-only "$base_sha" HEAD)"
          printf '%s\n' "$changed"
          forbidden='^(intelligence/market-data/public-capital-engine\.mjs|intelligence/market-data/market-price-registry\.json|workers/|src/|functions/)'
          if printf '%s\n' "$changed" | grep -Eq "$forbidden"; then
            echo 'Authority PR touched unrelated valuation or execution surfaces.' >&2
            exit 1
          fi
          echo 'Authority scope containment PASS'
