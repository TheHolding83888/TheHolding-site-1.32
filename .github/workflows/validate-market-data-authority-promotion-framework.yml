name: "Validate Market Data Authority Promotion Framework"

on:
  pull_request:
    paths:
      - 'intelligence/market-data/market-data-authority-policy.json'
      - 'intelligence/market-data/market-data-authority-selector.mjs'
      - 'intelligence/market-data/market-data-authority-selector-validation.mjs'
      - 'intelligence/market-data/market-data-authority-materializer.mjs'
      - '.github/workflows/market-data-refresh.yml'
      - '.github/workflows/validate-market-data-authority-promotion-framework.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout PR head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Validate bounded direct, CVX and V3 relative cohorts
        run: |
          set -euo pipefail
          node --check intelligence/market-data/market-data-authority-selector.mjs
          node --check intelligence/market-data/market-data-authority-selector-validation.mjs
          node --check intelligence/market-data/market-data-authority-materializer.mjs
          node intelligence/market-data/market-data-authority-selector-validation.mjs
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const p=JSON.parse(fs.readFileSync('intelligence/market-data/market-data-authority-policy.json','utf8'));
          const direct=['bitcoin','ethereum','aerodrome-finance','pendle','curve-dao-token','frax-share','venice-token','internet-computer','decentraland','the-sandbox'];
          const relative=['convex-finance'];
          const v3=['ovr','beam-2','liquity','virtual-protocol','ondo-finance','zksync'];
          const promoted=[...direct,...relative,...v3];
          const networks={bitcoin:'ethereum',ethereum:'ethereum','aerodrome-finance':'base',pendle:'optimism','curve-dao-token':'ethereum','frax-share':'ethereum','venice-token':'base','internet-computer':'bsc',decentraland:'polygon','the-sandbox':'polygon'};
          if(p.mode!=='bounded-production-pilot')throw new Error('Pilot mode missing');
          if(p.globalOnchainPromotionEnabled!==true)throw new Error('Pilot gate disabled');
          if(p.defaultProductionAuthority!=='coingecko-lane')throw new Error('Default production authority changed');
          if(p.semantics?.productionWriterIntegrationEnabled!==true)throw new Error('Writer integration missing');
          if(p.semantics?.automaticPolicyMutationAllowed!==false||p.semantics?.automaticProductionMergeAllowed!==false||p.semantics?.automaticCohortExpansionAllowed!==false)throw new Error('Automatic authority mutation enabled');
          if(p.semantics?.executionAuthority!=='none')throw new Error('Execution authority drift');
          if(JSON.stringify(p.pilot?.assetIds)!==JSON.stringify(direct)||Number(p.pilot?.maxPromotedAssetCount)!==10)throw new Error('Direct cohort drift');
          if(p.pilot?.requiredRouteType!=='chainlink-v3'||p.pilot?.requiredQuote!=='USD')throw new Error('Direct Chainlink/USD boundary drift');
          if(JSON.stringify(p.relativePilot?.assetIds)!==JSON.stringify(relative)||Number(p.relativePilot?.maxPromotedAssetCount)!==1)throw new Error('Relative cohort drift');
          if(p.relativePilot?.requiredRouteType!=='chainlink-v3-relative'||p.relativePilot?.requiredFeedQuote!=='ETH'||p.relativePilot?.requiredQuoteAssetId!=='ethereum'||p.relativePilot?.requiredOutputQuote!=='USD'||p.relativePilot?.requiredDependencyStatus!=='shadow-ok')throw new Error('Relative CVX boundary drift');
          if(JSON.stringify(p.v3RelativePilot?.assetIds)!==JSON.stringify(v3)||Number(p.v3RelativePilot?.maxPromotedAssetCount)!==6)throw new Error('V3 relative cohort drift');
          if(p.v3RelativePilot?.requiredRouteType!=='uniswap-v3-twap-relative'||p.v3RelativePilot?.requiredFeedQuote!=='ETH'||p.v3RelativePilot?.requiredQuoteAssetId!=='ethereum'||p.v3RelativePilot?.requiredOutputQuote!=='USD'||p.v3RelativePilot?.requiredDependencyStatus!=='shadow-ok')throw new Error('V3 relative boundary drift');
          if(JSON.stringify(Object.keys(p.assetOverrides||{}).sort())!==JSON.stringify(promoted.sort()))throw new Error('Overrides exceed bounded cohorts');
          for(const id of direct){
            const req=p.pilot?.routeRequirements?.[id];
            if(!req||req.network!==networks[id]||!/^0x[0-9a-fA-F]{40}$/.test(req.contract||''))throw new Error(`${id}: exact direct route requirement drift`);
          }
          const cvx=p.relativePilot?.routeRequirements?.['convex-finance'];
          if(!cvx||cvx.network!=='ethereum'||String(cvx.contract||'').toLowerCase()!=='0xc9cbf687f43176b302f03f5e58470b77d07c61c6')throw new Error('CVX exact relative route requirement drift');
          for(const id of v3){
            const req=p.v3RelativePilot?.routeRequirements?.[id];
            if(!req||!['ethereum','base','zksync'].includes(req.network)||!/^0x[0-9a-fA-F]{40}$/.test(req.factory||'')||!/^0x[0-9a-fA-F]{40}$/.test(req.token||'')||!/^0x[0-9a-fA-F]{40}$/.test(req.quoteToken||'')||!(Number(req.fee)>0)||Number(req.twapWindowSeconds)!==1800)throw new Error(`${id}: exact V3 route requirement drift`);
            const o=p.assetOverrides?.[id];
            if(o?.requiredObservationSource!=='uniswap-v3-twap-relative'||o?.requiredDependencyStatus!=='shadow-ok'||o?.requiredQuoteAssetId!=='ethereum'||o?.requiredFeedQuote!=='ETH'||o?.requiredOutputQuote!=='USD')throw new Error(`${id}: V3 dependency eligibility contract drift`);
          }
          if(p.assetOverrides?.elizaos)throw new Error('ELIZA must remain CoinGecko default authority');
          console.log('Bounded direct-10 plus CVX-relative plus V3-relative-6 authority boundary PASS');
          NODE
          git diff --check
      - name: Prove cohort scope cannot silently expand
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          base_sha='${{ github.event.pull_request.base.sha }}'
          git fetch origin "$base_sha" --depth=1
          changed="$(git diff --name-only "$base_sha" HEAD)"
          printf '%s\n' "$changed"
          forbidden='^(intelligence/market-data/onchain-price-source-registry\.json|intelligence/market-data/onchain-price-source-registry-extensions\.json|intelligence/market-data/onchain-price-resolver\.mjs|intelligence/market-data/public-capital-engine\.mjs|intelligence/market-data/market-price-registry\.json)$'
          if printf '%s\n' "$changed" | grep -Eq "$forbidden"; then
            echo 'Authority PR touched routing or valuation surfaces outside bounded integration.' >&2
            exit 1
          fi
          echo 'Bounded authority cohort scope containment PASS'
