name: "The Holding · Aerodrome Managed Strategy Pulse"

on:
  workflow_dispatch:
  schedule:
    - cron: "47 8 * * *"
  workflow_run:
    workflows:
      - "The Holding · Economic Graph"
    types: [completed]
  push:
    branches: [main]
    paths:
      - "intelligence/economic-graph/aerodrome-managed-strategy-pulse.mjs"
      - "intelligence/economic-graph/aerodrome-epoch-flow-overlay.mjs"
      - "intelligence/economic-graph/aerodrome-veaero-candidate.mjs"
      - "intelligence/economic-graph/economic-graph-canonical-runner.mjs"
      - ".github/workflows/update-aerodrome-managed-pulse.yml"
  pull_request:
    paths:
      - "intelligence/economic-graph/aerodrome-managed-strategy-pulse.mjs"
      - "intelligence/economic-graph/aerodrome-epoch-flow-overlay.mjs"
      - "intelligence/economic-graph/aerodrome-veaero-candidate.mjs"
      - "intelligence/economic-graph/economic-graph-canonical-runner.mjs"

permissions:
  contents: write

concurrency:
  group: the-holding-aerodrome-managed-strategy-pulse
  cancel-in-progress: false

jobs:
  pulse:
    if: >-
      ${{
        github.event_name != 'workflow_run' ||
        (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout reviewed canonical state
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || 'main' }}

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Install existing read-only chain dependencies
        working-directory: productivity
        run: npm install --no-audit --no-fund

      - name: Expose existing dependency tree to intelligence modules
        run: ln -sfn productivity/node_modules node_modules

      - name: Static validation
        run: |
          set -euo pipefail
          node --check intelligence/economic-graph/aerodrome-managed-strategy-pulse.mjs
          node --check intelligence/economic-graph/aerodrome-epoch-flow-overlay.mjs
          test -s intelligence/economic-graph/economic-graph.json
          git diff --check

      - name: Build same-block shadow pulse
        env:
          BASE_RPC_URL: ${{ secrets.BASE_RPC_URL }}
          BASE_RPC_URL_2: ${{ secrets.BASE_RPC_URL_2 }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            TMP="$(mktemp)"
            AERODROME_PULSE_FILE="$TMP" node intelligence/economic-graph/aerodrome-managed-strategy-pulse.mjs
            cp "$TMP" /tmp/aerodrome-managed-pulse.json
            rm -f "$TMP"
          else
            node intelligence/economic-graph/aerodrome-managed-strategy-pulse.mjs
            cp intelligence/economic-graph/aerodrome-managed-pulse.json /tmp/aerodrome-managed-pulse.json
          fi

      - name: Enrich protocol-native epoch flow accounting
        env:
          BASE_RPC_URL: ${{ secrets.BASE_RPC_URL }}
          BASE_RPC_URL_2: ${{ secrets.BASE_RPC_URL_2 }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            AERODROME_PULSE_FILE=/tmp/aerodrome-managed-pulse.json node intelligence/economic-graph/aerodrome-epoch-flow-overlay.mjs
          else
            AERODROME_PULSE_FILE=intelligence/economic-graph/aerodrome-managed-pulse.json node intelligence/economic-graph/aerodrome-epoch-flow-overlay.mjs
            cp intelligence/economic-graph/aerodrome-managed-pulse.json /tmp/aerodrome-managed-pulse.json
          fi

      - name: Validate pulse semantics and authority
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs');
          const crypto=require('crypto');
          const x=JSON.parse(fs.readFileSync('/tmp/aerodrome-managed-pulse.json','utf8'));
          const o=x.latest;
          const graphBytes=fs.readFileSync('intelligence/economic-graph/economic-graph.json');
          const graphHash=crypto.createHash('sha256').update(graphBytes).digest('hex');
          if(x.version!=='0.1-aerodrome-managed-strategy-pulse'||x.engineVersion!=='0.1-defitea-managed-venft-same-block-pulse')throw new Error('Pulse version mismatch');
          if(x.status!=='shadow-measured-not-promoted')throw new Error('Pulse shadow status missing');
          if(x.authority?.readOnly!==true||x.authority?.executionAuthority!=='none'||x.authority?.causalClaimAuthority!=='none'||x.authority?.promotionAuthority!=='none')throw new Error('Pulse authority regression');
          if(Number(x.sourceBinding?.canonicalCohortCountAtObservation)!==2||x.sourceBinding?.canonicalCohortCountUnchanged!==true)throw new Error('Pulse changed canonical cohort authority');
          if(x.sourceBinding?.economicGraphSha256!==graphHash||o?.provenance?.economicGraphSha256!==graphHash)throw new Error('Pulse not cryptographically bound to exact Economic Graph bytes');
          if(!o||o.chain!=='Base'||o.identity?.companyRegistry!=='004'||o.identity?.managedTokenId!=='10298'||o.identity?.depositorTokenId!=='103935')throw new Error('Defitea managed veNFT identity mismatch');
          if(o.provenance?.sameBlockRead!==true||Number(o.provenance?.blockNumber)!==Number(o.blockNumber)||o.provenance?.blockHash!==o.blockHash)throw new Error('Pulse same-block provenance missing');
          if(o.contracts?.voter!=='0x16613524e02ad97eDfeF371bC883F2F5d6C480A5'||o.contracts?.votingEscrow!=='0xeBf418Fe2512e7E6bd9b87a8F0f294aCDC67e6B4')throw new Error('Aerodrome core contract authority drift');
          if(!Number.isFinite(Number(o.voting?.managedVotingPower))||!Number.isFinite(Number(o.voting?.usedVotingWeight))||!Number.isFinite(Number(o.voting?.systemTotalVoteWeight)))throw new Error('Managed voting state incomplete');
          if(!Array.isArray(o.pools))throw new Error('Managed voted pools missing');
          for(const p of o.pools){
            if(!p.pool||!p.gauge?.address||!p.feeVotingReward?.address||!p.bribeVotingReward?.address)throw new Error('Pool/gauge/reward graph incomplete');
            if(p.epistemic?.voteToRewardDeposit!=='proven-onchain-contract-relationship')throw new Error('Pool accounting relationship class missing');
            for(const lane of [p.feeVotingReward,p.bribeVotingReward]){
              if(lane?.epochAccountingClass!=='proven-reward-contract-accounting')throw new Error('Pool epoch accounting class missing');
              for(const row of lane.rewards||[]){
                if(!Array.isArray(row.epochInflows)||row.epochInflows.length!==3)throw new Error('Reward token three-epoch accounting missing');
                if(row.epochInflows[0]?.epochStatus!=='in-progress'||row.epochInflows[1]?.epochStatus!=='completed'||row.epochInflows[2]?.epochStatus!=='completed')throw new Error('Reward epoch status ordering mismatch');
              }
            }
          }
          if(!Number.isFinite(Number(o.depositorManagedRewards?.lockedAeroAmount))||Number(o.depositorManagedRewards.lockedAeroAmount)<0)throw new Error('Depositor LockedManagedReward state missing');
          if(o.epistemic?.voteToFeeAndBribeRewardDeposit!=='proven-by-aerodrome-voter-accounting-identity')throw new Error('Voter accounting identity missing');
          if(o.epistemic?.referenceAprConnection!=='not-attributed-by-this-pulse'||o.epistemic?.causalAttribution!=='unresolved-beyond-contract-accounting-identities'||o.epistemic?.primaryDriver!==null||o.epistemic?.promotionAuthority!=='none')throw new Error('Pulse causal boundary weakened');
          if(x.semantics?.referenceAprIsSeparateEvidenceLane!==true||x.semantics?.actualManagedRewardsAreSeparateEvidenceLane!==true||x.semantics?.candidateNotCanonical!==true)throw new Error('Pulse evidence-lane separation missing');
          const e=x.epochFlowAccounting;
          if(e?.version!=='0.1-aerodrome-reward-epoch-accounting'||Number(e.blockNumber)!==Number(o.blockNumber)||e.blockHash!==o.blockHash)throw new Error('Epoch flow same-block binding missing');
          if(!Array.isArray(e.epochs)||e.epochs.length!==3||e.epochs[0]?.status!=='in-progress'||e.epochs[1]?.status!=='completed'||e.epochs[2]?.status!=='completed')throw new Error('Protocol-native three-epoch surface missing');
          if(e.comparisonPolicy?.completedEpochsComparable!==true||e.comparisonPolicy?.currentToDateVsCompletedComparable!==false)throw new Error('Epoch comparability boundary missing');
          if(e.officialContractSource?.repository!=='aerodrome-finance/contracts'||e.officialContractSource?.commit!=='1ba30815bba620f7e9faa34769ffd00c214c9b82')throw new Error('Official Aerodrome accounting source pin missing');
          if(e.epistemic?.contractWideInflowsAreNotCompanyEarnedShare!==true||e.epistemic?.referenceAprConnection!=='not-attributed-by-this-overlay'||e.epistemic?.primaryDriver!==null||e.epistemic?.promotionAuthority!=='none')throw new Error('Epoch flow epistemic boundary weakened');
          if(x.semantics?.epochFlowAccounting!==true||x.semantics?.rewardContractInflowsAreNotCompanyEarnedShare!==true)throw new Error('Epoch flow semantic boundary missing');
          console.log('AERODROME MANAGED STRATEGY PULSE semantic PASS',{
            block:o.blockNumber,
            managedTokenId:o.identity.managedTokenId,
            votedPools:o.voting.votedPoolCount,
            usedVotingPowerPct:o.voting.usedVotingPowerPct,
            gaugeClaimableAero:o.aggregates.totalGaugeClaimableAero,
            gaugeWeeklyEmissionAero:o.aggregates.totalGaugeWeeklyEmissionRateAero,
            lockedManagedAero:o.depositorManagedRewards.lockedAeroAmount,
            feeEpochTokens:e.lanes.feeVotingRewards.byToken.length,
            bribeEpochTokens:e.lanes.bribeVotingRewards.byToken.length,
            lockedEpochTokens:e.lanes.lockedManagedRewards.byToken.length,
            graphHash,
            primaryDriver:o.epistemic.primaryDriver,
            promotionAuthority:o.epistemic.promotionAuthority,
            executionAuthority:x.authority.executionAuthority
          });
          NODE
          git diff --check

      - name: Publish generated pulse atomically
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_RPC_URL: ${{ secrets.BASE_RPC_URL }}
          BASE_RPC_URL_2: ${{ secrets.BASE_RPC_URL_2 }}
        shell: bash
        run: |
          set -euo pipefail
          GENERATED="intelligence/economic-graph/aerodrome-managed-pulse.json"
          GRAPH="intelligence/economic-graph/economic-graph.json"
          test -s "$GENERATED"
          test -s "$GRAPH"

          artifact_graph_hash() {
            node - "$GENERATED" <<'NODE'
          const fs=require('fs');
          const x=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          process.stdout.write(String(x.sourceBinding?.economicGraphSha256 || ''));
          NODE
          }

          validate_binding() {
            node - "$GENERATED" "$GRAPH" <<'NODE'
          const fs=require('fs');
          const crypto=require('crypto');
          const pulse=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          const graphHash=crypto.createHash('sha256').update(fs.readFileSync(process.argv[3])).digest('hex');
          if(pulse.sourceBinding?.economicGraphSha256!==graphHash)throw new Error('Pulse sourceBinding does not match exact Graph bytes');
          if(pulse.latest?.provenance?.economicGraphSha256!==graphHash||pulse.latest?.provenance?.sameBlockRead!==true)throw new Error('Pulse provenance binding missing');
          if(pulse.authority?.executionAuthority!=='none'||pulse.authority?.promotionAuthority!=='none'||pulse.latest?.epistemic?.primaryDriver!==null)throw new Error('Pulse authority boundary regression');
          if(pulse.epochFlowAccounting?.version!=='0.1-aerodrome-reward-epoch-accounting'||Number(pulse.epochFlowAccounting?.blockNumber)!==Number(pulse.latest?.blockNumber))throw new Error('Pulse epoch-flow enrichment missing');
          if(pulse.epochFlowAccounting?.epistemic?.contractWideInflowsAreNotCompanyEarnedShare!==true||pulse.epochFlowAccounting?.epistemic?.primaryDriver!==null)throw new Error('Pulse epoch-flow authority boundary regression');
          NODE
          }

          fetch_remote_graph() {
            gh api --method GET \
              -H "Accept: application/vnd.github.raw+json" \
              "repos/${GITHUB_REPOSITORY}/contents/${GRAPH}" \
              -f ref=main > /tmp/remote-economic-graph.json
          }

          fetch_remote_pulse_if_present() {
            if gh api --method GET \
              -H "Accept: application/vnd.github.raw+json" \
              "repos/${GITHUB_REPOSITORY}/contents/${GENERATED}" \
              -f ref=main > /tmp/remote-aerodrome-pulse.json 2>/dev/null; then
              cp /tmp/remote-aerodrome-pulse.json "$GENERATED"
              return 0
            fi
            rm -f /tmp/remote-aerodrome-pulse.json "$GENERATED"
            return 1
          }

          validate_binding

          # Publish exactly one generated file through the repository Contents API.
          # Unrelated main churn cannot invalidate an already measured same-block
          # Pulse. A genuine Economic Graph byte change forces a full re-measure
          # and epoch-accounting enrichment before publication.
          for attempt in 1 2 3 4 5 6; do
            fetch_remote_graph
            REMOTE_GRAPH_HASH="$(sha256sum /tmp/remote-economic-graph.json | awk '{print $1}')"
            ARTIFACT_GRAPH_HASH="$(artifact_graph_hash)"
            if [ -z "$REMOTE_GRAPH_HASH" ] || [ -z "$ARTIFACT_GRAPH_HASH" ]; then
              echo "ERROR: missing Aerodrome Pulse / Economic Graph binding hash"
              exit 1
            fi

            if [ "$ARTIFACT_GRAPH_HASH" != "$REMOTE_GRAPH_HASH" ]; then
              echo "Economic Graph changed since Pulse measurement; rebuilding against exact remote Graph bytes."
              cp /tmp/remote-economic-graph.json "$GRAPH"
              fetch_remote_pulse_if_present || true
              node intelligence/economic-graph/aerodrome-managed-strategy-pulse.mjs
              AERODROME_PULSE_FILE="$GENERATED" node intelligence/economic-graph/aerodrome-epoch-flow-overlay.mjs
              validate_binding
              continue
            fi

            REMOTE_SHA=""
            if REMOTE_SHA="$(gh api --method GET "repos/${GITHUB_REPOSITORY}/contents/${GENERATED}" -f ref=main --jq '.sha' 2>/dev/null)"; then
              :
            else
              REMOTE_SHA=""
            fi

            node - "$GENERATED" "$REMOTE_SHA" > /tmp/aerodrome-pulse-put.json <<'NODE'
          const fs=require('fs');
          const [file,sha]=process.argv.slice(2);
          const payload={
            message:'intelligence: refresh aerodrome managed pulse',
            content:fs.readFileSync(file).toString('base64'),
            branch:'main'
          };
          if(sha) payload.sha=sha;
          process.stdout.write(JSON.stringify(payload));
          NODE

            if gh api --method PUT \
              "repos/${GITHUB_REPOSITORY}/contents/${GENERATED}" \
              --input /tmp/aerodrome-pulse-put.json > /tmp/aerodrome-pulse-publish-response.json; then
              node - <<'NODE'
          const fs=require('fs');
          const r=JSON.parse(fs.readFileSync('/tmp/aerodrome-pulse-publish-response.json','utf8'));
          if(!r?.commit?.sha||r?.content?.path!=='intelligence/economic-graph/aerodrome-managed-pulse.json')throw new Error('Unexpected Contents API publication response');
          console.log('Aerodrome Pulse atomic publication commit',r.commit.sha);
          NODE

              gh api --method GET \
                -H "Accept: application/vnd.github.raw+json" \
                "repos/${GITHUB_REPOSITORY}/contents/${GENERATED}" \
                -f ref=main > /tmp/remote-aerodrome-pulse.json
              gh api --method GET \
                -H "Accept: application/vnd.github.raw+json" \
                "repos/${GITHUB_REPOSITORY}/contents/${GRAPH}" \
                -f ref=main > /tmp/remote-economic-graph-after.json

              node - <<'NODE'
          const fs=require('fs');
          const crypto=require('crypto');
          const x=JSON.parse(fs.readFileSync('/tmp/remote-aerodrome-pulse.json','utf8'));
          const graphHash=crypto.createHash('sha256').update(fs.readFileSync('/tmp/remote-economic-graph-after.json')).digest('hex');
          if(x.version!=='0.1-aerodrome-managed-strategy-pulse'||x.status!=='shadow-measured-not-promoted')throw new Error('Remote pulse version/status mismatch');
          if(x.authority?.executionAuthority!=='none'||x.authority?.promotionAuthority!=='none')throw new Error('Remote pulse authority regression');
          if(x.sourceBinding?.economicGraphSha256!==graphHash||x.latest?.provenance?.economicGraphSha256!==graphHash||x.latest?.provenance?.sameBlockRead!==true)throw new Error('Remote Pulse is not bound to current exact Economic Graph bytes');
          if(x.latest?.epistemic?.primaryDriver!==null)throw new Error('Remote pulse unearned primaryDriver');
          if(x.epochFlowAccounting?.version!=='0.1-aerodrome-reward-epoch-accounting'||Number(x.epochFlowAccounting?.blockNumber)!==Number(x.latest?.blockNumber))throw new Error('Remote epoch-flow accounting missing');
          if(x.epochFlowAccounting?.epistemic?.contractWideInflowsAreNotCompanyEarnedShare!==true||x.epochFlowAccounting?.epistemic?.primaryDriver!==null||x.epochFlowAccounting?.epistemic?.promotionAuthority!=='none')throw new Error('Remote epoch-flow boundary weakened');
          console.log('Verified Aerodrome Managed Strategy Pulse + epoch flow accounting on remote main.');
          NODE
              exit 0
            fi

            echo "Contents API publication raced or was rejected; retrying bounded attempt $attempt/6..."
            sleep $attempt
          done

          echo "Aerodrome Pulse atomic publication failed after 6 bounded attempts."
          exit 1
