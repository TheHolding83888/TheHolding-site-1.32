name: "Validate BEAM Onchain Market Data"

on:
  pull_request:
    paths:
      - 'intelligence/market-data/onchain-price-source-registry-extensions.json'
      - 'intelligence/market-data/onchain-price-resolver.mjs'
      - 'intelligence/market-data/onchain-price-resolver-v09.mjs'
      - 'intelligence/market-data/onchain-route-override-validation.mjs'
      - 'intelligence/market-data/onchain-uniswap-v2-historical-twap.mjs'
      - 'intelligence/market-data/onchain-uniswap-v2-historical-twap-validation.mjs'
      - 'intelligence/market-data/onchain-uniswap-v3-chainlink-quote.mjs'
      - 'intelligence/market-data/onchain-uniswap-v3-chainlink-quote-validation.mjs'
      - '.github/workflows/validate-beam-onchain-market-data.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout PR head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Validate inherited runtimes plus bounded route replacement
        run: |
          set -euo pipefail
          node --check intelligence/market-data/onchain-price-resolver.mjs
          node --check intelligence/market-data/onchain-price-resolver-v09.mjs
          node --check intelligence/market-data/onchain-route-override-validation.mjs
          node --check intelligence/market-data/onchain-uniswap-v2-historical-twap.mjs
          node --check intelligence/market-data/onchain-uniswap-v2-historical-twap-validation.mjs
          node --check intelligence/market-data/onchain-uniswap-v3-chainlink-quote.mjs
          node --check intelligence/market-data/onchain-uniswap-v3-chainlink-quote-validation.mjs
          node intelligence/market-data/onchain-route-override-validation.mjs
          node intelligence/market-data/onchain-uniswap-v2-historical-twap-validation.mjs
          node intelligence/market-data/onchain-uniswap-v3-chainlink-quote-validation.mjs
      - name: Prove BEAM remains exact and additive-safe
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs');
          const ext=JSON.parse(fs.readFileSync('intelligence/market-data/onchain-price-source-registry-extensions.json','utf8'));
          const r=ext.assets?.['beam-2']?.route;
          if(!r||r.type!=='uniswap-v2-historical-twap-relative'||r.network!=='ethereum'||r.authority!=='shadow')throw new Error('BEAM V2 route invalid');
          if(r.pair.toLowerCase()!=='0x180efc1349a69390ade25667487a826164c9c6e4')throw new Error('BEAM/WETH pair drift');
          if(r.token.toLowerCase()!=='0x62d0a8458ed7719fdaf978fe5929c6d342b0bfce')throw new Error('BEAM token drift');
          if(r.quoteToken.toLowerCase()!=='0xc02aaa39b223fe8d0a0e5c4f27ead9083c756cc2')throw new Error('BEAM WETH quote drift');
          if(Number(r.lookbackBlocks)!==150||Number(r.minTwapWindowSeconds)!==1200||Number(r.maxTwapWindowSeconds)!==2700)throw new Error('BEAM historical window drift');
          if(r.quoteAssetId!=='ethereum'||r.feedQuote!=='ETH'||r.outputQuote!=='USD'||Number(r.maxDivergencePct)!==10)throw new Error('BEAM composition drift');
          console.log('BEAM additive-safe route gate PASS');
          NODE
      - name: Prove ELIZA exact route and full canonical coverage
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs');
          const market=JSON.parse(fs.readFileSync('intelligence/market-data/market-price-registry.json','utf8'));
          const base=JSON.parse(fs.readFileSync('intelligence/market-data/onchain-price-source-registry.json','utf8'));
          const ext=JSON.parse(fs.readFileSync('intelligence/market-data/onchain-price-source-registry-extensions.json','utf8'));
          const ids=(market.assets||[]).map(x=>x.assetId), effective={...(base.assets||{}),...(ext.assets||{})};
          const routed=ids.filter(id=>effective[id]), pending=ids.filter(id=>!effective[id]);
          const special=Object.keys(effective).filter(id=>!ids.includes(id));
          if(ids.length!==26||routed.length!==26||pending.length!==0)throw new Error(`Full coverage drift: ${routed.length}/26 pending=${pending.join(',')}`);
          if(special.length!==1||special[0]!=='physical-silver'||routed.length+special.length!==27)throw new Error('Live target count drift');
          const r=ext.assets?.elizaos?.route;
          if(!r||r.type!=='uniswap-v3-twap-chainlink-quote'||r.network!=='bsc'||r.authority!=='shadow')throw new Error('ELIZA route invalid');
          if(r.factory.toLowerCase()!=='0x0bfbcf9fa4f9c56b0f40a671ad40e0805a091865'||r.token.toLowerCase()!=='0xea17df5cf6d172224892b5477a16acb111182478'||r.quoteToken.toLowerCase()!=='0x8ac76a51cc950d9822d68b83fe1ad97b32cd580d')throw new Error('ELIZA identity drift');
          if(Number(r.fee)!==2500||Number(r.twapWindowSeconds)!==1800||Number(r.maxDivergencePct)!==10)throw new Error('ELIZA TWAP drift');
          if(r.quoteFeed?.type!=='chainlink-v3'||r.quoteFeed.contract.toLowerCase()!=='0x51597f405303c4377e36123cbc172b13269ea163')throw new Error('ELIZA quote dependency drift');
          console.log('ELIZA full 26/26 route gate PASS',{routed:routed.length,totalObservationTargets:routed.length+special.length});
          NODE
      - name: Prove MODE stale Pyth route is replaced by Velodrome observation TWAP
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs');
          const {mergeOnchainRegistryExtensions}=await import('./intelligence/market-data/onchain-price-resolver.mjs');
          const base=JSON.parse(fs.readFileSync('intelligence/market-data/onchain-price-source-registry.json','utf8'));
          const ext=JSON.parse(fs.readFileSync('intelligence/market-data/onchain-price-source-registry-extensions.json','utf8'));
          if(base.assets?.mode?.route?.type!=='pyth-core-readonly')throw new Error('Expected byte-stable base MODE route to remain Pyth before effective override');
          const effective=mergeOnchainRegistryExtensions(base,ext);
          const r=effective.assets?.mode?.route;
          if(!r||r.type!=='velodrome-v2-twap-relative'||r.network!=='mode'||r.authority!=='shadow')throw new Error('Effective MODE Velodrome route invalid');
          if(r.factory.toLowerCase()!=='0x31832f2a97fd20664d76cc421207669b55ce4bc0')throw new Error('Mode Velodrome PoolFactory drift');
          if(r.token.toLowerCase()!=='0xdfc7c877a950e49d2610114102175a06c2e3167a')throw new Error('MODE token drift');
          if(r.quoteToken.toLowerCase()!=='0x4200000000000000000000000000000000000006'||r.stable!==false)throw new Error('MODE/WETH pool contract drift');
          if(String(r.amountIn)!=='1000000000000000000'||Number(r.tokenDecimals)!==18||Number(r.quoteTokenDecimals)!==18)throw new Error('MODE amount/decimals drift');
          if(Number(r.granularity)!==4||Number(r.observationPeriodSeconds)!==1800)throw new Error('MODE observation TWAP sampling drift');
          if(r.quoteAssetId!=='ethereum'||r.feedQuote!=='ETH'||r.outputQuote!=='USD'||Number(r.maxDivergencePct)!==10)throw new Error('MODE relative-price composition drift');
          if(ext.semantics?.boundedRouteOverridesAllowed!==true||effective.semantics?.boundedRouteOverridesApplied!==true)throw new Error('Bounded route override contract missing');
          if(ext.semantics?.productionPriceAuthority!==false||ext.semantics?.executionAuthority!=='none')throw new Error('Authority drift');
          console.log('MODE Velodrome replacement gate PASS',{baseRoute:base.assets.mode.route.type,effectiveRoute:r.type,factory:r.factory,staleUpdaterDependency:false,productionPriceAuthority:false});
          NODE
          git diff --check
