name: "Validate BEAM Onchain Market Data"

on:
  pull_request:
    paths:
      - 'intelligence/market-data/onchain-price-source-registry-extensions.json'
      - 'intelligence/market-data/onchain-price-resolver.mjs'
      - 'intelligence/market-data/onchain-uniswap-v2-historical-twap.mjs'
      - 'intelligence/market-data/onchain-uniswap-v2-historical-twap-validation.mjs'
      - '.github/workflows/validate-beam-onchain-market-data.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout PR head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Validate V2 historical TWAP runtime
        run: |
          set -euo pipefail
          node --check intelligence/market-data/onchain-price-resolver.mjs
          node --check intelligence/market-data/onchain-uniswap-v2-historical-twap.mjs
          node --check intelligence/market-data/onchain-uniswap-v2-historical-twap-validation.mjs
          node intelligence/market-data/onchain-uniswap-v2-historical-twap-validation.mjs
      - name: Prove BEAM exact route and coverage promotion
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs');
          const market=JSON.parse(fs.readFileSync('intelligence/market-data/market-price-registry.json','utf8'));
          const base=JSON.parse(fs.readFileSync('intelligence/market-data/onchain-price-source-registry.json','utf8'));
          const ext=JSON.parse(fs.readFileSync('intelligence/market-data/onchain-price-source-registry-extensions.json','utf8'));
          const ids=(market.assets||[]).map(x=>x.assetId), effective={...(base.assets||{}),...(ext.assets||{})};
          const routed=ids.filter(id=>effective[id]), pending=ids.filter(id=>!effective[id]);
          const special=Object.keys(effective).filter(id=>!ids.includes(id));
          if(ids.length!==26)throw new Error(`Canonical market universe drift: ${ids.length}`);
          if(routed.length!==25)throw new Error(`Expected 25/26 routed after BEAM, got ${routed.length}`);
          if(pending.length!==1||pending[0]!=='elizaos')throw new Error(`Unexpected pending set after BEAM: ${pending.join(',')}`);
          if(special.length!==1||special[0]!=='physical-silver')throw new Error(`Unexpected special route set: ${special.join(',')}`);
          const r=ext.assets?.['beam-2']?.route;
          if(!r||r.type!=='uniswap-v2-historical-twap-relative'||r.network!=='ethereum'||r.authority!=='shadow')throw new Error('BEAM V2 route invalid');
          if(r.pair.toLowerCase()!=='0x180efc1349a69390ade25667487a826164c9c6e4')throw new Error('BEAM/WETH pair drift');
          if(r.token.toLowerCase()!=='0x62d0a8458ed7719fdaf978fe5929c6d342b0bfce')throw new Error('BEAM token drift');
          if(r.quoteToken.toLowerCase()!=='0xc02aaa39b223fe8d0a0e5c4f27ead9083c756cc2')throw new Error('BEAM WETH quote drift');
          if(Number(r.lookbackBlocks)!==150||Number(r.minTwapWindowSeconds)!==1200||Number(r.maxTwapWindowSeconds)!==2700)throw new Error('BEAM historical window drift');
          if(r.quoteAssetId!=='ethereum'||r.feedQuote!=='ETH'||r.outputQuote!=='USD'||Number(r.maxDivergencePct)!==10)throw new Error('BEAM composition drift');
          if(ext.semantics?.uniswapV2SpotPriceAuthority!==false||ext.semantics?.productionPriceAuthority!==false||ext.semantics?.executionAuthority!=='none')throw new Error('Authority drift');
          console.log('BEAM V2 historical TWAP exact gate PASS',{routed:routed.length,pending,totalObservationTargets:routed.length+special.length});
          NODE
          git diff --check
