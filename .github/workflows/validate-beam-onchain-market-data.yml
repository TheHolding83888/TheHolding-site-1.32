name: "Validate BEAM Onchain Market Data"

on:
  pull_request:
    paths:
      - 'intelligence/market-data/onchain-price-source-registry-extensions.json'
      - 'intelligence/market-data/onchain-price-resolver.mjs'
      - 'intelligence/market-data/onchain-price-resolver-v09.mjs'
      - 'intelligence/market-data/onchain-route-override-validation.mjs'
      - 'intelligence/market-data/onchain-curve-ema.mjs'
      - 'intelligence/market-data/onchain-uniswap-v2-historical-twap.mjs'
      - 'intelligence/market-data/onchain-uniswap-v2-historical-twap-validation.mjs'
      - 'intelligence/market-data/onchain-uniswap-v3-twap.mjs'
      - 'intelligence/market-data/onchain-uniswap-v3-twap-validation.mjs'
      - 'intelligence/market-data/onchain-uniswap-v3-chainlink-quote.mjs'
      - 'intelligence/market-data/onchain-uniswap-v3-chainlink-quote-validation.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Validate inherited runtimes
        run: |
          set -euo pipefail
          node --check intelligence/market-data/onchain-price-resolver.mjs
          node --check intelligence/market-data/onchain-price-resolver-v09.mjs
          node --check intelligence/market-data/onchain-route-override-validation.mjs
          node --check intelligence/market-data/onchain-curve-ema.mjs
          node --check intelligence/market-data/onchain-uniswap-v2-historical-twap.mjs
          node --check intelligence/market-data/onchain-uniswap-v2-historical-twap-validation.mjs
          node --check intelligence/market-data/onchain-uniswap-v3-twap.mjs
          node --check intelligence/market-data/onchain-uniswap-v3-twap-validation.mjs
          node --check intelligence/market-data/onchain-uniswap-v3-chainlink-quote.mjs
          node --check intelligence/market-data/onchain-uniswap-v3-chainlink-quote-validation.mjs
          node intelligence/market-data/onchain-route-override-validation.mjs
          node intelligence/market-data/onchain-uniswap-v2-historical-twap-validation.mjs
          node intelligence/market-data/onchain-uniswap-v3-twap-validation.mjs
          node intelligence/market-data/onchain-uniswap-v3-chainlink-quote-validation.mjs
      - name: Prove BEAM live-proven V3 route
        run: |
          set -euo pipefail
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          import { mergeOnchainRegistryExtensions } from './intelligence/market-data/onchain-price-resolver.mjs';
          const base=JSON.parse(fs.readFileSync('intelligence/market-data/onchain-price-source-registry.json','utf8'));
          const ext=JSON.parse(fs.readFileSync('intelligence/market-data/onchain-price-source-registry-extensions.json','utf8'));
          const effective=mergeOnchainRegistryExtensions(base,ext);
          const r=effective.assets?.['beam-2']?.route;
          if(!r||r.type!=='uniswap-v3-twap-relative'||r.network!=='ethereum'||r.authority!=='shadow')throw new Error('BEAM V3 route invalid');
          if(r.factory.toLowerCase()!=='0x1f98431c8ad98523631ae4a59f267346ea31f984')throw new Error('BEAM factory drift');
          if(r.token.toLowerCase()!=='0x62d0a8458ed7719fdaf978fe5929c6d342b0bfce'||r.quoteToken.toLowerCase()!=='0xc02aaa39b223fe8d0a0e5c4f27ead9083c756cc2')throw new Error('BEAM identity drift');
          if(Number(r.fee)!==10000||Number(r.twapWindowSeconds)!==1800||Number(r.maxDivergencePct)!==10)throw new Error('BEAM V3 TWAP drift');
          if(r.quoteAssetId!=='ethereum'||r.feedQuote!=='ETH'||r.outputQuote!=='USD')throw new Error('BEAM composition drift');
          if(ext.semantics?.uniswapV3SpotPriceAuthority!==false||ext.semantics?.productionPriceAuthority!==false||ext.semantics?.executionAuthority!=='none')throw new Error('BEAM authority drift');
          console.log('BEAM live-proven V3 1% 30m gate PASS',{fee:r.fee,twapWindowSeconds:r.twapWindowSeconds});
          NODE
      - name: Prove ELIZA 5m route and full canonical coverage
        run: |
          set -euo pipefail
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          import { mergeOnchainRegistryExtensions } from './intelligence/market-data/onchain-price-resolver.mjs';
          const market=JSON.parse(fs.readFileSync('intelligence/market-data/market-price-registry.json','utf8'));
          const base=JSON.parse(fs.readFileSync('intelligence/market-data/onchain-price-source-registry.json','utf8'));
          const ext=JSON.parse(fs.readFileSync('intelligence/market-data/onchain-price-source-registry-extensions.json','utf8'));
          const effective=mergeOnchainRegistryExtensions(base,ext);
          const ids=(market.assets||[]).map(x=>x.assetId),routed=ids.filter(id=>effective.assets?.[id]),pending=ids.filter(id=>!effective.assets?.[id]);
          const special=Object.keys(effective.assets||{}).filter(id=>!ids.includes(id));
          if(ids.length!==26||routed.length!==26||pending.length!==0)throw new Error(`Full coverage drift: ${routed.length}/26 pending=${pending.join(',')}`);
          if(special.length!==1||special[0]!=='physical-silver'||routed.length+special.length!==27)throw new Error('Live target count drift');
          const r=effective.assets?.elizaos?.route;
          if(!r||r.type!=='uniswap-v3-twap-chainlink-quote'||r.network!=='bsc'||r.authority!=='shadow')throw new Error('ELIZA route invalid');
          if(r.factory.toLowerCase()!=='0x0bfbcf9fa4f9c56b0f40a671ad40e0805a091865'||r.token.toLowerCase()!=='0xea17df5cf6d172224892b5477a16acb111182478'||r.quoteToken.toLowerCase()!=='0x8ac76a51cc950d9822d68b83fe1ad97b32cd580d')throw new Error('ELIZA identity drift');
          if(Number(r.fee)!==2500||Number(r.twapWindowSeconds)!==300||Number(r.maxDivergencePct)!==10)throw new Error('ELIZA 5m TWAP drift');
          if(r.quoteFeed?.type!=='chainlink-v3'||r.quoteFeed.contract.toLowerCase()!=='0x51597f405303c4377e36123cbc172b13269ea163')throw new Error('ELIZA quote dependency drift');
          if(ext.semantics?.stablecoinPegHardcoded!==false||ext.semantics?.uniswapV3SpotPriceAuthority!==false)throw new Error('ELIZA authority drift');
          console.log('ELIZA 5m full 26/26 route gate PASS',{routed:routed.length,totalObservationTargets:routed.length+special.length});
          NODE
      - name: Prove MODE and FXN resilience remain intact
        run: |
          set -euo pipefail
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          import { mergeOnchainRegistryExtensions } from './intelligence/market-data/onchain-price-resolver.mjs';
          const base=JSON.parse(fs.readFileSync('intelligence/market-data/onchain-price-source-registry.json','utf8'));
          const ext=JSON.parse(fs.readFileSync('intelligence/market-data/onchain-price-source-registry-extensions.json','utf8'));
          const effective=mergeOnchainRegistryExtensions(base,ext);
          if(effective.assets?.mode?.route?.type!=='velodrome-v2-twap-relative')throw new Error('MODE resilience route lost');
          if(effective.assets?.['fxn-token']?.route?.type!=='curve-ema-relative')throw new Error('FXN resilience route lost');
          if(ext.semantics?.boundedRouteOverridesAllowed!==true||effective.semantics?.boundedRouteOverridesApplied!==true)throw new Error('Bounded override contract missing');
          console.log('MODE + FXN resilience preservation PASS');
          NODE
          git diff --check
