name: Ask candidate · v1.1 Interface Evolution

on:
  push:
    branches:
      - agents/ask-company-understanding-v1.1-20260815
    paths:
      - .github/workflows/_ask_v11_interface_candidate.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: agents/ask-company-understanding-v1.1-20260815
          fetch-depth: 0
      - name: Apply interface evolution
        shell: bash
        run: |
          set -euo pipefail
          node verification/ask-experience/patch-ask-v1.1-interface.mjs
          node --check agents/console/app.js
          node verification/ask-experience/quick-command-contract-v0.1.mjs
          git diff --check
      - name: Commit candidate
        shell: bash
        run: |
          set -euo pipefail
          rm verification/ask-experience/patch-ask-v1.1-interface.mjs
          git config user.name 'The Holding Production Integrator'
          git config user.email 'production-integrator@theholding.ai'
          git add agents/index.html agents/console/app.js verification/ask-experience/corpus-core-v0.1.json
          git add -u verification/ask-experience/patch-ask-v1.1-interface.mjs
          git commit -m 'Ask v1.1: surface Company Understanding capability'
          git push origin HEAD:agents/ask-company-understanding-v1.1-20260815
