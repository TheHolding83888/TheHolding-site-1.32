name: "The Holding Brain · Decision Outcome Learning Loop"

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["The Holding Brain · Refresh Cognitive Stack"]
    types: [completed]
  push:
    branches: [main]
    paths:
      - 'intelligence/brain-intelligence.json'
      - 'intelligence/cognitive-stack-state.json'
      - 'intelligence/cognitive-stack-release.json'
      - 'intelligence/learning/decision-ledger.json'
      - 'intelligence/learning/decision-policy.json'
      - 'intelligence/learning/decision-learning-engine.mjs'
      - 'intelligence/learning/independent-learning-reviewer.mjs'
      - 'intelligence/learning/owner-outcome-review-ledger.json'
      - 'intelligence/learning/owner-outcome-review-policy.json'
      - 'intelligence/learning/owner-outcome-review-recorder.mjs'
      - 'intelligence/learning/owner-outcome-experience-engine.mjs'
      - 'intelligence/learning/independent-owner-outcome-experience-reviewer.mjs'
      - 'intelligence/learning/learning-release.json'
      - 'intelligence/learning/learning-release-guard.mjs'
      - '.github/workflows/update-learning-loop.yml'
      - '.github/workflows/record-brain-decision.yml'
      - '.github/workflows/record-owner-economic-decision.yml'
      - '.github/workflows/record-owner-economic-outcome-review.yml'
      - '.github/workflows/security-sentinel.yml'

permissions:
  contents: write

concurrency:
  group: decision-learning-main
  cancel-in-progress: false

jobs:
  learn:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Checkout canonical repository state
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Preflight release coherence
        shell: bash
        run: |
          set -euo pipefail
          node intelligence/cognitive-release-guard.mjs
          node intelligence/learning/learning-release-guard.mjs

      - name: Preflight learning engines
        shell: bash
        run: |
          set -euo pipefail
          node --check intelligence/learning/decision-learning-engine.mjs
          node --check intelligence/learning/independent-learning-reviewer.mjs
          node --check intelligence/learning/decision-recorder.mjs
          node --check intelligence/learning/owner-outcome-review-recorder.mjs
          node --check intelligence/learning/owner-outcome-experience-engine.mjs
          node --check intelligence/learning/independent-owner-outcome-experience-reviewer.mjs
          node intelligence/learning/decision-recorder.mjs --self-test
          node intelligence/learning/independent-learning-reviewer.mjs --self-test
          node intelligence/learning/owner-outcome-review-recorder.mjs --self-test
          node intelligence/learning/owner-outcome-experience-engine.mjs --self-test
          node intelligence/learning/independent-owner-outcome-experience-reviewer.mjs --self-test
          node -e "JSON.parse(require('fs').readFileSync('intelligence/learning/decision-policy.json','utf8')); JSON.parse(require('fs').readFileSync('intelligence/learning/decision-ledger.json','utf8')); JSON.parse(require('fs').readFileSync('intelligence/learning/owner-outcome-review-policy.json','utf8')); JSON.parse(require('fs').readFileSync('intelligence/learning/owner-outcome-review-ledger.json','utf8'));"

      - name: Build owner economic outcome experience
        run: |
          set -euo pipefail
          node intelligence/learning/owner-outcome-experience-engine.mjs
          node intelligence/learning/independent-owner-outcome-experience-reviewer.mjs

      - name: Build case → decision → outcome → lesson memory
        id: build
        shell: bash
        run: |
          set +e
          node intelligence/learning/decision-learning-engine.mjs
          code=$?
          set -e
          if [ "$code" -eq 3 ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "unchanged=false" >> "$GITHUB_OUTPUT"
            echo "Learning Loop skipped because the current Cognitive Stack is not coherent/ready."
            exit 0
          fi
          if [ "$code" -eq 4 ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "unchanged=true" >> "$GITHUB_OUTPUT"
            echo "Core Learning inputs are unchanged; owner outcome experience was still rebuilt and reviewed."
            exit 0
          fi
          if [ "$code" -ne 0 ]; then
            exit "$code"
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "unchanged=false" >> "$GITHUB_OUTPUT"

      - name: Independent reviewer
        if: steps.build.outputs.skip != 'true' && steps.build.outputs.unchanged != 'true'
        run: node intelligence/learning/independent-learning-reviewer.mjs

      - name: Verify unchanged published core learning state
        if: steps.build.outputs.skip != 'true' && steps.build.outputs.unchanged == 'true'
        run: node intelligence/learning/independent-learning-reviewer.mjs --verify-current

      - name: Verify current learning state
        if: steps.build.outputs.skip != 'true' && steps.build.outputs.unchanged != 'true'
        shell: bash
        run: |
          set -euo pipefail
          node intelligence/learning/independent-learning-reviewer.mjs --verify-current
          node - <<'NODE'
          const fs = require('fs');
          const ctx = JSON.parse(fs.readFileSync('intelligence/learning-state/learning-context.json','utf8'));
          const ev = JSON.parse(fs.readFileSync('intelligence/learning-state/learning-eval.json','utf8'));
          const owner = JSON.parse(fs.readFileSync('intelligence/learning-state/owner-outcome-experience.json','utf8'));
          if (ev.status !== 'pass') throw new Error('Independent learning review status is not PASS');
          if (ctx.constraints?.executionAllowed !== false) throw new Error('Learning Loop enabled execution');
          if (ctx.constraints?.walletActionAllowed !== false) throw new Error('Learning Loop enabled wallet action');
          if (ctx.constraints?.autonomousPolicyMutationAllowed !== false) throw new Error('Learning Loop enabled autonomous policy mutation');
          if (ctx.operatingContract?.executionAuthority !== 'none') throw new Error('Learning Loop execution authority changed');
          if (owner.operatingContract?.executionAuthority !== 'none') throw new Error('Owner outcome experience execution authority changed');
          if (owner.operatingContract?.causalClaimAuthority !== 'none') throw new Error('Owner outcome experience causal authority changed');
          console.log('Decision Outcome Learning Loop PASS', {
            learningHash: ctx.integrity?.learningHash,
            decisions: ctx.summary?.decisionCount,
            settledOutcomes: ctx.summary?.settledOutcomeCount,
            lessons: ctx.summary?.lessonCount,
            ownerEconomicDecisions: owner.summary?.ownerEconomicDecisionCount,
            ownerReviewDue: owner.summary?.reviewDueCount,
            ownerLearnedLessons: owner.summary?.learnedLessonCount,
          });
          NODE
          git diff --check

      - name: Verify owner outcome experience
        if: steps.build.outputs.skip != 'true'
        run: node intelligence/learning/independent-owner-outcome-experience-reviewer.mjs

      - name: Suppress generatedAt-only owner outcome churn
        if: steps.build.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('fs');
          const { execFileSync } = require('child_process');
          const file = 'intelligence/learning-state/owner-outcome-experience.json';
          let previousText;
          try { previousText = execFileSync('git', ['show', `HEAD:${file}`], { encoding: 'utf8' }); }
          catch { console.log('No prior owner outcome state exists; first materialization will publish.'); process.exit(0); }
          const currentText = fs.readFileSync(file, 'utf8');
          const current = JSON.parse(currentText);
          const previous = JSON.parse(previousText);
          const stable = (v) => Array.isArray(v) ? v.map(stable) : (v && typeof v === 'object' ? Object.fromEntries(Object.keys(v).sort().map((k) => [k, stable(v[k])])) : v);
          const semantic = (x) => {
            const y = structuredClone(x);
            delete y.generatedAt;
            delete y.integrity;
            return JSON.stringify(stable(y));
          };
          if (semantic(current) === semantic(previous)) {
            fs.writeFileSync(file, previousText, 'utf8');
            console.log('Owner outcome semantics/source bindings unchanged; preserved prior bytes to avoid generatedAt-only commit noise.');
          } else {
            console.log('Owner outcome semantics or source bindings changed; publication remains eligible.');
          }
          NODE

      - name: Publish learning memory safely
        if: steps.build.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "The Holding Learning Loop"
          git config user.email "learning-loop@theholding.ai"
          git add intelligence/learning-state
          if git diff --cached --quiet; then
            echo "No learning-state change to publish."
            exit 0
          fi
          mapfile -t staged < <(git diff --cached --name-only)
          allowed=(
            intelligence/learning-state/case-lifecycle.json
            intelligence/learning-state/outcome-memory.json
            intelligence/learning-state/confidence-calibration.json
            intelligence/learning-state/learning-context.json
            intelligence/learning-state/learning-brief.md
            intelligence/learning-state/learning-eval.json
            intelligence/learning-state/owner-outcome-experience.json
          )
          for file in "${staged[@]}"; do
            ok=false
            for expected in "${allowed[@]}"; do [ "$file" = "$expected" ] && ok=true && break; done
            if [ "$ok" != true ]; then
              echo "Unexpected staged Learning file: $file"
              exit 1
            fi
          done
          git commit -m "intelligence: refresh decision outcome learning loop"

          for attempt in 1 2 3; do
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "Learning publish conflict; fail closed."
              exit 1
            fi

            # Rebase may have moved Brain/Stack/Decision/Review inputs. Verify the
            # exact committed outputs against the rebased canonical state; never
            # regenerate uncommitted bytes and then push a stale committed artifact.
            node intelligence/cognitive-release-guard.mjs
            node intelligence/learning/learning-release-guard.mjs
            node intelligence/learning/independent-learning-reviewer.mjs --verify-current
            node intelligence/learning/independent-owner-outcome-experience-reviewer.mjs

            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push attempt ${attempt} failed; retrying after fetch/rebase."
            sleep $((attempt * 2))
          done
          echo "Learning Loop could not publish after 3 attempts."
          exit 1

      - name: Learning Loop summary
        if: always()
        shell: bash
        run: |
          node - <<'NODE' >> "$GITHUB_STEP_SUMMARY"
          const fs = require('fs');
          console.log('# The Holding · Decision Outcome Learning Loop');
          console.log('');
          if ('${{ steps.build.outputs.skip }}' === 'true') {
            console.log('**Status:** SKIPPED SAFELY');
            console.log('');
            console.log('The current Cognitive Stack was not coherent/ready, so no learning memory was published.');
            process.exit(0);
          }
          const owner = fs.existsSync('intelligence/learning-state/owner-outcome-experience.json')
            ? JSON.parse(fs.readFileSync('intelligence/learning-state/owner-outcome-experience.json','utf8'))
            : null;
          const c = fs.existsSync('intelligence/learning-state/learning-context.json')
            ? JSON.parse(fs.readFileSync('intelligence/learning-state/learning-context.json','utf8'))
            : null;
          const e = fs.existsSync('intelligence/learning-state/learning-eval.json')
            ? JSON.parse(fs.readFileSync('intelligence/learning-state/learning-eval.json','utf8'))
            : null;
          console.log(`**Core status:** ${e?.status?.toUpperCase?.() ?? 'VERIFIED / UNCHANGED'}`);
          console.log(`**Owner decisions:** ${c?.summary?.decisionCount ?? 'n/a'}`);
          console.log(`**Core settled outcomes:** ${c?.summary?.settledOutcomeCount ?? 'n/a'}`);
          console.log(`**Core lessons:** ${c?.summary?.lessonCount ?? 'n/a'}`);
          console.log(`**Owner economic decisions:** ${owner?.summary?.ownerEconomicDecisionCount ?? 0}`);
          console.log(`**Owner outcome reviews due:** ${owner?.summary?.reviewDueCount ?? 0}`);
          console.log(`**Owner outcome reviews completed:** ${owner?.summary?.reviewedCount ?? 0}`);
          console.log(`**Owner lesson candidates:** ${owner?.summary?.lessonCandidateCount ?? 0}`);
          console.log(`**Owner learned associations:** ${owner?.summary?.learnedLessonCount ?? 0}`);
          console.log('**Execution authority:** `none`');
          NODE
