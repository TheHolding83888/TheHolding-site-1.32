name: "Validate Final Canonical Onchain Cohort"
# holding-workflow-definition-proof: intelligence/reliability/market-data-live-validator-workflow-definition-proof.mjs

on:
  pull_request:
    paths:
      - 'intelligence/market-data/onchain-price-source-registry-extensions.json'
      - 'intelligence/market-data/market-data-authority-policy.json'
      - 'intelligence/market-data/market-data-authority-materializer.mjs'
      - 'intelligence/market-data/market-data-authority-selector-validation.mjs'
      - 'intelligence/market-data/market-data-materializer-health-boundary-validation.mjs'
      - 'intelligence/reliability/market-data-live-evidence-proof.mjs'
      - 'intelligence/reliability/market-data-live-validator-workflow-definition-proof.mjs'
      - '.github/workflows/market-data-refresh.yml'
      - '.github/workflows/market-data-coingecko-daily.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout PR head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Validate deterministic authority and failback contracts
        run: |
          set -euo pipefail
          node --check intelligence/market-data/onchain-price-resolver.mjs
          node --check intelligence/market-data/market-data-authority-selector.mjs
          node --check intelligence/market-data/market-data-authority-materializer.mjs
          node --check intelligence/market-data/market-data-materializer-health-boundary-validation.mjs
          node --check intelligence/reliability/market-data-live-evidence-proof.mjs
          node intelligence/market-data/market-data-authority-selector-validation.mjs
          node intelligence/market-data/market-data-materializer-health-boundary-validation.mjs

      - name: Audit final-route live health across bounded public RPC attempts
        run: |
          set -euo pipefail
          node intelligence/reliability/market-data-live-evidence-proof.mjs final9
          git diff --check
