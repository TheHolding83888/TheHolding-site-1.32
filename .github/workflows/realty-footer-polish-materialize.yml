name: Realty footer polish materializer

on:
  push:
    branches:
      - feat/realty-footer-polish-20260831

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout task branch without external actions
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: feat/realty-footer-polish-20260831
        run: |
          set -euo pipefail
          git clone --no-tags --depth 1 --branch "$BRANCH" "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" repo

      - name: Apply bounded Realty polish
        working-directory: repo
        env:
          CSS_OVERRIDE_B64: 
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, os
          from pathlib import Path
          css_path = Path('realty/assets/realty.css')
          html_path = Path('realty/index.html')
          workflow_path = Path('.github/workflows/realty-footer-polish-materialize.yml')
          css = css_path.read_text()
          html = html_path.read_text()
          marker = '/* realty-footer-polish-v1 */'
          old_rev = '/realty/assets/realty.css?v=20260831m7'
          new_rev = '/realty/assets/realty.css?v=20260831m8'
          if marker in css:
              raise SystemExit('polish marker already present')
          if html.count(old_rev) != 1:
              raise SystemExit(f'expected exactly one CSS revision anchor, got {html.count(old_rev)}')
          override = base64.b64decode(os.environ['CSS_OVERRIDE_B64']).decode()
          css = css.rstrip() + '\n' + override.rstrip() + '\n'
          html = html.replace(old_rev, new_rev)
          if marker not in css or '.footer-links{display:none}' not in css:
              raise SystemExit('footer polish validation failed')
          if '.world-card .cta{margin-top:14px;margin-bottom:1px}' not in css:
              raise SystemExit('CTA spacing validation failed')
          if html.count(new_rev) != 1 or old_rev in html:
              raise SystemExit('CSS revision replacement failed')
          css_path.write_text(css)
          html_path.write_text(html)
          workflow_path.unlink()
          PY
          git diff --check
          git add -A
          mapfile -t files < <(git diff --cached --name-only | sort)
          printf 'Final staged files:\n%s\n' "${files[*]}"
          test "${#files[@]}" -eq 3
          test "${files[0]}" = ".github/workflows/realty-footer-polish-materialize.yml"
          test "${files[1]}" = "realty/assets/realty.css"
          test "${files[2]}" = "realty/index.html"

      - name: Commit clean two-file package
        working-directory: repo
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: feat/realty-footer-polish-20260831
        run: |
          set -euo pipefail
          git config user.name "The Holding Realty Materializer"
          git config user.email "realty-materializer@theholding.ai"
          git commit -m "Realty: refine world cards and institutional footer"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:"$BRANCH"
