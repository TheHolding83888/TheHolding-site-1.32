name: Realty footer polish materializer

on:
  push:
    branches:
      - feat/realty-footer-polish-20260831

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout task branch without external actions
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: feat/realty-footer-polish-20260831
        run: |
          set -euo pipefail
          git clone --no-tags --depth 1 --branch "$BRANCH" "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" repo

      - name: Apply bounded Realty polish
        working-directory: repo
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          css_path = Path('realty/assets/realty.css')
          html_path = Path('realty/index.html')
          workflow_path = Path('.github/workflows/realty-footer-polish-materialize.yml')

          css = css_path.read_text()
          html = html_path.read_text()

          marker = '/* realty-footer-polish-v1 */'
          if marker in css:
              raise SystemExit('polish marker already present')
          old_rev = '/realty/assets/realty.css?v=20260831m7'
          new_rev = '/realty/assets/realty.css?v=20260831m8'
          if html.count(old_rev) != 1:
              raise SystemExit(f'expected exactly one CSS revision anchor, got {html.count(old_rev)}')

          custom_mark = "%3Csvg%20xmlns%3D%27http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%27%20viewBox%3D%27100%20130%20440%20400%27%3E%3Cpath%20d%3D%27M%20125%20161%20L%20125%20167%20L%20130%20169%20L%20248%20171%20L%20504%20169%20L%20509%20168%20L%20511%20164%20L%20509%20160%20L%20375%20152%20L%20229%20153%20Z%27%2F%3E%3Cpath%20d%3D%27M%20125%20199%20L%20125%20216%20L%20131%20219%20L%20203%20222%20L%20393%20223%20L%20495%20220%20L%20509%20217%20L%20511%20209%20L%20510%20199%20L%20497%20195%20L%20377%20188%20L%20222%20189%20L%20138%20195%20Z%27%2F%3E%3Cpath%20d%3D%27M%20125%20258%20L%20125%20285%20L%20132%20290%20L%20284%20297%20L%20393%20296%20L%20498%20291%20L%20508%20288%20L%20511%20280%20L%20510%20258%20L%20505%20254%20L%20412%20243%20L%20332%20240%20L%20233%20242%20L%20134%20253%20Z%27%2F%3E%3Cpath%20d%3D%27M%20125%20338%20L%20125%20375%20L%20131%20381%20L%20138%20383%20L%20251%20390%20L%20351%20391%20L%20498%20383%20L%20506%20380%20L%20510%20375%20L%20511%20341%20L%20506%20333%20L%20479%20326%20L%20406%20317%20L%20359%20314%20L%20248%20315%20L%20155%20326%20L%20134%20331%20Z%27%2F%3E%3Cpath%20d%3D%27M%20125%20438%20L%20125%20485%20L%20130%20492%20L%20137%20495%20L%20190%20500%20L%20444%20500%20L%20498%20495%20L%20508%20489%20L%20511%20481%20L%20511%20443%20L%20506%20432%20L%20477%20423%20L%20415%20413%20L%20351%20408%20L%20276%20408%20L%20232%20411%20L%20149%20425%20L%20131%20431%20Z%27%2F%3E%3C%2Fsvg%3E"
          envelope = "%3Csvg%20xmlns%3D%27http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%27%20viewBox%3D%270%200%2024%2024%27%3E%3Cpath%20fill%3D%27none%27%20stroke%3D%27black%27%20stroke-width%3D%271.7%27%20stroke-linecap%3D%27round%27%20stroke-linejoin%3D%27round%27%20d%3D%27M3.5%206.5h17v11h-17zM4%207l8%206%208-6%27%2F%3E%3C%2Fsvg%3E"

          override = f'''\n{marker}
@media(min-width:761px){{
  .world-copy{{padding-bottom:22px}}
  .world-card h2{{min-height:30px}}
  .world-card .cta{{margin-top:14px;margin-bottom:1px}}
}}
.footer{{padding:28px 6px 10px}}
.footer-main{{display:grid;grid-template-columns:minmax(260px,1fr) auto;align-items:center;gap:30px}}
.footer-links{{display:none}}
.footer-brand{{display:flex;align-items:baseline;gap:10px;min-width:0;white-space:nowrap}}
.footer strong{{font-size:23px;line-height:1;letter-spacing:.16em;color:#ece9e2;font-weight:500}}
.footer-dot{{font-family:var(--serif);font-size:19px;line-height:1;color:var(--gold)}}
.footer-realty{{font-family:var(--serif);font-size:22px;line-height:1;letter-spacing:.055em;color:#d5d1c9;font-weight:500}}
.footer-connect{{display:flex;align-items:center;justify-content:flex-end;gap:20px;color:#f4f2ed}}
.footer-connect a{{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;min-height:0;padding:0;border:0;border-radius:0;background:transparent;color:inherit;opacity:.88;transition:opacity .2s ease,transform .2s ease}}
.footer-connect a:hover{{border:0;background:transparent;color:inherit;opacity:1;transform:translateY(-1px)}}
.footer-x{{order:1}}
.footer-x span{{display:none}}
.footer-x svg{{width:18px;height:18px;fill:currentColor}}
.footer-connect::before{{content:'';order:2;width:24px;height:24px;display:block;background:currentColor;-webkit-mask:url("data:image/svg+xml,{custom_mark}") center/contain no-repeat;mask:url("data:image/svg+xml,{custom_mark}") center/contain no-repeat;opacity:.9;pointer-events:none}}
.footer-consult{{order:3;font-size:0}}
.footer-consult>span{{display:none}}
.footer-consult::before{{content:'';width:22px;height:22px;display:block;background:currentColor;-webkit-mask:url("data:image/svg+xml,{envelope}") center/contain no-repeat;mask:url("data:image/svg+xml,{envelope}") center/contain no-repeat}}
.footer-note{{margin-top:17px;padding-top:13px}}
[data-theme='light'] .footer strong{{color:#20201f}}
[data-theme='light'] .footer-realty{{color:#3f3c37}}
[data-theme='light'] .footer-connect{{color:#171717}}
@media(max-width:760px){{
  .world-card h2,.world-card.digital h2{{min-height:0}}
  .footer{{margin-top:14px;padding:25px 8px 12px}}
  .footer-main{{display:flex;flex-direction:column;align-items:center;gap:15px}}
  .footer-brand{{align-items:baseline;justify-content:center;gap:9px}}
  .footer strong{{font-size:22px;letter-spacing:.165em;color:#20201f}}
  .footer-dot{{font-size:18px}}
  .footer-realty{{font-size:21px;letter-spacing:.045em;color:#3f3c37}}
  .footer-connect{{justify-content:center;gap:22px;color:#171717}}
  .footer-connect a{{width:29px;height:29px}}
  .footer-x svg{{width:18px;height:18px}}
  .footer-connect::before{{width:24px;height:24px}}
  .footer-consult::before{{width:22px;height:22px}}
  .footer-note{{max-width:320px;margin:14px auto 0;padding-top:12px}}
}}
'''

          css = css.rstrip() + override + '\n'
          html = html.replace(old_rev, new_rev)

          required = [
              marker,
              '.footer-links{display:none}',
              '.world-card .cta{margin-top:14px;margin-bottom:1px}',
              'data:image/svg+xml,' + custom_mark,
              'data:image/svg+xml,' + envelope,
          ]
          for token in required:
              if token not in css:
                  raise SystemExit(f'missing required token: {token[:80]}')
          if html.count(new_rev) != 1 or old_rev in html:
              raise SystemExit('CSS revision replacement failed')

          css_path.write_text(css)
          html_path.write_text(html)
          workflow_path.unlink()
          PY

          git diff --check
          git add -A
          mapfile -t files < <(git diff --cached --name-only | sort)
          printf 'Final staged files:\n%s\n' "${files[*]}"
          test "${#files[@]}" -eq 2
          test "${files[0]}" = "realty/assets/realty.css"
          test "${files[1]}" = "realty/index.html"

      - name: Commit clean two-file package
        working-directory: repo
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: feat/realty-footer-polish-20260831
        run: |
          set -euo pipefail
          git config user.name "The Holding Realty Materializer"
          git config user.email "realty-materializer@theholding.ai"
          git commit -m "Realty: refine world cards and institutional footer"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:"$BRANCH"
