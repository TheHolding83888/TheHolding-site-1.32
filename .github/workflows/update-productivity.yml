name: Update The Holding Productivity Data

on:
  workflow_dispatch:
  schedule:
    # One synchronized The Holding snapshot per week.
    # Sunday 04:17 UTC avoids common top-of-hour cron congestion.
    - cron: '17 4 * * 0'
  workflow_run:
    workflows:
      - "Update Company #010 · Cypher Production State"
    types: [completed]

permissions:
  contents: write

concurrency:
  group: productivity-weekly
  cancel-in-progress: false

jobs:
  update-productivity:
    if: >-
      ${{
        github.event_name != 'workflow_run' ||
        (github.event.workflow_run.conclusion == 'success' &&
         github.event.workflow_run.head_branch == 'main')
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Install collector dependencies
        working-directory: productivity
        run: npm install --no-audit --no-fund

      - name: Install Chromium
        working-directory: productivity
        run: npx playwright install --with-deps chromium

      - name: Update protocol APRs and established company Productivity
        working-directory: productivity
        env:
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
          ETH_RPC_URL: ${{ secrets.ETH_RPC_URL }}
          BASE_RPC_URL: ${{ secrets.BASE_RPC_URL }}
          GITHUB_TOKEN: ${{ github.token }}
          PAGE_FILE: ../companies/index.html
          DATA_FILE: ../companies/productivity-data.json
          REPORT_FILE: ../companies/productivity-source-report.json
        run: npm run update

      - name: Admit Company #010 Cypher from canonical state
        run: |
          set -euo pipefail
          node --check productivity/company-010-productivity-overlay.mjs
          node productivity/company-010-productivity-overlay.mjs
          node - <<'NODE'
          const fs=require('fs');
          const d=JSON.parse(fs.readFileSync('companies/productivity-data.json','utf8'));
          const c=d.companies?.Cypher;
          if(d.version!=='1.16'||d.collectorVersion!=='1.16-company-010-state-backed-productivity-admission')throw new Error('Productivity v1.16 compatibility contract not produced');
          if(d.diagnostics?.company010?.capability!=='crv-strategy-intelligence-0.1')throw new Error('CRV Productivity capability marker missing');
          if(!c||!(Number(c.productiveValue)>0)||!(Number(c.coveredProductiveValue)>0))throw new Error('Cypher Productivity missing');
          if(!(Number(c.coverage)>0&&Number(c.coverage)<=1))throw new Error('Cypher coverage invalid');
          const byId=new Map((c.breakdown||[]).map(x=>[x.engineId,x]));
          for(const id of ['concentrator_asdcrv','convex_staked_cvxcrv'])if(!byId.has(id))throw new Error('CRV strategy Productivity row missing: '+id);
          if((c.breakdown||[]).some(x=>x.apr===0&&['projectx_hype','concentrator_asdcrv','convex_staked_cvxcrv'].includes(x.engineId)&&x.engineStatus==='warming'))throw new Error('unknown Cypher APR collapsed to zero');
          console.log('Productivity v1.16 + CRV intelligence PASS',{aprLatest:c.aprLatest,productiveValue:c.productiveValue,covered:c.coveredProductiveValue,coverage:c.coverage,concentrator:byId.get('concentrator_asdcrv'),convex:byId.get('convex_staked_cvxcrv')});
          NODE

      - name: Commit new snapshot
        run: |
          git config user.name "The Holding Data Engine"
          git config user.email "data-engine@theholding.ai"
          git add companies/productivity-data.json companies/productivity-source-report.json
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "data: update weekly productivity snapshot"
            for attempt in 1 2 3; do
              git fetch origin main
              if ! git rebase origin/main; then
                git rebase --abort || true
                echo "Safe writer guard: rebase conflict; refusing to guess."
                exit 1
              fi
              node productivity/company-010-productivity-overlay.mjs
              git add companies/productivity-data.json companies/productivity-source-report.json
              git commit --amend --no-edit
              if git push origin HEAD:main; then
                exit 0
              fi
              echo "Safe writer guard: main moved during push; retrying ($attempt/3)..."
              sleep $((attempt * 2))
            done
            echo "Safe writer guard: push failed after 3 attempts."
            exit 1
          fi