name: Update The Holding Productivity Data

on:
  workflow_dispatch:
  schedule:
    # One synchronized The Holding snapshot per week.
    # Sunday 04:17 UTC avoids common top-of-hour cron congestion.
    - cron: '17 4 * * 0'

permissions:
  contents: write

concurrency:
  group: productivity-weekly
  cancel-in-progress: false

jobs:
  update-productivity:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Install collector dependencies
        working-directory: productivity
        run: npm install --no-audit --no-fund

      - name: Install Chromium
        working-directory: productivity
        run: npx playwright install --with-deps chromium

      - name: Update protocol APRs and company Productivity
        working-directory: productivity
        env:
          # Optional. The engine also works with CoinGecko's public endpoint for
          # this tiny weekly load. Add a repository secret later if desired.
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
          ETH_RPC_URL: ${{ secrets.ETH_RPC_URL }}
          BASE_RPC_URL: ${{ secrets.BASE_RPC_URL }}
          # Built-in ephemeral token: raises official GitHub API rate limits for Pendle Merkle discovery.
          # The value stays in Actions secrets and is never written to public snapshots.
          GITHUB_TOKEN: ${{ github.token }}
          PAGE_FILE: ../companies/index.html
          DATA_FILE: ../companies/productivity-data.json
          REPORT_FILE: ../companies/productivity-source-report.json
        run: npm run update

      - name: Commit new snapshot
        run: |
          git config user.name "The Holding Data Engine"
          git config user.email "data-engine@theholding.ai"
          git add companies/productivity-data.json companies/productivity-source-report.json
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "data: update weekly productivity snapshot"
            for attempt in 1 2 3; do
              git fetch origin main
              if ! git rebase origin/main; then
                git rebase --abort || true
                echo "Safe writer guard: rebase conflict; refusing to guess."
                exit 1
              fi
              if git push origin HEAD:main; then
                exit 0
              fi
              echo "Safe writer guard: main moved during push; retrying ($attempt/3)..."
              sleep $((attempt * 2))
            done
            echo "Safe writer guard: push failed after 3 attempts."
            exit 1
          fi
