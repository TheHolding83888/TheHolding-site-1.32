name: Update The Holding Productivity Data

# Legacy bounded recovery path. Automatic capital refresh is owned by
# "The Holding Capital · Unified Refresh". Market prices remain owned by the
# shared Market Data layer even when this manual recovery path is used.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: productivity-weekly
  cancel-in-progress: false

jobs:
  update-productivity:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Install collector dependencies
        working-directory: productivity
        run: npm install --no-audit --no-fund

      - name: Install Chromium without apt mutation
        working-directory: productivity
        run: npx playwright install chromium

      - name: Require canonical shared Market Data
        run: |
          set -euo pipefail
          node --check intelligence/market-data/coingecko-fetch-shim.mjs
          node - <<'NODE'
          const fs=require('fs');
          const m=JSON.parse(fs.readFileSync('intelligence/market-data/market-data.json','utf8'));
          const prices=m.prices||{};
          if(m.semantics?.perAssetAuthoritySelectionApplied!==true)throw new Error('Productivity recovery refuses non-materialized Market Data');
          if(Object.keys(prices).length!==26||Number(m.authority?.onchainSelectedAssetCount)!==26)throw new Error('Productivity recovery requires 26/26 onchain-selected Market Data');
          for(const [id,row] of Object.entries(prices)){
            if(row?.authority?.selectedLane!=='onchain'||row?.authority?.fallbackUsed!==false||!String(row?.source||'').startsWith('onchain-'))throw new Error(`${id}: canonical onchain authority unavailable`);
          }
          console.log('Productivity recovery canonical Market Data PASS',{generatedAt:m.generatedAt,onchainSelectedAssetCount:m.authority.onchainSelectedAssetCount});
          NODE

      - name: Update protocol APRs and established company Productivity
        working-directory: productivity
        env:
          NODE_OPTIONS: --import=${{ github.workspace }}/intelligence/market-data/coingecko-fetch-shim.mjs
          ETH_RPC_URL: ${{ secrets.ETH_RPC_URL }}
          BASE_RPC_URL: ${{ secrets.BASE_RPC_URL }}
          GITHUB_TOKEN: ${{ github.token }}
          PAGE_FILE: ../companies/index.html
          DATA_FILE: ../companies/productivity-data.json
          REPORT_FILE: ../companies/productivity-source-report.json
        run: npm run update

      - name: Admit Company #010 Cypher from canonical state
        run: |
          set -euo pipefail
          node --check productivity/company-010-productivity-overlay.mjs
          node productivity/company-010-productivity-overlay.mjs
          node - <<'NODE'
          const fs=require('fs');
          const d=JSON.parse(fs.readFileSync('companies/productivity-data.json','utf8'));
          const c=d.companies?.Cypher;
          if(d.version!=='1.16'||d.collectorVersion!=='1.16-company-010-state-backed-productivity-admission')throw new Error('Productivity v1.16 compatibility contract not produced');
          if(d.diagnostics?.company010?.capability!=='crv-strategy-intelligence-0.1')throw new Error('CRV Productivity capability marker missing');
          if(!c||!(Number(c.productiveValue)>0)||!(Number(c.coveredProductiveValue)>0))throw new Error('Cypher Productivity missing');
          if(!(Number(c.coverage)>0&&Number(c.coverage)<=1))throw new Error('Cypher coverage invalid');
          NODE

      - name: Apply canonical YieldRing principal and relay state
        run: |
          set -euo pipefail
          node --check productivity/yieldring-productivity-overlay.mjs
          node productivity/yieldring-productivity-overlay.mjs
          node - <<'NODE'
          const fs=require('fs');
          const d=JSON.parse(fs.readFileSync('companies/productivity-data.json','utf8'));
          const s=JSON.parse(fs.readFileSync('companies/yieldring-canonical-state.json','utf8'));
          const c=d.companies?.['YieldRing.eth'];
          const aero=(c?.breakdown||[]).find(x=>x.engineId==='aerodrome_veaero'||x.principalId==='aerodrome-finance');
          if(d.version!=='1.16'||!c||Number(aero?.units)!==678)throw new Error('YieldRing canonical Productivity missing');
          if(Number(s.capital?.bitcoin?.quantity)!==0.0334||Number(s.capital?.aerodrome?.quantity)!==678)throw new Error('YieldRing canonical capital drift');
          if(d.diagnostics?.yieldRing?.executionAuthority!=='none')throw new Error('YieldRing authority drift');
          NODE

      - name: Rebuild public capital projection from shared prices
        run: |
          set -euo pipefail
          node --check intelligence/market-data/public-capital-engine.mjs
          node intelligence/market-data/public-capital-engine.mjs

      - name: Commit recovery snapshot safely
        run: |
          set -euo pipefail
          git config user.name "The Holding Data Engine"
          git config user.email "data-engine@theholding.ai"
          git add \
            companies/productivity-data.json \
            companies/productivity-source-report.json \
            intelligence/market-data/public-capital-state.json
          if git diff --cached --quiet; then echo "No data changes."; exit 0; fi
          git commit -m "data: update weekly productivity snapshot"
          for attempt in 1 2 3; do
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "Safe writer guard: rebase conflict; refusing to guess."
              exit 1
            fi
            node - <<'NODE'
            const fs=require('fs');
            const m=JSON.parse(fs.readFileSync('intelligence/market-data/market-data.json','utf8'));
            const prices=m.prices||{};
            if(m.semantics?.perAssetAuthoritySelectionApplied!==true||Object.keys(prices).length!==26||Number(m.authority?.onchainSelectedAssetCount)!==26)throw new Error('Canonical Market Data lost during Productivity recovery rebase');
            for(const [id,row] of Object.entries(prices))if(row?.authority?.selectedLane!=='onchain'||row?.authority?.fallbackUsed!==false)throw new Error(`${id}: onchain authority lost during Productivity recovery rebase`);
            NODE
            NODE_OPTIONS='--import=${{ github.workspace }}/intelligence/market-data/coingecko-fetch-shim.mjs' \
            ETH_RPC_URL='${{ secrets.ETH_RPC_URL }}' \
            BASE_RPC_URL='${{ secrets.BASE_RPC_URL }}' \
            GITHUB_TOKEN='${{ github.token }}' \
              npm --prefix productivity run update
            node productivity/company-010-productivity-overlay.mjs
            node productivity/yieldring-productivity-overlay.mjs
            node intelligence/market-data/public-capital-engine.mjs
            git add \
              companies/productivity-data.json \
              companies/productivity-source-report.json \
              intelligence/market-data/public-capital-state.json
            git commit --amend --no-edit
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1
