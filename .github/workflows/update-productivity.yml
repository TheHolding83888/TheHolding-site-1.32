# holding-workflow-definition-proof: intelligence/reliability/productivity-recovery-workflow-definition-proof.mjs
name: Update The Holding Productivity Data

# Legacy manual diagnostic replay. Production mutation is owned exclusively by
# "The Holding Capital · Unified Refresh", which already exposes workflow_dispatch.
# This workflow may rebuild the Productivity chain in its ephemeral checkout for
# validation, but it must never publish generated state back to the repository.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: productivity-weekly
  cancel-in-progress: false

jobs:
  update-productivity:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Install collector dependencies
        working-directory: productivity
        run: npm install --no-audit --no-fund

      - name: Install Chromium without apt mutation
        working-directory: productivity
        run: npx playwright install chromium

      - name: Require canonical shared Market Data
        run: |
          set -euo pipefail
          node --check intelligence/market-data/coingecko-fetch-shim.mjs
          node - <<'NODE'
          const fs=require('fs');
          const m=JSON.parse(fs.readFileSync('intelligence/market-data/market-data.json','utf8'));
          const prices=m.prices||{};
          if(m.semantics?.perAssetAuthoritySelectionApplied!==true)throw new Error('Productivity diagnostic refuses non-materialized Market Data');
          if(Object.keys(prices).length!==26||Number(m.authority?.onchainSelectedAssetCount)!==26)throw new Error('Productivity diagnostic requires 26/26 onchain-selected Market Data');
          for(const [id,row] of Object.entries(prices)){
            if(row?.authority?.selectedLane!=='onchain'||row?.authority?.fallbackUsed!==false||!String(row?.source||'').startsWith('onchain-'))throw new Error(`${id}: canonical onchain authority unavailable`);
          }
          console.log('Productivity diagnostic canonical Market Data PASS',{generatedAt:m.generatedAt,onchainSelectedAssetCount:m.authority.onchainSelectedAssetCount});
          NODE

      - name: Rebuild protocol APRs and established company Productivity ephemerally
        working-directory: productivity
        env:
          NODE_OPTIONS: --import=${{ github.workspace }}/intelligence/market-data/coingecko-fetch-shim.mjs
          ETH_RPC_URL: ${{ secrets.ETH_RPC_URL }}
          BASE_RPC_URL: ${{ secrets.BASE_RPC_URL }}
          GITHUB_TOKEN: ${{ github.token }}
          PAGE_FILE: ../companies/index.html
          DATA_FILE: ../companies/productivity-data.json
          REPORT_FILE: ../companies/productivity-source-report.json
        run: npm run update

      - name: Admit Company #010 Cypher from canonical state ephemerally
        run: |
          set -euo pipefail
          node --check productivity/company-010-productivity-overlay.mjs
          node productivity/company-010-productivity-overlay.mjs
          node - <<'NODE'
          const fs=require('fs');
          const d=JSON.parse(fs.readFileSync('companies/productivity-data.json','utf8'));
          const c=d.companies?.Cypher;
          if(d.version!=='1.16'||d.collectorVersion!=='1.16-company-010-state-backed-productivity-admission')throw new Error('Productivity v1.16 compatibility contract not produced');
          if(d.diagnostics?.company010?.capability!=='crv-strategy-intelligence-0.1')throw new Error('CRV Productivity capability marker missing');
          if(!c||!(Number(c.productiveValue)>0)||!(Number(c.coveredProductiveValue)>0))throw new Error('Cypher Productivity missing');
          if(!(Number(c.coverage)>0&&Number(c.coverage)<=1))throw new Error('Cypher coverage invalid');
          NODE

      - name: Apply canonical YieldRing principal and relay state ephemerally
        run: |
          set -euo pipefail
          node --check productivity/yieldring-productivity-overlay.mjs
          node productivity/yieldring-productivity-overlay.mjs
          node - <<'NODE'
          const fs=require('fs');
          const d=JSON.parse(fs.readFileSync('companies/productivity-data.json','utf8'));
          const s=JSON.parse(fs.readFileSync('companies/yieldring-canonical-state.json','utf8'));
          const c=d.companies?.['YieldRing.eth'];
          const aero=(c?.breakdown||[]).find(x=>x.engineId==='aerodrome_veaero'||x.principalId==='aerodrome-finance');
          if(d.version!=='1.16'||!c||Number(aero?.units)!==678)throw new Error('YieldRing canonical Productivity missing');
          if(Number(s.capital?.bitcoin?.quantity)!==0.0334||Number(s.capital?.aerodrome?.quantity)!==678)throw new Error('YieldRing canonical capital drift');
          if(d.diagnostics?.yieldRing?.executionAuthority!=='none')throw new Error('YieldRing authority drift');
          NODE

      - name: Apply VoteMarket supplementary income channels ephemerally
        run: |
          set -euo pipefail
          node --check productivity/votemarket-productivity-overlay.mjs
          node --check productivity/votemarket-productivity-overlay-validation.mjs
          node productivity/votemarket-productivity-overlay-validation.mjs
          node productivity/votemarket-productivity-overlay.mjs
          node - <<'NODE'
          const fs=require('fs');
          const d=JSON.parse(fs.readFileSync('companies/productivity-data.json','utf8'));
          const state=JSON.parse(fs.readFileSync('companies/votemarket-reference-state.json','utf8'));
          const diag=d.diagnostics?.voteMarketIncomeChannels;
          if(diag?.capitalDoubleCount!==false||diag?.idempotent!==true)throw new Error('VoteMarket capital/idempotency guard missing');
          if(diag?.earnedIncomeAuthority!==false||diag?.factualIncomeAuthority!==false||diag?.executionAuthority!=='none')throw new Error('VoteMarket authority boundary drift');
          if(diag?.claimedPeriodPersistencePending!==false||diag?.observationPersistence!=='claimed-aware-derived-cache')throw new Error('VoteMarket claimed-period persistence contract missing');
          if(state?.semantics?.sourceOfTruth!==false||state?.semantics?.factualIncomeAuthority!==false||state?.semantics?.executionAuthority!=='none')throw new Error('VoteMarket derived persistence cache authority drift');
          const c=d.companies?.['defitea.eth'];
          for(const id of ['curve_vecrv','fx_vefxn']){
            const row=(c?.breakdown||[]).find(x=>x.engineId===id);
            if(!row?.incomeChannels||row.incomeChannels.capitalAccounting!=='principal-counted-once'||row.incomeChannels.capitalDoubleCount!==false)throw new Error('Defitea VoteMarket hierarchy missing: '+id);
          }
          console.log('VoteMarket diagnostic overlay PASS',{measuredReferenceCompanyCount:diag.measuredReferenceCompanyCount,claimedPeriodPersistence:true,persistenceStateSourceOfTruth:false});
          NODE

      - name: Rebuild public capital projection from shared prices ephemerally
        run: |
          set -euo pipefail
          node --check intelligence/market-data/public-capital-engine.mjs
          node intelligence/market-data/public-capital-engine.mjs

      - name: Verify diagnostic replay without repository publication
        run: |
          set -euo pipefail
          test -s companies/productivity-data.json
          test -s companies/productivity-source-report.json
          test -s companies/votemarket-reference-state.json
          test -s intelligence/market-data/public-capital-state.json
          node - <<'NODE'
          const fs=require('fs');
          const d=JSON.parse(fs.readFileSync('companies/productivity-data.json','utf8'));
          const pub=JSON.parse(fs.readFileSync('intelligence/market-data/public-capital-state.json','utf8'));
          if(d.diagnostics?.voteMarketIncomeChannels?.executionAuthority!=='none')throw new Error('Productivity diagnostic authority drift');
          if(pub.authority?.executionAuthority!=='none')throw new Error('Public Capital diagnostic authority drift');
          console.log('Productivity read-only diagnostic replay PASS',{generatedAt:d.generatedAt,executionAuthority:'none',repositoryMutation:false});
          NODE
          git diff --check
