name: Update The Holding Productivity Data

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'companies/index.html'
      - 'companies/yieldring-canonical-state.json'
      - 'productivity/yieldring-productivity-overlay.mjs'
      - '.github/workflows/update-productivity.yml'
  schedule:
    - cron: '17 4 * * 0'
  workflow_run:
    workflows:
      - "Project YieldRing Canonical Capital State"
      - "Update Company #010 · Cypher Production State"
      - "Update Company #010 · Project X Reference APR"
    types: [completed]

permissions:
  contents: write

concurrency:
  group: productivity-weekly
  cancel-in-progress: false

jobs:
  update-productivity:
    if: >-
      ${{
        github.event_name != 'workflow_run' ||
        (github.event.workflow_run.conclusion == 'success' &&
         github.event.workflow_run.head_branch == 'main')
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Install collector dependencies
        working-directory: productivity
        run: npm install --no-audit --no-fund

      - name: Install Chromium
        working-directory: productivity
        run: npx playwright install --with-deps chromium

      - name: Update protocol APRs and established company Productivity
        working-directory: productivity
        env:
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
          ETH_RPC_URL: ${{ secrets.ETH_RPC_URL }}
          BASE_RPC_URL: ${{ secrets.BASE_RPC_URL }}
          GITHUB_TOKEN: ${{ github.token }}
          PAGE_FILE: ../companies/index.html
          DATA_FILE: ../companies/productivity-data.json
          REPORT_FILE: ../companies/productivity-source-report.json
        run: npm run update

      - name: Admit Company #010 Cypher from canonical state
        run: |
          set -euo pipefail
          node --check productivity/company-010-productivity-overlay.mjs
          node productivity/company-010-productivity-overlay.mjs
          node - <<'NODE'
          const fs=require('fs');
          const d=JSON.parse(fs.readFileSync('companies/productivity-data.json','utf8'));
          const c=d.companies?.Cypher;
          if(d.version!=='1.16'||d.collectorVersion!=='1.16-company-010-state-backed-productivity-admission')throw new Error('Productivity v1.16 compatibility contract not produced');
          if(d.diagnostics?.company010?.capability!=='crv-strategy-intelligence-0.1')throw new Error('CRV Productivity capability marker missing');
          if(!c||!(Number(c.productiveValue)>0)||!(Number(c.coveredProductiveValue)>0))throw new Error('Cypher Productivity missing');
          if(!(Number(c.coverage)>0&&Number(c.coverage)<=1))throw new Error('Cypher coverage invalid');
          const byId=new Map((c.breakdown||[]).map(x=>[x.engineId,x]));
          for(const id of ['concentrator_asdcrv','convex_staked_cvxcrv','projectx-whype-usdc'])if(!byId.has(id))throw new Error('Company #010 strategy Productivity row missing: '+id);
          const px=byId.get('projectx-whype-usdc');
          if(px.apr===0&&px.engineStatus==='warming')throw new Error('Project X unknown APR collapsed to zero');
          NODE

      - name: Apply canonical YieldRing principal and relay state
        run: |
          set -euo pipefail
          node --check productivity/yieldring-productivity-overlay.mjs
          node productivity/yieldring-productivity-overlay.mjs
          node - <<'NODE'
          const fs=require('fs');
          const d=JSON.parse(fs.readFileSync('companies/productivity-data.json','utf8'));
          const s=JSON.parse(fs.readFileSync('companies/yieldring-canonical-state.json','utf8'));
          const c=d.companies?.['YieldRing.eth'];
          const aero=(c?.breakdown||[]).find(x=>x.engineId==='aerodrome_veaero'||x.principalId==='aerodrome-finance');
          if(d.version!=='1.16')throw new Error('YieldRing overlay requires admitted Productivity v1.16');
          if(!c||Number(aero?.units)!==678)throw new Error('YieldRing canonical AERO principal missing');
          if(Number(s.capital?.bitcoin?.quantity)!==0.0334||Number(s.capital?.bitcoin?.costBasisUsd)!==2121.88)throw new Error('YieldRing BTC lot contract drift');
          if(Number(s.capital?.aerodrome?.costBasisUsd)!==274.464)throw new Error('YieldRing AERO basis contract drift');
          if(s.aerodromeRelay?.expectedUnderlyingLockCount!==2||s.aerodromeRelay?.rewardsPresentation!=='single-aggregated-aerodrome-line')throw new Error('YieldRing relay aggregation contract drift');
          if(d.diagnostics?.yieldRing?.executionAuthority!=='none')throw new Error('YieldRing authority drift');
          console.log('YieldRing canonical Productivity PASS',{aprLatest:c.aprLatest,productiveValue:c.productiveValue,aeroUnits:aero.units,relay:s.aerodromeRelay});
          NODE

      - name: Commit new snapshot
        run: |
          git config user.name "The Holding Data Engine"
          git config user.email "data-engine@theholding.ai"
          git add companies/productivity-data.json companies/productivity-source-report.json
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "data: update weekly productivity snapshot"
            for attempt in 1 2 3; do
              git fetch origin main
              if ! git rebase origin/main; then
                git rebase --abort || true
                echo "Safe writer guard: rebase conflict; refusing to guess."
                exit 1
              fi
              node productivity/company-010-productivity-overlay.mjs
              node productivity/yieldring-productivity-overlay.mjs
              git add companies/productivity-data.json companies/productivity-source-report.json
              git commit --amend --no-edit
              if git push origin HEAD:main; then exit 0; fi
              sleep $((attempt * 2))
            done
            exit 1
          fi
