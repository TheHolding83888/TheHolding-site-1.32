name: TEMP Medium Public Truth Patch

on:
  push:
    branches:
      - fix/medium-public-surface-truth-20260821

permissions:
  contents: write

jobs:
  patch:
    if: "!contains(github.event.head_commit.message, 'UI: align medium public truth surfaces')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: fix/medium-public-surface-truth-20260821

      - name: Apply fail-closed public truth patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          def read(path): return Path(path).read_text(encoding='utf-8')
          def write(path, text): Path(path).write_text(text, encoding='utf-8')
          def rep(text, old, new, label, mn=1, mx=None):
              n=text.count(old)
              if n<mn or (mx is not None and n>mx):
                  raise SystemExit(f'{label}: expected {mn}..{mx if mx is not None else "∞"}, got {n}')
              print(f'{label}: {n}')
              return text.replace(old,new)

          # Homepage: static/no-JS truth and copy coherence.
          p='index.html'; s=read(p)
          s=rep(s,'<meta name="description" content="Institutional-grade onchain fund ecosystem managing $20K+ across Bitcoin, Ethereum, precious metals, DeFi yield protocols, and venture positions. 100% transparent track record with 3+ years Bitcoin DCA and 13.9% realised cash-flow APR from the Defitea income layer.">','<meta name="description" content="A transparent onchain capital system spanning Bitcoin, Ethereum, precious metals, DeFi yield, stable-capital and venture strategies, with live market data, onchain measurement and operating history.">','home meta',1,1)
          s=rep(s,'<meta name="twitter:description" content="Institutional-grade onchain funds. 3+ years Bitcoin DCA, 13.9% Defitea cash-flow APR, 100% transparent. BTC/ETH/DeFi/Venture. Live TVL updates.">','<meta name="twitter:description" content="Onchain funds and companies measured through live capital, productivity, operating history and a shared intelligence layer.">','home twitter',1,1)
          s=rep(s,'<p>"No trading, no charts, no emotions. Eight DeFi protocols working in harmony, generating sustainable cash flow."</p>','<p>"No trading, no charts, no emotions. Eleven DeFi engines working in harmony, generating sustainable cash flow."</p>','defitea engines',1)
          s=rep(s,'<span class="ns-stat"><b>5</b> Companies</span>','<span class="ns-stat"><b>10</b> Companies</span>','network companies',1,1)
          s=rep(s,'<span class="ns-stat"><b>13</b> Protocols &amp; Assets</span>','<span class="ns-stat"><b>29</b> Protocols &amp; Assets</span>','network protocols',1,1)
          s=rep(s,'A growing registry of sovereign onchain companies — each with its own owner, treasury, keys and history.','A live network of sovereign onchain companies — independently owned and measured through capital, productivity, rewards and operating history.','network narrative',1,1)
          s=rep(s,'The Holding Index · Registry · Composite / TVL Views · Passports · Network Graph','The Holding Network · Index · Intelligence · Passports','network caps full',1,1)
          s=rep(s,'Index · Registry · Views · Passports · Graph','The Holding Network · Index · Intelligence · Passports','network caps short',1,1)
          s=rep(s,'''<div class="fund-metric">
                        <div class="fund-metric-label">Status</div>
                        <div class="fund-metric-value">Building</div>
                    </div>''','''<div class="fund-metric">
                        <div class="fund-metric-label">Reference APY</div>
                        <div class="fund-metric-value" data-th-fund="monetra" data-th-fund-metric="reference-apr" data-th-digits="2">—</div>
                    </div>''','home Monetra APY',1)
          s=rep(s,'Monetra is a building layer of The Holding.','Monetra is the live stable-capital layer of The Holding.','home Monetra copy',1)
          pat=re.compile(r'(<(?:div|span)[^>]*\bdata-tvl(?:-viz)?="[^"]+"[^>]*>)([^<]*)(</(?:div|span)>)')
          s,n=pat.subn(lambda m:m.group(1)+'—'+m.group(3),s)
          if n<8: raise SystemExit(f'home TVL fallbacks expected >=8, got {n}')
          print('home TVL fallbacks:',n)
          s=rep(s,'<div class="metric-value" data-metric="total-capital">$20,000</div>','<div class="metric-value" data-metric="total-capital">—</div>','home total fallback',1,1)
          pat=re.compile(r'(<(?:div|span)[^>]*data-th-company="defitea\.eth"[^>]*data-th-company-apr="latest"[^>]*>)([^<]*)(</(?:div|span)>)')
          s,n=pat.subn(lambda m:m.group(1)+'—'+m.group(3),s)
          if n<2: raise SystemExit(f'defitea APR fallbacks expected >=2, got {n}')
          print('defitea APR fallbacks:',n)
          write(p,s)

          # Substantia: no browser-now timestamp and no false CoinGecko label.
          p='substantia/index.html'; s=read(p)
          s=rep(s,'<div class="hero-stat-sub" data-tvl-updated="substantia">Live · CoinGecko</div>','<div class="hero-stat-sub" data-tvl-updated="substantia">Canonical Market Data</div>','substantia provenance',1,1)
          s=rep(s,'''const now = new Date();
                const stamp = now.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
                document.querySelectorAll('[data-tvl-updated="substantia"]').forEach(el => {
                    el.textContent = `Updated ${stamp} · CoinGecko`;
                });''','''document.querySelectorAll('[data-tvl-updated="substantia"]').forEach(el => {
                    if (!el.hasAttribute('data-th-market-data-provenance')) {
                        el.textContent = 'Canonical Market Data';
                    }
                });''','substantia local stamp',1,1)
          write(p,s)

          # Monetra: live source fallbacks + risk-aware bounded language.
          p='monetra/index.html'; s=read(p)
          replacements=[
          ('<meta name="description" content="Monetra is the stablecoin yield engine of TheHolding.ai. Non-directional stable yield from lending markets and stablecoin pools. Capital preservation, reliable cash flow, sustainable returns across all market conditions.">','<meta name="description" content="Monetra is the stable-capital yield engine of TheHolding.ai — lending and liquidity strategies built around USD-pegged assets, with live capital, Reference APY and stable-price risk tracking.">','meta',1,1),
          ('<meta property="og:description" content="The stable capital layer of TheHolding.ai. Sustainable yield from stablecoin lending and liquidity strategies. No directional risk. No speculation. Just consistent compounding.">','<meta property="og:description" content="The stable capital layer of TheHolding.ai: lending and liquidity strategies focused on USD-pegged assets, with live yield and stable-price risk tracking.">','og',1,1),
          ('<meta name="twitter:description" content="Non-directional stable yield. Lending markets, stablecoin pools, auto-compounding vaults. The liquidity layer of The Holding.">','<meta name="twitter:description" content="Stable-capital yield across lending markets, liquidity strategies and vaults — measured with live APY, capital and stable-price effects.">','twitter',1,1),
          ('<meta name="ai:description" content="Monetra generates non-directional yield from stablecoin lending markets, liquidity pools, and auto-compounding vaults. Part of TheHolding.ai five-fund architecture. No directional market risk.">','<meta name="ai:description" content="Monetra runs stable-capital lending, liquidity and vault strategies designed to reduce directional market exposure while retaining stablecoin, depeg, liquidity, protocol, oracle and smart-contract risk.">','ai',1,1),
          ('Non-directional stablecoin yield fund by TheHolding.ai. Generates sustainable yield from DeFi lending markets and stablecoin liquidity pools without directional market risk.','Stable-capital yield fund by TheHolding.ai. Uses DeFi lending and liquidity strategies designed to reduce directional market exposure while retaining stablecoin, depeg, liquidity, protocol, oracle and smart-contract risk.','financial descriptions',2,2),
          ('The stablecoin yield engine of TheHolding.ai. Non-directional stable yield from lending markets and liquidity pools.','The stable-capital yield engine of TheHolding.ai, built around USD-pegged lending and liquidity strategies with explicit risk measurement.','webpage description',1,1),
          ('''Every position is denominated in USD-pegged assets. Every yield 
                    is paid in stablecoins. The principal never takes directional risk.
                    This is a yield engine built for long-term compounding.''','''Strategies are centered on USD-pegged assets and stable-denominated cash flow.
                    The mandate is designed to reduce directional market exposure, while stablecoin,
                    depeg, liquidity, protocol, oracle and smart-contract risks remain part of the strategy.''','mandate',1,1),
          ('Monetra ensures that DCA never depends on selling other assets —\n                    stable yield provides a continuous funding stream for the accumulation engine.','Monetra is designed to help fund DCA without relying on selling other assets —\n                    stable-capital yield can provide a complementary funding stream for the accumulation engine.','DCA',1,1),
          ("Monetra's yield complements Defitea's revenue streams, helping maintain a strong cash-flow layer across all market conditions.","Monetra's yield complements Defitea's revenue streams, helping maintain a diversified cash-flow layer across different market regimes.",'regimes',1,1),
          ('They hold wallets, manage treasuries, pay for compute, API access, and transaction fees — all in real time, 24/7. As their role expands, they require yield that is stable, predictable, and non-custodial.','They hold wallets, manage treasuries, pay for compute, API access, and transaction fees — all in real time, 24/7. As their role expands, they benefit from yield that is stable-denominated, measurable and non-custodial.','agent needs',1,1),
          ('Monetra is structurally aligned with these needs: no direct exposure to market volatility, no unexpected lockups, and no directional market risk.','Monetra is structurally aligned with these needs: strategies are designed to limit direct directional exposure and favor liquid, non-custodial markets, while stablecoin, liquidity, protocol and smart-contract risks remain.','agent risks',1,1),
          ('Just consistent, compounding stable yield — a treasury layer designed for autonomous capital.','A measured stable-capital yield layer — designed for autonomous treasury operations.','agent layer',1,1),
          ('<div class="agent-card-title">Predictable Treasury Yield</div>','<div class="agent-card-title">Stable-Capital Treasury Yield</div>','agent title',1,1),
          ('<div class="agent-card-text">Unlike volatile assets, stablecoin yield is more predictable. Agents can forecast cash flows, plan rebalancing, and operate with greater budget certainty.</div>','<div class="agent-card-text">Compared with volatile assets, stablecoin strategies are designed for steadier cash-flow planning. Agents can model yields, plan rebalancing, and operate with greater budget visibility while accounting for protocol and stablecoin risk.</div>','agent card',1,1),
          ('The strategy is intentionally simple. No leverage. No directional exposure. No speculative bets.','The strategy is intentionally simple: no leverage by design, limited directional exposure, and no speculative trading mandate.','thesis simple',1,1),
          ('Monetra exists because The Holding requires a permanent cash-flow layer that operates independently of market direction.','Monetra exists because The Holding requires a durable cash-flow layer designed to operate with limited dependence on market direction.','thesis opening',1,1)]
          for old,new,label,mn,mx in replacements: s=rep(s,old,new,'Monetra '+label,mn,mx)
          s=rep(s,'''<div class="hero-stats">
                <div class="hero-stat">
                    <div class="hero-stat-value">Seeding</div>
                    <div class="hero-stat-label">Stage — Launching Soon</div>
                </div>
                <div class="hero-stat">
                    <div class="hero-stat-value">Stable</div>
                    <div class="hero-stat-label">Principal exposure</div>
                </div>
                <div class="hero-stat">
                    <div class="hero-stat-value">24/7</div>
                    <div class="hero-stat-label">Yield generation</div>
                </div>''','''<div class="hero-stats">
                <div class="hero-stat">
                    <div class="hero-stat-value" data-th-fund="monetra" data-th-fund-metric="tvl" data-th-digits="2">—</div>
                    <div class="hero-stat-label">Current Capital</div>
                </div>
                <div class="hero-stat">
                    <div class="hero-stat-value" data-th-fund="monetra" data-th-fund-metric="reference-apr" data-th-digits="2">—</div>
                    <div class="hero-stat-label">Reference APY</div>
                </div>
                <div class="hero-stat">
                    <div class="hero-stat-value">Live</div>
                    <div class="hero-stat-label">Stable Strategy Tracking</div>
                </div>''','Monetra hero',1,1)
          write(p,s)

          # Shared Public Capital client owns canonical Substantia observation stamp.
          p='intelligence/market-data/public-capital-client.js'; s=read(p)
          s=rep(s,' * The Holding · Public Capital Client v0.3.0',' * The Holding · Public Capital Client v0.3.1','client comment version',1,1)
          s=rep(s,"  const VERSION = '0.3.0';","  const VERSION = '0.3.1';",'client version',1,1)
          marker='  function applyHomepageNetwork(root, data) {'
          if s.count(marker)!=1: raise SystemExit('client insertion marker mismatch')
          fn='''  function applySubstantiaMarketDataProvenance(root, data) {
    const scope = root || document;
    if (!scope.querySelectorAll) return 0;
    const source = data && data.sourceState ? data.sourceState : {};
    const observedAt = source.marketDataObservedAt || source.marketDataGeneratedAt || null;
    const observed = observedAt ? new Date(observedAt) : null;
    const valid = observed && !Number.isNaN(observed.getTime());
    const stamp = valid ? observed.toLocaleTimeString('en-GB', { timeZone: 'UTC', hour: '2-digit', minute: '2-digit' }) + ' UTC' : null;
    const text = stamp ? 'Observed ' + stamp + ' · Market Data' : 'Canonical Market Data';
    let updated = 0;
    scope.querySelectorAll('[data-tvl-updated="substantia"]').forEach(function (el) {
      if (el.textContent !== text) { el.textContent = text; updated += 1; }
      el.setAttribute('data-th-market-data-provenance', 'canonical');
      el.title = 'Canonical Market Data observation; asset-level provenance is preserved upstream';
    });
    return updated;
  }

'''
          s=s.replace(marker,fn+marker)
          s=rep(s,'    updated += applyDefiteaCurrentTvl(root, data);\n    updated += applyHomepageNetwork(root, data);','    updated += applyDefiteaCurrentTvl(root, data);\n    updated += applySubstantiaMarketDataProvenance(root, data);\n    updated += applyHomepageNetwork(root, data);','client provenance call',1,1)
          write(p,s)

          # Final tree must not contain temporary execution files.
          for f in ['.github/workflows/temp-medium-public-truth-patch.yml','.github/temp-medium-trigger.txt']:
              q=Path(f)
              if q.exists(): q.unlink()
          PY

      - name: Verify and publish clean patch
        shell: bash
        run: |
          git config user.name "The Holding Medium Cleanup"
          git config user.email "medium-cleanup@theholding.ai"
          git add -A
          git diff --cached --check
          git diff --cached --stat
          git commit -m "UI: align medium public truth surfaces"
          git push origin HEAD:fix/medium-public-surface-truth-20260821
