name: Diagnose msUSD historical valuation

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'reporting/**'
      - '.github/workflows/diagnose-msusd-historical.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install validation dependency
        run: npm install --no-save --no-package-lock ethers@6
      - name: Stage 1 syntax
        run: |
          node --check reporting/historical-canonical-price.mjs
          node --check reporting/ve33-historical-valuation-identity.mjs
          node --check reporting/canonical-earned-income-view.mjs
          node --check reporting/income-ledger.mjs
          node --check reporting/historical-canonical-price-validation.mjs
      - name: Stage 2 historical price validation
        run: node reporting/historical-canonical-price-validation.mjs
      - name: Stage 3 income ledger validation
        run: node reporting/income-ledger-validation.mjs
      - name: Stage 4 ve33 validation
        run: node reporting/ve33-accounting-evidence-validation.mjs
