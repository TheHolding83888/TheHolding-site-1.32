name: "TEMP · Cypher vlCVX APR parity patch"

on:
  push:
    branches: ['agent/cypher-vlcvx-apr-badge']
    paths:
      - 'scripts/tmp-cypher-vlcvx-apr-patch.mjs'
      - '.github/workflows/tmp-cypher-vlcvx-apr-patch.yml'
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - 'scripts/tmp-cypher-vlcvx-apr-patch.mjs'
      - '.github/workflows/tmp-cypher-vlcvx-apr-patch.yml'
      - 'companies/company-010-public-adapter.js'
      - '.github/workflows/verify-company-010-public-admission.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: agent/cypher-vlcvx-apr-badge
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: node scripts/tmp-cypher-vlcvx-apr-patch.mjs
      - name: Verify exact mapping and verifier contract
        run: |
          set -euo pipefail
          grep -q "'convex-finance':'convex_vlcvx'" companies/company-010-public-adapter.js
          ! grep -q "hyperliquid'||pos.id==='convex-finance'||pos.id==='curve-dao-token" companies/company-010-public-adapter.js
          grep -q "Cypher vlCVX Productivity mapping missing" .github/workflows/verify-company-010-public-admission.yml
          node --check companies/company-010-public-adapter.js
      - name: Commit parity patch
        run: |
          set -euo pipefail
          if git diff --quiet -- companies/company-010-public-adapter.js .github/workflows/verify-company-010-public-admission.yml; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add companies/company-010-public-adapter.js .github/workflows/verify-company-010-public-admission.yml
          git commit -m "ui: show Cypher vlCVX Reference APR"
          git push origin HEAD:agent/cypher-vlcvx-apr-badge
