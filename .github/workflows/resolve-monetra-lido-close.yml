# THE HOLDING · MONETRA LIDO EARNUSD TARGETED CLOSE v0.7 · CAPITAL TRANSFER BASIS
name: "Resolve Monetra Lido Close"

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: resolve-monetra-lido-close
  cancel-in-progress: false

jobs:
  lido-close:
    runs-on: ubuntu-latest
    timeout-minutes: 18

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Minimal preflight
        shell: bash
        run: |
          set -euo pipefail
          test -s stable-capital/monetra-lido-entry-close.mjs
          test -s companies/company-008-strategy-entry-ledger.json
          node --check stable-capital/monetra-lido-entry-close.mjs
          node - <<'NODE'
          const fs=require('fs');
          const d=JSON.parse(fs.readFileSync('companies/company-008-strategy-entry-ledger.json','utf8'));
          if(!['0.4-monetra-strategy-entry-targeted-close','0.5-monetra-lido-share-oracle-close','0.6-monetra-lido-sync-deposit-close'].includes(d.version)){
            throw new Error('Unexpected input version: '+d.version);
          }
          if(d.company?.registry!=='008'||d.company?.name!=='Monetra.eth') throw new Error('Company #008 mismatch');
          if((d.strategies||[]).length!==10) throw new Error('Expected 10 strategies');
          console.log('Minimal preflight OK:',d.version);
          NODE

      - name: Install dependency
        run: npm install --no-save ethers@6

      - name: Resolve Lido from capital transfer + shares + oracle
        env:
          ETH_ARCHIVE_RPC_URL: ${{ secrets.ETH_ARCHIVE_RPC_URL }}
          ETH_RPC_URL: ${{ secrets.ETH_RPC_URL }}
          ETH_RPC_URL_2: ${{ secrets.ETH_RPC_URL_2 }}
        run: node stable-capital/monetra-lido-entry-close.mjs

      - name: Validate diagnostic or full closure
        shell: bash
        run: |
          set -euo pipefail
          FILE="companies/company-008-strategy-entry-ledger.json"
          node - <<'NODE'
          const fs=require('fs');
          const d=JSON.parse(fs.readFileSync('companies/company-008-strategy-entry-ledger.json','utf8'));
          if(d.version!=='0.7-monetra-lido-capital-transfer-close') throw new Error('Unexpected output version '+d.version);
          if(d.methodologyVersion!=='0.7-lido-capital-transfer-sharemanager-oracle') throw new Error('Unexpected methodology');
          if((d.strategies||[]).length!==10) throw new Error('Expected 10 strategies');

          const s=d.summary||{};
          const full =
            s.entryResolvedCount===10 &&
            s.currentNominalComparableCount===10 &&
            s.fullEntryReady===true &&
            s.fullPerformanceReady===true &&
            s.publicInvestedReady===true &&
            s.publicPerformanceReady===true &&
            Array.isArray(d.unresolved) &&
            d.unresolved.length===0;

          if(full){
            const lido=d.strategies.find(x=>x.protocol==='Lido Earn');
            if(!lido) throw new Error('Lido row missing');
            if(!(Number(lido.entry?.principalNominalStable)>9 && Number(lido.entry?.principalNominalStable)<11))
              throw new Error('Lido entry outside ~10 range');
            if(lido.current?.comparable!==true || lido.performance?.status!=='comparable')
              throw new Error('Lido not comparable');

            console.log('FULL 10/10 CLOSED');
            console.log('Invested:',s.strategyInvestedNominalStableTotal);
            console.log('Current:',s.strategyCurrentNominalStableTotal);
            console.log('Performance:',s.strategyPerformanceNominalStable,s.strategyPerformancePct+'%');
            console.log('Lido:',JSON.stringify(lido,null,2));
          } else {
            const unresolved=Array.isArray(d.unresolved)?d.unresolved:[];
            const onlyLido = unresolved.length<=1 &&
              unresolved.every(x=>x?.protocol==='Lido Earn' || String(x?.id||'').toLowerCase()==='ethereum:0x4ce1ac8f43e0e5bd7a346a98af777bf8fbea1981');
            if(!onlyLido) throw new Error('Unexpected non-Lido regression');
            if(s.publicInvestedReady===true || s.publicPerformanceReady===true)
              throw new Error('Partial result must remain fail-closed');
            console.log('DIAGNOSTIC GREEN — only Lido remains');
            console.log(JSON.stringify(d.lidoTargetedClose,null,2));
          }
          NODE

      - name: Publish v0.7 artifact
        shell: bash
        run: |
          set -euo pipefail
          FILE="companies/company-008-strategy-entry-ledger.json"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f "$FILE"

          if ! git diff --cached --quiet -- "$FILE"; then
            git commit -m "Close Monetra Lido from capital transfer"
          fi

          for attempt in 1 2 3; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then
              break
            fi
            git rebase --abort || true
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            sleep $((attempt*2))
          done

          git fetch origin main
          REMOTE_VERSION="$(git show origin/main:$FILE | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>console.log(JSON.parse(s).version))")"
          test "$REMOTE_VERSION" = "0.7-monetra-lido-capital-transfer-close"
          echo "Remote v0.7 verified."
