name: "The Holding · Guardian Binding Probe"

on:
  push:
    branches: [intelligence/claude-review-absorption-v1-20260814]
    paths:
      - '.github/workflows/claude-review-absorption-integrator.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout candidate branch
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: intelligence/claude-review-absorption-v1-20260814
          fetch-depth: 1
      - name: Measure exact Guardian workflow bytes
        shell: bash
        run: |
          set -euo pipefail
          printf 'GUARDIAN_WORKFLOW_SHA256='
          sha256sum .github/workflows/update-guardian-state.yml | awk '{print $1}'
          printf 'GUARDIAN_WORKFLOW_BYTES='
          wc -c < .github/workflows/update-guardian-state.yml
