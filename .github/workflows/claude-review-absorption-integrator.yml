name: "The Holding · Claude Review Absorption Integrator"

on:
  push:
    branches: [intelligence/claude-review-absorption-v1-20260814]
    paths:
      - 'verification/claude-review-absorption-integrator-v1.mjs'
      - '.github/workflows/claude-review-absorption-integrator.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: claude-review-absorption-integrator
  cancel-in-progress: false

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout integration branch
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: intelligence/claude-review-absorption-v1-20260814
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Correct verified live anchor and apply fail-closed integration
        shell: bash
        run: |
          set -euo pipefail
          sed -i 's/rememberedCaseCount}` ,/rememberedCaseCount}`,/' verification/claude-review-absorption-integrator-v1.mjs
          node verification/claude-review-absorption-integrator-v1.mjs

      - name: Static validation
        shell: bash
        run: |
          set -euo pipefail
          node --check intelligence/learning/decision-learning-engine.mjs
          node --check intelligence/learning/decision-recorder.mjs
          node --check intelligence/learning/independent-learning-reviewer.mjs
          node --check intelligence/proposals/proposal-engine.mjs
          node --check intelligence/proposals/independent-proposal-reviewer.mjs
          node --check intelligence/proposals/proposal-decision-bridge.mjs
          node --check intelligence/proposals/independent-proposal-decision-reviewer.mjs
          node intelligence/cognitive-release-guard.mjs
          node intelligence/learning/learning-release-guard.mjs
          node intelligence/proposals/proposal-release-guard.mjs
          node intelligence/guardian/guardian-release-guard.mjs
          node intelligence/learning/decision-recorder.mjs --self-test
          git diff --check

      - name: Rebuild coherent cognitive packet locally for dry run
        shell: bash
        run: |
          set -euo pipefail
          node intelligence/brain-reasoning-engine.mjs
          node intelligence/brain-chatgpt-bridge.mjs --self-test
          node intelligence/brain-chatgpt-bridge.mjs
          node intelligence/brain-chatgpt-bridge.mjs --verify-current
          node intelligence/cognitive-stack-verifier.mjs
          node intelligence/cognitive-stack-verifier.mjs --verify-current

      - name: End-to-end deterministic dry run
        shell: bash
        run: |
          set -euo pipefail
          node intelligence/learning/decision-learning-engine.mjs
          node intelligence/learning/independent-learning-reviewer.mjs
          node intelligence/proposals/proposal-engine.mjs
          node intelligence/proposals/independent-proposal-reviewer.mjs
          node intelligence/proposals/proposal-decision-bridge.mjs
          node intelligence/proposals/independent-proposal-decision-reviewer.mjs
          node intelligence/builder/builder-engine.mjs
          node intelligence/builder/independent-builder-reviewer.mjs
          node intelligence/guardian/guardian-engine.mjs
          node intelligence/guardian/independent-guardian-reviewer.mjs
          node - <<'NODE'
          const fs = require('fs');
          const learning = JSON.parse(fs.readFileSync('intelligence/learning-state/learning-context.json','utf8'));
          const proposal = JSON.parse(fs.readFileSync('intelligence/proposals/proposal-queue.json','utf8'));
          const guardian = JSON.parse(fs.readFileSync('intelligence/guardian/guardian-state.json','utf8'));
          const observed = Number(learning.summary?.activeCaseCount ?? -1);
          const worthy = Number(learning.summary?.decisionWorthyActiveCaseCount ?? -1);
          const hygiene = Number(learning.summary?.dataHygieneActiveCaseCount ?? -1);
          if (observed < 0 || worthy < 0 || hygiene < 0 || worthy + hygiene !== observed) throw new Error('Learning eligibility counts invalid');
          if ((learning.activeCases ?? []).some(c => !['decision-worthy','data-hygiene'].includes(c.experienceEligibility))) throw new Error('Unclassified Learning case');
          if (proposal.summary?.observedActiveCaseCount !== observed) throw new Error('Proposal observed count mismatch');
          if (proposal.summary?.activeCaseCount !== worthy) throw new Error('Proposal decision-worthy count mismatch');
          if ((proposal.proposals ?? []).filter(p => !['REJECTED','SUPERSEDED','RELEASED'].includes(p.state)).some(p => {
            const c = (learning.activeCases ?? []).find(x => x.caseKey === p.source?.caseKey);
            return !c || c.experienceEligibility !== 'decision-worthy';
          })) throw new Error('Active Proposal escaped decision-worthy filter');
          if (guardian.summary?.sandboxBuildAuthorizedCount !== 0 || guardian.summary?.productionMutationAuthorizedCount !== 0) throw new Error('Guardian authority expanded');
          console.log('Experience quality dry-run PASS', { observed, decisionWorthy: worthy, dataHygiene: hygiene, activeProposals: proposal.summary?.activeProposalCount, guardian: guardian.summary });
          NODE

      - name: Restore generated and workflow-plane files before publish
        shell: bash
        run: |
          set -euo pipefail
          git restore \
            intelligence/brain-intelligence.json \
            intelligence/brain-history.json \
            intelligence/brain-brief.md \
            intelligence/brain-chatgpt-bridge.json \
            intelligence/brain-chatgpt-bridge.md \
            intelligence/brain-chatgpt-bridge-history.json \
            intelligence/brain-chatgpt-bridge-eval.json \
            intelligence/cognitive-stack-state.json \
            intelligence/cognitive-stack-brief.md \
            intelligence/cognitive-stack-eval.json \
            intelligence/learning-state \
            intelligence/proposals/proposal-queue.json \
            intelligence/proposals/proposal-brief.md \
            intelligence/proposals/proposal-eval.json \
            intelligence/proposals/proposal-decision-eval.json \
            intelligence/builder/candidate-queue.json \
            intelligence/builder/candidate-brief.md \
            intelligence/builder/candidate-eval.json \
            intelligence/guardian/guardian-state.json \
            intelligence/guardian/guardian-brief.md \
            intelligence/guardian/guardian-eval.json \
            .github/workflows/update-guardian-state.yml \
            intelligence/guardian/guardian-release.json
          git diff --check

      - name: Publish tested non-workflow candidate patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "The Holding Integration"
          git config user.email "integration@theholding.ai"
          git add \
            intelligence/learning/decision-policy.json \
            intelligence/learning/decision-learning-engine.mjs \
            intelligence/learning/decision-recorder.mjs \
            intelligence/learning/independent-learning-reviewer.mjs \
            intelligence/learning/learning-release.json \
            intelligence/proposals/proposal-engine.mjs \
            intelligence/proposals/independent-proposal-reviewer.mjs \
            intelligence/proposals/proposal-decision-bridge.mjs \
            intelligence/proposals/independent-proposal-decision-reviewer.mjs \
            intelligence/proposals/proposal-release.json
          test -n "$(git diff --cached --name-only)"
          git commit -m "intelligence: gate experience learning to real decisions"
          git push origin HEAD:intelligence/claude-review-absorption-v1-20260814
