name: "The Holding · Guardian Binding Probe"

on:
  push:
    branches: [intelligence/claude-review-absorption-v1-20260814]
    paths:
      - '.github/workflows/claude-review-absorption-integrator.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout candidate branch
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: intelligence/claude-review-absorption-v1-20260814
          fetch-depth: 1
      - name: Verify exact Guardian release binding
        shell: bash
        run: |
          set -euo pipefail
          node intelligence/guardian/guardian-release-guard.mjs
          git diff --check
