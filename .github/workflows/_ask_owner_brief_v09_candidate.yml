name: "Ask candidate · Owner Brief v0.9"

on:
  push:
    branches: [agents/ask-owner-brief-v0.9-20260815]
    paths:
      - '.github/workflows/_ask_owner_brief_v09_candidate.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout candidate
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: agents/ask-owner-brief-v0.9-20260815
          fetch-depth: 0

      - name: Apply bounded cross-source owner brief and self-clean
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "The Holding Production Integrator"
          git config user.email "production-integrator@theholding.ai"

          python - <<'PY'
          from pathlib import Path
          p = Path('verification/ask-experience/patch-owner-brief-v0.9.mjs')
          lines = p.read_text().splitlines()
          fixes = 0
          for i, line in enumerate(lines):
              if 'watch.forEach((x, i)' in line:
                  lines[i] = '''  "      watch.forEach((x, i) => lines.push((i + 1) + '. ' + String(x?.summary || 'Watch condition') + (x?.whyItMatters ? ' ' + String(x.whyItMatters) : '')));",'''
                  fixes += 1
              elif 'const secAt = Date.parse' in line:
                  lines[i] = '''  "    const secAt = Date.parse(sec?.generatedAt || '');",'''
                  fixes += 1
              elif 'const learningAt = Date.parse' in line:
                  lines[i] = '''  "    const learningAt = Date.parse(learning?.generatedAt || '');",'''
                  fixes += 1
              elif 'const proposalAt = Date.parse' in line:
                  lines[i] = '''  "    const proposalAt = Date.parse(proposals?.generatedAt || '');",'''
                  fixes += 1
          if fixes != 4:
              raise SystemExit(f'expected 4 quoting fixes, got {fixes}')
          p.write_text('\n'.join(lines) + '\n')
          PY

          node --check verification/ask-experience/patch-owner-brief-v0.9.mjs
          node verification/ask-experience/patch-owner-brief-v0.9.mjs
          node --check agents/console/app.js
          grep -F "securityIntelligence: '/security/security-intelligence.json'" agents/console/app.js >/dev/null
          grep -F "function ownerBriefAnswer" agents/console/app.js >/dev/null
          grep -F "counts must not be added as independent problems" agents/console/app.js >/dev/null
          grep -F "Что реально требует внимания?" agents/console/app.js >/dev/null
          rm -f verification/ask-experience/patch-owner-brief-v0.9.mjs
          rm -f .github/workflows/_ask_owner_brief_v09_candidate.yml
          git add -A
          git diff --check --cached
          expected=$'.github/workflows/_ask_owner_brief_v09_candidate.yml\nagents/console/app.js\nverification/ask-experience/patch-owner-brief-v0.9.mjs'
          actual="$(git diff --cached --name-only | sort)"
          test "$actual" = "$expected"
          git commit -m "Ask v0.9: add cross-source owner brief"
          git push origin HEAD:agents/ask-owner-brief-v0.9-20260815
