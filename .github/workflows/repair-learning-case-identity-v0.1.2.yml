name: "The Holding Brain · Repair Learning Case Identity v0.1.2"

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repair-learning-case-identity-v0.1.2.yml'
      - 'intelligence/learning/repair-case-identity-v0.1.2.mjs'

permissions:
  contents: write

concurrency:
  group: learning-case-identity-repair-main
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout exact repair trigger
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Apply fail-closed collision-safe case identity repair
        shell: bash
        run: |
          set -euo pipefail
          node --check intelligence/learning/repair-case-identity-v0.1.2.mjs
          node intelligence/learning/repair-case-identity-v0.1.2.mjs

      - name: Validate repaired static Learning release
        shell: bash
        run: |
          set -euo pipefail
          node --check intelligence/learning/decision-recorder.mjs
          node --check intelligence/learning/decision-learning-engine.mjs
          node --check intelligence/learning/independent-learning-reviewer.mjs
          node intelligence/learning/decision-recorder.mjs --self-test
          node intelligence/learning/independent-learning-reviewer.mjs --self-test
          node intelligence/learning/learning-release-guard.mjs
          git diff --check

      - name: Production-shape Learning proof without publishing generated state
        shell: bash
        run: |
          set -euo pipefail
          set +e
          node intelligence/learning/decision-learning-engine.mjs
          code=$?
          set -e
          if [ "$code" -ne 0 ] && [ "$code" -ne 4 ]; then
            echo "Repaired Learning engine failed production-shape proof with exit ${code}."
            exit "$code"
          fi
          node intelligence/learning/independent-learning-reviewer.mjs
          node - <<'NODE'
          const fs=require('fs');
          const c=JSON.parse(fs.readFileSync('intelligence/learning-state/learning-context.json','utf8'));
          const e=JSON.parse(fs.readFileSync('intelligence/learning-state/learning-eval.json','utf8'));
          const ledger=JSON.parse(fs.readFileSync('intelligence/learning/decision-ledger.json','utf8'));
          if(e.status!=='pass') throw new Error('Independent Learning reviewer did not PASS');
          if(c.summary?.activeCaseCount !== 20) throw new Error(`Expected 20 active Brain cases in repair proof, got ${c.summary?.activeCaseCount}`);
          if(c.summary?.decisionCount !== ledger.decisionCount || ledger.decisionCount !== 2) throw new Error('Two real owner decisions were not preserved');
          const keys=new Set((c.activeCases??[]).map(x=>x.caseKey));
          for(const key of ['CK-106f8e0ade4286d3d496','CK-8793263ff6a84dddf9f1']) {
            if(!keys.has(key)) throw new Error(`Existing owner-decision stable caseKey disappeared: ${key}`);
          }
          console.log('Learning v0.1.2 production-shape proof PASS',{
            activeCases:c.summary.activeCaseCount,
            rememberedCases:c.summary.rememberedCaseCount,
            decisions:c.summary.decisionCount,
            uniqueActiveCaseKeys:keys.size,
            reviewer:e.status,
            executionAuthority:c.operatingContract?.executionAuthority
          });
          NODE

          # This repair commit changes static Learning code/release only. Fresh
          # generated Learning memory will be produced by the normal canonical
          # workflow after the repair is on remote main.
          git restore intelligence/learning-state
          git diff --check

      - name: Publish repaired Learning static release safely
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "The Holding Learning Repair"
          git config user.email "learning-repair@theholding.ai"

          STATIC=(
            "intelligence/learning/decision-recorder.mjs"
            "intelligence/learning/decision-learning-engine.mjs"
            "intelligence/learning/independent-learning-reviewer.mjs"
            "intelligence/learning/decision-policy.json"
            "intelligence/learning/learning-release.json"
          )

          git add "${STATIC[@]}"
          staged="$(git diff --cached --name-only)"
          bad="$(printf '%s\n' "$staged" | grep -Ev '^intelligence/learning/(decision-recorder\.mjs|decision-learning-engine\.mjs|independent-learning-reviewer\.mjs|decision-policy\.json|learning-release\.json)$' || true)"
          if [ -n "$bad" ]; then
            echo "Repair attempted to stage files outside the exact static boundary:"
            echo "$bad"
            exit 1
          fi
          test -n "$staged"
          git commit -m "learning: repair event case identity collisions v0.1.2"

          for attempt in 1 2 3; do
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "Learning repair rebase conflict; fail closed."
              exit 1
            fi

            node intelligence/learning/learning-release-guard.mjs
            node --check intelligence/learning/decision-recorder.mjs
            node --check intelligence/learning/decision-learning-engine.mjs
            node --check intelligence/learning/independent-learning-reviewer.mjs
            node intelligence/learning/decision-recorder.mjs --self-test
            node intelligence/learning/independent-learning-reviewer.mjs --self-test
            git diff --check

            if git push origin HEAD:main; then
              git fetch origin main
              test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
              echo "Verified collision-safe Learning static release on remote main."
              exit 0
            fi
            echo "Main moved during repair publish; retrying ($attempt/3)..."
          done

          echo "Unable to publish Learning repair after retries."
          exit 1
