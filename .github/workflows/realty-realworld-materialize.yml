name: Realty Real World owner media materializer

on:
  push:
    branches:
      - feat/realty-realworld-owner-media-20260831
    paths:
      - '.asset-realworld/**'
      - '.github/workflows/realty-realworld-materialize.yml'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild and verify owner Real World media
        shell: bash
        run: |
          set -euo pipefail
          target='realty/assets/owner/real-world.112e8e81.avif'
          mkdir -p "$(dirname "$target")"
          cat .asset-realworld/part-*.b64 > /tmp/realworld.b64
          test "$(wc -c < /tmp/realworld.b64 | tr -d ' ')" = '22560'
          base64 --decode /tmp/realworld.b64 > "$target"
          test "$(wc -c < "$target" | tr -d ' ')" = '16918'
          test "$(sha256sum "$target" | awk '{print $1}')" = '112e8e818b24f71a2b9a699d2b11c79b5384f449744b7f70bb142c1169fd7cdd'
          magic="$(dd if="$target" bs=1 skip=4 count=8 status=none)"
          test "$magic" = 'ftypavif'
          python - <<'PY'
          from pathlib import Path
          import struct
          p=Path('realty/assets/owner/real-world.112e8e81.avif')
          b=p.read_bytes()
          i=b.find(b'ispe')
          if i < 0:
              raise SystemExit('missing ispe')
          w,h=struct.unpack('>II', b[i+8:i+16])
          if (w,h)!=(1000,574):
              raise SystemExit(f'bad dimensions {(w,h)}')
          print('verified', len(b), (w,h))
          PY

      - name: Update desktop Real World consumer only
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('realty/index.html')
          s=p.read_text()
          old='src="/realty/assets/demo/v35/desktop-physical.avif?v=20260831" alt="" loading="eager" decoding="async"'
          new='src="/realty/assets/owner/real-world.112e8e81.avif" alt="" loading="eager" decoding="async"'
          if s.count(old)!=1:
              raise SystemExit(f'Real World desktop anchor count {s.count(old)}')
          s=s.replace(old,new)
          p.write_text(s)
          PY
          git diff --check
          changed="$( { git diff --name-only; git ls-files --others --exclude-standard; } | sort -u | tr '\n' ' ' )"
          test "$changed" = 'realty/assets/owner/real-world.112e8e81.avif realty/index.html '

      - name: Commit verified Real World media
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add realty/assets/owner/real-world.112e8e81.avif realty/index.html
          git commit -m 'Realty: add owner Real World media'
          git push origin HEAD:feat/realty-realworld-owner-media-20260831
