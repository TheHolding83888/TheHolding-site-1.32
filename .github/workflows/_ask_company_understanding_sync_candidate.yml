name: Ask candidate · Company Understanding Main Sync

on:
  push:
    branches:
      - agents/ask-company-understanding-v1.1-20260815
    paths:
      - .github/workflows/_ask_company_understanding_sync_candidate.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: agents/ask-company-understanding-v1.1-20260815
          fetch-depth: 0
      - name: Merge fresh main and validate
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git config user.name 'The Holding Production Integrator'
          git config user.email 'production-integrator@theholding.ai'
          git merge --no-edit origin/main
          node --check agents/console/app.js
          node verification/ask-experience/quick-command-contract-v0.1.mjs
          git push origin HEAD:agents/ask-company-understanding-v1.1-20260815
