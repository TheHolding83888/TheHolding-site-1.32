name: Verify Reporting Layer

on:
  pull_request:
    paths:
      - 'reporting/reporting-engine.mjs'
      - 'reporting/reporting-engine-validation.mjs'
      - 'reporting/reporting-scheduler-contract.json'
      - 'reporting/reporting-scheduled-runner.mjs'
      - 'reporting/defitea-income-composition.mjs'
      - 'reporting/defitea-income-composition-validation.mjs'
      - 'reporting/defitea-forty-acres-settlement.mjs'
      - 'reporting/defitea-forty-acres-settlement-validation.mjs'
      - '.github/workflows/update-reporting.yml'
      - '.github/workflows/verify-reporting-layer.yml'
      - 'yield-reports/index.html'
      - 'intelligence/project-memory/THE_HOLDING_REPORTING_REFERENCE_MODEL_CANON_2026-08-22.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: Static and semantic validation
        run: |
          set -euo pipefail
          node --check reporting/reporting-engine.mjs
          node --check reporting/reporting-scheduled-runner.mjs
          node --check reporting/reporting-engine-validation.mjs
          node --check reporting/defitea-income-composition.mjs
          node --check reporting/defitea-income-composition-validation.mjs
          node --check reporting/defitea-forty-acres-settlement.mjs
          node --check reporting/defitea-forty-acres-settlement-validation.mjs
          test -s reporting/reporting-scheduler-contract.json
          node reporting/reporting-scheduled-runner.mjs --validate-contract
          REPORTING_VALIDATION_PRODUCTIVITY_FILE=/tmp/reporting-verifier-productivity.json node reporting/reporting-engine-validation.mjs
          test -s /tmp/reporting-verifier-productivity.json
          node reporting/defitea-income-composition-validation.mjs
          node reporting/defitea-forty-acres-settlement-validation.mjs
          git diff --check

      - name: Exercise full writer and income composition
        shell: bash
        run: |
          set -euo pipefail
          cp reporting/reporting-data.json /tmp/reporting-data.json
          rm -f /tmp/defitea-income-ledger.json
          DEFITEA_STATE_FILE=./companies/defitea-canonical-state.json \
          PRODUCTIVITY_DATA_FILE=/tmp/reporting-verifier-productivity.json \
          MARKET_DATA_FILE=./intelligence/market-data/market-data.json \
          REWARDS_DATA_FILE=./companies/rewards-data.json \
          STABLE_INDEX_DATA_FILE=./companies/stable-index-data.json \
          EMBEDDED_LEDGER_FILE=./companies/embedded-yield-ledger.json \
          REPORTING_DATA_FILE=/tmp/reporting-data.json \
          node reporting/reporting-scheduled-runner.mjs
          PRODUCTIVITY_DATA_FILE=./companies/productivity-data.json \
          REWARDS_DATA_FILE=./companies/rewards-data.json \
          REPORTING_DATA_FILE=/tmp/reporting-data.json \
          DEFITEA_INCOME_LEDGER_FILE=/tmp/defitea-income-ledger.json \
          node reporting/defitea-income-composition.mjs
          REWARDS_DATA_FILE=./companies/rewards-data.json \
          REPORTING_DATA_FILE=/tmp/reporting-data.json \
          DEFITEA_INCOME_LEDGER_FILE=/tmp/defitea-income-ledger.json \
          node reporting/defitea-forty-acres-settlement.mjs
          node - <<'NODE'
          const fs=require('fs');
          const r=JSON.parse(fs.readFileSync('/tmp/reporting-data.json','utf8'));
          const l=JSON.parse(fs.readFileSync('/tmp/defitea-income-ledger.json','utf8'));
          const schedule=JSON.parse(fs.readFileSync('reporting/reporting-scheduler-contract.json','utf8'));
          const fixture=JSON.parse(fs.readFileSync('/tmp/reporting-verifier-productivity.json','utf8'));
          const d=r.funds?.['defitea.eth'];
          if(r.version!=='1.2.0-defitea-canonical-market-data') throw new Error('version drift');
          if(r.schedule?.dailySnapshot!==schedule.dailySnapshotUtc||r.schedule?.cron!==schedule.cron||r.schedule?.contractVersion!==schedule.version||r.schedule?.contractSource!=='reporting/reporting-scheduler-contract.json') throw new Error('scheduler contract runtime binding failed');
          if(fixture.validationFixture?.validationOnly!==true||fixture.validationFixture?.productionAuthority!==false||fixture.validationFixture?.productionWriterMustUseLiveProductivity!==true) throw new Error('Reporting verification fixture provenance/authority missing');
          if(d?.latestSnapshot?.positionCount!==11||d?.latestSnapshot?.rateCoveredPositionCount!==11||d?.latestSnapshot?.coverage!==1) throw new Error('Defitea 11/11 runtime proof failed');
          if(d?.latestSnapshot?.priceAuthority!=='canonical-selected-market-data') throw new Error('canonical Market Data runtime binding failed');
          if(d?.vlCvxReconciliation?.claimableSettlementAddedToReferenceCashFlow!==false) throw new Error('vlCVX additive-double-count guard failed');
          if(d?.incomeComposition?.version!=='0.1-defitea-associated-income-plus-votemarket-events') throw new Error('income composition runtime proof failed');
          if(d?.incomeComposition?.associatedCompanyTvlIncluded!==false||d?.incomeComposition?.tvlSemantic!=='defitea-only') throw new Error('associated-company TVL boundary failed');
          if(l?.version!=='0.1-defitea-income-composition'||l?.accounting?.currentClaimableBalanceSummedDaily!==false) throw new Error('income ledger runtime contract failed');
          if((l?.contributorDaily||[]).filter(x=>x.date===d.latestSnapshot.date).length!==2) throw new Error('both associated-company daily contributors not materialized');
          if((l?.contributors||[]).some(x=>x.includedInDefiteaTvl!==false)) throw new Error('contributor TVL exclusion runtime proof failed');
          const vm=l?.voteMarketEvents||[];
          if(new Set(vm.map(x=>x.eventKey)).size!==vm.length) throw new Error('VoteMarket event dedupe runtime proof failed');
          if(vm.some(x=>x.eventDate<d.trackingStartedAt||!(Number(x.usdValue)>0))) throw new Error('VoteMarket event admission runtime proof failed');
          const fa=l?.fortyAcresReceivedEvents||[];
          if(fa.length<1) throw new Error('40 Acres Received events not materialized');
          if(new Set(fa.map(x=>x.eventKey)).size!==fa.length) throw new Error('40 Acres Received event dedupe runtime proof failed');
          if(fa.some(x=>x.eventDate<'2026-08-01'||!(Number(x.usdValue)>0)||x.executionAuthority!=='none')) throw new Error('40 Acres Received event admission runtime proof failed');
          if(d?.fortyAcresSettlement?.accounting!=='actual-net-received-replaces-velodrome-reference-model'||d?.fortyAcresSettlement?.referenceDoubleCountPrevented!==true) throw new Error('40 Acres replacement runtime proof failed');
          if(d?.fortyAcresSettlement?.claimableAffected!==false||d?.fortyAcresSettlement?.tvlAffected!==false) throw new Error('40 Acres accounting boundary failed');
          const current=d.months?.[d.latestSnapshot.date.slice(0,7)];
          if(current?.mode==='reference-model'){
            const expected=Number(current.baseDefiteaReferenceCashFlowUsd||0)-Number(current.fortyAcresReplacedReferenceCashFlowUsd||0)+Number(current.associatedCompanyReferenceCashFlowUsd||0)+Number(current.voteMarketObservedIncomeUsd||0)+Number(current.fortyAcresReceivedIncomeUsd||0);
            if(Math.abs(Number(current.cashFlowUsd)-expected)>0.011) throw new Error('unified 40 Acres replacement arithmetic runtime proof failed');
            if(!(Number(current.fortyAcresReceivedIncomeUsd)>0)||!(Number(current.fortyAcresReplacedReferenceCashFlowUsd)>0)) throw new Error('40 Acres Received/replacement values missing');
          }
          console.log('Reporting + Defitea 40 Acres candidate runtime PASS',{
            schedulerCron:schedule.cron,
            schedulerSnapshot:schedule.dailySnapshotUtc,
            validationFixtureRows:fixture.validationFixture?.patchedRows||[],
            defiteaTvlUsd:d.latestSnapshot.totalValueUsd,
            contributorEntries:(l.contributorDaily||[]).length,
            voteMarketEvents:vm.length,
            fortyAcresEvents:fa.length,
            fortyAcresReceivedUsd:current?.fortyAcresReceivedIncomeUsd,
            fortyAcresReplacedReferenceUsd:current?.fortyAcresReplacedReferenceCashFlowUsd,
            currentMonthCashFlowUsd:current?.cashFlowUsd
          });
          NODE

      - name: Guard independent price discovery and authority expansion
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs');
          const engine=fs.readFileSync('reporting/reporting-engine.mjs','utf8');
          const runner=fs.readFileSync('reporting/reporting-scheduled-runner.mjs','utf8');
          const validation=fs.readFileSync('reporting/reporting-engine-validation.mjs','utf8');
          const composition=fs.readFileSync('reporting/defitea-income-composition.mjs','utf8');
          const settlement=fs.readFileSync('reporting/defitea-forty-acres-settlement.mjs','utf8');
          const workflow=fs.readFileSync('.github/workflows/update-reporting.yml','utf8');
          const schedule=JSON.parse(fs.readFileSync('reporting/reporting-scheduler-contract.json','utf8'));
          for(const bad of ['api.coingecko.com/api/v3/simple/price','COINGECKO_API_KEY','getCoinGeckoPrices(','COMPANY_PAGE_FILE','parseCompanyBook(']){
            if(engine.includes(bad)||runner.includes(bad)||validation.includes(bad)||composition.includes(bad)||settlement.includes(bad)||workflow.includes(bad)) throw new Error('independent Reporting price discovery remains: '+bad);
          }
          for(const bad of ['sendTransaction(','new Wallet(','claimTransactionAuthority: true','executionAuthority: write']){
            if(engine.includes(bad)||runner.includes(bad)||validation.includes(bad)||composition.includes(bad)||settlement.includes(bad)) throw new Error('unexpected Reporting authority expansion: '+bad);
          }
          if(workflow.includes('PRODUCTIVITY_DATA_FILE=/tmp/reporting-verifier-productivity.json')) throw new Error('production Reporting workflow must never consume verification fixture');
          for(const key of ['repositoryMutationAuthority','workflowDispatchAuthority','capitalExecution','walletAuthority','methodologyMutationAuthority']){
            if(schedule.authority?.[key]!==false) throw new Error('scheduler authority expansion: '+key);
          }
          console.log('Reporting authority boundary PASS');
          NODE
