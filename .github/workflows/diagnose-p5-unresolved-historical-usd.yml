name: Diagnose P5 unresolved historical USD

on:
  push:
    branches:
      - diagnostic/p5-unresolved-historical-usd-20260914
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-canonical-consumer:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout diagnostic tooling
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Patch and prove isolated consumer branch
        shell: bash
        run: |
          set -euo pipefail
          cp diagnostics/p5-patch-canonical-consumer.py /tmp/p5-patch-canonical-consumer.py
          git fetch origin fix/p5-canonical-discovered-valuation-consumer-20260914
          git checkout -B fix/p5-canonical-discovered-valuation-consumer-20260914 origin/fix/p5-canonical-discovered-valuation-consumer-20260914
          python3 /tmp/p5-patch-canonical-consumer.py
          node --check reporting/canonical-earned-income-view.mjs
          node --check reporting/verify-p5-discovered-valuation-admission.mjs
          node reporting/verify-p5-discovered-valuation-admission.mjs
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          import { buildCanonicalEarnedIncomeView } from './reporting/canonical-earned-income-view.mjs';
          const ledger=JSON.parse(fs.readFileSync('reporting/income-ledger.json','utf8'));
          const view=buildCanonicalEarnedIncomeView(ledger);
          const blockers=view.unresolved.filter(row=>row.reason==='canonical-event-usd-valuation-incomplete');
          console.log('P5 canonical consumer fresh-ledger proof',{blockers:blockers.length,recognized:view.recognized.length,totalUnresolved:view.unresolved.length});
          if(blockers.length!==15) throw new Error(`expected 15 true historical USD blockers after consuming proven discovered valuations, got ${blockers.length}`);
          NODE
          git diff --check
          git config user.name "The Holding P5 Diagnostic"
          git config user.email "p5-diagnostic@theholding.ai"
          git add reporting/canonical-earned-income-view.mjs reporting/verify-p5-discovered-valuation-admission.mjs
          test "$(git diff --cached --name-only | tr '\n' ' ')" = "reporting/canonical-earned-income-view.mjs reporting/verify-p5-discovered-valuation-admission.mjs "
          git commit -m "Accounting: consume discovered historical valuations canonically"
          git push origin HEAD:fix/p5-canonical-discovered-valuation-consumer-20260914
