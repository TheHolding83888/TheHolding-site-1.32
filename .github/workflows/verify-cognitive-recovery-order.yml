name: "Verify Cognitive Recovery · Security Ordering"

on:
  pull_request:
    paths:
      - '.github/workflows/resume-cognitive-stack-after-release.yml'
      - '.github/workflows/recover-cognitive-stack-after-release.yml'
      - '.github/workflows/update-proposal-work-queue.yml'
      - '.github/workflows/refresh-downstream-continuity.yml'
      - '.github/workflows/update-intelligence-progress.yml'
      - '.github/workflows/verify-cognitive-recovery-order.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout PR head
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Require Security-before-Cognitive recovery contract
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('fs');
          const files = [
            '.github/workflows/resume-cognitive-stack-after-release.yml',
            '.github/workflows/recover-cognitive-stack-after-release.yml'
          ];
          for (const file of files) {
            const text = fs.readFileSync(file, 'utf8');
            const required = [
              'RECOVERY_PUSH_AT:',
              'securityMs < pushMs',
              'git fetch origin main',
              'git reset --hard origin/main',
              'cognitive-release-guard.mjs',
              'gh workflow run refresh-cognitive-stack.yml --ref main'
            ];
            for (const token of required) {
              if (!text.includes(token)) throw new Error(`${file}: missing recovery-order contract token ${token}`);
            }
            if (!text.includes('severityCounts?.critical')) throw new Error(`${file}: Critical Security gate missing`);
            const waitIndex = text.indexOf('securityMs < pushMs');
            const dispatchIndex = text.indexOf('gh workflow run refresh-cognitive-stack.yml --ref main');
            if (!(waitIndex >= 0 && dispatchIndex > waitIndex)) throw new Error(`${file}: Cognitive dispatch occurs before Security freshness gate`);
          }

          const resumeFile = '.github/workflows/resume-cognitive-stack-after-release.yml';
          const resume = fs.readFileSync(resumeFile, 'utf8');
          const handoffRequired = [
            "- '.github/workflows/resume-cognitive-stack-after-release.yml'",
            'gh run watch "$cognitive_run_id" --exit-status',
            'gh workflow run update-learning-loop.yml --ref main',
            'gh run watch "$learning_run_id" --exit-status',
            'gh workflow run update-proposal-work-queue.yml --ref main',
            'gh run watch "$proposal_run_id" --exit-status',
            'gh workflow run refresh-downstream-continuity.yml --ref main',
            'gh run watch "$downstream_run_id" --exit-status',
            'gh workflow run update-project-memory-bootstrap.yml --ref main',
            'gh run watch "$memory_run_id" --exit-status',
            'gh workflow run update-intelligence-progress.yml --ref main',
            'gh run watch "$progress_run_id" --exit-status'
          ];
          for (const token of handoffRequired) {
            if (!resume.includes(token)) throw new Error(`${resumeFile}: missing recovery-chain token ${token}`);
          }

          const cognitiveDispatch = resume.indexOf('gh workflow run refresh-cognitive-stack.yml --ref main');
          const cognitiveSuccess = resume.indexOf('gh run watch "$cognitive_run_id" --exit-status');
          const learningDispatch = resume.indexOf('gh workflow run update-learning-loop.yml --ref main');
          const learningSuccess = resume.indexOf('gh run watch "$learning_run_id" --exit-status');
          const proposalDispatch = resume.indexOf('gh workflow run update-proposal-work-queue.yml --ref main');
          const proposalSuccess = resume.indexOf('gh run watch "$proposal_run_id" --exit-status');
          const downstreamDispatch = resume.indexOf('gh workflow run refresh-downstream-continuity.yml --ref main');
          const downstreamSuccess = resume.indexOf('gh run watch "$downstream_run_id" --exit-status');
          const memoryDispatch = resume.indexOf('gh workflow run update-project-memory-bootstrap.yml --ref main');
          const memorySuccess = resume.indexOf('gh run watch "$memory_run_id" --exit-status');
          const progressDispatch = resume.indexOf('gh workflow run update-intelligence-progress.yml --ref main');
          const progressSuccess = resume.indexOf('gh run watch "$progress_run_id" --exit-status');
          if (!(cognitiveDispatch >= 0
            && cognitiveSuccess > cognitiveDispatch
            && learningDispatch > cognitiveSuccess
            && learningSuccess > learningDispatch
            && proposalDispatch > learningSuccess
            && proposalSuccess > proposalDispatch
            && downstreamDispatch > proposalSuccess
            && downstreamSuccess > downstreamDispatch
            && memoryDispatch > downstreamSuccess
            && memorySuccess > memoryDispatch
            && progressDispatch > memorySuccess
            && progressSuccess > progressDispatch)) {
            throw new Error(`${resumeFile}: recovery must enforce Cognitive SUCCESS → Learning SUCCESS → Proposal SUCCESS → Downstream SUCCESS → Project Memory SUCCESS → Intelligence Progress SUCCESS`);
          }

          const proposalFile = '.github/workflows/update-proposal-work-queue.yml';
          const proposal = fs.readFileSync(proposalFile, 'utf8');
          if (!proposal.includes('workflow_dispatch:')) throw new Error(`${proposalFile}: workflow_dispatch recovery surface missing`);
          const readinessGateToken = "input_readiness.outputs.ready == 'true'";
          const proposalRequired = [
            'id: input_readiness',
            'Proposal skipped safely: coherent Learning input is not available yet.',
            readinessGateToken,
            'No Proposal state was rebuilt or published from stale Learning input.',
            'node intelligence/proposals/proposal-release-guard.mjs',
            '- name: Publish Proposal state safely'
          ];
          for (const token of proposalRequired) {
            if (!proposal.includes(token)) throw new Error(`${proposalFile}: missing stale-input safe-skip contract token ${token}`);
          }
          const readinessIndex = proposal.indexOf('id: input_readiness');
          const releaseGuardIndex = proposal.indexOf('node intelligence/proposals/proposal-release-guard.mjs');
          const publishIndex = proposal.indexOf('- name: Publish Proposal state safely');
          if (!(readinessIndex >= 0 && releaseGuardIndex > readinessIndex && publishIndex > releaseGuardIndex)) {
            throw new Error(`${proposalFile}: Proposal must classify coherent input before release verification and publication`);
          }
          const gatedStepNames = [
            'Verify exact Proposal release and material-change contract',
            'Verify exact Learning → Cognitive binding',
            'Snapshot prior reviewed Proposal packet',
            'Build machine-readable Proposal Work Queue',
            'Reflect owner Decision Memory into Proposal states',
            'Independent Proposal reviewer',
            'Independent Decision → Proposal reviewer',
            'Verify queue remains non-executable',
            'Apply Proposal material-change gate',
            'Publish Proposal state safely'
          ];
          for (const stepName of gatedStepNames) {
            const stepIndex = proposal.indexOf(`- name: ${stepName}`);
            if (stepIndex < 0) throw new Error(`${proposalFile}: missing step ${stepName}`);
            const nextStep = proposal.indexOf('\n      - name:', stepIndex + 1);
            const stepText = proposal.slice(stepIndex, nextStep < 0 ? proposal.length : nextStep);
            if (!stepText.includes(readinessGateToken)) {
              throw new Error(`${proposalFile}: stale-input gate missing from ${stepName}`);
            }
          }

          const downstreamFile = '.github/workflows/refresh-downstream-continuity.yml';
          const downstream = fs.readFileSync(downstreamFile, 'utf8');
          if (!downstream.includes('workflow_dispatch:')) throw new Error(`${downstreamFile}: workflow_dispatch recovery surface missing`);
          if (!downstream.includes('Proposal → Builder → Guardian → CURRENT')) throw new Error(`${downstreamFile}: canonical governance tail declaration missing`);

          const progressFile = '.github/workflows/update-intelligence-progress.yml';
          const progress = fs.readFileSync(progressFile, 'utf8');
          if (!progress.includes('workflow_dispatch:')) throw new Error(`${progressFile}: workflow_dispatch recovery surface missing`);
          if (progress.includes(`node - <<'NODE' >> "$GITHUB_STEP_SUMMARY"`)) throw new Error(`${progressFile}: fragile summary heredoc regression detected`);
          if (!progress.includes("node -e '")) throw new Error(`${progressFile}: fail-safe summary renderer missing`);
          console.log('Cognitive recovery Security → Cognitive → Learning → Proposal → Downstream → Project Memory → Intelligence Progress ordering PASS');
          NODE
          git diff --check
