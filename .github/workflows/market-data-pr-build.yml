name: "The Holding Market Data · One-shot Branch Build"

on:
  push:
    branches:
      - agent/market-data-unification
    paths:
      - '.github/workflows/market-data-pr-build.yml'

permissions:
  contents: write

jobs:
  migrate-and-close:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: agent/market-data-unification
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Validate and migrate
        run: |
          set -euo pipefail
          node --check intelligence/market-data/market-data-source-migrator.mjs
          node intelligence/market-data/market-data-source-migrator.mjs
          targets=(index.html companies/index.html defitea/index.html yield-reports/index.html substantia/index.html singul/index.html fructus/index.html monetra/index.html)
          if grep -nE 'api\.coingecko\.com|CG-[A-Za-z0-9_-]{12,}' "${targets[@]}"; then
            echo 'Browser-facing CoinGecko surface remains.'
            exit 1
          fi
          grep -n 'const publicCompanyTvl = (key, fallback)' companies/index.html
          grep -n 'canonicalNetworkTvl' companies/index.html
          grep -n 'elizaos: 80808' singul/index.html
          grep -n 'ondo: 542' fructus/index.html
          ! grep -nE 'fructusHoldings\.(dbcon|copxon)|FIXED_(DBCON|COPXON)_VALUE' fructus/index.html
          git diff --check

      - name: Commit migration and remove one-shot workflow
        run: |
          set -euo pipefail
          git config user.name "The Holding Market Data Builder"
          git config user.email "market-data-builder@theholding.ai"
          git rm .github/workflows/market-data-pr-build.yml
          git add \
            index.html companies/index.html defitea/index.html yield-reports/index.html \
            substantia/index.html singul/index.html fructus/index.html monetra/index.html
          git commit -m "market data: bind company TVL to public capital state"
          git push origin HEAD:agent/market-data-unification
