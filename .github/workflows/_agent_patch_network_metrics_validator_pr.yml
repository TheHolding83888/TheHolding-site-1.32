name: Agent Patch Network Metrics Validator PR

on:
  pull_request:
    branches: [main]
    paths:
      - 'companies/company-010-public-adapter.js'
      - '.github/workflows/verify-company-010-public-admission.yml'
      - '.github/workflows/_agent_patch_network_metrics_validator_pr.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'agent/companies-network-metrics-coherence-v0.2'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: agent/companies-network-metrics-coherence-v0.2
          fetch-depth: 0
      - name: Align verifier with split summary authority
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/verify-company-010-public-admission.yml')
          s=p.read_text()
          old="'networkTvlUsd','measuredCapitalFloorUsd','INDEX_STATE.push(next)'"
          new="'networkTvlUsd','INDEX_STATE.push(next)'"
          if s.count(old) != 1:
              raise SystemExit(f'legacy adapterMust contract drift: {s.count(old)}')
          s=s.replace(old,new,1)
          needle="          for(const x of adapterMust)if(!a.includes(x))throw new Error('adapter complete-surface binding missing: '+x);\n"
          insert=needle + "          if(a.includes(\"const index=document.getElementById('idxNetworkValue')\")||a.includes(\"if(top&&top.textContent!==display)top.textContent=display\"))throw new Error('Company #010 adapter must not overwrite shared summary TVL metrics');\n          if(!a.includes(\"statProtocols.textContent=String(new Set(Object.values(COMPANY_PROTOCOLS).flat()).size)\"))throw new Error('runtime Protocols & Assets reconciliation missing');\n"
          if s.count(needle) != 1:
              raise SystemExit(f'verifier insertion point drift: {s.count(needle)}')
          p.write_text(s.replace(needle,insert,1))
          PY
          grep -F "must not overwrite shared summary TVL metrics" .github/workflows/verify-company-010-public-admission.yml
          grep -F "runtime Protocols & Assets reconciliation missing" .github/workflows/verify-company-010-public-admission.yml
      - name: Commit production-only diff
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/_agent_patch_network_metrics_validator_pr.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/verify-company-010-public-admission.yml .github/workflows/_agent_patch_network_metrics_validator_pr.yml
          git diff --cached --check
          git commit -m 'test: enforce companies summary metric authority'
          git push origin HEAD:agent/companies-network-metrics-coherence-v0.2
