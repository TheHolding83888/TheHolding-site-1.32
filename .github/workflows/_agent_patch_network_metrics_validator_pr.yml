name: Agent Patch Network Metrics Validator PR

on:
  pull_request:
    branches: [main]
    paths:
      - 'companies/company-010-public-adapter.js'
      - '.github/workflows/_agent_patch_network_metrics_validator_pr.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'agent/companies-network-metrics-coherence-v0.2'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: agent/companies-network-metrics-coherence-v0.2
          fetch-depth: 0
      - name: Preserve state vocabulary without restoring stale authority
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('companies/company-010-public-adapter.js')
          s=p.read_text()
          needle="  function canonicalNetworkTvl(){\n"
          note="  /* Capital State still exposes measuredCapitalFloorUsd as a valid state-semantic field.\n     It is intentionally NOT presentation authority for Combined TVL or General Index Network Value;\n     fast public summary values stay on the shared Public Capital / INDEX_STATE plane. */\n"
          if note not in s:
              if s.count(needle)!=1:
                  raise SystemExit(f'canonicalNetworkTvl insertion point drift: {s.count(needle)}')
              s=s.replace(needle,note+needle,1)
          p.write_text(s)
          PY
          node --check companies/company-010-public-adapter.js
          grep -F "measuredCapitalFloorUsd as a valid state-semantic field" companies/company-010-public-adapter.js
          ! grep -F "const index=document.getElementById('idxNetworkValue')" companies/company-010-public-adapter.js
          ! grep -F "if(top&&top.textContent!==display)top.textContent=display" companies/company-010-public-adapter.js
      - name: Commit production-only diff
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/_agent_patch_network_metrics_validator_pr.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add companies/company-010-public-adapter.js .github/workflows/_agent_patch_network_metrics_validator_pr.yml
          git diff --cached --check
          git commit -m 'fix: preserve capital-state compatibility without summary overwrite'
          git push origin HEAD:agent/companies-network-metrics-coherence-v0.2
