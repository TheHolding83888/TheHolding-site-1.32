name: "TEMP · Realised Cash Flow Live Preflight"

on:
  pull_request:

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'
          package-manager-cache: false
      - run: npm install --no-save --no-package-lock ethers@6

      - name: Probe historical getLogs capability
        env:
          ETH_RPC_URL: ${{ secrets.ETH_RPC_URL }}
        run: |
          mkdir -p artifacts
          node --input-type=module <<'NODE' > artifacts/rpc-probes.json
          import {JsonRpcProvider, Interface} from 'ethers';
          const iface=new Interface(['event Claim(address indexed user,address indexed token,uint256 amount)']);
          const topic=iface.getEvent('Claim').topicHash;
          const address='0xD11b416573EbC59b6B2387DA0D2c0D1b3b1F7A90';
          const from=23925586, to=23928000;
          const urls=[
            process.env.ETH_RPC_URL,
            'https://ethereum-rpc.publicnode.com',
            'https://eth.llamarpc.com',
            'https://1rpc.io/eth',
            'https://rpc.flashbots.net',
            'https://eth.drpc.org'
          ].filter(Boolean);
          const seen=new Set(); const out=[];
          for(const url of urls){
            let label='configured'; try{label=new URL(url).hostname}catch{}
            if(seen.has(url)) continue; seen.add(url);
            const row={label};
            try{
              const p=new JsonRpcProvider(url,1,{staticNetwork:true});
              row.chainId=Number((await p.getNetwork()).chainId);
              row.latest=await p.getBlockNumber();
              const logs=await p.getLogs({address,topics:[topic],fromBlock:from,toBlock:to});
              row.historicalGetLogs='ok'; row.logCount=logs.length;
            }catch(e){
              row.historicalGetLogs='error';
              row.error=String(e?.shortMessage||e?.message||e).replace(url,'[redacted]').slice(0,300);
            }
            out.push(row);
          }
          console.log(JSON.stringify(out,null,2));
          NODE

      - name: Capture exact adapter result
        env:
          ETH_RPC_URL: ${{ secrets.ETH_RPC_URL }}
        shell: bash
        run: |
          set +e
          node intelligence/realised-cash-flow/yield-basis-live-adapter.mjs > artifacts/adapter.stdout.txt 2> artifacts/adapter.stderr.txt
          rc=$?
          echo "$rc" > artifacts/adapter.exit-code.txt
          exit 0

      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: realised-cash-flow-rpc-preflight-${{ github.run_id }}
          path: artifacts/
          retention-days: 2
