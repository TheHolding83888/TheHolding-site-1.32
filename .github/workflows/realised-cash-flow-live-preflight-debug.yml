name: "TEMP · Realised Cash Flow Live Preflight"

on:
  pull_request:

permissions:
  contents: read

env:
  ETH_RPC_URL: https://rpc.flashbots.net
  YB_LOG_WINDOW: '5000'

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'
          package-manager-cache: false
      - run: npm install --no-save --no-package-lock ethers@6

      - name: Probe exact bounded historical range
        run: |
          mkdir -p artifacts
          node --input-type=module <<'NODE' > artifacts/rpc-probe.json
          import {JsonRpcProvider, Interface} from 'ethers';
          const p=new JsonRpcProvider(process.env.ETH_RPC_URL,1,{staticNetwork:true});
          const iface=new Interface(['event Claim(address indexed user,address indexed token,uint256 amount)']);
          const logs=await p.getLogs({
            address:'0xD11b416573EbC59b6B2387DA0D2c0D1b3b1F7A90',
            topics:[iface.getEvent('Claim').topicHash],
            fromBlock:23925586,
            toBlock:23930585
          });
          console.log(JSON.stringify({chainId:Number((await p.getNetwork()).chainId),latest:await p.getBlockNumber(),window:5000,logCount:logs.length},null,2));
          NODE

      - name: Capture exact bounded adapter result
        shell: bash
        run: |
          set +e
          node intelligence/realised-cash-flow/yield-basis-live-adapter.mjs > artifacts/adapter.stdout.txt 2> artifacts/adapter.stderr.txt
          rc=$?
          echo "$rc" > artifacts/adapter.exit-code.txt
          if [ -s intelligence/realised-cash-flow/realised-cash-flow.json ]; then
            cp intelligence/realised-cash-flow/realised-cash-flow.json artifacts/realised-cash-flow.json
          fi
          exit 0

      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: realised-cash-flow-bounded-preflight-${{ github.run_id }}
          path: artifacts/
          retention-days: 2
