name: "Probe Onchain Market Data Candidates"

on:
  pull_request:
    paths:
      - 'intelligence/market-data/onchain-live-candidate-probe.mjs'
      - 'intelligence/market-data/olas-sync-log-endpoint-probe.mjs'
      - 'intelligence/market-data/olas-v2-short-history-probe.mjs'
      - '.github/workflows/probe-onchain-market-data-candidates.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout probe head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Probe OLAS short-window historical V2 TWAP
        run: |
          set -euo pipefail
          node --check intelligence/market-data/olas-v2-short-history-probe.mjs
          node intelligence/market-data/olas-v2-short-history-probe.mjs
