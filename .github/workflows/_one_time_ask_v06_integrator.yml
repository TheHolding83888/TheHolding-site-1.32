name: One-time Ask v0.6 Integrator

on:
  push:
    branches:
      - agents/ask-trust-intent-v0.6-20260814
    paths:
      - .github/workflows/_one_time_ask_v06_integrator.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: agents/ask-trust-intent-v0.6-20260814
          fetch-depth: 0

      - name: Apply patch
        run: python3 verification/_one_time_ask_v06_patch.py

      - name: Validate candidate
        shell: bash
        run: |
          set -euo pipefail
          node --check agents/console/app.js
          git diff --check
          node verification/production-boundary-guard-v1.mjs
          git diff -- agents/console/app.js | grep -q 'embedded-yield-ledger.json'
          git diff -- agents/console/app.js | grep -q 'trustIntentAnswer'
          git diff -- agents/index.html | grep -q 'app.js?v=0.6'

      - name: Publish exact candidate and self-remove
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'The Holding Experience Integrator'
          git config user.email 'experience-integrator@theholding.ai'
          git add agents/console/app.js agents/index.html
          git rm .github/workflows/_one_time_ask_v06_integrator.yml verification/_one_time_ask_v06_patch.py
          git commit -m 'agents: harden Ask trust and intent precision v0.6'
          git push origin HEAD:agents/ask-trust-intent-v0.6-20260814
