name: One-time Ask v0.6 Integrator

on:
  push:
    branches:
      - agents/ask-trust-intent-v0.6-20260814
    paths:
      - .github/workflows/_one_time_ask_v06_integrator.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: agents/ask-trust-intent-v0.6-20260814
          fetch-depth: 0

      - name: Apply fail-closed v0.6 patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          exec(base64.b64decode('CkZST00tUEFZTE9BRC1QTEFDRUhPTERFUgo='))
          PY
