name: Verify Curve Fee · Factual Accounting

on:
  pull_request:
    paths:
      - 'reporting/curve-fee-accounting-adapter.mjs'
      - 'reporting/curve-fee-accounting-adapter-validation.mjs'
      - 'reporting/curve-fee-ledger-admission.mjs'
      - 'reporting/curve-fee-ledger-admission-validation.mjs'
      - 'reporting/curve-fee-accounting-coverage-validation.mjs'
      - 'reporting/yield-basis-ledger-admission.mjs'
      - 'reporting/accounting-coverage.mjs'
      - '.github/workflows/verify-curve-fee-accounting.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: Install read-only accounting runtime
        run: npm install --no-save --no-package-lock ethers@6

      - name: Static syntax and no-execution guard
        shell: bash
        run: |
          set -euo pipefail
          node --check reporting/curve-fee-accounting-adapter.mjs
          node --check reporting/curve-fee-accounting-adapter-validation.mjs
          node --check reporting/curve-fee-ledger-admission.mjs
          node --check reporting/curve-fee-ledger-admission-validation.mjs
          node --check reporting/curve-fee-accounting-coverage-validation.mjs
          node --check reporting/yield-basis-ledger-admission.mjs
          node --check reporting/accounting-coverage.mjs
          if grep -REn 'sendTransaction|signTransaction|wallet\.send|\.claim\(' reporting/curve-fee-*.mjs; then
            echo 'Unexpected execution-capable call in Curve factual accounting lane.'
            exit 1
          fi

      - name: Validate Curve factual lifecycle semantics
        run: |
          node reporting/curve-fee-accounting-adapter-validation.mjs
          node reporting/curve-fee-ledger-admission-validation.mjs
          node reporting/curve-fee-accounting-coverage-validation.mjs

      - name: Verify live registry route discovery contract
        run: |
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          import {discoverCurveFeeWallets} from './reporting/curve-fee-accounting-adapter.mjs';
          const rewards=JSON.parse(fs.readFileSync('companies/rewards-data.json','utf8'));
          const rows=discoverCurveFeeWallets(rewards);
          const companies=[...new Set(rows.map(x=>x.company))].sort();
          const expected=['05081966.eth',"Rook's portfolio",'defitea.eth'].sort();
          if(JSON.stringify(companies)!==JSON.stringify(expected))throw new Error(`Curve route discovery drift: ${JSON.stringify(companies)}`);
          if(rows.some(x=>!x.wallet))throw new Error('Curve route discovery produced a walletless row');
          console.log('Curve live registry discovery PASS',{companies,wallets:rows.length});
          NODE

      - name: Prove Curve Accounting Coverage semantics are unchanged
        shell: bash
        run: |
          set -euo pipefail
          cp reporting/accounting-coverage.json /tmp/accounting-coverage.before.json
          node reporting/accounting-coverage.mjs
          node --input-type=module - <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          const before=JSON.parse(fs.readFileSync('/tmp/accounting-coverage.before.json','utf8'));
          const after=JSON.parse(fs.readFileSync('reporting/accounting-coverage.json','utf8'));

          // v0.12 intentionally adds these cross-mechanism diagnostic fields.
          // Normalize only this explicit allow-list before exact Curve equality;
          // all factual values, routes, month states, blockers and authorities
          // remain guarded byte-for-byte. Observation-completeness provenance is
          // required for the current period only; historical months predate this
          // diagnostic and remain null rather than being rewritten retroactively.
          const additiveDiagnostics=new Set([
            'currentMonthPartialObservationCompanyCount',
            'crossMonthExplicitlyAttributedCount',
            'crossMonthUnresolvedCount',
            'factualTrackingPartialObservationCount',
            'factualTrackingObservationComplete',
            'factualTrackingObservationCoverage'
          ]);
          const stableCurve=row=>{
            if(row==null)return row;
            const copy=structuredClone(row);
            const scrub=value=>{
              if(!value||typeof value!=='object')return;
              if(!Array.isArray(value))for(const key of additiveDiagnostics)delete value[key];
              for(const child of Object.values(value))scrub(child);
            };
            scrub(copy);
            return copy;
          };

          assert.deepEqual(stableCurve(after.mechanisms?.curve_vecrv),stableCurve(before.mechanisms?.curve_vecrv),'curve_vecrv aggregate accounting semantics changed');
          for(const [company,row] of Object.entries(before.companies||{})){
            const prior=row?.mechanisms?.curve_vecrv;
            if(!prior) continue;
            const current=after.companies?.[company]?.mechanisms?.curve_vecrv;
            assert.deepEqual(stableCurve(current),stableCurve(prior),`${company} curve_vecrv accounting semantics changed`);
            for(const month of Object.values(current?.months||{})){
              assert.equal(Number(month.crossMonthExplicitlyAttributedCount||0),0,`${company} Curve unexpectedly gained attributed cross-month evidence`);
              assert.equal(Number(month.crossMonthUnresolvedCount||0),0,`${company} Curve unexpectedly gained unresolved cross-month evidence`);
              assert.equal(Number(month.factualTrackingPartialObservationCount||0),0,`${company} Curve unexpectedly became partial-observation`);
            }
            const currentMonth=current?.months?.[after.currentMonth];
            if(currentMonth?.factualTrackingActive===true){
              assert.equal(currentMonth.factualTrackingObservationComplete,true,`${company} current Curve tracking observation is incomplete`);
              assert.equal(Number(currentMonth.factualTrackingPartialObservationCount||0),0,`${company} current Curve tracking became partial-observation`);
            }
          }
          assert.equal(after.mechanisms?.curve_vecrv?.currentMonthPartialObservationCompanyCount,0,'Curve unexpectedly became partial-observation');
          console.log('Curve-scoped Accounting Coverage semantic regression guard PASS');
          NODE
          node reporting/accounting-coverage-validation.mjs
