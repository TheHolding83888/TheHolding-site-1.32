name: Verify Curve Fee · Factual Accounting

on:
  pull_request:
    paths:
      - 'reporting/curve-fee-accounting-adapter.mjs'
      - 'reporting/curve-fee-accounting-adapter-validation.mjs'
      - 'reporting/curve-fee-ledger-admission.mjs'
      - 'reporting/curve-fee-ledger-admission-validation.mjs'
      - 'reporting/curve-fee-accounting-coverage-validation.mjs'
      - 'reporting/yield-basis-ledger-admission.mjs'
      - 'reporting/accounting-coverage.mjs'
      - '.github/workflows/verify-curve-fee-accounting.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: Install read-only accounting runtime
        run: npm install --no-save --no-package-lock ethers@6

      - name: Static syntax and no-execution guard
        shell: bash
        run: |
          set -euo pipefail
          node --check reporting/curve-fee-accounting-adapter.mjs
          node --check reporting/curve-fee-accounting-adapter-validation.mjs
          node --check reporting/curve-fee-ledger-admission.mjs
          node --check reporting/curve-fee-ledger-admission-validation.mjs
          node --check reporting/curve-fee-accounting-coverage-validation.mjs
          node --check reporting/yield-basis-ledger-admission.mjs
          node --check reporting/accounting-coverage.mjs
          if grep -REn 'sendTransaction|signTransaction|wallet\.send|\.claim\(' reporting/curve-fee-*.mjs; then
            echo 'Unexpected execution-capable call in Curve factual accounting lane.'
            exit 1
          fi

      - name: Validate Curve factual lifecycle semantics
        run: |
          node reporting/curve-fee-accounting-adapter-validation.mjs
          node reporting/curve-fee-ledger-admission-validation.mjs
          node reporting/curve-fee-accounting-coverage-validation.mjs

      - name: Verify live registry route discovery contract
        run: |
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          import {discoverCurveFeeWallets} from './reporting/curve-fee-accounting-adapter.mjs';
          const rewards=JSON.parse(fs.readFileSync('companies/rewards-data.json','utf8'));
          const rows=discoverCurveFeeWallets(rewards);
          const companies=[...new Set(rows.map(x=>x.company))].sort();
          const expected=['05081966.eth',"Rook's portfolio",'defitea.eth'].sort();
          if(JSON.stringify(companies)!==JSON.stringify(expected))throw new Error(`Curve route discovery drift: ${JSON.stringify(companies)}`);
          if(rows.some(x=>!x.wallet))throw new Error('Curve route discovery produced a walletless row');
          console.log('Curve live registry discovery PASS',{companies,wallets:rows.length});
          NODE

      - name: Prove no unrelated Accounting Coverage regression
        shell: bash
        run: |
          set -euo pipefail
          cp reporting/accounting-coverage.json /tmp/accounting-coverage.before.json
          node reporting/accounting-coverage.mjs
          if ! cmp /tmp/accounting-coverage.before.json reporting/accounting-coverage.json; then
          node --input-type=module - <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          const before=JSON.parse(fs.readFileSync('/tmp/accounting-coverage.before.json','utf8'));
          const after=JSON.parse(fs.readFileSync('reporting/accounting-coverage.json','utf8'));
          const engine='convex_staked_cvxcrv';
          const b=before.mechanisms?.[engine],a=after.mechanisms?.[engine];
          assert.equal(b?.factualTrackingCompanyCount,0,'transition allowance requires old cvxCRV 0/1 state');
          assert.equal(b?.activeCompanyCount,1,'old cvxCRV active-company count drift');
          assert.equal(b?.reusableCoverageGap,true,'old cvxCRV state was not a gap');
          assert.equal(a?.factualTrackingCompanyCount,1,'candidate did not close cvxCRV tracking');
          assert.equal(a?.activeCompanyCount,1,'candidate cvxCRV active-company count drift');
          assert.equal(a?.reusableCoverageGap,false,'candidate cvxCRV gap remained open');
          assert.equal(after.summary?.canonicalLedgerEventCount,before.summary?.canonicalLedgerEventCount,'cvxCRV tracking transition changed canonical income events');
          assert.equal(after.summary?.reusableCoverageGapCount,before.summary?.reusableCoverageGapCount-1,'cvxCRV transition changed unexpected gap count');
          assert.equal(after.summary?.factualTrackingProofCount,before.summary?.factualTrackingProofCount+1,'cvxCRV transition changed unexpected factual proof count');

          const withoutEngine=obj=>Object.fromEntries(Object.entries(obj||{}).filter(([key])=>key!==engine));
          assert.deepEqual(withoutEngine(after.mechanisms),withoutEngine(before.mechanisms),'unrelated mechanism coverage changed');
          assert.deepEqual((after.gapRanking||[]).map(x=>x.engineId),(before.gapRanking||[]).map(x=>x.engineId).filter(x=>x!==engine),'unrelated gap ranking changed');

          const beforeCompanies=structuredClone(before.companies||{}),afterCompanies=structuredClone(after.companies||{});
          const bc=beforeCompanies.Cypher,ac=afterCompanies.Cypher;
          delete beforeCompanies.Cypher; delete afterCompanies.Cypher;
          assert.deepEqual(afterCompanies,beforeCompanies,'unrelated company coverage changed');
          assert.ok(bc&&ac,'Cypher coverage missing');
          const bm=bc.mechanisms?.[engine],am=ac.mechanisms?.[engine];
          delete bc.mechanisms[engine]; delete ac.mechanisms[engine];
          const changing=['currentMonthFactualTrackingMechanismCount','currentMonthFactualMechanismCount','currentMonthStateOnlyMechanismCount'];
          for(const key of changing){delete bc[key];delete ac[key];}
          assert.deepEqual(ac,bc,'unrelated Cypher coverage changed');
          assert.equal(am?.months?.[after.currentMonth]?.factualTrackingActive,true,'Cypher cvxCRV tracking did not become factual');
          assert.equal(am?.months?.[after.currentMonth]?.factualEventCount,0,'cvxCRV tracking transition fabricated period income');
          assert.equal(bm?.months?.[before.currentMonth]?.factualTrackingActive,false,'old Cypher cvxCRV state unexpectedly factual');
          console.log('Bounded cvxCRV 0/1 → 1/1 transition PASS; no unrelated coverage drift.');
          NODE
          fi
          node reporting/accounting-coverage-validation.mjs
