name: "Verify Known Mechanisms · reuse parity"

on:
  pull_request:
    branches: [main]
    paths:
      - 'rewards/company-rewards-engine.mjs'
      - 'rewards/company-010-rewards-overlay.mjs'
      - 'companies/company-010-public-adapter.js'
      - '.github/workflows/update-company-rewards.yml'
      - 'intelligence/project-memory/THE_HOLDING_KNOWN_MECHANISM_REUSE_AND_PROMOTION_CANON_2026-08-18.md'
      - 'intelligence/project-memory/README.md'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Syntax
        run: |
          set -euo pipefail
          node --check rewards/company-rewards-engine.mjs
          node --check rewards/company-010-rewards-overlay.mjs
          node --check companies/company-010-public-adapter.js
      - name: Verify established generic ve capability exists
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs');
          const generic=fs.readFileSync('rewards/company-rewards-engine.mjs','utf8');
          for(const x of ['collectVeProtocol','compounded-locked','applyPrices','priceUsd','usdValue','priceMethod']){
            if(!generic.includes(x))throw new Error('generic known ve capability missing: '+x);
          }
          console.log('Established generic ve Compounded + pricing capability PASS');
          NODE
      - name: Verify Company #010 preserves full capability parity
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs');
          const overlay=fs.readFileSync('rewards/company-010-rewards-overlay.mjs','utf8');
          const ui=fs.readFileSync('companies/company-010-public-adapter.js','utf8');
          const canon=fs.readFileSync('intelligence/project-memory/THE_HOLDING_KNOWN_MECHANISM_REUSE_AND_PROMOTION_CANON_2026-08-18.md','utf8');
          const readme=fs.readFileSync('intelligence/project-memory/README.md','utf8');

          const overlayMust=[
            "classification:'compounded-locked'",
            "usdValue:price!==null?round(amount*price,6):null",
            'priceUsd:price',
            "priceMethod:price!==null?'canonical-company-010-current-token-price':null",
            'usdValueIncludedInClaimableTotal:false',
            'usdValueIncludedInMeasuredEarnedTotal:price!==null',
            'claimableUsd:knownAccruedUsd',
            'measuredEmbeddedUsd',
            'measuredEarnedUsd',
            'measuredEarnedTokens'
          ];
          for(const x of overlayMust)if(!overlay.includes(x))throw new Error('Company #010 known-mechanism output parity missing: '+x);

          const uiMust=[
            'v0.10.2-measured-earned-presentation-parity',
            'compactEmbeddedAmount',
            'measuredEarnedTotal',
            'syncMeasuredEarnedPresentation',
            "['Aerodrome','Aerodrome · veAERO','aerodrome-ve','AERO','Base']",
            "['Velodrome','Velodrome · veVELO','velodrome-ve-direct','VELO','Optimism']",
            '`${symbol} · ${chain} · Rebase`',
            "amountMeta:stateName==='Compounded'?embedded.usd:''"
          ];
          for(const x of uiMust)if(!ui.includes(x))throw new Error('Company #010 known-mechanism public parity missing: '+x);
          if(ui.includes("['Aerodrome','aerodrome-ve','AERO','Base']")||ui.includes("['Velodrome','velodrome-ve-direct','VELO','Optimism']"))throw new Error('Company #010 productive identity regressed to protocol-only mapping');
          if(ui.includes('Embedded income · ${embedded.usd}'))throw new Error('Cypher-specific Embedded income label regressed generic ve presentation parity');
          if(ui.includes('Yield remains inside the managed veNFT'))throw new Error('Cypher-specific managed-ve prose regressed generic ve presentation parity');

          const canonMust=[
            'reuse regression / promotion gap',
            'full capability parity',
            'partial reuse',
            'priceUsd',
            'usdValue',
            'aggregation correctness',
            'Company #011 and beyond',
            'Solved mechanism = reusable end-to-end',
            'resolver completeness != promotion completeness',
            'Economic inventory != enumerable inventory',
            'Nonzero economic state with missing measurement must fail closed',
            'HyperLend / Aave-like lending semantic lanes',
            'controller existence alone does not establish an active reward'
          ];
          for(const x of canonMust)if(!canon.toLowerCase().includes(x.toLowerCase()))throw new Error('known-mechanism canon incomplete: '+x);
          if(!readme.includes('THE_HOLDING_KNOWN_MECHANISM_REUSE_AND_PROMOTION_CANON_2026-08-18.md'))throw new Error('known-mechanism canon not linked from project-memory bootstrap');

          console.log('Known-mechanism data + presentation + expanded canon parity PASS');
          NODE
      - name: Verify dual totals preserve accounting boundary
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs');
          const overlay=fs.readFileSync('rewards/company-010-rewards-overlay.mjs','utf8');
          const ui=fs.readFileSync('companies/company-010-public-adapter.js','utf8');
          if(!overlay.includes("knownAccruedUsd=round(rewards.reduce"))throw new Error('claimable total must continue to derive only from rewards rows');
          if(!overlay.includes("measuredEmbeddedUsd=round(embeddedIncome.reduce"))throw new Error('measured embedded total missing');
          if(!overlay.includes('measuredEarnedUsd=round(knownAccruedUsd+measuredEmbeddedUsd,6)'))throw new Error('measured earned total must explicitly compose claimable + priced Compounded lanes');
          if(!overlay.includes('totalUsd:knownAccruedUsd'))throw new Error('canonical totalUsd claimable lane changed');
          if(!overlay.includes('usdValueIncludedInClaimableTotal:false'))throw new Error('embedded USD claimable exclusion missing');
          if(!ui.includes('if(finite(c.measuredEarnedUsd))return Number(c.measuredEarnedUsd)'))throw new Error('Passport does not prefer measured earned total');
          console.log('Claimable accounting and measured earned presentation remain separate PASS');
          NODE
      - name: Verify post-merge materialization topology
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs');
          const workflow=fs.readFileSync('.github/workflows/update-company-rewards.yml','utf8');
          for(const x of [
            'push:',
            'branches: [main]',
            "'rewards/company-rewards-engine.mjs'",
            "'rewards/company-010-rewards-overlay.mjs'",
            "'rewards/company-010-ve-rewards.mjs'",
            "'.github/workflows/update-company-rewards.yml'"
          ]) if(!workflow.includes(x)) throw new Error('post-merge Rewards promotion trigger missing: '+x);
          if(workflow.includes("- 'companies/rewards-data.json'"))throw new Error('Rewards writer must not self-trigger from generated rewards-data.json');
          if(!workflow.includes('concurrency:\n  group: company-rewards-daily'))throw new Error('canonical Rewards concurrency contract missing');
          console.log('Post-merge Rewards materialization topology PASS');
          NODE
      - name: Verify no execution authority
        run: |
          set -euo pipefail
          ! grep -Eqi 'wallet\.send|sendTransaction|eth_sendTransaction|eth_sendRawTransaction|private[_ -]?key|mnemonic|signer\.send' rewards/company-010-rewards-overlay.mjs companies/company-010-public-adapter.js
