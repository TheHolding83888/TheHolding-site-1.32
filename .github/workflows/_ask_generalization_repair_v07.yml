name: "Ask candidate · v0.7 Generalization Repair"

on:
  push:
    branches:
      - agents/ask-owner-synthesis-v0.7-20260815
    paths:
      - '.github/workflows/_ask_generalization_repair_v07.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout candidate
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: agents/ask-owner-synthesis-v0.7-20260815
          fetch-depth: 0
      - name: Apply semantic normalization repair and self-clean
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('agents/console/app.js')
          s=p.read_text()
          reps=[
            ("'performance', 'embedded', 'current'", "'performance', 'profit', 'embedded', 'current'"),
            ("'private key', 'seed phrase', 'recovery phrase', 'приватн ключ', 'приватник', 'сид фраз', 'секретн ключ'", "'private key', 'seed phrase', 'recovery phrase', 'приватн ключ', 'приватник', 'сид фраз', 'секретн ключ', 'ключ восстановления'"),
            ("приватн.{0,12}ключ|приватник|закрыт.{0,12}ключ|сид.{0,8}фраз|мнемонич|фраз.{0,10}восстанов", "приватн.{0,12}ключ|приватник|закрыт.{0,12}ключ|ключ.{0,12}восстанов|сид.{0,8}фраз|мнемонич|фраз.{0,10}восстанов")
          ]
          for old,new in reps:
              if new in s: continue
              if old not in s: raise SystemExit('anchor missing: '+old)
              s=s.replace(old,new,1)
          p.write_text(s)
          PY
          node --check agents/console/app.js
          grep -F "'performance', 'profit'" agents/console/app.js >/dev/null
          grep -F "'ключ восстановления'" agents/console/app.js >/dev/null
          grep -F "ключ.{0,12}восстанов" agents/console/app.js >/dev/null
          rm -f .github/workflows/_ask_generalization_repair_v07.yml
          git config user.name "The Holding Production Integrator"
          git config user.email "production-integrator@theholding.ai"
          git add -A
          git diff --check --cached
          git commit -m "Ask v0.7: generalize recovery-secret and profit typo intents"
          git push origin HEAD:agents/ask-owner-synthesis-v0.7-20260815
