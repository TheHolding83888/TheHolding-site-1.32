name: Diagnose Cognitive Release Coverage Hashes

on:
  pull_request:
    paths:
      - '.github/workflows/diagnose-cognitive-release-coverage-hashes.yml'
      - 'intelligence/brain-reasoning-engine.mjs'
      - 'intelligence/brain-policy.json'
      - 'security/security-sentinel.mjs'
      - '.github/workflows/security-sentinel.yml'
      - 'intelligence/cognitive-stack-release.json'
      - 'intelligence/learning/learning-release.json'
      - '.github/workflows/verify-cognitive-release-coherence.yml'

permissions:
  contents: read

jobs:
  hashes:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout candidate
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Derive exact SHA-256 release bindings
        shell: bash
        run: |
          set -euo pipefail
          sha256sum \
            intelligence/brain-reasoning-engine.mjs \
            intelligence/brain-policy.json \
            security/security-sentinel.mjs \
            .github/workflows/security-sentinel.yml \
            intelligence/cognitive-stack-release.json
          git diff --check
