name: Realty CSS revision m6 patch

on:
  push:
    branches:
      - fix/realty-css-revision-m6-20260831

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bump Realty CSS browser-visible revision
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('realty/index.html')
          s=p.read_text(encoding='utf-8')
          old='/realty/assets/realty.css?v=20260831m5'
          new='/realty/assets/realty.css?v=20260831m6'
          n=s.count(old)
          if n != 1:
              raise SystemExit(f'Expected exactly one CSS URL, got {n}')
          p.write_text(s.replace(old,new),encoding='utf-8')
          PY
          git diff --check
      - name: Commit revision bump
        shell: bash
        run: |
          git config user.name 'The Holding Realty Patch'
          git config user.email 'realty-patch@theholding.ai'
          git add realty/index.html
          git commit -m 'Realty: bump landing CSS revision to m6'
          git push origin HEAD:${GITHUB_REF_NAME}
