name: Realty desktop owner media materializer

on:
  push:
    branches:
      - feat/realty-desktop-owner-media-20260831

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Materialize verified owner media
        shell: bash
        run: |
          python3 - <<'PY2'
          from pathlib import Path
          import base64,hashlib
          assets={
            'realty/assets/desktop/hero.e98cdd93.avif': ('...','e98cdd93f7b07ec0399a7ddd9daca430b8b99fbd26ddfdca2e239b9baa9c05e2',80339),
            'realty/assets/desktop/real-world.8eb22ee6.avif': ('','8eb22ee63c22f1bdb9ecc327a5da3f84c8bc0630c4a8c707f60783bf71d0903a',56283),
            'realty/assets/desktop/metaverse.3fcae9e6.avif': ('','3fcae9e64525a0e967484cbafada7d29c42d87f4a2d6d78c52bc79cb8570caa4',77330),
          }
          for name,(b64,sha,n) in assets.items():
              data=base64.b64decode(b64,validate=True)
              assert len(data)==n,(name,len(data),n)
              assert hashlib.sha256(data).hexdigest()==sha,name
              assert data[4:12]==b'ftypavif',name
              p=Path(name);p.parent.mkdir(parents=True,exist_ok=True);p.write_bytes(data)
          hp=Path('realty/index.html')
          s=hp.read_text()
          replacements={
            'https://theholding.ai/realty/assets/hero/hero-split.webp?v=20260831':'https://theholding.ai/realty/assets/desktop/hero.e98cdd93.avif',
            '/realty/assets/hero/hero-split.webp?v=20260831':'/realty/assets/desktop/hero.e98cdd93.avif',
            '/realty/assets/demo/v35/desktop-physical.avif?v=20260831':'/realty/assets/desktop/real-world.8eb22ee6.avif',
            '/realty/assets/demo/v35/desktop-digital.avif?v=20260831':'/realty/assets/desktop/metaverse.3fcae9e6.avif',
          }
          for old,new in replacements.items():
              if old not in s: raise SystemExit('missing '+old)
              s=s.replace(old,new)
          hp.write_text(s)
          PY2
      - name: Verify exact media transaction
        shell: bash
        run: |
          git diff --check
          test -f realty/assets/desktop/hero.e98cdd93.avif
          test -f realty/assets/desktop/real-world.8eb22ee6.avif
          test -f realty/assets/desktop/metaverse.3fcae9e6.avif
          test "$(git diff --name-only | sort | tr '\n' ' ')" = "realty/assets/desktop/hero.e98cdd93.avif realty/assets/desktop/metaverse.3fcae9e6.avif realty/assets/desktop/real-world.8eb22ee6.avif realty/index.html "
          sha256sum realty/assets/desktop/hero.e98cdd93.avif | grep -q e98cdd93f7b07ec0399a7ddd9daca430b8b99fbd26ddfdca2e239b9baa9c05e2
          sha256sum realty/assets/desktop/real-world.8eb22ee6.avif | grep -q 8eb22ee63c22f1bdb9ecc327a5da3f84c8bc0630c4a8c707f60783bf71d0903a
          sha256sum realty/assets/desktop/metaverse.3fcae9e6.avif | grep -q 3fcae9e64525a0e967484cbafada7d29c42d87f4a2d6d78c52bc79cb8570caa4
      - name: Commit clean final media
        shell: bash
        run: |
          git rm .github/workflows/realty-desktop-owner-media-materializer.yml
          git config user.name 'The Holding Realty'
          git config user.email 'realty@theholding.ai'
          git add realty/index.html realty/assets/desktop
          git commit -m 'Realty: install owner-approved desktop media'
          git push origin HEAD:${GITHUB_REF_NAME}
