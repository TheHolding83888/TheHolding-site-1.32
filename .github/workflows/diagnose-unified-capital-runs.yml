name: Diagnose Recovery Chain

on:
  pull_request:
    paths:
      - '.github/workflows/diagnose-unified-capital-runs.yml'

permissions:
  contents: read
  actions: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Inspect recovery chain run history
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          echo '=== post-261 recovery verification ==='
          for workflow in resume-cognitive-stack-after-release.yml refresh-cognitive-stack.yml update-learning-loop.yml update-project-memory-bootstrap.yml; do
            echo "=== $workflow recent runs ==="
            gh run list --workflow "$workflow" --limit 8 --json databaseId,event,status,conclusion,headSha,createdAt,updatedAt,url,displayTitle
            latest="$(gh run list --workflow "$workflow" --limit 1 --json databaseId --jq '.[0].databaseId')"
            test -n "$latest"
            echo "=== $workflow latest: $latest ==="
            gh run view "$latest" --json databaseId,event,status,conclusion,headSha,createdAt,updatedAt,url,displayTitle,jobs
          done
