name: Diagnose Post-262 THI Recovery

on:
  pull_request:
    paths:
      - '.github/workflows/diagnose-unified-capital-runs.yml'

permissions:
  contents: read
  actions: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Inspect post-262 THI and recovery runs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          echo '=== THI recent runs ==='
          gh run list --workflow update-intelligence-progress.yml --limit 10 --json databaseId,event,status,conclusion,headSha,createdAt,updatedAt,url,displayTitle
          echo '=== Release recovery recent runs ==='
          gh run list --workflow resume-cognitive-stack-after-release.yml --limit 10 --json databaseId,event,status,conclusion,headSha,createdAt,updatedAt,url,displayTitle
          for id in $(gh run list --workflow update-intelligence-progress.yml --limit 4 --json databaseId --jq '.[].databaseId'); do
            echo "=== THI run $id ==="
            gh run view "$id" --json databaseId,event,status,conclusion,headSha,createdAt,updatedAt,url,displayTitle,jobs
          done
          for id in $(gh run list --workflow resume-cognitive-stack-after-release.yml --limit 3 --json databaseId --jq '.[].databaseId'); do
            echo "=== Recovery run $id ==="
            gh run view "$id" --json databaseId,event,status,conclusion,headSha,createdAt,updatedAt,url,displayTitle,jobs
          done
