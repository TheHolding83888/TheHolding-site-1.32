name: Diagnose Intelligence Progress Handoff

on:
  pull_request:
    paths:
      - '.github/workflows/diagnose-unified-capital-runs.yml'

permissions:
  contents: read
  actions: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Inspect Intelligence Progress run history
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          echo '=== Intelligence Progress recent runs ==='
          gh run list --workflow update-intelligence-progress.yml --limit 15 --json databaseId,event,status,conclusion,headSha,createdAt,updatedAt,url,displayTitle
          for id in $(gh run list --workflow update-intelligence-progress.yml --limit 8 --json databaseId --jq '.[].databaseId'); do
            echo "=== THI run $id ==="
            gh run view "$id" --json databaseId,event,status,conclusion,headSha,createdAt,updatedAt,url,displayTitle,jobs
          done
