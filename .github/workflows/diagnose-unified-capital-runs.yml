name: Diagnose Reporting Production Refresh

on:
  pull_request:
    paths:
      - '.github/workflows/diagnose-unified-capital-runs.yml'

permissions:
  contents: read
  actions: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Dispatch and await canonical Reporting refresh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          before_id="$(gh run list --workflow update-reporting.yml --event workflow_dispatch --limit 1 --json databaseId --jq '.[0].databaseId // empty')"
          dispatched_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          gh workflow run update-reporting.yml --ref main

          run_id=""
          for attempt in $(seq 1 40); do
            run_id="$(
              gh run list \
                --workflow update-reporting.yml \
                --event workflow_dispatch \
                --limit 10 \
                --json databaseId,createdAt \
                --jq "[.[] | select((.databaseId | tostring) != \"${before_id}\" and .createdAt >= \"${dispatched_at}\")] | sort_by(.createdAt) | last | .databaseId // empty"
            )"
            if [ -n "$run_id" ]; then break; fi
            sleep 5
          done
          test -n "$run_id"
          echo "Awaiting canonical Reporting run $run_id"
          gh run watch "$run_id" --exit-status --interval 5
          gh run view "$run_id" --json databaseId,event,status,conclusion,headSha,createdAt,updatedAt,url,displayTitle,jobs
