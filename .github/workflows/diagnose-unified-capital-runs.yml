name: Diagnose Learning Production Runs

on:
  pull_request:
    paths:
      - '.github/workflows/diagnose-unified-capital-runs.yml'

permissions:
  contents: read
  actions: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Inspect canonical Learning run history
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          echo '=== Recent Learning runs ==='
          gh run list \
            --workflow update-learning-loop.yml \
            --limit 12 \
            --json databaseId,event,status,conclusion,headSha,createdAt,updatedAt,url,displayTitle

          latest="$(gh run list --workflow update-learning-loop.yml --limit 1 --json databaseId --jq '.[0].databaseId')"
          if [ -z "$latest" ]; then
            echo 'No Learning runs found.'
            exit 1
          fi

          echo "=== Latest Learning metadata: $latest ==="
          gh run view "$latest" --json databaseId,event,status,conclusion,headSha,createdAt,updatedAt,url,displayTitle,jobs

          echo '=== Latest failed logs (empty if not failed) ==='
          gh run view "$latest" --log-failed || true
