# holding-workflow-definition-proof: intelligence/reliability/proposal-material-change-definition-proof.mjs
name: "The Holding Brain · Proposal Work Queue"

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-proposal-work-queue.yml'
      - 'intelligence/proposals/proposal-policy.json'
      - 'intelligence/proposals/proposal-schema.json'
      - 'intelligence/proposals/proposal-engine.mjs'
      - 'intelligence/proposals/independent-proposal-reviewer.mjs'
      - 'intelligence/proposals/proposal-decision-policy.json'
      - 'intelligence/proposals/proposal-decision-bridge.mjs'
      - 'intelligence/proposals/independent-proposal-decision-reviewer.mjs'
      - 'intelligence/proposals/proposal-release-guard.mjs'
      - 'intelligence/proposals/proposal-release.json'
      - 'intelligence/reliability/proposal-material-change-definition-proof.mjs'
  workflow_run:
    workflows: ["The Holding Brain · Decision Outcome Learning Loop"]
    types: [completed]

permissions:
  contents: write

concurrency:
  group: proposal-work-queue-main
  cancel-in-progress: false

jobs:
  propose:
    if: >-
      ${{
        (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
        (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
        (github.event_name == 'workflow_run' &&
         github.event.workflow_run.conclusion == 'success' &&
         github.event.workflow_run.head_branch == 'main')
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout canonical main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Preflight Proposal Work Queue v0.2
        shell: bash
        run: |
          set -euo pipefail
          REQUIRED=(
            "intelligence/brain-intelligence.json"
            "intelligence/cognitive-stack-state.json"
            "intelligence/learning-state/learning-context.json"
            "intelligence/learning/decision-ledger.json"
            "intelligence/proposals/proposal-policy.json"
            "intelligence/proposals/proposal-schema.json"
            "intelligence/proposals/proposal-engine.mjs"
            "intelligence/proposals/independent-proposal-reviewer.mjs"
            "intelligence/proposals/proposal-decision-policy.json"
            "intelligence/proposals/proposal-decision-bridge.mjs"
            "intelligence/proposals/independent-proposal-decision-reviewer.mjs"
            "intelligence/proposals/proposal-release-guard.mjs"
            "intelligence/proposals/proposal-release.json"
            "intelligence/reliability/proposal-material-change-definition-proof.mjs"
          )
          for f in "${REQUIRED[@]}"; do test -s "$f"; done
          node --check intelligence/proposals/proposal-engine.mjs
          node --check intelligence/proposals/independent-proposal-reviewer.mjs
          node --check intelligence/proposals/proposal-decision-bridge.mjs
          node --check intelligence/proposals/independent-proposal-decision-reviewer.mjs
          node --check intelligence/proposals/proposal-release-guard.mjs
          node --check intelligence/reliability/proposal-material-change-definition-proof.mjs
          node -e "JSON.parse(require('fs').readFileSync('intelligence/proposals/proposal-policy.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('intelligence/proposals/proposal-schema.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('intelligence/proposals/proposal-decision-policy.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('intelligence/proposals/proposal-release.json','utf8'))"
          node intelligence/proposals/proposal-release-guard.mjs
          node intelligence/reliability/proposal-material-change-definition-proof.mjs

      - name: Verify exact Learning → Cognitive binding
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('fs');
          const crypto = require('crypto');
          const sha = p => crypto.createHash('sha256').update(fs.readFileSync(p)).digest('hex');
          const brainPath = 'intelligence/brain-intelligence.json';
          const stack = JSON.parse(fs.readFileSync('intelligence/cognitive-stack-state.json','utf8'));
          const learning = JSON.parse(fs.readFileSync('intelligence/learning-state/learning-context.json','utf8'));
          const ledger = JSON.parse(fs.readFileSync('intelligence/learning/decision-ledger.json','utf8'));
          if (stack.readyForManualInterpretation !== true) throw new Error('Cognitive Stack not ready');
          if (stack.operatingContract?.executionAuthority !== 'none') throw new Error('Execution authority changed');
          if (learning.status !== 'ready') throw new Error(`Learning not ready: ${learning.status}`);
          if (learning.source?.cognitiveChainHash !== stack.integrity?.chainHash) throw new Error('Learning/Cognitive chain mismatch');
          if (learning.source?.decisionLedgerHash !== ledger.integrity?.ledgerHash) throw new Error('Learning/Decision Ledger mismatch');
          if (stack.chain?.groundedBrain?.sha256 && stack.chain.groundedBrain.sha256 !== sha(brainPath)) throw new Error('Brain/Cognitive byte binding mismatch');
          if ((learning.activeCases ?? []).length !== learning.summary?.activeCaseCount) throw new Error('Learning active case count mismatch');
          console.log('Learning → Cognitive → Decision binding PASS', {
            learningGeneratedAt: learning.generatedAt,
            cognitiveChainHash: stack.integrity.chainHash,
            activeCases: learning.summary?.activeCaseCount,
            ownerDecisions: ledger.decisionCount
          });
          NODE

      - name: Snapshot prior reviewed Proposal packet
        shell: bash
        run: |
          set -euo pipefail
          git show HEAD:intelligence/proposals/proposal-queue.json > /tmp/proposal-queue.previous.json
          git show HEAD:intelligence/proposals/proposal-brief.md > /tmp/proposal-brief.previous.md
          git show HEAD:intelligence/proposals/proposal-eval.json > /tmp/proposal-eval.previous.json
          git show HEAD:intelligence/proposals/proposal-decision-eval.json > /tmp/proposal-decision-eval.previous.json
          test -s /tmp/proposal-queue.previous.json
          test -s /tmp/proposal-brief.previous.md
          test -s /tmp/proposal-eval.previous.json
          test -s /tmp/proposal-decision-eval.previous.json

      - name: Build machine-readable Proposal Work Queue
        run: node intelligence/proposals/proposal-engine.mjs

      - name: Reflect owner Decision Memory into Proposal states
        run: node intelligence/proposals/proposal-decision-bridge.mjs

      - name: Independent Proposal reviewer
        run: node intelligence/proposals/independent-proposal-reviewer.mjs

      - name: Independent Decision → Proposal reviewer
        run: node intelligence/proposals/independent-proposal-decision-reviewer.mjs

      - name: Verify queue remains non-executable
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('fs');
          const q = JSON.parse(fs.readFileSync('intelligence/proposals/proposal-queue.json','utf8'));
          const e = JSON.parse(fs.readFileSync('intelligence/proposals/proposal-eval.json','utf8'));
          const d = JSON.parse(fs.readFileSync('intelligence/proposals/proposal-decision-eval.json','utf8'));
          if (e.status !== 'pass') throw new Error('Independent Proposal reviewer did not PASS');
          if (d.status !== 'pass') throw new Error('Independent Decision → Proposal reviewer did not PASS');
          if (q.constraints?.noProductionExecution !== true || q.constraints?.noAutomaticCodeChanges !== true || q.constraints?.noAutomaticApprovals !== true) {
            throw new Error('Proposal queue crossed mutation boundary');
          }
          if (q.decisionBridge?.productionMutationAuthorized !== false || q.decisionBridge?.executionAuthority !== 'none') {
            throw new Error('Decision Bridge crossed production/execution boundary');
          }
          for (const p of q.proposals ?? []) {
            if (p.boundaries?.automaticExecution !== false || p.boundaries?.automaticApproval !== false || p.boundaries?.humanApprovalRequired !== true) {
              throw new Error(`Unsafe proposal ${p.proposalId}`);
            }
            if (p.state === 'APPROVED' && p.decisionBinding?.authority !== 'human-owner') {
              throw new Error(`APPROVED proposal lacks exact owner Decision Memory: ${p.proposalId}`);
            }
          }
          console.log('Proposal v0.2 safety boundary PASS', q.summary);
          NODE
          git diff --check

      - name: Apply Proposal material-change gate
        shell: bash
        run: |
          set +e
          node intelligence/reliability/proposal-material-change-definition-proof.mjs --gate /tmp/proposal-queue.previous.json intelligence/proposals/proposal-queue.json
          code=$?
          set -e
          if [ "$code" -eq 10 ]; then
            git restore --source=HEAD -- intelligence/proposals/proposal-queue.json intelligence/proposals/proposal-brief.md intelligence/proposals/proposal-eval.json intelligence/proposals/proposal-decision-eval.json
            echo "No material Proposal delta; preserving prior reviewed artifact bytes."
          elif [ "$code" -ne 0 ]; then
            exit "$code"
          fi

      - name: Publish Proposal state safely
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "The Holding Proposal Engine"
          git config user.email "proposal-engine@theholding.ai"

          GENERATED=(
            "intelligence/proposals/proposal-queue.json"
            "intelligence/proposals/proposal-brief.md"
            "intelligence/proposals/proposal-eval.json"
            "intelligence/proposals/proposal-decision-eval.json"
          )

          stage_generated() {
            git add "${GENERATED[@]}"
            staged_bad="$(git diff --cached --name-only | grep -Ev '^intelligence/proposals/(proposal-queue\.json|proposal-brief\.md|proposal-eval\.json|proposal-decision-eval\.json)$' || true)"
            if [ -n "$staged_bad" ]; then
              echo "ERROR: Proposal workflow attempted to stage files outside generated-state boundary:"
              echo "$staged_bad"
              exit 1
            fi
          }

          verify_and_rebuild() {
            node intelligence/proposals/proposal-release-guard.mjs
            node intelligence/proposals/proposal-engine.mjs
            node intelligence/proposals/proposal-decision-bridge.mjs
            node intelligence/proposals/independent-proposal-reviewer.mjs
            node intelligence/proposals/independent-proposal-decision-reviewer.mjs
            node - <<'NODE'
          const fs = require('fs');
          const q = JSON.parse(fs.readFileSync('intelligence/proposals/proposal-queue.json','utf8'));
          const e = JSON.parse(fs.readFileSync('intelligence/proposals/proposal-eval.json','utf8'));
          const d = JSON.parse(fs.readFileSync('intelligence/proposals/proposal-decision-eval.json','utf8'));
          if (e.status !== 'pass' || d.status !== 'pass') throw new Error('Proposal reviewers did not PASS after rebase');
          if (q.constraints?.noProductionExecution !== true || q.constraints?.noAutomaticCodeChanges !== true || q.constraints?.noAutomaticApprovals !== true) throw new Error('Proposal mutation boundary changed after rebase');
          if (q.decisionBridge?.productionMutationAuthorized !== false || q.decisionBridge?.executionAuthority !== 'none') throw new Error('Decision Bridge authority changed after rebase');
          NODE
            git diff --check
          }

          stage_generated
          if git diff --cached --quiet; then
            echo "No Proposal state changes to publish."
            exit 0
          fi
          git commit -m "intelligence: refresh decision-bound proposal work queue"

          for attempt in 1 2 3; do
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "Proposal publish conflict; refusing to guess."
              exit 1
            fi

            # Rebuild after every rebase so Proposal state is bound to the exact
            # current Learning/Cognitive/Decision bytes, not a stale snapshot.
            verify_and_rebuild
            stage_generated
            if ! git diff --cached --quiet; then
              git commit --amend --no-edit
            fi

            if git push origin HEAD:main; then
              git fetch origin main
              test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
              echo "Verified decision-bound Proposal Work Queue on remote main."
              exit 0
            fi
            echo "Main moved during push; retrying ($attempt/3)..."
          done

          echo "ERROR: unable to publish Proposal Work Queue after retries"
          exit 1
