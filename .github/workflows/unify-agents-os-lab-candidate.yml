name: The Holding · Unified Agents OS Lab Candidate

on:
  push:
    branches: [agents/unified-os-lab-20260814]
    paths:
      - verification/unify-agents-os-lab-v0.1.mjs
      - .github/workflows/unify-agents-os-lab-candidate.yml

permissions:
  contents: write

concurrency:
  group: unified-agents-os-lab-candidate
  cancel-in-progress: true

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout candidate branch
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
        with:
          ref: agents/unified-os-lab-20260814
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'

      - name: Validate integrator syntax
        run: node --check verification/unify-agents-os-lab-v0.1.mjs

      - name: Build unified OS Lab surface
        run: node verification/unify-agents-os-lab-v0.1.mjs

      - name: Validate resulting surface
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re
          html = Path('agents/index.html').read_text()
          legacy = Path('agents/console/index.html').read_text()
          unique = [
              'id="ask-the-holding"','id="console"','id="messages"','id="askForm"',
              'id="observerShell"','id="cognitiveShell"',
              '/agents/console/app.js?v=0.4','/agents/console/safety.js?v=0.1'
          ]
          for marker in unique:
              assert html.count(marker) == 1, (marker, html.count(marker))
          for marker in ['Meet the Agents','Agent Dialogue Preview','Intelligence Infrastructure','The Holding Observer','The Holding Cognitive Stack']:
              assert marker in html, marker
          ids = re.findall(r'\bid=["\']([^"\']+)["\']', html)
          dupes = sorted({x for x in ids if ids.count(x) > 1})
          assert not dupes, f'duplicate ids: {dupes}'
          order = [html.index('id="ask-the-holding"'), html.index('id="observer"'), html.index('id="cognitive"'), html.index('id="agents"'), html.index('id="demo"'), html.index('id="knowledge"')]
          assert order == sorted(order), order
          assert '/agents/#ask-the-holding' in legacy
          assert 'Ask The Holding.' in legacy and 'Live knowledge console' in legacy
          assert 'LEARNING_INTAKE_ENABLED' not in html, 'UI must not redefine server learning activation'
          print('Unified Agents OS Lab semantic checks: PASS')
          PY

      - name: Enforce candidate mutation allowlist
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only)"
          printf 'Generated changes:\n%s\n' "$changed"
          [[ "$changed" == $'agents/console/index.html\nagents/index.html' || "$changed" == $'agents/index.html\nagents/console/index.html' ]] || {
            echo 'Unexpected generated file set.' >&2
            exit 1
          }

      - name: Publish candidate branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'The Holding Candidate Integrator'
          git config user.email 'candidate-integrator@theholding.ai'
          git add agents/index.html agents/console/index.html
          git diff --cached --check
          git commit -m 'Unify Ask The Holding into Agents OS Lab'
          git push origin HEAD:agents/unified-os-lab-20260814

      - name: Summary
        run: |
          echo 'Unified /agents/ surface prepared.'
          echo 'Ask The Holding v0.4 is canonical on /agents/#ask-the-holding.'
          echo '/agents/console/ is redirect-only compatibility.'
          echo 'No execution authority or persistent learning was enabled.'
