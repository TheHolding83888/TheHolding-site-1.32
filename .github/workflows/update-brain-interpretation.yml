name: "The Holding Brain · Controlled Interpretation"

on:
  workflow_dispatch:
  schedule:
    - cron: "17 7 * * *"

permissions:
  contents: write

concurrency:
  group: the-holding-brain-controlled-interpretation
  cancel-in-progress: false

jobs:
  interpret:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout canonical state
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Preflight controlled interpretation
        shell: bash
        run: |
          set -euo pipefail

          test -s intelligence/brain-intelligence.json
          test -s intelligence/brain-llm-interpreter.mjs
          test -s intelligence/brain-interpretation-policy.json
          test -s intelligence/brain-interpretation-schema.json
          test -s intelligence/brain-interpretation-instructions.md

          node --check intelligence/brain-llm-interpreter.mjs
          node intelligence/brain-llm-interpreter.mjs --self-test

      - name: Require OpenAI API secret
        shell: bash
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          set -euo pipefail

          if [ -z "${OPENAI_API_KEY:-}" ]; then
            echo "ERROR: OPENAI_API_KEY repository secret is missing."
            echo "Add a dedicated OpenAI API project key as GitHub Actions secret OPENAI_API_KEY."
            exit 1
          fi

          echo "OPENAI_API_KEY is present (value not printed)."

      - name: Interpret deterministic Brain packet
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: node intelligence/brain-llm-interpreter.mjs

      - name: Validate controlled interpretation
        shell: bash
        run: |
          set -euo pipefail

          node intelligence/brain-llm-interpreter.mjs --verify-current

          node - <<'NODE'
          const fs = require('fs');

          const output = JSON.parse(
            fs.readFileSync('intelligence/brain-interpretation.json', 'utf8')
          );
          const evalReport = JSON.parse(
            fs.readFileSync('intelligence/brain-interpretation-eval.json', 'utf8')
          );
          const history = JSON.parse(
            fs.readFileSync('intelligence/brain-interpretation-history.json', 'utf8')
          );

          if (output.version !== '0.2-controlled-model-interpretation') {
            throw new Error(`Unexpected output version: ${output.version}`);
          }

          if (output.interpreterVersion !== '0.2-controlled-openai-interpreter') {
            throw new Error(`Unexpected interpreter version: ${output.interpreterVersion}`);
          }

          if (evalReport.status !== 'pass') {
            throw new Error('Interpretation eval did not PASS');
          }

          if (output.constraints?.toolsEnabled !== false) {
            throw new Error('Tools unexpectedly enabled');
          }

          if (output.constraints?.proposalOnly !== true) {
            throw new Error('Interpretation escaped proposal-only');
          }

          const forbidden = [
            'autonomousCapitalActionAllowed',
            'autonomousRepositoryCodeMutationAllowed',
            'autonomousMethodologyMutationAllowed',
            'sourceDataMutationAllowed',
            'workflowPlaneMutationAllowed',
          ];

          for (const key of forbidden) {
            if (output.constraints?.[key] !== false) {
              throw new Error(`Forbidden capability enabled: ${key}`);
            }
          }

          if (!Array.isArray(output.interpretation?.caseInterpretations)) {
            throw new Error('caseInterpretations missing');
          }

          for (const item of output.interpretation.caseInterpretations) {
            if (!item.evidenceIds?.length) {
              throw new Error(`Interpretation case ${item.caseId} has no evidence`);
            }
            if (item.actionMode !== 'proposal-only') {
              throw new Error(`Interpretation case ${item.caseId} escaped proposal-only`);
            }
            if (!item.deterministicAction) {
              throw new Error(`Interpretation case ${item.caseId} lost deterministic action`);
            }
          }

          if (history.version !== '0.2-interpretation-history') {
            throw new Error(`Unexpected interpretation history version: ${history.version}`);
          }

          console.log('Controlled Brain interpretation PASS', {
            model: output.provider?.modelReturned,
            eval: evalReport.status,
            cases: output.interpretation.caseInterpretations.length,
            crossCaseInsights: output.interpretation.crossCaseInsights.length,
            nextBestCaseId: output.interpretation.executive.nextBestCaseId,
            humanReviewRequired: output.interpretation.humanReview.required,
            historyObservations: history.observationCount,
          });
          NODE

          git diff --check

      - name: Publish controlled interpretation safely
        shell: bash
        run: |
          set -euo pipefail

          GENERATED=(
            "intelligence/brain-interpretation.json"
            "intelligence/brain-interpretation-history.json"
            "intelligence/brain-interpretation-brief.md"
            "intelligence/brain-interpretation-eval.json"
          )

          for f in "${GENERATED[@]}"; do
            test -s "$f"
          done

          git config user.name "The Holding Brain"
          git config user.email "brain@theholding.ai"

          git add "${GENERATED[@]}"

          staged_bad="$(
            git diff --cached --name-only |
              grep -Ev '^intelligence/(brain-interpretation\.json|brain-interpretation-history\.json|brain-interpretation-brief\.md|brain-interpretation-eval\.json)$' ||
              true
          )"

          if [ -n "$staged_bad" ]; then
            echo "ERROR: Controlled interpreter staged files outside its output boundary:"
            echo "$staged_bad"
            exit 1
          fi

          if git diff --cached --quiet; then
            echo "No controlled interpretation change to publish."
            exit 0
          fi

          git commit -m "intelligence: extend controlled Brain interpretation"

          for attempt in 1 2 3; do
            git fetch origin main

            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "Interpretation publish conflict; refusing to guess."
              exit 1
            fi

            # Critical provenance gate:
            # the committed interpretation must still match the exact deterministic
            # Brain bytes + policy + schema + instructions after rebase.
            node intelligence/brain-llm-interpreter.mjs --verify-current

            if git push origin HEAD:main; then
              git fetch origin main

              if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
                echo "ERROR: pushed interpretation commit is not current remote main."
                exit 1
              fi

              echo "Verified controlled Brain interpretation on remote main."
              exit 0
            fi

            echo "Main moved during push; retrying ($attempt/3)..."
            sleep $((attempt * 2))
          done

          echo "ERROR: unable to publish controlled Brain interpretation after 3 attempts."
          exit 1
