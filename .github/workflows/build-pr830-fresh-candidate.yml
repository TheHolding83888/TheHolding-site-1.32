name: Build PR830 Fresh Runtime Candidate

on:
  push:
    branches:
      - diagnostic/pr830-runtime-matrix-20260915
    paths:
      - '.github/workflows/build-pr830-fresh-candidate.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Rebuild candidate from latest main
        shell: bash
        run: |
          set -euo pipefail
          git fetch --prune origin main fix/ve33-rpc-runtime-fresh-20260915
          git config user.name 'TheHolding83888'
          git config user.email '270993406+TheHolding83888@users.noreply.github.com'
          git checkout -B fix/ve33-rpc-runtime-fresh-candidate-20260915 origin/main
          git checkout origin/fix/ve33-rpc-runtime-fresh-20260915 -- \
            .github/workflows/verify-ve33-accounting.yml \
            reporting/ve33-accounting-evidence.mjs \
            reporting/ve33-accounting-evidence-validation.mjs \
            reporting/ve33-unresolved-settlement-diagnostic.mjs

          python - <<'PY'
          from pathlib import Path

          src=Path('reporting/ve33-accounting-evidence.mjs')
          s=src.read_text()
          old="settlementRangeHints:{'mainnet.base.org':2000},settlementRequestSpacingMs:200,"
          new="settlementRangeHints:{'mainnet.base.org':2000},settlementRequestSpacingMs:180,"
          assert s.count(old)==1, ('aerodrome spacing anchor', s.count(old))
          s=s.replace(old,new,1)
          old="rpcEnv:'OPTIMISM_RPC_URL',rpcFallbacks:['https://optimism-rpc.publicnode.com','https://mainnet.optimism.io'],\n    votingEscrow:"
          new="rpcEnv:'OPTIMISM_RPC_URL',rpcFallbacks:['https://optimism-rpc.publicnode.com','https://mainnet.optimism.io'],\n    settlementRequestSpacingMs:200,\n    votingEscrow:"
          assert s.count(old)==1, ('velodrome spacing anchor', s.count(old))
          s=s.replace(old,new,1)
          src.write_text(s)

          wf=Path('.github/workflows/verify-ve33-accounting.yml')
          w=wf.read_text()
          assert w.count("VE33_STATE_READ_CONCURRENCY: '2'")==1
          assert w.count("VE33_SETTLEMENT_CONCURRENCY: '2'")==1
          w=w.replace("VE33_STATE_READ_CONCURRENCY: '2'","VE33_STATE_READ_CONCURRENCY: '4'",1)
          w=w.replace("VE33_SETTLEMENT_CONCURRENCY: '2'","VE33_SETTLEMENT_CONCURRENCY: '4'",1)
          wf.write_text(w)
          PY

          node --check reporting/ve33-accounting-evidence.mjs
          node --check reporting/ve33-accounting-evidence-validation.mjs
          node --check reporting/ve33-unresolved-settlement-diagnostic.mjs
          git diff --check
          git status --short
          git add \
            .github/workflows/verify-ve33-accounting.yml \
            reporting/ve33-accounting-evidence.mjs \
            reporting/ve33-accounting-evidence-validation.mjs \
            reporting/ve33-unresolved-settlement-diagnostic.mjs
          git commit -m 'reliability: close ve33 runtime on fresh main'
          git push origin HEAD:refs/heads/fix/ve33-rpc-runtime-fresh-candidate-20260915
          echo "candidate_head=$(git rev-parse HEAD)"
          echo "candidate_base=$(git rev-parse HEAD^)"
