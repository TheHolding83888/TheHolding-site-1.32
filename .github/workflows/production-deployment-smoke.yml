name: The Holding Production Deployment Smoke

on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  checks: read
  pull-requests: read

concurrency:
  group: production-smoke-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  cloudflare-preview-smoke:
    if: github.event_name == 'pull_request_target'
    name: Cloudflare preview homepage smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      HEAD_REF: ${{ github.event.pull_request.head.ref }}
      WORKERS_SUBDOMAIN: allthewoooorld
    steps:
      - name: Wait for successful Cloudflare preview build
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 45); do
            row="$(gh api -H 'Accept: application/vnd.github+json' "/repos/$REPO/commits/$HEAD_SHA/check-runs" \
              --jq '.check_runs[] | select(.name == "Workers Builds: theholdingprotocol") | [.status, (.conclusion // "")] | @tsv' | tail -n1 || true)"
            if [[ "$row" == $'completed\tsuccess' ]]; then
              echo "Cloudflare preview build is GREEN."
              exit 0
            fi
            if [[ "$row" == completed$'\t'* && "$row" != $'completed\tsuccess' ]]; then
              echo "Cloudflare preview build failed: $row" >&2
              exit 1
            fi
            sleep 10
          done
          echo 'Timed out waiting for Cloudflare preview build.' >&2
          exit 1

      - name: Resolve and verify exact Cloudflare preview surface
        id: preview
        shell: bash
        run: |
          set -euo pipefail
          SUMMARY="$(gh api -H 'Accept: application/vnd.github+json' "/repos/$REPO/commits/$HEAD_SHA/check-runs" \
            --jq '.check_runs[] | select(.name == "Workers Builds: theholdingprotocol" and .conclusion == "success") | .output.summary' | tail -n1)"
          VERSION_ID="$(printf '%s' "$SUMMARY" | grep -Eo 'Version ID: [0-9a-f-]{36}' | awk '{print $3}' | tail -n1 || true)"
          BRANCH_SLUG="$(printf '%s' "$HEAD_REF" | tr '[:upper:]_/' '[:lower:]--')"
          CANDIDATES=("https://${BRANCH_SLUG}-theholdingprotocol.${WORKERS_SUBDOMAIN}.workers.dev")
          if [[ -n "$VERSION_ID" ]]; then
            CANDIDATES+=("https://${VERSION_ID:0:8}-theholdingprotocol.${WORKERS_SUBDOMAIN}.workers.dev")
          fi

          for URL in "${CANDIDATES[@]}"; do
            echo "Testing preview candidate: $URL"
            if ! curl -fsSL --connect-timeout 10 --max-time 30 --retry 2 --retry-delay 2 "$URL/?holding_boundary_smoke=$HEAD_SHA" -o /tmp/home.html; then
              continue
            fi
            if ! grep -Eqi '<title>[^<]*TheHolding\.ai' /tmp/home.html; then
              continue
            fi
            if ! grep -Eqi '<link[[:space:]]+rel=["'"']canonical["'"'][[:space:]]+href=["'"']https://theholding\.ai/["'"']' /tmp/home.html; then
              continue
            fi
            if grep -Eqi 'Ask The Holding\.|KNOWLEDGE ROUTER|Live knowledge console' /tmp/home.html; then
              echo "Preview root candidate serves Console: $URL" >&2
              continue
            fi
            if ! curl -fsSL --connect-timeout 10 --max-time 30 --retry 2 --retry-delay 2 "$URL/agents/console/?holding_boundary_smoke=$HEAD_SHA" -o /tmp/console.html; then
              continue
            fi
            if ! grep -Fqi 'Ask The Holding.' /tmp/console.html; then
              continue
            fi
            echo "url=$URL" >> "$GITHUB_OUTPUT"
            echo "Cloudflare preview surface contract is GREEN: $URL"
            exit 0
          done

          echo 'No Cloudflare preview candidate satisfied the canonical homepage + isolated Console contract.' >&2
          exit 1

  production-homepage-smoke:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    name: Production homepage smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      HEAD_SHA: ${{ github.sha }}
    steps:
      - name: Wait for successful Cloudflare production build
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 45); do
            row="$(gh api -H 'Accept: application/vnd.github+json' "/repos/$REPO/commits/$HEAD_SHA/check-runs" \
              --jq '.check_runs[] | select(.name == "Workers Builds: theholdingprotocol") | [.status, (.conclusion // "")] | @tsv' | tail -n1 || true)"
            if [[ "$row" == $'completed\tsuccess' ]]; then
              echo "Cloudflare production build is GREEN."
              exit 0
            fi
            if [[ "$row" == completed$'\t'* && "$row" != $'completed\tsuccess' ]]; then
              echo "Cloudflare production build failed: $row" >&2
              exit 1
            fi
            sleep 10
          done
          echo 'Timed out waiting for Cloudflare production build.' >&2
          exit 1

      - name: Verify live production root and Console isolation
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 5 --retry-delay 3 -H 'Cache-Control: no-cache' "https://theholding.ai/?holding_boundary_smoke=$HEAD_SHA" -o /tmp/home.html
          grep -Eqi '<title>[^<]*TheHolding\.ai' /tmp/home.html
          grep -Eqi '<link[[:space:]]+rel=["'"']canonical["'"'][[:space:]]+href=["'"']https://theholding\.ai/["'"']' /tmp/home.html
          if grep -Eqi 'Ask The Holding\.|KNOWLEDGE ROUTER|Live knowledge console' /tmp/home.html; then
            echo 'PRODUCTION INCIDENT: theholding.ai root is serving Console.' >&2
            exit 1
          fi
          curl -fsSL --retry 5 --retry-delay 3 -H 'Cache-Control: no-cache' "https://theholding.ai/agents/console/?holding_boundary_smoke=$HEAD_SHA" -o /tmp/console.html
          grep -Fqi 'Ask The Holding.' /tmp/console.html
          echo 'Live production surface contract is GREEN.'
