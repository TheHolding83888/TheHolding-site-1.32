name: The Holding Production Deployment Smoke

on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  checks: read
  pull-requests: read

concurrency:
  group: production-smoke-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  cloudflare-preview-build-gate:
    if: github.event_name == 'pull_request_target'
    name: Cloudflare preview build gate
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Require Cloudflare build for deployment-sensitive changes
        shell: bash
        run: |
          set -euo pipefail

          changed="$(gh api --paginate -H 'Accept: application/vnd.github+json' "/repos/$REPO/pulls/$PR_NUMBER/files?per_page=100" --jq '.[].filename')"
          printf 'Changed files:\n%s\n' "$changed"

          if ! printf '%s\n' "$changed" | grep -Eq '(^|/)wrangler[^/]*\.jsonc?$|^worker/|^index\.html$|^agents/|^companies/index\.html$'; then
            echo 'No deployment-sensitive production surface changed; Cloudflare build gate is not applicable.'
            exit 0
          fi

          echo 'Deployment-sensitive change detected; requiring successful Cloudflare non-production version upload.'
          for attempt in $(seq 1 45); do
            payload="$(gh api -H 'Accept: application/vnd.github+json' "/repos/$REPO/commits/$HEAD_SHA/check-runs")"
            row="$(printf '%s' "$payload" | jq -r '.check_runs[] | select(.name == "Workers Builds: theholdingprotocol") | [.status, (.conclusion // "")] | @tsv' | tail -n1 || true)"
            if [[ "$row" == $'completed\tsuccess' ]]; then
              VERSION_ID="$(printf '%s' "$payload" | jq -r '[.check_runs[] | select(.name == "Workers Builds: theholdingprotocol" and .conclusion == "success") | .output.summary | capture("Version ID: (?<id>[0-9a-f-]{36})").id] | last // empty')"
              if [[ ! "$VERSION_ID" =~ ^[0-9a-f-]{36}$ ]]; then
                echo 'Cloudflare build succeeded but did not expose a valid Version ID.' >&2
                exit 1
              fi
              echo "Cloudflare non-production version upload is GREEN."
              echo "Cloudflare Version ID: $VERSION_ID"
              echo 'HTTP Preview URL is intentionally not required because Cloudflare does not generate Preview URLs for Workers implementing Durable Objects. Runtime surface is verified after merge by Production homepage smoke.'
              exit 0
            fi
            if [[ "$row" == completed$'\t'* && "$row" != $'completed\tsuccess' ]]; then
              echo "Cloudflare non-production build failed: $row" >&2
              exit 1
            fi
            sleep 10
          done
          echo 'Timed out waiting for required Cloudflare non-production build.' >&2
          exit 1

  production-homepage-smoke:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    name: Production homepage smoke
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      HEAD_SHA: ${{ github.sha }}
    steps:
      - name: Wait for successful Cloudflare production build
        shell: bash
        run: |
          set -euo pipefail

          cloudflare_state() {
            local sha="$1"
            gh api -H 'Accept: application/vnd.github+json' "/repos/$REPO/commits/$sha/check-runs" \
              --jq '.check_runs[] | select(.name == "Workers Builds: theholdingprotocol") | [.status, (.conclusion // "")] | @tsv' | tail -n1 || true
          }

          for attempt in $(seq 1 45); do
            row="$(cloudflare_state "$HEAD_SHA")"
            if [[ "$row" == $'completed\tsuccess' ]]; then
              echo "Cloudflare production build is GREEN for trigger SHA $HEAD_SHA."
              exit 0
            fi
            if [[ "$row" == completed$'\t'* && "$row" != $'completed\tsuccess' ]]; then
              echo "Cloudflare production build failed for trigger SHA $HEAD_SHA: $row" >&2
              exit 1
            fi

            main_sha="$(gh api -H 'Accept: application/vnd.github+json' "/repos/$REPO/branches/main" --jq '.commit.sha')"
            if [[ -n "$main_sha" && "$main_sha" != "$HEAD_SHA" ]]; then
              ancestry="$(gh api -H 'Accept: application/vnd.github+json' "/repos/$REPO/compare/$HEAD_SHA...$main_sha" --jq '.status' 2>/dev/null || true)"
              if [[ "$ancestry" == "ahead" || "$ancestry" == "identical" ]]; then
                main_row="$(cloudflare_state "$main_sha")"
                if [[ "$main_row" == $'completed\tsuccess' ]]; then
                  echo "Cloudflare production build is GREEN for descendant main SHA $main_sha containing trigger SHA $HEAD_SHA."
                  exit 0
                fi
                if [[ "$main_row" == completed$'\t'* && "$main_row" != $'completed\tsuccess' ]]; then
                  echo "Cloudflare production build failed for descendant main SHA $main_sha: $main_row" >&2
                  exit 1
                fi
              fi
            fi

            sleep 10
          done
          echo 'Timed out waiting for Cloudflare production build on trigger SHA or a verified descendant main SHA.' >&2
          exit 1

      - name: Verify live production root and unified OS Lab
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 18); do
            if curl -fsSL --connect-timeout 10 --max-time 30 --retry 2 --retry-delay 2 -H 'Cache-Control: no-cache' "https://theholding.ai/?holding_boundary_smoke=$HEAD_SHA" -o /tmp/home.html \
              && grep -Fqi '<title>TheHolding.ai' /tmp/home.html \
              && grep -Fqi '<link rel="canonical" href="https://theholding.ai/">' /tmp/home.html \
              && ! grep -Eqi 'Ask The Holding\.|KNOWLEDGE ROUTER|Live knowledge console' /tmp/home.html \
              && curl -fsSL --connect-timeout 10 --max-time 30 --retry 2 --retry-delay 2 -H 'Cache-Control: no-cache' "https://theholding.ai/agents/?holding_boundary_smoke=$HEAD_SHA" -o /tmp/agents.html \
              && grep -Fqi 'id="ask-the-holding"' /tmp/agents.html \
              && grep -Fqi 'Ask The Holding' /tmp/agents.html \
              && grep -Fqi 'THE HOLDING OBSERVER' /tmp/agents.html \
              && grep -Fqi 'Cognitive Stack' /tmp/agents.html \
              && curl -fsS --connect-timeout 10 --max-time 30 --retry 2 --retry-delay 2 -H 'Cache-Control: no-cache' "https://theholding.ai/agents/console/?holding_boundary_smoke=$HEAD_SHA" -o /tmp/console.html \
              && grep -Fqi 'Moved to The Holding OS Lab' /tmp/console.html \
              && grep -Fqi 'url=/agents/#ask-the-holding' /tmp/console.html \
              && grep -Fqi '<link rel="canonical" href="https://theholding.ai/agents/">' /tmp/console.html; then
                echo 'Live production surface contract is GREEN: root isolated, unified OS Lab live, legacy Console redirected.'
                exit 0
            fi
            echo "Production surface not ready or invalid (attempt $attempt/18)."
            sleep 5
          done

          echo 'PRODUCTION INCIDENT: canonical homepage + unified OS Lab + legacy Console redirect contract failed.' >&2
          exit 1
