name: The Holding Production Deployment Smoke

on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  checks: read
  pull-requests: read

concurrency:
  group: production-smoke-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  cloudflare-preview-build-gate:
    if: github.event_name == 'pull_request_target'
    name: Cloudflare preview build gate
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Require successful Cloudflare non-production version upload
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 45); do
            payload="$(gh api -H 'Accept: application/vnd.github+json' "/repos/$REPO/commits/$HEAD_SHA/check-runs")"
            row="$(printf '%s' "$payload" | jq -r '.check_runs[] | select(.name == "Workers Builds: theholdingprotocol") | [.status, (.conclusion // "")] | @tsv' | tail -n1 || true)"
            if [[ "$row" == $'completed\tsuccess' ]]; then
              VERSION_ID="$(printf '%s' "$payload" | jq -r '[.check_runs[] | select(.name == "Workers Builds: theholdingprotocol" and .conclusion == "success") | .output.summary | capture("Version ID: (?<id>[0-9a-f-]{36})").id] | last // empty')"
              if [[ ! "$VERSION_ID" =~ ^[0-9a-f-]{36}$ ]]; then
                echo 'Cloudflare build succeeded but did not expose a valid Version ID.' >&2
                exit 1
              fi
              echo "Cloudflare non-production version upload is GREEN."
              echo "Cloudflare Version ID: $VERSION_ID"
              echo 'HTTP Preview URL is intentionally not required: Cloudflare does not generate Preview URLs for Workers implementing Durable Objects. Runtime surface is verified after merge by Production homepage smoke.'
              exit 0
            fi
            if [[ "$row" == completed$'\t'* && "$row" != $'completed\tsuccess' ]]; then
              echo "Cloudflare non-production build failed: $row" >&2
              exit 1
            fi
            sleep 10
          done
          echo 'Timed out waiting for Cloudflare non-production build.' >&2
          exit 1

  production-homepage-smoke:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    name: Production homepage smoke
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      HEAD_SHA: ${{ github.sha }}
    steps:
      - name: Wait for successful Cloudflare production build
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 45); do
            row="$(gh api -H 'Accept: application/vnd.github+json' "/repos/$REPO/commits/$HEAD_SHA/check-runs" \
              --jq '.check_runs[] | select(.name == "Workers Builds: theholdingprotocol") | [.status, (.conclusion // "")] | @tsv' | tail -n1 || true)"
            if [[ "$row" == $'completed\tsuccess' ]]; then
              echo "Cloudflare production build is GREEN."
              exit 0
            fi
            if [[ "$row" == completed$'\t'* && "$row" != $'completed\tsuccess' ]]; then
              echo "Cloudflare production build failed: $row" >&2
              exit 1
            fi
            sleep 10
          done
          echo 'Timed out waiting for Cloudflare production build.' >&2
          exit 1

      - name: Verify live production root and Console isolation
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 18); do
            if curl -fsSL --connect-timeout 10 --max-time 30 --retry 2 --retry-delay 2 -H 'Cache-Control: no-cache' "https://theholding.ai/?holding_boundary_smoke=$HEAD_SHA" -o /tmp/home.html \
              && grep -Fqi '<title>TheHolding.ai' /tmp/home.html \
              && grep -Fqi '<link rel="canonical" href="https://theholding.ai/">' /tmp/home.html \
              && ! grep -Eqi 'Ask The Holding\.|KNOWLEDGE ROUTER|Live knowledge console' /tmp/home.html \
              && curl -fsSL --connect-timeout 10 --max-time 30 --retry 2 --retry-delay 2 -H 'Cache-Control: no-cache' "https://theholding.ai/agents/console/?holding_boundary_smoke=$HEAD_SHA" -o /tmp/console.html \
              && grep -Fqi 'Ask The Holding.' /tmp/console.html; then
                echo 'Live production surface contract is GREEN.'
                exit 0
            fi
            echo "Production surface not ready or invalid (attempt $attempt/18)."
            sleep 5
          done

          echo 'PRODUCTION INCIDENT: canonical homepage + isolated Console contract failed.' >&2
          exit 1
