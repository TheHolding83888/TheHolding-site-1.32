name: "Verify Intelligence Progress · live cognitive integrity"

on:
  pull_request:
    paths:
      - 'intelligence/intelligence-progress-engine.mjs'
      - 'intelligence/cognitive-release-guard.mjs'
      - 'intelligence/cognitive-stack-verifier.mjs'
      - 'intelligence/cognitive-stack-release.json'
      - 'intelligence/intelligence-progress.json'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Build THI from live canonical guards
        run: |
          set -euo pipefail
          node --check intelligence/intelligence-progress-engine.mjs
          node intelligence/intelligence-progress-engine.mjs --self-test
          node intelligence/intelligence-progress-engine.mjs

      - name: Require live guard parity and public-safe diagnostics
        run: |
          set -euo pipefail
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          import { spawnSync } from 'node:child_process';
          import { verifyCognitiveRelease } from './intelligence/cognitive-release-guard.mjs';

          const x = JSON.parse(fs.readFileSync('intelligence/intelligence-progress.json', 'utf8'));
          let expectedRelease = false;
          try { expectedRelease = verifyCognitiveRelease({ root: process.cwd() }).current === true; } catch (_) {}
          const current = spawnSync(process.execPath, [path.join(process.cwd(), 'intelligence/cognitive-stack-verifier.mjs'), '--verify-current'], { encoding: 'utf8' });
          const expectedEval = current.status === 0;

          if (x.engineVersion !== '0.2.1-live-cognitive-integrity-public-safe-thi-engine') throw new Error('unexpected THI engine version');
          if (x.metrics?.integrity?.cognitiveIntegritySource !== 'live-canonical-guards') throw new Error('THI cognitive integrity is not live-guard sourced');
          if (x.metrics?.reasoning?.releaseCoherent !== expectedRelease) throw new Error(`release coherence parity mismatch: THI=${x.metrics?.reasoning?.releaseCoherent} live=${expectedRelease}`);
          if (x.metrics?.integrity?.cognitiveEvalPass !== expectedEval) throw new Error(`cognitive eval parity mismatch: THI=${x.metrics?.integrity?.cognitiveEvalPass} live=${expectedEval}`);
          if (x.authority?.executionAuthority !== 'none' || x.authority?.executable !== false) throw new Error('THI authority drift');

          const diagnosticText = [
            x.metrics?.integrity?.releaseGuardError,
            x.metrics?.integrity?.cognitiveVerifierError
          ].filter(Boolean).join('\n');
          const forbidden = [
            /\/home\/runner\//i,
            /file:\/\/\//i,
            /[A-Za-z]:\\Users\\/i
          ];
          for (const pattern of forbidden) {
            if (pattern.test(diagnosticText)) throw new Error(`THI public diagnostic leaked local path class: ${pattern}`);
          }

          console.log('THI live cognitive integrity + public diagnostic safety PASS', {
            releaseCoherent: expectedRelease,
            cognitiveEvalPass: expectedEval,
            hasDiagnostic: diagnosticText.length > 0
          });
          NODE
          git diff --check
