name: Stage PR830 Cross Token Settlement Fix
on:
  push:
    branches:
      - diagnostic/pr830-runtime-matrix-20260915
    paths:
      - '.github/workflows/stage-pr830-proven-other-tokenid.yml'
permissions:
  contents: write
jobs:
  stage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/ve33-rpc-runtime-fresh-20260915
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock ethers@6
      - name: Apply proven-other-tokenId settlement semantics
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('reporting/ve33-accounting-evidence.mjs')
          s=p.read_text()
          old="export function decodeRewardClaimTokenId(args){return decodeRewardClaimAttribution(args).tokenId;}\n\nasync function rewardClaimSettlements({provider,settlementRouter,cfg,lane,fromBlock,toBlock}){"
          new="export function decodeRewardClaimTokenId(args){return decodeRewardClaimAttribution(args).tokenId;}\n\nexport function classifyRewardSettlementAttribution(attribution,expectedTokenId){\n  const decoded=attribution?.tokenId==null?null:String(attribution.tokenId);\n  if(decoded===null)return'unresolved';\n  return decoded===String(expectedTokenId)?'matched':'proven-other-token-id';\n}\n\nasync function rewardClaimSettlements({provider,settlementRouter,cfg,lane,fromBlock,toBlock}){"
          assert s.count(old)==1, s.count(old)
          s=s.replace(old,new,1)
          old="      const proof={\n        blockNumber:Number(log.blockNumber),transactionHash:String(log.transactionHash||''),logIndex:Number(log.index??0),\n        recipient,rewardToken:lane.rewardToken,amountRaw:amount.toString(),decodedTokenId:attribution.tokenId,\n        decodePath:attribution.path\n      };\n      if(attribution.tokenId!==String(lane.tokenId)){unresolved.push(proof);continue;}\n      total+=amount;\n      events.push(proof);"
          new="      const proof={\n        blockNumber:Number(log.blockNumber),transactionHash:String(log.transactionHash||''),logIndex:Number(log.index??0),\n        recipient,rewardToken:lane.rewardToken,amountRaw:amount.toString(),decodedTokenId:attribution.tokenId,\n        decodePath:attribution.path\n      };\n      const disposition=classifyRewardSettlementAttribution(attribution,lane.tokenId);\n      if(disposition==='unresolved'){unresolved.push(proof);continue;}\n      if(disposition==='proven-other-token-id')continue;\n      total+=amount;\n      events.push(proof);"
          assert s.count(old)==1, s.count(old)
          s=s.replace(old,new,1)
          p.write_text(s)
          p=Path('reporting/ve33-accounting-evidence-validation.mjs')
          s=p.read_text()
          old="decodeRewardClaimTokenId, decodeRewardClaimAttribution, trackedPositionDescriptors"
          new="decodeRewardClaimTokenId, decodeRewardClaimAttribution, classifyRewardSettlementAttribution, trackedPositionDescriptors"
          assert s.count(old)==1, s.count(old)
          s=s.replace(old,new,1)
          anchor="assert.equal(conflictingAttribution.tokenId,null);\nassert.equal(conflictingAttribution.path,'holder-multicall-conflicting-token-ids');\n"
          addition="assert.equal(conflictingAttribution.tokenId,null);\nassert.equal(conflictingAttribution.path,'holder-multicall-conflicting-token-ids');\nassert.equal(classifyRewardSettlementAttribution({tokenId:'64985',path:'voter-claimBribes'},'64985'),'matched');\nassert.equal(classifyRewardSettlementAttribution({tokenId:'69194',path:'voter-claimBribes'},'64985'),'proven-other-token-id');\nassert.equal(classifyRewardSettlementAttribution({tokenId:null,path:'voter-unmatched-calldata'},'64985'),'unresolved');\n"
          assert s.count(anchor)==1, s.count(anchor)
          s=s.replace(anchor,addition,1)
          p.write_text(s)
          PY
      - name: Validate exact bounded change
        run: |
          node --check reporting/ve33-accounting-evidence.mjs
          node reporting/ve33-accounting-evidence-validation.mjs
          git diff --check
          test "$(git diff --name-only | wc -l)" -eq 2
          git diff --name-only | grep -qx 'reporting/ve33-accounting-evidence.mjs'
          git diff --name-only | grep -qx 'reporting/ve33-accounting-evidence-validation.mjs'
      - name: Commit to PR branch
        run: |
          git config user.name 'TheHolding83888'
          git config user.email '270993406+TheHolding83888@users.noreply.github.com'
          git add reporting/ve33-accounting-evidence.mjs reporting/ve33-accounting-evidence-validation.mjs
          git commit -m 'accounting: ignore settlements proven to another veNFT'
          git push origin HEAD:fix/ve33-rpc-runtime-fresh-20260915
