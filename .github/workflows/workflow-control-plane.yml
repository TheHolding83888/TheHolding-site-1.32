name: "The Holding Reliability · Workflow Control Plane"

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/**"
      - "intelligence/reliability/workflow-control-plane*"
      - "intelligence/reliability/workflow-fanout*"
      - "intelligence/reliability/workflow-definition-diff*"
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - "intelligence/reliability/workflow-control-plane*"
      - "intelligence/reliability/workflow-fanout*"
      - "intelligence/reliability/workflow-definition-diff*"

permissions:
  contents: read

concurrency:
  group: workflow-control-plane-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Static control-plane preflight and canaries
        shell: bash
        run: |
          set -euo pipefail
          test -s intelligence/reliability/workflow-control-plane-policy.json
          test -s intelligence/reliability/workflow-control-plane-baseline.json
          test -s intelligence/reliability/workflow-control-plane.mjs
          test -s intelligence/reliability/workflow-control-plane-canary.mjs
          test -s intelligence/reliability/workflow-control-plane-enforce.mjs
          test -s intelligence/reliability/workflow-control-plane-enforce-canary.mjs
          test -s intelligence/reliability/workflow-fanout-policy.json
          test -s intelligence/reliability/workflow-fanout-baseline.json
          test -s intelligence/reliability/workflow-fanout-audit.mjs
          test -s intelligence/reliability/workflow-fanout-canary.mjs
          test -s intelligence/reliability/workflow-fanout-enforce.mjs
          test -s intelligence/reliability/workflow-fanout-enforce-canary.mjs
          test -s intelligence/reliability/workflow-definition-diff-policy.json
          test -s intelligence/reliability/workflow-definition-diff-guard.mjs
          test -s intelligence/reliability/workflow-definition-diff-guard-canary.mjs
          node --check intelligence/reliability/workflow-control-plane.mjs
          node --check intelligence/reliability/workflow-control-plane-canary.mjs
          node --check intelligence/reliability/workflow-control-plane-enforce.mjs
          node --check intelligence/reliability/workflow-control-plane-enforce-canary.mjs
          node --check intelligence/reliability/workflow-fanout-audit.mjs
          node --check intelligence/reliability/workflow-fanout-canary.mjs
          node --check intelligence/reliability/workflow-fanout-enforce.mjs
          node --check intelligence/reliability/workflow-fanout-enforce-canary.mjs
          node --check intelligence/reliability/workflow-definition-diff-guard.mjs
          node --check intelligence/reliability/workflow-definition-diff-guard-canary.mjs
          node intelligence/reliability/workflow-control-plane-canary.mjs
          node intelligence/reliability/workflow-control-plane-enforce-canary.mjs
          node intelligence/reliability/workflow-fanout-canary.mjs
          node intelligence/reliability/workflow-fanout-enforce-canary.mjs
          node intelligence/reliability/workflow-definition-diff-guard-canary.mjs

      - name: Exercise common GitHub Actions compatibility surface
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/holding-control-plane
          printf '%s\n' "checkout+setup-node+upload-artifact compatibility canary" > /tmp/holding-control-plane/common-actions-canary.txt
          test -s /tmp/holding-control-plane/common-actions-canary.txt

      - name: Upload common Actions compatibility canary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: workflow-control-plane-common-actions-${{ github.run_id }}
          path: /tmp/holding-control-plane/common-actions-canary.txt
          if-no-files-found: error
          retention-days: 1

      - name: Guard workflow definition changes
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          node intelligence/reliability/workflow-definition-diff-guard.mjs --json > /tmp/workflow-definition-diff.json
          node - <<'NODE'
          const r = require('/tmp/workflow-definition-diff.json');
          console.log('=== WORKFLOW DEFINITION DIFF GUARD ===');
          console.log(JSON.stringify({
            version:r.version,
            baseSha:r.baseSha,
            headSha:r.headSha,
            changedWorkflowCount:r.changedWorkflowCount,
            passCount:r.passCount,
            failCount:r.failCount
          }, null, 2));
          for (const row of r.results) console.log(`${row.status}\t${row.file}\t${row.proof}`);
          if (r.failCount !== 0) throw new Error('workflow definition diff guard did not pass');
          NODE

      - name: Verify frozen measured baselines
        shell: bash
        run: |
          set -euo pipefail
          control_actual="$(git hash-object intelligence/reliability/workflow-control-plane-baseline.json)"
          control_expected="4efd7dd509111683fdf24430d4e9f4cb403673a1"
          if [ "$control_actual" != "$control_expected" ]; then
            echo "Workflow Control Plane baseline changed: expected=$control_expected actual=$control_actual" >&2
            echo "Baseline expansion requires an explicit bounded maintenance procedure; ordinary workflow changes may only reduce debt." >&2
            exit 1
          fi
          fanout_actual="$(git hash-object intelligence/reliability/workflow-fanout-baseline.json)"
          fanout_expected="4eea6bf2cbfc066763a0b23d3b724db5e9f04853"
          if [ "$fanout_actual" != "$fanout_expected" ]; then
            echo "Workflow Fan-out baseline changed: expected=$fanout_expected actual=$fanout_actual" >&2
            echo "Fan-out baseline expansion requires an explicit bounded maintenance procedure; reductions do not require baseline widening." >&2
            exit 1
          fi
          echo "Frozen Workflow Control Plane baseline PASS: $control_actual"
          echo "Frozen Workflow Fan-out baseline PASS: $fanout_actual"

      - name: Build read-only workflow topology
        shell: bash
        run: |
          set -euo pipefail
          node intelligence/reliability/workflow-control-plane.mjs --json > /tmp/workflow-control-plane.json
          node - <<'NODE'
          const r = require('/tmp/workflow-control-plane.json');
          console.log('=== WORKFLOW CONTROL PLANE SUMMARY ===');
          console.log(JSON.stringify(r.summary, null, 2));
          console.log('=== REPOSITORY WRITERS ===');
          for (const w of r.workflows.filter(x => x.repositoryWriterCapable)) {
            console.log(`${w.id}\tconcurrency=${w.hasConcurrency}\tcontentsWrite=${w.contentsWrite}\tsignals=${w.writeSignals.join(',')}\tcandidates=${w.candidateWriterPaths.join(',') || '-'}`);
          }
          console.log('=== WORKFLOW CONTROL ACTORS ===');
          for (const w of r.workflows.filter(x => x.workflowControlCapable)) {
            console.log(`${w.id}\tconcurrency=${w.hasConcurrency}\tactionsWrite=${w.actionsWrite}\tdispatchTargets=${w.dispatchTargets.join(',') || '-'}\tsignals=${w.writeSignals.join(',')}`);
          }
          console.log('=== OTHER WRITE PERMISSIONS ===');
          for (const w of r.workflows.filter(x => x.otherWritePermission)) {
            console.log(`${w.id}\tpermissions=${w.otherWritePermissions.join(',')}`);
          }
          console.log('=== GRAPH EDGES ===');
          for (const e of r.graph.edges) console.log(`${e.type}\t${e.from} -> ${e.to}`);
          console.log('=== OBSERVED LEGACY DEBT ===');
          for (const f of r.findings) console.log(`${f.severity}\t${f.id}\t${f.workflow}\t${f.detail}`);
          if (!r.summary.workflowCount) throw new Error('workflow inventory unexpectedly empty');
          NODE

      - name: Measure pull-request fan-out debt
        shell: bash
        run: |
          set -euo pipefail
          node intelligence/reliability/workflow-fanout-audit.mjs --json > /tmp/workflow-fanout.json
          node - <<'NODE'
          const r = require('/tmp/workflow-fanout.json');
          console.log('=== WORKFLOW FAN-OUT SUMMARY ===');
          console.log(JSON.stringify(r.summary, null, 2));
          console.log('=== PROTECTED WORKFLOW-CHANGE CHECKS ===');
          for (const x of r.workflows.filter(x => x.workflowFleetWake && x.protectedWorkflowChangeCheck)) {
            console.log(`${x.id}\tclass=${x.wakeClass}`);
          }
          console.log('=== FAN-OUT REDUCTION CANDIDATES ===');
          for (const x of r.reductionCandidates) {
            console.log(`${x.id}\tclass=${x.wakeClass}\tunbounded=${x.unbounded}\tself=${x.selfDefinitionWake}`);
          }
          if (!Number.isInteger(r.summary.workflowFleetWakeCount) || r.summary.workflowFleetWakeCount < 1) {
            throw new Error('workflow fan-out measurement unexpectedly empty');
          }
          if (r.authority?.readOnly !== true || r.authority?.repositoryMutationAuthority !== false || r.authority?.workflowDispatchAuthority !== false) {
            throw new Error('workflow fan-out audit authority expansion');
          }
          NODE

      - name: Enforce no-new fan-out debt
        shell: bash
        run: |
          set -euo pipefail
          node intelligence/reliability/workflow-fanout-enforce.mjs --json > /tmp/workflow-fanout-enforcement.json
          node - <<'NODE'
          const r = require('/tmp/workflow-fanout-enforcement.json');
          console.log('=== NO-NEW FAN-OUT DEBT ENFORCEMENT ===');
          console.log(JSON.stringify({
            baseline:r.baseline,
            baselineIntegrity:r.baselineIntegrity,
            noNewFanoutDebt:r.noNewFanoutDebt,
            violationCount:r.violationCount,
            summary:r.summary
          }, null, 2));
          if (r.noNewFanoutDebt !== 'PASS' || r.baselineIntegrity !== 'PASS') throw new Error('no-new fan-out debt enforcement did not pass');
          NODE

      - name: Enforce structural no-new-debt gate
        shell: bash
        run: |
          set -euo pipefail
          node intelligence/reliability/workflow-control-plane-enforce.mjs --json > /tmp/workflow-control-plane-enforcement.json
          node - <<'NODE'
          const r = require('/tmp/workflow-control-plane-enforcement.json');
          console.log('=== STRUCTURAL NO-NEW-DEBT ENFORCEMENT ===');
          console.log(JSON.stringify({
            baseline:r.baseline,
            baselineIntegrity:r.baselineIntegrity,
            noNewDebt:r.noNewDebt,
            violationCount:r.violationCount,
            workflowCount:r.summary.workflowCount,
            repositoryWriterCount:r.summary.repositoryWriterCount,
            workflowControlCount:r.summary.workflowControlCount,
            duplicateCandidateWriterPathCount:r.summary.duplicateCandidateWriterPathCount,
            unresolvedEdgeCount:r.summary.unresolvedEdgeCount,
            cycleCount:r.summary.cycleCount
          }, null, 2));
          if (r.noNewDebt !== 'PASS' || r.baselineIntegrity !== 'PASS') throw new Error('structural no-new-debt enforcement did not pass');
          NODE

      - name: Verify read-only authority boundary
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const policy = require('./intelligence/reliability/workflow-control-plane-policy.json');
          const fanout = require('./intelligence/reliability/workflow-fanout-policy.json');
          const definitions = require('./intelligence/reliability/workflow-definition-diff-policy.json');
          const expected = {
            readOnly: true,
            executionAuthority: 'none',
            repositoryMutationAuthority: false,
            workflowDispatchAuthority: false,
            capitalExecution: false,
            walletAuthority: false,
            methodologyMutationAuthority: false
          };
          for (const [k, v] of Object.entries(expected)) {
            if (policy.authority?.[k] !== v) throw new Error(`authority expansion: control-plane.${k}`);
            if (fanout.authority?.[k] !== v) throw new Error(`authority expansion: fanout.${k}`);
            if (definitions.authority?.[k] !== v) throw new Error(`authority expansion: workflow-definition-diff.${k}`);
          }
          if (policy.mode !== 'no-new-debt') throw new Error(`unexpected policy mode: ${policy.mode}`);
          if (fanout.mode !== 'no-new-fanout-debt') throw new Error(`unexpected fanout mode: ${fanout.mode}`);
          if (definitions.mode !== 'fail-closed-unverified-workflow-logic-change') throw new Error(`unexpected workflow definition guard mode: ${definitions.mode}`);
          console.log('Workflow Control Plane + Fan-out + Definition Diff read-only authority boundary PASS');
          NODE
          git diff --check
