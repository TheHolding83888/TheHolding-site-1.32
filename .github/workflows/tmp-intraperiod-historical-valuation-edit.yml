name: Temporary Intraperiod Historical Valuation Edit

on:
  push:
    branches:
      - accounting/intraperiod-historical-reward-valuation-v2-20260912
    paths:
      - '.github/workflows/tmp-intraperiod-historical-valuation-edit.yml'

permissions:
  contents: write

jobs:
  edit-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout staging branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          ref: accounting/intraperiod-historical-reward-valuation-v2-20260912

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: Install deterministic validation dependency
        run: npm install --no-save --no-package-lock ethers@6

      - name: Apply guarded edit
        run: python3 reporting/tmp-intraperiod-historical-valuation-edit.py

      - name: Syntax and deterministic validation
        shell: bash
        run: |
          set -euo pipefail
          node --check reporting/historical-canonical-price.mjs
          node --check reporting/ve33-historical-valuation-identity.mjs
          node --check reporting/income-ledger.mjs
          node --check reporting/canonical-earned-income-view.mjs
          node --check reporting/historical-canonical-price-validation.mjs
          node reporting/historical-canonical-price-validation.mjs

      - name: Commit validated implementation to staging branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "The Holding Accounting Builder"
          git config user.email "accounting-builder@theholding.ai"
          git add reporting/historical-canonical-price.mjs reporting/ve33-historical-valuation-identity.mjs reporting/income-ledger.mjs reporting/canonical-earned-income-view.mjs reporting/historical-canonical-price-validation.mjs
          git diff --cached --check
          git commit -m "accounting: resolve exact intraperiod ve33 reward valuations"
          git push origin HEAD:accounting/intraperiod-historical-reward-valuation-v2-20260912
