name: Update The Holding Change Intelligence

on:
  workflow_dispatch:
  schedule:
    # Daily Observer pass after Rewards (04:57), Stable Capital (05:37)
    # and Reporting (06:07). Sunday Productivity (04:17) is also already complete.
    - cron: '27 6 * * *'

permissions:
  contents: write

concurrency:
  group: change-intelligence-daily
  cancel-in-progress: false

jobs:
  observe-system:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Preflight
        shell: bash
        run: |
          set -euo pipefail
          node --check intelligence/change-intelligence-engine.mjs
          python3 -m py_compile scripts/update-realty-news.py
          python3 scripts/update-realty-news.py --validate
          test -s intelligence/memory-vault/corrections.json
          test -s companies/productivity-data.json
          test -s companies/rewards-data.json
          test -s companies/stable-capital-data.json
          test -s companies/stable-index-data.json
          test -s companies/embedded-yield-ledger.json
          test -s reporting/reporting-data.json
          test -s realty/news/data.json
          test -s realty/news/index.html
          test -s sitemap.xml

      - name: Refresh bounded Realty News
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/update-realty-news.py

      - name: Observe, compare and extend permanent memory
        run: node intelligence/change-intelligence-engine.mjs

      - name: Validate intelligence + Memory Vault
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const crypto = require('crypto');

          const latest = JSON.parse(fs.readFileSync('intelligence/change-intelligence.json','utf8'));
          const memory = JSON.parse(fs.readFileSync('intelligence/system-memory.json','utf8'));
          const history = JSON.parse(fs.readFileSync('intelligence/change-history.json','utf8'));
          const manifest = JSON.parse(fs.readFileSync('intelligence/memory-vault/manifest.json','utf8'));
          const corrections = JSON.parse(fs.readFileSync('intelligence/memory-vault/corrections.json','utf8'));

          function stableStringify(value) {
            if (value === null || typeof value !== 'object') return JSON.stringify(value);
            if (Array.isArray(value)) return `[${value.map(stableStringify).join(',')}]`;
            return `{${Object.keys(value).sort().map(k => `${JSON.stringify(k)}:${stableStringify(value[k])}`).join(',')}}`;
          }
          function sha256Text(text) {
            return crypto.createHash('sha256').update(text).digest('hex');
          }
          function verifyRecord(record) {
            if (!record?.integrity?.recordHash) throw new Error('vault record hash missing');
            const core = {...record};
            delete core.integrity;
            const actual = sha256Text(stableStringify(core));
            if (actual !== record.integrity.recordHash) throw new Error('vault record integrity mismatch');
            if ((record.chain?.previousRecordHash ?? null) !== (record.integrity.previousRecordHash ?? null)) {
              throw new Error('vault internal previous-hash mismatch');
            }
          }

          if (latest.version !== '0.2.1-autonomous-change-intelligence-memory-vault') throw new Error('unexpected intelligence version');
          if (latest.observerVersion !== '0.2.1-deterministic-memory-vault-corrections') throw new Error('unexpected Observer version');
          if (memory.version !== '0.2.1-system-memory') throw new Error('unexpected memory version');
          if (history.version !== '0.2.1-change-history') throw new Error('unexpected history version');
          if (manifest.version !== '0.2-memory-vault-manifest') throw new Error('unexpected Memory Vault version');

          if (!latest.bridge?.snapshotHash || latest.bridge.snapshotHash !== memory.snapshotHash) throw new Error('snapshot hash mismatch');
          if (!Array.isArray(latest.whatChanged) || !Array.isArray(latest.watchNext)) throw new Error('latest intelligence arrays missing');
          if (!Array.isArray(history.runs) || !Array.isArray(history.events)) throw new Error('history arrays missing');
          if (!Array.isArray(manifest.runs) || manifest.runCount !== manifest.runs.length || manifest.runCount < 1) {
            throw new Error('Memory Vault manifest run count invalid');
          }

          const requiredSources = ['productivity','rewards','stableCapital','stableIndex','embeddedLedger','reporting'];
          for (const key of requiredSources) {
            if (!memory.sources?.[key]?.sha256) throw new Error(`source provenance missing: ${key}`);
          }

          const vaultBridge = latest.bridge?.memoryVault;
          if (!vaultBridge?.latestRecordPath || !vaultBridge?.latestRecordHash) throw new Error('Memory Vault bridge missing');
          if (vaultBridge.runCount !== manifest.runCount) throw new Error('Memory Vault bridge runCount mismatch');
          if (history.lifetime?.vaultRunCount !== manifest.runCount) throw new Error('history/vault lifetime count mismatch');

          const rel = vaultBridge.latestRecordPath;
          const normalized = path.posix.normalize(rel);
          if (!normalized.startsWith('intelligence/memory-vault/') || normalized.includes('../')) throw new Error('unsafe Memory Vault record path');
          if (!fs.existsSync(rel)) throw new Error(`latest Memory Vault record missing: ${rel}`);

          const record = JSON.parse(fs.readFileSync(rel,'utf8'));
          verifyRecord(record);

          if (record.integrity.recordHash !== vaultBridge.latestRecordHash) throw new Error('bridge/record hash mismatch');
          if (record.integrity.recordHash !== manifest.latestRecord?.recordHash) throw new Error('manifest/record hash mismatch');
          if (record.snapshotHash !== memory.snapshotHash) throw new Error('vault/current memory snapshot mismatch');

          const runs = manifest.runs;
          if (!manifest.chainRootHash || manifest.chainRootHash !== runs[0].recordHash) throw new Error('Memory Vault chain root mismatch');
          for (let i = 0; i < runs.length; i++) {
            const expectedPrev = i === 0 ? null : runs[i - 1].recordHash;
            if ((runs[i].previousRecordHash ?? null) !== expectedPrev) throw new Error(`Memory Vault manifest chain broken at run ${i}`);
          }

          const last = runs[runs.length - 1];
          if (last.recordPath !== rel || last.recordHash !== record.integrity.recordHash) throw new Error('manifest latest run mismatch');
          if (runs.length > 1) {
            const prev = runs[runs.length - 2];
            if (record.integrity.previousRecordHash !== prev.recordHash) throw new Error('Memory Vault latest hash link broken');
          } else if (record.integrity.previousRecordHash !== null) {
            throw new Error('first Memory Vault record must have null previous hash');
          }

          if (corrections.version !== '0.2.1-memory-vault-corrections') throw new Error('unexpected correction ledger version');
          if (!Array.isArray(corrections.entries) || corrections.entryCount !== corrections.entries.length) throw new Error('correction ledger entries invalid');
          const correctionCore = {...corrections};
          delete correctionCore.integrity;
          const correctionHash = sha256Text(stableStringify(correctionCore));
          if (correctionHash !== corrections.integrity?.ledgerHash) throw new Error('correction ledger integrity mismatch');
          if (corrections.policy?.originalRecordsImmutable !== true) throw new Error('correction ledger immutability policy missing');
          if (latest.bridge?.memoryVault?.corrections?.ledgerHash !== corrections.integrity.ledgerHash) throw new Error('bridge/correction hash mismatch');
          if (history.lifetime?.memoryCorrectionCount !== corrections.entryCount) throw new Error('history correction count mismatch');
          console.log('Change Intelligence + Memory Vault validation OK.');
          console.log('Mode:', latest.mode);
          console.log('Changes:', latest.whatChanged.length);
          console.log('Watch:', latest.watchNext.length);
          console.log('Vault runs:', manifest.runCount);
          console.log('Vault events:', manifest.eventCount);
          console.log('Vault latest:', rel);
          NODE

      - name: Publish system memory + permanent Memory Vault
        shell: bash
        run: |
          set -euo pipefail

          FILES=(
            "intelligence/system-memory.json"
            "intelligence/change-history.json"
            "intelligence/change-intelligence.json"
            "intelligence/daily-brief.md"
            "intelligence/memory-vault/manifest.json"
            "realty/news/data.json"
            "realty/news/index.html"
            "sitemap.xml"
          )

          for f in "${FILES[@]}"; do test -s "$f"; done

          git config user.name "The Holding Observer"
          git config user.email "observer@theholding.ai"

          git add "${FILES[@]}"
          git add intelligence/memory-vault

          if git diff --cached --quiet; then
            echo "No intelligence or Realty News changes to publish."
            exit 0
          fi

          git commit -m "intelligence: extend memory and refresh bounded Realty News"

          for attempt in 1 2 3; do
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "Safe writer guard: rebase conflict; refusing to guess."
              exit 1
            fi
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Safe writer guard: main moved during push; retrying ($attempt/3)..."
            sleep $((attempt * 2))
          done

          echo "Safe writer guard: push failed after 3 attempts."
          exit 1