name: Verify Public Foundation v1 Final Audit

on:
  pull_request:
    paths:
      - 'reporting/public-foundation-v1-final-audit.mjs'
      - 'reporting/income-lifecycle-contract.json'
      - 'reporting/income-lifecycle-contract-validation.mjs'
      - 'reporting/canonical-earned-income-view.mjs'
      - 'reporting/income-ledger.json'
      - 'reporting/company-monthly-earned-income.mjs'
      - 'reporting/company-monthly-reports.json'
      - 'reporting/company-monthly-earned-income-validation.mjs'
      - 'reporting/accounting-coverage.mjs'
      - 'reporting/accounting-coverage.json'
      - 'reporting/accounting-coverage-validation.mjs'
      - 'reporting/accounting-notice-queue.mjs'
      - 'reporting/accounting-notice-queue.json'
      - 'reporting/accounting-notice-queue-validation.mjs'
      - 'reporting/accounting-reference-reconciliation.mjs'
      - 'reporting/accounting-reference-reconciliation.json'
      - 'reporting/accounting-reference-reconciliation-validation.mjs'
      - 'reporting/historical-accounting-completeness-map.mjs'
      - 'reporting/historical-accounting-completeness-map.json'
      - 'reporting/historical-accounting-completeness-map-validation.mjs'
      - 'reporting/accounting-reconciliation-watch.mjs'
      - 'reporting/accounting-reconciliation-watch.json'
      - 'reporting/accounting-reconciliation-watch-validation.mjs'
      - 'intelligence/reliability/workflow-control-plane-enforce.mjs'
      - 'intelligence/reliability/workflow-control-plane-baseline.json'
      - '.github/workflows/verify-public-foundation-v1-final-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: Static preflight
        shell: bash
        run: |
          set -euo pipefail
          node --check reporting/public-foundation-v1-final-audit.mjs
          node --check reporting/company-monthly-earned-income.mjs
          node --check reporting/company-monthly-earned-income-validation.mjs
          node --check reporting/accounting-coverage.mjs
          node --check reporting/accounting-coverage-validation.mjs
          node --check reporting/accounting-notice-queue.mjs
          node --check reporting/accounting-notice-queue-validation.mjs
          node --check reporting/accounting-reference-reconciliation.mjs
          node --check reporting/accounting-reference-reconciliation-validation.mjs
          node --check reporting/historical-accounting-completeness-map.mjs
          node --check reporting/historical-accounting-completeness-map-validation.mjs
          node --check reporting/accounting-reconciliation-watch.mjs
          node --check reporting/accounting-reconciliation-watch-validation.mjs
          node --check reporting/income-lifecycle-contract-validation.mjs
          test -s reporting/income-ledger.json
          test -s reporting/company-monthly-reports.json
          test -s reporting/accounting-coverage.json
          test -s reporting/accounting-notice-queue.json
          test -s reporting/accounting-reference-reconciliation.json
          test -s reporting/historical-accounting-completeness-map.json
          test -s reporting/accounting-reconciliation-watch.json
          test -s reporting/income-lifecycle-contract.json
          git diff --check

      - name: Build and validate coherent candidate accounting projection
        shell: bash
        run: |
          set -euo pipefail
          generated=(
            reporting/company-monthly-reports.json
            reporting/accounting-coverage.json
            reporting/accounting-notice-queue.json
            reporting/accounting-reference-reconciliation.json
            reporting/historical-accounting-completeness-map.json
            reporting/accounting-reconciliation-watch.json
          )
          restore_generated() {
            git checkout -- "${generated[@]}"
          }
          trap restore_generated EXIT

          # Rebuild the complete deterministic downstream projection from the
          # exact PR checkout. The final audit must never compare fresh consumer
          # code against a mixture of stale generated artifacts.
          node reporting/company-monthly-earned-income.mjs
          node reporting/accounting-coverage.mjs
          node reporting/accounting-notice-queue.mjs
          node reporting/accounting-reference-reconciliation.mjs
          node reporting/historical-accounting-completeness-map.mjs
          node reporting/accounting-reconciliation-watch.mjs

          node reporting/company-monthly-earned-income-validation.mjs
          node reporting/accounting-coverage-validation.mjs
          node reporting/accounting-notice-queue-validation.mjs
          node reporting/accounting-reference-reconciliation-validation.mjs
          node reporting/historical-accounting-completeness-map-validation.mjs
          node reporting/accounting-reconciliation-watch-validation.mjs
          node reporting/income-lifecycle-contract-validation.mjs
          node reporting/public-foundation-v1-final-audit.mjs

      - name: Enforce workflow control plane
        shell: bash
        run: |
          set -euo pipefail
          node intelligence/reliability/workflow-control-plane-enforce.mjs --json

      - name: Final repository diff guard
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test -z "$(git status --porcelain)"
