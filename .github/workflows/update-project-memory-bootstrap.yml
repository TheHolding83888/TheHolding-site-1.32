name: "The Holding · Project Memory Bootstrap"
# holding-workflow-definition-proof: intelligence/reliability/project-memory-bootstrap-workflow-definition-proof.mjs

on:
  push:
    branches: [main]
    paths-ignore:
      - 'intelligence/project-memory/CURRENT.md'
      # Operator commands are transient control-plane inputs. Refreshing CURRENT
      # from the same command push can race the bounded downstream dispatch by
      # advancing main between dispatch request and workflow creation. The
      # resulting canonical subsystem state is still captured by the hourly
      # backstop and by ordinary material pushes.
      - 'intelligence/operator/command.json'
      # High-frequency Market Data snapshots are generated state, not project
      # memory. Ignoring snapshot-only pushes prevents the 30-minute price
      # heartbeat from waking Project Memory up to 48 times/day. Any change to
      # Market Data code, workflows, policies or registries still triggers this
      # workflow normally; the hourly backstop remains enabled as well.
      - 'intelligence/market-data/market-data-coingecko.json'
      - 'intelligence/market-data/market-data.json'
      - 'intelligence/market-data/onchain-price-shadow.json'
      - 'intelligence/market-data/public-capital-state.json'
  workflow_run:
    workflows: ["The Holding Security Sentinel"]
    types: [completed]
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: project-memory-bootstrap-main
  cancel-in-progress: false

jobs:
  refresh:
    if: >-
      ${{
        github.event_name != 'workflow_run' ||
        (github.event.workflow_run.conclusion == 'success' &&
         github.event.workflow_run.head_branch == 'main')
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout canonical main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Validate deterministic memory builder
        shell: bash
        run: |
          set -euo pipefail
          test -s intelligence/project-memory/README.md
          test -s intelligence/project-memory/THE_HOLDING_BUILD_DISCIPLINE_CANON_2026-08-14.md
          test -s intelligence/project-memory/THE_HOLDING_MEMORY_ROUTING_INDEX_2026-08-18.md
          test -s intelligence/project-memory/CONTINUITY.md
          test -s intelligence/project-memory/build-continuity-checkpoint.mjs
          test -s intelligence/project-memory/verify-continuity-checkpoint.mjs
          test -s intelligence/project-memory/build-current-memory.mjs
          test -s intelligence/project-memory/verify-current-memory.mjs
          node --check intelligence/project-memory/build-continuity-checkpoint.mjs
          node --check intelligence/project-memory/verify-continuity-checkpoint.mjs
          node --check intelligence/project-memory/build-current-memory.mjs
          node --check intelligence/project-memory/verify-current-memory.mjs
          node intelligence/project-memory/verify-continuity-checkpoint.mjs

      - name: Refresh CURRENT project memory safely
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "The Holding Project Memory"
          git config user.email "project-memory@theholding.ai"

          rebuild() {
            node intelligence/project-memory/verify-continuity-checkpoint.mjs
            node intelligence/project-memory/build-current-memory.mjs
            node intelligence/project-memory/verify-current-memory.mjs
            git diff --check
            git add intelligence/project-memory/CURRENT.md
            bad="$(git diff --cached --name-only | grep -Ev '^intelligence/project-memory/CURRENT\.md$' || true)"
            if [ -n "$bad" ]; then
              echo "ERROR: Project Memory updater attempted to stage outside CURRENT.md"
              echo "$bad"
              exit 1
            fi
          }

          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            rebuild

            if git diff --cached --quiet; then
              echo "Project Memory CURRENT.md already matches canonical source state."
              exit 0
            fi

            git commit -m "memory: refresh current project bootstrap"
            if git push origin HEAD:main; then
              git fetch origin main
              test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
              echo "Verified CURRENT project memory on remote main."
              exit 0
            fi

            echo "Main moved during Project Memory publish; rebuilding from fresh main ($attempt/3)..."
          done

          echo "ERROR: unable to publish CURRENT project memory after retries"
          exit 1

      - name: Memory bootstrap summary
        if: always()
        shell: bash
        run: |
          {
            echo "# The Holding · Project Memory Bootstrap"
            echo
            echo "**Canonical entrypoint:** \`intelligence/project-memory/CURRENT.md\`"
            echo "**Continuity root:** \`intelligence/project-memory/CONTINUITY.md\`"
            echo "**Deep current checkpoint:** immutable \`THE_HOLDING_MASTER_CONTINUITY_*.md\` selected by the root"
            echo "**Task-aware retrieval:** \`THE_HOLDING_MEMORY_ROUTING_INDEX_v2_2026-08-26.md\`"
            echo "**Permanent factual archive:** \`intelligence/memory-vault/\`"
            echo "**Current Security authority:** fresh \`security/security-intelligence.json\`"
            echo "**Post-Sentinel refresh:** enabled after successful main Security Sentinel runs"
            echo "**Model/API call:** none"
            echo "**Generated mutation boundary:** CURRENT.md only"
            echo "**Schedule:** hourly backstop at minute 17"
            echo
            echo "The updater is deterministic, validates the continuity root/checkpoint first, rebuilds CURRENT against fresh Security and durable contracts, and emits no commit when canonical source state has not changed."
          } >> "$GITHUB_STEP_SUMMARY"
