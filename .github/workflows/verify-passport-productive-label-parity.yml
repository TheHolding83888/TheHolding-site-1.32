name: "Verify Passports · productive label parity"

on:
  pull_request:
    paths:
      - 'companies/index.html'
      - 'rewards/rewards-passport-hygiene.mjs'
      - 'intelligence/project-memory/THE_HOLDING_PASSPORT_RESPONSIVE_UI_CANON_2026-08-18.md'
      - 'intelligence/project-memory/THE_HOLDING_COMPANY_PASSPORT_INHERITANCE_CANON_2026-08-19.md'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Prove productive identity labels stay specific
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          s=Path('companies/index.html').read_text()
          h=Path('rewards/rewards-passport-hygiene.mjs').read_text()
          expected={
            'aerodrome-relay':'Aerodrome · veAERO',
            'aerodrome-ve':'Aerodrome · veAERO',
            'velodrome-ve':'Velodrome · veVELO',
            'velodrome-ve-direct':'Velodrome · veVELO',
            'curve-fees':'Curve · veCRV',
            'frax-yield':'Frax · veFRAX',
            'pendle-spendle':'Pendle · sPENDLE',
            'fx-fees':'f(x) Protocol · veFXN',
            'liquity-staking':'Liquity · staked LQTY',
            'venice-staking':'Venice · sVVV',
            'resupply-staking':'Resupply · staked RSUP'
          }
          balance=[
            "'aerodrome-finance': 'Aerodrome · veAERO'",
            "'velodrome-finance': 'Velodrome · veVELO'",
            "'curve-dao-token': 'Curve · veCRV'",
            "'frax-share': 'Frax · veFRAX'",
            "'yield-basis': 'Yield Basis · veYB'",
            "'pendle': 'Pendle · sPENDLE'",
            "'fxn-token': 'f(x) Protocol · veFXN'",
            "'bitcoin': 'BTC'",
            "'ethereum': 'ETH'"
          ]
          for x in balance:
            if x not in s: raise SystemExit(f'missing Balance Sheet label contract: {x}')
          for route,label in expected.items():
            if f"'{route}': '{label}'" not in s:
              raise SystemExit(f'missing renderer route label: {route} -> {label}')
            if f"['{route}','{label}']" not in h:
              raise SystemExit(f'missing canonical Rewards hygiene label: {route} -> {label}')
          if "'Velodrome · 40 Acres'" not in s:
            raise SystemExit('more-specific Defitea Velodrome route must remain')
          forbidden=[
            "protocol: isAerodrome ? 'Aerodrome' : (isVelodrome ? 'Velodrome' : x.protocol)",
            "(x.aerodromeRollup ? 'Aerodrome' : 'Velodrome')",
            '<span class="ipx-position-symbol">PENDLE</span>'
          ]
          for x in forbidden:
            if x in s: raise SystemExit(f'generic-label regression remains: {x}')
          canon=Path('intelligence/project-memory/THE_HOLDING_PASSPORT_RESPONSIVE_UI_CANON_2026-08-18.md').read_text()
          if '## 6. Productive identity label canon' not in canon:
            raise SystemExit('durable responsive label canon missing')
          inheritance=Path('intelligence/project-memory/THE_HOLDING_COMPANY_PASSPORT_INHERITANCE_CANON_2026-08-19.md').read_text()
          for label in ['Frax · veFRAX','Venice · sVVV','Resupply · staked RSUP']:
            if label not in inheritance: raise SystemExit(f'inheritance canon missing {label}')
          print('Passport productive label parity PASS')
          PY
