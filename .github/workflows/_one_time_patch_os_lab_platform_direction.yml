name: One-time OS Lab Platform Direction Patch

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/_one_time_patch_os_lab_platform_direction.yml

permissions:
  contents: write

concurrency:
  group: one-time-os-lab-platform-direction
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout fresh main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main
          fetch-depth: 0

      - name: Patch OS Lab fail-closed
        shell: bash
        run: |
          set -euo pipefail
          git pull --ff-only origin main
          node <<'NODE'
          const fs = require('fs');
          const path = 'agents/index.html';
          let html = fs.readFileSync(path, 'utf8');

          const cssAnchor = '    </style>\n</head>';
          const observerMarker = '    <!-- The Holding Observer · live read-only intelligence stream -->';

          if ((html.match(/<\/style>\n<\/head>/g) || []).length !== 1) throw new Error('CSS anchor not unique');
          if ((html.match(/<!-- The Holding Observer · live read-only intelligence stream -->/g) || []).length !== 1) throw new Error('Observer marker not unique');
          if (html.includes('id="platform-direction"')) throw new Error('Platform direction already exists');

          const css = `
        /* THE HOLDING OS LAB · PLATFORM DIRECTION v0.1 */
        .oslab-direction { padding: 0 0 4.75rem; }
        .oslab-direction-shell {
            border-top: 1px solid var(--border-light);
            border-bottom: 1px solid var(--border-light);
            padding: 1.55rem 0 1.35rem;
        }
        .oslab-direction-kicker {
            margin-bottom: 1rem;
            color: var(--accent-azure, #2d5f87);
            font: 700 .58rem/1.2 'Space Grotesk', sans-serif;
            letter-spacing: .18em;
            text-transform: uppercase;
        }
        .oslab-direction-flow {
            display: grid;
            grid-template-columns: minmax(0,1fr) auto minmax(0,1fr) auto minmax(0,1fr) auto minmax(0,1fr);
            align-items: center;
            gap: .7rem;
        }
        .oslab-direction-step { min-width: 0; }
        .oslab-direction-step span {
            display: block;
            margin-bottom: .3rem;
            color: var(--text-tertiary);
            font: 700 .5rem/1.2 'Space Grotesk', sans-serif;
            letter-spacing: .12em;
        }
        .oslab-direction-step strong {
            display: block;
            color: var(--text-primary);
            font: 500 1.12rem/1.15 'Cormorant Garamond', Georgia, serif;
            letter-spacing: -.01em;
        }
        .oslab-direction-step small {
            display: block;
            margin-top: .28rem;
            color: var(--text-secondary);
            font: 400 .62rem/1.45 'Space Grotesk', sans-serif;
        }
        .oslab-direction-step.live strong { color: var(--accent-azure, #2d5f87); }
        .oslab-direction-arrow {
            color: var(--azure-line, rgba(45,95,135,.28));
            font: 400 1rem/1 'Space Grotesk', sans-serif;
        }
        .oslab-direction-note {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            gap: 1rem;
            margin-top: 1.05rem;
            padding-top: .85rem;
            border-top: 1px solid var(--border-light);
            color: var(--text-tertiary);
            font-size: .62rem;
            line-height: 1.55;
        }
        .oslab-direction-note a {
            flex: 0 0 auto;
            color: var(--accent-azure, #2d5f87);
            text-decoration: none;
            font-weight: 600;
        }
        .oslab-direction-note a:hover {
            text-decoration: underline;
            text-underline-offset: 3px;
        }
        @media (max-width: 760px) {
            .oslab-direction { padding-bottom: 4rem; }
            .oslab-direction-flow { grid-template-columns: 1fr; gap: .55rem; }
            .oslab-direction-step { padding: .25rem 0; }
            .oslab-direction-arrow {
                transform: rotate(90deg);
                transform-origin: center;
                width: 1rem;
                margin-left: .15rem;
            }
            .oslab-direction-note {
                align-items: flex-start;
                flex-direction: column;
                gap: .45rem;
            }
        }
`;

          const block = `    <!-- The Holding OS · compact platform direction -->
    <section class="oslab-direction" id="platform-direction" aria-label="The Holding OS platform direction">
        <div class="container">
            <div class="oslab-direction-shell">
                <div class="oslab-direction-kicker">One OS · Long-term direction</div>
                <div class="oslab-direction-flow" role="list" aria-label="The Holding platform progression">
                    <div class="oslab-direction-step live" role="listitem">
                        <span>01 · CORE</span>
                        <strong>The Holding OS</strong>
                        <small>shared memory · security · intelligence</small>
                    </div>
                    <div class="oslab-direction-arrow" aria-hidden="true">→</div>
                    <div class="oslab-direction-step live" role="listitem">
                        <span>02 · INTERFACE</span>
                        <strong>Ask The Holding</strong>
                        <small>one conversational surface · live now</small>
                    </div>
                    <div class="oslab-direction-arrow" aria-hidden="true">→</div>
                    <div class="oslab-direction-step" role="listitem">
                        <span>03 · COMPANY</span>
                        <strong>Company Companions</strong>
                        <small>company-specific intelligence · next</small>
                    </div>
                    <div class="oslab-direction-arrow" aria-hidden="true">→</div>
                    <div class="oslab-direction-step" role="listitem">
                        <span>04 · ECONOMY</span>
                        <strong>Agent Economy</strong>
                        <small>humans + authorised agents · future</small>
                    </div>
                </div>
                <div class="oslab-direction-note">
                    <span>Brain · Memory · Security · Learning are organs of one OS — not separate products.</span>
                    <a href="/manifesto">Explore the platform vision →</a>
                </div>
            </div>
        </div>
    </section>\n\n`;

          html = html.replace(cssAnchor, css + '\n' + cssAnchor);
          html = html.replace(observerMarker, block + observerMarker);

          const required = [
            'id="platform-direction"',
            'Company Companions',
            'Agent Economy',
            'Brain · Memory · Security · Learning are organs of one OS',
            'href="/manifesto"',
            '/agents/console/app.js?v=0.5',
            '/agents/console/safety.js?v=0.1',
            'id="ask-the-holding"',
            'id="observer"',
            'id="cognitive"',
            'id="agents"'
          ];
          for (const marker of required) if (!html.includes(marker)) throw new Error('Missing marker: ' + marker);
          if ((html.match(/id="platform-direction"/g) || []).length !== 1) throw new Error('Direction id not unique');
          if (html.indexOf('id="ask-the-holding"') > html.indexOf('id="platform-direction"')) throw new Error('Direction must follow Ask');
          if (html.indexOf('id="platform-direction"') > html.indexOf('id="observer"')) throw new Error('Direction must precede Observer');
          if ((html.match(/\/agents\/console\/app\.js\?v=0\.5/g) || []).length !== 1) throw new Error('Ask v0.5 asset changed');
          if ((html.match(/\/agents\/console\/safety\.js\?v=0\.1/g) || []).length !== 1) throw new Error('Safety asset changed');

          fs.writeFileSync(path, html);
          console.log('OS Lab platform direction patch PASS');
          NODE

      - name: Verify exact mutation boundary
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git diff -- agents/index.html | grep -q 'Company Companions'
          git diff -- agents/index.html | grep -q 'Agent Economy'

      - name: Publish and self-remove
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "The Holding Production Integrator"
          git config user.email "production-integrator@theholding.ai"
          git add agents/index.html
          git rm .github/workflows/_one_time_patch_os_lab_platform_direction.yml
          git commit -m "agents: add compact OS platform direction"
          git push origin HEAD:main
