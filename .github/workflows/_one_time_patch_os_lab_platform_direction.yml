name: OS Lab Platform Direction Patch
on:
  push:
    branches: [main]
    paths: [.github/workflows/_one_time_patch_os_lab_platform_direction.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          fetch-depth: 0
      - name: Apply validated patch
        shell: bash
        run: |
          set -euo pipefail
          git pull --ff-only origin main
          python -c "import base64;exec(base64.b64decode(' '))"
          git diff --check
          git diff -- agents/index.html | grep -q 'Company Companions'
          git diff -- agents/index.html | grep -q 'Agent Economy'
      - name: Publish and self-remove
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "The Holding Production Integrator"
          git config user.email "production-integrator@theholding.ai"
          git add agents/index.html
          git rm .github/workflows/_one_time_patch_os_lab_platform_direction.yml
          git commit -m "agents: add compact OS platform direction"
          git push origin HEAD:main
