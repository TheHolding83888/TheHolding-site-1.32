name: "Validate OLAS Onchain Market Data"

on:
  pull_request:
    paths:
      - 'intelligence/market-data/onchain-price-resolver.mjs'
      - 'intelligence/market-data/onchain-price-resolver-v08.mjs'
      - 'intelligence/market-data/onchain-uniswap-v2-historical-twap.mjs'
      - 'intelligence/market-data/onchain-uniswap-v2-historical-twap-validation.mjs'
      - 'intelligence/market-data/onchain-price-source-registry-extensions.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout PR head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Validate V2 runtime and deterministic historical TWAP
        run: |
          set -euo pipefail
          node --check intelligence/market-data/onchain-price-resolver.mjs
          node --check intelligence/market-data/onchain-price-resolver-v08.mjs
          node --check intelligence/market-data/onchain-uniswap-v2-historical-twap.mjs
          node --check intelligence/market-data/onchain-uniswap-v2-historical-twap-validation.mjs
          node intelligence/market-data/onchain-uniswap-v2-historical-twap-validation.mjs
      - name: Prove OLAS live-proven recent-history contract
        run: |
          set -euo pipefail
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          import { mergeOnchainRegistryExtensions } from './intelligence/market-data/onchain-price-resolver.mjs';
          const market=JSON.parse(fs.readFileSync('intelligence/market-data/market-price-registry.json','utf8'));
          const base=JSON.parse(fs.readFileSync('intelligence/market-data/onchain-price-source-registry.json','utf8'));
          const ext=JSON.parse(fs.readFileSync('intelligence/market-data/onchain-price-source-registry-extensions.json','utf8'));
          const effective=mergeOnchainRegistryExtensions(base,ext);
          const ids=(market.assets||[]).map(x=>x.assetId),routed=ids.filter(id=>effective.assets?.[id]),pending=ids.filter(id=>!effective.assets?.[id]);
          if(ids.length!==26||routed.length!==26||pending.length!==0)throw new Error(`Coverage drift ${routed.length}/26 pending=${pending.join(',')}`);
          const r=effective.assets?.autonolas?.route;
          if(!r||r.type!=='uniswap-v2-historical-twap-relative'||r.network!=='ethereum'||r.authority!=='shadow')throw new Error('OLAS route invalid');
          if(r.pair.toLowerCase()!=='0x09d1d767edf8fa23a64c51fa559e0688e526812f')throw new Error('OLAS/WETH pair drift');
          if(r.token.toLowerCase()!=='0x0001a500a6b18995b03f44bb040a5ffc28e45cb0'||r.quoteToken.toLowerCase()!=='0xc02aaa39b223fe8d0a0e5c4f27ead9083c756cc2')throw new Error('OLAS identity drift');
          if(Number(r.lookbackBlocks)!==60||Number(r.minTwapWindowSeconds)!==500||Number(r.maxTwapWindowSeconds)!==1100)throw new Error('OLAS short-history window drift');
          if(r.quoteAssetId!=='ethereum'||r.feedQuote!=='ETH'||r.outputQuote!=='USD'||Number(r.maxDivergencePct)!==10)throw new Error('OLAS composition drift');
          if(ext.semantics?.uniswapV2SpotPriceAuthority!==false||ext.semantics?.productionPriceAuthority!==false||ext.semantics?.executionAuthority!=='none')throw new Error('Authority boundary drift');
          console.log('OLAS live-proven 60-block historical TWAP gate PASS',{routed:routed.length,lookbackBlocks:r.lookbackBlocks,min:r.minTwapWindowSeconds,max:r.maxTwapWindowSeconds});
          NODE
          git diff --check
