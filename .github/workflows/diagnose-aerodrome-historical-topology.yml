name: "Diagnose · Aerodrome Historical Topology"

on:
  pull_request:
    paths:
      - ".github/workflows/diagnose-aerodrome-historical-topology.yml"
      - "intelligence/economic-graph/aerodrome-epoch-flow-overlay.mjs"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Install existing read-only chain dependencies
        working-directory: productivity
        run: npm install --no-audit --no-fund

      - name: Expose existing dependency tree
        run: ln -sfn productivity/node_modules node_modules

      - name: Build diagnostic Pulse and print historical failures
        env:
          BASE_RPC_URL: ${{ secrets.BASE_RPC_URL }}
          BASE_RPC_URL_2: ${{ secrets.BASE_RPC_URL_2 }}
        run: |
          set -euo pipefail
          TMP="$(mktemp)"
          AERODROME_PULSE_FILE="$TMP" node intelligence/economic-graph/aerodrome-managed-strategy-pulse.mjs
          AERODROME_PULSE_FILE="$TMP" node intelligence/economic-graph/aerodrome-epoch-flow-overlay.mjs
          node - "$TMP" <<'NODE'
          const fs=require('fs');
          const p=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          const v=p.voteFlowContext || {};
          const excluded=Array.isArray(v.excludedPools)?v.excludedPools:[];
          const counts={};
          for(const row of excluded) counts[row.reason]=(counts[row.reason]||0)+1;
          console.log('HISTORICAL TOPOLOGY DIAGNOSTIC', {
            coverage:v.coverage,
            failureReasonCounts:counts,
            excludedPools:excluded
          });
          NODE
