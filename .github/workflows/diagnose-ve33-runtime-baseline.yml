name: Diagnose ve33 Runtime Baseline

on:
  pull_request:
    paths:
      - '.github/workflows/diagnose-ve33-runtime-baseline.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Probe registered Base historical log RPCs
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const urls=[
            ['base-foundation','https://mainnet.base.org'],
            ['1rpc','https://1rpc.io/base'],
            ['publicnode','https://base-rpc.publicnode.com']
          ];
          const fromBlock=50715727,toBlock=50725226;
          const address='0x227f65131A261548b057215bB1D5Ab2997964C7d';
          const hex=n=>'0x'+n.toString(16);
          for(const [id,url] of urls){
            const started=Date.now();
            try{
              const controller=new AbortController();
              const timer=setTimeout(()=>controller.abort(),30000);
              const response=await fetch(url,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({jsonrpc:'2.0',id:1,method:'eth_getLogs',params:[{address,fromBlock:hex(fromBlock),toBlock:hex(toBlock)}]}),signal:controller.signal});
              clearTimeout(timer);
              const text=await response.text();
              let body=null;try{body=JSON.parse(text);}catch{}
              console.log(JSON.stringify({id,httpStatus:response.status,runtimeMs:Date.now()-started,ok:response.ok&&!body?.error,logCount:Array.isArray(body?.result)?body.result.length:null,error:body?.error?.message||(!response.ok?text.slice(0,240):null)}));
            }catch(error){
              console.log(JSON.stringify({id,runtimeMs:Date.now()-started,ok:false,error:error?.message||String(error)}));
            }
          }
          NODE
