name: Diagnose ve33 Runtime Baseline

on:
  pull_request:
    paths:
      - '.github/workflows/diagnose-ve33-runtime-baseline.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Measure Base historical log request cadence
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const url='https://mainnet.base.org';
          const address='0x227f65131A261548b057215bB1D5Ab2997964C7d';
          const hex=n=>'0x'+n.toString(16);
          const base=50715727;
          let ok=0,failed=0,totalMs=0;
          const failures=[];
          for(let i=0;i<24;i++){
            const fromBlock=base+i*2000,toBlock=fromBlock+1999;
            const started=Date.now();
            try{
              const controller=new AbortController();
              const timer=setTimeout(()=>controller.abort(),15000);
              const response=await fetch(url,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({jsonrpc:'2.0',id:i+1,method:'eth_getLogs',params:[{address,fromBlock:hex(fromBlock),toBlock:hex(toBlock)}]}),signal:controller.signal});
              clearTimeout(timer);
              const text=await response.text();
              let body=null;try{body=JSON.parse(text);}catch{}
              const elapsed=Date.now()-started;totalMs+=elapsed;
              if(response.ok&&!body?.error)ok++;else{failed++;failures.push({i,httpStatus:response.status,error:body?.error?.message||text.slice(0,180)});}
            }catch(error){failed++;failures.push({i,error:error?.message||String(error)});}
          }
          console.log('BASE_CADENCE_JSON_START');
          console.log(JSON.stringify({requests:24,ok,failed,totalMs,avgMs:Math.round(totalMs/24),failures},null,2));
          console.log('BASE_CADENCE_JSON_END');
          NODE
