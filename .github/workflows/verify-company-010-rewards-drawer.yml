name: "Verify Company #010 · Unified Rewards Drawer"

on:
  pull_request:
    branches: [main]
    paths:
      - 'companies/company-010-public-adapter.js'
      - 'rewards/company-010-rewards-overlay.mjs'
      - 'rewards/company-010-ve-rewards.mjs'
      - 'intelligence/project-memory/THE_HOLDING_REWARDS_DRAWER_UI_CANON_2026-08-18.md'
      - 'intelligence/project-memory/THE_HOLDING_KNOWN_MECHANISM_REUSE_AND_PROMOTION_CANON_2026-08-18.md'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Verify unified semantic ledger
        run: |
          set -euo pipefail
          node --check companies/company-010-public-adapter.js
          node - <<'NODE'
          const fs=require('fs');
          const a=fs.readFileSync('companies/company-010-public-adapter.js','utf8');
          const overlay=fs.readFileSync('rewards/company-010-rewards-overlay.mjs','utf8');
          const canon=fs.readFileSync('intelligence/project-memory/THE_HOLDING_REWARDS_DRAWER_UI_CANON_2026-08-18.md','utf8');

          const must=[
            'v0.10-unified-rewards-gmx-apy-capsule',
            'v0.10.2-measured-earned-presentation-parity',
            'ensureUnifiedStrategyRewards',
            'syncMeasuredEarnedPresentation',
            'measuredEarnedTotal',
            'panelHasStrategy',
            'embeddedRoute',
            'rewardSource',
            'compactEmbeddedAmount',
            'cy-strategy-state-row',
            'Concentrator · sdCRV',
            'Aerodrome · veAERO',
            'Velodrome · veVELO',
            'embeddedIncome',
            'Compounded',
            'Claimable',
            'Pending'
          ];
          for(const x of must)if(!a.includes(x))throw new Error('unified drawer contract missing: '+x);

          for(const legacy of ['ensureCrvStrategyIncome','ensureVeStrategyIncome','CRV · strategy income','veAERO / veVELO · income']){
            if(a.includes(legacy))throw new Error('duplicate legacy sub-ledger remains: '+legacy);
          }

          if(!a.includes("if(panelHasStrategy(panel,label))return"))throw new Error('native-row dedupe invariant missing');
          if(!a.includes("panel.querySelector('.cy-crv-income')?.remove()")||!a.includes("panel.querySelector('.cy-ve-income')?.remove()"))throw new Error('legacy DOM cleanup missing');
          if(!a.includes("const stateName=['Compounded','Claimable'].includes(rawState)?rawState:'Pending'"))throw new Error('backend state projection missing');
          if(!a.includes("stateName==='Compounded'?compactEmbeddedAmount(route):{amount:'',usd:'',symbol:'',chain:''}"))throw new Error('embedded Compounded projection missing');
          if(!a.includes("usd:finite(x.usdValue)?money2(x.usdValue):''"))throw new Error('embedded USD projection missing');
          if(!a.includes("['Aerodrome','Aerodrome · veAERO','aerodrome-ve','AERO','Base']")||!a.includes("['Velodrome','Velodrome · veVELO','velodrome-ve-direct','VELO','Optimism']"))throw new Error('known ve productive identity mapping missing');
          if(a.includes("['Aerodrome','aerodrome-ve','AERO','Base']")||a.includes("['Velodrome','velodrome-ve-direct','VELO','Optimism']"))throw new Error('generic ve identity mapping regression remains');
          if(!a.includes("appendStrategyStateRow(panel,{label,meta,stateName"))throw new Error('productive label projection missing');
          if(a.includes("appendStrategyStateRow(panel,{label:name,meta,stateName"))throw new Error('custom adapter still degrades productive identity to protocol-only label');
          if(!a.includes('`${symbol} · ${chain} · Rebase`'))throw new Error('generic ve Rebase metadata missing');
          if(!a.includes("amountMeta:stateName==='Compounded'?embedded.usd:''"))throw new Error('clean Compounded USD display missing');
          if(a.includes('Embedded income · ${embedded.usd}')||a.includes('Yield remains inside the managed veNFT'))throw new Error('Cypher-specific ve presentation regression remains');
          if(!overlay.includes('measuredEarnedUsd=round(knownAccruedUsd+measuredEmbeddedUsd,6)'))throw new Error('measured earned aggregate contract missing');
          if(!overlay.includes('usdValueIncludedInClaimableTotal:false'))throw new Error('claimable boundary missing');

          const canonMust=['one primary Accrued Rewards / strategy-income drawer','native measured row wins','Unclaimed','Compounded','Pending / Warming','embeddedIncome','unknown != zero','The Rewards Drawer is a unified state ledger'];
          for(const x of canonMust)if(!canon.includes(x))throw new Error('Rewards Drawer canon missing: '+x);
          console.log('Unified Rewards Drawer + productive ve identity parity PASS');
          NODE
      - name: Verify GMX uses shared responsive capsule
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs');const a=fs.readFileSync('companies/company-010-public-adapter.js','utf8');
          for(const x of ['gmxCompactState','ensureGmxApyCapsule','gmx-combined-apy-capsule','ipx-strategy-rate-badge gmx-multi',"<span>APY</span><strong>${compact.apy}</strong>","pill.classList.add('has-strategy-rate')"]){if(!a.includes(x))throw new Error('GMX APY capsule contract missing: '+x)}
          if(a.includes('GMX · ETH-USDC / BTC-USDC · APY'))throw new Error('GMX APY still inline in strategy label');
          console.log('GMX shared responsive APY capsule PASS');
          NODE
      - name: Verify read-only presentation boundary
        run: |
          set -euo pipefail
          ! grep -Eqi 'wallet\.send|sendTransaction|eth_sendTransaction|eth_sendRawTransaction|private[_ -]?key|mnemonic|signer\.send' companies/company-010-public-adapter.js
