name: Diagnose PR828 ve33 Workload Shape
on:
  push:
    branches:
      - diagnostic/pr828-ve33-runtime-telemetry-20260915
    paths:
      - '.github/workflows/diagnose-pr828-ve33-workload-shape.yml'
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock ethers@6
      - name: Print ve33 workload shape without live RPC
        run: |
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          import { trackedPositionDescriptors, buildSettlementAddressGroups, PROTOCOLS } from './reporting/ve33-accounting-evidence.mjs';
          const rewards=JSON.parse(fs.readFileSync('./companies/rewards-data.json','utf8'));
          const descriptors=trackedPositionDescriptors(rewards);
          const out={};
          for(const protocolKey of Object.keys(PROTOCOLS)){
            const rows=descriptors.filter(x=>x.protocolKey===protocolKey);
            const rewardContracts=[...new Set(rows.flatMap(x=>x.rewardContracts||[]).map(x=>String(x).toLowerCase()))];
            const syntheticLanes=rewardContracts.map(rewardContract=>({kind:'voting-reward',rewardContract}));
            const groups=buildSettlementAddressGroups(syntheticLanes,96);
            out[protocolKey]={
              descriptorCount:rows.length,
              directDescriptorCount:rows.filter(x=>x.mode==='direct').length,
              managedDescriptorCount:rows.filter(x=>x.mode==='managed').length,
              uniqueTokenIds:new Set(rows.map(x=>String(x.tokenId))).size,
              uniqueRewardContracts:rewardContracts.length,
              pooledRewardGroups96:groups.length,
              pooledRewardGroupSizes:groups.map(x=>x.length)
            };
          }
          console.log('PR828_VE33_WORKLOAD_SHAPE='+JSON.stringify(out,null,2));
          NODE
