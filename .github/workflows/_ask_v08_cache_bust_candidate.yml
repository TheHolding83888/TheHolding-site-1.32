name: "Ask candidate · v0.8 Cache Bust"

on:
  push:
    branches: [agents/ask-change-salience-v0.8-20260815]
    paths:
      - '.github/workflows/_ask_v08_cache_bust_candidate.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout candidate
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: agents/ask-change-salience-v0.8-20260815
          fetch-depth: 0

      - name: Advance exact Ask asset and self-clean
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "The Holding Production Integrator"
          git config user.email "production-integrator@theholding.ai"
          python - <<'PY'
          from pathlib import Path
          p=Path('agents/index.html')
          s=p.read_text()
          old='/agents/console/app.js?v=0.7'
          new='/agents/console/app.js?v=0.8'
          if s.count(old) != 1:
              raise SystemExit(f'expected exactly one v0.7 Ask asset, found {s.count(old)}')
          if new in s:
              raise SystemExit('v0.8 Ask asset already present unexpectedly')
          p.write_text(s.replace(old,new))
          PY
          grep -F '/agents/console/app.js?v=0.8' agents/index.html >/dev/null
          test "$(grep -o '/agents/console/app.js?v=0.8' agents/index.html | wc -l)" = "1"
          node --check agents/console/app.js
          rm -f .github/workflows/_ask_v08_cache_bust_candidate.yml
          git add -A
          git diff --check --cached
          expected=$'.github/workflows/_ask_v08_cache_bust_candidate.yml\nagents/index.html'
          actual="$(git diff --cached --name-only | sort)"
          test "$actual" = "$expected"
          git commit -m "Ask v0.8: advance production asset cache bust"
          git push origin HEAD:agents/ask-change-salience-v0.8-20260815
