name: "Diagnostic · Proposal Current State"

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-proposal-current-state.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout diagnostic head
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Static Proposal release guard
        run: node intelligence/proposals/proposal-release-guard.mjs

      - name: Verify current Learning → Cognitive binding
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('fs');
          const crypto = require('crypto');
          const sha = p => crypto.createHash('sha256').update(fs.readFileSync(p)).digest('hex');
          const stack = JSON.parse(fs.readFileSync('intelligence/cognitive-stack-state.json','utf8'));
          const learning = JSON.parse(fs.readFileSync('intelligence/learning-state/learning-context.json','utf8'));
          const ledger = JSON.parse(fs.readFileSync('intelligence/learning/decision-ledger.json','utf8'));
          if (stack.readyForManualInterpretation !== true) throw new Error('Cognitive Stack not ready');
          if (stack.operatingContract?.executionAuthority !== 'none') throw new Error('Execution authority changed');
          if (learning.status !== 'ready') throw new Error(`Learning not ready: ${learning.status}`);
          if (learning.source?.cognitiveChainHash !== stack.integrity?.chainHash) throw new Error('Learning/Cognitive chain mismatch');
          if (learning.source?.decisionLedgerHash !== ledger.integrity?.ledgerHash) throw new Error('Learning/Decision Ledger mismatch');
          if (stack.chain?.groundedBrain?.sha256 && stack.chain.groundedBrain.sha256 !== sha('intelligence/brain-intelligence.json')) throw new Error('Brain/Cognitive byte binding mismatch');
          console.log('Current Proposal source binding PASS', {
            learningGeneratedAt: learning.generatedAt,
            activeCases: learning.summary?.activeCaseCount,
            decisionWorthy: learning.summary?.decisionWorthyActiveCaseCount,
            decisions: ledger.decisionCount
          });
          NODE

      - name: Build Proposal queue
        run: node intelligence/proposals/proposal-engine.mjs

      - name: Reflect Decision Memory
        run: node intelligence/proposals/proposal-decision-bridge.mjs

      - name: Independent Proposal reviewer
        shell: bash
        run: |
          set -euo pipefail
          if ! node intelligence/proposals/independent-proposal-reviewer.mjs; then
            echo '--- proposal-eval.json ---'
            cat intelligence/proposals/proposal-eval.json
            exit 1
          fi

      - name: Independent Decision reviewer
        run: node intelligence/proposals/independent-proposal-decision-reviewer.mjs

      - name: Verify no-execution boundary
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('fs');
          const q = JSON.parse(fs.readFileSync('intelligence/proposals/proposal-queue.json','utf8'));
          const e = JSON.parse(fs.readFileSync('intelligence/proposals/proposal-eval.json','utf8'));
          const d = JSON.parse(fs.readFileSync('intelligence/proposals/proposal-decision-eval.json','utf8'));
          if (e.status !== 'pass' || d.status !== 'pass') throw new Error('Proposal reviewer did not PASS');
          if (q.constraints?.noProductionExecution !== true || q.constraints?.noAutomaticCodeChanges !== true || q.constraints?.noAutomaticApprovals !== true) throw new Error('Proposal boundary changed');
          if (q.decisionBridge?.productionMutationAuthorized !== false || q.decisionBridge?.executionAuthority !== 'none') throw new Error('Decision Bridge authority changed');
          console.log('Proposal current-state diagnostic PASS', {
            generatedAt: q.generatedAt,
            activeCases: q.summary?.activeCaseCount,
            activeProposals: q.summary?.activeProposalCount,
            states: q.summary?.stateCounts,
            executionAuthority: q.decisionBridge?.executionAuthority
          });
          NODE
          git diff --check
