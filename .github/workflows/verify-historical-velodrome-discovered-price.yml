name: Verify Historical Velodrome Discovered Price

on:
  pull_request:
    paths:
      - 'reporting/historical-canonical-price.mjs'
      - 'reporting/historical-canonical-price-validation.mjs'
      - 'reporting/historical-velodrome-usdc-route.mjs'
      - 'reporting/historical-velodrome-usdc-route-validation.mjs'
      - 'reporting/historical-velodrome-discovered-price.mjs'
      - 'reporting/historical-velodrome-discovered-price-validation.mjs'
      - '.github/workflows/verify-historical-velodrome-discovered-price.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-discovered-price:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: Install canonical historical valuation dependency
        run: npm install --no-save --no-package-lock ethers@6

      - name: Validate generic historical Velodrome reward pricing
        run: |
          set -euo pipefail
          node --check reporting/historical-velodrome-usdc-route.mjs
          node --check reporting/historical-velodrome-usdc-route-validation.mjs
          node --check reporting/historical-velodrome-discovered-price.mjs
          node --check reporting/historical-velodrome-discovered-price-validation.mjs
          node --check reporting/historical-canonical-price.mjs
          node reporting/historical-velodrome-usdc-route-validation.mjs
          node reporting/historical-velodrome-discovered-price-validation.mjs
          node reporting/historical-canonical-price-validation.mjs
          git diff --check
