# THE HOLDING · EXPLANATORY CONTEXT v0.3 · canonical downstream cognitive wake source
name: "The Holding · Explanatory Context"

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - "The Holding · Economic Graph"
      - "The Holding · Comparative Intelligence"
    types: [completed]
  pull_request:
    paths:
      - "intelligence/explanatory/**"
      - "intelligence/economic-graph/**"
  push:
    branches:
      - main
    paths:
      - "intelligence/comparative/comparative-intelligence.json"
      - "intelligence/income-performance/income-performance.json"
      - "intelligence/economic-graph/economic-graph.json"
      - ".github/workflows/update-explanatory-context.yml"

permissions:
  contents: write

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('the-holding-explanatory-context-pr-{0}', github.event.pull_request.number) || 'the-holding-explanatory-context-production' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    if: >-
      ${{
        github.event_name != 'workflow_run' ||
        (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 6

    steps:
      - name: Checkout canonical state
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || 'main' }}

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Static preflight
        shell: bash
        run: |
          set -euo pipefail
          test -s intelligence/explanatory/explanatory-context.mjs
          test -s intelligence/explanatory/vlcvx-votium-curve-shadow-context.mjs
          test -s intelligence/explanatory/explanatory-handoff-canary.mjs
          test -s intelligence/explanatory/workflow-concurrency-canary.mjs
          test -s intelligence/comparative/comparative-intelligence.json
          test -s intelligence/income-performance/income-performance.json
          test -s intelligence/economic-graph/economic-graph.json
          test -s intelligence/economic-graph/economic-graph-canonical-runner.mjs
          test -s intelligence/economic-graph/vlcvx-votium-deep-evidence.mjs
          node --check intelligence/explanatory/explanatory-context.mjs
          node --check intelligence/explanatory/vlcvx-votium-curve-shadow-context.mjs
          node --check intelligence/explanatory/explanatory-handoff-canary.mjs
          node --check intelligence/explanatory/workflow-concurrency-canary.mjs
          node intelligence/explanatory/explanatory-handoff-canary.mjs
          node intelligence/explanatory/workflow-concurrency-canary.mjs
          node --check intelligence/economic-graph/economic-graph-canonical-runner.mjs
          grep -q "multiCohortRule" intelligence/explanatory/explanatory-context.mjs
          grep -q "protocolAprChangeContexts" intelligence/explanatory/explanatory-context.mjs
          grep -q "mechanismRule" intelligence/explanatory/explanatory-context.mjs
          grep -q "associationRule" intelligence/explanatory/explanatory-context.mjs
          grep -q "executionAuthority: 'none'" intelligence/explanatory/explanatory-context.mjs
          grep -q "causalClaimAuthority: 'none'" intelligence/explanatory/explanatory-context.mjs

      - name: Build Explanatory Context
        run: |
          set -euo pipefail
          # A PR checkout carries the last materialized Graph JSON from main.
          # Rebuild it locally from the reviewed PR head so Explanatory validates
          # exactly the Graph bytes this source package would produce. Production
          # workflow_run/push paths consume the already-materialized Graph on main.
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            node intelligence/economic-graph/economic-graph-canonical-runner.mjs
          fi
          node intelligence/explanatory/explanatory-context.mjs
          node intelligence/explanatory/vlcvx-votium-curve-shadow-context.mjs

      - name: Validate multi-cohort explanation semantics
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('fs');
          const crypto = require('crypto');
          const x = JSON.parse(fs.readFileSync('intelligence/explanatory/explanatory-context.json','utf8'));
          if (x.version !== '0.2-explanatory-context') throw new Error('unexpected version');
          if (x.engineVersion !== '0.3-multi-cohort-protocol-economic-context') throw new Error('unexpected engine');
          if (x.status !== 'partial') throw new Error('Explanatory Context must remain partial');
          if (Number(x.coverage?.protocolEconomicCohortCount) !== 2) throw new Error('two-cohort Explanatory coverage missing');
          if (x.coverage?.legacyProtocolAprChangeContextAlias !== 'defitea-fxn-vefxn') throw new Error('legacy context alias contract missing');
          if (x.authority?.executionAuthority !== 'none' || x.authority?.readOnly !== true) throw new Error('authority regression');
          if (x.authority?.capitalExecution !== false || x.authority?.allocationAuthority !== false || x.authority?.recommendationAuthority !== false) throw new Error('capital/recommendation authority regression');
          if (x.authority?.causalClaimAuthority !== 'none' || x.authority?.methodologyMutationAuthority !== false) throw new Error('causal/methodology authority regression');

          const r = x.explanations?.referenceProductivity;
          if (r?.status !== 'answerable-by-metric-identity') throw new Error('reference productivity explanation missing');
          const a = r.highestReferenceApr;
          const o = r.highestAnnualizedReferenceOutput;
          if (!a || !o) throw new Error('top APR/output rows missing');
          if (Math.abs(a.identities.reproducedUsd - a.annualizedReferenceOutputUsd) > 0.02) throw new Error('top APR output identity drift');
          if (Math.abs(o.identities.reproducedUsd - o.annualizedReferenceOutputUsd) > 0.02) throw new Error('top output identity drift');

          const m = x.explanations?.monetraLatestIncome;
          if (m?.status !== 'answerable-for-latest-measured-interval-only') throw new Error('Monetra latest explanation missing');
          if (m.interval?.exactCalendarDay !== false) throw new Error('latest interval mislabeled as calendar day');
          const inc = m.contributors.reduce((s,v)=>s+Number(v.latestMeasuredIncomeUsd||0),0);
          if (Math.abs(inc - Number(m.interval.incomeUsd)) > 0.00002) throw new Error('Monetra contributor reconciliation drift');

          const p = x.explanations?.monetraPerformanceReconciliation;
          if (p?.status !== 'answerable-by-reconciliation-identity') throw new Error('performance reconciliation missing');
          if (Math.abs(Number(p.reproducedNetMarketPnlUsd) - Number(p.netMarketPnlUsd)) > 0.00002) throw new Error('net P&L reconciliation drift');

          const contexts = x.explanations?.protocolAprChangeContexts;
          const fx = contexts?.['defitea-fxn-vefxn'];
          const curve = contexts?.['defitea-curve-vecrv'];
          if (!fx || !curve || Object.keys(contexts).length !== 2) throw new Error('canonical two protocol contexts missing');

          if (fx.status !== 'context-available-causal-attribution-unresolved') throw new Error('veFXN context status drift');
          if (fx.coverage?.companyRegistry !== '004' || fx.coverage?.protocol !== 'f(x)') throw new Error('veFXN cohort identity drift');
          if (fx.causalAttribution !== 'unresolved' || fx.primaryDriver !== null || fx.causalClass !== 'measured-context-only') throw new Error('veFXN causal boundary weakened');
          if (Math.abs(Number(fx.apr?.parityDeltaPctPoints)) > 0.01) throw new Error('veFXN APR parity drift');
          if (!Number.isFinite(Number(fx.measuredDrivers?.fxnLocked)) || !Number.isFinite(Number(fx.measuredDrivers?.totalVeFxn))) throw new Error('veFXN economic drivers missing');
          const legacy = x.explanations?.protocolAprChangeContext;
          if (legacy?.coverage?.cohortId !== 'defitea-fxn-vefxn' || legacy?.provenance?.observationId !== fx.provenance?.observationId) throw new Error('legacy veFXN alias no longer matches canonical context');

          if (curve.status !== 'mechanics-proven-upstream-cause-unresolved') throw new Error('Curve context status drift');
          if (curve.coverage?.companyRegistry !== '004' || curve.coverage?.protocol !== 'Curve' || curve.coverage?.mechanism !== 'veCRV Fee Distributor') throw new Error('Curve cohort identity drift');
          if (curve.mechanics?.status !== 'proven-canonical-collector-identity' || curve.mechanics?.mechanicalAttribution !== 'proven-within-apr-formula') throw new Error('Curve mechanical proof missing');
          if (Math.abs(Number(curve.apr?.formulaParityDeltaPctPoints)) > 0.01) throw new Error('Curve formula parity drift');
          if (curve.causalAttribution !== 'unresolved-beyond-formula' || curve.primaryDriver !== null) throw new Error('Curve upstream cause over-promoted');
          if (!Number.isFinite(Number(curve.measuredDrivers?.rollingFourWeekFeesCrvUSD)) || !Number.isFinite(Number(curve.measuredDrivers?.rollingAverageVeSupply)) || !Number.isFinite(Number(curve.measuredDrivers?.crvPriceUsd))) throw new Error('Curve mechanical drivers missing');
          if (curve.provenance?.sourceType !== 'onchain') throw new Error('Curve source authority drift');

          const flow = x.explanations?.protocolFlowContexts?.['defitea-convex-vlcvx-votium'];
          if (x.extensions?.vlCvxVotiumCurve !== '0.1-vlcvx-votium-curve-shadow-context') throw new Error('vlCVX shadow extension version missing');
          if (Number(x.coverage?.shadowProtocolFlowContextCount) !== 1 || !flow) throw new Error('vlCVX shadow flow context missing');
          if (flow.coverage?.canonicalProtocolEconomicCohort !== false || flow.coverage?.shadowCandidate !== true) throw new Error('vlCVX shadow/canonical boundary drift');
          if (Number(flow.coverage?.onchainVotiumGaugesExactMatched) !== 79 || Number(flow.coverage?.curveExecutedVotiumGaugeRows) !== 79 || Number(flow.coverage?.currentCurvePoolContextsComplete) !== 31 || Number(flow.coverage?.unresolvedEligiblePoolContexts) !== 0) throw new Error('vlCVX downstream proof coverage drift');
          if (flow.measuredRelations?.voteToExecutedCurveGaugeBps?.class !== 'ATTRIBUTED') throw new Error('vlCVX mechanical execution attribution missing');
          if (flow.measuredRelations?.incentiveToVote?.class !== 'CORRELATED' || flow.measuredRelations?.historicalVoteToCurrentPoolState?.class !== 'CORRELATED') throw new Error('vlCVX causal boundary weakened');
          if (flow.downstreamCurrentContext?.exactFeeUsd !== 'UNKNOWN') throw new Error('Exact Curve fee USD must remain UNKNOWN');
          if (flow.causalBoundary?.primaryDriver !== null || flow.authority?.executionAuthority !== 'none' || flow.authority?.causalClaimAuthority !== 'none' || flow.authority?.promotionAuthority !== 'none') throw new Error('vlCVX authority/causal boundary drift');

          if (x.answerability?.['what-protocol-contexts-accompanied-apr'] !== 'answerable-by-canonical-multi-cohort-context') throw new Error('multi-cohort answerability missing');
          if (x.answerability?.['how-curve-vecrv-reference-apr-is-formed'] !== 'answerable-by-proven-mechanical-identity') throw new Error('Curve formula answerability missing');
          if (x.answerability?.['why-protocol-apr-changed'] !== 'context-available-cause-unresolved') throw new Error('generic upstream causal guard weakened');
          if (x.answerability?.['why-curve-fee-distributions-changed'] !== 'blocked-no-upstream-fee-origin-evidence') throw new Error('Curve upstream causal guard missing');
          if (x.answerability?.['why-market-moved'] !== 'blocked-no-market-causal-evidence') throw new Error('market causal guard missing');
          if (x.answerability?.['how-votium-votes-reached-curve-gauges'] !== 'answerable-by-proven-mechanical-execution-bridge') throw new Error('Votium → Curve mechanical answerability missing');
          if (x.answerability?.['did-votium-incentives-cause-vlcvx-votes'] !== 'blocked-causal-link-unproven') throw new Error('Votium incentive causal guard missing');
          if (x.answerability?.['did-vlcvx-votes-cause-current-curve-pool-outcomes'] !== 'blocked-causal-link-unproven') throw new Error('Curve pool causal guard missing');

          const graphBytes = fs.readFileSync('intelligence/economic-graph/economic-graph.json');
          const graphHash = crypto.createHash('sha256').update(graphBytes).digest('hex');
          if (x.sourceState?.economicGraph?.sha256 !== graphHash || Number(x.sourceState?.economicGraph?.cohortCount) !== 2) throw new Error('Economic Graph exact-byte/coverage binding missing');
          if (fx.provenance?.graphSha256 !== graphHash || curve.provenance?.graphSha256 !== graphHash || flow.provenance?.graphSha256 !== graphHash) throw new Error('protocol context provenance hash mismatch');

          console.log('EXPLANATORY CONTEXT v0.3 + VLCVX SHADOW PASS', {
            canonicalCohorts:x.coverage.protocolEconomicCohortCount,
            shadowFlowContexts:x.coverage.shadowProtocolFlowContextCount,
            fxnCausality:fx.causalAttribution,
            curveMechanicalAttribution:curve.mechanics.mechanicalAttribution,
            vlcvxCurveExecutedGaugeRows:flow.coverage.curveExecutedVotiumGaugeRows,
            vlcvxCurrentPoolContexts:flow.coverage.currentPoolContextsComplete,
            exactFeeUsd:flow.downstreamCurrentContext.exactFeeUsd,
            executionAuthority:x.authority.executionAuthority
          });
          NODE
          git diff --check

      - name: Publish generated Explanatory Context
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          GENERATED="intelligence/explanatory/explanatory-context.json"
          test -s "$GENERATED"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$GENERATED"

          staged_bad="$(git diff --cached --name-only | grep -Ev '^intelligence/explanatory/explanatory-context\.json$' || true)"
          if [ -n "$staged_bad" ]; then
            echo "ERROR: Explanatory Context attempted to stage outside generated boundary:"
            echo "$staged_bad"
            exit 1
          fi

          if git diff --cached --quiet; then
            echo "Explanatory Context already current."
            exit 0
          fi

          git commit -m "intelligence: refresh explanatory context"

          for attempt in 1 2 3; do
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "Publish conflict; refusing to guess."
              exit 1
            fi

            node intelligence/explanatory/explanatory-context.mjs
            node intelligence/explanatory/vlcvx-votium-curve-shadow-context.mjs
            git add "$GENERATED"
            if ! git diff --cached --quiet; then git commit --amend --no-edit; fi

            if git push origin HEAD:main; then
              git fetch origin main
              git cat-file -e "origin/main:$GENERATED"
              REMOTE_ENGINE="$(git show "origin/main:$GENERATED" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>console.log(JSON.parse(s).engineVersion))")"
              test "$REMOTE_ENGINE" = "0.3-multi-cohort-protocol-economic-context"
              REMOTE_COHORTS="$(git show "origin/main:$GENERATED" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>console.log(JSON.parse(s).coverage?.protocolEconomicCohortCount))")"
              test "$REMOTE_COHORTS" = "2"
              REMOTE_SHADOW="$(git show "origin/main:$GENERATED" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>console.log(JSON.parse(s).coverage?.shadowProtocolFlowContextCount))")"
              test "$REMOTE_SHADOW" = "1"
              echo "Verified Explanatory Context v0.3 + vlCVX shadow flow state on remote main."
              exit 0
            fi

            echo "Main moved during push; retrying ($attempt/3)..."
            sleep $((attempt * 2))
          done

          echo "Explanatory Context publish failed after 3 attempts."
          exit 1
