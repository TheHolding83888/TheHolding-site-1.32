name: "Validate YieldRing Capital + veAERO Relay"

on:
  pull_request:
    paths:
      - 'companies/company-capital-state-contract.mjs'
      - 'companies/yieldring-canonical-state.json'
      - 'companies/yieldring-public-capital-projection.mjs'
      - 'productivity/yieldring-productivity-overlay.mjs'
      - 'intelligence/capital-state/general-company-balance-sheet.mjs'
      - '.github/workflows/project-yieldring-capital-state.yml'
      - '.github/workflows/update-productivity.yml'
      - '.github/workflows/validate-yieldring-capital-state.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout PR head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Validate complete owner-evidenced capital contract
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs');
          const s=JSON.parse(fs.readFileSync('companies/yieldring-canonical-state.json','utf8'));
          const close=(a,b,t=0.005)=>Number.isFinite(Number(a))&&Math.abs(Number(a)-Number(b))<=t;
          if(s.version!=='0.2-yieldring-canonical-state'||s.company!=='YieldRing.eth'||s.registry!=='002')throw new Error('YieldRing canonical identity drift');
          if(s.wallet?.address!=='0x90815314fB9e7F015AB5845572FE5BcC0Ba14669')throw new Error('YieldRing wallet identity drift');
          if(s.wallet?.onchainReconciliationStatus!=='pending-independent-reproduction')throw new Error('owner evidence was silently upgraded to blockchain-confirmed');
          const positions=Object.values(s.capital||{});
          if(positions.length!==4||positions.some(x=>!(Number(x.quantity)>0)||!Number.isFinite(Number(x.costBasisUsd))||x.costBasisStatus!=='complete')throw new Error('YieldRing current position basis is not complete');
          const total=positions.reduce((n,x)=>n+Number(x.costBasisUsd),0);
          if(!close(total,2984.6)||!close(s.portfolioCostBasis?.totalUsd,2984.6)||s.portfolioCostBasis?.status!=='complete')throw new Error('YieldRing portfolio basis drift');
          if(!close(s.capital?.bitcoin?.quantity,0.0334)||!close(s.capital?.bitcoin?.costBasisUsd,2123.11))throw new Error('YieldRing BTC basis drift');
          if(!close(s.capital?.aerodrome?.quantity,678)||!close(s.capital?.aerodrome?.costBasisUsd,274.72))throw new Error('YieldRing AERO basis drift');
          if(!close(s.capital?.convex?.quantity,240)||!close(s.capital?.convex?.costBasisUsd,307.2))throw new Error('YieldRing CVX basis drift');
          if(!close(s.capital?.frax?.quantity,1032)||!close(s.capital?.frax?.costBasisUsd,279.57))throw new Error('YieldRing FRAX basis drift');
          if(!close(s.evidenceSnapshot?.marketValueUsd,3713.2)||!close(s.evidenceSnapshot?.investedUsd,2984.6)||!close(s.evidenceSnapshot?.unrealizedProfitUsd,728.6))throw new Error('YieldRing screenshot reconciliation drift');
          const r=s.aerodromeRelay;
          if(r?.mode!=='veAERO Maxi'||r?.managerId!=='10298'||String(r?.managerAddress).toLowerCase()!=='0xc9814f18a8751214f719de15c54d01b3d78ef14f')throw new Error('veAERO Maxi manager drift');
          if(r?.expectedUnderlyingLockCount!==2||r?.aggregatePrincipalAero!==678||r?.rewardsPresentation!=='single-aggregated-aerodrome-line')throw new Error('veAERO aggregation drift');
          if(s.authority?.executionAuthority!=='none'||s.authority?.capitalExecution!==false||s.authority?.walletAction!==false)throw new Error('authority drift');
          console.log('YieldRing canonical complete-basis contract PASS');
          NODE
      - name: Validate deterministic projections
        env:
          FXN_LOCKER_APR_GUARD_MODE: deterministic-validation
        run: |
          set -euo pipefail
          node --check companies/company-capital-state-contract.mjs
          node --check companies/yieldring-public-capital-projection.mjs
          node companies/yieldring-public-capital-projection.mjs
          node --check productivity/yieldring-productivity-overlay.mjs
          node productivity/yieldring-productivity-overlay.mjs
          node - <<'NODE'
          const fs=require('fs');
          const html=fs.readFileSync('companies/index.html','utf8');
          const bal=fs.readFileSync('intelligence/capital-state/general-company-balance-sheet.mjs','utf8');
          const d=JSON.parse(fs.readFileSync('companies/productivity-data.json','utf8'));
          const c=d.companies?.['YieldRing.eth'];
          const aero=(c?.breakdown||[]).find(x=>x.engineId==='aerodrome_veaero'||x.principalId==='aerodrome-finance');
          for(const n of ["qty: 0.0334","costBasisUsd: 2123.11","qty: 678","costBasisUsd: 274.72","qty: 1032","costBasisUsd: 279.57"]){if(!html.includes(n))throw new Error('Company Book projection missing '+n);}
          if(!bal.includes("const YIELD_RING_STATE = 'companies/yieldring-canonical-state.json';")||!bal.includes('Object.values(yieldRingState.capital||{})')||!bal.includes('yieldRingState.portfolioCostBasis.totalUsd'))throw new Error('General Balance canonical YieldRing state binding missing');
          if(!bal.includes("['1.15','1.16'].includes(productivity.version)"))throw new Error('Productivity compatibility guard missing');
          if(!c||Number(aero?.units)!==678||!(Number(c.productiveValue)>0)||!Number.isFinite(Number(c.aprLatest)))throw new Error('Productivity projection invalid');
          if(d.diagnostics?.yieldRing?.managerId!=='10298'||d.diagnostics?.yieldRing?.executionAuthority!=='none'||d.diagnostics?.yieldRing?.fraxCostBasisStatus!=='complete'||Number(d.diagnostics?.yieldRing?.portfolioCostBasisUsd)!==2984.6)throw new Error('YieldRing diagnostics missing complete basis');
          console.log('YieldRing projections PASS',{aeroUnits:aero.units,aprLatest:c.aprLatest,costBasisUsd:d.diagnostics.yieldRing.portfolioCostBasisUsd});
          NODE
      - name: Validate existing Rewards aggregation architecture
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs');
          const src=fs.readFileSync('rewards/company-rewards-engine.mjs','utf8');
          for(const n of ['idToManaged','managedPositions','veNfts: positions',"route: 'aerodrome-relay'"]){if(!src.includes(n))throw new Error('Aerodrome managed-veNFT aggregation contract missing '+n);}
          console.log('Existing Aerodrome managed-veNFT aggregation PASS');
          NODE
      - name: Diff hygiene
        run: git diff --check
