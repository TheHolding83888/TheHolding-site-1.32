name: "Verify Project Memory · bootstrap contract"

on:
  pull_request:
    paths:
      - 'intelligence/project-memory/**'
      - '.github/workflows/update-project-memory-bootstrap.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Validate memory source contract
        shell: bash
        run: |
          set -euo pipefail
          test -s intelligence/project-memory/README.md
          test -s intelligence/project-memory/THE_HOLDING_OWNER_COLLABORATION_OPERATING_STYLE_2026-08-18.md
          test -s intelligence/project-memory/THE_HOLDING_BUILD_DISCIPLINE_CANON_2026-08-14.md
          test -s intelligence/project-memory/THE_HOLDING_MEMORY_ROUTING_INDEX_2026-08-18.md
          test -s intelligence/project-memory/THE_HOLDING_MEMORY_ROUTING_INDEX_v2_2026-08-26.md
          test -s intelligence/project-memory/build-current-memory.mjs
          test -s intelligence/project-memory/verify-current-memory.mjs
          node --check intelligence/project-memory/build-current-memory.mjs
          node --check intelligence/project-memory/verify-current-memory.mjs

      - name: Rebuild CURRENT from exact PR head
        shell: bash
        run: |
          set -euo pipefail
          node intelligence/project-memory/build-current-memory.mjs
          node intelligence/project-memory/verify-current-memory.mjs
          git diff --check

      - name: Verify minimum routed recovery packet
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('intelligence/project-memory/CURRENT.md')
          text = p.read_text()
          section = re.search(r'## Minimum recovery packet\n\n(.*?)\n\nFull Owner Collaboration', text, re.S)
          if not section:
              raise SystemExit('Minimum recovery packet section missing')
          lines = [x.strip() for x in section.group(1).splitlines() if x.strip()]
          if len(lines) != 3:
              raise SystemExit(f'Expected exactly 3 recovery items, got {len(lines)}: {lines}')
          expected = [
              (1, 'THE_HOLDING_MASTER_CONTINUITY_'),
              (2, 'Memory Routing Index v2'),
              (3, 'Follow the router'),
          ]
          for (n, needle), line in zip(expected, lines):
              if not line.startswith(f'{n}. ') or needle not in line:
                  raise SystemExit(f'Recovery item {n} mismatch: {line}')

          forbidden = [
              'Owner Collaboration Operating Style',
              'THE_HOLDING_BUILD_DISCIPLINE_CANON_2026-08-14.md',
              'Project Memory README',
          ]
          for needle in forbidden:
              if needle in section.group(1):
                  raise SystemExit(f'Cold document leaked into hot recovery packet: {needle}')

          routed = re.search(r'## Task-aware retrieval\n\n(.*?)\n\n## Owner collaboration bootstrap', text, re.S)
          if not routed:
              raise SystemExit('Task-aware retrieval section missing')
          routed_text = routed.group(1)
          required = [
              'CURRENT → latest continuity → routing index → task-specific canon/context → live artifact → exact evidence',
              'Do not load every historical checkpoint by default',
              'write changing numeric state to machine artifacts',
          ]
          for needle in required:
              if needle not in routed_text:
                  raise SystemExit(f'Task-aware retrieval contract missing: {needle}')
          print('Minimum routed CURRENT recovery packet PASS')
          PY

      - name: Verify generated mutation boundary
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only)"
          unexpected="$(printf '%s\n' "$changed" | grep -Ev '^intelligence/project-memory/CURRENT\.md$' || true)"
          if [ -n "$unexpected" ]; then
            echo "ERROR: deterministic bootstrap mutated files outside CURRENT.md"
            echo "$unexpected"
            exit 1
          fi
          echo "Generated mutation boundary PASS: CURRENT.md only"
