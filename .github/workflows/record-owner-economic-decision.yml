# holding-workflow-definition-proof: intelligence/reliability/decision-ledger-writer-ownership-proof.mjs
name: "The Holding Brain · Record Owner Economic Decision"

on:
  workflow_dispatch:
    inputs:
      entity:
        description: "Company / economic entity"
        required: true
        type: string
      category:
        description: "Stable owner decision category, e.g. reward-harvest-timing"
        required: true
        type: string
      disposition:
        description: "Owner decision"
        required: true
        default: "defer"
        type: choice
        options:
          - accept
          - defer
          - reject
          - modify
      rationale:
        description: "Why this decision is being made now"
        required: true
        type: string
      expected_outcome:
        description: "Expected result before the outcome is known"
        required: true
        type: string
      evaluation_criterion:
        description: "Observable evidence used later to judge the decision"
        required: true
        type: string
      review_on_or_after:
        description: "Review date YYYY-MM-DD or timestamp"
        required: true
        type: string
      counterevidence:
        description: "Strongest relevant evidence/argument against the choice"
        required: true
        type: string
      invalidation_condition:
        description: "What would trigger earlier review or make the choice wrong"
        required: true
        type: string
      deferred_alternative:
        description: "Material alternative not chosen now"
        required: true
        type: string
      intended_use:
        description: "Optional intended use if/when value is realized"
        required: false
        default: ""
        type: string
      confidence:
        description: "Optional qualitative confidence; never invented by the recorder"
        required: false
        default: ""
        type: string
      evidence_note:
        description: "Optional public provenance/evidence note"
        required: false
        default: ""
        type: string
      supersedes_decision_id:
        description: "Optional earlier decisionId for same stable owner case"
        required: false
        default: ""
        type: string

# The caller must make write-capable GITHUB_TOKEN authority available to the
# reusable canonical writer, but contains no repository mutation steps itself.
permissions:
  contents: write

concurrency:
  group: owner-economic-decision-entry
  cancel-in-progress: false

jobs:
  record-through-canonical-writer:
    uses: ./.github/workflows/record-brain-decision.yml
    with:
      record_mode: owner-economic
      entity: ${{ inputs.entity }}
      category: ${{ inputs.category }}
      disposition: ${{ inputs.disposition }}
      rationale: ${{ inputs.rationale }}
      expected_outcome: ${{ inputs.expected_outcome }}
      evaluation_criterion: ${{ inputs.evaluation_criterion }}
      review_on_or_after: ${{ inputs.review_on_or_after }}
      counterevidence: ${{ inputs.counterevidence }}
      invalidation_condition: ${{ inputs.invalidation_condition }}
      deferred_alternative: ${{ inputs.deferred_alternative }}
      intended_use: ${{ inputs.intended_use }}
      confidence: ${{ inputs.confidence }}
      evidence_note: ${{ inputs.evidence_note }}
      supersedes_decision_id: ${{ inputs.supersedes_decision_id }}
