name: "Validate Canonical Onchain Primary Cohorts"

on:
  pull_request:
    paths:
      - 'intelligence/market-data/market-data-authority-policy.json'
      - 'intelligence/market-data/market-data-authority-selector.mjs'
      - 'intelligence/market-data/market-data-authority-materializer.mjs'
      - 'intelligence/market-data/market-data-authority-selector-validation.mjs'
      - 'intelligence/market-data/onchain-price-source-registry-extensions.json'
      - '.github/workflows/market-data-refresh.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout PR head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Build deterministic healthy reviewed-route fixture
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs');
          const policy=JSON.parse(fs.readFileSync('intelligence/market-data/market-data-authority-policy.json','utf8'));
          const source=JSON.parse(fs.readFileSync('intelligence/market-data/market-data-coingecko.json','utf8'));
          const p='intelligence/market-data/onchain-price-shadow.json';
          const shadow=JSON.parse(fs.readFileSync(p,'utf8'));
          shadow.generatedAt=new Date().toISOString();
          shadow.mode='shadow';
          shadow.status='ok';
          shadow.semantics={...(shadow.semantics||{}),productionPriceAuthority:false};
          shadow.authority={...(shadow.authority||{}),executionAuthority:'none'};
          for(const id of policy.reviewedPilot.assetIds){
            const req=policy.reviewedPilot.routeRequirements[id];
            const o=policy.assetOverrides[id];
            shadow.observations[id]={
              ...(shadow.observations[id]||{}),
              ...req,
              assetId:id,
              source:req.source,
              status:'shadow-ok',
              usd:Number(source.prices[id].usd),
              productionPriceAuthority:false,
              ...(o.requiredDependencyStatus?{dependencyStatus:o.requiredDependencyStatus}:{}),
              ...(o.requiredQuoteAssetId?{quoteAssetId:o.requiredQuoteAssetId}:{}),
              ...(o.requiredFeedQuote?{feedQuote:o.requiredFeedQuote}:{}),
              ...(o.requiredOutputQuote?{outputQuote:o.requiredOutputQuote}:{})
            };
          }
          fs.writeFileSync(p,JSON.stringify(shadow,null,2)+'\n');
          NODE

      - name: Prove healthy canonical universe selects 26 onchain assets
        run: |
          set -euo pipefail
          MARKET_DATA_FORCE_COINGECKO_FAILBACK=false node intelligence/market-data/market-data-authority-materializer.mjs
          node - <<'NODE'
          const fs=require('fs');
          const m=JSON.parse(fs.readFileSync('intelligence/market-data/market-data.json','utf8'));
          const s=JSON.parse(fs.readFileSync('intelligence/market-data/market-data-coingecko.json','utf8'));
          if(Object.keys(s.prices||{}).length!==26)throw new Error('Expected 26 canonical source assets');
          if(m.authority?.onchainSelectedAssetCount!==26||m.authority?.coingeckoSelectedAssetCount!==0)throw new Error('Healthy canonical universe did not select 26/26 onchain');
          if(m.authority?.directOnchainSelectedAssetCount!==10||m.authority?.relativeOnchainSelectedAssetCount!==1||m.authority?.v3RelativeOnchainSelectedAssetCount!==6||m.authority?.reviewedOnchainSelectedAssetCount!==9)throw new Error('Cohort selection counts drift');
          if(m.authority?.fallbackCount!==0||m.authority?.unknownCount!==0)throw new Error('Healthy canonical universe contains fallback/unknown');
          for(const [id,row] of Object.entries(m.prices||{})){
            if(row.authority?.requestedPrimary!=='onchain'||row.authority?.selectedLane!=='onchain'||row.authority?.fallbackUsed!==false)throw new Error(`${id}: healthy canonical authority drift`);
            if(!String(row.source||'').startsWith('onchain-'))throw new Error(`${id}: onchain provenance missing`);
          }
          if(m.prices['tether-gold']?.source!=='onchain-uniswap-v3-twap-chainlink-quote')throw new Error('XAUT token-market provenance drift');
          if(m.prices.elizaos?.source!=='onchain-uniswap-v3-twap-chainlink-quote')throw new Error('ELIZA onchain provenance drift');
          if(m.authority?.executionAuthority!=='none'||m.authority?.capitalExecution!==false||m.authority?.policyMutationAuthority!==false)throw new Error('Authority boundary drift');
          console.log('Healthy 26/26 canonical onchain-primary authority PASS');
          NODE

      - name: Prove one reviewed route failure affects only that asset
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs');
          const p='intelligence/market-data/onchain-price-shadow.json';
          const shadow=JSON.parse(fs.readFileSync(p,'utf8'));
          shadow.observations.elizaos={...shadow.observations.elizaos,status:'rpc-unavailable',usd:null};
          fs.writeFileSync(p,JSON.stringify(shadow,null,2)+'\n');
          NODE
          MARKET_DATA_FORCE_COINGECKO_FAILBACK=false node intelligence/market-data/market-data-authority-materializer.mjs
          node - <<'NODE'
          const fs=require('fs');
          const m=JSON.parse(fs.readFileSync('intelligence/market-data/market-data.json','utf8'));
          const s=JSON.parse(fs.readFileSync('intelligence/market-data/market-data-coingecko.json','utf8'));
          if(m.authority?.onchainSelectedAssetCount!==25||m.authority?.coingeckoSelectedAssetCount!==1||m.authority?.fallbackCount!==1)throw new Error('Single-route failure was not isolated');
          if(m.prices.elizaos?.authority?.selectedLane!=='coingecko-lane'||m.prices.elizaos?.authority?.fallbackUsed!==true)throw new Error('ELIZA incident did not use daily CoinGecko failback');
          if(Number(m.prices.elizaos.usd)!==Number(s.prices.elizaos.usd))throw new Error('ELIZA failback price drift');
          if(m.prices['tether-gold']?.authority?.selectedLane!=='onchain')throw new Error('ELIZA incident disturbed XAUT');
          console.log('Per-asset incident isolation PASS');
          NODE

      - name: Prove emergency cycle failback remains bounded and never zero
        run: |
          set -euo pipefail
          MARKET_DATA_FORCE_COINGECKO_FAILBACK=true node intelligence/market-data/market-data-authority-materializer.mjs
          node - <<'NODE'
          const fs=require('fs');
          const m=JSON.parse(fs.readFileSync('intelligence/market-data/market-data.json','utf8'));
          if(m.authority?.onchainSelectedAssetCount!==0||m.authority?.coingeckoSelectedAssetCount!==26||m.authority?.fallbackCount!==26||m.authority?.unknownCount!==0)throw new Error('Emergency 26-asset failback contract drift');
          for(const [id,row] of Object.entries(m.prices||{}))if(row.authority?.selectedLane!=='coingecko-lane'||row.authority?.fallbackUsed!==true||!(Number(row.usd)>0))throw new Error(`${id}: emergency failback invalid`);
          if(m.authority?.executionAuthority!=='none')throw new Error('Execution authority drift');
          console.log('Emergency 26-asset cached-daily failback PASS');
          NODE
          git diff --check
