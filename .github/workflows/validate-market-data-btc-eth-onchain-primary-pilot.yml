name: "Validate Direct Oracle Onchain Primary Cohort"

on:
  pull_request:
    paths:
      - 'intelligence/market-data/market-data-authority-policy.json'
      - 'intelligence/market-data/market-data-authority-selector.mjs'
      - 'intelligence/market-data/market-data-authority-materializer.mjs'
      - 'intelligence/market-data/market-data-validation-fixture.mjs'
      - 'intelligence/market-data/coingecko-fetch-shim.mjs'
      - '.github/workflows/market-data-refresh.yml'
      - '.github/workflows/validate-market-data-btc-eth-onchain-primary-pilot.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout PR head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Build deterministic source and shadow fixture
        run: |
          set -euo pipefail
          node intelligence/market-data/market-data-validation-fixture.mjs
          node - <<'NODE'
          const fs=require('fs');
          const p='intelligence/market-data/onchain-price-shadow.json';
          const shadow=JSON.parse(fs.readFileSync(p,'utf8'));
          const now=new Date().toISOString();
          const rows={
            bitcoin:{usd:70000,network:'ethereum',contract:'0xF4030086522a5bEEa4988F8cA5B36dbC97BeE88c'},
            ethereum:{usd:2200,network:'ethereum',contract:'0x5f4eC3Df9cbd43714FE2740f5E3616155c5b8419'},
            'aerodrome-finance':{usd:0.47,network:'base',contract:'0x4EC5970fC728C5f65ba413992CD5fF6FD70fcfF0'},
            pendle:{usd:1.45,network:'optimism',contract:'0x58F23F80bF389DB1af9e3aA8c59679806749A8a4'},
            'curve-dao-token':{usd:0.27,network:'ethereum',contract:'0xCd627aA160A6fA45Eb793D19Ef54f5062F20f33f'},
            'frax-share':{usd:0.30,network:'ethereum',contract:'0x6Ebc52C8C1089be9eB3945C4350B68B8E4C2233f'},
            'venice-token':{usd:14.1,network:'base',contract:'0xaabc55ca55d70b034e4daa2551a224239890282f'},
            'internet-computer':{usd:2.35,network:'bsc',contract:'0x84210d9013a30c6ab169e28840a6cc54b60fa042'},
            decentraland:{usd:0.068,network:'polygon',contract:'0xA1CbF3Fe43BC3501e3Fc4b573e822c70e76A7512'},
            'the-sandbox':{usd:0.042,network:'polygon',contract:'0x3D49406EDd4D52Fb7FFd25485f32E073b529C924'}
          };
          shadow.generatedAt=now;
          shadow.mode='shadow';
          shadow.status='ok';
          shadow.semantics={...(shadow.semantics||{}),productionPriceAuthority:false};
          shadow.authority={...(shadow.authority||{}),executionAuthority:'none'};
          shadow.observations=shadow.observations||{};
          for(const [id,x] of Object.entries(rows)){
            shadow.observations[id]={...(shadow.observations[id]||{}),assetId:id,source:'chainlink-v3',network:x.network,contract:x.contract,quote:'USD',status:'shadow-ok',usd:x.usd,productionPriceAuthority:false};
          }
          fs.writeFileSync(p,JSON.stringify(shadow,null,2)+'\n');
          NODE
      - name: Prove healthy cohort selects exactly ten direct oracles
        run: |
          set -euo pipefail
          MARKET_DATA_FORCE_COINGECKO_FAILBACK=false node intelligence/market-data/market-data-authority-materializer.mjs
          node - <<'NODE'
          const fs=require('fs');
          const m=JSON.parse(fs.readFileSync('intelligence/market-data/market-data.json','utf8'));
          const s=JSON.parse(fs.readFileSync('intelligence/market-data/market-data-coingecko.json','utf8'));
          const pilot=['bitcoin','ethereum','aerodrome-finance','pendle','curve-dao-token','frax-share','venice-token','internet-computer','decentraland','the-sandbox'];
          const expected={bitcoin:70000,ethereum:2200,'aerodrome-finance':0.47,pendle:1.45,'curve-dao-token':0.27,'frax-share':0.30,'venice-token':14.1,'internet-computer':2.35,decentraland:0.068,'the-sandbox':0.042};
          if(m.authority?.onchainSelectedAssetCount!==10)throw new Error('Healthy cohort did not select exactly 10 onchain assets');
          for(const id of pilot){
            if(m.prices[id]?.authority?.selectedLane!=='onchain')throw new Error(`${id}: not onchain primary`);
            if(Number(m.prices[id].usd)!==expected[id])throw new Error(`${id}: onchain price mismatch`);
          }
          for(const id of Object.keys(s.prices||{}))if(!pilot.includes(id)&&m.prices[id]?.authority?.selectedLane!=='coingecko-lane')throw new Error(`${id}: non-pilot asset left CoinGecko`);
          if(m.authority?.executionAuthority!=='none')throw new Error('Execution authority drift');
          console.log('Healthy ten-asset direct-oracle cohort PASS');
          NODE
      - name: Prove cycle failure forces ten-asset CoinGecko failback
        run: |
          set -euo pipefail
          MARKET_DATA_FORCE_COINGECKO_FAILBACK=true node intelligence/market-data/market-data-authority-materializer.mjs
          node - <<'NODE'
          const fs=require('fs');
          const m=JSON.parse(fs.readFileSync('intelligence/market-data/market-data.json','utf8'));
          const s=JSON.parse(fs.readFileSync('intelligence/market-data/market-data-coingecko.json','utf8'));
          const pilot=['bitcoin','ethereum','aerodrome-finance','pendle','curve-dao-token','frax-share','venice-token','internet-computer','decentraland','the-sandbox'];
          if(m.authority?.onchainSelectedAssetCount!==0)throw new Error('Forced failback left onchain selections');
          if(m.authority?.fallbackCount!==10)throw new Error('Forced failback must record exactly 10 pilot fallbacks');
          for(const id of pilot){
            if(m.prices[id]?.authority?.selectedLane!=='coingecko-lane'||m.prices[id]?.authority?.fallbackUsed!==true)throw new Error(`${id}: failback provenance missing`);
            if(Number(m.prices[id].usd)!==Number(s.prices[id].usd))throw new Error(`${id}: failback did not use CoinGecko source lane`);
          }
          if(m.semantics?.cycleForcedCoinGeckoFailback!==true)throw new Error('Cycle failback semantic missing');
          console.log('Ten-asset cycle failback PASS');
          NODE
          git diff --check
