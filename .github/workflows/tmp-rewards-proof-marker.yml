name: TEMP Rewards Proof Marker

on:
  push:
    branches:
      - fix/rewards-scheduler-contract-2026-08-27
    paths:
      - '.github/workflows/tmp-rewards-proof-marker.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/rewards-scheduler-contract-2026-08-27
          fetch-depth: 0

      - name: Add paired proof marker and store blob
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/update-company-rewards.yml')
          s=p.read_text()
          marker='# holding-workflow-definition-proof: intelligence/reliability/rewards-scheduler-workflow-definition-proof.mjs\n'
          if marker in s:
              raise SystemExit('proof marker already present')
          anchor='name: Update Company Rewards\n'
          if s.count(anchor)!=1:
              raise SystemExit('workflow name anchor drift')
          s=s.replace(anchor,anchor+marker,1)
          p.write_text(s)
          PY
          node intelligence/reliability/rewards-scheduler-workflow-definition-proof.mjs
          git diff --check
          python3 - <<'PY'
          import base64, json, os, urllib.request
          from pathlib import Path
          content=base64.b64encode(Path('.github/workflows/update-company-rewards.yml').read_bytes()).decode()
          body=json.dumps({'content':content,'encoding':'base64'}).encode()
          req=urllib.request.Request(
            f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/git/blobs",
            data=body,method='POST',headers={
              'Accept':'application/vnd.github+json',
              'Authorization':f"Bearer {os.environ['GH_TOKEN']}",
              'X-GitHub-Api-Version':'2022-11-28',
              'Content-Type':'application/json'})
          with urllib.request.urlopen(req) as r: response=json.load(r)
          sha=response.get('sha')
          if not sha: raise SystemExit('blob sha missing')
          print(f'PATCHED_WORKFLOW_BLOB_SHA={sha}')
          PY
