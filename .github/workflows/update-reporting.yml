# holding-workflow-definition-proof: intelligence/reliability/reporting-scheduler-workflow-definition-proof.mjs
name: Update The Holding Reporting Data

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - "Update Company Rewards"
      - "Update Stable Capital"
      - "The Holding Capital · Unified Refresh"
    types: [completed]
  push:
    branches: [main]
    paths:
      - 'companies/rewards-data.json'
      - 'companies/stable-index-data.json'
      - 'companies/embedded-yield-ledger.json'
      - 'companies/productivity-data.json'
      - 'companies/defitea-canonical-state.json'
      - 'intelligence/realised-cash-flow/realised-cash-flow.json'
      - 'reporting/reporting-scheduler-contract.json'
      - 'reporting/rate-continuity-policy.json'
      - 'reporting/income-ledger-policy.json'
      - 'reporting/reporting-scheduled-runner.mjs'
      - 'reporting/reporting-engine.mjs'
      - 'reporting/reporting-engine-validation.mjs'
      - 'reporting/income-ledger.mjs'
      - 'reporting/income-ledger-validation.mjs'
      - 'reporting/accounting-coverage.mjs'
      - 'reporting/accounting-coverage-validation.mjs'
      - 'reporting/accounting-coverage.json'
      - 'reporting/frax-yield-accounting-evidence.mjs'
      - 'reporting/frax-yield-accounting-evidence-validation.mjs'
      - 'reporting/frax-yield-accounting-evidence.json'
      - 'reporting/yield-basis-accounting-evidence.mjs'
      - 'reporting/yield-basis-accounting-evidence-validation.mjs'
      - 'reporting/yield-basis-income-candidates.mjs'
      - 'reporting/yield-basis-income-candidates-validation.mjs'
      - 'reporting/yield-basis-ledger-admission.mjs'
      - 'reporting/yield-basis-ledger-admission-validation.mjs'
      - 'reporting/yield-basis-accounting-evidence.json'
      - 'reporting/ve33-accounting-evidence.mjs'
      - 'reporting/ve33-accounting-evidence-validation.mjs'
      - 'reporting/ve33-income-candidates.mjs'
      - 'reporting/ve33-income-candidates-validation.mjs'
      - 'reporting/ve33-ledger-admission.mjs'
      - 'reporting/ve33-ledger-admission-validation.mjs'
      - 'reporting/ve33-accounting-evidence.json'
      - 'reporting/ve33-locked-managed-accounting-evidence.mjs'
      - 'reporting/ve33-locked-managed-accounting-evidence-validation.mjs'
      - 'reporting/ve33-locked-managed-income-candidates.mjs'
      - 'reporting/ve33-locked-managed-income-candidates-validation.mjs'
      - 'reporting/ve33-locked-managed-ledger-admission-validation.mjs'
      - 'reporting/ve33-locked-managed-accounting-evidence.json'
      - 'reporting/defitea-forty-acres-settlement.mjs'
      - 'reporting/defitea-forty-acres-settlement-validation.mjs'
      - 'reporting/defitea-income-composition.mjs'
      - 'reporting/defitea-income-composition-validation.mjs'
      - '.github/workflows/update-reporting.yml'
  schedule:
    # Fallback daily heartbeat. Primary freshness is event-driven from canonical
    # Rewards / Stable Capital / Productivity materialization, so a delayed or
    # skipped GitHub cron cannot silently freeze the reporting surface.
    - cron: '31 6 * * *'

permissions:
  contents: write

concurrency:
  group: reporting-daily
  cancel-in-progress: false

jobs:
  update-reporting:
    if: >-
      ${{
        github.event_name != 'workflow_run' ||
        (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: Install accounting runtime dependency
        run: npm install --no-save --no-package-lock ethers@6

      - name: Preflight canonical reporting inputs
        shell: bash
        run: |
          set -euo pipefail
          node --check reporting/reporting-engine.mjs
          node --check reporting/reporting-scheduled-runner.mjs
          node --check reporting/reporting-engine-validation.mjs
          node --check reporting/income-ledger.mjs
          node --check reporting/income-ledger-validation.mjs
          node --check reporting/accounting-coverage.mjs
          node --check reporting/accounting-coverage-validation.mjs
          node --check reporting/frax-yield-accounting-evidence.mjs
          node --check reporting/frax-yield-accounting-evidence-validation.mjs
          node --check reporting/yield-basis-accounting-evidence.mjs
          node --check reporting/yield-basis-accounting-evidence-validation.mjs
          node --check reporting/yield-basis-income-candidates.mjs
          node --check reporting/yield-basis-income-candidates-validation.mjs
          node --check reporting/yield-basis-ledger-admission.mjs
          node --check reporting/yield-basis-ledger-admission-validation.mjs
          node --check reporting/ve33-accounting-evidence.mjs
          node --check reporting/ve33-accounting-evidence-validation.mjs
          node --check reporting/ve33-income-candidates.mjs
          node --check reporting/ve33-income-candidates-validation.mjs
          node --check reporting/ve33-ledger-admission.mjs
          node --check reporting/ve33-ledger-admission-validation.mjs
          node --check reporting/ve33-locked-managed-accounting-evidence.mjs
          node --check reporting/ve33-locked-managed-accounting-evidence-validation.mjs
          node --check reporting/ve33-locked-managed-income-candidates.mjs
          node --check reporting/ve33-locked-managed-income-candidates-validation.mjs
          node --check reporting/ve33-locked-managed-ledger-admission-validation.mjs
          node --check reporting/defitea-income-composition.mjs
          node --check reporting/defitea-income-composition-validation.mjs
          node --check reporting/defitea-forty-acres-settlement.mjs
          node --check reporting/defitea-forty-acres-settlement-validation.mjs
          test -s reporting/reporting-scheduler-contract.json
          test -s reporting/rate-continuity-policy.json
          test -s reporting/income-ledger-policy.json
          test -s reporting/frax-yield-accounting-evidence.json
          test -s reporting/yield-basis-accounting-evidence.json
          test -s reporting/ve33-accounting-evidence.json
          test -s reporting/ve33-locked-managed-accounting-evidence.json
          test -s companies/defitea-canonical-state.json
          test -s companies/productivity-data.json
          test -s companies/rewards-data.json
          test -s intelligence/market-data/market-data.json
          test -s companies/stable-index-data.json
          test -s companies/embedded-yield-ledger.json
          test -s intelligence/realised-cash-flow/realised-cash-flow.json
          node reporting/reporting-scheduled-runner.mjs --validate-contract
          node reporting/reporting-engine-validation.mjs
          node reporting/income-ledger-validation.mjs
          node reporting/frax-yield-accounting-evidence-validation.mjs
          node reporting/yield-basis-accounting-evidence-validation.mjs
          node reporting/yield-basis-income-candidates-validation.mjs
          node reporting/yield-basis-ledger-admission-validation.mjs
          node reporting/ve33-accounting-evidence-validation.mjs
          node reporting/ve33-income-candidates-validation.mjs
          node reporting/ve33-ledger-admission-validation.mjs
          node reporting/ve33-locked-managed-accounting-evidence-validation.mjs
          node reporting/ve33-locked-managed-income-candidates-validation.mjs
          node reporting/ve33-locked-managed-ledger-admission-validation.mjs
          node reporting/defitea-income-composition-validation.mjs
          node reporting/defitea-forty-acres-settlement-validation.mjs
          node - <<'NODE'
          const fs=require('fs');
          const i=JSON.parse(fs.readFileSync('companies/stable-index-data.json','utf8'));
          const c=(i.companies||[]).find(x=>x.registry==='008'||x.name==='Monetra.eth');
          if(!c) throw new Error('Monetra missing from Stable Index');
          if(!(Number(c.productiveStableCapitalUsd)>90)) throw new Error('Monetra Stable Capital implausibly low');
          if(!Number.isFinite(Number(c.displayReferenceApyPct))) throw new Error('Monetra display Reference APY missing');
          const l=JSON.parse(fs.readFileSync('companies/embedded-yield-ledger.json','utf8'));
          if(l.company?.registry!=='008') throw new Error('Monetra Embedded Yield Ledger identity mismatch');
          const p=JSON.parse(fs.readFileSync('reporting/rate-continuity-policy.json','utf8'));
          if(p.version!=='0.1-reporting-rate-continuity'||p.semantics?.unknownIsNotZero!==true||p.semantics?.singleSourceDataFailureMustNotFreezeWholeReport!==true) throw new Error('Reporting rate continuity policy invalid');
          const income=JSON.parse(fs.readFileSync('reporting/income-ledger-policy.json','utf8'));
          if(income.version!=='0.1-canonical-income-ledger-policy'||income.rules?.crossFamilySummationForbidden!==true||income.rules?.claimableDecreaseDoesNotProveRealisedCashFlow!==true||income.rules?.unknownIsNotZero!==true) throw new Error('Canonical Income Ledger policy invalid');
          console.log('Dual-fund reporting + canonical income ledger preflight OK.');
          NODE

      - name: Update Defitea + Monetra daily reporting state
        env:
          DEFITEA_STATE_FILE: ./companies/defitea-canonical-state.json
          PRODUCTIVITY_DATA_FILE: ./companies/productivity-data.json
          MARKET_DATA_FILE: ./intelligence/market-data/market-data.json
          REWARDS_DATA_FILE: ./companies/rewards-data.json
          STABLE_INDEX_DATA_FILE: ./companies/stable-index-data.json
          EMBEDDED_LEDGER_FILE: ./companies/embedded-yield-ledger.json
          RATE_CONTINUITY_POLICY_FILE: ./reporting/rate-continuity-policy.json
          REPORTING_DATA_FILE: ./reporting/reporting-data.json
        run: node reporting/reporting-scheduled-runner.mjs

      - name: Compose Defitea associated income + VoteMarket events
        env:
          PRODUCTIVITY_DATA_FILE: ./companies/productivity-data.json
          REWARDS_DATA_FILE: ./companies/rewards-data.json
          REPORTING_DATA_FILE: ./reporting/reporting-data.json
          DEFITEA_INCOME_LEDGER_FILE: ./reporting/defitea-income-ledger.json
        run: node reporting/defitea-income-composition.mjs

      - name: Settle Defitea 40 Acres Received cash flow
        env:
          REWARDS_DATA_FILE: ./companies/rewards-data.json
          REPORTING_DATA_FILE: ./reporting/reporting-data.json
          DEFITEA_INCOME_LEDGER_FILE: ./reporting/defitea-income-ledger.json
        run: node reporting/defitea-forty-acres-settlement.mjs

      - name: Build Frax veFRAX factual accrual evidence
        env:
          REWARDS_DATA_FILE: ./companies/rewards-data.json
          INCOME_LEDGER_FILE: ./reporting/income-ledger.json
          FRAX_YIELD_EVIDENCE_FILE: ./reporting/frax-yield-accounting-evidence.json
          FRAXTAL_RPC_URL: ${{ secrets.FRAXTAL_RPC_URL }}
        run: node reporting/frax-yield-accounting-evidence.mjs

      - name: Validate Frax veFRAX factual accrual evidence
        run: node reporting/frax-yield-accounting-evidence-validation.mjs

      - name: Build Yield Basis veYB factual accrual evidence
        env:
          REWARDS_DATA_FILE: ./companies/rewards-data.json
          YIELD_BASIS_EVIDENCE_FILE: ./reporting/yield-basis-accounting-evidence.json
          ETH_RPC_URL: ${{ secrets.ETH_RPC_URL }}
        run: node reporting/yield-basis-accounting-evidence.mjs

      - name: Validate Yield Basis veYB factual accrual evidence
        run: |
          node reporting/yield-basis-accounting-evidence-validation.mjs
          node reporting/yield-basis-income-candidates-validation.mjs
          node reporting/yield-basis-ledger-admission-validation.mjs

      - name: Build Aerodrome + Velodrome factual accrual evidence
        env:
          REWARDS_DATA_FILE: ./companies/rewards-data.json
          VE33_EVIDENCE_FILE: ./reporting/ve33-accounting-evidence.json
          BASE_RPC_URL: ${{ secrets.BASE_RPC_URL }}
          OPTIMISM_RPC_URL: ${{ secrets.OPTIMISM_RPC_URL }}
        run: node reporting/ve33-accounting-evidence.mjs

      - name: Validate Aerodrome + Velodrome factual accrual evidence
        run: |
          node reporting/ve33-accounting-evidence-validation.mjs
          node reporting/ve33-income-candidates-validation.mjs
          node reporting/ve33-ledger-admission-validation.mjs
          node reporting/ve33-locked-managed-accounting-evidence-validation.mjs
          node reporting/ve33-locked-managed-income-candidates-validation.mjs
          node reporting/ve33-locked-managed-ledger-admission-validation.mjs

      - name: Build Canonical Income Ledger
        env:
          INCOME_LEDGER_POLICY_FILE: ./reporting/income-ledger-policy.json
          REPORTING_DATA_FILE: ./reporting/reporting-data.json
          DEFITEA_INCOME_LEDGER_FILE: ./reporting/defitea-income-ledger.json
          EMBEDDED_YIELD_LEDGER_FILE: ./companies/embedded-yield-ledger.json
          REWARDS_DATA_FILE: ./companies/rewards-data.json
          REALISED_CASH_FLOW_FILE: ./intelligence/realised-cash-flow/realised-cash-flow.json
          FRAX_YIELD_EVIDENCE_FILE: ./reporting/frax-yield-accounting-evidence.json
          INCOME_LEDGER_FILE: ./reporting/income-ledger.json
        run: node reporting/income-ledger.mjs

      - name: Admit ve33 evidence through Canonical Income Ledger
        env:
          INCOME_LEDGER_POLICY_FILE: ./reporting/income-ledger-policy.json
          REPORTING_DATA_FILE: ./reporting/reporting-data.json
          DEFITEA_INCOME_LEDGER_FILE: ./reporting/defitea-income-ledger.json
          EMBEDDED_YIELD_LEDGER_FILE: ./companies/embedded-yield-ledger.json
          REWARDS_DATA_FILE: ./companies/rewards-data.json
          REALISED_CASH_FLOW_FILE: ./intelligence/realised-cash-flow/realised-cash-flow.json
          FRAX_YIELD_EVIDENCE_FILE: ./reporting/frax-yield-accounting-evidence.json
          VE33_EVIDENCE_FILE: ./reporting/ve33-accounting-evidence.json
          VE33_LOCKED_MANAGED_EVIDENCE_FILE: ./reporting/ve33-locked-managed-accounting-evidence.json
          INCOME_LEDGER_FILE: ./reporting/income-ledger.json
          BASE_RPC_URL: ${{ secrets.BASE_RPC_URL }}
          OPTIMISM_RPC_URL: ${{ secrets.OPTIMISM_RPC_URL }}
        run: node reporting/ve33-ledger-admission.mjs

      - name: Admit Yield Basis evidence through Canonical Income Ledger
        env:
          INCOME_LEDGER_POLICY_FILE: ./reporting/income-ledger-policy.json
          REPORTING_DATA_FILE: ./reporting/reporting-data.json
          DEFITEA_INCOME_LEDGER_FILE: ./reporting/defitea-income-ledger.json
          EMBEDDED_YIELD_LEDGER_FILE: ./companies/embedded-yield-ledger.json
          REWARDS_DATA_FILE: ./companies/rewards-data.json
          REALISED_CASH_FLOW_FILE: ./intelligence/realised-cash-flow/realised-cash-flow.json
          FRAX_YIELD_EVIDENCE_FILE: ./reporting/frax-yield-accounting-evidence.json
          YIELD_BASIS_EVIDENCE_FILE: ./reporting/yield-basis-accounting-evidence.json
          INCOME_LEDGER_FILE: ./reporting/income-ledger.json
        run: node reporting/yield-basis-ledger-admission.mjs

      - name: Build + validate Accounting Coverage Registry
        env:
          PRODUCTIVITY_DATA_FILE: ./companies/productivity-data.json
          INCOME_LEDGER_FILE: ./reporting/income-ledger.json
          EMBEDDED_YIELD_LEDGER_FILE: ./companies/embedded-yield-ledger.json
          VE33_EVIDENCE_FILE: ./reporting/ve33-accounting-evidence.json
          VE33_LOCKED_MANAGED_EVIDENCE_FILE: ./reporting/ve33-locked-managed-accounting-evidence.json
          YIELD_BASIS_EVIDENCE_FILE: ./reporting/yield-basis-accounting-evidence.json
          FRAX_EVIDENCE_FILE: ./reporting/frax-yield-accounting-evidence.json
          ACCOUNTING_COVERAGE_FILE: ./reporting/accounting-coverage.json
        run: |
          node reporting/accounting-coverage.mjs
          node reporting/accounting-coverage-validation.mjs

      - name: Validate generated reporting data
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs');
          const r=JSON.parse(fs.readFileSync('reporting/reporting-data.json','utf8'));
          const schedule=JSON.parse(fs.readFileSync('reporting/reporting-scheduler-contract.json','utf8'));
          const policy=JSON.parse(fs.readFileSync('reporting/rate-continuity-policy.json','utf8'));
          if(r.version!=='1.2.1-resilient-rate-coverage') throw new Error('unexpected reporting version '+r.version);
          if(r.schedule?.defiteaExternalPriceDiscovery!==false) throw new Error('Reporting external price discovery boundary missing');
          if(r.schedule?.dailySnapshot!==schedule.dailySnapshotUtc||r.schedule?.cron!==schedule.cron||r.schedule?.contractVersion!==schedule.version||r.schedule?.contractSource!=='reporting/reporting-scheduler-contract.json') throw new Error('Reporting scheduler output metadata drift');
          if(r.schedule?.rateContinuityPolicyReference!=='reporting/rate-continuity-policy.json') throw new Error('Reporting rate policy provenance missing');

          const d=r.funds?.['defitea.eth'];
          if(!d) throw new Error('Defitea reporting missing');
          const s=d.latestSnapshot||{};
          if(d.exactCanonicalProductivePositionCount!==11) throw new Error('Defitea canonical position contract drift');
          if(s.positionCount!==11||(s.positions||[]).length!==11) throw new Error('Defitea canonical position coverage missing');
          if(!(Number(s.totalValueUsd)>0)||!(Number(s.coveredValueUsd)>=0)||Number(s.coveredValueUsd)>Number(s.totalValueUsd)+0.01) throw new Error('Defitea rate-covered TVL invalid');
          if(!Number.isInteger(s.rateCoveredPositionCount)||s.rateCoveredPositionCount<0||s.rateCoveredPositionCount>11) throw new Error('Defitea rate-covered position count invalid');
          const expectedCovered=(s.positions||[]).filter(x=>x.rateStatus!=='unknown').length;
          if(s.rateCoveredPositionCount!==expectedCovered) throw new Error('Defitea rate-covered position parity drift');
          const expectedCoverage=Number(s.totalValueUsd)>0?Number(s.coveredValueUsd)/Number(s.totalValueUsd):0;
          if(Math.abs(Number(s.coverage)-expectedCoverage)>0.00001) throw new Error('Defitea rate coverage arithmetic drift');
          if(s.fullProductiveCoverage!==(s.rateCoveredPositionCount===11)) throw new Error('Defitea full coverage flag drift');
          if(s.unknownIsNotZero!==true||s.rateContinuityPolicyVersion!==policy.version) throw new Error('Defitea epistemic rate policy missing');
          if(!s.marketDataGeneratedAt||s.priceAuthority!=='canonical-selected-market-data') throw new Error('Defitea canonical Market Data binding missing');
          for(const x of s.positions||[]){
            if(x.priceSource!=='canonical-market-data'||!x.selectedLane||!(Number(x.price)>0)) throw new Error('Defitea canonical price row invalid '+x.principalId);
            if(!['current','carried-forward','unknown'].includes(x.rateStatus)||x.unknownIsNotZero!==true) throw new Error('Defitea rate state invalid '+x.principalId);
            if(x.rateStatus==='unknown'){
              if(x.referenceApr!==null) throw new Error('UNKNOWN rate became numeric '+x.principalId);
            }else if(!Number.isFinite(Number(x.referenceApr))||Number(x.referenceApr)<0) throw new Error('Covered Reference APR invalid '+x.principalId);
            if(x.rateStatus==='carried-forward'&&(!(Number(x.rateAgeDays)>=0)||Number(x.rateAgeDays)>Number(x.maxCarryDays))) throw new Error('Expired carried rate admitted '+x.principalId);
          }
          if(s.missingPrices?.length||s.fallbackPrices?.length) throw new Error('legacy Reporting price fallback arrays must remain empty');
          if(d.vlCvxReconciliation?.referenceIncomeEngine!=='convex_vlcvx'||d.vlCvxReconciliation?.referenceAprIncludesVotiumIncentives!==true||d.vlCvxReconciliation?.claimableSettlementAddedToReferenceCashFlow!==false) throw new Error('Defitea vlCVX reconciliation boundary invalid');

          const composition=d.incomeComposition;
          if(!composition||composition.version!=='0.1-defitea-associated-income-plus-votemarket-events') throw new Error('Defitea income composition missing');
          if(composition.associatedCompanyTvlIncluded!==false||composition.tvlSemantic!=='defitea-only') throw new Error('Associated-company TVL leaked into Defitea TVL semantics');
          if(JSON.stringify(composition.contributors)!==JSON.stringify(['YieldRing.eth','05081966.eth'])) throw new Error('Defitea income contributor contract drift');
          if(JSON.stringify(composition.voteMarketRoutes)!==JSON.stringify(['votemarket-vecrv','votemarket-vefxn'])) throw new Error('Defitea VoteMarket route contract drift');

          const settlement=d.fortyAcresSettlement;
          if(!settlement||settlement.accounting!=='actual-net-received-replaces-velodrome-reference-model'||settlement.referenceDoubleCountPrevented!==true) throw new Error('40 Acres settlement replacement contract missing');
          if(settlement.claimableAffected!==false||settlement.tvlAffected!==false||settlement.executionAuthority!=='none') throw new Error('40 Acres settlement authority boundary drift');

          const ledger=JSON.parse(fs.readFileSync('reporting/defitea-income-ledger.json','utf8'));
          if(ledger.version!=='0.1-defitea-income-composition') throw new Error('Defitea income ledger version drift');
          if(ledger.accounting?.associatedCompanyTvlIncluded!==false||ledger.accounting?.currentClaimableBalanceSummedDaily!==false) throw new Error('Defitea income ledger accounting boundary invalid');
          if((ledger.contributors||[]).some(x=>x.includedInDefiteaTvl!==false||x.incomeIncludedInDefiteaCashFlow!==true)) throw new Error('Defitea contributor capital boundary invalid');
          const keys=(ledger.voteMarketEvents||[]).map(x=>x.eventKey);
          if(new Set(keys).size!==keys.length) throw new Error('VoteMarket income ledger duplicate event identity');
          if((ledger.voteMarketEvents||[]).some(x=>x.eventDate<d.trackingStartedAt||!(Number(x.usdValue)>0)||x.usdValueFrozenAtFirstAdmission!==true)) throw new Error('VoteMarket event admission boundary invalid');
          const fa=ledger.fortyAcresReceivedEvents||[];
          if(new Set(fa.map(x=>x.eventKey)).size!==fa.length) throw new Error('40 Acres Received ledger duplicate event identity');
          if(fa.some(x=>x.eventDate<'2026-08-01'||!(Number(x.usdValue)>0)||x.accounting!=='actual-net-received'||x.executionAuthority!=='none')) throw new Error('40 Acres Received event admission boundary invalid');

          const auto=Object.values(d.months||{}).filter(x=>x?.mode==='reference-model').sort((a,b)=>String(a.month).localeCompare(String(b.month)));
          if(auto.length){
            const first=auto[0];
            if(first.firstTrackingMonth!==true||first.unobservedPreTrackingDaysBackfilled!==false) throw new Error('Defitea first tracking month provenance missing');
            if(first.partialPeriod===true&&Number(first.normalizationFactor)!==1) throw new Error('Defitea first tracking month must never fabricate pre-tracking days');
            for(const m of auto){
              if(m.associatedCompanyTvlIncluded!==false||m.tvlSemantic!=='defitea-only') throw new Error('Defitea monthly TVL semantic drift '+m.month);
              const expected=Number(m.baseDefiteaReferenceCashFlowUsd||0)-Number(m.fortyAcresReplacedReferenceCashFlowUsd||0)+Number(m.associatedCompanyReferenceCashFlowUsd||0)+Number(m.voteMarketObservedIncomeUsd||0)+Number(m.fortyAcresReceivedIncomeUsd||0);
              if(Math.abs(Number(m.cashFlowUsd)-expected)>0.011) throw new Error('Defitea monthly income composition arithmetic drift '+m.month);
              if(m.fortyAcresReferenceDoubleCountPrevented!==true) throw new Error('40 Acres double-count guard missing '+m.month);
            }
          }

          const m=r.funds?.['Monetra.eth'];
          if(!m) throw new Error('Monetra reporting missing');
          if(!(Number(m.latestSnapshot?.stableCapitalUsd)>90)) throw new Error('Monetra Stable Capital missing');
          if(!Number.isFinite(Number(m.latestSnapshot?.referenceApyPct))) throw new Error('Monetra APY missing');
          if(!Number.isFinite(Number(m.latestSnapshot?.modeledDailyGeneratedIncomeUsd))) throw new Error('Monetra daily generated income missing');
          console.log('Dual-fund resilient reporting validation OK.',{rateCovered:s.rateCoveredPositionCount,total:s.positionCount,coverage:s.coverage,carried:s.carriedRatePositions,unknown:s.unknownRatePositions});
          NODE

      - name: Validate Canonical Income Ledger output
        shell: bash
        run: |
          set -euo pipefail
          node reporting/income-ledger-validation.mjs
          node - <<'NODE'
          const fs=require('fs');
          const x=JSON.parse(fs.readFileSync('reporting/income-ledger.json','utf8'));
          const p=JSON.parse(fs.readFileSync('reporting/income-ledger-policy.json','utf8'));
          const frax=JSON.parse(fs.readFileSync('reporting/frax-yield-accounting-evidence.json','utf8'));
          const yb=JSON.parse(fs.readFileSync('reporting/yield-basis-accounting-evidence.json','utf8'));
          const ve33=JSON.parse(fs.readFileSync('reporting/ve33-accounting-evidence.json','utf8'));
          const locked=JSON.parse(fs.readFileSync('reporting/ve33-locked-managed-accounting-evidence.json','utf8'));
          if(x.version!=='0.1-canonical-income-ledger'||x.policyVersion!==p.version||x.status!=='partial') throw new Error('Canonical Income Ledger identity drift');
          if(x.semantics?.unknownIsNotZero!==true||x.semantics?.referenceAprCanBackfillEarnedIncome!==false||x.semantics?.stablePriceEffectSeparate!==true) throw new Error('Canonical Income Ledger semantic drift');
          if(x.authority?.executionAuthority!=='none'||x.authority?.capitalExecution!==false||x.authority?.claimingAuthority!=='none') throw new Error('Canonical Income Ledger authority expansion');
          if(x.accountingExtensions?.fraxYieldAccrual?.version!==frax.version||x.accountingExtensions?.fraxYieldAccrual?.openingBalanceCreatesIncome!==false||x.accountingExtensions?.fraxYieldAccrual?.claimIsSettlementNotSecondIncome!==true||x.accountingExtensions?.fraxYieldAccrual?.laterPriceMovementRewritesClosedIncome!==false) throw new Error('Frax accounting extension contract missing');
          if(x.accountingExtensions?.yieldBasisAccrual?.version!==yb.version||x.accountingExtensions?.yieldBasisAccrual?.openingBalanceCreatesIncome!==false||x.accountingExtensions?.yieldBasisAccrual?.earnedIndependentOfClaim!==true||x.accountingExtensions?.yieldBasisAccrual?.claimIsSettlementNotSecondIncome!==true||x.accountingExtensions?.yieldBasisAccrual?.tokenSpecificReconciliation!==true||x.accountingExtensions?.yieldBasisAccrual?.laterPriceMovementRewritesClosedIncome!==false) throw new Error('Yield Basis accounting extension contract missing');
          if(x.accountingExtensions?.ve33Accrual?.version!==ve33.version||x.accountingExtensions?.ve33Accrual?.openingBalanceCreatesIncome!==false||x.accountingExtensions?.ve33Accrual?.claimIsSettlementNotSecondIncome!==true||x.accountingExtensions?.ve33Accrual?.rebaseDepositIntoVeNftIsSecondIncome!==false||x.accountingExtensions?.ve33Accrual?.laterPriceMovementRewritesClosedIncome!==false) throw new Error('ve33 accounting extension contract missing');
          if(x.accountingExtensions?.ve33LockedManaged?.version!==locked.version||x.accountingExtensions?.ve33LockedManaged?.openingBalanceCreatesIncome!==false||x.accountingExtensions?.ve33LockedManaged?.earnedIndependentOfWithdrawal!==true||x.accountingExtensions?.ve33LockedManaged?.withdrawalIsSettlementNotSecondIncome!==true||x.accountingExtensions?.ve33LockedManaged?.grossVeNftPrincipalDeltaIsIncomeAuthority!==false||x.accountingExtensions?.ve33LockedManaged?.laterPriceMovementRewritesClosedIncome!==false) throw new Error('LockedManagedReward accounting extension contract missing');
          const events=x.events||[];
          if(new Set(events.map(e=>e.eventKey)).size!==events.length) throw new Error('Canonical Income Ledger duplicate event identity');
          if(events.some(e=>!e.immutableEconomicFieldsHash||e.retention!=='indefinite'||e.laterStateChangeDoesNotEraseIncome!==true||e.executionAuthority!=='none')) throw new Error('Canonical Income Ledger event retention/integrity drift');
          const fraxEvents=events.filter(e=>e.route==='frax-yield');
          if(fraxEvents.some(e=>e.family!=='accrued-entitlement'||e.referenceAprUsed!==false||e.currentClaimableBalanceIsPeriodIncome!==false||e.claimIsSecondIncomeEvent!==false||e.laterClaimOrPriceMoveDoesNotRewriteIncome!==true)) throw new Error('Frax income event semantic drift');
          const ybEvents=events.filter(e=>e.sourceFile==='reporting/yield-basis-accounting-evidence.json');
          if(ybEvents.some(e=>e.family!=='accrued-entitlement'||e.route!=='yield-basis-fees'||e.referenceAprUsed!==false||e.currentClaimableBalanceIsPeriodIncome!==false||e.claimIsSecondIncomeEvent!==false||e.laterClaimOrPriceMoveDoesNotRewriteIncome!==true)) throw new Error('Yield Basis income event semantic drift');
          const ve33Events=events.filter(e=>e.sourceFile==='reporting/ve33-accounting-evidence.json');
          if(ve33Events.some(e=>e.family!=='accrued-entitlement'||e.referenceAprUsed!==false||e.currentClaimableBalanceIsPeriodIncome!==false||e.claimIsSecondIncomeEvent!==false||e.laterClaimOrPriceMoveDoesNotRewriteIncome!==true)) throw new Error('ve33 income event semantic drift');
          const lockedEvents=events.filter(e=>e.sourceFile==='reporting/ve33-locked-managed-accounting-evidence.json');
          if(lockedEvents.some(e=>e.family!=='embedded-income'||e.sourceEvidenceFamily!=='embedded-compounded-income'||e.mechanismKind!=='locked-managed-reward'||e.recognitionState!=='compounded-locked'||e.openingBalanceCreatesIncome!==false||e.withdrawalIsSettlementNotSecondIncome!==true||e.grossVeNftPrincipalDeltaIsIncomeAuthority!==false||e.referenceAprUsed!==false||e.claimIsSecondIncomeEvent!==false||e.laterClaimOrPriceMoveDoesNotRewriteIncome!==true)) throw new Error('LockedManagedReward income event semantic drift');
          if((x.claimableSnapshots||[]).some(s=>s.stateOnly!==true||s.periodIncomeAuthority!==false||s.realisedCashFlowAuthority!==false||s.unknownIsNotZero!==true)) throw new Error('Claimable state escaped accounting boundary');
          for(const c of Object.values(x.companies||{})){
            if(c.coverage?.overallComplete!==false||c.coverage?.unknownIsNotZero!==true) throw new Error('Company income coverage silently upgraded');
            for(const m of Object.values(c.monthly||{})) if(m.combinedIncomeUsd!==null||m.crossFamilySumAllowed!==false) throw new Error('Cross-family income collapse detected');
            if((c.claimableContinuity||[]).some(r=>r.periodIncomeAuthority!==false||r.realisedCashFlowAuthority!==false||r.unknownIsNotZero!==true)) throw new Error('Claimable continuity became income authority');
          }
          console.log('Canonical Income Ledger output PASS',{events:events.length,fraxEvents:fraxEvents.length,yieldBasisEvents:ybEvents.length,ve33Events:ve33Events.length,lockedManagedEvents:lockedEvents.length,claimableSnapshots:(x.claimableSnapshots||[]).length,companies:Object.keys(x.companies||{}).length,newEvents:x.run?.newEventsAdmitted});
          NODE

      - name: Commit reporting snapshot
        env:
          FRAXTAL_RPC_URL: ${{ secrets.FRAXTAL_RPC_URL }}
          ETH_RPC_URL: ${{ secrets.ETH_RPC_URL }}
          BASE_RPC_URL: ${{ secrets.BASE_RPC_URL }}
          OPTIMISM_RPC_URL: ${{ secrets.OPTIMISM_RPC_URL }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "The Holding Data Engine"
          git config user.email "data-engine@theholding.ai"

          critical_fingerprint() {
            sha256sum \
              reporting/reporting-engine.mjs \
              reporting/reporting-scheduled-runner.mjs \
              reporting/reporting-engine-validation.mjs \
              reporting/rate-continuity-policy.json \
              reporting/income-ledger.mjs \
              reporting/income-ledger-validation.mjs \
              reporting/income-ledger-policy.json \
              reporting/accounting-coverage.mjs \
              reporting/accounting-coverage-validation.mjs \
              reporting/frax-yield-accounting-evidence.mjs \
              reporting/frax-yield-accounting-evidence-validation.mjs \
              reporting/yield-basis-accounting-evidence.mjs \
              reporting/yield-basis-accounting-evidence-validation.mjs \
              reporting/yield-basis-income-candidates.mjs \
              reporting/yield-basis-income-candidates-validation.mjs \
              reporting/yield-basis-ledger-admission.mjs \
              reporting/yield-basis-ledger-admission-validation.mjs \
              reporting/ve33-accounting-evidence.mjs \
              reporting/ve33-accounting-evidence-validation.mjs \
              reporting/ve33-income-candidates.mjs \
              reporting/ve33-income-candidates-validation.mjs \
              reporting/ve33-ledger-admission.mjs \
              reporting/ve33-ledger-admission-validation.mjs \
              reporting/ve33-locked-managed-accounting-evidence.mjs \
              reporting/ve33-locked-managed-accounting-evidence-validation.mjs \
              reporting/ve33-locked-managed-income-candidates.mjs \
              reporting/ve33-locked-managed-income-candidates-validation.mjs \
              reporting/ve33-locked-managed-ledger-admission-validation.mjs \
              reporting/defitea-income-composition.mjs \
              reporting/defitea-forty-acres-settlement.mjs \
              .github/workflows/update-reporting.yml
          }
          critical_before="$(critical_fingerprint)"

          git add reporting/reporting-data.json reporting/defitea-income-ledger.json reporting/frax-yield-accounting-evidence.json reporting/ve33-accounting-evidence.json reporting/ve33-locked-managed-accounting-evidence.json reporting/income-ledger.json reporting/yield-basis-accounting-evidence.json reporting/accounting-coverage.json
          if git diff --cached --quiet; then
            echo "No reporting data changes."
            exit 0
          fi
          git commit -m "data: update reporting and canonical income ledger"

          for attempt in 1 2 3; do
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "Safe writer guard: rebase conflict; refusing to guess."
              exit 1
            fi

            critical_after="$(critical_fingerprint)"
            if [ "$critical_after" != "$critical_before" ]; then
              echo "Critical Reporting code/policy changed during publish rebase; fail closed and require a fresh canonical run."
              exit 1
            fi

            # Data sources may have moved while main advanced. Rebuild all
            # deterministic reporting products on the rebased canonical inputs
            # so a successful race retry can never publish a stale snapshot.
            node reporting/reporting-scheduled-runner.mjs
            node reporting/defitea-income-composition.mjs
            node reporting/defitea-forty-acres-settlement.mjs
            node reporting/frax-yield-accounting-evidence.mjs
            node reporting/ve33-accounting-evidence.mjs
            node reporting/income-ledger.mjs
            node reporting/ve33-ledger-admission.mjs
            node reporting/reporting-engine-validation.mjs
            node reporting/yield-basis-accounting-evidence.mjs
            node reporting/yield-basis-ledger-admission.mjs
            node reporting/accounting-coverage.mjs
            node reporting/accounting-coverage-validation.mjs
            node reporting/income-ledger-validation.mjs
            node reporting/frax-yield-accounting-evidence-validation.mjs
            node reporting/yield-basis-accounting-evidence-validation.mjs
            node reporting/yield-basis-income-candidates-validation.mjs
            node reporting/yield-basis-ledger-admission-validation.mjs
            node reporting/ve33-accounting-evidence-validation.mjs
            node reporting/ve33-income-candidates-validation.mjs
            node reporting/ve33-ledger-admission-validation.mjs
            node reporting/ve33-locked-managed-accounting-evidence-validation.mjs
            node reporting/ve33-locked-managed-income-candidates-validation.mjs
            node reporting/ve33-locked-managed-ledger-admission-validation.mjs
            node reporting/defitea-income-composition-validation.mjs
            node reporting/defitea-forty-acres-settlement-validation.mjs
            git add reporting/reporting-data.json reporting/defitea-income-ledger.json reporting/frax-yield-accounting-evidence.json reporting/ve33-accounting-evidence.json reporting/ve33-locked-managed-accounting-evidence.json reporting/income-ledger.json reporting/yield-basis-accounting-evidence.json reporting/accounting-coverage.json
            git commit --amend --no-edit

            mapfile -t ahead < <(git diff --name-only origin/main...HEAD)
            for f in "${ahead[@]}"; do
              case "$f" in
                reporting/reporting-data.json|reporting/defitea-income-ledger.json|reporting/frax-yield-accounting-evidence.json|reporting/ve33-accounting-evidence.json|reporting/ve33-locked-managed-accounting-evidence.json|reporting/income-ledger.json|reporting/yield-basis-accounting-evidence.json|reporting/accounting-coverage.json) ;;
                *) echo "Unexpected Reporting publish delta after rebase: $f"; exit 1 ;;
              esac
            done

            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Safe writer guard: main moved during push; rebuilding on the next rebased canonical state ($attempt/3)..."
            sleep $((attempt * 2))
          done
          echo "Safe writer guard: push failed after 3 attempts."
          exit 1