name: Update The Holding Reporting Data

on:
  workflow_dispatch:
  schedule:
    # Lightweight daily capital snapshot.
    # On Sundays this runs 20 minutes after the weekly Productivity workflow.
    - cron: '37 4 * * *'

permissions:
  contents: write

concurrency:
  group: reporting-daily
  cancel-in-progress: false

jobs:
  update-reporting:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Update daily TVL and monthly reporting state
        env:
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
          COMPANY_PAGE_FILE: ./companies/index.html
          PRODUCTIVITY_DATA_FILE: ./companies/productivity-data.json
          REPORTING_DATA_FILE: ./reporting/reporting-data.json
        run: node reporting/reporting-engine.mjs

      - name: Commit reporting snapshot
        run: |
          git config user.name "The Holding Data Engine"
          git config user.email "data-engine@theholding.ai"
          git add reporting/reporting-data.json
          if git diff --cached --quiet; then
            echo "No reporting data changes."
          else
            git commit -m "data: update daily reporting snapshot"
            for attempt in 1 2 3; do
              git fetch origin main
              if ! git rebase origin/main; then
                git rebase --abort || true
                echo "Safe writer guard: rebase conflict; refusing to guess."
                exit 1
              fi
              if git push origin HEAD:main; then
                exit 0
              fi
              echo "Safe writer guard: main moved during push; retrying ($attempt/3)..."
              sleep $((attempt * 2))
            done
            echo "Safe writer guard: push failed after 3 attempts."
            exit 1
          fi
