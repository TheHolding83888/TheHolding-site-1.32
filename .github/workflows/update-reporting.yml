name: Update The Holding Reporting Data

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'reporting/defitea-forty-acres-settlement.mjs'
      - 'reporting/defitea-forty-acres-settlement-validation.mjs'
      - 'reporting/defitea-income-composition.mjs'
      - 'reporting/defitea-income-composition-validation.mjs'
      - '.github/workflows/update-reporting.yml'
  schedule:
    # One daily reporting snapshot for Defitea + Monetra.
    # Runs after the 04:57 UTC Rewards workflow, the 05:37 UTC Stable Capital
    # workflow and the 06:07 UTC shared Market Data heartbeat.
    - cron: '31 6 * * *'

permissions:
  contents: write

concurrency:
  group: reporting-daily
  cancel-in-progress: false

jobs:
  update-reporting:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: Preflight canonical reporting inputs
        shell: bash
        run: |
          set -euo pipefail
          node --check reporting/reporting-engine.mjs
          node --check reporting/reporting-scheduled-runner.mjs
          node --check reporting/reporting-engine-validation.mjs
          node --check reporting/defitea-income-composition.mjs
          node --check reporting/defitea-income-composition-validation.mjs
          node --check reporting/defitea-forty-acres-settlement.mjs
          node --check reporting/defitea-forty-acres-settlement-validation.mjs
          test -s reporting/reporting-scheduler-contract.json
          test -s companies/defitea-canonical-state.json
          test -s companies/productivity-data.json
          test -s companies/rewards-data.json
          test -s intelligence/market-data/market-data.json
          test -s companies/stable-index-data.json
          test -s companies/embedded-yield-ledger.json
          node reporting/reporting-scheduled-runner.mjs --validate-contract
          node reporting/reporting-engine-validation.mjs
          node reporting/defitea-income-composition-validation.mjs
          node reporting/defitea-forty-acres-settlement-validation.mjs
          node - <<'NODE'
          const fs=require('fs');
          const i=JSON.parse(fs.readFileSync('companies/stable-index-data.json','utf8'));
          const c=(i.companies||[]).find(x=>x.registry==='008'||x.name==='Monetra.eth');
          if(!c) throw new Error('Monetra missing from Stable Index');
          if(!(Number(c.productiveStableCapitalUsd)>90)) throw new Error('Monetra Stable Capital implausibly low');
          if(!Number.isFinite(Number(c.displayReferenceApyPct))) throw new Error('Monetra display Reference APY missing');
          const l=JSON.parse(fs.readFileSync('companies/embedded-yield-ledger.json','utf8'));
          if(l.company?.registry!=='008') throw new Error('Monetra Embedded Yield Ledger identity mismatch');
          console.log('Dual-fund reporting canonical preflight OK.');
          NODE

      - name: Update Defitea + Monetra daily reporting state
        env:
          DEFITEA_STATE_FILE: ./companies/defitea-canonical-state.json
          PRODUCTIVITY_DATA_FILE: ./companies/productivity-data.json
          MARKET_DATA_FILE: ./intelligence/market-data/market-data.json
          REWARDS_DATA_FILE: ./companies/rewards-data.json
          STABLE_INDEX_DATA_FILE: ./companies/stable-index-data.json
          EMBEDDED_LEDGER_FILE: ./companies/embedded-yield-ledger.json
          REPORTING_DATA_FILE: ./reporting/reporting-data.json
        run: node reporting/reporting-scheduled-runner.mjs

      - name: Compose Defitea associated income + VoteMarket events
        env:
          PRODUCTIVITY_DATA_FILE: ./companies/productivity-data.json
          REWARDS_DATA_FILE: ./companies/rewards-data.json
          REPORTING_DATA_FILE: ./reporting/reporting-data.json
          DEFITEA_INCOME_LEDGER_FILE: ./reporting/defitea-income-ledger.json
        run: node reporting/defitea-income-composition.mjs

      - name: Settle Defitea 40 Acres Received cash flow
        env:
          REWARDS_DATA_FILE: ./companies/rewards-data.json
          REPORTING_DATA_FILE: ./reporting/reporting-data.json
          DEFITEA_INCOME_LEDGER_FILE: ./reporting/defitea-income-ledger.json
        run: node reporting/defitea-forty-acres-settlement.mjs

      - name: Validate generated reporting data
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs');
          const r=JSON.parse(fs.readFileSync('reporting/reporting-data.json','utf8'));
          const schedule=JSON.parse(fs.readFileSync('reporting/reporting-scheduler-contract.json','utf8'));
          if(r.version!=='1.2.0-defitea-canonical-market-data') throw new Error('unexpected reporting version '+r.version);
          if(r.schedule?.defiteaExternalPriceDiscovery!==false) throw new Error('Reporting external price discovery boundary missing');
          if(r.schedule?.dailySnapshot!==schedule.dailySnapshotUtc||r.schedule?.cron!==schedule.cron||r.schedule?.contractVersion!==schedule.version||r.schedule?.contractSource!=='reporting/reporting-scheduler-contract.json') throw new Error('Reporting scheduler output metadata drift');

          const d=r.funds?.['defitea.eth'];
          if(!d) throw new Error('Defitea reporting missing');
          const s=d.latestSnapshot||{};
          if(d.exactCanonicalProductivePositionCount!==11) throw new Error('Defitea canonical position contract drift');
          if(s.positionCount!==11||s.rateCoveredPositionCount!==11||s.fullProductiveCoverage!==true||s.coverage!==1) throw new Error('Defitea exact 11/11 productive coverage missing');
          if(!s.marketDataGeneratedAt||s.priceAuthority!=='canonical-selected-market-data') throw new Error('Defitea canonical Market Data binding missing');
          if((s.positions||[]).length!==11) throw new Error('Defitea reporting positions != 11');
          if((s.positions||[]).some(x=>x.priceSource!=='canonical-market-data'||!x.selectedLane||!(Number(x.price)>0)||x.engineStatus!=='ok'||!(Number(x.referenceApr)>=0))) throw new Error('Defitea canonical price/APR row coverage invalid');
          if(s.missingPrices?.length||s.fallbackPrices?.length) throw new Error('legacy Reporting fallback arrays must remain empty under canonical Market Data authority');
          if(d.vlCvxReconciliation?.referenceIncomeEngine!=='convex_vlcvx'||d.vlCvxReconciliation?.referenceAprIncludesVotiumIncentives!==true||d.vlCvxReconciliation?.claimableSettlementAddedToReferenceCashFlow!==false) throw new Error('Defitea vlCVX reconciliation boundary invalid');

          const composition=d.incomeComposition;
          if(!composition||composition.version!=='0.1-defitea-associated-income-plus-votemarket-events') throw new Error('Defitea income composition missing');
          if(composition.associatedCompanyTvlIncluded!==false||composition.tvlSemantic!=='defitea-only') throw new Error('Associated-company TVL leaked into Defitea TVL semantics');
          if(JSON.stringify(composition.contributors)!==JSON.stringify(['YieldRing.eth','05081966.eth'])) throw new Error('Defitea income contributor contract drift');
          if(JSON.stringify(composition.voteMarketRoutes)!==JSON.stringify(['votemarket-vecrv','votemarket-vefxn'])) throw new Error('Defitea VoteMarket route contract drift');

          const settlement=d.fortyAcresSettlement;
          if(!settlement||settlement.accounting!=='actual-net-received-replaces-velodrome-reference-model'||settlement.referenceDoubleCountPrevented!==true) throw new Error('40 Acres settlement replacement contract missing');
          if(settlement.claimableAffected!==false||settlement.tvlAffected!==false||settlement.executionAuthority!=='none') throw new Error('40 Acres settlement authority boundary drift');

          const ledger=JSON.parse(fs.readFileSync('reporting/defitea-income-ledger.json','utf8'));
          if(ledger.version!=='0.1-defitea-income-composition') throw new Error('Defitea income ledger version drift');
          if(ledger.accounting?.associatedCompanyTvlIncluded!==false||ledger.accounting?.currentClaimableBalanceSummedDaily!==false) throw new Error('Defitea income ledger accounting boundary invalid');
          if((ledger.contributors||[]).some(x=>x.includedInDefiteaTvl!==false||x.incomeIncludedInDefiteaCashFlow!==true)) throw new Error('Defitea contributor capital boundary invalid');
          const keys=(ledger.voteMarketEvents||[]).map(x=>x.eventKey);
          if(new Set(keys).size!==keys.length) throw new Error('VoteMarket income ledger duplicate event identity');
          if((ledger.voteMarketEvents||[]).some(x=>x.eventDate<d.trackingStartedAt||!(Number(x.usdValue)>0)||x.usdValueFrozenAtFirstAdmission!==true)) throw new Error('VoteMarket event admission boundary invalid');
          const fa=ledger.fortyAcresReceivedEvents||[];
          if(new Set(fa.map(x=>x.eventKey)).size!==fa.length) throw new Error('40 Acres Received ledger duplicate event identity');
          if(fa.some(x=>x.eventDate<'2026-08-01'||!(Number(x.usdValue)>0)||x.accounting!=='actual-net-received'||x.executionAuthority!=='none')) throw new Error('40 Acres Received event admission boundary invalid');

          const auto=Object.values(d.months||{}).filter(x=>x?.mode==='reference-model').sort((a,b)=>String(a.month).localeCompare(String(b.month)));
          if(auto.length){
            const first=auto[0];
            if(first.firstTrackingMonth!==true||first.unobservedPreTrackingDaysBackfilled!==false) throw new Error('Defitea first tracking month provenance missing');
            if(first.partialPeriod===true&&Number(first.normalizationFactor)!==1) throw new Error('Defitea first tracking month must never fabricate pre-tracking days');
            for(const m of auto){
              if(m.associatedCompanyTvlIncluded!==false||m.tvlSemantic!=='defitea-only') throw new Error('Defitea monthly TVL semantic drift '+m.month);
              const expected=Number(m.baseDefiteaReferenceCashFlowUsd||0)-Number(m.fortyAcresReplacedReferenceCashFlowUsd||0)+Number(m.associatedCompanyReferenceCashFlowUsd||0)+Number(m.voteMarketObservedIncomeUsd||0)+Number(m.fortyAcresReceivedIncomeUsd||0);
              if(Math.abs(Number(m.cashFlowUsd)-expected)>0.011) throw new Error('Defitea monthly income composition arithmetic drift '+m.month);
              if(m.fortyAcresReferenceDoubleCountPrevented!==true) throw new Error('40 Acres double-count guard missing '+m.month);
            }
          }

          const m=r.funds?.['Monetra.eth'];
          if(!m) throw new Error('Monetra reporting missing');
          if(!(Number(m.latestSnapshot?.stableCapitalUsd)>90)) throw new Error('Monetra Stable Capital missing');
          if(!Number.isFinite(Number(m.latestSnapshot?.referenceApyPct))) throw new Error('Monetra APY missing');
          if(!Number.isFinite(Number(m.latestSnapshot?.modeledDailyGeneratedIncomeUsd))) throw new Error('Monetra daily generated income missing');
          console.log('Dual-fund reporting + Defitea 40 Acres settlement validation OK.');
          NODE

      - name: Commit reporting snapshot
        run: |
          set -euo pipefail
          git config user.name "The Holding Data Engine"
          git config user.email "data-engine@theholding.ai"
          git add reporting/reporting-data.json reporting/defitea-income-ledger.json
          if git diff --cached --quiet; then
            echo "No reporting data changes."
          else
            git commit -m "data: update Defitea and Monetra reporting snapshot"
            for attempt in 1 2 3; do
              git fetch origin main
              if ! git rebase origin/main; then
                git rebase --abort || true
                echo "Safe writer guard: rebase conflict; refusing to guess."
                exit 1
              fi
              if git push origin HEAD:main; then
                exit 0
              fi
              echo "Safe writer guard: main moved during push; retrying ($attempt/3)..."
              sleep $((attempt * 2))
            done
            echo "Safe writer guard: push failed after 3 attempts."
            exit 1
          fi
