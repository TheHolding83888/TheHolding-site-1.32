name: "Validate General Balance · Per-Asset Market Data Consumer"

on:
  pull_request:
    paths:
      - '.github/workflows/validate-general-balance-market-data-consumer.yml'
      - 'intelligence/capital-state/general-company-balance-sheet.mjs'
      - 'intelligence/capital-state/general-balance-market-data-consumer-contract-validation.mjs'
      - 'intelligence/capital-state/unified-capital-market-data-guard.mjs'
      - 'intelligence/market-data/market-data.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Prove current canonical mixed-lane consumer contract
        run: |
          set -euo pipefail
          node --check intelligence/capital-state/general-company-balance-sheet.mjs
          node --check intelligence/capital-state/general-balance-market-data-consumer-contract-validation.mjs
          node intelligence/capital-state/unified-capital-market-data-guard.mjs
          node intelligence/capital-state/general-balance-market-data-consumer-contract-validation.mjs
          git diff --check
