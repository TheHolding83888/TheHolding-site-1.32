name: Resume Economic Graph After Code Change

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'intelligence/economic-graph/economic-graph.mjs'
      - 'intelligence/economic-graph/economic-graph-canonical-runner.mjs'
      - 'intelligence/economic-graph/aerodrome-veaero-candidate.mjs'
      - '.github/workflows/update-economic-graph.yml'
      - '.github/workflows/resume-economic-graph-after-code-change.yml'

permissions:
  contents: read
  actions: write

concurrency:
  group: economic-graph-code-change-resume
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout canonical main
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: main
          fetch-depth: 0

      - name: Verify Economic Graph engine is present
        run: |
          set -euo pipefail
          test -s intelligence/economic-graph/economic-graph.mjs
          test -s intelligence/economic-graph/economic-graph-canonical-runner.mjs
          test -s intelligence/economic-graph/aerodrome-veaero-candidate.mjs
          test -s intelligence/economic-graph/aerodrome-managed-strategy-pulse.mjs
          test -s .github/workflows/update-aerodrome-managed-pulse.yml
          node --check intelligence/economic-graph/economic-graph.mjs
          node --check intelligence/economic-graph/economic-graph-canonical-runner.mjs
          node --check intelligence/economic-graph/aerodrome-veaero-candidate.mjs
          node --check intelligence/economic-graph/aerodrome-managed-strategy-pulse.mjs

      - name: Dispatch and await canonical Unified Capital writer
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          BEFORE="$(gh run list --workflow unified-capital-refresh.yml --branch main --event workflow_dispatch --limit 1 --json databaseId --jq '.[0].databaseId // 0')"
          gh workflow run unified-capital-refresh.yml --ref main

          RUN_ID=""
          for attempt in $(seq 1 30); do
            CANDIDATE="$(gh run list --workflow unified-capital-refresh.yml --branch main --event workflow_dispatch --limit 1 --json databaseId --jq '.[0].databaseId // 0')"
            if [ "$CANDIDATE" != "0" ] && [ "$CANDIDATE" != "$BEFORE" ]; then
              RUN_ID="$CANDIDATE"
              break
            fi
            sleep 2
          done
          if [ -z "$RUN_ID" ]; then
            echo "ERROR: could not identify newly dispatched Unified Capital run"
            exit 1
          fi
          echo "Watching Unified Capital run $RUN_ID"
          gh run watch "$RUN_ID" --exit-status

      - name: Verify normal workflow_run handoff or request bounded fallback
        id: handoff
        shell: bash
        run: |
          set -euo pipefail
          verify_graph() {
            git fetch origin main >/dev/null 2>&1
            git show origin/main:companies/productivity-data.json > /tmp/productivity.json
            git show origin/main:intelligence/economic-graph/economic-graph.json > /tmp/economic-graph.json
            node - <<'NODE'
          const fs=require('fs');
          const p=JSON.parse(fs.readFileSync('/tmp/productivity.json','utf8'));
          const g=JSON.parse(fs.readFileSync('/tmp/economic-graph.json','utf8'));
          const c=g.candidateCohorts?.['defitea-aerodrome-veaero'];
          if(g.sourceState?.productivity?.generatedAt!==p.generatedAt)process.exit(1);
          if(g.candidateLayer?.version!=='0.1-aerodrome-veaero-shadow-admission')process.exit(1);
          if(g.candidateLayer?.status!=='shadow-admission-active'||Number(g.candidateLayer?.candidateCount)!==1)process.exit(1);
          if(g.candidateLayer?.canonicalCohortCountUnchanged!==true||g.candidateLayer?.promotionAuthority!=='none')process.exit(1);
          if(!c||c.status!=='shadow-measured-not-promoted')process.exit(1);
          if(Number(g.coverage?.cohortCount)!==2)process.exit(1);
          process.exit(0);
          NODE
          }

          for attempt in $(seq 1 18); do
            if verify_graph; then
              echo "Normal Unified → workflow_run → Economic Graph handoff materialized canonical candidate state."
              echo "fallback_needed=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 5
          done

          echo "Normal workflow_run handoff did not materialize the required Graph state in the bounded window."
          echo "fallback_needed=true" >> "$GITHUB_OUTPUT"

      - name: Dispatch canonical Economic Graph fallback
        if: steps.handoff.outputs.fallback_needed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          BEFORE="$(gh run list --workflow update-economic-graph.yml --branch main --event workflow_dispatch --limit 1 --json databaseId --jq '.[0].databaseId // 0')"
          gh workflow run update-economic-graph.yml --ref main

          RUN_ID=""
          for attempt in $(seq 1 30); do
            CANDIDATE="$(gh run list --workflow update-economic-graph.yml --branch main --event workflow_dispatch --limit 1 --json databaseId --jq '.[0].databaseId // 0')"
            if [ "$CANDIDATE" != "0" ] && [ "$CANDIDATE" != "$BEFORE" ]; then
              RUN_ID="$CANDIDATE"
              break
            fi
            sleep 2
          done
          if [ -z "$RUN_ID" ]; then
            echo "ERROR: could not identify newly dispatched Economic Graph fallback run"
            exit 1
          fi
          echo "Watching Economic Graph fallback run $RUN_ID"
          gh run watch "$RUN_ID" --exit-status

      - name: Prove physical Economic Graph state on main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git show origin/main:companies/productivity-data.json > /tmp/productivity.json
          git show origin/main:intelligence/economic-graph/economic-graph.json > /tmp/economic-graph.json
          node - <<'NODE'
          const fs=require('fs');
          const p=JSON.parse(fs.readFileSync('/tmp/productivity.json','utf8'));
          const g=JSON.parse(fs.readFileSync('/tmp/economic-graph.json','utf8'));
          const c=g.candidateCohorts?.['defitea-aerodrome-veaero'];
          const o=c?.latest?.observation;
          if(g.sourceState?.productivity?.generatedAt!==p.generatedAt)throw new Error('Economic Graph not bound to current canonical Productivity snapshot');
          if(g.candidateLayer?.version!=='0.1-aerodrome-veaero-shadow-admission'||g.candidateLayer?.status!=='shadow-admission-active')throw new Error('Aerodrome candidate layer missing');
          if(Number(g.candidateLayer?.candidateCount)!==1||g.candidateLayer?.canonicalCohortCountUnchanged!==true||g.candidateLayer?.promotionAuthority!=='none')throw new Error('Aerodrome admission authority boundary missing');
          if(Number(g.coverage?.cohortCount)!==2)throw new Error('Canonical cohort count changed during shadow admission');
          if(!c||c.status!=='shadow-measured-not-promoted'||!o)throw new Error('Aerodrome shadow cohort not materialized');
          if(Math.abs(Number(o.referenceProductivity?.formula?.parityDeltaPctPoints))>0.01)throw new Error('Aerodrome Reference APR formula parity failed');
          if(!(Number(o.actualManagedVeNft?.positionCount)>=1)||!Number.isFinite(Number(o.actualManagedVeNft?.currentAccruedAero)))throw new Error('Aerodrome actual managed veNFT state missing');
          if(o.epistemic?.primaryDriver!==null||o.epistemic?.promotionAuthority!=='none')throw new Error('Aerodrome causal/promotion authority leaked');
          console.log('ECONOMIC GRAPH RECOVERY PHYSICAL PASS',{
            productivityGeneratedAt:p.generatedAt,
            graphGeneratedAt:g.generatedAt,
            canonicalCohorts:g.coverage.cohortCount,
            candidateCount:g.candidateLayer.candidateCount,
            aerodromeReferenceApr:o.referenceProductivity.canonicalAprPct,
            aerodromeReferenceParity:o.referenceProductivity.formula.parityDeltaPctPoints,
            managedVeNfts:o.actualManagedVeNft.positionCount,
            currentAccruedAero:o.actualManagedVeNft.currentAccruedAero,
            promotionAuthority:o.epistemic.promotionAuthority,
            executionAuthority:g.authority.executionAuthority
          });
          NODE

      - name: Dispatch and await canonical Aerodrome Managed Strategy Pulse
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          BEFORE="$(gh run list --workflow update-aerodrome-managed-pulse.yml --branch main --event workflow_dispatch --limit 1 --json databaseId --jq '.[0].databaseId // 0')"
          gh workflow run update-aerodrome-managed-pulse.yml --ref main

          RUN_ID=""
          for attempt in $(seq 1 30); do
            CANDIDATE="$(gh run list --workflow update-aerodrome-managed-pulse.yml --branch main --event workflow_dispatch --limit 1 --json databaseId --jq '.[0].databaseId // 0')"
            if [ "$CANDIDATE" != "0" ] && [ "$CANDIDATE" != "$BEFORE" ]; then
              RUN_ID="$CANDIDATE"
              break
            fi
            sleep 2
          done
          if [ -z "$RUN_ID" ]; then
            echo "ERROR: could not identify newly dispatched Aerodrome Pulse run"
            exit 1
          fi
          echo "Watching Aerodrome Managed Strategy Pulse run $RUN_ID"
          gh run watch "$RUN_ID" --exit-status

      - name: Prove physical Aerodrome Managed Strategy Pulse on main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git show origin/main:intelligence/economic-graph/aerodrome-managed-pulse.json > /tmp/aerodrome-managed-pulse.json
          node - <<'NODE'
          const fs=require('fs');
          const x=JSON.parse(fs.readFileSync('/tmp/aerodrome-managed-pulse.json','utf8'));
          const o=x.latest;
          if(x.version!=='0.1-aerodrome-managed-strategy-pulse'||x.engineVersion!=='0.1-defitea-managed-venft-same-block-pulse')throw new Error('Pulse version mismatch');
          if(x.status!=='shadow-measured-not-promoted')throw new Error('Pulse shadow status missing');
          if(x.authority?.readOnly!==true||x.authority?.executionAuthority!=='none'||x.authority?.causalClaimAuthority!=='none'||x.authority?.promotionAuthority!=='none')throw new Error('Pulse authority regression');
          if(Number(x.sourceBinding?.canonicalCohortCountAtObservation)!==2||x.sourceBinding?.canonicalCohortCountUnchanged!==true)throw new Error('Pulse changed canonical cohort authority');
          if(!o||o.chain!=='Base'||o.identity?.companyRegistry!=='004'||o.identity?.managedTokenId!=='10298'||o.identity?.depositorTokenId!=='103935')throw new Error('Defitea managed veNFT identity mismatch');
          if(o.provenance?.sameBlockRead!==true||Number(o.provenance?.blockNumber)!==Number(o.blockNumber)||o.provenance?.blockHash!==o.blockHash)throw new Error('Pulse same-block provenance missing');
          if(!Array.isArray(o.pools)||o.pools.length!==Number(o.voting?.votedPoolCount))throw new Error('Managed voted pool set incomplete');
          for(const p of o.pools){
            if(!p.pool||!p.gauge?.address||!p.feeVotingReward?.address||!p.bribeVotingReward?.address)throw new Error('Pool/gauge/reward graph incomplete');
            if(p.epistemic?.voteToRewardDeposit!=='proven-onchain-contract-relationship')throw new Error('Pool accounting relationship class missing');
          }
          if(!Number.isFinite(Number(o.depositorManagedRewards?.lockedAeroAmount))||Number(o.depositorManagedRewards.lockedAeroAmount)<0)throw new Error('Depositor LockedManagedReward state missing');
          if(o.epistemic?.referenceAprConnection!=='not-attributed-by-this-pulse'||o.epistemic?.causalAttribution!=='unresolved-beyond-contract-accounting-identities'||o.epistemic?.primaryDriver!==null||o.epistemic?.promotionAuthority!=='none')throw new Error('Pulse causal boundary weakened');
          console.log('AERODROME PULSE RECOVERY PHYSICAL PASS',{
            generatedAt:x.generatedAt,
            block:o.blockNumber,
            managedTokenId:o.identity.managedTokenId,
            votedPools:o.voting.votedPoolCount,
            usedVotingPowerPct:o.voting.usedVotingPowerPct,
            gaugeWeeklyEmissionAero:o.aggregates.totalGaugeWeeklyEmissionRateAero,
            lockedManagedAero:o.depositorManagedRewards.lockedAeroAmount,
            primaryDriver:o.epistemic.primaryDriver,
            promotionAuthority:o.epistemic.promotionAuthority,
            executionAuthority:x.authority.executionAuthority
          });
          NODE
