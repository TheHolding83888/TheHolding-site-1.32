name: Resume Economic Graph After Code Change
# holding-workflow-definition-proof: intelligence/reliability/frax-graph-memory-recovery-definition-proof.mjs

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'intelligence/economic-graph/*.mjs'
      - 'intelligence/economic-graph/protocol-lifecycle-policy.json'
      - 'intelligence/economic-graph/frax-frxeth-validator-pool-history-rpc.json'
      - 'intelligence/explanatory/*.mjs'
      - '.github/workflows/update-economic-graph.yml'
      - '.github/workflows/update-explanatory-context.yml'
      - '.github/workflows/resume-economic-graph-after-code-change.yml'

permissions:
  contents: read
  actions: write

concurrency:
  group: economic-graph-code-change-resume
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout canonical main
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: main
          fetch-depth: 0

      - name: Verify recovery package
        shell: bash
        run: |
          set -euo pipefail
          REQUIRED=(
            intelligence/economic-graph/economic-graph-canonical-runner.mjs
            intelligence/economic-graph/protocol-lifecycle.mjs
            intelligence/economic-graph/protocol-lifecycle-policy.json
            intelligence/economic-graph/frax-frxeth-validator-pool-history-rpc.json
            intelligence/economic-graph/frax-vefrax-lifecycle.mjs
            intelligence/economic-graph/frax-ecosystem-sensor.mjs
            intelligence/economic-graph/frax-ecosystem-sensor-canary.mjs
            intelligence/economic-graph/frax-sfrxusd-onchain.mjs
            intelligence/economic-graph/frax-sfrxusd-onchain-canary.mjs
            intelligence/economic-graph/frax-sfrxusd-onchain-enrich.mjs
            intelligence/explanatory/explanatory-context.mjs
            intelligence/explanatory/vlcvx-votium-curve-shadow-context.mjs
            intelligence/reliability/cognitive-freshness-guard.mjs
            intelligence/reliability/cognitive-freshness-guard-canary.mjs
            .github/workflows/update-economic-graph.yml
            .github/workflows/update-explanatory-context.yml
            .github/workflows/update-change-intelligence.yml
            .github/workflows/refresh-cognitive-stack.yml
          )
          for f in "${REQUIRED[@]}"; do test -s "$f"; done
          node --check intelligence/economic-graph/economic-graph-canonical-runner.mjs
          node --check intelligence/economic-graph/frax-vefrax-lifecycle.mjs
          node --check intelligence/economic-graph/frax-ecosystem-sensor.mjs
          node intelligence/economic-graph/frax-ecosystem-sensor-canary.mjs
          node --check intelligence/economic-graph/frax-sfrxusd-onchain.mjs
          node --check intelligence/economic-graph/frax-sfrxusd-onchain-enrich.mjs
          node intelligence/economic-graph/frax-sfrxusd-onchain-canary.mjs
          node --check intelligence/explanatory/explanatory-context.mjs
          node --check intelligence/explanatory/vlcvx-votium-curve-shadow-context.mjs
          node --check intelligence/reliability/cognitive-freshness-guard.mjs
          node intelligence/reliability/cognitive-freshness-guard-canary.mjs

      - name: Install ordered-dispatch helper
        shell: bash
        run: |
          cat > /tmp/dispatch-and-await.sh <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          workflow="$1"
          label="$2"
          shift 2
          before_id="$(gh run list --workflow "$workflow" --branch main --event workflow_dispatch --limit 1 --json databaseId --jq '.[0].databaseId // 0')"
          dispatched_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          gh workflow run "$workflow" --ref main "$@"
          run_id=""
          for attempt in $(seq 1 60); do
            run_id="$(gh run list --workflow "$workflow" --branch main --event workflow_dispatch --limit 20 --json databaseId,createdAt --jq "[.[] | select((.databaseId|tostring) != \"${before_id}\" and .createdAt >= \"${dispatched_at}\")] | sort_by(.createdAt) | last | .databaseId // empty")"
            if [ -n "$run_id" ]; then break; fi
            sleep 2
          done
          if [ -z "$run_id" ]; then
            echo "ERROR: could not identify recovery-dispatched ${label} run"
            exit 1
          fi
          echo "Awaiting ${label} run ${run_id}"
          gh run watch "$run_id" --exit-status --interval 5
          echo "${label} run ${run_id} PASS"
          SH
          chmod +x /tmp/dispatch-and-await.sh

      - name: Rebuild canonical Economic Graph first
        env:
          GH_TOKEN: ${{ github.token }}
        run: /tmp/dispatch-and-await.sh update-economic-graph.yml 'Economic Graph'

      - name: Prove physical eight-protocol Graph and Frax ecosystem
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git show origin/main:intelligence/economic-graph/economic-graph.json > /tmp/economic-graph.json
          node - <<'NODE'
          const fs=require('fs');
          const g=JSON.parse(fs.readFileSync('/tmp/economic-graph.json','utf8'));
          const lifecycle=g.protocolLifecycle;
          const protocols=lifecycle?.protocols||{};
          if(lifecycle?.version!=='0.1-protocol-intelligence-lifecycle')throw new Error('Protocol lifecycle unavailable');
          if(Number(lifecycle?.summary?.protocolCount||Object.keys(protocols).length)!==8||Object.keys(protocols).length!==8)throw new Error('Expected eight protocol lifecycle sensors');
          if(lifecycle?.authority?.executionAuthority!=='none'||lifecycle?.authority?.causalClaimAuthority!=='none')throw new Error('Protocol lifecycle authority drift');
          const frax=protocols['registry-frax-vefrax'];
          const sensor=g.protocolSensors?.['registry-frax-vefrax']?.latest?.observation;
          const evidence=g.protocolEvidence?.['registry-frax-ecosystem'];
          const eco=evidence?.latest?.observation;
          if(!frax||!sensor||!eco)throw new Error('Frax lifecycle/deep evidence not physically materialized');
          if(!['shadow','verified','canonical'].includes(frax.maturityStage))throw new Error(`Unexpected Frax lifecycle stage: ${frax.maturityStage}`);
          if(eco.version!=='0.1-frax-deep-ecosystem-sensor-family'||eco.protocolId!=='registry-frax-vefrax')throw new Error('Frax ecosystem identity/version drift');
          if(eco.lifecycleStage!==frax.maturityStage)throw new Error('Frax lifecycle/ecosystem stage mismatch');
          const surfaces=eco.surfaces||{};
          const baseExpected=['governanceVeFrax','fraxtalFloxFxtl','frxUsdSfrxUsd','fraxNet','fraxlend','fraxswapBamm','fxb','fxLiquidity','revenueRouting'];
          for(const key of baseExpected)if(!surfaces[key])throw new Error(`Frax ecosystem base surface missing: ${key}`);
          const actualSurfaceKeys=Object.keys(surfaces);
          const surfaceCount=Number(eco.coverage?.surfaceCount);
          const measured=Number(eco.coverage?.measuredSurfaceCount);
          const unknown=Number(eco.coverage?.sourceBoundUnknownSurfaceCount);
          if(!Number.isInteger(surfaceCount)||surfaceCount<baseExpected.length||surfaceCount!==actualSurfaceKeys.length||!Number.isInteger(measured)||!Number.isInteger(unknown)||measured<1||unknown<0||measured+unknown!==surfaceCount)throw new Error(`Frax ecosystem coverage invariant failed: ${surfaceCount}/${measured}/${unknown}; materialized=${actualSurfaceKeys.length}`);
          const sfrx=surfaces.frxUsdSfrxUsd;
          const measurementState=String(sfrx.measurementState||'');
          const m=sfrx.measured;
          if(eco.measurementExtensions?.sfrxUsdOnchain!=='0.1-sfrxusd-exact-block-erc4626')throw new Error('sfrxUSD measurement extension identity missing');
          if(measurementState.startsWith('MEASURED')){
            if(m?.version!=='0.1-sfrxusd-exact-block-erc4626'||m?.status!=='ok'||m?.measurementClass!=='MEASURED')throw new Error('sfrxUSD MEASURED identity/status drift');
            if(!(Number(m.blockNumber)>0)||!/^0x[0-9a-f]{64}$/i.test(String(m.blockHash||''))||!(Number(m.values?.sharePriceFrxUsd)>0))throw new Error('sfrxUSD exact-block proof/value missing');
            if(m.epistemic?.sourceType!=='onchain-public-rpc-exact-block'||m.epistemic?.currentStateMeasured!==true||m.epistemic?.historicalBackfill!==false||m.epistemic?.unknownIsZero!==false||m.epistemic?.causalClaimAuthority!=='none'||m.epistemic?.executionAuthority!=='none')throw new Error('sfrxUSD MEASURED epistemic boundary drift');
            if(measured<2)throw new Error('Measured sfrxUSD surface not reflected in Frax coverage');
          }else if(measurementState.startsWith('UNKNOWN')){
            if(m?.version!=='0.1-sfrxusd-exact-block-erc4626'||m?.measurementClass!=='UNKNOWN'||m?.epistemic?.currentStateMeasured!==false||m?.epistemic?.historicalBackfill!==false||m?.epistemic?.unknownIsZero!==false||m?.epistemic?.executionAuthority!=='none')throw new Error('sfrxUSD UNKNOWN fail-closed boundary drift');
            if(m?.values?.sharePriceFrxUsd!==null)throw new Error('sfrxUSD UNKNOWN must not fabricate share price');
          }else throw new Error(`Unexpected sfrxUSD measurement state: ${measurementState}`);
          if(eco.authority?.executionAuthority!=='none'||eco.authority?.causalClaimAuthority!=='none')throw new Error('Frax ecosystem authority drift');
          if(!String(eco.epistemic?.revenueToVeFraxAprCausality||'').startsWith('UNKNOWN'))throw new Error('Revenue→veFRAX causality over-promoted');
          if(!String(eco.epistemic?.treasuryYieldToSpecificFxPoolIncentive||'').startsWith('UNKNOWN'))throw new Error('Treasury→FX incentive causality over-promoted');
          console.log('GRAPH + FRAX PHYSICAL PASS',{generatedAt:g.generatedAt,protocolCount:Object.keys(protocols).length,fraxStage:frax.maturityStage,surfaces:surfaceCount,baseSurfaces:baseExpected.length,extensionSurfaces:surfaceCount-baseExpected.length,measured,unknown,sfrxUsd:measurementState});
          NODE

      - name: Rebuild Explanatory only after Graph materialization
        env:
          GH_TOKEN: ${{ github.token }}
        run: /tmp/dispatch-and-await.sh update-explanatory-context.yml 'Explanatory Context'

      - name: Prove exact Graph to Explanatory Frax handoff
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git show origin/main:intelligence/economic-graph/economic-graph.json > /tmp/economic-graph.json
          git show origin/main:intelligence/explanatory/explanatory-context.json > /tmp/explanatory-context.json
          node - <<'NODE'
          const fs=require('fs');
          const crypto=require('crypto');
          const graphBytes=fs.readFileSync('/tmp/economic-graph.json');
          const graphSha=crypto.createHash('sha256').update(graphBytes).digest('hex');
          const g=JSON.parse(graphBytes);
          const x=JSON.parse(fs.readFileSync('/tmp/explanatory-context.json','utf8'));
          if(x.sourceState?.economicGraph?.sha256!==graphSha)throw new Error('Explanatory not bound to exact current Graph bytes');
          if(Number(x.coverage?.protocolLifecycleContextCount)!==8)throw new Error('Explanatory eight-protocol lifecycle context missing');
          if(Number(x.coverage?.deepProtocolEcosystemContextCount)!==1)throw new Error('Explanatory deep ecosystem context missing');
          const graphFrax=g.protocolEvidence?.['registry-frax-ecosystem']?.latest?.observation;
          const frax=x.explanations?.protocolEcosystemContexts?.['registry-frax-ecosystem'];
          if(!graphFrax||!frax||frax.protocolId!=='registry-frax-vefrax')throw new Error('Explanatory Frax ecosystem context unavailable');
          const graphCoverage=graphFrax.coverage||{};
          const explanatoryCoverage=frax.coverage||{};
          const graphSurfaceCount=Number(graphCoverage.surfaceCount);
          const explanatorySurfaceCount=Number(explanatoryCoverage.surfaceCount);
          if(!Number.isInteger(graphSurfaceCount)||graphSurfaceCount<1||explanatorySurfaceCount!==graphSurfaceCount||Number(explanatoryCoverage.measuredSurfaceCount)!==Number(graphCoverage.measuredSurfaceCount)||Number(explanatoryCoverage.sourceBoundUnknownSurfaceCount)!==Number(graphCoverage.sourceBoundUnknownSurfaceCount)||Number(explanatoryCoverage.measuredSurfaceCount)+Number(explanatoryCoverage.sourceBoundUnknownSurfaceCount)!==graphSurfaceCount)throw new Error('Explanatory Frax coverage not inherited from exact Graph');
          if(frax.provenance?.graphSha256!==graphSha)throw new Error('Frax Explanatory provenance not bound to exact Graph');
          if(frax.authority?.executionAuthority!=='none'||frax.authority?.causalClaimAuthority!=='none')throw new Error('Explanatory Frax authority drift');
          console.log('GRAPH → EXPLANATORY PHYSICAL PASS',{graphSha,generatedAt:x.generatedAt,lifecycleContexts:x.coverage.protocolLifecycleContextCount,fraxSurfaces:frax.coverage.surfaceCount,measured:frax.coverage.measuredSurfaceCount,unknown:frax.coverage.sourceBoundUnknownSurfaceCount});
          NODE

      - name: Refresh Observer and System Memory before cognition
        env:
          GH_TOKEN: ${{ github.token }}
        run: /tmp/dispatch-and-await.sh update-change-intelligence.yml 'Change Intelligence Observer'

      - name: Prove dependency-scoped Observer and System Memory contract
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git show origin/main:intelligence/change-intelligence.json > /tmp/change-intelligence.json
          git show origin/main:intelligence/system-memory.json > /tmp/system-memory.json
          CHANGE_INTELLIGENCE_FILE=/tmp/change-intelligence.json \
          SYSTEM_MEMORY_FILE=/tmp/system-memory.json \
          node intelligence/reliability/cognitive-freshness-guard.mjs \
            --scope economic-graph-recovery \
            --max-observer-age-hours 1

      - name: Refresh canonical Cognitive Stack from proven Explanatory and Observer
        env:
          GH_TOKEN: ${{ github.token }}
        run: /tmp/dispatch-and-await.sh refresh-cognitive-stack.yml 'Cognitive Stack' -f freshness_scope=economic-graph-recovery

      - name: Prove Brain consumed Frax deep context
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git show origin/main:intelligence/brain-intelligence.json > /tmp/brain.json
          git show origin/main:intelligence/explanatory/explanatory-context.json > /tmp/explanatory.json
          node - <<'NODE'
          const fs=require('fs');
          const b=JSON.parse(fs.readFileSync('/tmp/brain.json','utf8'));
          const x=JSON.parse(fs.readFileSync('/tmp/explanatory.json','utf8'));
          if(Number(b.currentPosture?.protocolLifecycle?.protocolCount)!==8)throw new Error('Brain eight-protocol lifecycle missing');
          const frax=b.currentPosture?.protocolEcosystems?.contexts?.['registry-frax-ecosystem'];
          const explanatoryFrax=x.explanations?.protocolEcosystemContexts?.['registry-frax-ecosystem'];
          if(!frax||!explanatoryFrax)throw new Error('Brain/Explanatory Frax ecosystem context missing');
          const explanatorySurfaceCount=Number(explanatoryFrax.coverage?.surfaceCount);
          if(!Number.isInteger(explanatorySurfaceCount)||explanatorySurfaceCount<1||Number(frax.surfaceCount)!==explanatorySurfaceCount||Number(frax.measuredSurfaceCount)!==Number(explanatoryFrax.coverage?.measuredSurfaceCount)||Number(frax.sourceBoundUnknownSurfaceCount)!==Number(explanatoryFrax.coverage?.sourceBoundUnknownSurfaceCount)||Number(frax.measuredSurfaceCount)+Number(frax.sourceBoundUnknownSurfaceCount)!==explanatorySurfaceCount)throw new Error('Brain Frax coverage not inherited from Explanatory');
          if(frax.revenueToVeFraxAprCausality!=='UNKNOWN'||frax.treasuryYieldToSpecificFxPoolIncentive!=='UNKNOWN')throw new Error('Brain Frax UNKNOWN guards weakened');
          if(b.constraints?.actionMode!=='proposal-only'||b.constraints?.autonomousCapitalActionAllowed!==false)throw new Error('Brain authority drift');
          console.log('EXPLANATORY + OBSERVER → BRAIN PHYSICAL PASS',{generatedAt:b.generatedAt,protocolCount:b.currentPosture.protocolLifecycle.protocolCount,frax});
          NODE

      - name: Refresh Learning after Cognitive success
        env:
          GH_TOKEN: ${{ github.token }}
        run: /tmp/dispatch-and-await.sh update-learning-loop.yml 'Learning Loop'

      - name: Refresh Proposal Work Queue after Learning success
        env:
          GH_TOKEN: ${{ github.token }}
        run: /tmp/dispatch-and-await.sh update-proposal-work-queue.yml 'Proposal Work Queue'

      - name: Refresh Downstream Continuity after Proposal success
        env:
          GH_TOKEN: ${{ github.token }}
        run: /tmp/dispatch-and-await.sh refresh-downstream-continuity.yml 'Downstream Continuity'

      - name: Refresh Project Memory after downstream success
        env:
          GH_TOKEN: ${{ github.token }}
        run: /tmp/dispatch-and-await.sh update-project-memory-bootstrap.yml 'Project Memory Bootstrap'

      - name: Refresh Intelligence Progress after Project Memory success
        env:
          GH_TOKEN: ${{ github.token }}
        run: /tmp/dispatch-and-await.sh update-intelligence-progress.yml 'Intelligence Progress'

      - name: Prove Project Memory is physically current after recovery
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git show origin/main:intelligence/project-memory/CURRENT.md > /tmp/CURRENT.md
          git show origin/main:intelligence/brain-intelligence.json > /tmp/brain.json
          git show origin/main:intelligence/explanatory/explanatory-context.json > /tmp/explanatory.json
          test -s /tmp/CURRENT.md
          test -s /tmp/brain.json
          test -s /tmp/explanatory.json
          grep -q 'The Holding' /tmp/CURRENT.md
          echo 'GRAPH → EXPLANATORY → SCOPED OBSERVER → BRAIN → LEARNING → DOWNSTREAM → PROJECT MEMORY PHYSICAL PASS'
