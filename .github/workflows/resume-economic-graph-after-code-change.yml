name: Resume Economic Graph After Code Change

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'intelligence/economic-graph/economic-graph.mjs'
      - 'intelligence/economic-graph/economic-graph-canonical-runner.mjs'
      - 'intelligence/economic-graph/aerodrome-veaero-candidate.mjs'
      - 'intelligence/economic-graph/vlcvx-votium-candidate.mjs'
      - 'intelligence/economic-graph/protocol-lifecycle.mjs'
      - 'intelligence/economic-graph/protocol-lifecycle-policy.json'
      - 'intelligence/economic-graph/protocol-lifecycle-canary.mjs'
      - '.github/workflows/update-economic-graph.yml'
      - '.github/workflows/resume-economic-graph-after-code-change.yml'

permissions:
  contents: read
  actions: write

concurrency:
  group: economic-graph-code-change-resume
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout canonical main
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: main
          fetch-depth: 0

      - name: Verify Economic Graph engine is present
        run: |
          set -euo pipefail
          test -s intelligence/economic-graph/economic-graph.mjs
          test -s intelligence/economic-graph/economic-graph-canonical-runner.mjs
          test -s intelligence/economic-graph/aerodrome-veaero-candidate.mjs
          test -s intelligence/economic-graph/vlcvx-votium-candidate.mjs
          test -s intelligence/economic-graph/aerodrome-managed-strategy-pulse.mjs
          test -s intelligence/economic-graph/protocol-lifecycle.mjs
          test -s intelligence/economic-graph/protocol-lifecycle-policy.json
          test -s intelligence/economic-graph/protocol-lifecycle-canary.mjs
          test -s .github/workflows/update-aerodrome-managed-pulse.yml
          node --check intelligence/economic-graph/economic-graph.mjs
          node --check intelligence/economic-graph/economic-graph-canonical-runner.mjs
          node --check intelligence/economic-graph/aerodrome-veaero-candidate.mjs
          node --check intelligence/economic-graph/vlcvx-votium-candidate.mjs
          node --check intelligence/economic-graph/aerodrome-managed-strategy-pulse.mjs
          node --check intelligence/economic-graph/protocol-lifecycle.mjs
          node --check intelligence/economic-graph/protocol-lifecycle-canary.mjs
          node intelligence/economic-graph/protocol-lifecycle-canary.mjs

      - name: Attempt canonical Unified Capital writer
        id: unified
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          BEFORE="$(gh run list --workflow unified-capital-refresh.yml --branch main --event workflow_dispatch --limit 1 --json databaseId --jq '.[0].databaseId // 0')"
          gh workflow run unified-capital-refresh.yml --ref main

          RUN_ID=""
          for attempt in $(seq 1 30); do
            CANDIDATE="$(gh run list --workflow unified-capital-refresh.yml --branch main --event workflow_dispatch --limit 1 --json databaseId --jq '.[0].databaseId // 0')"
            if [ "$CANDIDATE" != "0" ] && [ "$CANDIDATE" != "$BEFORE" ]; then
              RUN_ID="$CANDIDATE"
              break
            fi
            sleep 2
          done
          if [ -z "$RUN_ID" ]; then
            echo "Unified Capital dispatch could not be identified; bounded Graph fallback required."
            echo "success=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Watching Unified Capital run $RUN_ID"
          if gh run watch "$RUN_ID" --exit-status; then
            echo "success=true" >> "$GITHUB_OUTPUT"
          else
            echo "Unified Capital is currently unavailable. Its fail-closed contract remains unchanged; bounded Graph fallback will use the already-canonical Productivity snapshot."
            echo "success=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify normal workflow_run handoff or request bounded fallback
        id: handoff
        shell: bash
        run: |
          set -euo pipefail
          verify_graph() {
            git fetch origin main >/dev/null 2>&1
            git show origin/main:companies/productivity-data.json > /tmp/productivity.json
            git show origin/main:intelligence/economic-graph/economic-graph.json > /tmp/economic-graph.json
            node - <<'NODE'
          const fs=require('fs');
          const p=JSON.parse(fs.readFileSync('/tmp/productivity.json','utf8'));
          const g=JSON.parse(fs.readFileSync('/tmp/economic-graph.json','utf8'));
          const aero=g.candidateCohorts?.['defitea-aerodrome-veaero'];
          const vlcvx=g.candidateCohorts?.['defitea-convex-vlcvx-votium'];
          const lifecycle=g.protocolLifecycle;
          if(g.sourceState?.productivity?.generatedAt!==p.generatedAt)process.exit(1);
          if(g.candidateLayer?.version!=='0.2-multi-candidate-shadow-admission')process.exit(1);
          if(g.candidateLayer?.status!=='shadow-admission-active'||Number(g.candidateLayer?.candidateCount)!==2)process.exit(1);
          if(!g.candidateLayer?.candidateIds?.includes('defitea-aerodrome-veaero')||!g.candidateLayer?.candidateIds?.includes('defitea-convex-vlcvx-votium'))process.exit(1);
          if(g.candidateLayer?.canonicalCohortCountUnchanged!==true||g.candidateLayer?.promotionAuthority!=='none')process.exit(1);
          if(!aero||aero.status!=='shadow-measured-not-promoted'||!vlcvx||vlcvx.status!=='shadow-measured-not-promoted')process.exit(1);
          if(Number(g.coverage?.cohortCount)!==2)process.exit(1);
          if(lifecycle?.version!=='0.1-protocol-intelligence-lifecycle'||lifecycle?.policyVersion!=='0.1-protocol-intelligence-lifecycle-policy')process.exit(1);
          if(lifecycle?.authority?.executionAuthority!=='none'||lifecycle?.authority?.repositoryMutationAuthority!==false||lifecycle?.authority?.workflowDispatchAuthority!==false||lifecycle?.authority?.causalClaimAuthority!=='none')process.exit(1);
          if(lifecycle?.protocols?.['defitea-fxn-vefxn']?.maturityStage!=='canonical'||lifecycle?.protocols?.['defitea-curve-vecrv']?.maturityStage!=='canonical')process.exit(1);
          if(!['verified','canonical'].includes(lifecycle?.protocols?.['defitea-aerodrome-veaero']?.maturityStage))process.exit(1);
          if(!['verified','canonical'].includes(lifecycle?.protocols?.['defitea-convex-vlcvx-votium']?.maturityStage))process.exit(1);
          process.exit(0);
          NODE
          }

          if [ "${{ steps.unified.outputs.success }}" != "true" ]; then
            echo "Unified Capital did not complete; requesting bounded Economic Graph fallback."
            echo "fallback_needed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          for attempt in $(seq 1 18); do
            if verify_graph; then
              echo "Normal Unified → workflow_run → Economic Graph handoff materialized multi-candidate + lifecycle state."
              echo "fallback_needed=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 5
          done

          echo "Normal workflow_run handoff did not materialize the required Graph + lifecycle state in the bounded window."
          echo "fallback_needed=true" >> "$GITHUB_OUTPUT"

      - name: Dispatch canonical Economic Graph fallback
        if: steps.handoff.outputs.fallback_needed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          BEFORE="$(gh run list --workflow update-economic-graph.yml --branch main --event workflow_dispatch --limit 1 --json databaseId --jq '.[0].databaseId // 0')"
          gh workflow run update-economic-graph.yml --ref main

          RUN_ID=""
          for attempt in $(seq 1 30); do
            CANDIDATE="$(gh run list --workflow update-economic-graph.yml --branch main --event workflow_dispatch --limit 1 --json databaseId --jq '.[0].databaseId // 0')"
            if [ "$CANDIDATE" != "0" ] && [ "$CANDIDATE" != "$BEFORE" ]; then
              RUN_ID="$CANDIDATE"
              break
            fi
            sleep 2
          done
          if [ -z "$RUN_ID" ]; then
            echo "ERROR: could not identify newly dispatched Economic Graph fallback run"
            exit 1
          fi
          echo "Watching Economic Graph fallback run $RUN_ID"
          gh run watch "$RUN_ID" --exit-status

      - name: Prove physical Economic Graph state on main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git show origin/main:companies/productivity-data.json > /tmp/productivity.json
          git show origin/main:intelligence/economic-graph/economic-graph.json > /tmp/economic-graph.json
          node - <<'NODE'
          const fs=require('fs');
          const p=JSON.parse(fs.readFileSync('/tmp/productivity.json','utf8'));
          const g=JSON.parse(fs.readFileSync('/tmp/economic-graph.json','utf8'));
          const aero=g.candidateCohorts?.['defitea-aerodrome-veaero'];
          const ao=aero?.latest?.observation;
          const vlcvx=g.candidateCohorts?.['defitea-convex-vlcvx-votium'];
          const vo=vlcvx?.latest?.observation;
          const lifecycle=g.protocolLifecycle;
          if(g.sourceState?.productivity?.generatedAt!==p.generatedAt)throw new Error('Economic Graph not bound to current canonical Productivity snapshot');
          if(g.candidateLayer?.version!=='0.2-multi-candidate-shadow-admission'||g.candidateLayer?.status!=='shadow-admission-active')throw new Error('Multi-candidate shadow layer missing');
          if(Number(g.candidateLayer?.candidateCount)!==2||!g.candidateLayer?.candidateIds?.includes('defitea-aerodrome-veaero')||!g.candidateLayer?.candidateIds?.includes('defitea-convex-vlcvx-votium'))throw new Error('Multi-candidate registry mismatch');
          if(g.candidateLayer?.canonicalCohortCountUnchanged!==true||g.candidateLayer?.promotionAuthority!=='none')throw new Error('Shadow admission authority boundary missing');
          if(Number(g.coverage?.cohortCount)!==2)throw new Error('Canonical cohort count changed during shadow admission');
          if(!aero||aero.status!=='shadow-measured-not-promoted'||!ao)throw new Error('Aerodrome shadow cohort not materialized');
          if(Math.abs(Number(ao.referenceProductivity?.formula?.parityDeltaPctPoints))>0.01)throw new Error('Aerodrome Reference APR formula parity failed');
          if(!(Number(ao.actualManagedVeNft?.positionCount)>=1)||!Number.isFinite(Number(ao.actualManagedVeNft?.currentAccruedAero)))throw new Error('Aerodrome actual managed veNFT state missing');
          if(ao.epistemic?.primaryDriver!==null||ao.epistemic?.promotionAuthority!=='none')throw new Error('Aerodrome causal/promotion authority leaked');
          if(!vlcvx||vlcvx.status!=='shadow-measured-not-promoted'||!vo)throw new Error('vlCVX/Votium shadow cohort not materialized');
          if(vo.companyRoute?.routeId!=='votium-union'||vo.companyRoute?.delegate?.identity!=='votium'||vo.companyRoute?.forwarding?.identity!=='union'||vo.companyRoute?.forwarding?.effective!==true)throw new Error('vlCVX Votium→Union route missing');
          if(Math.abs(Number(vo.referenceProductivity?.components?.parityDeltaPctPoints))>0.0001)throw new Error('vlCVX Reference APR decomposition parity failed');
          if(vo.referenceProductivity?.semanticBoundary!=='Reference APR only; not realised company income.')throw new Error('vlCVX Reference-vs-realised boundary missing');
          if(vo.epistemic?.primaryDriver!==null||vo.epistemic?.recommendationAuthority!=='none'||vo.epistemic?.predictionAuthority!=='none'||vo.epistemic?.promotionAuthority!=='none')throw new Error('vlCVX authority leaked');
          if(lifecycle?.version!=='0.1-protocol-intelligence-lifecycle'||lifecycle?.policyVersion!=='0.1-protocol-intelligence-lifecycle-policy')throw new Error('Protocol lifecycle not physically materialized');
          if(lifecycle?.authority?.executionAuthority!=='none'||lifecycle?.authority?.repositoryMutationAuthority!==false||lifecycle?.authority?.workflowDispatchAuthority!==false||lifecycle?.authority?.causalClaimAuthority!=='none')throw new Error('Protocol lifecycle authority expansion');
          const fxStage=lifecycle?.protocols?.['defitea-fxn-vefxn']?.maturityStage;
          const curveStage=lifecycle?.protocols?.['defitea-curve-vecrv']?.maturityStage;
          const aeroStage=lifecycle?.protocols?.['defitea-aerodrome-veaero']?.maturityStage;
          const vlcvxStage=lifecycle?.protocols?.['defitea-convex-vlcvx-votium']?.maturityStage;
          if(fxStage!=='canonical'||curveStage!=='canonical')throw new Error(`Canonical lifecycle regression: f(x)=${fxStage}, Curve=${curveStage}`);
          if(!['verified','canonical'].includes(aeroStage))throw new Error(`Aerodrome lifecycle below verified: ${aeroStage}`);
          if(!['verified','canonical'].includes(vlcvxStage))throw new Error(`vlCVX/Votium lifecycle below verified: ${vlcvxStage}`);
          console.log('ECONOMIC GRAPH RECOVERY PHYSICAL PASS',{
            productivityGeneratedAt:p.generatedAt,
            graphGeneratedAt:g.generatedAt,
            canonicalCohorts:g.coverage.cohortCount,
            candidateCount:g.candidateLayer.candidateCount,
            lifecycle:{fxn:fxStage,curve:curveStage,aerodrome:aeroStage,vlcvx:vlcvxStage,transitions:lifecycle.transitions?.length||0},
            aerodromeReferenceApr:ao.referenceProductivity.canonicalAprPct,
            vlCvxReferenceApr:vo.referenceProductivity.canonicalAprPct,
            vlCvxVotiumApr:vo.referenceProductivity.components.votiumLastCompletedRoundAprPct,
            vlCvxRoute:vo.companyRoute.routeId,
            promotionAuthority:g.candidateLayer.promotionAuthority,
            executionAuthority:g.authority.executionAuthority
          });
          NODE

      - name: Dispatch and await canonical Aerodrome Managed Strategy Pulse
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          BEFORE="$(gh run list --workflow update-aerodrome-managed-pulse.yml --branch main --event workflow_dispatch --limit 1 --json databaseId --jq '.[0].databaseId // 0')"
          gh workflow run update-aerodrome-managed-pulse.yml --ref main

          RUN_ID=""
          for attempt in $(seq 1 30); do
            CANDIDATE="$(gh run list --workflow update-aerodrome-managed-pulse.yml --branch main --event workflow_dispatch --limit 1 --json databaseId --jq '.[0].databaseId // 0')"
            if [ "$CANDIDATE" != "0" ] && [ "$CANDIDATE" != "$BEFORE" ]; then
              RUN_ID="$CANDIDATE"
              break
            fi
            sleep 2
          done
          if [ -z "$RUN_ID" ]; then
            echo "ERROR: could not identify newly dispatched Aerodrome Pulse run"
            exit 1
          fi
          echo "Watching Aerodrome Managed Strategy Pulse run $RUN_ID"
          gh run watch "$RUN_ID" --exit-status

      - name: Prove physical Aerodrome Managed Strategy Pulse on main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git show origin/main:intelligence/economic-graph/aerodrome-managed-pulse.json > /tmp/aerodrome-managed-pulse.json
          node - <<'NODE'
          const fs=require('fs');
          const x=JSON.parse(fs.readFileSync('/tmp/aerodrome-managed-pulse.json','utf8'));
          const o=x.latest;
          if(x.version!=='0.1-aerodrome-managed-strategy-pulse'||x.engineVersion!=='0.1-defitea-managed-venft-same-block-pulse')throw new Error('Pulse version mismatch');
          if(x.status!=='shadow-measured-not-promoted')throw new Error('Pulse shadow status missing');
          if(x.authority?.readOnly!==true||x.authority?.executionAuthority!=='none'||x.authority?.causalClaimAuthority!=='none'||x.authority?.promotionAuthority!=='none')throw new Error('Pulse authority regression');
          if(Number(x.sourceBinding?.canonicalCohortCountAtObservation)!==2||x.sourceBinding?.canonicalCohortCountUnchanged!==true)throw new Error('Pulse changed canonical cohort authority');
          if(!o||o.chain!=='Base'||o.identity?.companyRegistry!=='004'||o.identity?.managedTokenId!=='10298'||o.identity?.depositorTokenId!=='103935')throw new Error('Defitea managed veNFT identity mismatch');
          if(o.provenance?.sameBlockRead!==true||Number(o.provenance?.blockNumber)!==Number(o.blockNumber)||o.provenance?.blockHash!==o.blockHash)throw new Error('Pulse same-block provenance missing');
          if(!Array.isArray(o.pools)||o.pools.length!==Number(o.voting?.votedPoolCount))throw new Error('Managed voted pool set incomplete');
          for(const p of o.pools){
            if(!p.pool||!p.gauge?.address||!p.feeVotingReward?.address||!p.bribeVotingReward?.address)throw new Error('Pool/gauge/reward graph incomplete');
            if(p.epistemic?.voteToRewardDeposit!=='proven-onchain-contract-relationship')throw new Error('Pool accounting relationship class missing');
          }
          if(!Number.isFinite(Number(o.depositorManagedRewards?.lockedAeroAmount))||Number(o.depositorManagedRewards.lockedAeroAmount)<0)throw new Error('Depositor LockedManagedReward state missing');
          if(o.epistemic?.referenceAprConnection!=='not-attributed-by-this-pulse'||o.epistemic?.causalAttribution!=='unresolved-beyond-contract-accounting-identities'||o.epistemic?.primaryDriver!==null||o.epistemic?.promotionAuthority!=='none')throw new Error('Pulse causal boundary weakened');
          console.log('AERODROME PULSE RECOVERY PHYSICAL PASS',{
            generatedAt:x.generatedAt,
            block:o.blockNumber,
            managedTokenId:o.identity.managedTokenId,
            votedPools:o.voting.votedPoolCount,
            usedVotingPowerPct:o.voting.usedVotingPowerPct,
            gaugeWeeklyEmissionAero:o.aggregates.totalGaugeWeeklyEmissionRateAero,
            lockedManagedAero:o.depositorManagedRewards.lockedAeroAmount,
            primaryDriver:o.epistemic.primaryDriver,
            promotionAuthority:o.epistemic.promotionAuthority,
            executionAuthority:x.authority.executionAuthority
          });
          NODE